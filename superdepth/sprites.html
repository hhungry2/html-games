<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super Depth スプライト一覧</title>
<style>
  :root {
    --bg: #0b1020;
    --panel: #141b30;
    --panel2: #1b2440;
    --line: #2a3557;
    --ink: #dbe4ff;
    --dim: #8e9ac2;
    --accent: #00c8e8;
    --used: #3ddc84;
    --unused: #6b7699;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Segoe UI", "Hiragino Kaku Gothic ProN", "Noto Sans JP", system-ui, sans-serif;
    line-height: 1.7;
  }
  header {
    padding: 28px 24px 20px;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, #101830, var(--bg));
  }
  header h1 { margin: 0 0 6px; font-size: 26px; letter-spacing: .04em; }
  header p { margin: 0; color: var(--dim); font-size: 14px; max-width: 78ch; }

  .toolbar {
    position: sticky; top: 0; z-index: 5;
    display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
    padding: 12px 24px;
    background: rgba(11,16,32,.94);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--line);
  }
  .toolbar input[type=search] {
    flex: 1 1 220px; min-width: 160px;
    padding: 8px 12px;
    background: var(--panel); color: var(--ink);
    border: 1px solid var(--line); border-radius: 6px;
    font: inherit; font-size: 14px;
  }
  .toolbar label { font-size: 13px; color: var(--dim); display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .count { font-size: 13px; color: var(--dim); margin-left: auto; }

  main { padding: 8px 24px 64px; }
  section { margin: 34px 0 0; }
  section > h2 {
    margin: 0 0 4px; font-size: 18px;
    padding-bottom: 6px; border-bottom: 2px solid var(--accent);
    display: inline-block;
  }
  section > p.note { margin: 6px 0 16px; color: var(--dim); font-size: 14px; max-width: 84ch; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(228px, 1fr));
    gap: 14px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
    display: flex; flex-direction: column;
  }
  .card.off { opacity: .55; }
  .stage {
    height: 132px;
    display: flex; align-items: center; justify-content: center;
    background:
      linear-gradient(45deg, #1a2138 25%, transparent 25%, transparent 75%, #1a2138 75%),
      linear-gradient(45deg, #1a2138 25%, #131a2c 25%, #131a2c 75%, #1a2138 75%);
    background-size: 16px 16px;
    background-position: 0 0, 8px 8px;
  }
  .stage canvas { image-rendering: pixelated; }
  .body { padding: 10px 12px 12px; border-top: 1px solid var(--line); }
  .name { font-weight: 600; font-size: 14px; word-break: break-all; }
  .meta { font-size: 11.5px; color: var(--dim); font-family: ui-monospace, Consolas, monospace; margin: 2px 0 6px; }
  .desc { font-size: 13px; color: #c3cdeb; }
  .tag {
    display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px;
    vertical-align: 2px; margin-left: 6px; font-weight: 600;
  }
  .tag.y { background: rgba(61,220,132,.16); color: var(--used); }
  .tag.n { background: rgba(107,118,153,.18); color: var(--unused); }
  #status { padding: 40px 24px; color: var(--dim); }
</style>
</head>
<body>

<header>
  <h1>Super Depth スプライト一覧</h1>
  <p>
    <code>SuperDepth.swf</code> から取り出した 114 スプライトを、移植版と同じ手順
    （グレースケールのマスク → パレット変換 → アニメフレームの合成）で焼き直して並べたものです。
    絵はゲーム本体と同じ速度でアニメーションします。
    「使用」バッジは、この移植版のコードが実際に描画しているかどうかを示します。
  </p>
</header>

<div class="toolbar">
  <input type="search" id="q" placeholder="名前・説明で絞り込み（例: 潜水艦, ボス, Waku）">
  <label><input type="checkbox" id="onlyUsed"> 使用中のみ表示</label>
  <span class="count" id="count"></span>
</div>

<div id="status">グラフィックを展開しています…</div>
<main id="sheet" hidden></main>

<script src="js/assets.js"></script>

// ---------------------------------------------------------------- 描画
const canvases = [];   // {el, ctx, id, scale}

function makeCard(id) {
  const name = SD.SPRITE_NAMES[id];
  const conv = SD.CONV[id];
  const size = SD.Gfx.sizeOf(id);
  const used = USED.has(id);
  const frames = id >= SD.S.Logo ? 1 : conv[3];
  const sheet = id >= SD.S.Logo ? 'PNG' : SD.SHEETS[conv[0] & 3];

  const card = document.createElement('div');
  card.className = 'card' + (used ? '' : ' off');
  card.dataset.hay = (name + ' ' + (DESC[name] || '')).toLowerCase();
  card.dataset.used = used ? '1' : '0';

  const stage = document.createElement('div');
  stage.className = 'stage';
  const cv = document.createElement('canvas');
  cv.width = size.w; cv.height = size.h;
  const scale = Math.max(1, Math.min(4, Math.floor(Math.min(196 / size.w, 116 / size.h))));
  cv.style.width = size.w * scale + 'px';
  cv.style.height = size.h * scale + 'px';
  stage.appendChild(cv);
  canvases.push({ ctx: cv.getContext('2d'), id: id, w: size.w, h: size.h });

  const body = document.createElement('div');
  body.className = 'body';
  body.innerHTML =
    '<div class="name">' + name +
      '<span class="tag ' + (used ? 'y">使用' : 'n">未使用') + '</span></div>' +
    '<div class="meta">#' + id + ' &middot; ' + size.w + '&times;' + size.h +
      ' &middot; ' + sheet + ' &middot; ' + frames + ' frame' + (frames > 1 ? 's' : '') + '</div>' +
    '<div class="desc">' + (DESC[name] || '') + '</div>';

  card.appendChild(stage);
  card.appendChild(body);
  return card;
}

function build() {

  for (const g of GROUPS) {

    const h = document.createElement('h2'); h.textContent = g.title; sec.appendChild(h);
    if (g.note) { const p = document.createElement('p'); p.className = 'note'; p.textContent = g.note; sec.appendChild(p); }
    const grid = document.createElement('div'); grid.className = 'grid';
    for (const id of g.ids) { seen.add(id); grid.appendChild(makeCard(id)); }
    sec.appendChild(grid);
    sheet.appendChild(sec);
  }
  // 章に入れ忘れたものがあれば最後にまとめて出す
  const rest = [];
  for (let id = 0; id < SD.CONV.length; id++) if (!seen.has(id)) rest.push(id);
  if (rest.length) {
    const sec = document.createElement('section');
    sec.innerHTML = '<h2>その他</h2>';
    const grid = document.createElement('div'); grid.className = 'grid';
    for (const id of rest) grid.appendChild(makeCard(id));
    sec.appendChild(grid);
    sheet.appendChild(sec);
  }
}

// ゲーム本体と同じ 30fps でフレームを送る
let anim = 0, acc = 0, last = 0;
function loop(t) {
  if (!last) last = t;
  acc += t - last; last = t;
  if (acc >= 1000 / 30) {
    acc = 0;
    anim++;
    for (const c of canvases) {
      const img = SD.Gfx.frameOf(c.id, anim);
      c.ctx.clearRect(0, 0, c.w, c.h);
      if (img) c.ctx.drawImage(img, 0, 0);
    }
  }
  requestAnimationFrame(loop);
}

function applyFilter() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  const onlyUsed = document.getElementById('onlyUsed').checked;
  let shown = 0;
  for (const card of document.querySelectorAll('.card')) {
    const ok = (!q || card.dataset.hay.includes(q)) && (!onlyUsed || card.dataset.used === '1');
    card.hidden = !ok;
    if (ok) shown++;
  }
  for (const sec of document.querySelectorAll('section')) {
    sec.hidden = !sec.querySelector('.card:not([hidden])');
  }
  document.getElementById('count').textContent = shown + ' / ' + canvases.length + ' スプライト';
}

(async function () {
  await SD.Gfx.load();
  build();
  document.getElementById('status').remove();
  document.getElementById('sheet').hidden = false;
  document.getElementById('q').addEventListener('input', applyFilter);
  document.getElementById('onlyUsed').addEventListener('change', applyFilter);
  applyFilter();
  requestAnimationFrame(loop);
})();
</script>

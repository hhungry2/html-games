<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Super Depth - HTML5 Port</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="game">
  <div id="screen-wrap">
    <canvas id="screen" width="640" height="400"></canvas>
    <div id="status">LOADING...</div>
  </div>

  <div id="pad">
    <div class="pad-side">
      <button class="key" data-btn="left">&#9664;</button>
      <div class="pad-col">
        <button class="key" data-btn="up">&#9650;</button>
        <button class="key" data-btn="down">&#9660;</button>
      </div>
      <button class="key" data-btn="right">&#9654;</button>
    </div>
    <div class="pad-side">
      <button class="key wide" data-btn="pause">P</button>
      <button class="key fire" data-btn="b">FORE</button>
      <button class="key fire" data-btn="a">AFT</button>
    </div>
  </div>

  <p class="hint">
    &#8592;&#8594; move &nbsp;/&nbsp; <b>Z</b> drop from stern &nbsp;/&nbsp; <b>X</b> drop from bow &nbsp;/&nbsp;
    <b>P</b> pause &nbsp;/&nbsp; <b>Q</b> quit to title
  </p>
  <p class="hint"><a href="sprites.html">スプライト一覧</a></p>
</div>

<script src="js/data.js"></script>
<script src="js/assets.js"></script>
<script src="js/gfx.js"></script>
<script src="js/audio.js"></script>
<script src="js/input.js"></script>
<script src="js/game.js"></script>
<script src="js/stages.js"></script>
<script src="js/scenes.js"></script>
<script src="js/main.js"></script>
</body>
</html>

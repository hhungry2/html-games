<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0716;
  --panel:rgba(26,16,44,.74);
  --line:rgba(255,170,215,.22);
  --txt:#fdeaf5;
  --dim:#b490c4;
  --acc:#ff8fc0;
  --acc2:#ffd23d;
  --blu:#7fd7ff;
  --red:#ff5d78;
}
html,body{height:100%}
body{
  background:
    radial-gradient(1000px 700px at 14% -12%, #3a1f5c 0%, transparent 58%),
    radial-gradient(900px 640px at 108% 112%, #5c1f45 0%, transparent 55%),
    var(--bg);
  color:var(--txt);
  font-family:ui-rounded,"Hiragino Maru Gothic ProN","Yu Gothic UI",system-ui,sans-serif;
  display:flex;overflow:hidden;
  touch-action:none;-webkit-tap-highlight-color:transparent;user-select:none;
}
#wrap{margin:auto;position:relative;width:min(100vw,calc(100vh * 16 / 9));aspect-ratio:16/9}
canvas{display:block;width:100%;height:100%;
  border-radius:10px;box-shadow:0 18px 60px rgba(0,0,0,.62),0 0 0 1px var(--line)}

.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:13px;text-align:center;padding:4%;
  background:linear-gradient(180deg,rgba(10,7,22,.86),rgba(10,7,22,.94));
  border-radius:10px;backdrop-filter:blur(3px);z-index:5}
.ov.hide{display:none}
.ov h1{font-size:clamp(22px,4.8vw,54px);letter-spacing:.08em;
  background:linear-gradient(180deg,#fff,var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 6px 24px rgba(255,143,192,.28)}
.ov h2{font-size:clamp(16px,3vw,32px);color:var(--acc2)}
.ov h3{font-size:clamp(13px,2.1vw,22px);color:var(--blu);font-weight:700}
.ov p{font-size:clamp(11px,1.5vw,16px);color:var(--dim);line-height:1.9}
.ov b{color:var(--txt)}
.ov em{color:var(--acc2);font-style:normal;font-weight:700}
.keys{display:flex;flex-wrap:wrap;gap:6px 10px;justify-content:center;font-size:clamp(10px,1.35vw,14px);color:var(--dim)}
.keys span{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:7px;padding:4px 9px}
.keys i{color:var(--acc);font-style:normal;font-weight:700}
.btn{margin-top:4px;padding:11px 30px;font:inherit;font-size:clamp(13px,1.8vw,19px);font-weight:700;
  color:#2a0a1c;background:linear-gradient(180deg,#ffd0e6,var(--acc));border:0;border-radius:999px;cursor:pointer;
  box-shadow:0 8px 22px rgba(255,143,192,.32);letter-spacing:.05em}
.btn:active{transform:translateY(2px)}
.btn.sub{background:linear-gradient(180deg,#cfe9ff,var(--blu));box-shadow:0 8px 22px rgba(127,215,255,.28)}
.tiny{font-size:clamp(9px,1.2vw,12px);color:#8f74a6}
.sel{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:92%}
.sel button{font:inherit;font-size:clamp(10px,1.4vw,14px);font-weight:700;padding:8px 14px;border-radius:10px;
  cursor:pointer;color:var(--txt);background:rgba(255,255,255,.07);border:1px solid var(--line)}
.sel button:active{transform:translateY(1px)}
.sel button.lock{opacity:.38;color:var(--dim)}

#mute{position:absolute;right:8px;top:8px;z-index:6;background:rgba(20,12,36,.72);border:1px solid var(--line);
  color:var(--dim);border-radius:8px;padding:5px 9px;font:inherit;font-size:12px;cursor:pointer}

#pad{position:absolute;inset:0;z-index:3;display:none;pointer-events:none}
#pad.on{display:block}
.pb{position:absolute;pointer-events:auto;border-radius:50%;background:rgba(255,255,255,.10);
  border:1px solid rgba(255,255,255,.24);color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:clamp(9px,2.3vh,15px);font-weight:700;backdrop-filter:blur(2px)}
.pb:active{background:rgba(255,255,255,.28)}
#pL{left:2%;bottom:15%;width:12.5%;height:22%}
#pR{left:16.5%;bottom:15%;width:12.5%;height:22%}
#pD{left:9.2%;bottom:2%;width:12.5%;height:13%}
#pJ{right:2.5%;bottom:18%;width:15%;height:27%}
#pB{right:18%;bottom:4%;width:15%;height:27%;background:rgba(255,143,192,.20)}

#rot{position:fixed;inset:0;z-index:60;display:none;flex-direction:column;gap:14px;
  align-items:center;justify-content:center;background:#0a0716;color:var(--txt);text-align:center;
  padding:10%;font-size:17px;line-height:2}

@media (orientation:portrait) and (pointer:coarse){ #rot{display:flex} }

function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function ell(c,x,y,rx,ry){c.beginPath();c.ellipse(x,y,rx,ry,0,0,7);c.closePath();}
function star(c,x,y,r,rot,n){n=n||5;c.beginPath();
  for(let i=0;i<n*2;i++){const a=(rot||0)+i*Math.PI/n-Math.PI/2, r2=(i%2)?r*.44:r;
    c[i?'lineTo':'moveTo'](x+Math.cos(a)*r2,y+Math.sin(a)*r2);}
  c.closePath();}

let AC=null, muted=false, master=null, bgmTimer=null, bgmStep=0, bgmSong=null;
function actx(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain();master.gain.value=.26;master.connect(AC.destination);}catch(e){} } return AC; }
function beep(f,d,type,vol,slide){
  if(muted)return; const a=actx(); if(!a)return;
  const o=a.createOscillator(), g=a.createGain();
  o.type=type||'square'; o.frequency.setValueAtTime(f,a.currentTime);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(35,slide),a.currentTime+d);
  g.gain.setValueAtTime(0,a.currentTime);
  g.gain.linearRampToValueAtTime(vol==null?.4:vol,a.currentTime+.012);
  g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);
  o.connect(g);g.connect(master);o.start();o.stop(a.currentTime+d+.02);
}
function noise(d,vol,hz,q){
  if(muted)return; const a=actx(); if(!a)return;
  const len=Math.max(1,Math.floor(a.sampleRate*d)), b=a.createBuffer(1,len,a.sampleRate), ch=b.getChannelData(0);
  for(let i=0;i<len;i++)ch[i]=(Math.random()*2-1)*(1-i/len);
  const s=a.createBufferSource();s.buffer=b;
  const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=hz||900;f.Q.value=q||1;
  const g=a.createGain();g.gain.value=vol==null?.3:vol;
  s.connect(f);f.connect(g);g.connect(master);s.start();
}

const mid=n=>440*Math.pow(2,(n-69)/12);
function bgmPlay(name){
  if(bgmSong===name&&bgmTimer)return;
  bgmStop(); bgmSong=name; const S=SONGS[name]; if(!S)return;
  bgmStep=0;
  const iv=30000/S.bpm;
  bgmTimer=setInterval(()=>{
    if(muted)return; const a=actx(); if(!a)return;
    const i=bgmStep%S.lead.length, n=S.lead[i], b=S.bass[i%S.bass.length];
    if(n){const o=a.createOscillator(),g=a.createGain();o.type='square';o.frequency.value=mid(n);
      g.gain.setValueAtTime(.0001,a.currentTime);g.gain.linearRampToValueAtTime(.075,a.currentTime+.01);
      g.gain.exponentialRampToValueAtTime(.0008,a.currentTime+iv/1000*1.5);
      o.connect(g);g.connect(master);o.start();o.stop(a.currentTime+iv/1000*1.6);}
    if(b){const o=a.createOscillator(),g=a.createGain();o.type='triangle';o.frequency.value=mid(b);
      g.gain.setValueAtTime(.0001,a.currentTime);g.gain.linearRampToValueAtTime(.10,a.currentTime+.01);
      g.gain.exponentialRampToValueAtTime(.0008,a.currentTime+iv/1000*1.2);
      o.connect(g);g.connect(master);o.start();o.stop(a.currentTime+iv/1000*1.3);}
    if(i%4===0)noise(.04,.045,4200,2);
    bgmStep++;
  },iv);
}
function bgmStop(){ if(bgmTimer)clearInterval(bgmTimer); bgmTimer=null; bgmSong=null; }

  ArrowDown:'d',KeyS:'d',KeyZ:'j',Space:'j',KeyX:'b',KeyK:'b',KeyJ:'j',
  Enter:'e',Escape:'p',KeyP:'p'};
addEventListener('keydown',e=>{
  const k=MAP[e.code];
  if(k){ if(!key[k]){edge[k]=1; if(k==='l'||k==='r')dashTap(k);} key[k]=1; e.preventDefault(); }
  actx();
});
addEventListener('keyup',e=>{const k=MAP[e.code];if(k){key[k]=0;e.preventDefault();}});
function tapped(k){ if(edge[k]){edge[k]=0;return true;} return false; }
function clearEdge(){ for(const k in edge)edge[k]=0; }
let dashDir=0,dashOn=false;
function dashTap(k){
  const t=performance.now(), d=(k==='l'?-1:1);
  if(t-tapT[k]<260){ dashDir=d; dashOn=true; }
  tapT[k]=t;
}
const isTouch=matchMedia('(pointer:coarse)').matches;
if(isTouch)document.getElementById('pad').classList.add('on');
[['pL','l'],['pR','r'],['pD','d'],['pJ','j'],['pB','b']].forEach(([id,k])=>{
  const el=document.getElementById(id);
  const on=e=>{e.preventDefault();if(!key[k]){edge[k]=1;if(k==='l'||k==='r')dashTap(k);}key[k]=1;actx();};
  const off=e=>{e.preventDefault();key[k]=0;};
  el.addEventListener('pointerdown',on);el.addEventListener('pointerup',off);
  el.addEventListener('pointercancel',off);el.addEventListener('pointerleave',off);
});

const SHIFT=2;                 // チャンクを 2マス もちあげて 地面を あつくする
const GROW=ROWS-SHIFT-2;       // 地面のいちばん上の行 = 13
const GY=GROW*TS;              // 地面の高さ(px) = 416
const ENTROW=GROW-1;           // てき／ドアが のる行 = 12
function buildStage(si){
  const S=STAGES[si];
  const seq=S.boss? S.chunks.slice(0,-1).concat(['flat']) : S.chunks.slice();
  const cols=seq.length*CW + (S.boss?34:0);
  const t=new Uint8Array(cols*ROWS), spawns=[];
  let doorX=-1;
  for(let ci=0;ci<seq.length;ci++){
    const rows=CHUNK[seq[ci]], off=ROWS-SHIFT-rows.length, bx=ci*CW;
    for(let ry=0;ry<rows.length;ry++){
      const line=(rows[ry]+'                    ').slice(0,CW), y=off+ry;
      for(let cx=0;cx<CW;cx++){
        const ch=line[cx], gx=bx+cx;
        let v=T_NONE;
        if(ch==='#')v=T_SOLID; else if(ch==='B')v=T_BLOCK; else if(ch==='^')v=T_SPIKE;
        else if(ch==='E'){v=T_DOOR; doorX=gx;}
        else if(ENT[ch])spawns.push({kind:ENT[ch],x:gx*TS+TS/2,y:y*TS+TS/2});
        t[y*cols+gx]=v;
      }
    }
    // いちばん下の行を したへ のばす（地面を あつく）
    for(let cx=0;cx<CW;cx++){
      const gx=bx+cx, base=t[(ROWS-SHIFT-1)*cols+gx];
      for(let y=ROWS-SHIFT;y<ROWS;y++)t[y*cols+gx]=(base===T_SOLID)?T_SOLID:T_NONE;
    }
  }
  const lv={cols,rows:ROWS,t,spawns,def:S,si,doorX,
            wpx:cols*TS,hpx:ROWS*TS,arena:S.boss?seq.length*CW*TS:0};
  if(S.boss){ // ボス部屋
    const b0=seq.length*CW;
    for(let x=b0;x<cols;x++){ for(let y=GROW;y<ROWS;y++)t[y*cols+x]=T_SOLID;
      if(x>=cols-2){for(let y=0;y<GROW;y++)t[y*cols+x]=T_SOLID;} }
    for(let y=0;y<GROW;y++)t[y*cols+b0]=T_NONE;
  }
  return lv;
}
function tileAt(lv,cx,cy){ if(cx<0||cy<0||cx>=lv.cols||cy>=ROWS)return (cy>=ROWS)?T_NONE:T_SOLID; return lv.t[cy*lv.cols+cx]; }
function setTile(lv,cx,cy,v){ if(cx<0||cy<0||cx>=lv.cols||cy>=ROWS)return; lv.t[cy*lv.cols+cx]=v; }
const solidAtPx=(lv,x,y)=>{const v=tileAt(lv,Math.floor(x/TS),Math.floor(y/TS));return v===T_SOLID||v===T_BLOCK;};

const GRAV=.62, MAXFALL=11.5;
function moveX(e,lv,noWall){
  e.x+=e.vx; e.hitW=0;
  const hw=e.w/2, y0=Math.floor((e.y-e.h/2+3)/TS), y1=Math.floor((e.y+e.h/2-3)/TS);
  if(e.vx>0){ const cx=Math.floor((e.x+hw)/TS);
    for(let cy=y0;cy<=y1;cy++){const v=tileAt(lv,cx,cy);
      if(v===T_SOLID||(v===T_BLOCK&&!noWall)){e.x=cx*TS-hw-.01;e.vx=0;e.hitW=1;break;}}
  }else if(e.vx<0){ const cx=Math.floor((e.x-hw)/TS);
    for(let cy=y0;cy<=y1;cy++){const v=tileAt(lv,cx,cy);
      if(v===T_SOLID||(v===T_BLOCK&&!noWall)){e.x=(cx+1)*TS+hw+.01;e.vx=0;e.hitW=1;break;}}
  }
  if(e.x<hw+2){e.x=hw+2;e.vx=0;e.hitW=1;}
  if(e.x>lv.wpx-hw-2){e.x=lv.wpx-hw-2;e.vx=0;e.hitW=1;}
}
function moveY(e,lv){
  e.y+=e.vy; e.onG=false; e.hitC=0;
  const hh=e.h/2, x0=Math.floor((e.x-e.w/2+3)/TS), x1=Math.floor((e.x+e.w/2-3)/TS);
  if(e.vy>0){ const cy=Math.floor((e.y+hh)/TS);
    for(let cx=x0;cx<=x1;cx++){const v=tileAt(lv,cx,cy);
      if(v===T_SOLID||v===T_BLOCK){e.y=cy*TS-hh-.01;e.vy=0;e.onG=true;break;}}
  }else if(e.vy<0){ const cy=Math.floor((e.y-hh)/TS);
    for(let cx=x0;cx<=x1;cx++){const v=tileAt(lv,cx,cy);
      if(v===T_SOLID||v===T_BLOCK){e.y=(cy+1)*TS+hh+.01;e.vy=0;e.hitC=1;break;}}
  }
}
function touchSpike(e,lv){
  const x0=Math.floor((e.x-e.w/2+4)/TS), x1=Math.floor((e.x+e.w/2-4)/TS);
  const y0=Math.floor((e.y-e.h/2+4)/TS), y1=Math.floor((e.y+e.h/2-2)/TS);
  for(let cy=y0;cy<=y1;cy++)for(let cx=x0;cx<=x1;cx++)if(tileAt(lv,cx,cy)===T_SPIKE)return true;
  return false;
}
function breakBlock(cx,cy,c){
  const lv=G.lv; if(tileAt(lv,cx,cy)!==T_BLOCK)return false;
  setTile(lv,cx,cy,T_NONE);
  addPart(cx*TS+16,cy*TS+16,7,c||lv.def.blk,3.2,24);
  SFX.hit(); scoreUp(20);
  return true;
}
function breakAround(x,y,r,c){
  const lv=G.lv; let n=0;
  const c0=Math.floor((x-r)/TS),c1=Math.floor((x+r)/TS),r0=Math.floor((y-r)/TS),r1=Math.floor((y+r)/TS);
  for(let cy=r0;cy<=r1;cy++)for(let cx=c0;cx<=c1;cx++)if(breakBlock(cx,cy,c))n++;
  return n;
}

function playerHurt(dmg,fromX){
  const p=G.p;
  if(p.inv>0||p.st==='die'||p.invT>0||p.st==='stone')return;
  p.hp-=dmg||1; SFX.damage(); shake(7); G.hitstop=6;
  p.st='hurt'; p.hurtT=26; p.inv=100;
  p.vx=(p.x<fromX?-1:1)*3.4; p.vy=-4.2; p.hold=null;
  if(p.ability){ // 能力を おとす
    const ab=p.ability; p.ability=null;
    G.items.push({kind:'ab',ab,x:p.x,y:p.y-14,vx:(p.x<fromX?2:-2),vy:-5,t:0,got:0,life:600});
    addText(p.x,p.y-30,'ロスト!','#ff5d78');
  }
  if(p.hp<=0)playerDie();
}
function playerDie(){
  const p=G.p; if(p.st==='die')return;
  p.st='die'; p.vy=-9; p.vx=0; p.hp=0; G.deathT=0; bgmStop(); SFX.over();
  addStarBurst(p.x,p.y,'#ff8fc0');
}
function swallow(){
  const p=G.p; if(p.st!=='full'||!p.hold)return;
  const ab=p.hold.ab;
  p.st='normal'; p.hold=null; p.squish=8;
  if(ab){ p.ability=ab; SFX.copy(); addText(p.x,p.y-34,ABL[ab].n+'!',ABL[ab].c);
    for(let i=0;i<12;i++){const a=i/12*6.283;
      G.parts.push({x:p.x+Math.cos(a)*30,y:p.y+Math.sin(a)*30,vx:-Math.cos(a)*2,vy:-Math.sin(a)*2,
        c:ABL[ab].c2,r:4,life:22,t:0,g:0});}
    G.flash=.35; scoreUp(300,p.x,p.y-50);
  } else { SFX.gulp(); scoreUp(100,p.x,p.y-40); }
}
function spitStar(){
  const p=G.p; if(p.st!=='full')return;
  const big=p.hold&&p.hold.big;
  G.projs.push({kind:'star',x:p.x+p.dir*18,y:p.y-2,vx:p.dir*9.6,vy:0,w:big?30:22,h:big?30:22,
    life:78,dmg:big?4:2,mine:1,rot:0,pierce:1});
  p.st='normal'; p.hold=null; p.squish=-8; SFX.spit();
  p.vx-=p.dir*1.2;
}
function updatePlayer(){
  const p=G.p, lv=G.lv;
  p.anim++;
  if(p.inv>0)p.inv--;
  if(p.invT>0){p.invT--; if(p.invT===0)addText(p.x,p.y-34,'むてき おわり','#7fd7ff');}
  if(p.cd>0)p.cd--;
  if(p.atkT>0)p.atkT--;
  if(p.squish)p.squish*=.86;
  if(p.noCtrl>0)p.noCtrl--;

  if(p.st==='die'){
    p.vy+=.5; p.y+=p.vy; G.deathT++;
    if(G.deathT>90)onDeathDone();
    return;
  }
  if(p.st==='door'){ p.squish=0; return; }

  const ctl=p.noCtrl<=0&&G.state==='play'&&G.bossIntro<=0;
  const L=ctl&&key.l, R=ctl&&key.r, U=ctl&&key.u, Dn=ctl&&key.d;
  if(!key.l&&!key.r)dashOn=false;

  /* --- ストーン --- */
  if(p.st==='stone'){
    p.stoneT++; p.vx*=.86; p.vy=Math.min(p.vy+1.15,17); moveX(p,lv); moveY(p,lv);
    if(p.onG&&p.stoneT>4){ if(p.vy===0&&p.stoneT===5){shake(6);SFX.stone();} }
    if(p.vy>6)breakAround(p.x,p.y+16,18,lv.def.blk);
    for(const f of G.foes)if(f.st==='live'&&aabb(p,f))killFoe(f,'stone');
    if(G.boss&&G.boss.alive&&p.vy>5&&aabb(p,G.boss))hitBoss(2);
    if((ctl&&tapped('b')&&p.stoneT>16)||p.stoneT>210){ p.st='normal'; p.squish=6; SFX.puff(); }
    return;
  }
  /* --- スライディング --- */
  if(p.st==='slide'){
    p.slideT--; p.vy+=GRAV; moveX(p,lv); moveY(p,lv);
    for(const f of G.foes)if(f.st==='live'&&aabb(p,f))killFoe(f,'slide');
    if(G.boss&&G.boss.alive&&aabb(p,G.boss))hitBoss(1);
    if(p.slideT<=0||p.hitW){ p.st='normal'; p.vx*=.3; }
    if(touchSpike(p,lv)){ playerHurt(1,p.x+p.dir*40); p.vy=Math.min(p.vy,-5.4); }
    return;
  }
  /* --- のけぞり --- */
  if(p.st==='hurt'){
    p.hurtT--; p.vy+=GRAV*.9; p.vx*=.93; moveX(p,lv); moveY(p,lv);
    if(p.hurtT<=0)p.st='normal';
    return;
  }

  /* --- 横移動 --- */
  const spd=(dashOn?4.35:2.55)*(p.st==='full'?.82:1);
  let want=0;
  if(L&&!R)want=-1; if(R&&!L)want=1;
  const duck=Dn&&p.onG&&p.st!=='full'&&p.st!=='inhale';
  if(want&&!duck){ p.vx+=(want*spd-p.vx)*(p.onG?.34:.16); p.dir=want; }
  else p.vx*=p.onG?.72:.93;
  if(Math.abs(p.vx)<.05)p.vx=0;
  if(duck)p.vx*=.5;

  /* --- ジャンプ / ふうせん --- */
  if(ctl&&(tapped('j')||tapped('u'))){
    if(p.onG&&duck&&p.st==='normal'){ p.st='slide'; p.slideT=26; p.vx=p.dir*6.4; SFX.slide();
      addPart(p.x,p.y+12,5,'#fff',2,16,.05); }
    else if(p.onG&&p.st!=='inhale'){ p.vy=-10.1; p.onG=false; SFX.jump(); p.squish=-6; }
    else if(p.st==='puff'){ p.vy=Math.min(p.vy,-.2)-2.0; if(p.vy<-3.6)p.vy=-3.6; SFX.puff();
      addPart(p.x,p.y+14,3,'#ffffff',1.4,14,-.02); }
    else if(p.st!=='full'&&p.st!=='stone'){ p.st='puff'; p.vy=-2.6; p.puffT=0; SFX.puff(); }
  }
  if(p.st==='puff'){
    p.puffT++;
    if(ctl&&(key.j||key.u)&&p.vy>-2.4)p.vy-=.10;
    p.vy+=.155; if(p.vy>1.55)p.vy=1.55;
    if(p.vy<-3.6)p.vy=-3.6;
  }else{
    p.vy+=GRAV; if(p.vy>MAXFALL)p.vy=MAXFALL;
    if(!key.j&&!key.u&&p.vy<-3.6)p.vy=-3.6; // 可変ジャンプ
  }
  moveX(p,lv); const wasAir=!p.onG; moveY(p,lv);
  if(p.st==='puff'&&p.onG){ p.st='normal'; p.squish=5; }
  if(p.onG&&wasAir&&p.vy===0)p.squish=5;

  /* --- ボタンB --- */
  if(ctl){
    if(p.st==='full'){
      if(tapped('b'))spitStar();
      else if(tapped('d'))swallow();
    } else if(p.st==='puff'){
      if(tapped('b')){ p.st='normal'; p.vy=Math.max(p.vy,1.2); SFX.spit();
        G.projs.push({kind:'air',x:p.x+p.dir*16,y:p.y,vx:p.dir*5.4,vy:0,w:20,h:18,life:22,dmg:1,mine:1,rot:0}); }
    } else if(p.ability){
      if(Dn&&p.onG&&tapped('b'))dropAbility();
      else if(key.b&&!Dn&&p.cd<=0)useAbility();
    } else {
      if(key.b){ if(p.st!=='inhale'){p.st='inhale';p.inhT=0;} }
      else if(p.st==='inhale'){ p.st='normal'; p.inhT=0; }
    }
  }
  if(p.st==='inhale'){ p.inhT++; if(p.inhT%7===0)SFX.inhale(); doInhale(); }
  if(!key.b&&p.st==='inhale'){ p.st='normal'; p.inhT=0; }

  /* --- とげ・落下 --- */
  if(touchSpike(p,lv)){ playerHurt(1,p.x+p.dir*40); p.vy=Math.min(p.vy,-5.4); }
  if(p.y>lv.hpx+90){ p.hp=0; playerDie(); }
  if(G.state==='play'&&p.hp<=0)playerDie();

  /* --- ドア --- */
  if(lv.doorX>=0&&!G.lv.def.boss){
    const dx=lv.doorX*TS+16;
    if(Math.abs(p.x-dx)<20&&Math.abs(p.y-(ENTROW*TS+16))<30&&(key.u||tapped('u'))){ enterDoor(); }
  }
}

/* ===================== すいこみ ===================== */
function doInhale(){
  const p=G.p, lv=G.lv;
  const range=96+Math.min(p.inhT,22)*1.5;
  const zx=p.x+p.dir*(16+range/2);
  const zone={x:zx,y:p.y,w:range,h:60};
  const mx=p.x+p.dir*12, my=p.y;
  for(const f of G.foes){
    if(f.st!=='live'&&f.st!=='froz')continue;
    if(EN[f.kind]&&EN[f.kind].heavy)continue;
    if(!aabb(zone,f))continue;
    const dx=mx-f.x, dy=my-f.y, d=Math.hypot(dx,dy)||1;
    f.inh=6; f.x+=dx/d*3.6; f.y+=dy/d*2.8;
    if(d<22){
      p.st='full'; p.hold={ab:(f.st==='froz'?null:EN[f.kind].ab), kind:f.kind, big:EN[f.kind].hp>=3};
      f.st='gone'; SFX.gulp(); p.squish=9; scoreUp(50,f.x,f.y-20); return;
    }
  }
  for(const pr of G.projs){
    if(pr.mine||pr.dead)continue;
    if(!aabb(zone,pr))continue;
    const dx=mx-pr.x, dy=my-pr.y, d=Math.hypot(dx,dy)||1;
    pr.vx+=dx/d*.9; pr.vy+=dy/d*.7;
    if(d<22){ pr.dead=1; p.st='full';
      p.hold={ab:pr.ab||null,kind:'shot',big:(pr.kind==='apple'||pr.kind==='sblock'||pr.kind==='seed')?1:0};
      SFX.gulp(); p.squish=9; return; }
  }
  for(const it of G.items){
    if(it.got||it.kind==='ab')continue;
    const dx=mx-it.x,dy=my-it.y,d=Math.hypot(dx,dy)||1;
    if(d<range){ it.x+=dx/d*2.6; it.y+=dy/d*2.0; }
  }
  if(p.inhT>6){
    const c0=Math.floor((zx-range/2)/TS),c1=Math.floor((zx+range/2)/TS);
    const r0=Math.floor((p.y-26)/TS),r1=Math.floor((p.y+22)/TS);
    let best=null,bd=1e9;
    for(let cy=r0;cy<=r1;cy++)for(let cx=c0;cx<=c1;cx++){
      if(tileAt(lv,cx,cy)!==T_BLOCK)continue;
      const d=Math.abs(cx*TS+16-mx)+Math.abs(cy*TS+16-my);
      if(d<bd){bd=d;best=[cx,cy];}
    }
    if(best){
      setTile(lv,best[0],best[1],T_NONE);
      addPart(best[0]*TS+16,best[1]*TS+16,5,lv.def.blk,2.2,16,0);
      p.st='full'; p.hold={ab:null,kind:'block',big:0}; SFX.gulp(); p.squish=9; scoreUp(30);
    }
  }
}
function dropAbility(){

  G.items.push({kind:'ab',ab,x:p.x,y:p.y-12,vx:p.dir*2.2,vy:-4.4,t:0,got:0,life:600});

/* ===================== てき ===================== */
function killFoe(f,how){
  if(f.st!=='live'&&f.st!=='froz')return;

  f.st='dead'; f.dead=0; f.vy=-4.6; f.vx=(Math.random()-.5)*3;
  SFX.kill(); addStarBurst(f.x,f.y,D.c2); scoreUp(D.sc,f.x,f.y-18);
  addPart(f.x,f.y,6,D.c,2.6,22);
}
function foeShoot(f){

  const dir=(p.x<f.x)?-1:1; f.dir=dir;
  switch(D.sh){

      for(let i=0;i<6;i++)G.projs.push({kind:'ebeam',x:f.x+dir*(8+Math.cos(-1.3+i*.42)*26),

      SFX.ice(); break;
    case 'hammer':
      G.projs.push({kind:'ehammer',x:f.x+dir*20,y:f.y-6,vx:0,vy:0,w:44,h:44,life:16,dmg:2,mine:0,ab:'hammer',rot:0});
      SFX.swing(); break;
  }
}
function updateFoes(){
  const p=G.p, lv=G.lv;
  for(let i=G.foes.length-1;i>=0;i--){
    const f=G.foes[i], D=EN[f.kind];
    if(f.st==='gone'){ G.foes.splice(i,1); continue; }
    if(f.st==='dead'){ f.dead++; f.vy+=.5; f.x+=f.vx; f.y+=f.vy; if(f.dead>44)G.foes.splice(i,1); continue; }
    if(Math.abs(f.x-p.x)>W*.9){ if(f.inh)f.inh--; continue; }
    f.t++; f.anim++;
    if(f.inh>0){ f.inh--; f.vy=0;
      if(f.x<0||f.y>lv.hpx+40)G.foes.splice(i,1);
      continue; }
    if(f.st==='froz'){
      f.frozen--; f.vy+=GRAV; if(f.vy>MAXFALL)f.vy=MAXFALL;
      if(f.slide){ f.vx=f.slide*7; moveX(f,lv); if(f.hitW){ f.st='dead';f.dead=0;f.vy=-3; SFX.hit(); addPart(f.x,f.y,8,'#d8f4ff',3,24); } }
      moveY(f,lv);
      if(f.slide)for(const o of G.foes)if(o!==f&&o.st==='live'&&aabb(f,o))killFoe(o,'ice');
      if(f.slide&&G.boss&&G.boss.alive&&aabb(f,G.boss)){hitBoss(2);f.st='dead';f.dead=0;}
      if(!f.slide&&aabb(p,f)&&Math.abs(p.vx)>1.2){ f.slide=(p.x<f.x)?1:-1; SFX.hit(); }
      if(f.frozen<=0){ f.st='live'; f.slide=0; f.vx=(Math.random()<.5?-1:1)*D.spd; }
      continue;
    }
    if(f.stun>0)f.stun--;
    // うごき
    if(D.mv==='fly'){
      f.hy=f.hy||f.oy;
      f.y=f.hy+Math.sin(f.t*.045)*36;
      f.x+=f.vx*1.3; f.dir=f.vx<0?-1:1;
      if(f.x<20||f.x>lv.wpx-20||solidAtPx(lv,f.x+Math.sign(f.vx)*16,f.y))f.vx*=-1;
    }else if(D.mv==='hop'){
      f.vy+=GRAV; if(f.vy>MAXFALL)f.vy=MAXFALL;
      moveX(f,lv); moveY(f,lv);
      if(f.onG){ f.hopT=(f.hopT||0)+1;
        if(f.hopT>ri(34,52)){ f.hopT=0; f.vy=-7.4; f.vx=(p.x<f.x?-1:1)*D.spd*1.6; f.dir=f.vx<0?-1:1;
          if(f.kind==='spark')SFX.spark(); }
        else f.vx*=.86;
      }
      if(f.hitW)f.vx*=-1;
      if(f.kind==='spark'&&!f.onG){ if(f.t%4===0)addPart(f.x,f.y,1,'#fff9c0',1.6,12,0); }
      if(f.kind==='spark'&&Math.abs(f.x-p.x)<46&&Math.abs(f.y-p.y)<44&&f.t%20===0){
        G.projs.push({kind:'espark',x:f.x,y:f.y,vx:0,vy:0,w:56,h:52,life:12,dmg:1,mine:0,ab:'spark',rot:0}); }
    }else{
      f.vy+=GRAV; if(f.vy>MAXFALL)f.vy=MAXFALL;
      moveX(f,lv); moveY(f,lv);
      if(f.hitW)f.vx=-f.vx||D.spd;
      // がけで折り返す
      if(f.onG){
        const ax=f.x+Math.sign(f.vx||1)*(f.w/2+3);
        if(!solidAtPx(lv,ax,f.y+f.h/2+6))f.vx=-f.vx;
      }
      if(Math.abs(f.vx)<.05)f.vx=(Math.random()<.5?-1:1)*D.spd;
      f.dir=f.vx<0?-1:1;
    }
    if(D.sh){ f.shootT--; if(f.shootT<=0&&Math.abs(f.x-p.x)<380){ foeShoot(f); f.shootT=D.si+ri(0,50); } }
    if(touchSpike(f,lv)&&D.mv!=='fly')f.vy=-6;
    if(f.y>lv.hpx+60)G.foes.splice(i,1);
    // 接触ダメージ
    if(f.st==='live'&&aabb(p,f)&&p.st!=='stone'&&p.st!=='slide'){
      if(p.invT>0)killFoe(f,'inv'); else playerHurt(1,f.x);
    }
  }
}

/* ===================== 弾・エフェクト ===================== */
function freezeFoe(f){
  if(f.st!=='live')return;
  if(EN[f.kind].hp>=3){ f.hp-=1; if(f.hp<=0)killFoe(f); return; }
  f.st='froz'; f.frozen=280; f.slide=0; f.vx=0; SFX.ice();
  addPart(f.x,f.y,7,'#d8f4ff',2.4,22,0);
}
function updateProjs(){
  const p=G.p, lv=G.lv;
  for(let i=G.projs.length-1;i>=0;i--){
    const pr=G.projs[i];
    pr.t=(pr.t||0)+1;
    if(pr.delay&&pr.t<pr.delay){ continue; }
    if(pr.att){ pr.x=p.x+pr.ax; pr.y=p.y+pr.ay; }
    else{
      if(pr.grav){ pr.vy+=.42; if(pr.vy>13)pr.vy=13; }
      if(pr.kind==='cutter'){
        if(pr.back){ const dx=p.x-pr.x,dy=p.y-pr.y,d=Math.hypot(dx,dy)||1;
          pr.vx+=dx/d*.9; pr.vy+=dy/d*.9;
          pr.vx=clamp(pr.vx,-11,11); pr.vy=clamp(pr.vy,-11,11);
          if(d<20){ G.projs.splice(i,1); continue; } }
        else if(pr.t>26){ pr.back=1; }
        pr.rot+=.45;
      }
      if(pr.kind==='ecut')pr.rot+=.4;
      pr.x+=pr.vx; pr.y+=pr.vy;
    }
    pr.life--;
    // かべ
    if(!pr.att&&pr.kind!=='melee'){
      const cx=Math.floor(pr.x/TS), cy=Math.floor(pr.y/TS), v=tileAt(lv,cx,cy);
      if(v===T_BLOCK){
        if(pr.kind==='star'||pr.kind==='bomb'||pr.kind==='ebomb'||pr.kind==='sbeam'||pr.kind==='cutter'||pr.kind==='icev'||pr.kind==='fire'){
          breakBlock(cx,cy,lv.def.blk);
          if(pr.kind==='star'){G.projs.splice(i,1);continue;}
        }
      }else if(v===T_SOLID){
        if(pr.kind==='bomb'||pr.kind==='ebomb'||pr.kind==='apple'){ if(pr.grav&&pr.vy>0){pr.y=cy*TS-pr.h/2;pr.vy*=-.34;pr.vx*=.7;} }
        else if(pr.kind==='cutter'){ if(!pr.back)pr.back=1; }
        else if(pr.kind!=='spark'&&pr.kind!=='espark'&&pr.kind!=='beamp'&&pr.kind!=='ebeam'){
          addPart(pr.x,pr.y,4,'#fff',2,14,0); G.projs.splice(i,1); continue; }
      }
    }
    if(pr.fuse){ pr.fuse--; if(pr.fuse<=0)pr.life=0; }
    if(pr.life<=0||pr.dead||pr.x<-60||pr.x>lv.wpx+60||pr.y>lv.hpx+80){
      if(pr.kind==='bomb'||pr.kind==='ebomb'){
        SFX.bomb(); shake(8); addPart(pr.x,pr.y,18,'#ffd08a',5,28); addStarBurst(pr.x,pr.y,'#ff9a62');
        breakAround(pr.x,pr.y,40,lv.def.blk);
        const blast={x:pr.x,y:pr.y,w:104,h:104};
        for(const f of G.foes)if(f.st==='live'&&aabb(blast,f))killFoe(f,'bomb');
        if(G.boss&&G.boss.alive&&aabb(blast,G.boss))hitBoss(pr.mine?4:0);
        if(!pr.mine&&aabb(blast,p))playerHurt(1,pr.x);
        else if(pr.mine&&aabb(blast,p)&&p.invT<=0)playerHurt(1,pr.x);
      }
      G.projs.splice(i,1); continue;
    }
    // あたり判定
    if(pr.mine){
      for(const f of G.foes){
        if(f.st==='dead'||f.st==='gone')continue;
        if(f.st==='froz'&&!pr.freeze){ if(aabb(pr,f)){ f.slide=(pr.vx<0?-1:1); } continue; }
        if(f.st!=='live')continue;
        if(!aabb(pr,f))continue;
        if(pr.freeze){ freezeFoe(f); }
        else{ f.hp-=pr.dmg; SFX.hit(); addPart(f.x,f.y,4,'#fff',2.4,14,0);
              if(f.hp<=0)killFoe(f,pr.kind); else f.stun=14; }
        if(!pr.pierce){ pr.life=0; }
        if(pr.kind==='star'){ pr.life=0; }
      }
      if(G.boss&&G.boss.alive&&aabb(pr,G.boss)&&!pr.hitB){
        hitBoss(pr.dmg); pr.hitB=1;
        if(pr.kind==='star'||!pr.pierce)pr.life=0;
      }
    }else{
      if(aabb(pr,p)&&p.st!=='stone'){
        if(p.invT>0){ pr.life=0; }
        else{ playerHurt(pr.dmg||1,pr.x); pr.life=0; }
      }
    }
  }
}
function updateItems(){
  const p=G.p, lv=G.lv;
  for(let i=G.items.length-1;i>=0;i--){
    const it=G.items[i]; it.t++;
    if(it.kind==='ab'){
      it.vy+=.44; it.x+=it.vx; it.y+=it.vy;
      if(it.y>=0){
        const cy=Math.floor((it.y+10)/TS), cx=Math.floor(it.x/TS);
        if(tileAt(lv,cx,cy)===T_SOLID||tileAt(lv,cx,cy)===T_BLOCK){ it.y=cy*TS-10; it.vy*=-.55; it.vx*=.86;
          if(Math.abs(it.vy)<1.2)it.vy=-3.4; }
      }
      if(it.life)it.life--;
      if(it.life<=0||it.y>lv.hpx+60){ G.items.splice(i,1); continue; }
    }else{
      // ブロックの中は うかせない
      const cy=Math.floor((it.y+14)/TS), cx=Math.floor(it.x/TS);
      if(tileAt(lv,cx,cy)===T_SOLID){ it.y=cy*TS-14; }
      it.y+=Math.sin(it.t*.07)*.25;
    }
    if(Math.abs(it.x-p.x)>W)continue;
    if(aabb({x:it.x,y:it.y,w:30,h:30},p)&&!it.got){
      it.got=1;
      if(it.kind==='warp'){ G.items.splice(i,1); SFX.warp(); G.flash=.8;
        addStarBurst(p.x,p.y,'#ffd23d'); p.st='door'; p.vy=-6;
        setTimeout(()=>{ if(G.state==='play')stageClear(); },700); continue; }
      if(it.kind==='ab'){ p.ability=it.ab; SFX.copy(); addText(p.x,p.y-34,ABL[it.ab].n+'!',ABL[it.ab].c); }
      else if(it.kind==='life'){ G.lives++; SFX.life(); addText(p.x,p.y-34,'1UP!','#ff8fc0'); }
      else if(it.kind==='candy'){ p.invT=600; SFX.item(); addText(p.x,p.y-34,'むてき!','#7fd7ff'); scoreUp(500); }
      else{ const h=ITEM[it.kind].heal; p.hp=Math.min(p.maxhp,p.hp+h); SFX.heal();
            addText(p.x,p.y-34,ITEM[it.kind].n,'#ff8fc0'); scoreUp(ITEM[it.kind].sc); }
      G.items.splice(i,1);
    }
  }
}
function updateFx(){
  for(let i=G.parts.length-1;i>=0;i--){const q=G.parts[i];q.t++;q.vy+=q.g;q.x+=q.vx;q.y+=q.vy;
    if(q.t>q.life)G.parts.splice(i,1);}
  for(let i=G.stars.length-1;i>=0;i--){const s=G.stars[i];s.t++;s.vy+=.22;s.x+=s.vx;s.y+=s.vy;s.rot+=s.vr;
    if(s.t>s.life)G.stars.splice(i,1);}
  for(let i=G.texts.length-1;i>=0;i--){const t=G.texts[i];t.t++;t.y-=.7;if(t.t>t.life)G.texts.splice(i,1);}
  if(G.shake>0)G.shake*=.86;
  if(G.flash>0)G.flash*=.88;
  if(G.msgT>0)G.msgT--;
}
/* ===================== カメラ・進行 ===================== */
function updateCam(){
  const p=G.p, lv=G.lv;
  let tx=p.x-VW*.45;
  let lo=0;
  if(lv.def.boss&&G.boss&&p.x>lv.arena)lo=lv.arena;      // ボス部屋では もどれない
  tx=clamp(tx,lo,Math.max(lo,lv.wpx-VW));
  G.camx+=(tx-G.camx)*.14;
  let ty=clamp(p.y-VH*.71,0,Math.max(0,lv.hpx-VH));
  G.camy+=(ty-G.camy)*.11;
}
function enterDoor(){
  const p=G.p; if(p.st==='door')return;
  p.st='door'; SFX.door(); bgmStop();
  setTimeout(()=>stageClear(),700);
}
function stageClear(){
  G.state='clear'; G.clearT=0; SFX.clear();
  const bonus=G.p.hp*500+G.lives*1000;
  G.score+=bonus;
  if(G.si+1>G.unlocked){G.unlocked=G.si+1;LS.set('sp_unlock',G.unlocked);}
  showClear(bonus);
}
function onDeathDone(){
  G.lives--;
  if(G.lives<0){ gameOver(); return; }
  const lv=G.lv, p=G.p;
  let cp=G.cp||64;
  const inBoss=G.boss&&G.boss.alive;
  if(inBoss)cp=Math.max(cp,lv.arena+80);          // ボス部屋の 中で ふっかつ
  G.p=makePlayer(); G.p.x=cp; G.p.y=ENTROW*TS; G.p.noCtrl=30; G.p.inv=90;
  G.projs=[];
  if(inBoss){ G.boss.hp=G.boss.maxhp; G.boss.t=0; G.boss.st='idle'; G.boss.act=60; G.boss.sub=0;
    G.boss.x=lv.arena+15*TS; G.boss.y=G.boss.y0; G.boss.phase=1;
    G.bossIntro=0; bgmPlay('boss'); }
  else bgmPlay(lv.def.bgm);
  // 近くの てきを ふっかつ
  for(const s of lv.spawns){
    if(!EN[s.kind])continue;
    if(Math.abs(s.x-cp)<W*1.2&&!G.foes.some(f=>f.ox===s.x&&f.oy===s.y&&f.st!=='dead'))
      G.foes.push(makeFoe(s.kind,s.x,s.y));
  }
  msg('のこり '+G.lives,90);
}
function gameOver(){
  G.state='over'; bgmStop();
  if(G.score>G.best){G.best=G.score;LS.set('sp_best',G.best);}
  showOver();
}

/* ===================== ボス ===================== */
const BOSS={
  woody :{n:'ウッディウッズ', hp:22, w:112, h:186, c:'#7a5a34', c2:'#4a9c3c', ab:null},
  knight:{n:'ソードナイト',   hp:24, w:52, h:66,  c:'#4a6fa8', c2:'#ffe45c', ab:'sword'},
  dedon :{n:'デドン大王',     hp:34, w:76, h:82,  c:'#2f6fd0', c2:'#ffd23d', ab:'hammer'},
};
function startBoss(){
  const lv=G.lv, k=lv.def.boss, D=BOSS[k];
  const gx=lv.arena+15*TS;
  G.boss={kind:k,x:gx,y:GY-D.h/2,w:D.w,h:D.h,hp:D.hp,maxhp:D.hp,alive:true,
    st:'idle',t:0,vx:0,vy:0,dir:-1,phase:1,hurtT:0,onG:true,y0:GY-D.h/2,act:0,dieT:0};
  const gcol=Math.floor(lv.arena/TS);
  for(let y=0;y<GROW;y++)setTile(lv,gcol,y,T_SOLID);
  G.bossIntro=110; bgmStop(); SFX.boss(); shake(10);
  msg(D.n+' あらわる!',150);
}
function hitBoss(dmg){
  const b=G.boss;
  if(!b||!b.alive||G.bossIntro>0||b.hurtT>0||!dmg)return;
  b.hp-=dmg; b.hurtT=16; SFX.bhit(); shake(6); G.hitstop=4;
  addStarBurst(b.x,b.y-10,'#fff');
  scoreUp(dmg*100,b.x,b.y-b.h/2);
  if(b.hp<=0){ b.alive=false; b.dieT=0; b.st='die'; bgmStop(); SFX.bdown(); shake(14); }
  else if(b.hp<=b.maxhp/2&&b.phase===1){ b.phase=2; addText(b.x,b.y-b.h/2-10,'いかり!','#ff5d78'); }
}
function bossThrowBlock(){
  const b=G.boss;
  G.projs.push({kind:'sblock',x:b.x+b.dir*30,y:b.y-20,vx:b.dir*4.6,vy:-3.4,w:30,h:30,
    life:150,dmg:2,mine:0,ab:null,rot:0,grav:1});
}
function shockwave(x,y){
  for(const d of [-1,1])
    G.projs.push({kind:'wave',x:x+d*30,y:y,vx:d*5.2,vy:0,w:26,h:26,life:90,dmg:2,mine:0,ab:null,rot:0});
}
function updateBoss(){
  const lv=G.lv, p=G.p;
  if(!G.boss){
    if(lv.def.boss&&p.x>lv.arena+30)startBoss();
    return;
  }
  const b=G.boss, D=BOSS[b.kind];
  if(G.bossIntro>0){ G.bossIntro--; if(G.bossIntro===0)bgmPlay('boss'); return; }
  b.t++;
  if(b.hurtT>0)b.hurtT--;
  if(!b.alive){
    b.dieT++;
    if(b.dieT%9===0){ addPart(b.x+rnd(-40,40),b.y+rnd(-50,40),8,'#ffd23d',3.4,26); shake(5);
      addStarBurst(b.x+rnd(-40,40),b.y+rnd(-40,30),'#fff'); }
    if(b.dieT===74){
      G.flash=1; scoreUp(5000,b.x,b.y-60);
      if(D.ab)G.items.push({kind:'ab',ab:D.ab,x:b.x,y:b.y-40,vx:-2,vy:-5,t:0,got:0,life:900});
      G.items.push({kind:'warp',x:lv.arena+22*TS,y:12*TS,t:0,got:0});
      msg('ワープスターに のろう!',200); SFX.warp();
    }
    if(b.dieT>74&&b.dieT<90)G.flash=Math.max(G.flash,.5);
    return;
  }
  const dx=p.x-b.x, adx=Math.abs(dx), spd=b.phase===2?1.35:1;

  if(b.kind==='woody'){
    b.dir=-1;
    if(b.act<=0){
      b.act=ri(70,110)/spd;
      const r=Math.random();
      if(r<.36){ b.st='blow'; b.sub=0; }
      else if(r<.74){ b.st='apple'; b.sub=0; }
      else { b.st='spit'; b.sub=0; }
    }
    b.act--;
    if(b.st==='blow'){
      b.sub++;
      if(b.sub%12===0&&b.sub<=48){
        G.projs.push({kind:'wind',x:b.x-60,y:b.y+b.h/2-20+rnd(-10,10),vx:-4.4,vy:0,w:30,h:26,
          life:120,dmg:1,mine:0,ab:null,rot:0});
        SFX.fire();
      }
    }else if(b.st==='apple'){
      b.sub++;
      if(b.sub===10||b.sub===34||(b.phase===2&&b.sub===58)){
        const ax=clamp(p.x+rnd(-70,70),lv.arena+60,lv.wpx-60);
        G.projs.push({kind:'apple',x:ax,y:60,vx:0,vy:1,w:26,h:26,life:260,dmg:1,mine:0,ab:null,rot:0,grav:1});
      }
    }else if(b.st==='spit'){
      b.sub++;
      if(b.sub===22){ SFX.spit();
        for(let i=0;i<3;i++)G.projs.push({kind:'seed',x:b.x-40,y:b.y-40,vx:-4.2-i*.7,vy:-4.4+i*1.5,
          w:18,h:18,life:150,dmg:1,mine:0,ab:null,rot:0,grav:1}); }
    }
  }
  else if(b.kind==='knight'){
    b.vy+=GRAV; if(b.vy>MAXFALL)b.vy=MAXFALL;
    if(b.act<=0){
      b.act=ri(46,80)/spd; b.sub=0;
      b.dir=dx<0?-1:1;
      const r=Math.random();
      if(adx>150&&r<.45)b.st='dash';
      else if(r<.35)b.st='jump';
      else if(r<.7)b.st='slash';
      else b.st='beam';
      if(b.st==='jump'){ b.vy=-12.6; b.vx=Math.sign(dx||1)*3.6; }
      if(b.st==='dash'){ b.vx=b.dir*6.2*spd; SFX.slide(); }
    }
    b.act--; b.sub++;
    if(b.st==='dash'){ if(b.sub>34)b.vx*=.86; }
    else if(b.st==='slash'){ b.vx*=.8;
      if(b.sub===16){ SFX.swing();
        G.projs.push({kind:'eslash',x:b.x+b.dir*36,y:b.y,vx:0,vy:0,w:56,h:52,life:14,dmg:2,mine:0,ab:'sword',rot:0}); } }
    else if(b.st==='beam'){ b.vx*=.8;
      if(b.sub===20){ SFX.swing();
        G.projs.push({kind:'esbeam',x:b.x+b.dir*30,y:b.y-4,vx:b.dir*7,vy:0,w:28,h:28,life:70,dmg:2,mine:0,ab:'sword',rot:0}); } }
    else { b.vx*=.94; }
    moveX(b,lv); moveY(b,lv);
    if(b.x<lv.arena+50){b.x=lv.arena+50;b.vx=Math.abs(b.vx);}
    if(b.hitW)b.vx*=-.4;
  }
  else if(b.kind==='dedon'){
    b.vy+=GRAV; if(b.vy>MAXFALL)b.vy=MAXFALL;
    if(b.act<=0){
      b.act=ri(56,92)/spd; b.sub=0; b.dir=dx<0?-1:1;
      const r=Math.random();
      if(adx<110&&r<.5)b.st='hammer';
      else if(r<.34)b.st='slam';
      else if(r<.62)b.st='block';
      else if(r<.82)b.st='suck';
      else b.st='walk';
      if(b.st==='slam'){ b.vy=-13.4; b.vx=Math.sign(dx||1)*2.6; }
      if(b.st==='walk')b.vx=b.dir*2.4*spd;
    }
    b.act--; b.sub++;
    if(b.st==='hammer'){ b.vx*=.8;
      if(b.sub===20){ SFX.swing();
        G.projs.push({kind:'ehammer',x:b.x+b.dir*46,y:b.y+6,vx:0,vy:0,w:64,h:60,life:16,dmg:2,mine:0,ab:'hammer',rot:0});
        shake(6); } }
    else if(b.st==='slam'){ b.vx*=.97;
      if(b.onG&&b.sub>12&&!b.done){ b.done=1; shockwave(b.x,b.y+b.h/2-14); shake(12); SFX.stone(); }
      if(!b.onG)b.done=0; }
    else if(b.st==='block'){ b.vx*=.86; if(b.sub===26){ bossThrowBlock(); SFX.spit(); } }
    else if(b.st==='suck'){ b.vx*=.9;
      if(b.sub>14&&b.sub<64){
        const d2=Math.hypot(p.x-b.x,p.y-b.y);
        if(d2<300&&p.st!=='stone'){ p.x+=(b.x-p.x)/d2*2.6; if(p.onG===false)p.y+=(b.y-p.y)/d2*1.2; }
        if(b.sub%8===0)SFX.inhale();
        if(d2<56&&p.inv<=0&&p.invT<=0){ playerHurt(2,b.x); p.vx=-b.dir*7; p.vy=-6; }
      } }
    else { if(b.hitW)b.vx*=-1; }
    moveX(b,lv); moveY(b,lv);
    if(b.x<lv.arena+50){b.x=lv.arena+50;b.vx=Math.abs(b.vx);}
  }
  // 接触ダメージ
  if(b.alive&&aabb(p,b)&&p.st!=='stone'&&b.st!=='suck'){
    if(p.invT>0)hitBoss(1); else playerHurt(1,b.x);
  }
}

/* ===================== えがく：パフィ ===================== */
const PINK='#ff9fc8', PINK2='#ffd6e8', PINK3='#e3648f', FOOT='#e0507e';
function drawHat(c,x,y,r,ab,dir){
  const A=ABL[ab]; if(!A)return;
  c.save(); c.translate(x,y-r*.82);
  switch(A.hat){
    case 'fire':
      c.fillStyle='#ff5a2d';
      c.beginPath();c.moveTo(-r*.6,r*.2);
      c.quadraticCurveTo(-r*.3,-r*.9,0,-r*.2);
      c.quadraticCurveTo(r*.25,-r*1.1,r*.55,r*.2);c.closePath();c.fill();
      c.fillStyle='#ffd23d';c.beginPath();c.moveTo(-r*.25,r*.15);
      c.quadraticCurveTo(0,-r*.5,r*.25,r*.15);c.closePath();c.fill(); break;
    case 'ice':
      c.fillStyle='#bfeaff';c.strokeStyle='#7fd7ff';c.lineWidth=2;
      c.beginPath();c.moveTo(-r*.7,r*.25);c.lineTo(-r*.35,-r*.55);c.lineTo(0,r*.05);
      c.lineTo(r*.35,-r*.6);c.lineTo(r*.7,r*.25);c.closePath();c.fill();c.stroke(); break;
    case 'sword':
      c.fillStyle='#4a8f5a';
      c.beginPath();c.moveTo(-r*.75,r*.25);c.lineTo(0,-r*.75);c.lineTo(r*.75,r*.25);c.closePath();c.fill();
      c.fillStyle='#ffe45c';c.beginPath();c.arc(0,-r*.5,r*.18,0,7);c.fill(); break;
    case 'cutter':
      c.fillStyle='#ffe45c';c.strokeStyle='#c8a020';c.lineWidth=2;
      c.beginPath();c.arc(0,r*.05,r*.62,Math.PI,0);c.closePath();c.fill();c.stroke();
      c.fillStyle='#8ff0a0';c.beginPath();c.arc(0,r*.05,r*.3,Math.PI,0);c.closePath();c.fill(); break;
    case 'bomb':
      c.fillStyle='#5a4a8f';rr(c,-r*.7,-r*.35,r*1.4,r*.55,4);c.fill();
      c.fillStyle='#c8b8ff';rr(c,-r*.5,-r*.75,r*1.0,r*.45,3);c.fill(); break;
    case 'stone':
      c.fillStyle='#b8a088';c.beginPath();c.moveTo(-r*.75,r*.2);c.lineTo(-r*.5,-r*.5);
      c.lineTo(0,-r*.7);c.lineTo(r*.55,-r*.42);c.lineTo(r*.72,r*.2);c.closePath();c.fill();
      c.fillStyle='#efe2ce';c.fillRect(-r*.2,-r*.42,r*.24,r*.24); break;
    case 'spark':
      c.fillStyle='#ffe23d';star(c,0,-r*.25,r*.62,0,5);c.fill();
      c.fillStyle='#fff9c0';star(c,0,-r*.25,r*.3,0,5);c.fill(); break;
    case 'beam':
      c.fillStyle='#ffa8e0';
      c.beginPath();c.moveTo(-r*.7,r*.2);c.quadraticCurveTo(0,-r*1.1,r*.7,r*.2);c.closePath();c.fill();
      c.fillStyle='#ffd23d';c.beginPath();c.arc(0,-r*.62,r*.2,0,7);c.fill(); break;
    case 'hammer':
      c.fillStyle='#6a4a2a';rr(c,-r*.16,-r*.75,r*.32,r*1.0,2);c.fill();
      c.fillStyle='#c8b8a0';rr(c,-r*.72,-r*.85,r*1.44,r*.44,4);c.fill(); break;
  }
  c.restore();
}
function drawPuffy(c,p){
  const blink=(p.anim%180)<7;
  let r=15, sx=1, sy=1;
  if(p.st==='full'){ r=19; sx=1.08; sy=1.02; }
  if(p.st==='puff'){ r=17; sx=1.06; sy=1.06; }
  if(p.st==='inhale'){ sx=.94; sy=1.06; }
  if(p.st==='slide'){ sx=1.3; sy=.62; }
  const sq=p.squish||0; sx*=1+sq*.02; sy*=1-sq*.02;
  const x=p.x, y=p.y+ (p.st==='slide'?8:0);
  c.save(); c.translate(x,y);
  if(p.inv>0&&Math.floor(p.anim/3)%2===0)c.globalAlpha=.42;
  if(p.invT>0){ c.shadowColor='#7fd7ff'; c.shadowBlur=18; }
  c.scale(sx*p.dir,sy);
  // ストーン
  if(p.st==='stone'){
    c.fillStyle='#b8a088';
    c.beginPath();c.moveTo(-19,16);c.lineTo(-15,-9);c.lineTo(-2,-19);c.lineTo(13,-13);c.lineTo(19,7);c.lineTo(12,16);c.closePath();c.fill();
    c.fillStyle='#8f7a60';c.fillRect(-9,-6,9,8);c.fillRect(4,2,8,7);
    c.fillStyle='#efe2ce';c.beginPath();c.moveTo(-15,-9);c.lineTo(-2,-19);c.lineTo(2,-14);c.lineTo(-11,-5);c.closePath();c.fill();
    c.restore(); return;
  }
  // あし
  const walk=Math.abs(p.vx)>.4&&p.onG, ph=Math.sin(p.anim*.28);
  c.fillStyle=FOOT;
  if(p.onG||p.st==='slide'){
    ell(c,-7+(walk?ph*3:0),r*.86,7.5,4.6);c.fill();
    ell(c, 8-(walk?ph*3:0),r*.86,8.5,4.8);c.fill();
  }else{
    c.save();c.translate(-8,r*.72);c.rotate(-.5);ell(c,0,0,7.5,4.4);c.fill();c.restore();
    c.save();c.translate(9,r*.76);c.rotate(.35);ell(c,0,0,8.5,4.6);c.fill();c.restore();
  }
  // からだ
  const g=c.createRadialGradient(-r*.3,-r*.35,r*.2,0,0,r*1.15);
  g.addColorStop(0,PINK2);g.addColorStop(.55,PINK);g.addColorStop(1,PINK3);
  c.fillStyle=g; ell(c,0,0,r,r*.97); c.fill();
  // うで
  c.fillStyle=PINK;
  if(p.st==='inhale'){ ell(c,-r*.75,2,5.2,7.5);c.fill(); }
  else if(p.atkT>0){ c.save();c.translate(r*.72,-2);c.rotate(-.7);ell(c,0,0,5.4,8);c.fill();c.restore(); }
  else { c.save();c.translate(-r*.8,3);c.rotate(.3);ell(c,0,0,5,7.4);c.fill();c.restore();
         c.save();c.translate(r*.8,3);c.rotate(-.3);ell(c,0,0,5,7.4);c.fill();c.restore(); }
  // ほお
  c.fillStyle='rgba(255,120,160,.55)'; ell(c,-r*.52,r*.16,4.2,2.8);c.fill();
  ell(c,r*.6,r*.16,4.6,3);c.fill();
  // め
  const ey=-r*.28;
  c.fillStyle='#1b1030';
  if(blink||p.st==='hurt'){
    c.fillRect(-6.5,ey,4,1.8); c.fillRect(3,ey,4,1.8);
  }else{
    ell(c,-4.6,ey,2.5,4.4);c.fill(); ell(c,5,ey,2.7,4.6);c.fill();
    c.fillStyle='#5aa8ff'; ell(c,-4.6,ey+2.4,2,2.1);c.fill(); ell(c,5,ey+2.5,2.2,2.2);c.fill();
    c.fillStyle='#fff'; ell(c,-4.4,ey-1.6,1.4,1.9);c.fill(); ell(c,5.2,ey-1.6,1.5,2);c.fill();
  }
  // くち
  c.fillStyle='#8c2b46';
  if(p.st==='inhale'){ const s=1+Math.sin(p.anim*.5)*.15; ell(c,r*.32,r*.2,5.4*s,6.4*s);c.fill(); }
  else if(p.st==='full'){ ell(c,r*.3,r*.24,3.4,2.6);c.fill(); }
  else if(p.st==='hurt'){ ell(c,r*.28,r*.22,4,4);c.fill(); }
  else if(p.st==='puff'){ ell(c,r*.3,r*.2,3.6,3);c.fill(); }
  else { c.beginPath();c.arc(r*.3,r*.14,3.4,.15,Math.PI-.15);c.fill(); }
  c.restore();
  // ぼうし
  if(p.ability){ c.save(); if(p.inv>0&&Math.floor(p.anim/3)%2===0)c.globalAlpha=.42;
    drawHat(c,x,y-2,r,p.ability,p.dir); c.restore(); }
  // すいこみエフェクト
  if(p.st==='inhale'){
    const range=96+Math.min(p.inhT,22)*1.5;

  }else if(k==='sbeam'||k==='esbeam'){

    c.fillStyle='#4a9c3c';ell(c,7,-15,6,3);c.fill();

  }else if(k==='wind'){

    for(let i=0;i<3;i++){c.beginPath();c.arc(i*6,0,pr.h/2-i*4,.6,-0.6,true);c.stroke();}
  }else if(k==='wave'){
    c.fillStyle='#ffd23d'; star(c,0,0,pr.w/2,pr.t*.4,5);c.fill();

function drawBG(c,lv){
  const S=lv.def;
  // 地面のせん（画面座標）にあわせて 遠景を おく
  const GB=(GY-G.camy)*Z+10;
  const g=c.createLinearGradient(0,-40,0,GB+30);
  g.addColorStop(0,S.sky[0]);g.addColorStop(.55,S.sky[1]);g.addColorStop(1,S.sky[2]);
  c.fillStyle=g;c.fillRect(0,0,W,H);
  const cx=G.camx*Z, cy=G.camy*Z;
  if(S.deco==='tree'||S.deco==='cloud'){
    c.fillStyle='rgba(255,255,255,.72)';
    for(let i=0;i<9;i++){
      const x=((i*300-cx*.22)%(W+380))-160, y=GB-330+((i*57)%150)+cy*.2;
      ell(c,x,y,52,23);c.fill(); ell(c,x+36,y-12,38,21);c.fill(); ell(c,x-32,y-5,30,16);c.fill();
    }
  }
  if(S.deco==='tree'){
    c.fillStyle=S.far;
    for(let i=0;i<12;i++){
      const x=((i*190-cx*.42)%(W+300))-150, h=150+((i*67)%90);
      c.beginPath();c.moveTo(x-84,GB);c.quadraticCurveTo(x,GB-h-84,x+84,GB);c.closePath();c.fill();
    }
  }else if(S.deco==='ice'){
    c.fillStyle='#4d7ba6';
    for(let i=0;i<8;i++){
      const x=((i*260-cx*.24)%(W+380))-190, h=250+((i*97)%110);
      c.beginPath();c.moveTo(x-100,GB);c.lineTo(x,GB-h);c.lineTo(x+100,GB);c.closePath();c.fill();
    }
    for(let i=0;i<10;i++){
      const x=((i*210-cx*.4)%(W+320))-160, h=175+((i*83)%110);
      c.fillStyle=S.far;
      c.beginPath();c.moveTo(x-76,GB);c.lineTo(x,GB-h);c.lineTo(x+76,GB);c.closePath();c.fill();
      c.fillStyle='#e6f6ff';
      c.beginPath();c.moveTo(x-22,GB-h+46);c.lineTo(x,GB-h);c.lineTo(x+22,GB-h+46);
      c.quadraticCurveTo(x,GB-h+33,x-22,GB-h+46);c.closePath();c.fill();
    }
    c.globalAlpha=.5;c.fillStyle='#fff';
    for(let i=0;i<40;i++){const x=((i*97-cx*.6+G.t*.7)%(W+60))-30, y=((i*131+G.t*.9)%H);
      ell(c,x,y,2.4,2.4);c.fill();}
    c.globalAlpha=1;
  }else if(S.deco==='castle'){
    c.fillStyle=S.far;
    for(let i=0;i<8;i++){
      const x=((i*245-cx*.38)%(W+340))-170, h=195+((i*71)%110);
      c.fillRect(x-58,GB-h,116,h+20);
      for(let k=0;k<4;k++)c.fillRect(x-58+k*31,GB-h-16,20,18);
      c.fillStyle='rgba(255,220,120,.30)';
      for(let k=0;k<3;k++)c.fillRect(x-34+k*31,GB-h+44,16,22);
      c.fillStyle=S.far;
    }
    c.globalAlpha=.18;c.fillStyle='#fff';
    ell(c,W*.78,GB-330+cy*.2,54,54);c.fill(); c.globalAlpha=1;
  }else if(S.deco==='cloud'){
    c.globalAlpha=.4;c.fillStyle='#fff';
    for(let i=0;i<7;i++){
      const x=((i*330-cx*.35)%(W+460))-200, y=GB-190+((i*91)%140)+cy*.2;
      ell(c,x,y,96,30);c.fill(); ell(c,x+58,y-16,62,25);c.fill();
    }
    c.globalAlpha=1;
  }
}
function drawTiles(c,lv){
  const S=lv.def;
  const c0=Math.max(0,Math.floor(G.camx/TS)-1), c1=Math.min(lv.cols-1,Math.floor((G.camx+VW)/TS)+1);
  const r0=Math.max(0,Math.floor(G.camy/TS)), r1=Math.min(ROWS-1,Math.floor((G.camy+VH)/TS)+1);
  for(let cy=r0;cy<=r1;cy++)for(let cx=c0;cx<=c1;cx++){
    const v=lv.t[cy*lv.cols+cx]; if(!v)continue;
    const x=cx*TS, y=cy*TS;
    if(v===T_SOLID){
      const top=tileAt(lv,cx,cy-1)!==T_SOLID;
      const deep=tileAt(lv,cx,cy-2)===T_SOLID&&!top;
      c.fillStyle=deep?S.gnd2:S.gnd; c.fillRect(x,y,TS,TS);
      if(deep){
        c.fillStyle='rgba(0,0,0,.14)';
        const h=(cx*7+cy*13)%5;
        c.fillRect(x+4+h*3,y+7,5,4); c.fillRect(x+18,y+19+h,4,4);
      }else{
        c.fillStyle='rgba(0,0,0,.10)'; c.fillRect(x+2,y+TS-6,TS-4,4);
      }
      if(top){
        c.fillStyle=S.edge; c.fillRect(x,y,TS,9);
        c.beginPath();
        for(let k=0;k<4;k++)c.arc(x+4+k*8,y+9,4.6,0,Math.PI);
        c.fill();
        c.fillStyle='rgba(255,255,255,.28)';c.fillRect(x,y,TS,2.4);
      }
      if(tileAt(lv,cx-1,cy)!==T_SOLID){c.fillStyle='rgba(255,255,255,.14)';c.fillRect(x,y,2,TS);}
      if(tileAt(lv,cx+1,cy)!==T_SOLID){c.fillStyle='rgba(0,0,0,.14)';c.fillRect(x+TS-2,y,2,TS);}
    }else if(v===T_BLOCK){
      c.fillStyle='rgba(0,0,0,.18)';rr(c,x+2,y+3,TS-3,TS-3,5);c.fill();
      const g=c.createLinearGradient(x,y,x,y+TS);
      g.addColorStop(0,'#fff6cc');g.addColorStop(1,S.blk);
      c.fillStyle=g; rr(c,x+1,y+1,TS-3,TS-3,5);c.fill();
      c.strokeStyle='rgba(180,120,20,.55)';c.lineWidth=1.6;rr(c,x+1,y+1,TS-3,TS-3,5);c.stroke();
      c.fillStyle='rgba(255,255,255,.9)'; star(c,x+TS/2,y+TS/2,8.5,0,5);c.fill();
      c.fillStyle=S.blk; star(c,x+TS/2,y+TS/2,4.6,0,5);c.fill();
    }else if(v===T_SPIKE){
      c.fillStyle='#8fa8b8';
      for(let i=0;i<3;i++){c.beginPath();c.moveTo(x+i*11,y+TS);c.lineTo(x+5.5+i*11,y+4);c.lineTo(x+11+i*11,y+TS);c.closePath();c.fill();}
      c.fillStyle='#e8f4ff';
      for(let i=0;i<3;i++){c.beginPath();c.moveTo(x+3+i*11,y+TS-2);c.lineTo(x+5.5+i*11,y+8);c.lineTo(x+7+i*11,y+TS-2);c.closePath();c.fill();}
    }else if(v===T_DOOR){
      c.fillStyle='#3a2a1a'; rr(c,x-8,y-16,TS+16,TS+16,7);c.fill();
      const g=c.createLinearGradient(x,y-16,x,y+TS);
      g.addColorStop(0,'#ffd23d');g.addColorStop(1,'#ff8fc0');
      c.fillStyle=g; rr(c,x-4,y-12,TS+8,TS+12,5);c.fill();
      c.fillStyle='#fff8c8'; star(c,x+TS/2,y+4,9,G.t*.02,5);c.fill();
      c.fillStyle='#3a2a1a'; ell(c,x+TS-2,y+16,3,3);c.fill();
    }
  }
}

/* ===================== HUD ===================== */
function drawHUD(c){
  const p=G.p, lv=G.lv;
  c.save();
  c.fillStyle='rgba(18,10,32,.52)'; rr(c,10,8,326,54,10); c.fill();
  c.strokeStyle='rgba(255,170,215,.25)';c.lineWidth=1;c.stroke();
  // たいりょく
  c.font='bold 12px ui-rounded,system-ui'; c.textAlign='left'; c.textBaseline='middle';
  c.fillStyle='#b490c4'; c.fillText('たいりょく',20,22);
  for(let i=0;i<p.maxhp;i++){
    const x=88+i*23, y=22;
    c.fillStyle=i<p.hp?'#ff5d78':'rgba(255,255,255,.14)';
    ell(c,x,y,9,9);c.fill();
    if(i<p.hp){c.fillStyle='rgba(255,255,255,.6)';ell(c,x-3,y-3,3,2.4);c.fill();}
  }
  // のこき
  c.fillStyle='#ff9fc8'; ell(c,26,45,9,8.6);c.fill();
  c.fillStyle='#1b1030'; ell(c,23,44,1.6,2.6);c.fill(); ell(c,29,44,1.6,2.6);c.fill();
  c.fillStyle='#fdeaf5'; c.font='bold 14px ui-rounded,system-ui';
  c.fillText('×'+Math.max(0,G.lives),40,45);
  // のうりょく
  c.fillStyle='#b490c4';c.font='bold 12px ui-rounded,system-ui';
  c.fillText('コピー',88,45);
  if(p.ability){ const A=ABL[p.ability];
    c.fillStyle=A.c; star(c,138,45,9,G.t*.03,5);c.fill();
    c.fillStyle='#fdeaf5';c.font='bold 13px ui-rounded,system-ui';c.fillText(A.n,152,45);
  }else{ c.fillStyle='#6a5580';c.font='bold 13px ui-rounded,system-ui';c.fillText('なし',134,45); }
  // スコア
  c.textAlign='right'; c.fillStyle='#ffd23d'; c.font='bold 20px ui-rounded,system-ui';
  c.fillText(String(G.score).padStart(7,'0'),W-14,26);
  c.fillStyle='#b490c4';c.font='bold 12px ui-rounded,system-ui';
  c.fillText(lv.def.name+'  (STAGE '+(G.si+1)+'/4)',W-14,48);
  // むてき
  if(p.invT>0){
    c.textAlign='left';c.fillStyle='#7fd7ff';c.font='bold 13px ui-rounded,system-ui';
    c.fillText('むてき '+Math.ceil(p.invT/60),350,22);
    c.fillStyle='rgba(127,215,255,.3)';c.fillRect(350,30,Math.min(120,p.invT/5),6);
  }
  // ボスHP
  const b=G.boss;
  if(b&&(b.alive||b.dieT<60)&&G.bossIntro<=0){
    const bw=460, bx=(W-bw)/2, by=H-42;
    c.fillStyle='rgba(18,10,32,.6)';rr(c,bx-6,by-20,bw+12,38,9);c.fill();
    c.textAlign='center';c.fillStyle='#fdeaf5';c.font='bold 13px ui-rounded,system-ui';
    c.fillText(BOSS[b.kind].n,W/2,by-8);
    c.fillStyle='rgba(255,255,255,.14)';rr(c,bx,by,bw,12,6);c.fill();
    const r=Math.max(0,b.hp/b.maxhp);
    const g=c.createLinearGradient(bx,0,bx+bw,0);
    g.addColorStop(0,'#ff5d78');g.addColorStop(1,'#ffd23d');
    c.fillStyle=g;rr(c,bx,by,Math.max(2,bw*r),12,6);c.fill();
  }
  // メッセージ
  if(G.msgT>0){
    c.textAlign='center';c.globalAlpha=Math.min(1,G.msgT/24);
    c.font='bold 26px ui-rounded,system-ui';
    c.lineWidth=6;c.strokeStyle='rgba(10,6,20,.85)';c.strokeText(G.msg,W/2,H*.3);
    c.fillStyle='#ffd23d';c.fillText(G.msg,W/2,H*.3);
    c.globalAlpha=1;
  }
  c.restore();
}
/* ===================== えがく ===================== */
function render(){
  const c=ctx, lv=G.lv;
  c.setTransform(1,0,0,1,0,0);
  c.clearRect(0,0,W,H);
  if(!lv)return;
  drawBG(c,lv);
  const sh=G.shake;
  c.save();
  c.scale(Z,Z);
  c.translate(-Math.round(G.camx)+(sh?rnd(-sh,sh):0), -Math.round(G.camy)+(sh?rnd(-sh,sh):0));
  drawTiles(c,lv);
  for(const it of G.items)drawItem(c,it);
  for(const f of G.foes){ if(Math.abs(f.x-G.p.x)<W)drawFoe(c,f); }
  if(G.boss&&(G.boss.alive||G.boss.dieT<90))drawBoss(c,G.boss);
  for(const pr of G.projs)drawProj(c,pr);
  if(G.p.st!=='door'||Math.floor(G.t/4)%2===0)drawPuffy(c,G.p);
  for(const q of G.parts){
    c.globalAlpha=Math.max(0,1-q.t/q.life); c.fillStyle=q.c;
    ell(c,q.x,q.y,q.r,q.r);c.fill();
  }
  c.globalAlpha=1;
  for(const s of G.stars){
    c.save();c.globalAlpha=Math.max(0,1-s.t/s.life);c.translate(s.x,s.y);c.rotate(s.rot);
    c.fillStyle=s.c;star(c,0,0,s.r,0,5);c.fill();
    c.fillStyle='#fff';star(c,0,0,s.r*.42,0,5);c.fill();c.restore();
  }
  c.globalAlpha=1;
  c.textAlign='center';
  for(const t of G.texts){
    c.globalAlpha=Math.max(0,1-t.t/t.life);
    c.font='bold 16px ui-rounded,system-ui';
    c.lineWidth=4;c.strokeStyle='rgba(10,6,20,.8)';c.strokeText(t.s,t.x,t.y);
    c.fillStyle=t.c;c.fillText(t.s,t.x,t.y);
  }
  c.globalAlpha=1;
  c.restore();
  drawHUD(c);
  if(G.bossIntro>0){
    const a=Math.min(1,G.bossIntro/40);
    c.save();c.globalAlpha=a*.34;c.fillStyle='#000';c.fillRect(0,0,W,H);
    c.globalAlpha=a;c.textAlign='center';
    c.font='bold 44px ui-rounded,system-ui';
    c.lineWidth=8;c.strokeStyle='rgba(10,6,20,.9)';
    const n=BOSS[G.lv.def.boss].n;
    c.strokeText(n,W/2,H/2);c.fillStyle='#ff5d78';c.fillText(n,W/2,H/2);
    c.font='bold 18px ui-rounded,system-ui';c.fillStyle='#fdeaf5';
    c.strokeText('あらわれた!',W/2,H/2+38);c.fillText('あらわれた!',W/2,H/2+38);
    c.restore();
  }
  if(G.flash>.01){c.fillStyle='rgba(255,255,255,'+Math.min(1,G.flash)+')';c.fillRect(0,0,W,H);}
  const v=ctx.createRadialGradient(W/2,H/2,H*.45,W/2,H/2,H*.95);
  v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.34)');
  c.fillStyle=v;c.fillRect(0,0,W,H);
}
/* ===================== 更新 ===================== */
function update(){
  G.t++;
  updateFx();
  if(G.state!=='play')return;
  if(G.hitstop>0){G.hitstop--;return;}
  updatePlayer();
  updateFoes();
  updateProjs();
  updateItems();
  updateBoss();
  updateCam();
  const p=G.p;
  if(p.onG&&p.st!=='die'){
    const cp=Math.floor(p.x/(CW*TS))*(CW*TS)+64;
    if(cp>(G.cp||0)&&cp<p.x+200)G.cp=cp;
  }
  if(tapped('p'))pauseGame();
  clearEdge();
}

  }).join('');
  ov(`<h1>STAR PUFF</h1>
  <h3>ほしのパフィ ～ すいこんで コピーだ！～</h3>
  <p>まるい からだで <b>すいこんで</b>、のみこめば てきの ちからが <em>コピー</em>できる！<br>
  そらを ふわふわ とんで、ぜんぶで <b>4ステージ</b>。さいごは <b>デドン大王</b>との けっとう。</p>
  ${KEYHTML}
  <p class="tiny">ハイスコア ${G.best}</p>
  <button class="btn" id="go">はじめる</button>
  <p class="tiny">ステージセレクト</p>
  <div class="sel" id="sel">${sel}</div>`);
  document.getElementById('go').onclick=()=>{actx();resetRun();startStage(0);};
  document.getElementById('sel').onclick=e=>{
    const b=e.target.closest('button'); if(!b)return;
    const i=+b.dataset.st; if(i>G.unlocked)return;
    actx(); resetRun(); startStage(i);
  };
}
function startStage(i){
  ovHide(); G.state='play'; G.cp=64;
  spawnLevel(i);
  msg('STAGE '+(i+1)+'  '+STAGES[i].name,140);
  SFX.ready(); clearEdge();
}
function showClear(bonus){
  const last=G.si>=STAGES.length-1;
  if(last&&G.score>G.best){G.best=G.score;LS.set('sp_best',G.best);}
  ov(`<h2>${last?'クリア おめでとう！':'ステージ クリア！'}</h2>
  <h3>${STAGES[G.si].name}</h3>
  <p>ボーナス <b>+${bonus}</b>（たいりょく ${G.p.hp}／のこき ${G.lives}）<br>
  スコア <em>${G.score}</em></p>
  ${last?`<p>パフィは デドン大王から たべものを とりもどした！<br>
  プププな へいわが もどりました。 <b>ハイスコア ${G.best}</b></p>`:''}
  <button class="btn" id="go">${last?'タイトルへ':'つぎの ステージへ'}</button>`);
  document.getElementById('go').onclick=()=>{
    if(last){ showTitle(); }
    else { startStage(G.si+1); }
  };
}
function showOver(){
  ov(`<h2 style="color:#ff5d78">ゲームオーバー</h2>
  <p>スコア <em>${G.score}</em><br>ハイスコア ${G.best}</p>
  <p class="tiny">${STAGES[G.si].name} で ちからつきた…</p>
  <button class="btn" id="go">もういちど（STAGE ${G.si+1}）</button>
  <button class="btn sub" id="go2">タイトルへ</button>`);
  document.getElementById('go').onclick=()=>{ const s=G.si; resetRun(); G.p=null; startStage(s); };
  document.getElementById('go2').onclick=()=>showTitle();
}
function pauseGame(){
  if(G.state!=='play')return;
  G.state='pause';
  ov(`<h2>ポーズ</h2>
  <p>${STAGES[G.si].name}　スコア <b>${G.score}</b></p>
  ${KEYHTML}
  <button class="btn" id="go">つづける</button>
  <button class="btn sub" id="go2">タイトルへ</button>`);
  document.getElementById('go').onclick=()=>{ovHide();G.state='play';clearEdge();};
  document.getElementById('go2').onclick=()=>showTitle();
}
/* ===================== ループ ===================== */
let last=0,acc=0;
function loop(ts){
  requestAnimationFrame(loop);
  if(!last)last=ts;
  let dt=ts-last; last=ts; if(dt>100)dt=100;
  acc+=dt;
  let n=0;
  while(acc>=16.6667&&n<4){ update(); acc-=16.6667; n++; }
  render();
}
G.lv=buildStage(0); G.p=makePlayer(); G.p.x=120; G.p.y=ENTROW*TS;
if(muted){const b=document.getElementById('mute');b.textContent='♪ OFF';b.style.color='#8f74a6';}
showTitle();
requestAnimationFrame(loop);
addEventListener('keydown',e=>{
  if((e.code==='Escape'||e.code==='KeyP')&&G.state==='pause'){
    const b=document.getElementById('go'); if(b){e.preventDefault();b.click();} return;
  }
  if((e.code==='Enter'||e.code==='Space')&&G.state!=='play'&&performance.now()-(G.ovAt||0)>500){
    const b=document.getElementById('go'); if(b){e.preventDefault();b.click();}
  }
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スーパーマリオ BGM & SFX 8-Bit Synthesizer</title>
    <!-- Google Fonts for Retro Pixel Style -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=DotGothic16&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #5c94fc;
            --panel-bg: rgba(20, 24, 40, 0.88);
            --card-bg: #1c2238;
            --mario-red: #e52521;
            --mario-yellow: #fbd000;
            --mario-green: #43b047;
            --mario-blue: #0078f8;
            --text-color: #ffffff;
            --border-color: #000000;
            --accent-glow: 0 0 15px rgba(251, 208, 0, 0.6);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(255, 255, 255, 0.2) 0%, transparent 20%),
                radial-gradient(circle at 80% 80%, rgba(0, 0, 0, 0.15) 0%, transparent 30%);
            font-family: 'DotGothic16', sans-serif;
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 860px;
            background: var(--panel-bg);
            border: 6px solid #000;
            border-radius: 16px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5), inset 0 2px 4px rgba(255,255,255,0.2);
            padding: 24px;
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        /* Top Banner */
        .header {
            text-align: center;
            margin-bottom: 20px;
            position: relative;
        }

        .header h1 {
            font-family: 'Press Start 2P', cursive;
            font-size: 1.4rem;
            color: var(--mario-yellow);
            text-shadow: 3px 3px 0 #000, -2px -2px 0 var(--mario-red);
            margin: 0 0 10px 0;
            letter-spacing: 1px;
        }

        .header p {
            font-size: 1.1rem;
            color: #d1d5db;
            margin: 0;
        }

        /* Screen Canvas Area */
        .visualizer-container {
            position: relative;
            width: 100%;
            height: 180px;
            background: #000000;
            border: 4px solid #334155;
            border-radius: 10px;
            margin-bottom: 24px;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,255,100,0.1);
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .screen-overlay {
            position: absolute;
            top: 10px;
            left: 14px;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.75rem;
            color: #4ade80;
            text-shadow: 0 0 5px #4ade80;
            pointer-events: none;
            display: flex;
            gap: 20px;
        }

        /* Control Panel Grid */
        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 24px;
        }

        @media (max-width: 680px) {
            .controls-grid {
                grid-template-columns: 1fr;
            }
        }

        .panel-card {
            background: var(--card-bg);
            border: 3px solid #334155;
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .panel-title {
            font-family: 'Press Start 2P', cursive;
            font-size: 0.85rem;
            color: var(--mario-yellow);
            border-bottom: 2px dashed #475569;
            padding-bottom: 8px;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Buttons */
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .btn {
            font-family: 'Press Start 2P', cursive;
            font-size: 0.75rem;
            padding: 12px 16px;
            border: 3px solid #000;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.05s ease, box-shadow 0.05s ease, background-color 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: #fff;
            box-shadow: 0 4px 0 #000;
            flex: 1;
            min-width: 130px;
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #000;
        }

        .btn-main {
            background-color: var(--mario-red);
            font-size: 0.85rem;
            padding: 14px 20px;
        }
        .btn-main:hover { background-color: #ff3b30; }

        .btn-sub {
            background-color: var(--mario-green);
        }
        .btn-sub:hover { background-color: #52c457; }

        .btn-yellow {
            background-color: #d97706;
            color: #fff;
        }
        .btn-yellow:hover { background-color: #f59e0b; }

        .btn-sfx {
            background-color: #3b82f6;
            font-family: 'DotGothic16', sans-serif;
            font-size: 1rem;
            padding: 8px 12px;
            min-width: 90px;
        }
        .btn-sfx:hover { background-color: #60a5fa; }

        /* Slider Controls */
        .slider-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .slider-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.95rem;
            color: #cbd5e1;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 10px;
            background: #0f172a;
            border-radius: 5px;
            border: 2px solid #334155;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 4px;
            background: var(--mario-yellow);
            border: 2px solid #000;
            cursor: pointer;
            box-shadow: 0 2px 0 #000;
        }

        /* Interactive Keyboard */
        .keyboard-section {
            background: var(--card-bg);
            border: 3px solid #334155;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
        }

        .keys-container {
            display: flex;
            justify-content: center;
            gap: 4px;
            height: 120px;
            padding: 10px;
            background: #090d16;
            border-radius: 8px;
            border: 2px solid #000;
            overflow-x: auto;
        }

        .key {
            position: relative;
            flex: 1;
            max-width: 48px;
            background: #ffffff;
            border: 2px solid #000;
            border-radius: 0 0 6px 6px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 8px;
            color: #000;
            font-weight: bold;
            font-size: 0.85rem;
            box-shadow: inset 0 -4px 0 #ccc;
            transition: background 0.1s;
        }

        .key.active, .key:active {
            background: var(--mario-yellow);
            box-shadow: inset 0 -1px 0 #b49300;
            transform: translateY(2px);
        }

        .key.black {
            background: #1e293b;
            color: #fff;
            max-width: 32px;
            height: 65%;
            margin: 0 -16px;
            z-index: 2;
            border-radius: 0 0 4px 4px;
            box-shadow: inset 0 -3px 0 #000;
        }

        .key.black.active, .key.black:active {
            background: var(--mario-red);
        }

        .key-hint {
            font-size: 0.65rem;
            opacity: 0.75;
            font-family: 'Press Start 2P', cursive;
        }

        /* Footer */
        .footer {
            text-align: center;
            font-size: 0.85rem;
            color: #94a3b8;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>SUPER MARIO BGM</h1>
            <p>🎵「たたったたらた～」8-Bit Synth Synthesizer 🎮</p>
        </div>

        <!-- Visualizer Canvas Screen -->
        <div class="visualizer-container">
            <div class="screen-overlay">
                <span id="status-text">STATUS: READY</span>
                <span id="bpm-text">BPM: 200</span>
            </div>
            <canvas id="visualizer"></canvas>
        </div>

        <!-- Controls Grid -->
        <div class="controls-grid">
            <!-- Main Music Player -->
            <div class="panel-card">
                <div class="panel-title">🎼 BGM 演奏</div>
                <div class="btn-group">
                    <button class="btn btn-main" id="btn-intro">
                        ▶ 「たたったたらた～」
                    </button>
                    <button class="btn btn-sub" id="btn-full">
                        ▶ メインテーマ全曲
                    </button>
                    <button class="btn btn-yellow" id="btn-stop">
                        ⏹ 停止
                    </button>
                </div>

                <div class="slider-container">
                    <div class="slider-label">
                        <span>テンポ (BPM)</span>
                        <span id="bpm-val">200</span>
                    </div>
                    <input type="range" id="bpm-slider" min="100" max="260" value="200">
                </div>

                <div class="slider-container">
                    <div class="slider-label">
                        <span>マスター音量</span>
                        <span id="vol-val">70%</span>
                    </div>
                    <input type="range" id="vol-slider" min="0" max="100" value="70">
                </div>
            </div>

            <!-- Sound Effects (SFX) -->
            <div class="panel-card">
                <div class="panel-title">🔊 効果音 (SFX)</div>
                <div class="btn-group">
                    <button class="btn btn-sfx" id="sfx-coin">🟡 コイン</button>
                    <button class="btn btn-sfx" id="sfx-jump">🍄 ジャンプ</button>
                    <button class="btn btn-sfx" id="sfx-oneup">🌟 1UP</button>
                    <button class="btn btn-sfx" id="sfx-pipe">🚰 土管</button>
                    <button class="btn btn-sfx" id="sfx-powerup">🍄 キノコ</button>
                    <button class="btn btn-sfx" id="sfx-gameover">💀 終了</button>
                </div>

                <div class="slider-container" style="margin-top: auto;">
                    <div class="slider-label">
                        <span>音色 (波形)</span>
                        <span id="wave-type-label">矩形波 (Square)</span>
                    </div>
                    <input type="range" id="wave-slider" min="0" max="2" value="0" step="1">
                </div>
            </div>
        </div>

        <!-- Interactive Keyboard -->
        <div class="keyboard-section">
            <div class="panel-title" style="margin-bottom: 12px;">🎹 キーボードで自由に演奏 (鍵盤 / PCキー)</div>
            <div class="keys-container" id="keyboard">
                <!-- White & Black Keys generated via JS -->
            </div>
        </div>

        <!-- Footer Info -->
        <div class="footer">
            Web Audio API 8-Bit Engine | PCキーボード(A,S,D,F,G,H,J,K / Z,X,C...)でも演奏可能
        </div>
    </div>

    <script>
        // --- Web Audio API Context setup ---
        let audioCtx = null;
        let masterGain = null;
        let analyser = null;

        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
                
                masterGain = audioCtx.createGain();
                masterGain.gain.value = 0.7;

                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 64;

                masterGain.connect(analyser);
                analyser.connect(audioCtx.destination);
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // --- Note Frequencies (Hz) ---
        const NOTES = {
            'C3': 130.81, 'C#3': 138.59, 'D3': 146.83, 'D#3': 155.56, 'E3': 164.81, 'F3': 174.61, 'F#3': 185.00, 'G3': 196.00, 'G#3': 207.65, 'A3': 220.00, 'A#3': 233.08, 'B3': 246.94,
            'C4': 261.63, 'C#4': 277.18, 'D4': 293.66, 'D#4': 311.13, 'E4': 329.63, 'F4': 349.23, 'F#4': 369.99, 'G4': 392.00, 'G#4': 415.30, 'A4': 440.00, 'A#4': 466.16, 'B4': 493.88,
            'C5': 523.25, 'C#5': 554.37, 'D5': 587.33, 'D#5': 622.25, 'E5': 659.25, 'F5': 698.46, 'F#5': 739.99, 'G5': 783.99, 'G#5': 830.61, 'A5': 880.00, 'A#5': 932.33, 'B5': 987.77,
            'C6': 1046.50, 'D6': 1174.66, 'E6': 1318.51, 'G6': 1567.98
        };

        // --- Sound Generator Helpers ---
        let currentWaveform = 'square';

        function playTone(freq, duration, time, type = currentWaveform, gainVal = 0.25) {
            if (!freq || freq <= 0) return;
            initAudio();

            const osc = audioCtx.createOscillator();
            const noteGain = audioCtx.createGain();

            osc.type = type;
            osc.frequency.setValueAtTime(freq, time);

            // NES Staccato envelope
            noteGain.gain.setValueAtTime(gainVal, time);
            noteGain.gain.exponentialRampToValueAtTime(0.001, time + duration - 0.005);

            osc.connect(noteGain);
            noteGain.connect(masterGain);

            osc.start(time);
            osc.stop(time + duration);
        }

        // --- Noise Generator (for drums) ---
        function playNoise(duration, time, gainVal = 0.15) {
            initAudio();
            const bufferSize = audioCtx.sampleRate * duration;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }

            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'highpass';
            filter.frequency.value = 1000;

            const noiseGain = audioCtx.createGain();
            noiseGain.gain.setValueAtTime(gainVal, time);
            noiseGain.gain.exponentialRampToValueAtTime(0.01, time + duration);

            noise.connect(filter);
            filter.connect(noiseGain);
            noiseGain.connect(masterGain);

            noise.start(time);
        }

        // --- Mario Music Sequence Definition ---
        // 16th note unit duration: unitTime = (60 / BPM) / 4
        // Format: [note, duration_in_16ths, bass_note, drum]

        // 1. 「たたったたらた～」 Intro Sequence
        const INTRO_SEQUENCE = [
            // E5, E5, _, E5, _, C5, E5, _, G5, _, _, _, G4, _, _, _
            ['E5', 2, 'D3', true],
            ['E5', 2, 'D3', false],
            [null, 2, null, false],
            ['E5', 2, 'D3', true],
            [null, 2, null, false],
            ['C5', 2, 'D3', true],
            ['E5', 2, 'D3', false],
            [null, 2, null, false],
            ['G5', 4, 'G3', true],
            [null, 4, null, false],
            ['G4', 4, 'G2', true],
            [null, 4, null, false]
        ];

        // 2. Main Theme Sequence (Aメロ)
        const MAIN_THEME_SEQUENCE = [
            ...INTRO_SEQUENCE,

            // Block 1
            ['C5', 3, 'G3', true], [null, 1, null, false], ['G4', 3, 'E3', false], [null, 1, null, false], ['E4', 3, 'C3', true], [null, 1, null, false],
            ['A4', 2, 'F3', true], ['B4', 2, 'G3', false], ['A#4', 2, 'F#3', true], ['A4', 2, 'F3', false],
            ['G4', 1.33, 'E3', true], ['E5', 1.33, 'C4', false], ['G5', 1.33, 'E4', true],
            ['A5', 2, 'F4', true], ['F5', 1, 'D4', false], ['G5', 1, 'E4', false],
            [null, 1, null, false], ['E5', 2, 'C4', true], ['C5', 1, 'A3', false], ['D5', 1, 'B3', false], ['B4', 2, 'G3', true],
            [null, 2, null, false],

            // Repeat Block 1 variant
            ['C5', 3, 'G3', true], [null, 1, null, false], ['G4', 3, 'E3', false], [null, 1, null, false], ['E4', 3, 'C3', true], [null, 1, null, false],
            ['A4', 2, 'F3', true], ['B4', 2, 'G3', false], ['A#4', 2, 'F#3', true], ['A4', 2, 'F3', false],
            ['G4', 1.33, 'E3', true], ['E5', 1.33, 'C4', false], ['G5', 1.33, 'E4', true],
            ['A5', 2, 'F4', true], ['F5', 1, 'D4', false], ['G5', 1, 'E4', false],
            [null, 1, null, false], ['E5', 2, 'C4', true], ['C5', 1, 'A3', false], ['D5', 1, 'B3', false], ['B4', 2, 'G3', true],
            [null, 2, null, false],

            // Triplet / Jump section
            [null, 2, null, false], ['G5', 1, 'G3', true], ['F#5', 1, 'F#3', false], ['F5', 1, 'F3', false], ['D#5', 2, 'D#3', true], ['E5', 2, 'E3', false],
            [null, 1, null, false], ['G#4', 1, 'G#3', true], ['A4', 1, 'A3', false], ['C5', 1, 'C4', false], [null, 1, null, false], ['A4', 1, 'A3', true], ['C5', 1, 'C4', false], ['D5', 1, 'D4', false],
            [null, 2, null, false], ['G5', 1, 'G3', true], ['F#5', 1, 'F#3', false], ['F5', 1, 'F3', false], ['D#5', 2, 'D#3', true], ['E5', 2, 'E3', false],
            [null, 1, null, false], ['C6', 2, 'C4', true], [null, 1, null, false], ['C6', 1, 'C4', false], ['C6', 2, 'C4', true],
            [null, 2, null, false]
        ];

        // --- Sequencer Engine ---
        let isPlaying = false;
        let scheduledEvents = [];
        let bpm = 200;

        function stopMusic() {
            isPlaying = false;
            scheduledEvents.forEach(id => clearTimeout(id));
            scheduledEvents = [];
            document.getElementById('status-text').innerText = 'STATUS: STOPPED';
            document.getElementById('status-text').style.color = '#ef4444';
        }

        function playSequence(sequence, loop = false) {
            initAudio();
            stopMusic();

            isPlaying = true;
            document.getElementById('status-text').innerText = 'STATUS: PLAYING 🎶';
            document.getElementById('status-text').style.color = '#4ade80';

            const unitTime = (60 / bpm) / 4; // 16th note duration in seconds
            let startTime = audioCtx.currentTime + 0.05;
            let cumulativeTime = 0;

            sequence.forEach(([note, sixteenths, bassNote, hasDrum]) => {
                const duration = unitTime * sixteenths;
                const time = startTime + cumulativeTime;

                // Schedule Melody (Square wave)
                if (note && NOTES[note]) {
                    playTone(NOTES[note], duration * 0.9, time, currentWaveform, 0.22);
                    
                    // Highlight key visualizer
                    const delayMs = (time - audioCtx.currentTime) * 1000;
                    if (delayMs >= 0) {
                        const timerId = setTimeout(() => {
                            highlightKey(note);
                            createParticle();
                        }, delayMs);
                        scheduledEvents.push(timerId);
                    }
                }

                // Schedule Bass (Triangle wave)
                if (bassNote && NOTES[bassNote]) {
                    playTone(NOTES[bassNote], duration * 0.95, time, 'triangle', 0.35);
                }

                // Schedule Drum (Noise channel)
                if (hasDrum) {
                    playNoise(0.04, time, 0.12);
                }

                cumulativeTime += duration;
            });

            // Loop or finish handling
            const totalDurationMs = cumulativeTime * 1000;
            const endTimer = setTimeout(() => {
                if (isPlaying) {
                    if (loop) {
                        playSequence(sequence, true);
                    } else {
                        stopMusic();
                    }
                }
            }, totalDurationMs);
            scheduledEvents.push(endTimer);
        }

        // --- Sound Effects (SFX) Generator ---
        function playSFX(type) {
            initAudio();
            const now = audioCtx.currentTime;

            switch (type) {
                case 'coin':
                    // Coin: B5 -> E6
                    playTone(NOTES['B5'], 0.08, now, 'square', 0.3);
                    playTone(NOTES['E6'], 0.35, now + 0.08, 'square', 0.3);
                    break;

                case 'jump':
                    // Jump pitch sweep
                    const osc = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.exponentialRampToValueAtTime(600, now + 0.15);
                    g.gain.setValueAtTime(0.3, now);
                    g.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    osc.connect(g);
                    g.connect(masterGain);
                    osc.start(now);
                    osc.stop(now + 0.15);
                    break;

                case 'oneup':
                    // 1UP multi-note
                    const oneUpNotes = ['E5', 'G5', 'E6', 'C6', 'D6', 'G6'];
                    oneUpNotes.forEach((n, i) => {
                        playTone(NOTES[n], 0.08, now + i * 0.07, 'square', 0.25);
                    });
                    break;

                case 'pipe':
                    // Low pitch pipe sound
                    const pOsc = audioCtx.createOscillator();
                    const pGain = audioCtx.createGain();
                    pOsc.type = 'triangle';
                    pOsc.frequency.setValueAtTime(160, now);
                    pOsc.frequency.setValueAtTime(120, now + 0.08);
                    pOsc.frequency.setValueAtTime(90, now + 0.16);
                    pGain.gain.setValueAtTime(0.4, now);
                    pGain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                    pOsc.connect(pGain);
                    pGain.connect(masterGain);
                    pOsc.start(now);
                    pOsc.stop(now + 0.3);
                    break;

                case 'powerup':
                    // Powerup ascending arpeggio
                    const pUpNotes = ['G4', 'B4', 'D5', 'G5', 'B5', 'G4', 'A#4', 'D5', 'F#5', 'A#5'];
                    pUpNotes.forEach((n, i) => {
                        playTone(NOTES[n], 0.05, now + i * 0.04, 'square', 0.2);
                    });
                    break;

                case 'gameover':
                    // Game Over melody
                    const goNotes = [
                        ['C5', 0.15], ['G4', 0.15], ['E4', 0.15],
                        ['A4', 0.12], ['B4', 0.12], ['A4', 0.12], ['G#4', 0.12], ['A#4', 0.12], ['G#4', 0.12],
                        ['G4', 0.4]
                    ];
                    let offset = 0;
                    goNotes.forEach(([n, dur]) => {
                        playTone(NOTES[n], dur, now + offset, 'square', 0.25);
                        offset += dur + 0.02;
                    });
                    break;
            }
        }

        // --- Interactive Keyboard Builder ---
        const KEYBOARD_KEYS = [
            { note: 'C4', label: 'C4', key: 'a', isBlack: false },
            { note: 'C#4', label: 'C#4', key: 'w', isBlack: true },
            { note: 'D4', label: 'D4', key: 's', isBlack: false },
            { note: 'D#4', label: 'D#4', key: 'e', isBlack: true },
            { note: 'E4', label: 'E4', key: 'd', isBlack: false },
            { note: 'F4', label: 'F4', key: 'f', isBlack: false },
            { note: 'F#4', label: 'F#4', key: 't', isBlack: true },
            { note: 'G4', label: 'G4', key: 'g', isBlack: false },
            { note: 'G#4', label: 'G#4', key: 'y', isBlack: true },
            { note: 'A4', label: 'A4', key: 'h', isBlack: false },
            { note: 'A#4', label: 'A#4', key: 'u', isBlack: true },
            { note: 'B4', label: 'B4', key: 'j', isBlack: false },
            { note: 'C5', label: 'C5', key: 'k', isBlack: false },
            { note: 'C#5', label: 'C#5', key: 'o', isBlack: true },
            { note: 'D5', label: 'D5', key: 'l', isBlack: false },
            { note: 'D#5', label: 'D#5', key: 'p', isBlack: true },
            { note: 'E5', label: 'E5', key: ';', isBlack: false },
            { note: 'F5', label: 'F5', key: "'", isBlack: false },
            { note: 'G5', label: 'G5', key: ']', isBlack: false }
        ];

        function buildKeyboard() {
            const kbContainer = document.getElementById('keyboard');
            kbContainer.innerHTML = '';

            KEYBOARD_KEYS.forEach(k => {
                const keyEl = document.createElement('div');
                keyEl.className = `key ${k.isBlack ? 'black' : ''}`;
                keyEl.dataset.note = k.note;

                keyEl.innerHTML = `
                    <span>${k.note}</span>
                    <span class="key-hint">${k.key.toUpperCase()}</span>
                `;

                keyEl.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                    triggerKeyNote(k.note);
                });

                keyEl.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    triggerKeyNote(k.note);
                });

                kbContainer.appendChild(keyEl);
            });
        }

        function triggerKeyNote(note) {
            if (NOTES[note]) {
                playTone(NOTES[note], 0.3, audioCtx ? audioCtx.currentTime : 0);
                highlightKey(note);
                createParticle();
            }
        }

        function highlightKey(note) {
            const keyEl = document.querySelector(`.key[data-note="${note}"]`);
            if (keyEl) {
                keyEl.classList.add('active');
                setTimeout(() => keyEl.classList.remove('active'), 150);
            }
        }

        // --- Canvas Visualizer & Animation Engine ---
        const canvas = document.getElementById('visualizer');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function createParticle() {
            const colors = ['#fbd000', '#e52521', '#43b047', '#0078f8', '#ffffff'];
            particles.push({
                x: Math.random() * canvas.width,
                y: canvas.height - 20,
                vx: (Math.random() - 0.5) * 4,
                vy: -Math.random() * 5 - 3,
                size: Math.random() * 8 + 4,
                color: colors[Math.floor(Math.random() * colors.length)],
                life: 1.0
            });
        }

        function renderVisualizer() {
            requestAnimationFrame(renderVisualizer);

            ctx.fillStyle = 'rgba(5, 8, 18, 0.3)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Frequency Bars if Analyser active
            if (analyser && isPlaying) {
                const bufferLength = analyser.frequencyBinCount;
                const dataArray = new Uint8Array(bufferLength);
                analyser.getByteFrequencyData(dataArray);

                const barWidth = (canvas.width / bufferLength) * 2;
                let x = 0;

                for (let i = 0; i < bufferLength; i++) {
                    const barHeight = (dataArray[i] / 255) * (canvas.height - 30);

                    // 8-bit style bar
                    const gradient = ctx.createLinearGradient(0, canvas.height, 0, 0);
                    gradient.addColorStop(0, '#e52521');
                    gradient.addColorStop(0.5, '#fbd000');
                    gradient.addColorStop(1, '#43b047');

                    ctx.fillStyle = gradient;
                    ctx.fillRect(x, canvas.height - barHeight, barWidth - 3, barHeight);

                    x += barWidth;
                }
            } else {
                // Idle pulse line
                ctx.strokeStyle = '#334155';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(0, canvas.height / 2);
                ctx.lineTo(canvas.width, canvas.height / 2);
                ctx.stroke();
            }

            // Render Particle Effects
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.025;

                if (p.life <= 0) {
                    particles.splice(i, 1);
                    continue;
                }

                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                // Draw retro square particle
                ctx.fillRect(p.x, p.y, p.size, p.size);
                ctx.globalAlpha = 1.0;
            }
        }
        renderVisualizer();

        // --- Event Listeners Setup ---
        document.addEventListener('DOMContentLoaded', () => {
            buildKeyboard();

            // BGM Play Buttons
            document.getElementById('btn-intro').addEventListener('click', () => {
                playSequence(INTRO_SEQUENCE, false);
            });

            document.getElementById('btn-full').addEventListener('click', () => {
                playSequence(MAIN_THEME_SEQUENCE, true);
            });

            document.getElementById('btn-stop').addEventListener('click', () => {
                stopMusic();
            });

            // Sliders
            const bpmSlider = document.getElementById('bpm-slider');
            bpmSlider.addEventListener('input', (e) => {
                bpm = parseInt(e.target.value);
                document.getElementById('bpm-val').innerText = bpm;
                document.getElementById('bpm-text').innerText = `BPM: ${bpm}`;
            });

            const volSlider = document.getElementById('vol-slider');
            volSlider.addEventListener('input', (e) => {
                const val = parseInt(e.target.value) / 100;
                document.getElementById('vol-val').innerText = `${e.target.value}%`;
                if (masterGain) {
                    masterGain.gain.value = val;
                }
            });

            const waveSlider = document.getElementById('wave-slider');
            const waveTypes = ['square', 'triangle', 'sawtooth'];
            const waveLabels = ['矩形波 (Square)', '三角波 (Triangle)', 'ノコギリ波 (Sawtooth)'];
            waveSlider.addEventListener('input', (e) => {
                const idx = parseInt(e.target.value);
                currentWaveform = waveTypes[idx];
                document.getElementById('wave-type-label').innerText = waveLabels[idx];
            });

            // SFX Buttons
            document.getElementById('sfx-coin').addEventListener('click', () => playSFX('coin'));
            document.getElementById('sfx-jump').addEventListener('click', () => playSFX('jump'));
            document.getElementById('sfx-oneup').addEventListener('click', () => playSFX('oneup'));
            document.getElementById('sfx-pipe').addEventListener('click', () => playSFX('pipe'));
            document.getElementById('sfx-powerup').addEventListener('click', () => playSFX('powerup'));
            document.getElementById('sfx-gameover').addEventListener('click', () => playSFX('gameover'));

            // Keyboard PC Shortcuts
            window.addEventListener('keydown', (e) => {
                if (e.repeat) return;
                const keyObj = KEYBOARD_KEYS.find(k => k.key.toLowerCase() === e.key.toLowerCase());
                if (keyObj) {
                    triggerKeyNote(keyObj.note);
                }
            });
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>COOKIE TYCOON クッキー製造帝国</title>
<style>
:root{
  --bg:#241209; --bg2:#3a1e0f;
  --panel:#fff6e6; --panel2:#ffe9c8; --panel3:#ffdca8;
  --line:#d8ad76; --line2:#b98a52;
  --ink:#4a3320; --dim:#8b6f52;
  --gold:#f6b52c; --gold2:#ffe08a;
  --choc:#7b4a25; --choc2:#4e2c12;
  --red:#e0563f; --green:#3fa860; --blue:#4a8fd8; --purple:#9b5fd0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{
  background:var(--bg); color:var(--ink); overflow:hidden;
  font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;
  font-size:14px; line-height:1.45; -webkit-text-size-adjust:100%;
  user-select:none;-webkit-user-select:none; touch-action:manipulation;
}
button{font-family:inherit;color:inherit;cursor:pointer}
#app{position:fixed; inset:0; display:flex}

/* ============ 左：クッキー ============ */
#left{
  position:relative; flex:1 1 auto; min-width:0; display:flex; flex-direction:column;
  background:radial-gradient(120% 90% at 50% 12%, #6b3b1c 0%, #40200f 55%, #241107 100%);
  overflow:hidden;
}
#left::after{content:'';position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 120px rgba(0,0,0,.55)}
#news{
  flex:0 0 auto; position:relative; z-index:3;
  margin:calc(env(safe-area-inset-top) + 6px) 8px 0; padding:5px 10px;
  background:rgba(255,246,230,.92); border:2px solid var(--line2); border-radius:8px;
  font-size:12px; color:#5b4128; overflow:hidden; white-space:nowrap; height:28px;
  display:flex; align-items:center;
}
#newsTxt{display:inline-block; animation:newsIn .5s ease}
@keyframes newsIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#counter{
  flex:0 0 auto; z-index:3; text-align:center; padding:8px 10px 2px; color:#fff5e2;
  text-shadow:0 2px 0 rgba(0,0,0,.5);
}
#cCount{font-size:clamp(20px,4.6vw,34px); font-weight:800; letter-spacing:.5px; line-height:1.15}
#cCount b{color:var(--gold2)}
#cCps{font-size:clamp(11px,2.4vw,14px); color:#e9cfa6; margin-top:1px}
#cBank{font-size:11px;color:#c9a97e;margin-top:1px}
#buffs{
  flex:0 0 auto; z-index:3; display:flex; gap:5px; justify-content:center; flex-wrap:wrap;
  padding:4px 8px; min-height:0;
}
.buff{
  display:flex;align-items:center;gap:4px; font-size:11px;font-weight:700;
  background:linear-gradient(#fff3d0,#ffd97e); color:#6a4410;
  border:2px solid #b8861f; border-radius:999px; padding:1px 8px;
  animation:pop .3s ease;
}
.buff.bad{background:linear-gradient(#ffd6d0,#f09a8a);border-color:#a34b39;color:#6d2417}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
#cookieWrap{position:relative; flex:1 1 auto; min-height:0; z-index:2}
#cv{position:absolute; inset:0; width:100%; height:100%; display:block; cursor:pointer}
.gc{
  position:absolute; width:64px;height:64px; border:0;background:none; padding:0;
  z-index:6; animation:gcIn .35s ease, gcFloat 3s ease-in-out infinite;
  filter:drop-shadow(0 0 14px rgba(255,200,60,.95));
}
.gc.wrath{filter:drop-shadow(0 0 14px rgba(255,60,60,.95))}
.gc span{font-size:52px;line-height:64px;display:block;text-align:center}
@keyframes gcIn{from{transform:scale(0) rotate(-90deg);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes gcFloat{0%,100%{translate:0 0}50%{translate:0 -8px}}
#leftBtns{position:absolute; right:8px; bottom:calc(env(safe-area-inset-bottom) + 8px); z-index:7; display:flex; gap:6px}
.rndBtn{
  width:38px;height:38px;border-radius:50%; border:2px solid var(--line2);
  background:rgba(255,246,230,.92); font-size:17px; display:flex;align-items:center;justify-content:center;
}
.rndBtn.off{opacity:.45}

/* ============ 右：ストア ============ */
#right{
  flex:0 0 auto; width:min(430px,44vw); display:flex; flex-direction:column;
  background:var(--panel); border-left:4px solid var(--line2); min-height:0;
}
#tabs{
  flex:0 0 auto; display:flex; background:var(--panel3); border-bottom:3px solid var(--line2);
  padding-top:env(safe-area-inset-top); overflow-x:auto; scrollbar-width:none;
}
#tabs::-webkit-scrollbar{display:none}
.tab{
  flex:1 0 auto; padding:9px 4px 7px; border:0; background:none; font-size:12px; font-weight:700;
  color:#8b6f52; border-bottom:3px solid transparent; margin-bottom:-3px; white-space:nowrap;
  min-width:52px;
}
.tab.on{color:#6b3f16; background:var(--panel); border-bottom-color:var(--gold)}
.tab .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--red);margin-left:2px;vertical-align:top}
.pane{display:none; flex:1 1 auto; min-height:0; overflow-y:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch}
.pane.on{display:block}
.sect{padding:8px 8px 0; font-size:11px; font-weight:700; color:var(--dim)}

/* 強化グリッド */
#upGrid{display:flex;flex-wrap:wrap;gap:4px;padding:6px 8px 8px}
.up{
  width:46px;height:46px;border-radius:8px; border:2px solid var(--line);
  background:linear-gradient(#fff,#f0dcbb); font-size:22px; position:relative;
  display:flex;align-items:center;justify-content:center; padding:0;
}
.up.can{border-color:var(--gold); background:linear-gradient(#fff6d8,#ffd979); box-shadow:0 0 0 2px rgba(246,181,44,.35)}
.up:not(.can){filter:grayscale(.75); opacity:.55}
.up.more{font-size:14px;font-weight:800;color:#8b6f52;filter:none;opacity:1;border-style:dashed}

/* 建物リスト */
#bList{padding:4px 6px 10px}
.row{
  display:flex; align-items:center; gap:8px; width:100%; text-align:left;
  padding:6px 8px; margin-bottom:4px; border-radius:10px;
  border:2px solid var(--line); background:linear-gradient(#fffaf0,#f4e3c6);
}
.row.can{border-color:var(--gold); background:linear-gradient(#fff8e0,#ffeab5)}
.row:not(.can){opacity:.62; filter:grayscale(.5)}
.ricon{flex:0 0 auto;width:34px;height:34px;border-radius:8px;background:#f3e2c4;border:2px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:19px}
.rmid{flex:1 1 auto;min-width:0}
.rname{display:block;font-weight:800;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rcost{display:block;font-size:12px;font-weight:700;color:#a9752a;white-space:nowrap}
.row.can .rcost{color:#2f7a44}
.rright{flex:0 0 auto;text-align:right;min-width:44px}
.rown{display:block;font-size:20px;font-weight:800;color:#c9a163;line-height:1}
.rcps{display:block;font-size:9px;color:var(--dim);white-space:nowrap}
#buyBar{
  flex:0 0 auto; display:flex; gap:4px; padding:6px; background:var(--panel3);
  border-top:3px solid var(--line2); padding-bottom:calc(env(safe-area-inset-bottom) + 6px);
}
.bb{flex:1 1 0; padding:7px 0; border-radius:8px; border:2px solid var(--line2);
  background:var(--panel2); font-size:12px; font-weight:800; color:#6b4a22}
.bb.on{background:linear-gradient(#ffe7a8,#f6b52c); border-color:#a2701c; color:#4a3005}
.bb.sell.on{background:linear-gradient(#ffd0c6,#e0563f); border-color:#9c3a29; color:#fff}

/* 実績 */
#achWrap{padding:8px}
#achGrid{display:flex;flex-wrap:wrap;gap:4px}
.ach{
  width:42px;height:42px;border-radius:8px;border:2px solid var(--line); position:relative;
  background:linear-gradient(#fff,#efdcbb); display:flex;align-items:center;justify-content:center;
  font-size:20px; padding:0;
}
.ach.got{border-color:var(--gold);background:linear-gradient(#fff8dd,#ffd979)}
.ach:not(.got){filter:grayscale(1) brightness(.9);opacity:.5}
.ach:not(.got) span{visibility:hidden}
.ach:not(.got)::after{content:'?';font-size:17px;font-weight:800;color:#a08a6a;position:absolute}

/* 汎用パネル */
.card{
  margin:8px; padding:10px; border-radius:12px; border:2px solid var(--line);
  background:linear-gradient(#fffaf0,#f7e9d0);
}
.card h3{margin:0 0 6px; font-size:13px; color:#7a5324}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:12px;padding:2px 0;border-bottom:1px dotted #e0cca8}
.kv b{font-weight:800;color:#6b4a22}
.btn{
  display:block;width:100%;padding:9px;margin-top:8px;border-radius:10px;border:2px solid var(--line2);
  background:linear-gradient(#fff3d5,#f6cf7a); font-weight:800;font-size:13px;color:#5c3d12;
}
.btn.warn{background:linear-gradient(#ffd9d0,#f09a8a);border-color:#a34b39;color:#5c1c10}
.btn.go{background:linear-gradient(#ffe8a8,#f6b52c);border-color:#9c6f18}
.btn:disabled{opacity:.45}
.row2{display:flex;gap:6px}
input[type=text],textarea{
  width:100%;padding:7px;border-radius:8px;border:2px solid var(--line);background:#fffdf7;
  font-family:inherit;font-size:12px;color:var(--ink)
}
textarea{height:80px;resize:none;word-break:break-all}
label.chk{display:flex;align-items:center;gap:7px;padding:5px 0;font-size:12px;font-weight:700}
label.chk input{width:17px;height:17px;accent-color:#c98b1e}
select{padding:5px;border-radius:8px;border:2px solid var(--line);background:#fffdf7;font-family:inherit;font-size:12px}
input[type=range]{width:100%;accent-color:#c98b1e}

/* 天界 */
.hv{
  display:flex;gap:8px;align-items:flex-start;padding:7px;margin-bottom:5px;border-radius:10px;
  border:2px solid #9aa8d8;background:linear-gradient(#f2f5ff,#dfe6ff); width:100%; text-align:left;
}
.hv.got{border-color:#f6b52c;background:linear-gradient(#fffbe8,#ffe9ac)}
.hv:not(.got):not(.can){opacity:.55}
.hv .hi{font-size:20px;flex:0 0 auto}
.hv .hn{font-weight:800;font-size:12px}
.hv .hd{font-size:11px;color:#5b5f7a;line-height:1.3}
.hv .hc{font-size:11px;font-weight:800;color:#7a5fb8}

/* ツールチップ */
#tip{
  position:fixed; z-index:60; max-width:min(300px,86vw); pointer-events:none; opacity:0;
  padding:8px 10px; border-radius:10px; border:2px solid var(--line2);
  background:rgba(255,250,240,.98); box-shadow:0 8px 22px rgba(0,0,0,.35);
  font-size:12px; line-height:1.42; transition:opacity .1s;
}
#tip.on{opacity:1}
#tip .tn{font-weight:800;font-size:13px;margin-bottom:2px}
#tip .tc{font-weight:800;color:#a9752a}
#tip .td{color:#6b563c;margin-top:3px}
#tip .tf{color:#96805f;font-style:italic;margin-top:4px;font-size:11px}
#tip .tx{color:#2f7a44;font-weight:700;margin-top:3px}

/* トースト */
#toasts{position:fixed;left:8px;bottom:calc(env(safe-area-inset-bottom) + 8px);z-index:70;display:flex;flex-direction:column;gap:5px}
.toast{
  display:flex;align-items:center;gap:7px;padding:6px 12px 6px 8px;border-radius:10px;
  border:2px solid var(--gold);background:linear-gradient(#fff8dd,#ffdd8e);
  box-shadow:0 5px 16px rgba(0,0,0,.35); font-size:12px; animation:tin .35s ease;
  max-width:min(320px,80vw);
}
.toast .ti{font-size:20px}
.toast b{display:block;font-size:12px}
.toast small{color:#7a5f36;font-size:10px}
@keyframes tin{from{transform:translateX(-110%);opacity:0}to{transform:none;opacity:1}}
.toast.out{animation:tout .4s ease forwards}
@keyframes tout{to{transform:translateX(-110%);opacity:0}}

/* モーダル */
#modal{position:fixed;inset:0;z-index:80;background:rgba(30,15,5,.72);display:none;
  align-items:center;justify-content:center;padding:16px}
#modal.on{display:flex}
#mbox{
  width:min(400px,94vw); max-height:86vh; overflow-y:auto; border-radius:16px;
  border:4px solid var(--line2); background:var(--panel); padding:14px;
  box-shadow:0 18px 50px rgba(0,0,0,.5); animation:pop .25s ease;
}
#mbox h2{margin:0 0 8px;font-size:17px;color:#6b3f16;text-align:center}
#mbox p{margin:5px 0;font-size:13px}
.big{font-size:22px;font-weight:800;color:#b8811d;text-align:center;margin:6px 0}

@media (max-width:860px){
  #app{flex-direction:column}
  #right{width:100%; border-left:0; border-top:4px solid var(--line2); height:53%}
  #left{height:47%}
  .tab{font-size:11px;padding:8px 3px 6px;min-width:48px}
  #tabs{padding-top:0}
  .up{width:42px;height:42px;font-size:20px}
}
</style>
</head>
<body>
<div id="app">
  <div id="left">
    <div id="news"><span id="newsTxt">ようこそ！クッキーを焼こう。</span></div>
    <div id="counter">
      <div id="cCount"><b>0</b> クッキー</div>
      <div id="cCps">毎秒 0</div>
      <div id="cBank"></div>
    </div>
    <div id="buffs"></div>
    <div id="cookieWrap">
      <canvas id="cv"></canvas>
    </div>
    <div id="leftBtns">
      <button class="rndBtn" id="btnMute" title="音のON/OFF (M)">🔊</button>
      <button class="rndBtn" id="btnHelp" title="あそびかた">❓</button>
    </div>
  </div>

  <div id="right">
    <div id="tabs">
      <button class="tab on" data-p="store">🏪 店</button>
      <button class="tab" data-p="up">✨ 強化<span class="dot" id="dotUp" hidden></span></button>
      <button class="tab" data-p="ach">🏆 実績</button>
      <button class="tab" data-p="stat">📊 記録</button>
      <button class="tab" data-p="asc">🌟 転生</button>
      <button class="tab" data-p="set">⚙️ 設定</button>
    </div>

    <div class="pane on" id="pStore">
      <div class="sect" id="upSect">強化アイテム</div>
      <div id="upGrid"></div>
      <div class="sect">建物</div>
      <div id="bList"></div>
    </div>
    <div class="pane" id="pUp"><div id="upDetail"></div></div>
    <div class="pane" id="pAch"><div id="achWrap"></div></div>
    <div class="pane" id="pStat"><div id="statWrap"></div></div>
    <div class="pane" id="pAsc"><div id="ascWrap"></div></div>
    <div class="pane" id="pSet"><div id="setWrap"></div></div>

    <div id="buyBar">
      <button class="bb on" data-n="1">1個</button>
      <button class="bb" data-n="10">10個</button>
      <button class="bb" data-n="100">100個</button>
      <button class="bb" data-n="max">最大</button>
      <button class="bb sell" data-n="sell">売却</button>
    </div>
  </div>
</div>

<div id="tip"></div>
<div id="toasts"></div>
<div id="modal"><div id="mbox"></div></div>

<script>
"use strict";
/* ============================================================
   COOKIE TYCOON  —  データ定義
   ============================================================ */
var NUMFMT='jp';   /* 数値表記モード（設定と同期） */
var JPU=['','万','億','兆','京','垓','秭','穣','溝','澗','正','載','極','恒河沙','阿僧祇','那由他','不可思議','無量大数'];
var ENU=['','K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc','UnD','DuD','TrD','QaD','QiD','SxD','SpD','OcD','NoD','Vg'];
const $  = (s,r)=>(r||document).querySelector(s);
const $$ = (s,r)=>Array.prototype.slice.call((r||document).querySelectorAll(s));
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri =(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];

/* ---------- 建物 ---------- */
const BUILDINGS = [
 {id:'cursor',name:'カーソル',icon:'👆',cost:15,cps:0.1,
  flavor:'カチカチ。指の代わりに、ずっとクリックしてくれる。',
  tiers:['強化された人差し指','手のひらグローブ','自動クリック装置','神経接続マウス','ナノマシンの指先','量子タッチペン','概念上の指']},
 {id:'grandma',name:'おばあちゃん',icon:'👵',cost:100,cps:1,
  flavor:'やさしい手つきで焼いてくれる。たまに不気味な音がする。',
  tiers:['しわしわの手','老眼鏡','ゆりかごの子守唄','秘伝のレシピ帳','若返りの薬','千年の知恵','太古のばあちゃん']},
 {id:'farm',name:'クッキー農場',icon:'🌾',cost:1100,cps:8,
  flavor:'クッキーは畑で採れる。常識だ。',
  tiers:['耕運機','高品質な小麦','化学肥料','遺伝子組換え種','自動収穫ロボ','天候操作装置','永久豊穣の大地']},
 {id:'mine',name:'クッキー鉱山',icon:'⛏️',cost:12000,cps:47,
  flavor:'地層の奥に、チョコの鉱脈が眠っている。',
  tiers:['つるはし強化','ダイヤの削岩機','深層掘削','地核チョコ鉱脈','マグマ精錬炉','惑星コアドリル','星喰みの採掘場']},
 {id:'factory',name:'クッキー工場',icon:'🏭',cost:130000,cps:260,
  flavor:'煙突からは甘い匂いの煙。近所の評判は上々。',
  tiers:['ベルトコンベア','24時間稼働','ロボットアーム','AI生産管理','ナノ組立ライン','軌道上工場','次元プレス機']},
 {id:'bank',name:'クッキー銀行',icon:'🏦',cost:1400000,cps:1400,
  flavor:'預けたクッキーには利息がつく。食べられないけど。',
  tiers:['貯金箱','複利計算','クッキー債券','為替トレード','中央銀行','クッキー本位制','無限信用創造']},
 {id:'temple',name:'クッキー神殿',icon:'⛩️',cost:20000000,cps:7800,
  flavor:'甘味の神をまつる。お供えはもちろんクッキー。',
  tiers:['祭壇の飾り','甘味の祈り','聖なるレシピ','巡礼者の行列','神託のオーブン','神々の宴','創世の聖典']},
 {id:'wizard',name:'魔法の塔',icon:'🪄',cost:330000000,cps:44000,
  flavor:'クッキーを無から生み出す。錬金術より安上がり。',
  tiers:['見習いの杖','呪文書','錬成陣','使い魔の助手','賢者の石釜','星霊召喚','大魔法「無限焼成」']},
 {id:'shipment',name:'宇宙貨物船',icon:'🚀',cost:5100000000,cps:260000,
  flavor:'新鮮なクッキーを他の惑星から輸入する。',
  tiers:['貨物室拡張','超光速エンジン','星間航路','銀河物流網','ワームホール輸送','恒星間艦隊','銀河系宅配便']},
 {id:'alchemy',name:'錬金術ラボ',icon:'⚗️',cost:75000000000,cps:1600000,
  flavor:'金をクッキーに変える。逆じゃない。',
  tiers:['蒸留器','賢者の砂糖','元素変換','黄金レシピ','ホムンクルス職人','万物流転の釜','概念の錬成']},
 {id:'portal',name:'異次元ポータル',icon:'🌀',cost:1000000000000,cps:10000000,
  flavor:'クッキーだらけの世界とつながった。帰れなくなる人もいる。',
  tiers:['安定化リング','座標固定','平行世界の厨房','次元圧縮','無限回廊','多元宇宙市場','全次元同時焼成']},
 {id:'time',name:'タイムマシン',icon:'⏳',cost:14000000000000,cps:65000000,
  flavor:'食べられる前のクッキーを過去から回収してくる。',
  tiers:['時計の調整','過去のレシピ回収','タイムパラドックス活用','時間圧縮炉','因果律の書き換え','永劫回帰オーブン','時間そのものを焼く']},
 {id:'antimatter',name:'反物質凝縮器',icon:'⚛️',cost:170000000000000,cps:430000000,
  flavor:'反物質をクッキーに変換する。触ると消える。',

/* ============================================================
   数値フォーマット
   ============================================================ */
function trimNum(v){
  let s = v>=100? v.toFixed(0) : (v>=10? v.toFixed(1) : v.toFixed(2));
  if(s.indexOf('.')>=0) s=s.replace(/0+$/,'').replace(/\.$/,'');
  return s;
}
function fmt(n){
  if(n===Infinity) return '∞';
  if(!isFinite(n)) return '0';
  if(n<0) return '-'+fmt(-n);
  if(n<1000){
    if(n===0) return '0';
    if(n<1) return String(Math.round(n*1000)/1000);
    if(n<100 && n%1!==0) return String(Math.round(n*10)/10);
    return Math.floor(n).toLocaleString('ja-JP');
  }
  const e=Math.floor(Math.log10(n));
  if(NUMFMT==='jp'){
    const idx=Math.floor(e/4);
    if(idx<=0) return Math.floor(n).toLocaleString('ja-JP');
    if(idx>=JPU.length) return n.toExponential(2).replace('e+','×10^');
    return trimNum(n/Math.pow(10,idx*4))+JPU[idx];
  }else{
    const idx=Math.floor(e/3);
    if(idx<=0) return Math.floor(n).toLocaleString('ja-JP');
    if(idx>=ENU.length) return n.toExponential(2);
    return trimNum(n/Math.pow(10,idx*3))+ENU[idx];
  }
}
function fmtT(sec){
  sec=Math.max(0,Math.floor(sec));
  if(sec<60) return sec+'秒';
  const m=Math.floor(sec/60), h=Math.floor(m/60), d=Math.floor(h/24);
  if(m<60) return m+'分'+(sec%60)+'秒';
  if(h<24) return h+'時間'+(m%60)+'分';
  return d+'日'+(h%24)+'時間';
}

/* ============================================================
   計算
   ============================================================ */
function recalc(){
  const c={ bm:{}, glob:1, clickMult:1, clickFlat:0, clickCpsPct:0, cursorBonus:0,
            goldFreq:1, goldDur:1, goldPow:1, upPrice:1, buildPrice:1,
            kittens:[], offRate:0.5, offCap:8*3600 };
  BUILDINGS.forEach(b=>c.bm[b.id]=1);
  for(const u of UPGRADES) if(S.upgrades[u.id]) u.fx(c);
  for(const h of HEAVENLY) if(S.heavenly[h.id]) h.fx(c);

  const ach=achCount();
  c.milk = ach*0.04;
  for(const k of c.kittens) c.glob *= 1 + c.milk*k;
  if(hasH('legacy')) c.glob *= 1 + S.prestige*0.01;

  const nonCursor = totalB()-bc('cursor');
  c.each={}; c.tot={}; let raw=0;
  for(const b of BUILDINGS){
    let each=b.cps;
    if(b.id==='cursor') each += c.cursorBonus*nonCursor;
    each *= c.bm[b.id]*c.glob;
    c.each[b.id]=each; c.tot[b.id]=each*bc(b.id); raw+=c.tot[b.id];
  }
  c.rawCps=raw;

  let cb=1, kb=1;
  const t=Date.now();
  for(const bf of S.buffs){ if(bf.end>t){ if(bf.cps) cb*=bf.cps; if(bf.click) kb*=bf.click; } }
  c.cpsBuff=cb; c.clickBuff=kb;
  c.wrMult = Math.max(0, 1-0.05*S.wrinklers.length);
  c.cpsNoWr = raw*cb;
  c.cps = c.cpsNoWr*c.wrMult;
  c.click = (1+c.clickFlat)*c.clickMult*kb + c.cpsNoWr*c.clickCpsPct;
  C=c;
  if(c.cps>S.stats.maxCps) S.stats.maxCps=c.cps;
}

function earn(n){ S.cookies+=n; S.totalEarned+=n; S.allTime+=n; }

/* 価格 */
function costOf(b,count){ return Math.ceil(b.cost*Math.pow(1.15,count)*C.buildPrice); }
function bulkCost(b,count,n){
  const r=1.15, base=b.cost*Math.pow(r,count)*C.buildPrice;
  return Math.ceil(base*(Math.pow(r,n)-1)/(r-1));
}
function maxAff(b,count){
  const r=1.15, base=b.cost*Math.pow(r,count)*C.buildPrice;
  if(S.cookies<base) return 0;
  const n=Math.floor(Math.log(S.cookies*(r-1)/base+1)/Math.log(r));
  return Math.max(0,Math.min(n,10000));
}
function buyAmount(b){
  const cnt=bc(b.id);
  if(S.sellMode) return Math.min(cnt, S.buyN==='max'?cnt:S.buyN);
  return S.buyN==='max'? maxAff(b,cnt) : S.buyN;
}
function upCost(u){ return Math.ceil(u.cost*C.upPrice); }

function buyBuilding(id){
  const b=BMAP[id], cnt=bc(id);
  if(S.sellMode){
    const n=Math.min(cnt, S.buyN==='max'?cnt:S.buyN);
    if(n<=0) return false;
    const refund=Math.floor(bulkCost(b,cnt-n,n)*0.25);
    S.buildings[id]=cnt-n; S.cookies+=refund; S.stats.sold+=n;
    sfx('sell'); recalc(); dirtyStore=true; return true;
  }
  const n=S.buyN==='max'? maxAff(b,cnt) : S.buyN;
  if(n<=0) return false;
  const price=bulkCost(b,cnt,n);
  if(S.cookies<price) return false;
  S.cookies-=price;
  S.buildings[id]=cnt+n;
  S.bought[id]=(S.bought[id]||0)+n;
  sfx('buy'); recalc(); dirtyStore=true; dirtyUp=true;
  return true;
}
function buyUpgrade(id){
  const u=UMAP[id]; if(!u||S.upgrades[id]) return false;
  const p=upCost(u);
  if(S.cookies<p) return false;
  S.cookies-=p; S.upgrades[id]=1;
  sfx('up'); recalc(); dirtyUp=true; dirtyStore=true;
  toast(u.icon,'強化：'+u.name,'手に入れた！');
  return true;
}
function availUps(){
  const out=[];
  for(const u of UPGRADES){ if(!S.upgrades[u.id] && u.req()) out.push(u); }
  out.sort((a,b)=>upCost(a)-upCost(b));
  return out;
}

function loadState(raw){
  const d=defState();
  if(!raw||typeof raw!=='object') return d;
  for(const k in d){
    if(!(k in raw)) continue;
    if(k==='settings'||k==='stats'){ Object.assign(d[k],raw[k]||{}); }
    else d[k]=raw[k];
  }
  d.buildings=d.buildings||{}; d.upgrades=d.upgrades||{}; d.achievements=d.achievements||{};
  d.heavenly=d.heavenly||{}; d.buffs=Array.isArray(d.buffs)?d.buffs:[];
  d.wrinklers=Array.isArray(d.wrinklers)?d.wrinklers:[];
  const t=Date.now();
  d.buffs=d.buffs.filter(b=>b&&b.end>t);
  d.runStart=d.runStart||t;
  if(typeof d.buyN!=='number'&&d.buyN!=='max') d.buyN=1;
  return d;
}

function importSave(str){

/* ============================================================
   サウンド（Web Audio 合成）
   ============================================================ */
let AC=null, master=null, bgmTimer=null, bgmStep=0;
function audioInit(){
  if(AC) return;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain(); master.gain.value=S.settings.vol; master.connect(AC.destination);
  }catch(e){ AC=null; }
}
function audioOn(){ return S.settings.sfx && AC && AC.state!=='suspended'; }
function tone(freq,dur,type,vol,at,slide){
  if(!AC||!S.settings.sfx) return;
  const t=AC.currentTime+(at||0);
  const o=AC.createOscillator(), g=AC.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(freq,t);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(20,slide),t+dur);
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(vol||0.2,t+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.03);
}
function noise(dur,vol,freq){
  if(!AC||!S.settings.sfx) return;
  const n=Math.floor(AC.sampleRate*dur);
  const buf=AC.createBuffer(1,n,AC.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);
  const src=AC.createBufferSource(); src.buffer=buf;
  const f=AC.createBiquadFilter(); f.type='bandpass'; f.frequency.value=freq||900; f.Q.value=1.2;
  const g=AC.createGain(); g.gain.value=vol||0.25;
  src.connect(f); f.connect(g); g.connect(master); src.start();
}
function sfx(k){
  if(!AC||!S.settings.sfx) return;
  switch(k){
    case 'click': noise(0.06,0.16,600+Math.random()*500); tone(220+Math.random()*40,0.07,'triangle',0.10); break;
    case 'buy':   tone(523,0.10,'square',0.11); tone(784,0.12,'square',0.09,0.06); break;
    case 'sell':  tone(392,0.10,'square',0.10); tone(262,0.14,'square',0.08,0.06); break;
    case 'up':    tone(659,0.09,'triangle',0.12); tone(880,0.10,'triangle',0.10,0.06); tone(1175,0.16,'triangle',0.09,0.13); break;
    case 'ach':   [523,659,784,1046].forEach((f,i)=>tone(f,0.18,'sine',0.13,i*0.075)); break;
    case 'gcSpawn': tone(1568,0.14,'sine',0.10); tone(2093,0.18,'sine',0.08,0.09); break;
    case 'gcClick': [784,988,1175,1568,2093].forEach((f,i)=>tone(f,0.22,'triangle',0.12,i*0.05)); break;
    case 'wrath': tone(180,0.35,'sawtooth',0.14,0,60); break;
    case 'pop':   noise(0.13,0.28,320); tone(140,0.16,'sine',0.14,0,60); break;
    case 'hit':   noise(0.05,0.14,1400); break;
    case 'asc':   [262,330,392,523,659,784,1046].forEach((f,i)=>tone(f,0.5,'sine',0.11,i*0.11)); break;
  }
}
const BGM_SEQ=[0,4,7,12,7,4,9,4,5,9,12,9,5,2,7,2];
function bgmStart(){
  if(bgmTimer||!AC) return;
  bgmStep=0;
  bgmTimer=setInterval(()=>{
    if(!S.settings.bgm||!S.settings.sfx) return;
    const root=196, n=BGM_SEQ[bgmStep%BGM_SEQ.length];
    tone(root*Math.pow(2,n/12),0.42,'triangle',0.045);
    if(bgmStep%4===0) tone(root/2,0.5,'sine',0.055);
    bgmStep++;
  },340);
}
function bgmStop(){ if(bgmTimer){ clearInterval(bgmTimer); bgmTimer=null; } }

/* ---------- ツールチップ ---------- */
function showTip(html,e){
  elTip.innerHTML=html; elTip.classList.add('on'); posTip(e);
  clearTimeout(tipTimer);
  if(e && e.pointerType && e.pointerType!=='mouse') tipTimer=setTimeout(hideTip,3200);
}
function posTip(e){
  const r=elTip.getBoundingClientRect();
  let x=(e&&e.clientX!=null?e.clientX:innerWidth/2)-r.width-14;
  let y=(e&&e.clientY!=null?e.clientY:innerHeight/2)-r.height/2;
  if(x<8) x=(e&&e.clientX!=null?e.clientX:0)+16;
  x=clamp(x,8,innerWidth-r.width-8);
  y=clamp(y,8,innerHeight-r.height-8);
  elTip.style.left=x+'px'; elTip.style.top=y+'px';
}
function hideTip(){ elTip.classList.remove('on'); }
function bindTip(el,getHtml,onClick){
  let lp=null,sup=false;
  el.addEventListener('pointerenter',e=>{ if(e.pointerType==='mouse') showTip(getHtml(),e); });
  el.addEventListener('pointermove',e=>{ if(e.pointerType==='mouse'&&elTip.classList.contains('on')) posTip(e); });
  el.addEventListener('pointerleave',hideTip);
  el.addEventListener('pointerdown',e=>{
    audioInit();
    if(e.pointerType!=='mouse'){ sup=false; clearTimeout(lp); lp=setTimeout(()=>{ sup=true; showTip(getHtml(),e); },380); }
  });
  el.addEventListener('pointerup',e=>{ clearTimeout(lp); if(!sup&&onClick) onClick(e); sup=false; });
  el.addEventListener('pointercancel',()=>{ clearTimeout(lp); sup=false; });
}

/* ============================================================
   キャンバス（クッキー・演出・シワクチャ）
   ============================================================ */
const cv=$('#cv'), ctx=cv.getContext('2d');
const wrap=$('#cookieWrap');
let W=300,H=300,DPR=1,CX=150,CY=150,R=90;
let press=0, hover=false, spin=0, tsec=0;
const parts=[], floats=[];
const CHIPS=[];
(function(){ // チョコチップ配置（固定シード）
  let s=20240501;
  const rr=()=>{ s=(s*1103515245+12345)&0x7fffffff; return s/0x7fffffff; };
  for(let i=0;i<14;i++){
    const a=rr()*Math.PI*2, d=Math.sqrt(rr())*0.74;
    CHIPS.push({a:a,d:d,r:0.085+rr()*0.05,rot:rr()*Math.PI});
  }
})();

function resize(){
  const r=wrap.getBoundingClientRect();
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=Math.max(80,r.width); H=Math.max(80,r.height);
  cv.width=Math.floor(W*DPR); cv.height=Math.floor(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  CX=W/2; CY=H*0.48; R=Math.max(46,Math.min(W,H)*0.31);
}
addEventListener('resize',()=>{ resize(); });

function addFloat(x,y,txt,col){
  if(floats.length>26) floats.shift();
  floats.push({x:x,y:y,t:0,txt:txt,col:col||'#fff2d0',vy:-38-Math.random()*16,vx:rnd(-14,14)});
}
function crumbs(x,y,n){
  if(!S.settings.fx) return;
  n=n||9;
  for(let i=0;i<n;i++){
    if(parts.length>170) break;
    const a=rnd(0,Math.PI*2), sp=rnd(60,230);
    parts.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-60,t:0,life:rnd(.5,1.0),
      s:rnd(2.5,6),rot:rnd(0,6.3),vr:rnd(-9,9),c:Math.random()<0.34?'#5a3517':'#c98b46'});
  }
}
function stepParts(dt){
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i]; p.t+=dt;
    if(p.t>=p.life){ parts.splice(i,1); continue; }
    p.vy+=680*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.rot+=p.vr*dt;
  }
  for(let i=floats.length-1;i>=0;i--){
    const f=floats[i]; f.t+=dt;
    if(f.t>=1.1){ floats.splice(i,1); continue; }
    f.y+=f.vy*dt; f.x+=f.vx*dt; f.vy*=0.965;
  }
}

function drawCookie(){
  const sc=1-press*0.075;
  ctx.save(); ctx.translate(CX,CY); ctx.scale(sc,sc);
  // 影
  ctx.globalAlpha=.35; ctx.fillStyle='#150a04';
  ctx.beginPath(); ctx.ellipse(0,R*0.96,R*0.86,R*0.2,0,0,7); ctx.fill(); ctx.globalAlpha=1;
  // 光背
  const glow=ctx.createRadialGradient(0,0,R*0.6,0,0,R*1.7);
  glow.addColorStop(0,'rgba(255,205,120,'+(0.22+press*0.25)+')');
  glow.addColorStop(1,'rgba(255,205,120,0)');
  ctx.fillStyle=glow; ctx.beginPath(); ctx.arc(0,0,R*1.7,0,7); ctx.fill();
  // 本体
  ctx.rotate(spin);
  const g=ctx.createRadialGradient(-R*0.3,-R*0.35,R*0.1,0,0,R);
  g.addColorStop(0,'#f0c483'); g.addColorStop(.55,'#d59a52'); g.addColorStop(1,'#a9702f');
  ctx.beginPath();
  for(let i=0;i<=48;i++){
    const a=i/48*Math.PI*2, rr=R*(1+Math.sin(a*7)*0.017+Math.sin(a*3+1)*0.012);
    i? ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr) : ctx.moveTo(Math.cos(a)*rr,Math.sin(a)*rr);
  }
  ctx.closePath(); ctx.fillStyle=g; ctx.fill();
  ctx.lineWidth=Math.max(2,R*0.045); ctx.strokeStyle='rgba(120,74,26,.55)'; ctx.stroke();
  // 焼きムラ
  ctx.globalAlpha=.16; ctx.fillStyle='#8a5520';
  for(let i=0;i<10;i++){
    const a=i*2.399, d=Math.sqrt((i+1)/11)*R*0.8;
    ctx.beginPath(); ctx.arc(Math.cos(a)*d,Math.sin(a)*d,R*0.07,0,7); ctx.fill();
  }
  ctx.globalAlpha=1;
  // チョコチップ
  CHIPS.forEach(c=>{
    const x=Math.cos(c.a)*c.d*R, y=Math.sin(c.a)*c.d*R, s=c.r*R;
    ctx.save(); ctx.translate(x,y); ctx.rotate(c.rot);
    ctx.fillStyle='#4a2a10';
    ctx.beginPath(); ctx.moveTo(-s,-s*0.75);
    ctx.quadraticCurveTo(s*0.2,-s*1.05,s,-s*0.5);
    ctx.quadraticCurveTo(s*1.1,s*0.55,0,s);
    ctx.quadraticCurveTo(-s*1.15,s*0.5,-s,-s*0.75);
    ctx.fill();
    ctx.fillStyle='rgba(255,220,180,.28)';
    ctx.beginPath(); ctx.ellipse(-s*0.25,-s*0.3,s*0.34,s*0.2,-0.5,0,7); ctx.fill();
    ctx.restore();
  });
  // ハイライト
  ctx.globalAlpha=.2; ctx.fillStyle='#fff8e6';
  ctx.beginPath(); ctx.ellipse(-R*0.34,-R*0.4,R*0.28,R*0.16,-0.7,0,7); ctx.fill();
  ctx.globalAlpha=1;
  ctx.restore();
}

function drawWrinklers(){
  if(!S.wrinklers.length) return;
  S.wrinklers.forEach(w=>{
    const a=w.a, wob=Math.sin(tsec*2.2+w.p)*0.05;
    const d=R*(1.28+w.grow*0.1)+Math.sin(tsec*1.6+w.p)*3;
    const x=CX+Math.cos(a+wob)*d, y=CY+Math.sin(a+wob)*d;
    w.sx=x; w.sy=y; w.sr=R*0.30;
    // 触手
    ctx.strokeStyle='#6b4a63'; ctx.lineWidth=Math.max(3,R*0.06); ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(CX+Math.cos(a)*R*0.86,CY+Math.sin(a)*R*0.86);
    ctx.quadraticCurveTo(CX+Math.cos(a+0.25)*d*0.75,CY+Math.sin(a+0.25)*d*0.75,x,y);
    ctx.stroke();
    // 体
    ctx.save(); ctx.translate(x,y); ctx.rotate(a+Math.PI/2+wob);
    const s=w.sr, sq=1+Math.sin(tsec*3+w.p)*0.06;
    const gg=ctx.createLinearGradient(0,-s,0,s);
    gg.addColorStop(0,'#8b6280'); gg.addColorStop(1,'#4c3247');
    ctx.fillStyle=gg;
    ctx.beginPath(); ctx.ellipse(0,0,s*0.72/sq,s*sq,0,0,7); ctx.fill();
    ctx.strokeStyle='#33202f'; ctx.lineWidth=2; ctx.stroke();
    ctx.fillStyle='#ffe9a8';
    ctx.beginPath(); ctx.arc(-s*0.24,-s*0.28,s*0.14,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(s*0.24,-s*0.28,s*0.14,0,7); ctx.fill();
    ctx.fillStyle='#2b1522';
    ctx.beginPath(); ctx.arc(-s*0.24,-s*0.26,s*0.06,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(s*0.24,-s*0.26,s*0.06,0,7); ctx.fill();
    ctx.restore();
    // HPバー
    if(w.hp<3){
      ctx.fillStyle='rgba(0,0,0,.45)'; ctx.fillRect(x-16,y-w.sr-11,32,5);
      ctx.fillStyle='#ff8a5c'; ctx.fillRect(x-15,y-w.sr-10,30*(w.hp/3),3);
    }
  });
}

function drawMilk(){
  const milk=Math.min(2.6,achCount()*0.04);
  const h=6+milk*17;
  if(h<=6&&achCount()===0) return;
  ctx.save();
  ctx.fillStyle='rgba(255,252,244,.93)';
  ctx.beginPath(); ctx.moveTo(0,H);
  ctx.lineTo(0,H-h);
  for(let x=0;x<=W;x+=8) ctx.lineTo(x,H-h+Math.sin(x*0.035+tsec*1.3)*3.2);
  ctx.lineTo(W,H); ctx.closePath(); ctx.fill();
  ctx.fillStyle='rgba(226,214,196,.55)';
  ctx.beginPath(); ctx.moveTo(0,H);
  ctx.lineTo(0,H-h*0.55);
  for(let x=0;x<=W;x+=8) ctx.lineTo(x,H-h*0.55+Math.sin(x*0.045-tsec*1.7)*2.4);
  ctx.lineTo(W,H); ctx.closePath(); ctx.fill();
  ctx.restore();
}

function draw(){
  ctx.clearRect(0,0,W,H);
  drawMilk();
  drawWrinklers();
  drawCookie();
  // かけら
  parts.forEach(p=>{
    const al=1-p.t/p.life;
    ctx.save(); ctx.globalAlpha=al; ctx.translate(p.x,p.y); ctx.rotate(p.rot);
    ctx.fillStyle=p.c; ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s); ctx.restore();
  });
  // 数字
  ctx.textAlign='center'; ctx.font='700 15px system-ui,sans-serif';
  floats.forEach(f=>{
    const al=1-f.t/1.1;
    ctx.globalAlpha=al; ctx.fillStyle='rgba(0,0,0,.5)';
    ctx.fillText(f.txt,f.x+1,f.y+1);
    ctx.fillStyle=f.col; ctx.fillText(f.txt,f.x,f.y);
  });
  ctx.globalAlpha=1;
}

/* ---------- クリック ---------- */
function clickCookie(x,y){
  const g=C.click;
  earn(g); S.handMade+=g; S.clicks++;
  press=1; spin+=rnd(-0.04,0.04);
  addFloat(x,y-10,'+'+fmt(g));
  crumbs(x,y);
  sfx('click');
  dirtyStore=true;
}
function canvasPos(e){
  const r=cv.getBoundingClientRect();
  return {x:e.clientX-r.left, y:e.clientY-r.top};
}
cv.addEventListener('pointerdown',e=>{
  audioInit();
  const p=canvasPos(e);
  for(let i=S.wrinklers.length-1;i>=0;i--){
    const w=S.wrinklers[i];
    if(w.sx!=null && Math.hypot(p.x-w.sx,p.y-w.sy)<w.sr*1.25){ hitWrinkler(i,p); return; }
  }
  if(Math.hypot(p.x-CX,p.y-CY)<=R*1.02) clickCookie(p.x,p.y);
});
cv.addEventListener('contextmenu',e=>e.preventDefault());

/* ---------- シワクチャ ---------- */
function wrinklersUnlocked(){ return S.ascensions>=1; }
function spawnWrinkler(){
  if(S.wrinklers.length>=10) return;
  const a=rnd(0,Math.PI*2);
  S.wrinklers.push({a:a,p:rnd(0,6.3),hp:3,belly:0,grow:0});
  recalc();
  if(S.wrinklers.length===1) toast('🐛','シワクチャが現れた','生産を食べるが、つぶすと食べたぶんを1.1倍で返す。');
}
function hitWrinkler(i,p){
  const w=S.wrinklers[i];
  w.hp--; sfx('hit');
  crumbs(w.sx,w.sy,5);
  if(w.hp<=0){
    const gain=w.belly*1.1;
    earn(gain); S.wrinklersPopped++;
    S.wrinklers.splice(i,1);
    sfx('pop'); addFloat(w.sx,w.sy,'+'+fmt(gain),'#ffd2ec');
    toast('🐛','シワクチャをつぶした','+'+fmt(gain)+' クッキー');
    recalc(); dirtyStore=true;
  }
}

/* ============================================================
   ゴールデンクッキー
   ============================================================ */
let gcEl=null, gcDie=0, gcWrath=false;
function removeGolden(){ if(gcEl){ gcEl.remove(); gcEl=null; } }
function goldenInterval(){ return rnd(60,150)/Math.max(0.2,C.goldFreq); }
function spawnGolden(){
  if(gcEl) return;
  gcWrath = S.ascensions>=1 && Math.random()<0.14;
  const el=document.createElement('button');
  el.className='gc'+(gcWrath?' wrath':'');
  el.innerHTML='<span>'+(gcWrath?'🔴':'🍪')+'</span>';
  const pad=40;
  el.style.left=rnd(pad,Math.max(pad+1,wrap.clientWidth-pad-64))+'px';
  el.style.top =rnd(pad,Math.max(pad+1,wrap.clientHeight-pad-64))+'px';
  el.addEventListener('pointerdown',e=>{ e.stopPropagation(); audioInit(); clickGolden(); });
  wrap.appendChild(el); gcEl=el;
  gcDie=Date.now()+13000*C.goldDur;
  sfx('gcSpawn');
}
function clickGolden(){
  if(!gcEl) return;
  const x=gcEl.offsetLeft+32, y=gcEl.offsetTop+32;
  removeGolden();
  S.goldenClicks++;
  sfx(gcWrath?'wrath':'gcClick');
  applyGolden(gcWrath,x,y);
  S.goldenAt=Date.now()+goldenInterval()*1000;
  dirtyStore=true;
}
function applyGolden(wrath,x,y){
  const pw=C.goldPow, dur=C.goldDur, r=Math.random();
  const luckyAmt=()=>Math.min(S.cookies*0.15, C.cps*900+13)*pw;
  const show=(icon,name,txt,col)=>{ addFloat(x,y,txt,col||'#ffe9a0'); toast(icon,name,txt); };
  if(wrath){
    if(r<0.40){
      addBuff({id:'ruin',name:'不運',icon:'💀',cps:0.5,dur:66*dur,bad:1});
      show('💀','不運','66秒間、生産が半分に…');
    }else if(r<0.70){
      addBuff({id:'curse',name:'呪い',icon:'🕸️',click:0.3,dur:30*dur,bad:1});
      show('🕸️','呪い','30秒間、クリックが弱くなる…');
    }else{
      const g=luckyAmt()*1.5; earn(g); S.stats.luckyTotal+=g;
      show('🩸','血のめぐみ','+'+fmt(g)+' クッキー','#ffb0b0');
    }
    return;
  }
  if(r<0.34){
    const g=luckyAmt(); earn(g); S.stats.luckyTotal+=g;
    show('🍀','幸運','+'+fmt(g)+' クッキー');
  }else if(r<0.64){
    const m=pw>1?10:7;
    addBuff({id:'frenzy',name:'熱狂 ×'+m,icon:'🔥',cps:m,dur:77*dur});
    show('🔥','熱狂','77秒間、生産が'+m+'倍！');
  }else if(r<0.77){
    addBuff({id:'cfrenzy',name:'連打祭 ×777',icon:'👊',click:777,dur:13*dur});
    show('👊','連打祭','13秒間、クリックが777倍！');
  }else if(r<0.87){
    const g=C.cps*300*pw; earn(g);
    show('🏭','特需','+'+fmt(g)+' クッキー（生産300秒ぶん）');
  }else if(r<0.94){
    addBuff({id:'dragon',name:'豊穣 ×15',icon:'🐉',cps:15,dur:60*dur});
    show('🐉','豊穣の収穫','60秒間、生産が15倍！');
  }else{
    const msgs=['ただのクッキーだった。','おいしい。','これは、ただのごほうび。'];
    const g=Math.max(13,C.cps*13); earn(g);
    show('✨','ごほうび',pick(msgs)+' +'+fmt(g));
  }
}
function tickGolden(){
  const t=Date.now();
  if(gcEl){
    if(t>gcDie){ removeGolden(); S.goldenMissed++; S.goldenAt=t+goldenInterval()*1000; }
    return;
  }
  if(!S.goldenAt||S.goldenAt<t-3600000) S.goldenAt=t+goldenInterval()*1000;
  if(t>=S.goldenAt) spawnGolden();
}

/* ============================================================
   メインループ
   ============================================================ */
let lastT=performance.now(), accSave=0, accUI=0, accAch=0, accWr=0, wrNext=45;
function frame(now){
  const dt=Math.min(0.3,(now-lastT)/1000); lastT=now; tsec+=dt;
  press=Math.max(0,press-dt*5.5);
  spin*=0.94;

  if(C.cps>0) earn(C.cps*dt);
  if(S.wrinklers.length){
    const eat=C.cpsNoWr*0.05*dt;
    S.wrinklers.forEach(w=>{ w.belly+=eat; w.grow=Math.min(1,w.belly/Math.max(1,C.cpsNoWr*120)); });
  }
  stepParts(dt);
  tickBuffs(); tickGolden();

  accUI+=dt;
  if(accUI>=0.1){
    accUI=0;
    updateHUD(); updateRows(); buildUpGrid(); updateBuffTimes();
    if(curTab==='stat') renderStats();
  }
  accAch+=dt;
  if(accAch>=0.5){ accAch=0; checkAch(); newsTick(); updateTitle(); }
  accSave+=dt;
  if(accSave>=30){ accSave=0; save(true); }
  if(wrinklersUnlocked()&&C.cps>0){
    accWr+=dt;
    if(accWr>=wrNext){ accWr=0; wrNext=rnd(35,80); spawnWrinkler(); }
  }
  draw();
  requestAnimationFrame(frame);
}
function updateHUD(){
  elCount.innerHTML='<b>'+fmt(Math.floor(S.cookies))+'</b> クッキー';
  elCps.textContent='毎秒 '+fmt(C.cps)+'　／　クリック +'+fmt(C.click);
  const bits=[];
  if(S.bakery) bits.push(S.bakery+'のクッキー工房');
  if(S.prestige>0) bits.push('転生Lv'+fmt(S.prestige)+(hasH('legacy')?'(+'+fmt(S.prestige)+'%)':''));
  if(achCount()>0) bits.push('ミルク'+(achCount()*4)+'%');
  if(S.wrinklers.length) bits.push('シワクチャ'+S.wrinklers.length+'匹(-'+(S.wrinklers.length*5)+'%)');
  elBank.textContent=bits.join('　');
}

/* ============================================================
   オフライン報酬・ヘルプ
   ============================================================ */
function offlineReward(){
  const dt=(Date.now()-(S.lastSave||Date.now()))/1000;
  if(dt<120||C.cps<=0) return;
  const eff=Math.min(dt,C.offCap);
  const gain=C.cps*eff*C.offRate;
  if(gain<1) return;
  earn(gain);
  openModal('<h2>🍪 おかえりなさい！</h2>'+
    '<p>留守のあいだ（'+fmtT(dt)+'）に、お店はクッキーを焼き続けていました。</p>'+
    '<div class="big">+'+fmt(gain)+'</div>'+
    '<p style="font-size:12px;color:#8b6f52">オフライン生産は効率'+Math.round(C.offRate*100)+'％・最大'+fmtT(C.offCap)+'ぶんです。'+
    (hasH('sand')?'':'（天界の強化「時の砂」で強化できます）')+'</p>'+
    '<button class="btn go" id="mOk">受け取る</button>');
  $('#mOk').onclick=closeModal;
}
function showHelp(){
  openModal('<h2>🍪 あそびかた</h2>'+
   '<p style="font-size:12px;line-height:1.7">'+
   '・大きなクッキーを<b>クリック／タップ</b>してクッキーを焼く。<br>'+
   '・たまったクッキーで<b>建物</b>を買うと、自動でクッキーが増える。<br>'+
   '・<b>強化アイテム</b>は建物の数などで解放される。長押し（PCはホバー）で効果を確認。<br>'+
   '・ときどき現れる<b>ゴールデンクッキー</b>をクリックすると大きなボーナス。<br>'+
   '・<b>実績</b>を集めるとミルクが増え、<b>子ねこ</b>の強化が強くなる。<br>'+
   '・行きづまったら<b>転生</b>。すべて失うかわりに、永久ボーナスの「天界のかけら」が手に入る。<br>'+
   '・転生後は<b>シワクチャ</b>が出現。生産を食べるが、つぶすと食べたぶんを1.1倍で返す。<br>'+
   '・閉じているあいだも<b>オフライン生産</b>があります。</p>'+
   '<button class="btn go" id="mOk">はじめる</button>');
  $('#mOk').onclick=closeModal;
}

/* ============================================================
   キーボード
   ============================================================ */
addEventListener('keydown',e=>{
  if(e.target&&/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  const k=e.key.toLowerCase();
  if(k===' '||e.code==='Space'){ e.preventDefault(); audioInit(); clickCookie(CX+rnd(-R*.5,R*.5),CY+rnd(-R*.5,R*.5)); }
  else if(k==='m'){ S.settings.sfx=!S.settings.sfx; updateMuteBtn(); if(curTab==='set') buildSettings(); }
  else if(k==='s'){ S.sellMode=!S.sellMode; updateBuyBar(); dirtyStore=true; }
  else if(k>='1'&&k<='4'){ S.buyN=[1,10,100,'max'][parseInt(k,10)-1]; S.sellMode=false; updateBuyBar(); dirtyStore=true; }
  else if(k==='escape'){ closeModal(); }
});
$('#btnMute').addEventListener('click',()=>{
  audioInit(); S.settings.sfx=!S.settings.sfx; updateMuteBtn();
  if(S.settings.sfx&&S.settings.bgm) bgmStart();
  if(curTab==='set') buildSettings();
});
$('#btnHelp').addEventListener('click',showHelp);
document.addEventListener('visibilitychange',()=>{ if(document.hidden) save(true); });
addEventListener('pagehide',()=>save(true));
addEventListener('pointerdown',()=>{ audioInit(); if(AC&&AC.state==='suspended') AC.resume(); },{passive:true});

/* ============================================================
   起動
   ============================================================ */
function init(){
  const fresh=!load();
  if(/[?&]mute/.test(location.search)) S.settings.sfx=false;
  NUMFMT=S.settings.numFmt||'jp';
  recalc();
  resize();
  rebuildAll();
  setTab('store');
  updateHUD(); newsTick(true); updateTitle();
  if(!fresh) offlineReward(); else setTimeout(showHelp,400);
  if(S.settings.bgm){ audioInit(); bgmStart(); }
  setTimeout(resize,60);
  requestAnimationFrame(t=>{ lastT=t; frame(t); });
}
init();
</script>

/* ---------- 基本定数 ---------- */

var gc=document.getElementById('game'), g=gc.getContext('2d');
var uc=document.getElementById('ui'), u=uc.getContext('2d');

function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function rnd(a,b){return a+Math.random()*(b-a);}
function rndi(a,b){return Math.floor(a+Math.random()*(b-a+1));}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function hash2(x,y){var h=(x*374761393+y*668265263)|0;h=((h^(h>>>13))*1274126177)|0;return((h^(h>>>16))>>>0)/4294967296;}
function noise2(x,y){
  var xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
  var sx=xf*xf*(3-2*xf), sy=yf*yf*(3-2*yf);
  var a=hash2(xi,yi), b=hash2(xi+1,yi), c=hash2(xi,yi+1), d=hash2(xi+1,yi+1);
  var ab=a+(b-a)*sx, cd=c+(d-c)*sx;
  return ab+(cd-ab)*sy;
}
function fbm(x,y){return noise2(x,y)*0.6+noise2(x*2.1+13,y*2.1+7)*0.3+noise2(x*4.3+31,y*4.3+17)*0.1;}

  uc.width=Math.floor(DW*dpr); uc.height=Math.floor(DH*dpr);
  uc.style.width=DW+'px'; uc.style.height=DH+'px';
  u.setTransform(dpr,0,0,dpr,0,0);
}

var muted=false, AC=null, audioDead=false;
function ac(){
  if(muted||audioDead) return null;
  if(!AC){
    try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }
    catch(e){ audioDead=true; return null; }
    if(!AC){ audioDead=true; return null; }
  }
  if(AC.state==='suspended'){ try{AC.resume();}catch(e){} }
  return AC;
}
function tone(f,dur,type,vol,slideTo,delay){
  var c=ac(); if(!c) return;
  var t=c.currentTime+(delay||0);
  var o=c.createOscillator(), gn=c.createGain();
  o.type=type||'square';
  o.frequency.setValueAtTime(f,t);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20,slideTo),t+dur);
  gn.gain.setValueAtTime(0.0001,t);
  gn.gain.exponentialRampToValueAtTime(vol||0.1,t+0.008);
  gn.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(gn); gn.connect(c.destination);
  o.start(t); o.stop(t+dur+0.03);
}
function noiseSfx(dur,vol,hp,delay){
  var c=ac(); if(!c) return;
  var t=c.currentTime+(delay||0);
  var len=Math.max(1,Math.floor(c.sampleRate*dur));
  var buf=c.createBuffer(1,len,c.sampleRate), d=buf.getChannelData(0);
  for(var i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
  var src=c.createBufferSource(); src.buffer=buf;
  var f=c.createBiquadFilter(); f.type='highpass'; f.frequency.value=hp||600;
  var gn=c.createGain(); gn.gain.value=vol||0.12;
  src.connect(f); f.connect(gn); gn.connect(c.destination);
  src.start(t);
}

function playBGM(n){
  if(BGM.name===n) return;
  stopBGM(); BGM.name=n; BGM.step=0;
  var tr=TRACKS[n]; if(!tr) return;
  BGM.timer=setInterval(function(){
    if(muted||audioDead) return;
    var s=BGM.step%tr.mel.length;
    var mn=tr.mel[s], bn=tr.bas[s];
    if(mn) tone(m2f(mn),tr.t/1000*1.4,'square',0.040);
    if(bn) tone(m2f(bn-12),tr.t/1000*1.3,'triangle',0.050);
    BGM.step++;
  },tr.t);
}
function stopBGM(){ if(BGM.timer){clearInterval(BGM.timer);BGM.timer=null;} BGM.name=null; }
function toggleMute(){
  muted=!muted;
  if(muted){ BGM.pending=BGM.name; stopBGM(); if(AC){try{AC.suspend();}catch(e){}} }
  else { if(AC){try{AC.resume();}catch(e){}} if(BGM.pending){ var p=BGM.pending; BGM.pending=null; playBGM(p); } }
}

function newMap(id,w,h,fill,opt){
  var t=[],x,y;
  for(y=0;y<h;y++){ var r=[]; for(x=0;x<w;x++) r.push(fill); t.push(r); }
  var m={id:id,w:w,h:h,t:t,objs:[],npcs:[],warps:[],fixed:[],theme:'field',
         bgm:'field',dark:0,spawn:null,name:'',structs:[]};
  if(opt) for(var k in opt) m[k]=opt[k];
  return m;
}
function mIn(m,x,y){ return x>=0&&y>=0&&x<m.w&&y<m.h; }
function mSet(m,x,y,c){ if(mIn(m,x,y)) m.t[y][x]=c; }
function mGet(m,x,y){ return mIn(m,x,y)?m.t[y][x]:' '; }
function mFill(m,x,y,w,h,c){ for(var j=y;j<y+h;j++) for(var i=x;i<x+w;i++) mSet(m,i,j,c); }
function mFrame(m,x,y,w,h,c){
  for(var i=x;i<x+w;i++){ mSet(m,i,y,c); mSet(m,i,y+h-1,c); }
  for(var j=y;j<y+h;j++){ mSet(m,x,j,c); mSet(m,x+w-1,j,c); }
}
function mRoad(m,x1,y1,x2,y2,road,bridge){
  var x=x1,y=y1,guard=0;
  function put(){
    var c=mGet(m,x,y);
    if(c==='~') mSet(m,x,y,bridge||'=');
    else if(c==='^'||c==='"'||c==='.'||c==='%') mSet(m,x,y,road||',');
  }
  while((x!==x2||y!==y2)&&guard++<400){
    put();
    if(x!==x2) x+=(x2>x?1:-1);
    else if(y!==y2) y+=(y2>y?1:-1);
  }
  put();
}
function addObj(m,x,y,o){ o.x=x; o.y=y; m.objs.push(o); return o; }
function addWarp(m,x,y,to,tx,ty){ m.warps.push({x:x,y:y,to:to,tx:tx,ty:ty}); }
function addNpc(m,x,y,o){
  o.x=x*TS+TS/2; o.y=y*TS+TS/2; o.hx=o.x; o.hy=o.y;
  o.dir=o.dir||'down'; o.t=Math.random()*3; o.vx=0; o.vy=0;
  m.npcs.push(o); return o;
}

/* ---------- フィールド ---------- */
function buildField(){
  var W=44,H=34, m=newMap('field',W,H,'~',{theme:'field',bgm:'field',name:'アレフガルド'});
  var x,y;
  for(y=0;y<H;y++) for(x=0;x<W;x++){
    var nx=(x-20)/17.5, ny=(y-19)/13.0;
    var d=nx*nx+ny*ny - (fbm(x*0.16,y*0.16)-0.5)*0.55;
    if(d<1){
      var f=fbm(x*0.21+40,y*0.21+40);
      var c='.';
      if(f>0.63) c='^'; else if(f>0.52) c='"';
      if(d>0.86) c='^';
      mSet(m,x,y,c);
    }
  }
  /* 北東の島（りゅうおうの城） */
  for(y=1;y<13;y++) for(x=29;x<W;x++){
    var ix=(x-36)/7.0, iy=(y-6)/5.0;
    var id=ix*ix+iy*iy-(fbm(x*0.2+80,y*0.2+80)-0.5)*0.4;
    mSet(m,x,y, id<1 ? (id>0.8?'^':(fbm(x*0.3,y*0.3)>0.6?'%':'.')) : '~');
  }
  /* 海峡（島と本土を分ける） */
  for(y=0;y<15;y++){ mSet(m,27,y,'~'); mSet(m,28,y,'~'); mSet(m,29,y,'~'); }
  for(x=25;x<W;x++){ mSet(m,x,12,'~'); mSet(m,x,13,'~'); }
  for(x=29;x<W;x++){ mSet(m,x,11,'~'); }
  /* 虹の橋のかかる場所 */
  mFill(m,25,6,2,3,'.'); mFill(m,30,6,2,3,'.');
  for(y=6;y<9;y++) for(x=27;x<30;x++) mSet(m,x,y,'~');

  /* ランドマーク */
  var CASTLE={x:21,y:26}, TOWN={x:13,y:22}, CAVE={x:7,y:13}, DC={x:36,y:5};
  function clear(cx,cy,r){
    for(var j=cy-r;j<=cy+r;j++) for(var i=cx-r;i<=cx+r;i++)
      if(mIn(m,i,j)&&mGet(m,i,j)!=='~') mSet(m,i,j,'.');
  }
  clear(CASTLE.x,CASTLE.y,2); clear(TOWN.x,TOWN.y,2); clear(CAVE.x,CAVE.y,1); clear(DC.x,DC.y,2);

  /* 道 */
  mRoad(m,CASTLE.x,CASTLE.y+1,TOWN.x,TOWN.y+1);
  mRoad(m,TOWN.x,TOWN.y+1,CAVE.x,CAVE.y+1);
  mRoad(m,CASTLE.x,CASTLE.y+1,26,7);
  mRoad(m,31,7,DC.x,DC.y+1);

  /* 建造物 */
  addObj(m,CASTLE.x,CASTLE.y,{kind:'struct',art:'castle'});
  addWarp(m,CASTLE.x,CASTLE.y,'castle',12,17);
  addObj(m,TOWN.x,TOWN.y,{kind:'struct',art:'town'});
  addWarp(m,TOWN.x,TOWN.y,'town',13,17);
  addObj(m,CAVE.x,CAVE.y,{kind:'struct',art:'cave'});
  addWarp(m,CAVE.x,CAVE.y,'cave1',5,4);
  addObj(m,DC.x,DC.y,{kind:'struct',art:'dcastle'});
  addWarp(m,DC.x,DC.y,'dcastle',14,21);

  /* にじのはし */
  for(x=27;x<30;x++) addObj(m,x,7,{kind:'rainbow'});

  m.spawn={max:6,rate:1.7,zone:'fieldDist'};
  m.entry={x:CASTLE.x,y:CASTLE.y+1};
  m.landmarks={castle:CASTLE,town:TOWN,cave:CAVE,dc:DC};
  return m;
}

   タイル描画（プリレンダ）
   ============================================================ */
function tcv(){ var c=document.createElement('canvas'); c.width=TS; c.height=TS; return c; }
function R(c,x,y,w,h,col){ c.fillStyle=col; c.fillRect(x,y,w,h); }
var TILESET={};
function buildTiles(theme){
  var set={}, i,v,c,ctx,n;
  function mk(n,fn){ var a=[]; for(var k=0;k<n;k++){ var cv=tcv(); fn(cv.getContext('2d'),k); a.push(cv); } return a; }
  var wallCol = theme==='town'?['#b98a52','#8f6538','#d8a86a']:
                theme==='castle'?['#9198aa','#666e84','#b3bacb']:
                theme==='dcastle'?['#4b3a5e','#31243f','#63507a']:
                ['#4d4238','#332b24','#63564a'];
  var floorCol= theme==='castle'?['#b9bccb','#8f93a5']:
                theme==='dcastle'?['#5d5068','#443a4e']:['#a9a08c','#8b8272'];

  set['.']=mk(4,function(c,k){
    R(c,0,0,TS,TS,'#2f8f3f');
    for(var i=0;i<7;i++){ var x=(hash2(k*7+i,3)*TS)|0, y=(hash2(i,k*5+9)*TS)|0;
      R(c,x,y,2,1,i%2?'#3fa84e':'#26762f'); }
  });
  set[',']=mk(3,function(c,k){
    R(c,0,0,TS,TS,'#c2a468');
    for(var i=0;i<6;i++){ var x=(hash2(k*3+i,11)*TS)|0, y=(hash2(i+2,k*4)*TS)|0;
      R(c,x,y,2,1,i%2?'#d6bb84':'#a9884f'); }
  });
  set['"']=mk(3,function(c,k){
    R(c,0,0,TS,TS,'#2b8038');
    var off=k*2;
    R(c,2,4,5,7,'#1d5f27'); R(c,3,2,3,4,'#2b7a35');
    R(c,9,6,5,7,'#1a5623'); R(c,10,4,3,4,'#27702f');
    R(c,4,11,1,3,'#4a3018'); R(c,11,13,1,3,'#4a3018');
  });
  set['^']=mk(3,function(c,k){
    R(c,0,0,TS,TS,'#2f8f3f');
    for(var i=0;i<5;i++) R(c,(hash2(k+i,17)*14)|0,12+((i*3)%4),2,1,'#26762f');
    if(k>0){
      c.fillStyle='#5b5142';
      c.beginPath(); c.moveTo(3+k,6); c.lineTo(9,16); c.lineTo(-2,16); c.closePath(); c.fill();
    }
    c.fillStyle='#8a7b64';
    c.beginPath(); c.moveTo(8,0); c.lineTo(1,16); c.lineTo(8,16); c.closePath(); c.fill();
    c.fillStyle='#63563f';
    c.beginPath(); c.moveTo(8,0); c.lineTo(16,16); c.lineTo(8,16); c.closePath(); c.fill();
    c.fillStyle='#e8e4d8';
    c.beginPath(); c.moveTo(8,0); c.lineTo(11,5); c.lineTo(8,4); c.lineTo(5,6); c.closePath(); c.fill();
  });
  set['~']=mk(3,function(c,k){
    R(c,0,0,TS,TS,'#2a58c8');
    R(c,0,0,TS,4,'#3468de');
    for(var i=0;i<3;i++){ var x=((i*6+k*3)%14), y=3+((i*5+k*4)%11);
      R(c,x,y,4,1,'#79a8f2'); R(c,x+1,y+1,2,1,'#4a7ce0'); }
  });
  set['=']=mk(2,function(c,k){
    R(c,0,0,TS,TS,'#2a58c8');
    R(c,0,2,TS,12,'#9a6a3a');
    for(var i=0;i<4;i++) R(c,i*4+1,2,1,12,'#6d4826');
    R(c,0,2,TS,1,'#c08a52'); R(c,0,13,TS,1,'#6d4826');
  });
  set['%']=mk(3,function(c,k){
    R(c,0,0,TS,TS,'#5c5330');
    R(c,0,0,TS,TS,'#4e4a2c');
    for(var i=0;i<5;i++){ var x=(hash2(k+i,5)*13)|0, y=(hash2(i,k+2)*13)|0;
      R(c,x,y,3,2,'#6f6a3a'); R(c,x+1,y+1,1,1,'#8b854a'); }
    R(c,2,10,4,2,'#77a05a');
  });
  set['#']=mk(3,function(c,k){
    R(c,0,0,TS,TS,wallCol[1]);
    for(var j=0;j<4;j++){ var off=(j%2)*4;
      for(var i=-1;i<3;i++) R(c,i*8+off+1,j*4+1,6,3,wallCol[0]);
    }
    R(c,0,0,TS,1,wallCol[2]);
  });
  set['+']=mk(3,function(c,k){
    R(c,0,0,TS,TS,floorCol[0]);
    R(c,0,0,TS,1,floorCol[1]); R(c,0,8,TS,1,floorCol[1]);
    R(c,0,1,1,7,floorCol[1]); R(c,8,9,1,7,floorCol[1]);
    R(c,1,1,14,1,'rgba(255,255,255,.10)');
    R(c,1,9,7,1,'rgba(255,255,255,.10)'); R(c,9,9,6,1,'rgba(255,255,255,.10)');
    for(var i=0;i<3;i++){ var x=(hash2(k*5+i,21)*14)|0, y=(hash2(i,k*3+8)*14)|0;
      R(c,x+1,y+1,1,1,'rgba(0,0,0,.10)'); }
  });
  set[';']=mk(4,function(c,k){
    R(c,0,0,TS,TS,'#6f6250');
    for(var i=0;i<6;i++){ var x=(hash2(k*9+i,7)*TS)|0, y=(hash2(i*3,k)*TS)|0;
      R(c,x,y,2,2,i%2?'#7d7060':'#5c5142'); }
  });
  set['-']=mk(1,function(c){
    R(c,0,0,TS,TS,'#8a5f33'); R(c,0,0,TS,3,'#b98a52'); R(c,0,13,TS,3,'#6b4522');
  });
  set['*']=mk(1,function(c){

function shadow(x,y,rx,ry){
  g.fillStyle='rgba(0,0,0,.28)';
  g.beginPath(); g.ellipse(Math.round(x),Math.round(y),rx,ry,0,0,6.2832); g.fill();
}
function ell(x,y,rx,ry,c){ g.fillStyle=c; g.beginPath(); g.ellipse(x,y,rx,ry,0,0,6.2832); g.fill(); }

var SKIN='#f0c090', STEEL='#c6cbd8';

function drawHeroBody(cx,cy,dir,walk,tun,tunD){
  var X=Math.round(cx)-8, Y=Math.round(cy)-8;
  var hair='#7a4a1e', boot='#4a2f14';
  var l1=(walk===1)?-1:0, l2=(walk===2)?-1:0;
  if(dir==='left'){
    g.save(); g.translate(Math.round(cx)*2,0); g.scale(-1,1);
    drawHeroBody(cx,cy,'right',walk,tun,tunD); g.restore(); return;
  }
  if(dir==='down'||dir==='up'){
    R(g,X+4,Y+13+l1,3,3,boot); R(g,X+9,Y+13+l2,3,3,boot);
    R(g,X+3,Y+7,10,7,tun); R(g,X+3,Y+11,10,1,'#a8742e'); R(g,X+3,Y+13,10,1,tunD);
    R(g,X+1,Y+8,2,4,SKIN); R(g,X+13,Y+8,2,4,SKIN);
    if(dir==='down'){
      R(g,X+4,Y,8,4,hair); R(g,X+4,Y+3,8,5,SKIN);
      R(g,X+5,Y+4,2,2,'#20202a'); R(g,X+9,Y+4,2,2,'#20202a');
      R(g,X+3,Y+1,10,2,STEEL); R(g,X+7,Y,2,2,'#e0c060');
      R(g,X,Y+8,3,6,STEEL); R(g,X+1,Y+9,1,4,'#e0c060');
    }else{
      R(g,X+4,Y,8,7,hair); R(g,X+3,Y+1,10,2,STEEL); R(g,X+7,Y,2,2,'#e0c060');
      R(g,X+13,Y+8,3,6,STEEL); R(g,X+14,Y+9,1,4,'#e0c060');
    }
  }else{ /* right */
    R(g,X+5,Y+13+l1,3,3,boot); R(g,X+8,Y+13+l2,3,3,boot);
    R(g,X+4,Y+7,8,7,tun); R(g,X+4,Y+11,8,1,'#a8742e'); R(g,X+4,Y+13,8,1,tunD);
    R(g,X+4,Y,8,4,hair); R(g,X+5,Y+3,7,5,SKIN);
    R(g,X+9,Y+4,2,2,'#20202a');
    R(g,X+4,Y+1,9,2,STEEL); R(g,X+7,Y,2,2,'#e0c060');
    R(g,X+11,Y+9,3,2,SKIN);
    R(g,X+2,Y+8,3,6,STEEL);
  }
}
/* ゆうしゃ本体（けん・こうか こみ） */
function drawPlayer(p){
  var cx=p.x, cy=p.y;
  if(p.iframe>0 && Math.floor(p.iframe*20)%2===0) return;
  shadow(cx,cy+7.5,7,3);
  var tun=p.armorIdx>=4?'#e0c060':(p.armorIdx>=3?'#7a4ad0':(p.armorIdx>=2?'#8f96a8':(p.armorIdx>=1?'#a9682e':'#2f52d0')));
  var tunD=p.armorIdx>=4?'#a8862e':(p.armorIdx>=3?'#4a2a90':(p.armorIdx>=2?'#5f6678':(p.armorIdx>=1?'#7a4a20':'#1e3aa0')));
  drawHeroBody(cx,cy,p.dir,p.walk,tun,tunD);
  /* けん */
  if(p.atkT>0){
    var pr=1-p.atkT/p.atkDur;
    var base={down:Math.PI/2,up:-Math.PI/2,left:Math.PI,right:0}[p.dir];
    var ang=base+(-1.15+2.3*pr);
    var len=p.weaponIdx>=5?17:(p.weaponIdx>=3?15:13);
    var hx=Math.round(cx)+Math.cos(ang)*5, hy=Math.round(cy)+Math.sin(ang)*5+1;
    var tx=Math.round(cx)+Math.cos(ang)*len, ty=Math.round(cy)+Math.sin(ang)*len+1;
    g.strokeStyle='rgba(255,255,255,.35)'; g.lineWidth=6; g.lineCap='round';
    g.beginPath(); g.moveTo(hx,hy); g.lineTo(tx,ty); g.stroke();
    g.strokeStyle=p.weaponIdx>=5?'#ffe98a':'#dfe6f2'; g.lineWidth=2;
    g.beginPath(); g.moveTo(hx,hy); g.lineTo(tx,ty); g.stroke();
    g.strokeStyle='#8a5a2b'; g.lineWidth=3;
    g.beginPath(); g.moveTo(Math.round(cx)+Math.cos(ang)*2,Math.round(cy)+Math.sin(ang)*2+1); g.lineTo(hx,hy); g.stroke();
    g.lineWidth=1;
  }
  if(p.castT>0){
    var a=p.castT/0.32;
    g.strokeStyle='rgba(180,220,255,'+(0.8*a)+')'; g.lineWidth=2;
    g.beginPath(); g.arc(Math.round(cx),Math.round(cy),10+8*(1-a),0,6.2832); g.stroke(); g.lineWidth=1;
  }
}
/* ---------- NPC ---------- */
function humanoid(cx,cy,dir,p,t){
  var X=Math.round(cx)-8, Y=Math.round(cy)-8;
  var bob=Math.sin(t*3)>0?0:1;
  shadow(cx,cy+7.5,6,2.5);
  R(g,X+4,Y+14-bob,3,2,p.foot||'#4a2f14'); R(g,X+9,Y+14,3,2,p.foot||'#4a2f14');
  R(g,X+3,Y+7,10,8,p.body);
  R(g,X+3,Y+12,10,1,p.body2||p.body);
  R(g,X+1,Y+8,2,4,p.skin||SKIN); R(g,X+13,Y+8,2,4,p.skin||SKIN);
  R(g,X+4,Y+2,8,6,p.skin||SKIN);
  if(dir==='up'){ R(g,X+4,Y+1,8,6,p.hair); }
  else{
    R(g,X+4,Y+1,8,3,p.hair);
    if(dir==='down'){ R(g,X+5,Y+4,2,2,'#20202a'); R(g,X+9,Y+4,2,2,'#20202a'); }
    else if(dir==='right'){ R(g,X+9,Y+4,2,2,'#20202a'); }
    else { R(g,X+5,Y+4,2,2,'#20202a'); }
  }
  if(p.beard){ R(g,X+5,Y+6,6,3,'#e8e8e8'); }
  if(p.crown){ R(g,X+3,Y,10,2,'#f0d040'); R(g,X+4,Y-2,2,2,'#f0d040'); R(g,X+7,Y-2,2,2,'#f0d040'); R(g,X+10,Y-2,2,2,'#f0d040'); }
  if(p.helm){ R(g,X+3,Y+1,10,3,STEEL); R(g,X+7,Y-1,2,3,'#d04040'); }
  if(p.spear){ R(g,X+13,Y-2,1,16,'#8a5a2b'); R(g,X+12,Y-4,3,4,STEEL); }
  if(p.long){ R(g,X+3,Y+3,2,8,p.hair); R(g,X+11,Y+3,2,8,p.hair); }
}

function drawSlime(x,y,r,col,t,metal){
  var sq=1+Math.sin(t*5)*0.08;
  shadow(x,y+r*0.9,r*0.95,r*0.34);
  var rx=r*1.15/sq, ry=r*1.0*sq;
  g.fillStyle=col;
  g.beginPath();
  g.moveTo(x-rx,y+ry*0.85);
  g.bezierCurveTo(x-rx,y-ry*1.1,x+rx,y-ry*1.1,x+rx,y+ry*0.85);
  g.closePath(); g.fill();
  g.fillStyle=metal?'rgba(255,255,255,.85)':'rgba(255,255,255,.35)';
  g.fillRect(Math.round(x-rx*0.6),Math.round(y-ry*0.5),Math.round(rx*0.5),2);
  R(g,Math.round(x-r*0.45),Math.round(y-r*0.15),2,3,'#fff');
  R(g,Math.round(x+r*0.2),Math.round(y-r*0.15),2,3,'#fff');
  R(g,Math.round(x-r*0.4),Math.round(y-r*0.05),1,2,'#101018');
  R(g,Math.round(x+r*0.25),Math.round(y-r*0.05),1,2,'#101018');
  R(g,Math.round(x-r*0.15),Math.round(y+r*0.35),Math.round(r*0.35),1,'#101018');
}
function drawBat(x,y,r,col,t){
  var fl=Math.sin(t*11)*r*0.55;

  g.beginPath(); g.moveTo(x-r*0.5,y); g.lineTo(x-r*2.0,y-fl); g.lineTo(x-r*1.6,y+r*0.5); g.closePath(); g.fill();
  g.beginPath(); g.moveTo(x+r*0.5,y); g.lineTo(x+r*2.0,y-fl); g.lineTo(x+r*1.6,y+r*0.5); g.closePath(); g.fill();
  ell(x,y,r*0.95,r*1.0,col);
  ell(x,y+r*0.15,r*0.7,r*0.7,'#f0e0a0');
  R(g,Math.round(x-r*0.5),Math.round(y-r*0.2),2,3,'#101018');
  R(g,Math.round(x+r*0.25),Math.round(y-r*0.2),2,3,'#101018');

}
function drawGhost(x,y,r,col,t){
  var f=Math.sin(t*3)*2;
  g.globalAlpha=0.85;
  g.fillStyle=col;
  g.beginPath();
  g.moveTo(x-r,y+r*0.9+f);
  g.bezierCurveTo(x-r*1.1,y-r*1.4+f,x+r*1.1,y-r*1.4+f,x+r,y+r*0.9+f);
  for(var i=0;i<4;i++){ g.lineTo(x+r-i*r*0.5, y+r*0.9+f + ((i%2)?3:-1)); }
  g.closePath(); g.fill();
  g.globalAlpha=1;
  R(g,Math.round(x-r*0.5),Math.round(y-r*0.3+f),3,4,'#20203a');
  R(g,Math.round(x+r*0.2),Math.round(y-r*0.3+f),3,4,'#20203a');
}

/* ---------- マップ移動 ---------- */
function gotoMap(id,tx,ty,noFade){
  cur=MAPS[id];
  P.x=tx*TS+TS/2; P.y=ty*TS+TS/2;
  enemies.length=0; shots.length=0; fx.length=0; nums.length=0; parts.length=0;
  spawnTimer=1.0; bossRef=null;
  if(cur.fixed){
    for(var i=0;i<cur.fixed.length;i++){
      var f=cur.fixed[i];
      if(SAVE.flags['fx_'+id+'_'+i]) continue;
      var e=spawnAt(f.k,f.x*TS+8,f.y*TS+8); if(e){ e.fixedId='fx_'+id+'_'+i; }
    }
  }
  if(SAVE.flags.rainbow) applyRainbow();
  playBGM(cur.bgm);
  camSnap();
}
function applyRainbow(){
  var f=MAPS.field;
  for(var x=27;x<30;x++) mSet(f,x,7,'=');
}
function camSnap(){
  cam.x=clamp(P.x-GW/2,0,Math.max(0,cur.w*TS-GW));
  cam.y=clamp(P.y-GH/2,0,Math.max(0,cur.h*TS-GH));
  if(cur.w*TS<GW) cam.x=(cur.w*TS-GW)/2;
  if(cur.h*TS<GH) cam.y=(cur.h*TS-GH)/2;
}

/* ---------- しょうとつ ---------- */
function walkableAt(m,x,y){
  var c=mGet(m,Math.floor(x/TS),Math.floor(y/TS));
  return !solidChar(c);
}
function tryMove(m,e,dx,dy,hw,hh,oy){
  hw=(hw===undefined)?5:hw; hh=(hh===undefined)?4:hh; oy=(oy===undefined)?3:oy;
  if(dx){
    var nx=e.x+dx, ex=nx+(dx>0?hw:-hw), cy=e.y+oy;
    if(walkableAt(m,ex,cy-hh)&&walkableAt(m,ex,cy+hh)) e.x=nx;
  }
  if(dy){
    var ny=e.y+dy, ey=ny+oy+(dy>0?hh:-hh);
    if(walkableAt(m,e.x-hw,ey)&&walkableAt(m,e.x+hw,ey)) e.y=ny;
  }
}

/* ---------- ダメージ計算 ---------- */
function calcDmg(at,df,rate){
  var v=at*(100/(100+df*1.4))*(rate||1);
  return Math.max(1,Math.round(v*rnd(0.88,1.12)));
}
function hurtEnemy(e,dmg,kx,ky,crit){
  var d=EN[e.k];
  e.hp-=dmg; e.hurt=0.16;
  e.kx+=kx||0; e.ky+=ky||0;
  popNum(e.x,e.y-d.r-4,dmg,crit?'#ffe040':'#fff');
  burst(e.x,e.y,crit?9:5,'#ffd0a0',90);
  SFX.hit();
  cam.shake=Math.max(cam.shake,crit?3:1.6);
  if(e.hp<=0) killEnemy(e);
}
function killEnemy(e){
  var d=EN[e.k];
  e.dead=1;
  burst(e.x,e.y,16,d.c,110);
  SFX.die();
  if(e.fixedId) SAVE.flags[e.fixedId]=1;
  if(d.boss){ onBossDefeated(e); return; }
  P.exp+=d.ex; P.gold+=d.gd;
  popNum(e.x,e.y-14,d.ex,'#8fe8ff');
  if(Math.random()<0.10) { addItem('やくそう',1); popNum(e.x+8,e.y-22,0,'#a0ffa0'); }
  checkLevelUp();
}
function checkLevelUp(){
  while(P.lv<LV.length && P.exp>=LV[P.lv].e){
    var before=LV[P.lv-1]; P.lv++;
    var a=LV[P.lv-1];
    P.mhp=a.hp; P.mmp=a.mp; P.hp=Math.min(a.hp,P.hp+(a.hp-before.hp)); P.mp=Math.min(a.mp,P.mp+(a.mp-before.mp));
    SFX.levelup();
    var msg='レベルが '+P.lv+'に あがった！\nさいだいHP+'+(a.hp-before.hp)+'  さいだいMP+'+(a.mp-before.mp)+'\nちから+'+(a.at-before.at)+'  みのまもり+'+(a.df-before.df);
    if(a.sp && P.spells.indexOf(a.sp)<0){ P.spells.push(a.sp); msg+='\nじゅもん「'+a.sp+'」を おぼえた！'; }
    say([msg]);
    burst(P.x,P.y,20,'#ffe880',80);
  }
}
function hurtPlayer(dmg,fx_,fy){
  if(P.iframe>0||P.dead) return;
  P.hp-=dmg; P.iframe=1.0;
  var a=Math.atan2(P.y-fy,P.x-fx_);
  P.kx+=Math.cos(a)*130; P.ky+=Math.sin(a)*130;
  popNum(P.x,P.y-12,dmg,'#ff8080');
  SFX.hurt(); cam.shake=4; flash=0.18;
  if(P.hp<=0){ P.hp=0; playerDeath(); }
}
function playerDeath(){
  P.dead=1; stopBGM(); SFX.gameover();
  scene='dead';
  say(['ゆうしゃは しんでしまった…','おお ゆうしゃよ！\nしんでしまうとは なさけない…','ゴールドは はんぶんに なった。\nしろから やりなおすのじゃ。'],function(){

/* ---------- まもの ---------- */
function spawnAt(k,x,y){
  var d=EN[k]; if(!d) return null;
  var e={k:k,id:(++EIDC),x:x,y:y,hp:d.hp,mhp:d.hp,t:Math.random()*6,seed:Math.random()*10,
         kx:0,ky:0,hurt:0,cd:rnd(0.6,2),tcd:0.4,state:0,dead:0,phase:1,vx:0,vy:0};
  enemies.push(e); return e;
}
function trySpawnRandom(){
  if(!cur.spawn) return;
  if(enemies.length>=cur.spawn.max) return;
  for(var tries=0;tries<14;tries++){
    var a=Math.random()*6.2832, dd=rnd(170,250);
    var x=P.x+Math.cos(a)*dd, y=P.y+Math.sin(a)*dd;
    var tx=Math.floor(x/TS), ty=Math.floor(y/TS);
    if(!mIn(cur,tx,ty)) continue;
    var c=mGet(cur,tx,ty);
    if(solidChar(c)||c==='='||c==='<'||c==='>') continue;
    var zone=cur.spawn.zone;
    if(zone==='fieldDist') zone=fieldZone(tx,ty);
    var table=ZONE[zone]; if(!table) return;
    var k=pick(table);
    if(k==='metal'&&Math.random()<0.72) k=pick(table);
    spawnAt(k,tx*TS+8,ty*TS+8);
    return;
  }
}
function fieldZone(tx,ty){
  var L=MAPS.field.landmarks;
  if(ty<13&&tx>24) return 'z4';
  var d=Math.hypot(tx-L.castle.x,ty-L.castle.y);
  if(d<9) return 'z1';
  if(d<17) return 'z2';
  return 'z3';
}
function enemyShoot(e,tx,ty,sp,dmg,type){
  var a=Math.atan2(ty-e.y,tx-e.x);
  shots.push({o:'e',x:e.x,y:e.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,dmg:dmg,life:2.4,t:0,type:type||'fire',r:4});
  SFX.spell();
}
function updateEnemy(e,dt){
  var d=EN[e.k];
  e.t+=dt; if(e.hurt>0) e.hurt-=dt;
  var dx=P.x-e.x, dy=P.y-e.y, dd=Math.hypot(dx,dy)||1;
  var ux=dx/dd, uy=dy/dd;
  var sp=d.sp, mvx=0, mvy=0;
  if(e.cd>0) e.cd-=dt;
  var far=dd>420;
  if(far&&!d.boss&&!e.fixedId){ e.dead=1; return; }
  /* プレイヤーが遠いときは その場を うろつく */
  if(dd>175&&!d.boss&&d.ai!=='flee'){
    if(e.cd<=0){ e.wa=Math.random()*6.2832; e.cd=rnd(0.8,2.0); }
    var wa=e.wa||0, wvx=Math.cos(wa)*sp*0.3, wvy=Math.sin(wa)*sp*0.3;
    e.x+=(wvx+e.kx)*dt; e.y+=(wvy+e.ky)*dt;
    e.kx*=Math.pow(0.001,dt); e.ky*=Math.pow(0.001,dt);
    if(!walkableAt(cur,e.x,e.y+4)){ e.x-=(wvx+e.kx)*dt; e.y-=(wvy+e.ky)*dt; e.cd=0; }
    return;
  }
  switch(d.ai){
    case 'hop':
      if(e.cd<=0){ e.state=1; e.cd=rnd(0.9,1.5); e.hopT=0.34; e.ha=Math.atan2(dy,dx)+rnd(-0.3,0.3); }
      if(e.hopT>0){ e.hopT-=dt; mvx=Math.cos(e.ha)*sp*2.1; mvy=Math.sin(e.ha)*sp*2.1; }
      break;
    case 'fly':
      var pa=Math.atan2(dy,dx)+Math.sin(e.t*3+e.seed)*0.7;
      mvx=Math.cos(pa)*sp; mvy=Math.sin(pa)*sp;
      break;
    case 'chase':
      mvx=ux*sp; mvy=uy*sp; break;
    case 'dash':
      if(e.state===0){
        mvx=ux*sp*0.45; mvy=uy*sp*0.45;
        if(dd<95&&e.cd<=0){ e.state=1; e.cd=0.45; e.da=Math.atan2(dy,dx); }
      } else if(e.state===1){
        if(e.cd<=0){ e.state=2; e.cd=0.5; }
      } else {
        mvx=Math.cos(e.da)*sp*3.2; mvy=Math.sin(e.da)*sp*3.2;
        if(e.cd<=0){ e.state=0; e.cd=rnd(0.8,1.4); }
      }
      break;
    case 'cast':
      if(dd>105){ mvx=ux*sp; mvy=uy*sp; }
      else if(dd<70){ mvx=-ux*sp*0.8; mvy=-uy*sp*0.8; }
      if(e.cd<=0&&dd<210){ enemyShoot(e,P.x,P.y,105,Math.round(d.at*0.75),e.k==='wiz'?'ice':'fire'); e.cd=rnd(1.5,2.4); }
      break;
    case 'flee':
      var fa=Math.atan2(dy,dx)+Math.PI+Math.sin(e.t*2)*0.5;
      mvx=Math.cos(fa)*sp; mvy=Math.sin(fa)*sp;
      e.life=(e.life||0)+dt; if(e.life>11) e.dead=1;
      break;
    case 'golem':
      if(dd>34){ mvx=ux*sp; mvy=uy*sp; }
      if(e.cd<=0&&dd<80){ ringFx(e.x,e.y,6,64,0.45,'#e0b060',Math.round(d.at*0.9),'e'); cam.shake=5; e.cd=3.0; }
      break;
    case 'breath':
      if(e.state===0){
        if(dd>50){ mvx=ux*sp; mvy=uy*sp; }
        if(e.cd<=0&&dd<150){ e.state=1; e.cd=0.6; e.ba=Math.atan2(dy,dx); }
      } else {
        if(e.cd<=0){
          for(var i=-2;i<=2;i++){
            var a2=e.ba+i*0.18;
            shots.push({o:'e',x:e.x,y:e.y,vx:Math.cos(a2)*130,vy:Math.sin(a2)*130,dmg:Math.round(d.at*0.6),life:1.0,t:0,type:'fire',r:5});
          }
          SFX.spell(); e.state=0; e.cd=rnd(2.4,3.4);
        }
      }
      break;
    case 'boss': updateBoss(e,dt,ux,uy,dd); return;
  }
  e.x+=(mvx+e.kx)*dt; e.y+=(mvy+e.ky)*dt;
  e.kx*=Math.pow(0.001,dt); e.ky*=Math.pow(0.001,dt);
  /* かべ補正 */
  if(d.ai!=='fly'&&d.ai!=='chase'){
    if(!walkableAt(cur,e.x,e.y+4)){ e.x-=(mvx+e.kx)*dt; e.y-=(mvy+e.ky)*dt; e.cd=Math.min(e.cd,0.2); e.state=0; }
  } else if(!walkableAt(cur,e.x,e.y+4)){
    if(walkableAt(cur,e.x-mvx*dt,e.y+4)) e.x-=(mvx+e.kx)*dt; else e.y-=(mvy+e.ky)*dt;
  }
  e.x=clamp(e.x,8,cur.w*TS-8); e.y=clamp(e.y,8,cur.h*TS-8);
  /* せっしょくダメージ */
  if(e.tcd>0) e.tcd-=dt;
  if(dd<d.r+8&&!P.dead&&e.tcd<=0&&P.iframe<=0){
    e.tcd=0.7;
    hurtPlayer(calcDmg(d.at,defPow(),0.45),e.x,e.y);
  }
}
/* ---------- りゅうおう ---------- */
function updateBoss(e,dt,ux,uy,dd){
  var d=EN.lord;
  if(e.phase===1&&e.hp<=d.hp*0.5){
    e.phase=2; e.state=9; e.cd=1.6; e.iframeT=1.6;
    cam.shake=8; flash=0.5; SFX.boss();
    say(['りゅうおう「わが しんの すがたを\nみせてやろう…！」']);
    burst(e.x,e.y,40,'#a080ff',150);
  }
  var sp=EN.lord.sp*(e.phase===2?1.25:1);
  if(e.state===9){ if(e.cd<=0){ e.state=0; e.cd=0.8; } e.cd-=dt; return; }
  if(e.cd>0) e.cd-=dt;
  var mvx=0,mvy=0;
  if(e.phase===1){
    if(dd>110){ mvx=ux*sp; mvy=uy*sp; } else if(dd<70){ mvx=-ux*sp; mvy=-uy*sp; }
    if(e.cd<=0){
      var r=Math.random();
      if(r<0.45){
        for(var i=0;i<8;i++){
          var a=e.t*0.8+i*0.7854;
          shots.push({o:'e',x:e.x,y:e.y,vx:Math.cos(a)*95,vy:Math.sin(a)*95,dmg:Math.round(d.at*0.55),life:2.6,t:0,type:'dark',r:5});
        }
        SFX.spell(); e.cd=2.4;
      } else if(r<0.8){
        for(var j=-1;j<=1;j++){
          var a3=Math.atan2(P.y-e.y,P.x-e.x)+j*0.22;
          shots.push({o:'e',x:e.x,y:e.y,vx:Math.cos(a3)*160,vy:Math.sin(a3)*160,dmg:Math.round(d.at*0.6),life:2.2,t:0,type:'fire',r:5});
        }
        SFX.spell(); e.cd=1.9;
      } else {
        var ta=Math.random()*6.2832, tr=rnd(70,120);
        var nx=clamp(P.x+Math.cos(ta)*tr,24,cur.w*TS-24), ny=clamp(P.y+Math.sin(ta)*tr,24,cur.h*TS-24);
        if(walkableAt(cur,nx,ny)){ burst(e.x,e.y,14,'#8060e0',90); e.x=nx; e.y=ny; burst(e.x,e.y,14,'#8060e0',90); }
        e.cd=2.2;
      }
    }
  } else {
    if(e.state===0){
      if(dd>44){ mvx=ux*sp; mvy=uy*sp; }
      if(e.cd<=0){
        var r2=Math.random();
        if(r2<0.5){ e.state=1; e.cd=0.5; e.ba=Math.atan2(P.y-e.y,P.x-e.x); }
        else if(r2<0.8){ e.state=3; e.cd=0.4; e.da=Math.atan2(P.y-e.y,P.x-e.x); }
        else { ringFx(e.x,e.y,10,110,0.6,'#c060ff',Math.round(d.at*0.8),'e'); cam.shake=6; e.cd=2.6; }
      }
    } else if(e.state===1){
      if(e.cd<=0){ e.state=2; e.cd=0.85; }
    } else if(e.state===2){
      e.fireT=(e.fireT||0)+dt;
      if(e.fireT>0.055){
        e.fireT=0;
        for(var m=-2;m<=2;m++){
          var a4=e.ba+m*0.16+rnd(-0.05,0.05);
          shots.push({o:'e',x:e.x+Math.cos(e.ba)*16,y:e.y+Math.sin(e.ba)*16,vx:Math.cos(a4)*150,vy:Math.sin(a4)*150,dmg:Math.round(d.at*0.42),life:0.85,t:0,type:'fire',r:5});
        }
      }
      if(e.cd<=0){ e.state=0; e.cd=rnd(1.6,2.4); }
    } else if(e.state===3){
      if(e.cd<=0){ e.state=4; e.cd=0.7; }
    } else {
      mvx=Math.cos(e.da)*sp*4.2; mvy=Math.sin(e.da)*sp*4.2;
      if(e.cd<=0){ e.state=0; e.cd=rnd(1.4,2.2); }
    }
  }
  e.x+=(mvx+e.kx)*dt; e.y+=(mvy+e.ky)*dt;
  e.kx*=Math.pow(0.002,dt); e.ky*=Math.pow(0.002,dt);
  if(!walkableAt(cur,e.x,e.y+6)){ e.x-=(mvx+e.kx)*dt; e.y-=(mvy+e.ky)*dt; e.state=0; }
  if(e.tcd>0) e.tcd-=dt;
  if(dd<d.r+10&&!P.dead&&e.tcd<=0&&P.iframe<=0){ e.tcd=0.5; hurtPlayer(calcDmg(d.at,defPow(),0.5),e.x,e.y); }
}
function onBossDefeated(e){
  bossRef=null; SAVE.flags.lordDead=1;
  stopBGM(); cam.shake=10; flash=1.0;
  burst(e.x,e.y,60,'#ffd060',180);
  scene='play';
  say([
   'りゅうおうを たおした！',
   'りゅうおう「…みごとだ ゆうしゃよ。\nこの せかいは そなたに ゆだねよう…」',
   'せかいに ひかりが もどった！'
  ],function(){ fadeTo(function(){ scene='ending'; endingT=0; stopBGM(); }); });
}

/* ============================================================
   UI スタック（メッセージ・せんたく・メニュー）
   ============================================================ */
var uiStack=[];
function pushUI(o){ uiStack.push(o); return o; }
function popUI(){ return uiStack.pop(); }
function topUI(){ return uiStack.length?uiStack[uiStack.length-1]:null; }
function say(pages,cb){ return pushUI({k:'msg',pages:pages,i:0,ch:0,cb:cb||null}); }
function ask(q,opts,cb){ return pushUI({k:'choice',q:q,opts:opts,i:0,cb:cb}); }
function listMenu(title,items,opt){
  var o={k:'list',title:title,items:items,i:0,top:0,rows:(opt&&opt.rows)||6,
         onCancel:(opt&&opt.onCancel)||null,foot:(opt&&opt.foot)||null,wide:(opt&&opt.wide)||0};
  return pushUI(o);
}
function closeAllUI(){ uiStack.length=0; }

function updateUI(dt){
  var t=topUI(); if(!t) return;
  if(t.k==='msg'){
    var page=t.pages[t.i]||'';
    if(t.ch<page.length) t.ch+=dt*46;
    if(just.a||just.b){
      if(t.ch<page.length){ t.ch=page.length; }
      else{
        t.i++; t.ch=0;
        if(t.i>=t.pages.length){ popUI(); SFX.menu(); if(t.cb) t.cb(); }
      }
    }
  } else if(t.k==='choice'){
    if(just.up||just.left){ t.i=(t.i+t.opts.length-1)%t.opts.length; SFX.menu(); }
    if(just.down||just.right){ t.i=(t.i+1)%t.opts.length; SFX.menu(); }
    if(just.a){ popUI(); SFX.ok(); if(t.cb) t.cb(t.i); }
    else if(just.b||just.menu){ popUI(); SFX.cancel(); if(t.cb) t.cb(-1); }
  } else if(t.k==='list'){
    var n=t.items.length;
    if(just.up){ t.i=(t.i+n-1)%n; SFX.menu(); }
    if(just.down){ t.i=(t.i+1)%n; SFX.menu(); }
    if(t.i<t.top) t.top=t.i;
    if(t.i>=t.top+t.rows) t.top=t.i-t.rows+1;
    if(just.a){ SFX.ok(); var it=t.items[t.i]; if(it&&it.fn) it.fn(it); }
    else if(just.b||just.menu){ popUI(); SFX.cancel(); if(t.onCancel) t.onCancel(); }
  }
}

/* ============================================================
   プレイヤー行動
   ============================================================ */
var DIRV={down:[0,1],up:[0,-1],left:[-1,0],right:[1,0]};
var warpLock=0;

function startAttack(){ P.atkT=P.atkDur; P.hitSet={}; SFX.swing(); }
function swordHit(){
  var v=DIRV[P.dir];
  var hx=P.x+v[0]*13, hy=P.y+v[1]*13+2;
  var reach=13+(P.weaponIdx>=4?3:0);
  for(var i=0;i<enemies.length;i++){
    var e=enemies[i]; if(e.dead) continue;
    var d=EN[e.k];
    if(P.hitSet[e.id||i]) continue;
    if(Math.hypot(e.x-hx,e.y-hy)<reach+d.r){
      P.hitSet[e.id||i]=1;
      var crit=Math.random()<0.045;
      var dmg;
      if(d.metal) dmg=crit?Math.round(atkPow()*0.3):rndi(0,1);
      else dmg=calcDmg(atkPow(),d.df,crit?2.2:1);
      var a=Math.atan2(e.y-P.y,e.x-P.x);
      hurtEnemy(e,dmg,Math.cos(a)*(d.boss?60:210),Math.sin(a)*(d.boss?60:210),crit);
    }
  }
}
function castSpell(){
  if(!P.spells.length){ return; }
  var name=P.spells[P.spellIdx%P.spells.length], s=SPELLS[name];
  if(P.mp<s.mp){ popNum(P.x,P.y-14,0,'#8080ff'); SFX.cancel(); return; }
  P.mp-=s.mp; P.castT=0.32; SFX.spell();
  var v=DIRV[P.dir], ang=Math.atan2(v[1],v[0]);
  if(s.k==='heal'){
    var before=P.hp; P.hp=Math.min(P.mhp,P.hp+s.v);
    popNum(P.x,P.y-14,P.hp-before,'#80ff80'); burst(P.x,P.y,18,'#a0ffd0',60); SFX.heal();
  } else if(s.k==='fan'){
    for(var i=-1;i<=1;i++)
      shots.push({o:'p',x:P.x,y:P.y+2,vx:Math.cos(ang+i*0.28)*175,vy:Math.sin(ang+i*0.28)*175,
                  dmg:s.v,life:0.55,t:0,type:'fire',r:5});
  } else if(s.k==='shot'){
    shots.push({o:'p',x:P.x,y:P.y+2,vx:Math.cos(ang)*250,vy:Math.sin(ang)*250,dmg:s.v,life:1.1,t:0,type:'wind',r:6,pierce:1});
  } else if(s.k==='ring'){
    ringFx(P.x,P.y,8,78,0.45,'#ff8020',s.v,'p'); cam.shake=4;
  } else if(s.k==='nova'){
    ringFx(P.x,P.y,10,124,0.7,'#ffe060',s.v,'p'); cam.shake=8; flash=0.3;
  }
}
function frontTile(){
  var v=DIRV[P.dir];
  return {x:Math.floor((P.x+v[0]*14)/TS), y:Math.floor((P.y+3+v[1]*14)/TS)};
}
function findInteract(){
  var v=DIRV[P.dir], fx_=P.x+v[0]*14, fy=P.y+3+v[1]*14;
  for(var i=0;i<cur.npcs.length;i++){
    var n=cur.npcs[i];
    if(Math.hypot(n.x-fx_,n.y-fy)<13) return {t:'npc',o:n};
  }
  var ft=frontTile();
  for(var j=0;j<cur.objs.length;j++){
    var o=cur.objs[j];
    if(o.x===ft.x&&o.y===ft.y&&(o.kind==='door'||o.kind==='chest'||o.kind==='rainbow')) return {t:'obj',o:o};
  }
  return null;
}
function interact(it){
  if(it.t==='npc'){
    var n=it.o;
    var v=DIRV[P.dir]; n.dir={down:'up',up:'down',left:'right',right:'left'}[P.dir];
    n.talk=1.2;
    if(n.king) return kingTalk();
    if(n.save) return saveTalk();
    say(n.lines||['…']);
  } else if(it.t==='obj'){
    var o=it.o;
    if(o.kind==='door') openShop(o.shop,o.label);
    else if(o.kind==='chest') openChest(o);
    else if(o.kind==='rainbow') useRainbow();
  }
}
function openChest(o){
  if(SAVE.flags[o.id]){ say(['たからばこは からっぽだ。']); return; }
  SAVE.flags[o.id]=1; SFX.chest();
  if(o.gold!==undefined){ P.gold+=o.gold; say(['たからばこを あけた！\n'+o.gold+'ゴールドを てにいれた！']); }
  else if(o.item){ addItem(o.item); say(['たからばこを あけた！\n「'+o.item+'」を てにいれた！']); }
  else if(o.weapon){
    var idx=-1; for(var i=0;i<WEAPONS.length;i++) if(WEAPONS[i].n===o.weapon) idx=i;
    if(idx>P.weaponIdx) P.weaponIdx=idx;
    say(['たからばこを あけた！\n「'+o.weapon+'」を てにいれた！','ゆうしゃは 「'+o.weapon+'」を\nそうびした！']);
  }
  else if(o.armor){
    var ai=-1; for(var j=0;j<ARMORS.length;j++) if(ARMORS[j].n===o.armor) ai=j;
    if(ai>P.armorIdx) P.armorIdx=ai;
    say(['たからばこを あけた！\n「'+o.armor+'」を てにいれた！','ゆうしゃは 「'+o.armor+'」を\nみに つけた！']);
  }
}
function useRainbow(){
  if(SAVE.flags.rainbow){ say(['にじの はしが かかっている。']); return; }
  if(itemCount('にじのしずく')<=0){ say(['うみが ゆくてを はばんでいる。','なにか はしを かける\nてだてが あれば…']); return; }
  useItemUp('にじのしずく'); SAVE.flags.rainbow=1; applyRainbow();
  SFX.chest(); flash=0.6; cam.shake=4;
  for(var i=0;i<40;i++) burst(27*TS+rnd(0,48),7*TS+8,1,pick(['#ff4040','#ffe040','#40e040','#40c0ff','#a040ff']),60);
  say(['にじのしずくを かかげた！','ひかりが うみを つらぬき\nにじの はしが かかった！']);
}
function kingTalk(){
  if(SAVE.flags.lordDead){
    say(['おうさま「ゆうしゃよ！\nよくぞ りゅうおうを たおした。','この くにの すべては\nそなたの ものじゃ！']);
    return;
  }
  var next=(P.lv<LV.length)?(LV[P.lv].e-P.exp):0;
  var pages=[];
  if(!SAVE.flags.quest){
    SAVE.flags.quest=1;
    pages=['おうさま「おお ゆうしゃよ！\nよくぞ もどった。',
      'ほくとうの しろに すむ りゅうおうが\nこの せかいを やみで つつんでおる。',
      'にしの どうくつに ねむる\n「ロトのつるぎ」を てにいれ\nりゅうおうを たおすのじゃ！',
      'まずは まちで そうびを ととのえよ。\nそなたに ゴールドを さずけよう。'];
    P.gold+=120;
  } else {
    pages=['おうさま「ゆうしゃ よ。\nそなたの レベルは '+P.lv+'。',
      (next>0?('つぎの レベルまで あと '+next+'の\nけいけんちが ひつようじゃ。'):'そなたは さいきょうの ゆうしゃじゃ！'),
      'りゅうおうを たおすのじゃぞ。'];
  }
  say(pages);
}
function saveTalk(){
  ask('ぼうけんの しょに\nきろくを つけますか？',['きろくする','やめる'],function(i){
    if(i===0){
      if(saveGame()){ SFX.chest(); say(['ぼうけんの しょに\nきろくを つけました。','おきをつけて いってらっしゃい。']); }
      else say(['きろくが できませんでした…']);
    }
  });
}

/* ---------- みせ ---------- */
var SHOPLIST={
  item:[{item:'やくそう'},{item:'まほうのせいすい'},{item:'キメラのつばさ'}],
  arms:[{w:1},{w:2},{w:3},{w:4},{a:1},{a:2},{a:3},{s:1},{s:2},{s:3}]
};
function openShop(kind,label){
  if(kind==='inn'){
    var cost=Math.max(6,P.lv*5);
    ask('やどや「ひとばん '+cost+'ゴールドだが\nとまって いくかね？',['はい','いいえ'],function(i){
      if(i!==0) return;
      if(P.gold<cost){ say(['やどや「おかねが たりないよ。']); return; }
      P.gold-=cost; P.hp=P.mhp; P.mp=P.mmp;
      fadeTo(function(){ SFX.heal(); });
      say(['おやすみなさい…','おはようございます。\nHPと MPが かんぜんに\nかいふくしました！']);
    });
    return;
  }
  if(kind==='church'){ saveTalk(); return; }
  var rows=SHOPLIST[kind]||[], items=[];
  for(var i=0;i<rows.length;i++){
    (function(r){
      var name,price,info;
      if(r.item){ name=r.item; price=ITEMS[r.item].p; info=ITEMS[r.item].info; }
      else if(r.w!==undefined){ name=WEAPONS[r.w].n; price=WEAPONS[r.w].p; info='こうげきりょく +'+WEAPONS[r.w].a; }
      else if(r.a!==undefined){ name=ARMORS[r.a].n; price=ARMORS[r.a].p; info='しゅびりょく +'+ARMORS[r.a].d; }
      else { name=SHIELDS[r.s].n; price=SHIELDS[r.s].p; info='しゅびりょく +'+SHIELDS[r.s].d; }
      items.push({label:name,right:price+'G',info:info,fn:function(){
        if(P.gold<price){ say(['おかねが たりないようだね。']); return; }
        ask('「'+name+'」を '+price+'ゴールド。\nかいますか？',['かう','やめる'],function(c){
          if(c!==0) return;
          P.gold-=price; SFX.buy();
          if(r.item){ addItem(name); say([name+'を てにいれた！']); }
          else if(r.w!==undefined){
            if(r.w<=P.weaponIdx){ say([name+'を てにいれた！','…だが すでに よい ぶきを\nそうびしている。']); }
            else { P.weaponIdx=r.w; say([name+'を そうびした！']); }
          }
          else if(r.a!==undefined){
            if(r.a<=P.armorIdx){ say([name+'を てにいれた！','…だが すでに よい よろいを\nそうびしている。']); }
            else { P.armorIdx=r.a; say([name+'を みに つけた！']); }
          }
          else {
            if(r.s<=P.shieldIdx){ say([name+'を てにいれた！','…だが すでに よい たてを\nそうびしている。']); }
            else { P.shieldIdx=r.s; say([name+'を かまえた！']); }
          }
        });
      }});
    })(rows[i]);
  }
  listMenu((label||'みせ')+'   もちきん '+P.gold+'G',items,{rows:6,wide:1});
}

function itemMenu(){
  if(!P.inv.length){ say(['どうぐを なにも もっていない。']); return; }

  for(var i=0;i<P.inv.length;i++){

        if(d.use==='heal'){
          if(P.hp>=P.mhp){ say(['HPは まんたんだ。']); return; }

          say(['HPが '+(P.hp-b)+'かいふくした！'],function(){ popUI(); });
        } else if(d.use==='mp'){
          if(P.mp>=P.mmp){ say(['MPは まんたんだ。']); return; }
          var b2=P.mp; P.mp=Math.min(P.mmp,P.mp+d.v); useItemUp(inv.n); SFX.heal();
          say(['MPが '+(P.mp-b2)+'かいふくした！'],function(){ popUI(); });

          say([inv.n+'\n'+(d.info||'ふしぎな どうぐだ。')]);

      }});

function spellMenu(){

/* ============================================================
   こうしん
   ============================================================ */
var endingT=0, titleIdx=0, mapNameT=0, started=false;

function fadeTo(cb){ if(fadeDir!==0) return; fadeDir=1; fadeCb=cb||null; }
function updateFade(dt){
  if(fadeDir===1){
    fade+=dt*3.2;
    if(fade>=1){ fade=1; fadeDir=-1; var cb=fadeCb; fadeCb=null; if(cb) cb(); }
  } else if(fadeDir===-1){
    fade-=dt*2.6;
    if(fade<=0){ fade=0; fadeDir=0; }
  }
}
function updatePlayer(dt){
  if(P.iframe>0) P.iframe-=dt;
  if(P.atkT>0){
    P.atkT-=dt;
    var pr=1-P.atkT/P.atkDur;
    if(pr>0.12&&pr<0.9) swordHit();
    if(P.atkT<0) P.atkT=0;
  }
  if(P.castT>0){ P.castT-=dt; if(P.castT<0) P.castT=0; }
  if(P.dead) return;

  var mx=(held.right?1:0)-(held.left?1:0), my=(held.down?1:0)-(held.up?1:0);
  var moving=(mx||my);
  if(moving){
    var l=Math.sqrt(mx*mx+my*my); mx/=l; my/=l;
    if(P.atkT<=0&&P.castT<=0){
      P.dir=(Math.abs(mx)>Math.abs(my))?(mx>0?'right':'left'):(my>0?'down':'up');
    }
    var sp=68*((P.atkT>0||P.castT>0)?0.4:1);
    tryMove(cur,P,mx*sp*dt,0);
    tryMove(cur,P,0,my*sp*dt);
    P.dist+=sp*dt;
    P.walk=1+(Math.floor(P.dist/9)%2);
  } else { P.walk=0; }
  /* ノックバック */
  if(Math.abs(P.kx)>1||Math.abs(P.ky)>1){
    tryMove(cur,P,P.kx*dt,0); tryMove(cur,P,0,P.ky*dt);
    P.kx*=Math.pow(0.0008,dt); P.ky*=Math.pow(0.0008,dt);
  } else { P.kx=P.ky=0; }
  /* NPCと重ならない */
  for(var i=0;i<cur.npcs.length;i++){
    var n=cur.npcs[i], dx=P.x-n.x, dy=(P.y+2)-n.y, d=Math.hypot(dx,dy);
    if(d<14&&d>0.01){ P.x=n.x+dx/d*14; P.y=n.y+dy/d*14-2; }
  }
  P.x=clamp(P.x,6,cur.w*TS-6); P.y=clamp(P.y,6,cur.h*TS-8);

  /* どくのぬま */
  var fc=mGet(cur,Math.floor(P.x/TS),Math.floor((P.y+3)/TS));
  if(TILE[fc]&&TILE[fc].dmg){
    P.poison+=dt;
    if(P.poison>0.85){
      P.poison=0; P.hp-=3; popNum(P.x,P.y-10,3,'#c080ff'); flash=0.1;
      if(P.hp<=0){ P.hp=0; playerDeath(); }
    }
  } else P.poison=0;

  /* そうさ */
  if(just.a){
    var it=findInteract();
    if(it) interact(it);
    else if(P.atkT<=0&&P.castT<=0) startAttack();
  }
  if(just.b) castSpell();
  if(just.menu) openMenu();

  /* ワープ */
  if(warpLock>0) warpLock-=dt;
  else{
    var tx=Math.floor(P.x/TS), ty=Math.floor((P.y+3)/TS);
    for(var w=0;w<cur.warps.length;w++){
      var wp=cur.warps[w];
      if(wp.x===tx&&wp.y===ty){
        var to=wp.to, dx2=wp.tx, dy2=wp.ty;
        SFX.stairs(); warpLock=0.6;
        fadeTo(function(){
          gotoMap(to,dx2,dy2);
          warpLock=0.5; mapNameT=2.4;
        });
        break;
      }
    }
  }
  /* ボス出現 */
  if(cur.id==='dcastle'&&!SAVE.flags.lordDead&&!bossRef){
    var br=cur.bossRoom;
    if(P.y<(br.y+br.h)*TS&&P.x>br.x*TS&&P.x<(br.x+br.w)*TS){
      bossRef=spawnAt('lord',(br.x+br.w/2)*TS,(br.y+2.5)*TS);
      bossRef.cd=2.2;
      playBGM('boss'); SFX.boss(); cam.shake=6;
      say(['りゅうおう「よくぞ ここまで きたな。','だが この さきへは いかせぬ！\nわが やみの ちからを みるがよい！']);
    }
  }
}
function updateNpcs(dt){
  for(var i=0;i<cur.npcs.length;i++){
    var n=cur.npcs[i];
    if(n.talk>0){ n.talk-=dt; continue; }
    if(!n.wander) continue;
    n.t-=dt;
    if(n.t<=0){
      n.t=rnd(1.2,3.0);
      if(Math.random()<0.55){
        var d=pick(['up','down','left','right']); n.dir=d;
        n.vx=DIRV[d][0]*16; n.vy=DIRV[d][1]*16; n.mt=rnd(0.4,0.9);
      } else { n.vx=n.vy=0; }
    }
    if(n.mt>0){
      n.mt-=dt;
      var nx=n.x+n.vx*dt, ny=n.y+n.vy*dt;
      if(Math.hypot(nx-n.hx,ny-n.hy)<44&&walkableAt(cur,nx,ny+3)&&Math.hypot(nx-P.x,ny-(P.y+2))>13){ n.x=nx; n.y=ny; }
      else n.mt=0;
    }
  }
}
function updateShots(dt){
  for(var i=shots.length-1;i>=0;i--){
    var s=shots[i];
    s.x+=s.vx*dt; s.y+=s.vy*dt; s.t+=dt; s.life-=dt;
    if(s.life<=0||!walkableAt(cur,s.x,s.y)){ burst(s.x,s.y,4,s.type==='fire'?'#ffb040':'#a0d0ff',40); shots.splice(i,1); continue; }
    if(s.o==='p'){
      for(var j=0;j<enemies.length;j++){
        var e=enemies[j]; if(e.dead) continue;
        var d=EN[e.k];
        if(Math.hypot(e.x-s.x,e.y-s.y)<d.r+s.r){
          var dmg=d.metal?rndi(0,1):Math.max(1,Math.round(s.dmg*rnd(0.85,1.15)*(1-Math.min(0.45,d.df/220))));
          var a=Math.atan2(e.y-s.y,e.x-s.x);
          hurtEnemy(e,dmg,Math.cos(a)*(d.boss?30:120),Math.sin(a)*(d.boss?30:120));
          if(!s.pierce){ shots.splice(i,1); break; }
        }
      }
    } else {
      if(!P.dead&&P.iframe<=0&&Math.hypot(P.x-s.x,(P.y+2)-s.y)<7+s.r){
        hurtPlayer(Math.max(1,Math.round(s.dmg-defPow()*0.35)),s.x,s.y);
        shots.splice(i,1);
      }
    }
  }
}
function updateFx(dt){
  for(var i=fx.length-1;i>=0;i--){
    var f=fx[i]; f.t+=dt;
    if(f.k==='ring'){
      var pr=f.t/f.dur, r=f.r0+(f.r1-f.r0)*pr;
      if(f.src==='p'){
        for(var j=0;j<enemies.length;j++){
          var e=enemies[j]; if(e.dead||f.hit[j]) continue;
          var d=EN[e.k];
          if(Math.abs(Math.hypot(e.x-f.x,e.y-f.y)-r)<d.r+10){
            f.hit[j]=1;
            var dmg=d.metal?rndi(0,1):Math.max(1,Math.round(f.dmg*rnd(0.85,1.15)*(1-Math.min(0.45,d.df/220))));
            hurtEnemy(e,dmg,0,0);
          }
        }
      } else {
        if(!P.dead&&!f.hitP&&P.iframe<=0&&Math.abs(Math.hypot(P.x-f.x,(P.y+2)-f.y)-r)<12){
          f.hitP=1; hurtPlayer(Math.max(1,Math.round(f.dmg-defPow()*0.3)),f.x,f.y);
        }
      }
    }
    if(f.t>=f.dur) fx.splice(i,1);
  }
  for(var k=parts.length-1;k>=0;k--){
    var p=parts[k]; p.t+=dt;
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=110*dt;
    if(p.t>=p.life) parts.splice(k,1);
  }
  for(var m=nums.length-1;m>=0;m--){
    var nn=nums[m]; nn.t+=dt; nn.y-=22*dt;
    if(nn.t>1.0) nums.splice(m,1);
  }
}
function updateWorld(dt){
  updatePlayer(dt);
  updateNpcs(dt);
  for(var i=enemies.length-1;i>=0;i--){
    var e=enemies[i];
    if(e.dead){ enemies.splice(i,1); continue; }
    updateEnemy(e,dt);
    if(e.dead) enemies.splice(i,1);
  }
  updateShots(dt);
  if(cur.spawn){
    spawnTimer-=dt;
    if(spawnTimer<=0){ spawnTimer=cur.spawn.rate; trySpawnRandom(); }
  }
}
function update(dt){
  GT+=dt;
  if(just.mute){ toggleMute(); }
  if(fadeDir!==0) updateFade(dt);
  if(flash>0) flash-=dt*1.6;
  if(cam.shake>0) cam.shake=Math.max(0,cam.shake-dt*22);
  if(mapNameT>0) mapNameT-=dt;
  if(scene==='title'){ updateTitle(dt); return; }
  if(scene==='ending'){ updateEnding(dt); return; }
  if(uiStack.length) updateUI(dt);
  else if(scene==='play') updateWorld(dt);
  else if(scene==='dead') { /* メッセージ待ち */ }
  updateFx(dt);
  /* カメラ */
  var tx=clamp(P.x-GW/2,0,Math.max(0,cur.w*TS-GW));
  var ty=clamp(P.y-GH/2,0,Math.max(0,cur.h*TS-GH));
  if(cur.w*TS<GW) tx=(cur.w*TS-GW)/2;
  if(cur.h*TS<GH) ty=(cur.h*TS-GH)/2;
  cam.x+=(tx-cam.x)*Math.min(1,dt*12);
  cam.y+=(ty-cam.y)*Math.min(1,dt*12);
}
function updateTitle(dt){
  var n=hasSave()?2:1;
  if(just.up){ titleIdx=(titleIdx+n-1)%n; SFX.menu(); }
  if(just.down){ titleIdx=(titleIdx+1)%n; SFX.menu(); }
  if(just.a||just.menu){
    SFX.ok();
    if(titleIdx===0){
      P=newPlayer(); SAVE.flags={};
      fadeTo(function(){
        gotoMap('castle',MAPS.castle.entry.x,MAPS.castle.entry.y);
        scene='play'; mapNameT=2.4;
        say(['ラダトーム城 ──','ゆうしゃは おうさまに\nよばれている。','（おうさまに はなしかけよう）']);
      });
    } else {
      fadeTo(function(){
        if(loadGame()){ scene='play'; mapNameT=2.4; }
        else { scene='title'; }
      });
    }
  }
}
function updateEnding(dt){
  endingT+=dt;
  if(endingT>26||just.a){ if(just.a&&endingT<1) return; scene='title'; titleIdx=0; endingT=0; }
}

/* ============================================================
   びょうが
   ============================================================ */
function drawShot(s){
  var x=Math.round(s.x), y=Math.round(s.y);
  if(s.type==='fire'){
    ell(x,y,s.r+1.5+Math.sin(s.t*30),s.r+1.5,'rgba(255,120,20,.55)');
    ell(x,y,s.r*0.8,s.r*0.8,'#ffd050');
  } else if(s.type==='wind'){
    g.strokeStyle='#e0f8ff'; g.lineWidth=2;
    g.beginPath(); g.arc(x,y,s.r+2,s.t*12,s.t*12+2.4); g.stroke(); g.lineWidth=1;
    ell(x,y,2,2,'#fff');
  } else if(s.type==='ice'){
    ell(x,y,s.r,s.r,'rgba(120,220,255,.7)'); ell(x,y,s.r*0.5,s.r*0.5,'#fff');
  } else {
    ell(x,y,s.r+1,s.r+1,'rgba(150,60,220,.6)'); ell(x,y,s.r*0.6,s.r*0.6,'#e0b0ff');
  }
}
function renderWorld(){
  g.fillStyle=cur.theme==='cave'?'#000':'#0a0a12';
  g.fillRect(0,0,GW,GH);
  var sx=0,sy=0;
  if(cam.shake>0){ sx=rnd(-cam.shake,cam.shake); sy=rnd(-cam.shake,cam.shake); }
  var ox=-Math.round(cam.x)+Math.round(sx), oy=-Math.round(cam.y)+Math.round(sy);
  g.save(); g.translate(ox,oy);
  var ts=tilesFor(cur.theme);
  var x0=Math.max(0,Math.floor(cam.x/TS)-1), x1=Math.min(cur.w-1,Math.floor((cam.x+GW)/TS)+1);
  var y0=Math.max(0,Math.floor(cam.y/TS)-1), y1=Math.min(cur.h-1,Math.floor((cam.y+GH)/TS)+1);
  var wf=Math.floor(GT*3.5);
  for(var y=y0;y<=y1;y++) for(var x=x0;x<=x1;x++){
    var ch=cur.t[y][x], arr=ts[ch]||ts[' '];
    var idx=(ch==='~')?(wf%arr.length):Math.floor(hash2(x,y)*arr.length);
    g.drawImage(arr[idx],x*TS,y*TS);
  }
  if(cur.houses) for(var hI=0;hI<cur.houses.length;hI++) drawHouse(cur.houses[hI]);
  /* Yソートで描画 */
  var list=[];
  for(var i=0;i<cur.objs.length;i++){
    var o=cur.objs[i];
    if(o.x*TS<cam.x-80||o.x*TS>cam.x+GW+80||o.y*TS<cam.y-120||o.y*TS>cam.y+GH+80) continue;
    list.push({y:o.y*TS+(o.kind==='struct'?10:14),d:function(o){return function(){drawObj(o,GT);};}(o)});
  }
  for(var j=0;j<cur.npcs.length;j++){
    var n=cur.npcs[j];
    list.push({y:n.y,d:function(n){return function(){drawNpc(n,GT);};}(n)});
  }
  for(var k=0;k<enemies.length;k++){
    var e=enemies[k];
    list.push({y:e.y,d:function(e){return function(){drawEnemy(e,GT);};}(e)});
  }
  if(!P.dead) list.push({y:P.y,d:function(){ drawPlayer(P); }});
  list.sort(function(a,b){return a.y-b.y;});
  for(var m=0;m<list.length;m++) list[m].d();

  for(var s=0;s<shots.length;s++) drawShot(shots[s]);
  for(var f=0;f<fx.length;f++){
    var ff=fx[f];
    if(ff.k==='ring'){
      var pr=ff.t/ff.dur, r=ff.r0+(ff.r1-ff.r0)*pr;
      g.strokeStyle=ff.c; g.globalAlpha=Math.max(0,1-pr);
      g.lineWidth=4; g.beginPath(); g.arc(Math.round(ff.x),Math.round(ff.y),r,0,6.2832); g.stroke();
      g.lineWidth=1; g.globalAlpha=1;
    }
  }
  for(var p=0;p<parts.length;p++){
    var pa=parts[p];
    g.globalAlpha=Math.max(0,1-pa.t/pa.life);
    R(g,Math.round(pa.x),Math.round(pa.y),Math.round(pa.r),Math.round(pa.r),pa.c);
    g.globalAlpha=1;
  }
  g.font='bold 9px monospace'; g.textAlign='center';
  for(var q=0;q<nums.length;q++){
    var nu=nums[q];
    if(nu.v<=0) continue;
    g.globalAlpha=Math.max(0,1-nu.t);
    g.fillStyle='#000'; g.fillText(nu.v,Math.round(nu.x)+1,Math.round(nu.y)+1);
    g.fillStyle=nu.col; g.fillText(nu.v,Math.round(nu.x),Math.round(nu.y));
    g.globalAlpha=1;
  }
  g.textAlign='left';
  g.restore();
  /* くらやみ */
  if(cur.dark){
    var px=P.x-cam.x+Math.round(sx), py=P.y-cam.y+Math.round(sy);
    var rad=cur.dark>=1?86:150;
    var gr=g.createRadialGradient(px,py,8,px,py,rad);
    gr.addColorStop(0,'rgba(0,0,0,0)');
    gr.addColorStop(0.55,'rgba(0,0,0,'+(cur.dark*0.45)+')');
    gr.addColorStop(1,'rgba(0,0,0,'+(cur.dark>=1?0.96:0.72)+')');
    g.fillStyle=gr; g.fillRect(0,0,GW,GH);
  }
  if(flash>0){ g.fillStyle='rgba(255,255,255,'+Math.min(0.6,flash)+')'; g.fillRect(0,0,GW,GH); }
}
function renderTitle(){
  g.fillStyle='#060a1e'; g.fillRect(0,0,GW,GH);
  for(var i=0;i<60;i++){
    var x=Math.floor(hash2(i,7)*GW), y=Math.floor(hash2(i,13)*140);
    var b=0.4+0.6*Math.abs(Math.sin(GT*1.5+i));
    R(g,x,y,1,1,'rgba(255,255,255,'+b+')');
  }
  ell(258,38,15,15,'#f0e8c0'); ell(252,34,13,13,'#060a1e');
  g.fillStyle='#101a34';
  g.beginPath(); g.moveTo(0,170); g.lineTo(60,120); g.lineTo(120,170); g.lineTo(190,110); g.lineTo(260,170); g.lineTo(320,130); g.lineTo(320,240); g.lineTo(0,240); g.closePath(); g.fill();
  g.fillStyle='#0a1024';
  R(g,132,120,56,56,'#0a1024'); R(g,124,110,14,66,'#0a1024'); R(g,182,110,14,66,'#0a1024');
  R(g,152,150,16,26,'#1a2444');
  R(g,128,100,6,10,'#8a2030'); R(g,186,100,6,10,'#8a2030');
  g.fillStyle='#050810'; g.fillRect(0,176,GW,64);
  R(g,0,176,GW,2,'#16204a');
  drawHeroBody(272,208,'left',Math.floor(GT*3)%2?1:2,'#2f52d0','#1e3aa0');
  drawSlime(46,214,6,'#3f8ff0',GT,0);
}
function lerpCol(a,b,t){
  var c=[0,0,0];
  for(var i=0;i<3;i++) c[i]=Math.round(a[i]+(b[i]-a[i])*t);
  return 'rgb('+c[0]+','+c[1]+','+c[2]+')';
}
function renderEnding(){
  var t=endingT, horizon=170;
  var sun=Math.max(0,Math.min(1,(t-2)/9));
  var grd=g.createLinearGradient(0,0,0,horizon);
  grd.addColorStop(0,lerpCol([4,6,20],[46,86,168],sun));
  grd.addColorStop(0.55,lerpCol([10,14,44],[126,140,198],sun));
  grd.addColorStop(1,lerpCol([18,20,52],[248,178,96],sun));
  g.fillStyle=grd; g.fillRect(0,0,GW,horizon);
  for(var i=0;i<50;i++){
    var x=Math.floor(hash2(i,3)*GW), y=Math.floor(hash2(i,9)*110);
    var a=(0.3+0.7*Math.abs(Math.sin(GT+i)))*(1-sun);
    if(a>0.02) R(g,x,y,1,1,'rgba(255,255,255,'+a+')');
  }
  var sy=horizon+14-sun*54;
  g.globalAlpha=0.35; ell(160,sy,34,34,'#ffd070'); g.globalAlpha=1;
  ell(160,sy,22,22,'#ffe9a0');
  g.fillStyle='rgba(255,225,150,'+(0.05+sun*0.12)+')'; g.fillRect(0,0,GW,horizon);
  g.fillStyle=lerpCol([10,32,24],[26,96,50],sun); g.fillRect(0,horizon,GW,GH-horizon);
  for(var j=0;j<14;j++){
    var tx=(j*29+11)%GW, ty=horizon+8+((j*13)%46);
    R(g,tx,ty+4,2,5,lerpCol([8,20,14],[74,48,24],sun));
    R(g,tx-4,ty-3,10,8,lerpCol([12,40,22],[36,122,58],sun));
    R(g,tx-2,ty-6,6,4,lerpCol([14,48,26],[52,150,70],sun));
  }
  var hx=36+Math.min(250,t*10);
  drawHeroBody(hx,horizon+34,'right',Math.floor(GT*4)%2?1:2,'#2f52d0','#1e3aa0');
}

/* ============================================================
   UIキャンバス（ウィンドウ・もじ）
   ============================================================ */
function uiFont(sz,bold){
  u.font=(bold?'bold ':'')+Math.max(8,Math.round(sz*SC))+'px "DotGothic16","MS Gothic","Hiragino Kaku Gothic ProN",monospace';
}
function ut(s,x,y,sz,col,align,bold){
  uiFont(sz,bold); u.fillStyle=col||'#fff';
  u.textAlign=align||'left'; u.textBaseline='alphabetic';
  u.fillText(s,x*SC,y*SC);
}
function uwin(x,y,w,h){
  var X=x*SC,Y=y*SC,W=w*SC,H=h*SC, lw=Math.max(1.5,1.7*SC);
  u.fillStyle='rgba(6,10,38,0.94)'; u.fillRect(X,Y,W,H);
  u.strokeStyle='#ffffff'; u.lineWidth=lw;
  u.strokeRect(X+lw/2,Y+lw/2,W-lw,H-lw);
  u.strokeStyle='rgba(255,255,255,0.35)'; u.lineWidth=Math.max(1,0.8*SC);
  u.strokeRect(X+lw*1.9,Y+lw*1.9,W-lw*3.8,H-lw*3.8);
  u.lineWidth=1;
}
function ubar(x,y,w,h,r,col,bg){
  u.fillStyle=bg; u.fillRect(x*SC,y*SC,w*SC,h*SC);
  u.fillStyle=col; u.fillRect(x*SC,y*SC,w*SC*clamp(r,0,1),h*SC);
  u.strokeStyle='rgba(255,255,255,.5)'; u.lineWidth=Math.max(1,SC*0.5);
  u.strokeRect(x*SC,y*SC,w*SC,h*SC); u.lineWidth=1;
}
function wrapLines(s,sz,maxw){
  uiFont(sz);
  var out=[], para=String(s).split('\n');
  for(var p=0;p<para.length;p++){
    var line='', src=para[p];
    if(src===''){ out.push(''); continue; }
    for(var i=0;i<src.length;i++){
      var t=line+src.charAt(i);
      if(u.measureText(t).width/SC>maxw){ out.push(line); line=src.charAt(i); }
      else line=t;
    }
    out.push(line);
  }
  return out;
}
function drawHUD(){
  uwin(4,4,116,44);
  ut('Lv '+P.lv,11,19,10,'#ffffff');
  ut(P.gold+'G',113,19,10,'#ffe070','right');
  ut('HP',11,31,8,'#a8b8d8');
  ubar(26,25,88,8,P.hp/P.mhp,P.hp/P.mhp<0.3?'#e04040':'#3ad04a','#1a2038');
  ut(P.hp+'/'+P.mhp,70,32,7.5,'#ffffff','center');
  ut('MP',11,43,8,'#a8b8d8');
  ubar(26,37,88,8,P.mmp?P.mp/P.mmp:0,'#4090f0','#1a2038');
  ut(P.mp+'/'+P.mmp,70,44,7.5,'#ffffff','center');
  if(P.spells.length){
    var nm=P.spells[P.spellIdx%P.spells.length];
    uwin(4,206,108,30);
    ut('じゅもん(X)',10,218,7.5,'#9fb0d8');
    ut(nm+' '+SPELLS[nm].mp+'MP',10,231,9,'#ffffff');
  }
  var bref=null;
  for(var i=0;i<enemies.length;i++) if(EN[enemies[i].k].boss) bref=enemies[i];
  if(bref){
    uwin(126,6,188,26);
    ut('りゅうおう',134,21,9.5,'#ffb0b0');
    ubar(190,12,116,11,bref.hp/bref.mhp,'#e03050','#2a1020');
  }
  if(mapNameT>0){
    var a=Math.min(1,mapNameT);
    u.globalAlpha=a;
    uwin(84,52,152,26);
    ut(cur.name,160,70,11,'#ffffff','center');
    u.globalAlpha=1;
  }
}
function drawMsgWin(t){
  uwin(6,162,308,72);
  var page=t.pages[t.i]||'';
  var lines=wrapLines(page,11.5,286);
  var shown=Math.floor(t.ch), used=0;
  for(var i=0;i<lines.length&&i<4;i++){
    var ln=lines[i];
    var take=clamp(shown-used,0,ln.length);
    if(take>0) ut(ln.substring(0,take),16,182+i*16,11.5,'#ffffff');
    used+=ln.length;
  }
  var full=0; for(var j=0;j<lines.length;j++) full+=lines[j].length;
  if(shown>=full && Math.floor(GT*2.5)%2===0) ut('▼',300,230,10,'#ffffff','right');
}
function drawChoiceWin(t){
  uwin(6,162,308,72);
  var lines=wrapLines(t.q,11.5,286);
  for(var i=0;i<lines.length&&i<2;i++) ut(lines[i],16,182+i*16,11.5,'#ffffff');
  var w=96, h=14+t.opts.length*17;
  uwin(212,158-h,w,h);
  for(var j=0;j<t.opts.length;j++){
    var y=158-h+20+j*17;
    if(j===t.i) ut('▶',220,y,10,'#ffe070');
    ut(t.opts[j],234,y,10.5,'#ffffff');
  }
}
function drawListWin(t,depth){
  var rows=Math.min(t.rows,t.items.length);
  var h=44+rows*17+(t.items[0]&&t.items[0].info!==undefined?14:0);
  var w=t.wide?236:180;
  var d=Math.min(depth||0,2);
  var x=(320-w)/2-14+d*22, y=26+d*13;
  uwin(x,y,w,h);
  ut(t.title,x+12,y+20,10.5,'#ffe070');
  u.strokeStyle='rgba(255,255,255,.35)'; u.lineWidth=Math.max(1,SC*0.6);
  u.beginPath(); u.moveTo((x+8)*SC,(y+26)*SC); u.lineTo((x+w-8)*SC,(y+26)*SC); u.stroke(); u.lineWidth=1;
  for(var i=0;i<rows;i++){
    var idx=t.top+i; if(idx>=t.items.length) break;
    var it=t.items[idx], yy=y+44+i*17;
    if(idx===t.i) ut('▶',x+10,yy,10,'#ffe070');
    ut(it.label,x+24,yy,10.5,'#ffffff');
    if(it.right) ut(it.right,x+w-14,yy,10,'#a8e0ff','right');
  }
  if(t.top>0) ut('▲',x+w-14,y+40,8,'#8898c0','right');
  if(t.top+rows<t.items.length) ut('▼',x+w-14,y+h-16,8,'#8898c0','right');
  var sel=t.items[t.i];
  if(sel&&sel.info) ut(sel.info,x+12,y+h-10,9,'#9fb0d8');
}
function renderUI(){
  u.clearRect(0,0,DW,DH);
  if(scene==='title'){
    var ty=70;
    uiFont(30,1);
    u.textAlign='center';
    u.fillStyle='#0a0f2a'; u.fillText('ドラゴンソード',160*SC+2*SC,ty*SC+2*SC);
    u.fillStyle='#ffe070'; u.fillText('ドラゴンソード',160*SC,ty*SC);
    ut('ドラゴンクエスト風 アクションRPG',160,92,10.5,'#c8d4f0','center');
    var opts=hasSave()?['はじめから','つづきから']:['はじめから'];
    for(var i=0;i<opts.length;i++){
      var y=130+i*22;
      if(i===titleIdx) ut('▶',108,y,12,'#ffe070');
      ut(opts[i],124,y,12,'#ffffff');
    }
    ut('Z / タップ で けってい',160,196,9,'#8898c0','center');
    ut('スマホは ボタンで そうさ',160,210,9,'#68749c','center');
  } else if(scene==='ending'){
    var t=endingT;
    var pages=[
      [3,'まおう りゅうおうは たおれた。'],
      [7,'やみに とざされた アレフガルドに\nあさひが さしこむ──'],
      [12,'ひとびとは ゆうしゃの なを\nいつまでも かたりついだ。'],
      [17,'── そして でんせつが はじまった ──']
    ];
    var shownCount=0;
    for(var p=0;p<pages.length;p++) if(t>pages[p][0]) shownCount=p+1;
    if(shownCount>0){
      uwin(20,26,280,86);
      var yy=48;
      for(var q=0;q<shownCount;q++){
        var ls=wrapLines(pages[q][1],11,258);
        for(var r2=0;r2<ls.length;r2++){ ut(ls[r2],34,yy,11,'#ffffff'); yy+=16; }
        yy+=2;
      }
    }
    if(t>20){
      uwin(88,120,144,44);
      ut('レベル '+P.lv,100,140,10,'#ffffff');
      ut('ゴールド '+P.gold,100,156,10,'#ffe070');
      if(Math.floor(GT*2)%2===0) ut('Zで タイトルへ',160,182,9,'#8898c0','center');
    }
  } else {
    drawHUD();
    var depth=0;
    for(var ui=0;ui<uiStack.length;ui++){
      var t2=uiStack[ui];
      if(t2.k==='msg') drawMsgWin(t2);
      else if(t2.k==='choice') drawChoiceWin(t2);
      else if(t2.k==='list'){ drawListWin(t2,depth); depth++; }
    }
  }
  if(fade>0){ u.fillStyle='rgba(0,0,0,'+clamp(fade,0,1)+')'; u.fillRect(0,0,DW,DH); }
}
function render(){
  g.setTransform(1,0,0,1,0,0);
  if(scene==='title') renderTitle();
  else if(scene==='ending') renderEnding();
  else renderWorld();
  renderUI();
}

/* ============================================================
   きどう
   ============================================================ */
var last=0;
function loop(ts){
  var dt=last?Math.min(0.05,(ts-last)/1000):0.016;
  last=ts;
  update(dt);
  render();
  clearJust();
  requestAnimationFrame(loop);
}
function unlockAudio(){
  ac();
  if(scene==='title'&&!BGM.name&&!muted) playBGM('castle');
}
window.addEventListener('pointerdown',unlockAudio);
window.addEventListener('keydown',unlockAudio);

resize();
P=newPlayer();
cur=MAPS.castle;
P.x=MAPS.castle.entry.x*TS+8; P.y=MAPS.castle.entry.y*TS+8;
camSnap();
scene='title';
requestAnimationFrame(loop);

})();

"use strict";
/* =========================================================================
   DRAGON SPIRITS NEO
   ドラゴンスピリッツ風 縦スクロールシューティング（single file / no assets）
   ・空中弾と地上弾（ボム）の撃ち分け（空中敵＝ショット / 地上敵＝ボム）
   ・首の数＝ショット数＝体力（被弾で1本ずつ減る）
   ・卵を爆破してパワーアップ／全8エリア＋ループ
   ========================================================================= */
const CV = document.getElementById('cv');
const X  = CV.getContext('2d');
const W = 600, H = 800;
const TAU = Math.PI*2;
const rnd  = (a=1,b=0)=> b + Math.random()*(a-b);
const rint = (a,b)=> Math.floor(rnd(a,b));
const clamp= (v,a,b)=> v<a?a:v>b?b:v;
const lerp = (a,b,t)=> a+(b-a)*t;
const dist2= (a,b,c,d)=>{const dx=a-c,dy=b-d;return dx*dx+dy*dy;};
const ang  = (a,b,c,d)=> Math.atan2(d-b,c-a);
function mkRng(seed){ let s=(seed>>>0)||1; return ()=>{ s=(s*1664525+1013904223)>>>0; return s/4294967296; }; }

/* ------------------------------------------------------------------ audio */
const Snd = {
  ctx:null, mst:null, sfx:null, bgmG:null, muted:false, song:null, timer:null, step:0, nt:0, spb:.1,
  init(){
    if(this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    this.ctx = new AC();
    this.mst = this.ctx.createGain(); this.mst.gain.value=.75; this.mst.connect(this.ctx.destination);
    this.sfx = this.ctx.createGain(); this.sfx.gain.value=.5;  this.sfx.connect(this.mst);
    this.bgmG= this.ctx.createGain(); this.bgmG.gain.value=.26; this.bgmG.connect(this.mst);
    this.noiseBuf = this.ctx.createBuffer(1, Math.floor(this.ctx.sampleRate*1.2), this.ctx.sampleRate);
    const d=this.noiseBuf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  },
  resume(){ if(this.ctx && this.ctx.state==='suspended') this.ctx.resume(); },
  tone(f1,f2,dur,type,vol){
    if(!this.ctx||this.muted) return;
    const t=this.ctx.currentTime, o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type=type||'square'; o.frequency.setValueAtTime(f1,t);
    if(f2 && f2!==f1) o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+dur);
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(vol||.3,t+.006);
    g.gain.exponentialRampToValueAtTime(.0008,t+dur);
    o.connect(g); g.connect(this.sfx); o.start(t); o.stop(t+dur+.02);
  },
  noise(dur,vol,f0,f1,q,hp){
    if(!this.ctx||this.muted) return;
    const t=this.ctx.currentTime, s=this.ctx.createBufferSource(), g=this.ctx.createGain(), bp=this.ctx.createBiquadFilter();
    s.buffer=this.noiseBuf; bp.type=hp?'highpass':'lowpass'; bp.Q.value=q||1;
    bp.frequency.setValueAtTime(f0,t); bp.frequency.exponentialRampToValueAtTime(Math.max(60,f1||f0*.2),t+dur);
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
    s.connect(bp); bp.connect(g); g.connect(this.sfx); s.start(t); s.stop(t+dur);
  },
  shot(){ this.tone(1180,520,.055,'square',.10); },
  bomb(){ this.tone(300,110,.09,'triangle',.13); },
  blast(){ this.noise(.26,.24,1500,90,1.6); this.tone(160,50,.24,'triangle',.13); },
  hit(){ this.tone(430,220,.045,'square',.09); },
  ping(){ this.tone(2300,1600,.03,'square',.05); },
  boom(sz){ this.noise(sz>1?.7:.34, sz>1?.4:.26, sz>1?1400:2300, 60, 2);
            this.tone(sz>1?140:240, 40, sz>1?.55:.3,'triangle',.15); },
  egg(){ this.tone(1400,900,.06,'square',.12); this.noise(.12,.12,3000,600); },
  item(){ [0,4,7,12].forEach((n,i)=>setTimeout(()=>this.tone(523*Math.pow(2,n/12),0,.08,'square',.16), i*42)); },
  head(){ [0,5,9,12,17].forEach((n,i)=>setTimeout(()=>this.tone(392*Math.pow(2,n/12),0,.1,'square',.17), i*55)); },
  damage(){ this.noise(.35,.3,900,80,2); this.tone(300,90,.3,'sawtooth',.16); },
  dead(){ this.noise(1.0,.4,1700,50,3); this.tone(420,45,1.0,'sawtooth',.2); },
  warn(){ this.tone(920,700,.18,'square',.19); },
  roar(){ this.noise(.85,.3,420,70,4); this.tone(120,60,.85,'sawtooth',.18); },
  extend(){ [0,4,7,12,16,19,24].forEach((n,i)=>setTimeout(()=>this.tone(440*Math.pow(2,n/12),0,.12,'square',.17), i*62)); },
  hz(n){ return 440*Math.pow(2,(n-69)/12); },
  songs:{},
  playBgm(id){
    this.init(); if(!this.ctx) return;
    if(this.song===id && this.timer) return;
    this.stopBgm(); this.song=id; this.step=0;
    const s=this.songs[id]; if(!s) return;
    this.spb = 60/(s.bpm*4);
    this.nt = this.ctx.currentTime + .06;
    this.timer = setInterval(()=>this.sched(), 25);
  },
  stopBgm(){ if(this.timer){ clearInterval(this.timer); this.timer=null; } this.song=null; },
  sched(){
    if(!this.ctx) return;
    if(this.muted){ this.nt=Math.max(this.nt,this.ctx.currentTime+.06); return; }
    const s=this.songs[this.song]; if(!s) return;
    while(this.nt < this.ctx.currentTime + .15){
      const t=this.nt, st=this.step;
      const ln=s.lead[st % s.lead.length]; if(ln) this.n(ln,t,this.spb*1.7,'square',.16);
      const bn=s.bass[st % s.bass.length]; if(bn) this.n(bn,t,this.spb*1.5,'triangle',.30);
      const hn=s.harm ? s.harm[st % s.harm.length] : 0; if(hn) this.n(hn,t,this.spb*1.4,'sawtooth',.07);
      const dc=s.drum[st % s.drum.length];
      if(dc==='k'||dc==='s'||dc==='h') this.dk(t,dc);
      this.nt += this.spb; this.step++;
    }
  },
  n(note,t,dur,type,vol){
    const o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type=type; o.frequency.setValueAtTime(this.hz(note),t);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.01);
    g.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.connect(g); g.connect(this.bgmG); o.start(t); o.stop(t+dur+.02);
  },
  dk(t,k){
    const g=this.ctx.createGain();
    if(k==='k'){
      const o=this.ctx.createOscillator(); o.type='sine';
      o.frequency.setValueAtTime(155,t); o.frequency.exponentialRampToValueAtTime(45,t+.11);
      g.gain.setValueAtTime(.42,t); g.gain.exponentialRampToValueAtTime(.001,t+.13);
      o.connect(g); g.connect(this.bgmG); o.start(t); o.stop(t+.15);
    } else {
      const s=this.ctx.createBufferSource(), f=this.ctx.createBiquadFilter();
      s.buffer=this.noiseBuf; f.type = k==='s'?'bandpass':'highpass';
      f.frequency.value = k==='s'?1600:7200; f.Q.value=1;
      g.gain.setValueAtTime(k==='s'?.24:.09,t);
      g.gain.exponentialRampToValueAtTime(.001,t+(k==='s'?.14:.05));
      s.connect(f); f.connect(g); g.connect(this.bgmG); s.start(t); s.stop(t+.2);
    }
  }
};

/* ------------------------------------------------------------------ input */
const Key = {};
const Pad = { move:false, mx:0, my:0, tx:0, ty:0, shot:false };
const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints>0;
if(isTouch) document.body.classList.add('touch');
let autoFire = isTouch;

addEventListener('keydown', e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','Enter'].includes(e.key)) e.preventDefault();
  if(e.repeat) return;
  Key[e.code]=true; Snd.init(); Snd.resume();
  if(e.code==='KeyP'||e.code==='Escape') Game.togglePause();
  if(e.code==='KeyM') Game.toggleMute();
  if(e.code==='KeyC') Game.toggleAuto();
  if(e.code==='KeyX'||e.code==='ShiftLeft'||e.code==='ShiftRight') Game.useBomb();
  if(e.code==='Enter'||e.code==='Space'||e.code==='KeyZ') Game.confirm();
  if(Game.state==='title'){
    if(e.code==='ArrowLeft')  Game.menuMove(-1);
    if(e.code==='ArrowRight') Game.menuMove(1);
    if(e.code==='ArrowUp')    Game.menuSel(-1);
    if(e.code==='ArrowDown')  Game.menuSel(1);
  }
});
addEventListener('keyup', e=>{ Key[e.code]=false; });
addEventListener('blur', ()=>{ for(const k in Key) Key[k]=false; Pad.move=false; Pad.shot=false; });

function cpos(t){
  const r=CV.getBoundingClientRect();
  return { x:(t.clientX-r.left)*(W/r.width), y:(t.clientY-r.top)*(H/r.height) };
}
CV.addEventListener('pointerdown', e=>{
  CV.setPointerCapture(e.pointerId);
  Snd.init(); Snd.resume();
  const p=cpos(e);
  if(Game.state==='title'){ Game.titleTap(p); return; }
  Game.confirm();
  if(isTouch){ Pad.move=true; Pad.mx=p.x; Pad.my=p.y; Pad.tx=P.x; Pad.ty=P.y; }
});
CV.addEventListener('pointermove', e=>{
  if(!Pad.move) return;
  const p=cpos(e);
  Pad.tx += (p.x-Pad.mx)*1.4; Pad.ty += (p.y-Pad.my)*1.4;
  Pad.mx=p.x; Pad.my=p.y;
  Pad.tx=clamp(Pad.tx,0,W); Pad.ty=clamp(Pad.ty,0,H);
});
const endPtr = ()=>{ Pad.move=false; };
CV.addEventListener('pointerup', endPtr);
CV.addEventListener('pointercancel', endPtr);

function bindPad(id,on,off){
  const el=document.getElementById(id);
  el.addEventListener('pointerdown', e=>{ e.preventDefault(); e.stopPropagation(); Snd.init(); Snd.resume(); on(); });
  el.addEventListener('pointerup',   e=>{ e.preventDefault(); e.stopPropagation(); if(off) off(); });
  el.addEventListener('pointercancel', e=>{ if(off) off(); });
}
bindPad('bShot', ()=>{ Pad.shot=true; Game.confirm(); }, ()=>{ Pad.shot=false; });
bindPad('bBomb', ()=>{ Game.useBomb(); });
bindPad('bPause',()=>{ Game.togglePause(); });
bindPad('bMute', ()=>{ Game.toggleMute(); });
bindPad('bAuto', ()=>{ Game.toggleAuto(); });

const GLINE = 640;   // 画面上でプレイヤーが立つ基準ライン（地形マッピング用）

function sy(wy){ return GLINE - (wy - scrollY); }          // 世界Y → 画面Y
function wy(scr){ return scrollY + GLINE - scr; }          // 画面Y → 世界Y
function A(){ return AREAS[Game.areaIdx % AREAS.length]; }

/* --------------------------------------------------------------- terrain */
/* 地形は「うねる帯（川・溶岩・道）」＋散らばったプロップで表現する          */
function bandX(wYy, a){
  return W*0.5 + Math.sin(wYy*0.0016)*118 + Math.sin(wYy*0.0043+1.7)*52;
}
function bandHalf(wYy){
  return 92 + Math.sin(wYy*0.0031+.6)*30;
}
function genProps(areaIdx, len){
  const a=AREAS[areaIdx], R=mkRng(0x9e37+areaIdx*7919), list=[];
  for(let y=-400; y<len+900; y+=54){
    const n = 1 + (R()<.5?1:0);
    for(let k=0;k<n;k++){
      const px = R()*W;
      const bx = bandX(y), bh = bandHalf(y);
      if(Math.abs(px-bx) < bh+18) continue;           // 帯の上には置かない
      const t = a.prop[Math.floor(R()*a.prop.length)];
      list.push({ x:px, y:y+R()*40, t, s:.7+R()*.65, r:R()*TAU, f:R() });
    }
  }
  return list;
}

/* --------------------------------------------------------------- effects */
function spark(x,y,n,col,sp,life){
  for(let i=0;i<n;i++){
    const a=rnd(TAU), v=rnd(sp||210,30);
    parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:rnd(3.6,1.2),c:col||'#ffd27a',t:0,life:life||rnd(.6,.25),g:rnd(160,0)});
  }
}
function explode(x,y,sz,col){
  rings.push({x,y,r:sz*.3,max:sz*2.1,t:0,life:.42,c:col||'#ffca6a',w:4});
  spark(x,y,Math.floor(sz*.85),col||'#ffb14a',sz*9,.62);
  spark(x,y,Math.floor(sz*.5),'#fff2c8',sz*5,.36);
  for(let i=0;i<Math.max(3,sz*.35);i++){
    parts.push({x:x+rnd(sz,-sz),y:y+rnd(sz,-sz),vx:rnd(40,-40),vy:rnd(-20,-90),r:rnd(11,5),
                c:'rgba(70,60,60,.55)',t:0,life:rnd(.9,.5),g:-40,smoke:true});
  }
}
function popText(x,y,s,col,sz){ texts.push({x,y,s,c:col||'#ffe9a8',t:0,life:1.1,sz:sz||16}); }
function shakeIt(v){ shake=Math.max(shake,v); }
function flashIt(v,c){ flash=Math.max(flash,v); flashCol=c||'#fff'; }

/* ---------------------------------------------------------------- player */
const P = {
  x:W/2, y:600, heads:3, level:0, weapon:'normal', spd:2, small:false,
  inv:0, dead:false, deadT:0, fireT:0, bombT:0, flap:0, tilt:0, hist:[],
  stockBomb:2, mut:0
};
const SPEEDS=[190,240,290,345];
function playerScale(){ return P.small?0.66:1; }
function playerR(){ return (P.small?9:15); }

function resetPlayer(full){
  P.heads=full?3:1; P.level=0; P.weapon='normal'; P.spd=1; P.small=false;
  P.inv=2.4; P.dead=false; P.deadT=0; P.hist.length=0; P.mut=0;
}
/* 首の位置（描画・発射位置とも共通） */
function headPos(){
  const s=playerScale(), out=[];
  const wob=Math.sin(gTime*7)*3*s;
  if(P.heads>=1) out.push({x:P.x, y:P.y-30*s+wob*.4, a:-Math.PI/2, i:0});
  if(P.heads>=2) out.push({x:P.x-24*s, y:P.y-20*s-wob*.5, a:-Math.PI/2-0.17, i:1});
  if(P.heads>=3) out.push({x:P.x+24*s, y:P.y-20*s+wob*.5, a:-Math.PI/2+0.17, i:2});
  return out;
}
function addBullet(x,y,a,pow,type,ds,rs){
  const sp = type==='home'?300:520;
  bullets.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,a,r:(pow>1?9:7)*(rs||1),
                dmg:(1+pow*.5)*(ds||1), type:type||'normal',t:0,tgt:null});
}
function firePlayer(){
  const hs=headPos(), pw=P.level;
  for(const h of hs){
    if(P.weapon==='wide'){
      const sp=0.20+0.03*pw;
      addBullet(h.x,h.y,h.a-sp,pw,'normal',.5,.62);
      addBullet(h.x,h.y,h.a,pw,'normal',.5,.62);
      addBullet(h.x,h.y,h.a+sp,pw,'normal',.5,.62);
    } else if(P.weapon==='home'){
      addBullet(h.x,h.y,h.a+rnd(.2,-.2),pw,'home',.7,.85);
      if(pw>=2) addBullet(h.x,h.y,h.a+rnd(.5,-.5),pw,'home',.7,.85);
    } else {
      addBullet(h.x,h.y,h.a,pw,'normal');
      if(pw>=3) { addBullet(h.x-7,h.y+4,h.a,pw,'normal'); }
    }
  }
  if(P.mut>0){ // 後方弾
    addBullet(P.x-10,P.y+22,Math.PI/2+.25,P.level,'normal');
    addBullet(P.x+10,P.y+22,Math.PI/2-.25,P.level,'normal');
  }
  Snd.shot();
}
function fireBomb(){
  const s=playerScale();
  const n = P.level>=2?2:1;
  const spread = n===1?0:20;
  for(let i=0;i<n;i++){
    const ox = n===1?0 : (-spread + (2*spread/(n-1))*i);
    bombs.push({x:P.x+ox*s, y:P.y-6, vy:-430, ty:P.y-250-P.level*22, r:9, t:0,
                pw:1+P.level*.4});
  }
  Snd.bomb();
}
function bombBlast(x,y,pw){
  blasts.push({x,y,r:8,max:50+pw*14,t:0,life:.34,hit:new Set(),dmg:3.0*pw});
  rings.push({x,y,r:10,max:66+pw*18,t:0,life:.36,c:'#ffb04a',w:5});
  spark(x,y,12,'#ff9b3c',260,.4);
  Snd.blast(); shakeIt(3);
}
function damagePlayer(){
  if(P.inv>0 || P.dead || Game.state!=='play') return;
  P.heads--;
  if(P.level>0) P.level--;
  if(P.heads<=0){ killPlayer(); return; }
  P.inv=2.0; Snd.damage(); shakeIt(9); flashIt(.4,'#ff5a3c');
  explode(P.x,P.y-24,10,'#ff8a5a');
  popText(P.x,P.y-56,'HEAD LOST','#ff9a7a',15);
}
function killPlayer(){
  P.dead=true; P.deadT=0; Snd.dead(); shakeIt(16); flashIt(.55,'#ff7040');
  explode(P.x,P.y,26,'#ffd06a');
  for(let i=0;i<4;i++) setTimeout(()=>{ if(Game.state==='play') explode(P.x+rnd(50,-50),P.y+rnd(40,-40),14,'#ffb04a'); }, 110*i+90);
}
function updatePlayer(dt){
  if(P.dead){
    P.deadT+=dt;
    if(P.deadT>1.7){
      Game.lives--;
      if(Game.lives<0){ Game.toGameOver(); }
      else { resetPlayer(false); P.x=W/2; P.y=660; Pad.tx=P.x; Pad.ty=P.y; }
    }
    return;
  }
  const sp=SPEEDS[clamp(P.spd,0,3)];
  let dx=0,dy=0;
  if(held.left())  dx-=1;
  if(held.right()) dx+=1;
  if(held.up())    dy-=1;
  if(held.down())  dy+=1;
  if(dx||dy){ const m=Math.hypot(dx,dy); dx/=m; dy/=m; P.x+=dx*sp*dt; P.y+=dy*sp*dt; Pad.tx=P.x; Pad.ty=P.y; }
  else if(isTouch || Pad.move){
    P.x = lerp(P.x, Pad.tx, 1-Math.pow(.0012,dt));
    P.y = lerp(P.y, Pad.ty, 1-Math.pow(.0012,dt));
  }
  const mg=P.small?18:28;
  P.x=clamp(P.x,mg,W-mg); P.y=clamp(P.y,60,H-40);
  Pad.tx=clamp(Pad.tx,mg,W-mg); Pad.ty=clamp(Pad.ty,60,H-40);
  P.tilt = lerp(P.tilt, dx*0.28 + (isTouch?clamp((Pad.tx-P.x)*.01,-.3,.3):0), 1-Math.pow(.001,dt));
  P.flap += dt*(10+P.spd*1.4);
  if(P.inv>0) P.inv-=dt;
  if(P.mut>0) P.mut-=dt;

  P.hist.unshift({x:P.x,y:P.y}); if(P.hist.length>26) P.hist.pop();

  P.fireT-=dt; P.bombT-=dt;
  if(held.fire()){
    if(P.fireT<=0){ firePlayer(); P.fireT = 0.13 - Math.min(.03,P.level*.01); }
    if(P.bombT<=0){ fireBomb();  P.bombT = 0.20; }
  }
}
function drawDragon(x,y,s,alpha,heads,tilt,flap,small){
  X.save(); X.translate(x,y); X.rotate(tilt*.35); X.scale(s,s); X.globalAlpha=alpha;
  const fw = Math.sin(flap)*0.55;
  // 翼
  for(const side of [-1,1]){
    X.save(); X.scale(side,1);
    X.fillStyle='#1d5fc0';
    X.beginPath();
    X.moveTo(8,-4);
    X.quadraticCurveTo(34, -10+fw*22, 52, 6+fw*30);
    X.quadraticCurveTo(34, 12+fw*12, 10, 12);
    X.closePath(); X.fill();
    X.fillStyle='#3f8ff0';
    X.beginPath();
    X.moveTo(9,-3);
    X.quadraticCurveTo(30,-6+fw*18, 44, 6+fw*24);
    X.quadraticCurveTo(28, 8+fw*10, 10, 9);
    X.closePath(); X.fill();
    X.strokeStyle='rgba(200,235,255,.5)'; X.lineWidth=1.4;
    X.beginPath(); X.moveTo(12,-1); X.lineTo(42,6+fw*22); X.stroke();
    X.restore();
  }
  // 尾
  X.fillStyle='#2a6fd0';
  X.beginPath(); X.moveTo(-8,10); X.quadraticCurveTo(0,44,10,10); X.closePath(); X.fill();
  // 胴
  const bg=X.createLinearGradient(0,-18,0,26);
  bg.addColorStop(0,'#63b0ff'); bg.addColorStop(.55,'#2f78dc'); bg.addColorStop(1,'#17509c');
  X.fillStyle=bg;
  X.beginPath(); X.ellipse(0,2,17,24,0,0,TAU); X.fill();
  X.fillStyle='#bfe4ff';
  X.beginPath(); X.ellipse(0,8,8,13,0,0,TAU); X.fill();
  // 首と頭
  const hp=[[0,-30,0],[-24,-20,-.24],[24,-20,.24]];
  for(let i=0;i<heads;i++){
    const [hx,hy,ha]=hp[i];
    const wob=Math.sin(flap*.8+i*2.1)*2.4;
    X.save(); X.translate(hx*(1)+wob*.5, hy);
    // 首
    X.strokeStyle='#2f78dc'; X.lineWidth=10; X.lineCap='round';
    X.beginPath(); X.moveTo(-hx*.5,26); X.quadraticCurveTo(-hx*.15,12,0,2); X.stroke();
    X.strokeStyle='#4f97ec'; X.lineWidth=5;
    X.beginPath(); X.moveTo(-hx*.5,26); X.quadraticCurveTo(-hx*.15,12,0,2); X.stroke();
    // 頭
    X.rotate(ha);
    X.fillStyle='#3f8ff0';
    X.beginPath(); X.ellipse(0,-2,11,9,0,0,TAU); X.fill();
    X.fillStyle='#8fd0ff';
    X.beginPath(); X.moveTo(-10,-6); X.lineTo(2,-12); X.lineTo(9,-4); X.closePath(); X.fill();
    // 角
    X.strokeStyle='#e8f4ff'; X.lineWidth=2.4; X.lineCap='round';
    X.beginPath(); X.moveTo(-5,-7); X.lineTo(-9,-14); X.stroke();
    X.beginPath(); X.moveTo(4,-7); X.lineTo(8,-14); X.stroke();
    // 目
    X.fillStyle='#fff3b0'; X.beginPath(); X.arc(-4,-3,2.3,0,TAU); X.arc(4,-3,2.3,0,TAU); X.fill();
    X.fillStyle='#0a1730'; X.beginPath(); X.arc(-4,-3,1.1,0,TAU); X.arc(4,-3,1.1,0,TAU); X.fill();
    X.restore();
  }
  X.globalAlpha=1; X.restore();
}
function drawPlayer(){
  if(P.dead) return;
  const s=playerScale();
  // 影
  X.save(); X.globalAlpha=.28; X.fillStyle='#000';
  X.beginPath(); X.ellipse(P.x+26*s, P.y+50*s, 24*s, 10*s, 0,0,TAU); X.fill(); X.restore();
  // 残像（無敵中）
  if(P.inv>0){
    for(let i=6;i<20;i+=6){
      const h=P.hist[i]; if(!h) break;
      drawDragon(h.x,h.y,s,.12,P.heads,P.tilt,P.flap,P.small);
    }
  }
  const blink = P.inv>0 && Math.floor(gTime*18)%2===0 ? .45 : 1;
  drawDragon(P.x,P.y,s,blink,P.heads,P.tilt,P.flap,P.small);
  if(P.mut>0){
    X.save(); X.globalAlpha=.35+.2*Math.sin(gTime*9);
    X.strokeStyle='#ffe07a'; X.lineWidth=2.5;
    X.beginPath(); X.arc(P.x,P.y,40*s,0,TAU); X.stroke(); X.restore();
  }
}

/* ---------------------------------------------------------------- items */
const ITEMS = {
  head:{ c:'#ff6a9c', t:'首', lb:'HEAD +1' },
  pow: { c:'#ffd23c', t:'P',  lb:'POWER UP' },
  wide:{ c:'#7ee8ff', t:'W',  lb:'WIDE SHOT' },
  home:{ c:'#b78bff', t:'H',  lb:'HOMING' },
  spd: { c:'#8bff9d', t:'S',  lb:'SPEED UP' },
  small:{c:'#ffffff', t:'小', lb:'SMALL DRAGON' },
  inv: { c:'#ffb347', t:'★',  lb:'INVINCIBLE' },
  bomb:{ c:'#ff8a3c', t:'B',  lb:'BOMB +1' },
  life:{ c:'#ff4d6d', t:'1UP',lb:'1UP' }
};
function dropItem(x,y,kind){
  items.push({x,y,kind,t:0,vy:0,vx:rnd(30,-30),life:14});
}
function pickItem(it){
  const k=it.kind, d=ITEMS[k];
  switch(k){
    case 'head': if(P.heads<3){P.heads++; Snd.head();} else {addScore(3000); Snd.item();} break;
    case 'pow':  if(P.level<3){P.level++;} else addScore(2000); Snd.item(); break;
    case 'wide': P.weapon='wide'; Snd.item(); break;
    case 'home': P.weapon='home'; Snd.item(); break;
    case 'spd':  if(P.spd<3){P.spd++;} else addScore(1500); Snd.item(); break;
    case 'small':P.small=true; Snd.item(); break;
    case 'inv':  P.inv=Math.max(P.inv,7.5); P.mut=7.5; Snd.head(); break;
    case 'bomb': P.stockBomb=Math.min(5,P.stockBomb+1); Snd.item(); break;
    case 'life': Game.lives++; Snd.extend(); break;
  }
  popText(it.x,it.y-20,d.lb,d.c,15);
  spark(it.x,it.y,14,d.c,220,.5);

}
function drawItem(it){
  const d=ITEMS[it.kind], bob=Math.sin(it.t*5)*4;
  X.save(); X.translate(it.x,it.y+bob);
  X.globalAlpha = it.life<3 && Math.floor(it.t*10)%2===0 ? .35 : 1;
  X.fillStyle='rgba(0,0,0,.3)'; X.beginPath(); X.ellipse(3,20-bob,14,5,0,0,TAU); X.fill();
  X.save(); X.rotate(Math.sin(it.t*2.4)*.25);
  X.fillStyle=d.c; X.strokeStyle='#fff'; X.lineWidth=2;
  X.beginPath();
  for(let i=0;i<6;i++){ const a=-Math.PI/2+i*TAU/6; const px=Math.cos(a)*15, py=Math.sin(a)*15;
    i?X.lineTo(px,py):X.moveTo(px,py); }
  X.closePath(); X.fill(); X.stroke();
  X.restore();
  X.fillStyle='#241206'; X.font='bold '+(it.kind==='life'?11:15)+'px "Courier New",monospace';
  X.textAlign='center'; X.textBaseline='middle';
  X.fillText(d.t,0,1);
  X.globalAlpha=1; X.restore();
}

let squadSeq=0;
function spawnAir(kind,x,y,opt){
  const d=AIR[kind]; if(!d) return null;
  const e={ layer:'air', kind, x, y, vx:0, vy:150, hp:d.hp+Math.floor((Game.loop-1)*.7), r:d.r,
            t:0, ph:rnd(TAU), ft:rnd(1.6,.4), bt:0, burst:0, stop:rnd(300,140), hitT:0,
            fade:1, lock:-Math.PI/2, sq:opt&&opt.sq };
  Object.assign(e,opt||{});
  enemies.push(e); return e;
}
function spawnGnd(kind,x,worldY,opt){
  const d=GND[kind]; if(!d) return null;
  const e={ layer:'gnd', kind, x, wy:worldY, vx:0, hp:d.hp+Math.floor((Game.loop-1)*.9), r:d.r,
            t:0, ph:rnd(TAU), ft:rnd(2.2,.7), bt:0, burst:0, jt:0, hitT:0, hatch:rnd(9,6), open:false };
  Object.assign(e,opt||{});
  enemies.push(e); return e;
}
function killEnemy(e, byPlayer){
  const d = (e.layer==='air'?AIR:GND)[e.kind];
  e.hp=0;
  if(!e.silent){
    explode(e.x, ey(e), e.r*0.9, d.col);
    Snd.boom(e.r>22?2:1);
  }
  if(byPlayer) addScore(Math.round(d.sc*(1+(Game.loop-1)*.3)));
  if(d.die) d.die(e);
  if(e.sq){ // 編隊全滅ボーナス
    const rest = enemies.filter(o=>o!==e && o.sq===e.sq && o.hp>0);
    if(rest.length===0 && byPlayer){
      dropItem(e.x, ey(e), pickItemKind());
      popText(e.x, ey(e)-30, 'SQUAD!', '#ffe07a', 15);
    }
  }
}
function pickItemKind(){
  const r=Math.random();
  if(P.heads<3 && r<.3) return 'head';
  const pool=['pow','pow','wide','home','spd','small','inv','bomb'];
  if(Math.random()<.05) return 'life';
  return pool[rint(0,pool.length)];
}
function damageEnemy(e,dmg,byPlayer){
  const d=(e.layer==='air'?AIR:GND)[e.kind];
  if(d.inv && d.inv(e)) return false;
  e.hp-=dmg; e.hitT=.09;
  if(e.hp<=0){ killEnemy(e,byPlayer); return true; }
  Snd.hit();
  return false;
}
function drawEnemy(e){
  const d=(e.layer==='air'?AIR:GND)[e.kind], y=ey(e);
  if(e.layer==='air'){ // 影
    X.save(); X.globalAlpha=.22; X.fillStyle='#000';
    X.beginPath(); X.ellipse(e.x+22, y+42, e.r*1.1, e.r*.45, 0,0,TAU); X.fill(); X.restore();
  }
  X.save(); X.translate(e.x,y);
  if(e.hitT>0){ X.save(); X.globalAlpha=.9; }
  d.dw(e);
  if(e.hitT>0){ X.restore();
    X.globalCompositeOperation='lighter'; X.globalAlpha=.6;
    X.fillStyle='#fff'; X.beginPath(); X.arc(0,0,e.r,0,TAU); X.fill();
    X.globalAlpha=1; X.globalCompositeOperation='source-over'; }
  X.restore();
}

function spawnBoss(kind){
  const d=BOSS[kind];
  const b={ kind, x:W/2, y:-150, t:0, state:'enter', dieT:0, hitT:0, phase:1,
            ft:1.2, ft2:2.4, ft3:3.6, bt:0, dash:0, dvx:0, layer:d.layer,
            maxhp:Math.round(d.hp*(1+(Game.loop-1)*.55)), zones:[] };
  b.hp=b.maxhp;
  d.init(b);
  boss=b; beams.length=0;
  return b;
}
function bossDamage(z,dmg){
  const b=boss; if(!b || b.state!=='fight') return;
  if(z.hp!==undefined && !z.dead){
    z.hp-=dmg;
    b.hp-=dmg*.55;
    if(z.hp<=0){ z.dead=true; explode(z.x,z.y,z.r,'#ffb04a'); Snd.boom(2); shakeIt(9); addScore(5000); }
  } else {
    b.hp -= dmg*(z.weak?1:0.22);
  }
  b.hitT=.07;
  if(b.hp<=0 && b.state==='fight'){
    b.state='die'; b.dieT=0; Snd.stopBgm(); Snd.roar();
    addScore(Math.round(BOSS[b.kind].sc*(1+(Game.loop-1)*.4)));
  }
}
function bossHitTest(x,y,r,byBomb){
  const b=boss; if(!b || b.state!=='fight') return null;
  const ok = b.layer==='both' ? true : (byBomb ? b.layer==='gnd' : b.layer==='air');
  if(!ok) return null;
  let body=null;
  for(const z of b.zones){
    if(z.dead) continue;
    if(dist2(x,y,z.x,z.y) < (z.r+r)*(z.r+r)){ if(z.weak||z.hp!==undefined) return z; body=z; }
  }
  return body;
}
function updateBoss(dt){
  const b=boss; if(!b) return;
  if(b.hitT>0) b.hitT-=dt;
  if(b.state==='die'){
    b.dieT+=dt;
    if(b.dieT<2.6){
      if(Math.random()<dt*11){ explode(b.x+rnd(90,-90), b.y+rnd(70,-70), rnd(22,12), '#ffca6a'); shakeIt(6); }
    } else if(!b.done){ b.done=true;
      explode(b.x,b.y,52,'#fff2c8'); flashIt(.85,'#fff'); shakeIt(20);
      for(let i=0;i<3;i++) setTimeout(()=>explode(b.x+rnd(80,-80),b.y+rnd(60,-60),30,'#ffd06a'), i*130);
      Game.bossDown();
    }
    return;
  }
  BOSS[b.kind].up(b,dt);
}
function drawBoss(){
  const b=boss; if(!b) return;
  if(b.state==='die' && Math.floor(b.dieT*14)%2===0) X.globalAlpha=.55;
  if(b.layer!=='air'){ // 地上ボスは影を落とす
    X.save(); X.globalAlpha=.3; X.fillStyle='#000';
    X.beginPath(); X.ellipse(b.x+16,b.y+92,90,26,0,0,TAU); X.fill(); X.restore();
  }
  X.save();
  X.shadowColor='rgba(0,0,0,.75)'; X.shadowBlur=16;
  BOSS[b.kind].dw(b);
  X.restore();
  if(b.hitT>0){ X.save(); X.globalCompositeOperation='lighter'; X.globalAlpha=.35;
    X.fillStyle='#fff'; X.beginPath(); X.arc(b.x,b.y,60,0,TAU); X.fill(); X.restore(); }
  X.globalAlpha=1;
}

/* ----------------------------------------------------------- stage waves */
function stream(n,gap,fn){ spawners.push({n,i:0,gap,t:0,fn}); }
function gY(){ return scrollY + 830; }   // 画面外（上）の世界Y

function waveLine(kind,n,dirx){
  const sq=++squadSeq, x0=rnd(W-160,90);
  stream(n,.22,i=>{
    spawnAir(kind, clamp(x0+i*46*(dirx||1),40,W-40), -40, {vy:rnd(210,150), sq});
  });
}
function waveV(kind,n){
  const sq=++squadSeq, cx=rnd(W-140,140);
  for(let i=0;i<n;i++){
    const s=(i%2?1:-1), k=Math.floor(i/2)+1;
    spawnAir(kind, clamp(cx+s*k*44,36,W-36), -40-k*38, {vy:rnd(230,170), sq});
  }
}
function waveSide(kind,n,side){
  const sq=++squadSeq, sx = side<0? -40 : W+40;
  stream(n,.19,i=>{
    spawnAir(kind, sx, 90+i*20, {vy:120, vx:-side*rnd(300,220), sq});
  });
}
function waveArc(kind,n){
  const sq=++squadSeq;
  stream(n,.16,i=>{
    const t=i/(n-1||1);
    spawnAir(kind, 60+t*(W-120), -40, {vy:200, ph:t*3.4, sq});
  });
}
function waveRain(kind,n){
  const sq=++squadSeq;
  stream(n,.28,i=>{ spawnAir(kind, rnd(W-70,70), -40, {vy:rnd(230,160), sq}); });
}
function gndRow(kinds,n){
  const y=gY();
  for(let i=0;i<n;i++){
    const k=kinds[rint(0,kinds.length)];
    const x=clamp(rnd(W-70,70),60,W-60);
    spawnGnd(k, x, y - i*70, {vx: (Math.random()<.5?-1:1)*rnd(90,50)});
  }
}
function eggNest(n){
  const y=gY(), cx=rnd(W-150,150);
  for(let i=0;i<n;i++){
    const a=i*TAU/n + rnd(1);
    const item = i===0 ? (P.heads<3?'head':pickItemKind()) : pickItemKind();
    spawnGnd('egg', clamp(cx+Math.cos(a)*rnd(80,30),40,W-40), y+Math.sin(a)*70, {item, hatch:rnd(11,7)});
  }
}
function buildEvents(areaIdx){
  const a=AREAS[areaIdx], R=mkRng(0x51ed + areaIdx*104729 + Game.loop*7919), ev=[];
  const AK=a.air, GK=a.gnd;
  let d=520;
  let n=0;
  while(d < a.len-420){
    const r=R(), k=AK[Math.floor(R()*AK.length)];
    if(r<.17)       ev.push({d, f:()=>waveLine(k, 5+rint(0,3), R()<.5?1:-1)});
    else if(r<.32)  ev.push({d, f:()=>waveV(k, 5+2*rint(0,2))});
    else if(r<.45)  ev.push({d, f:()=>waveSide(k, 5+rint(0,3), R()<.5?-1:1)});
    else if(r<.57)  ev.push({d, f:()=>waveArc(k, 6+rint(0,3))});
    else if(r<.68)  ev.push({d, f:()=>waveRain(k, 4+rint(0,3))});
    else if(r<.86)  ev.push({d, f:()=>gndRow(GK, 1+rint(0,3))});
    else            ev.push({d, f:()=>{ waveLine(k,4); gndRow(GK,2); }});
    d += 250 + R()*230 - Math.min(90, areaIdx*10);
    n++;
    if(n%5===3) { ev.push({d:d-90, f:()=>eggNest(2+rint(0,3))}); }
  }
  ev.push({d:420, f:()=>eggNest(3)});
  ev.push({d:Math.floor(a.len*.55), f:()=>eggNest(4)});
  ev.sort((p,q)=>p.d-q.d);
  return ev;
}

/* ----------------------------------------------------------- collisions */
function collisions(){
  // 空中弾 vs 空中敵／空中ボス
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i]; let gone=false;
    for(const e of enemies){
      if(e.layer!=='air'||e.hp<=0) continue;
      const d=(AIR[e.kind].inv&&AIR[e.kind].inv(e));
      if(d) continue;
      if(dist2(b.x,b.y,e.x,e.y) < (e.r+b.r)*(e.r+b.r)){ damageEnemy(e,b.dmg,true); gone=true; break; }
    }
    if(!gone && boss){
      const z=bossHitTest(b.x,b.y,b.r,false);
      if(z){ bossDamage(z,b.dmg); gone=true; Snd.ping(); }
    }
    if(gone){ spark(b.x,b.y,4,'#fff2a0',160,.22); bullets.splice(i,1); }
  }
  // ボム vs 地上敵／地上ボス（接触で炸裂）
  for(let i=bombs.length-1;i>=0;i--){
    const b=bombs[i]; let hit=false;
    for(const e of enemies){
      if(e.layer!=='gnd'||e.hp<=0) continue;
      if(dist2(b.x,b.y,e.x,ey(e)) < (e.r+b.r)*(e.r+b.r)){ hit=true; break; }
    }
    if(!hit && boss){ const z=bossHitTest(b.x,b.y,b.r,true); if(z) hit=true; }
    if(hit || b.y<=b.ty){ bombBlast(b.x,b.y,b.pw); bombs.splice(i,1); }
  }
  // 爆風 vs 地上敵／地上ボス
  for(const bl of blasts){
    for(const e of enemies){
      if(e.layer!=='gnd'||e.hp<=0||bl.hit.has(e)) continue;
      if(dist2(bl.x,bl.y,e.x,ey(e)) < (bl.r+e.r)*(bl.r+e.r)){ bl.hit.add(e); damageEnemy(e,bl.dmg,true); }
    }
    if(boss && !bl.hitBoss){
      const z=bossHitTest(bl.x,bl.y,bl.r,true);
      if(z){ bl.hitBoss=true; bossDamage(z,bl.dmg*1.7); }
    }
  }
  if(P.dead || P.inv>0 || Game.state!=='play') return;
  const pr=playerR();
  // 敵弾 vs 自機
  for(let i=ebullets.length-1;i>=0;i--){
    const e=ebullets[i];
    if(dist2(e.x,e.y,P.x,P.y) < (e.r*.8+pr)*(e.r*.8+pr)){ ebullets.splice(i,1); damagePlayer(); return; }
  }
  // 空中敵 vs 自機
  for(const e of enemies){
    if(e.layer!=='air'||e.hp<=0) continue;
    if(dist2(e.x,e.y,P.x,P.y) < (e.r*.75+pr)*(e.r*.75+pr)){ damagePlayer(); killEnemy(e,false); return; }
  }
  // ボス本体 vs 自機
  if(boss && boss.state==='fight'){
    for(const z of boss.zones){
      if(z.dead) continue;
      if(dist2(z.x,z.y,P.x,P.y) < (z.r*.8+pr)*(z.r*.8+pr)){ damagePlayer(); return; }
    }
  }
  // ビーム vs 自機
  for(const bm of beams){
    if(bm.t<bm.warn || bm.t>bm.warn+bm.dur) continue;
    if(Math.abs(P.x-bm.x) < bm.w/2+pr*.7 && P.y>bm.y-20){ damagePlayer(); return; }
  }
}

/* --------------------------------------------------------------- update */
function updateEntities(dt){
  // 自弾
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i]; b.t+=dt;
    if(b.type==='home'){
      if(!b.tgt || b.tgt.hp<=0 || b.tgt.gone){
        let best=null,bd=1e9;
        for(const e of enemies){ if(e.layer!=='air'||e.hp<=0) continue;
          const d=dist2(b.x,b.y,e.x,e.y); if(d<bd && e.y<b.y+80){ bd=d; best=e; } }
        if(!best && boss && boss.state==='fight' && boss.layer!=='gnd') best={x:boss.x,y:boss.y,hp:1};
        b.tgt=best;
      }
      if(b.tgt){
        const ta=ang(b.x,b.y,b.tgt.x,b.tgt.y);
        let da=ta-b.a; while(da>Math.PI)da-=TAU; while(da<-Math.PI)da+=TAU;
        b.a += clamp(da,-5.5*dt,5.5*dt);
        b.vx=Math.cos(b.a)*330; b.vy=Math.sin(b.a)*330;
      }
      if(Math.random()<dt*40) parts.push({x:b.x,y:b.y,vx:0,vy:40,r:3,c:'rgba(190,150,255,.7)',t:0,life:.3,g:0});
    }
    b.x+=b.vx*dt; b.y+=b.vy*dt;
    if(b.y<-40||b.y>H+40||b.x<-40||b.x>W+40) bullets.splice(i,1);
  }
  // ボム
  for(let i=bombs.length-1;i>=0;i--){
    const b=bombs[i]; b.t+=dt; b.y+=b.vy*dt;
    if(b.y<-30){ bombs.splice(i,1); }
  }
  // 爆風
  for(let i=blasts.length-1;i>=0;i--){
    const b=blasts[i]; b.t+=dt;
    const k=clamp(b.t/b.life,0,1);
    b.r = b.max*(1-Math.pow(1-k,2.4));
    if(b.t>=b.life) blasts.splice(i,1);
  }
  // 敵
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    if(e.hp<=0){ enemies.splice(i,1); continue; }
    e.t+=dt; if(e.hitT>0) e.hitT-=dt;
    (e.layer==='air'?AIR:GND)[e.kind].up(e,dt);
    if(e.layer==='air'){
      if(e.y>H+110 || e.x<-160 || e.x>W+160 || e.t>26){ e.gone=true; enemies.splice(i,1); }
    } else {
      if(sy(e.wy)>H+140){ e.gone=true; enemies.splice(i,1); }
    }
  }
  // 敵弾
  for(let i=ebullets.length-1;i>=0;i--){
    const b=ebullets[i]; b.t+=dt;
    if(b.grav) b.vy+=b.grav*dt;
    if(b.type==='homing' && b.t<1.6){
      const a=ang(b.x,b.y,P.x,P.y), sp=Math.hypot(b.vx,b.vy);
      let ca=Math.atan2(b.vy,b.vx), da=a-ca;
      while(da>Math.PI)da-=TAU; while(da<-Math.PI)da+=TAU;
      ca+=clamp(da,-2.2*dt,2.2*dt);
      b.vx=Math.cos(ca)*sp; b.vy=Math.sin(ca)*sp;
    }
    b.x+=b.vx*dt; b.y+=b.vy*dt;
    if(b.y<-60||b.y>H+60||b.x<-60||b.x>W+60||b.t>12) ebullets.splice(i,1);
  }
  // アイテム
  for(let i=items.length-1;i>=0;i--){
    const it=items[i]; it.t+=dt; it.life-=dt;
    it.x+=it.vx*dt; it.vx*=Math.pow(.25,dt);
    it.y+=scrollSpd*dt*0.55;
    it.x=clamp(it.x,20,W-20);
    if(!P.dead && dist2(it.x,it.y,P.x,P.y)<40*40){ pickItem(it); items.splice(i,1); continue; }
    if(it.life<=0||it.y>H+40) items.splice(i,1);
  }
  // ビーム
  for(let i=beams.length-1;i>=0;i--){
    const b=beams[i]; b.t+=dt;
    if(b.t>b.warn+b.dur) beams.splice(i,1);
  }
  // 粒子・リング・テキスト
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i]; p.t+=dt;
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=(p.g||0)*dt;
    p.vx*=Math.pow(.35,dt); 
    if(p.t>=p.life) parts.splice(i,1);
  }
  for(let i=rings.length-1;i>=0;i--){
    const r=rings[i]; r.t+=dt;
    r.r=lerp(r.r,r.max,1-Math.pow(.002,dt));
    if(r.t>=r.life) rings.splice(i,1);
  }
  for(let i=texts.length-1;i>=0;i--){
    const t=texts[i]; t.t+=dt; t.y-=26*dt;
    if(t.t>=t.life) texts.splice(i,1);
  }
  // スポナー
  for(let i=spawners.length-1;i>=0;i--){
    const s=spawners[i]; s.t+=dt;
    while(s.t>=s.gap && s.i<s.n){ s.t-=s.gap; s.fn(s.i++); }
    if(s.i>=s.n) spawners.splice(i,1);
  }
}
function update(dt){
  gTime+=dt;
  if(shake>0) shake=Math.max(0,shake-dt*36);
  if(flash>0) flash=Math.max(0,flash-dt*2.6);
  if(Game.msgT>0) Game.msgT-=dt;

  if(Game.state==='title'){ Game.t+=dt; return; }
  if(Game.state==='over'){ Game.overT+=dt; updateEntities(dt); return; }
  if(Game.state==='ending'){ Game.endT+=dt; updateEntities(dt); return; }
  if(Game.paused) return;

  if(Game.state==='clear'){
    Game.clearT-=dt;
    scrollY += scrollSpd*dt;
    scrollSpd = lerp(scrollSpd, baseSpd*.6, 1-Math.pow(.2,dt));
    updatePlayer(dt); updateEntities(dt);
    if(Game.clearT<=0) Game.nextArea();
    return;
  }
  if(Game.state!=='play') return;

  const a=A();
  if(!boss){
    scrollY += scrollSpd*dt;
    while(evIdx<events.length && events[evIdx].d<=scrollY){ events[evIdx].f(); evIdx++; }
    if(!Game.warned && scrollY >= a.len-760){
      Game.warned=true;
      Game.msg='WARNING'; Game.msg2='BOSS APPROACHING'; Game.msgT=2.4;
      Snd.warn(); setTimeout(()=>Snd.warn(),240); setTimeout(()=>Snd.warn(),480);
    }
    if(scrollY >= a.len){
      Game.bossT+=dt;
      scrollSpd = lerp(scrollSpd, 0, 1-Math.pow(.06,dt));
      if(Game.bossT>1.5){ Game.spawnBossNow(); }
    }
  } else {
    scrollSpd = lerp(scrollSpd, boss.state==='die'?26:12, 1-Math.pow(.3,dt));
    scrollY += scrollSpd*dt;
    updateBoss(dt);
  }
  updatePlayer(dt);
  updateEntities(dt);
  collisions();
}

/* --------------------------------------------------------------- render */
function drawGround(){
  const a=A();
  const g=X.createLinearGradient(0,0,0,H);
  g.addColorStop(0,a.ground2); g.addColorStop(.55,a.ground); g.addColorStop(1,a.ground2);
  X.fillStyle=g; X.fillRect(0,0,W,H);
  // 地面のスクロール縞
  X.save(); X.globalAlpha=.10; X.fillStyle='#000';
  const per=110, off=(scrollY%per);
  for(let y=-per+off; y<H+per; y+=per) X.fillRect(0,y,W,per*.42);
  X.restore();
  // 帯（川／溶岩／道）
  const pts=[];
  for(let s=-40;s<=H+40;s+=20){ const w0=wy(s); pts.push({s, x:bandX(w0), h:bandHalf(w0), w:w0}); }
  X.beginPath();
  X.moveTo(pts[0].x-pts[0].h, pts[0].s);
  for(const p of pts) X.lineTo(p.x-p.h,p.s);
  for(let i=pts.length-1;i>=0;i--) X.lineTo(pts[i].x+pts[i].h,pts[i].s);
  X.closePath();
  const bg=X.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,a.bandCol); bg.addColorStop(.5,a.bandCol2); bg.addColorStop(1,a.bandCol);
  X.fillStyle=bg; X.fill();
  X.save(); X.clip();
  if(a.band==='lava'){
    X.globalAlpha=.55;
    for(let i=0;i<10;i++){
      const yy=((i*120 - scrollY*1.15)%(H+220))-110;
      X.fillStyle='#ffd06a';
      X.beginPath(); X.ellipse(bandX(wy(yy))+Math.sin(i*2.3)*40, yy, 34, 11,0,0,TAU); X.fill();
    }
    X.globalAlpha=.3; X.fillStyle='#fff2b0';
    for(let i=0;i<14;i++){ const yy=((i*84 - scrollY*1.6)%(H+180))-90;
      X.fillRect(bandX(wy(yy))-26+Math.sin(i)*30, yy, 52, 4); }
  } else if(a.band==='water'||a.band==='ice'||a.band==='poison'){
    X.globalAlpha= a.band==='ice'?.4:.28; X.fillStyle='#ffffff';
    for(let i=0;i<16;i++){
      const yy=((i*72 - scrollY*1.25)%(H+160))-80;
      const bx=bandX(wy(yy));
      X.fillRect(bx-40+Math.sin(i*1.7+gTime)*26, yy, 46, 3);
      X.fillRect(bx+6+Math.cos(i*2.1+gTime)*20, yy+22, 30, 3);
    }
  } else if(a.band==='cloud'){
    X.globalAlpha=.3; X.fillStyle='#ffffff';
    for(let i=0;i<12;i++){ const yy=((i*96 - scrollY*1.1)%(H+200))-100;
      const bx=bandX(wy(yy));
      X.beginPath(); X.ellipse(bx+Math.sin(i*1.3)*30, yy, 46, 15,0,0,TAU); X.fill(); }
  } else { // road
    X.globalAlpha=.34; X.fillStyle='#ffeec0';
    for(let i=0;i<12;i++){ const yy=((i*104 - scrollY*1.2)%(H+200))-100;
      X.fillRect(bandX(wy(yy))-5, yy, 10, 40); }
  }
  X.restore(); X.globalAlpha=1;
  // 縁取り
  X.strokeStyle='rgba(0,0,0,.28)'; X.lineWidth=4;
  X.beginPath(); X.moveTo(pts[0].x-pts[0].h,pts[0].s);
  for(const p of pts) X.lineTo(p.x-p.h,p.s); X.stroke();
  X.beginPath(); X.moveTo(pts[0].x+pts[0].h,pts[0].s);
  for(const p of pts) X.lineTo(p.x+p.h,p.s); X.stroke();
  // プロップ
  for(const p of props){
    const y=sy(p.y);
    if(y<-70||y>H+70) continue;
    drawProp(p,a);
  }
}
function drawBeam(b){
  const k=b.t/b.warn;
  if(b.t<b.warn){
    X.save(); X.globalAlpha=.28+.3*Math.abs(Math.sin(b.t*22));
    X.fillStyle=b.col; X.fillRect(b.x-b.w/2, b.y, b.w, H-b.y);
    X.globalAlpha=.9; X.strokeStyle=b.col; X.lineWidth=2;
    X.strokeRect(b.x-b.w/2, b.y, b.w, H-b.y);
    X.restore();
  } else {
    const t=(b.t-b.warn)/b.dur, w=b.w*(t<.15? t/.15 : (t>.85? (1-t)/.15 : 1));
    X.save(); X.globalCompositeOperation='lighter';
    const g=X.createLinearGradient(b.x-w/2,0,b.x+w/2,0);
    g.addColorStop(0,'rgba(255,255,255,0)'); g.addColorStop(.5,b.col); g.addColorStop(1,'rgba(255,255,255,0)');
    X.fillStyle=g; X.fillRect(b.x-w/2, b.y, w, H-b.y);
    X.fillStyle='rgba(255,255,255,.85)'; X.fillRect(b.x-w*.18, b.y, w*.36, H-b.y);
    X.restore();
  }
}
function drawBomb(b){
  // 着弾予測リング
  const k=clamp((b.y-b.ty)/240,0,1);
  X.save();
  X.globalAlpha=.45;
  X.strokeStyle='#ff9a3c'; X.lineWidth=2;
  X.beginPath(); X.ellipse(b.x,b.ty, 10+22*k, 4+9*k, 0,0,TAU); X.stroke();
  X.restore();
  X.save(); X.translate(b.x,b.y);
  X.fillStyle='rgba(255,140,40,.35)'; X.beginPath(); X.arc(0,0,14,0,TAU); X.fill();
  const g=X.createRadialGradient(-3,-3,1,0,0,10);
  g.addColorStop(0,'#ffe0a0'); g.addColorStop(.6,'#ff7a1e'); g.addColorStop(1,'#8a2a06');
  X.fillStyle=g; X.beginPath(); X.arc(0,0,9,0,TAU); X.fill();
  X.restore();
}
function drawBlast(b){
  const k=b.t/b.life;
  X.save();
  X.globalCompositeOperation='lighter';
  X.globalAlpha=(1-k)*.9;
  const g=X.createRadialGradient(b.x,b.y,b.r*.2,b.x,b.y,b.r);
  g.addColorStop(0,'#fff6c8'); g.addColorStop(.45,'#ff9a2a'); g.addColorStop(1,'rgba(200,40,0,0)');
  X.fillStyle=g; X.beginPath(); X.ellipse(b.x,b.y,b.r,b.r*.72,0,0,TAU); X.fill();
  X.restore();
}
function drawEBullet(b){
  X.save(); X.translate(b.x,b.y);
  if(b.type==='ice'){
    X.rotate(b.t*7); X.fillStyle='#eaffff';
    X.beginPath(); for(let i=0;i<6;i++){ const a=i*TAU/6, r=i%2?b.r*.5:b.r*1.15;
      i?X.lineTo(Math.cos(a)*r,Math.sin(a)*r):X.moveTo(Math.cos(a)*r,Math.sin(a)*r); }
    X.closePath(); X.fill();
    X.fillStyle='#7fd8f0'; X.beginPath(); X.arc(0,0,b.r*.5,0,TAU); X.fill();
  } else if(b.type==='fire'){
    X.fillStyle='rgba(255,160,40,.35)'; X.beginPath(); X.arc(0,0,b.r*1.7,0,TAU); X.fill();
    const g=X.createRadialGradient(0,0,1,0,0,b.r);
    g.addColorStop(0,'#fff2c0'); g.addColorStop(.5,b.c); g.addColorStop(1,'rgba(255,60,0,.1)');
    X.fillStyle=g; X.beginPath(); X.arc(0,0,b.r,0,TAU); X.fill();
  } else if(b.type==='rock'){
    X.rotate(b.t*3); X.fillStyle='#6a4a34';
    X.beginPath(); X.moveTo(-b.r,2); X.lineTo(-b.r*.4,-b.r); X.lineTo(b.r*.7,-b.r*.6); X.lineTo(b.r,b.r*.5); X.lineTo(0,b.r); X.closePath(); X.fill();
    X.fillStyle='#8f6a4a'; X.beginPath(); X.arc(-2,-2,b.r*.4,0,TAU); X.fill();
  } else {
    X.fillStyle='rgba(255,255,255,.22)'; X.beginPath(); X.arc(0,0,b.r*1.6,0,TAU); X.fill();
    X.fillStyle=b.c; X.beginPath(); X.arc(0,0,b.r,0,TAU); X.fill();
    X.fillStyle='rgba(255,255,255,.85)'; X.beginPath(); X.arc(-b.r*.3,-b.r*.3,b.r*.42,0,TAU); X.fill();
  }
  X.restore();
}
function drawPBullet(b){
  X.save(); X.translate(b.x,b.y); X.rotate(b.a+Math.PI/2);
  const L=b.r*2.2;
  if(b.type==='home'){
    X.fillStyle='rgba(180,140,255,.35)'; X.beginPath(); X.arc(0,0,b.r*1.9,0,TAU); X.fill();
    X.fillStyle='#d8b8ff'; X.beginPath(); X.ellipse(0,0,b.r*.75,b.r*1.5,0,0,TAU); X.fill();
    X.fillStyle='#fff'; X.beginPath(); X.arc(0,-b.r*.6,b.r*.42,0,TAU); X.fill();
  } else {
    X.fillStyle='rgba(255,240,150,.20)'; X.beginPath(); X.ellipse(0,0,b.r*1.35,L*.85,0,0,TAU); X.fill();
    const g=X.createLinearGradient(0,-L,0,L);
    g.addColorStop(0,'#ffffff'); g.addColorStop(.5,'#ffe45a'); g.addColorStop(1,'rgba(255,160,40,.2)');
    X.fillStyle=g; X.beginPath(); X.ellipse(0,0,b.r*.8,L,0,0,TAU); X.fill();
  }
  X.restore();
}

function render(){
  if(Game.state==='title'){ drawTitle(); return; }
  X.save();
  if(shake>0) X.translate(rnd(shake,-shake), rnd(shake,-shake));
  drawGround();
  for(const e of enemies) if(e.layer==='gnd') drawEnemy(e);
  for(const b of blasts) drawBlast(b);
  if(boss && boss.layer==='gnd') drawBoss();
  for(const b of beams) drawBeam(b);
  for(const it of items) drawItem(it);
  for(const b of bombs) drawBomb(b);
  for(const e of enemies) if(e.layer==='air') drawEnemy(e);
  if(boss && boss.layer!=='gnd') drawBoss();
  for(const b of bullets) drawPBullet(b);
  drawPlayer();
  for(const b of ebullets) drawEBullet(b);
  // 粒子
  for(const p of parts){
    const k=1-p.t/p.life;
    X.globalAlpha=p.smoke?k*.5:k;
    X.fillStyle=p.c;
    X.beginPath(); X.arc(p.x,p.y,p.r*(p.smoke?(1+ (1-k)*1.4):k),0,TAU); X.fill();
  }
  X.globalAlpha=1;
  for(const r of rings){
    const k=1-r.t/r.life;
    X.globalAlpha=k*.85; X.strokeStyle=r.c; X.lineWidth=r.w*k+1;
    X.beginPath(); X.arc(r.x,r.y,r.r,0,TAU); X.stroke();
  }
  X.globalAlpha=1;
  X.textAlign='center'; X.textBaseline='middle';
  for(const t of texts){
    const k=1-t.t/t.life;
    X.globalAlpha=Math.min(1,k*2);
    X.font='bold '+t.sz+'px "Courier New",monospace';
    X.lineWidth=4; X.strokeStyle='rgba(0,0,0,.7)'; X.strokeText(t.s,t.x,t.y);
    X.fillStyle=t.c; X.fillText(t.s,t.x,t.y);
  }
  X.globalAlpha=1;
  X.restore();
  // 空気感
  const a=A();
  const fg=X.createLinearGradient(0,0,0,H*.5);
  fg.addColorStop(0,a.fog); fg.addColorStop(1,'rgba(0,0,0,0)');
  X.fillStyle=fg; X.fillRect(0,0,W,H*.5);
  if(flash>0){ X.globalAlpha=Math.min(.85,flash); X.fillStyle=flashCol; X.fillRect(0,0,W,H); X.globalAlpha=1; }
  drawHUD();
}

/* ------------------------------------------------------------------ hud */
function txt(s,x,y,sz,col,al,ol){
  X.font='bold '+sz+'px "Courier New",monospace';
  X.textAlign=al||'left'; X.textBaseline='middle';
  if(ol!==false){ X.lineWidth=Math.max(3,sz*.22); X.strokeStyle='rgba(0,0,0,.72)'; X.strokeText(s,x,y); }
  X.fillStyle=col||'#ffe9c0'; X.fillText(s,x,y);
}
function miniDragon(x,y,s,alpha){

  X.fillStyle='#3f8ff0';
  X.beginPath(); X.moveTo(0,-2); X.lineTo(-13,-8); X.lineTo(-6,4); X.closePath(); X.fill();

}

    txt('M … ミュート ／ ↑↓←→ でメニュー選択', 58, ly+62, 13, '#e8dcc0');
  }
  txt('◆ ショットは空中の敵、ボム（自動発射）は地上の敵に当たる', 58, ly+90, 12, '#ffe07a');
  txt('◆ 卵をボムで割るとパワーアップ。首＝残り体力＆ショット数', 58, ly+110, 12, '#ffe07a');
  txt('HI-SCORE  '+String(Game.hi).padStart(8,'0'), W/2, 762, 16, '#ffd89a','center');
  if(Math.floor(gTime*1.8)%2===0)
    txt(isTouch?'TAP TO START':'PUSH SPACE / Z', W/2, 736, 17, '#fff','center');
}

/* ------------------------------------------------------------- main loop */
function init(){
  props=genProps(0,AREAS[0].len);
  scrollY=0; scrollSpd=baseSpd;
  Game.state='title'; Game.t=0;
  Pad.tx=P.x; Pad.ty=P.y;
  requestAnimationFrame(frame);
}
let last=performance.now();
function frame(now){
  let dt=(now-last)/1000; last=now;
  if(dt>1/25) dt=1/25;
  if(Game.state==='title') scrollY += 62*dt;
  update(dt);
  render();
  requestAnimationFrame(frame);
}
addEventListener('pointerdown', ()=>{
  Snd.init(); Snd.resume();
  if(!Snd.song && !Snd.muted && Game.state==='title') Snd.playBgm('title');
});
init();
</script>

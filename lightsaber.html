<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>HTML5 ライトセーバー シミュレーター (Web Audio & センサー機能)</title>
  <style>
    :root {
      --bg-dark: #05070f;
      --panel-bg: rgba(15, 23, 42, 0.75);
      --saber-blue: #00f2fe;
      --saber-green: #00ff66;
      --saber-red: #ff0055;
      --saber-purple: #b026ff;
      --saber-yellow: #ffe600;
      --saber-white: #ffffff;
      
      --current-saber-color: var(--saber-blue);
      --current-glow: 0 0 20px #00f2fe, 0 0 40px #00f2fe, 0 0 80px #00c6ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 30%, rgba(0, 242, 254, 0.05) 0%, transparent 70%),
        radial-gradient(circle at 50% 80%, rgba(176, 38, 255, 0.05) 0%, transparent 70%);
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      overflow: hidden;
    }

    /* Header Controls */
    header {
      width: 100%;
      max-width: 500px;
      text-align: center;
      z-index: 10;
    }

    h1 {
      font-size: 1.4rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #fff, #888);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 0.75rem;
      color: #94a3b8;
    }

    /* Saber View Container */
    .saber-stage {
      flex: 1;
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      position: relative;
      padding-bottom: 20px;
      cursor: pointer;
    }

    /* Blade Glow & Body */
    .blade-wrapper {
      width: 24px;
      height: 0px; /* Expands to ~340px when active */
      position: relative;
      transition: height 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: flex;
      justify-content: center;
    }

    .blade-wrapper.active {
      height: 340px;
    }

    .blade-core {
      width: 14px;
      height: 100%;
      background: #ffffff;
      border-radius: 10px 10px 0 0;
      box-shadow: var(--current-glow);
      transition: background-color 0.3s, box-shadow 0.3s;
      position: absolute;
      bottom: 0;
    }

    .blade-tip {
      position: absolute;
      top: -10px;
      width: 14px;
      height: 14px;
      background: #ffffff;
      border-radius: 50%;
      box-shadow: var(--current-glow);
    }

    /* Metallic Hilt (柄) */
    .hilt {
      width: 42px;
      height: 130px;
      background: linear-gradient(90deg, #475569 0%, #cbd5e1 30%, #94a3b8 50%, #475569 85%, #1e293b 100%);
      border-radius: 6px 6px 12px 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.7), inset 0 2px 5px rgba(255, 255, 255, 0.5);
      position: relative;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .hilt-emitter {
      width: 50px;
      height: 16px;
      background: linear-gradient(90deg, #1e293b, #64748b, #1e293b);
      border-radius: 4px;
      border-bottom: 2px solid #0f172a;
    }

    .hilt-ring {
      width: 44px;
      height: 6px;
      background: #0f172a;
    }

    .hilt-button {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ff4d4d, #990000);
      border: 2px solid #64748b;
      box-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.2s;
    }

    .hilt-button.active {
      background: radial-gradient(circle at 30% 30%, #4dff88, #009933);
      box-shadow: 0 0 12px #00ff66;
    }

    .hilt-grip {
      width: 36px;
      height: 45px;
      background: repeating-linear-gradient(
        0deg,
        #0f172a,
        #0f172a 4px,
        #334155 4px,
        #334155 8px
      );
      border-radius: 4px;
    }

    .hilt-pommel {
      width: 46px;
      height: 14px;
      background: linear-gradient(90deg, #334155, #94a3b8, #334155);
      border-radius: 0 0 8px 8px;
    }

    /* Control Panel Cards */
    .controls-card {
      width: 100%;
      max-width: 460px;
      background: var(--panel-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 14px 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 10;
    }

    /* Color Selector Buttons */
    .color-picker {
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    .color-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.2);
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
    }

    .color-btn.active {
      transform: scale(1.2);
      border-color: #ffffff;
      box-shadow: 0 0 12px currentColor;
    }

    /* Action Buttons */
    .action-row {
      display: flex;
      gap: 10px;
    }

    .btn {
      flex: 1;
      padding: 10px 14px;
      border: none;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-power {
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      box-shadow: 0 4px 14px rgba(0, 114, 255, 0.4);
    }
    .btn-power.active {
      background: linear-gradient(135deg, #ff0055, #ff5500);
      box-shadow: 0 4px 14px rgba(255, 0, 85, 0.4);
    }

    .btn-sensor {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    /* Sound Status & Diagnostics */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      color: #94a3b8;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 8px;
    }

    .sensor-val {
      font-family: monospace;
      color: var(--saber-blue);
      font-weight: bold;
    }

    /* Flash Overlay for Impact/Clash */
    .flash-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: #ffffff;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.05s ease-out;
      z-index: 100;
    }
  </style>
</head>
<body>

  <div id="flashOverlay" class="flash-overlay"></div>

  <header>
    <h1>LIGHTSABER</h1>
    <div class="subtitle">HTML5 Web Audio & スマホスイングセンサー対応</div>
  </header>

  <!-- Saber Visualizer Area -->
  <div id="saberStage" class="saber-stage">
    <div id="bladeWrapper" class="blade-wrapper">
      <div id="bladeCore" class="blade-core">
        <div id="bladeTip" class="blade-tip"></div>
      </div>
    </div>
    <div class="hilt">
      <div class="hilt-emitter"></div>
      <div class="hilt-ring"></div>
      <div id="hiltButton" class="hilt-button"></div>
      <div class="hilt-grip"></div>
      <div class="hilt-pommel"></div>
    </div>
  </div>

  <!-- Controls Card -->
  <div class="controls-card">
    <div style="font-size:0.8rem; color:#94a3b8; text-align:center;">クリスタルカラー選択</div>
    <div class="color-picker">
      <button class="color-btn active" style="background:#00f2fe; color:#00f2fe;" data-color="blue" data-hex="#00f2fe"></button>
      <button class="color-btn" style="background:#00ff66; color:#00ff66;" data-color="green" data-hex="#00ff66"></button>
      <button class="color-btn" style="background:#ff0055; color:#ff0055;" data-color="red" data-hex="#ff0055"></button>
      <button class="color-btn" style="background:#b026ff; color:#b026ff;" data-color="purple" data-hex="#b026ff"></button>
      <button class="color-btn" style="background:#ffe600; color:#ffe600;" data-color="yellow" data-hex="#ffe600"></button>
      <button class="color-btn" style="background:#ffffff; color:#ffffff;" data-color="white" data-hex="#ffffff"></button>
    </div>

    <div class="action-row">
      <button id="btnTogglePower" class="btn btn-power">
        <span>⚡ 起動 / OFF</span>
      </button>
      <button id="btnSensorPermission" class="btn btn-sensor">
        <span>📱 センサー起動</span>
      </button>
    </div>

    <div class="status-bar">
      <span>スイング加速度: <span id="valMotion" class="sensor-val">0.0 m/s²</span></span>
      <span id="sensorStatus">PC/タッチテスト可</span>
    </div>
  </div>

  <script>
    // State Variables
    let isActive = false;
    let audioCtx = null;

    // Web Audio Synthesizer Nodes
    let humOsc = null;
    let humSubOsc = null;
    let humGain = null;
    let humFilter = null;
    let lfoOsc = null;

    let swingOsc = null;
    let swingGain = null;
    let swingFilter = null;

    let currentHex = '#00f2fe';
    let lastSwingTime = 0;

    // DOM Elements
    const bladeWrapper = document.getElementById('bladeWrapper');
    const bladeCore = document.getElementById('bladeCore');
    const bladeTip = document.getElementById('bladeTip');
    const hiltButton = document.getElementById('hiltButton');
    const btnTogglePower = document.getElementById('btnTogglePower');
    const btnSensorPermission = document.getElementById('btnSensorPermission');
    const saberStage = document.getElementById('saberStage');
    const valMotion = document.getElementById('valMotion');
    const sensorStatus = document.getElementById('sensorStatus');
    const flashOverlay = document.getElementById('flashOverlay');
    const colorBtns = document.querySelectorAll('.color-btn');

    // -------------------------------------------------------------
    // Web Audio Lightsaber Sound Synthesizer (Pure JS DSP)
    // -------------------------------------------------------------
    function initAudio() {
      if (audioCtx) return;
      const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioCtxClass();
    }

    // 1. Idle Power Hum (常時ブーンという重低音)
    function startIdleHum() {
      if (!audioCtx) return;

      const now = audioCtx.currentTime;

      // Base Low Frequency Oscillator
      humOsc = audioCtx.createOscillator();
      humSubOsc = audioCtx.createOscillator();
      lfoOsc = audioCtx.createOscillator();

      humGain = audioCtx.createGain();
      humFilter = audioCtx.createBiquadFilter();

      const lfoGain = audioCtx.createGain();

      // Frequencies for iconic plasma hum
      humOsc.type = 'sawtooth';
      humOsc.frequency.setValueAtTime(58, now); // ~58Hz base hum

      humSubOsc.type = 'sine';
      humSubOsc.frequency.setValueAtTime(116, now); // 1st Harmonic

      // LFO for throbbing hum pulse (~4.5Hz)
      lfoOsc.type = 'sine';
      lfoOsc.frequency.setValueAtTime(4.5, now);
      lfoGain.gain.setValueAtTime(8, now);

      lfoOsc.connect(humOsc.frequency);

      // Lowpass Filter for warm deep bass
      humFilter.type = 'lowpass';
      humFilter.frequency.setValueAtTime(320, now);
      humFilter.Q.setValueAtTime(4, now);

      // Connections
      const masterHumGain = audioCtx.createGain();
      masterHumGain.gain.setValueAtTime(0.35, now);

      humOsc.connect(humFilter);
      humSubOsc.connect(humFilter);
      humFilter.connect(masterHumGain);
      masterHumGain.connect(audioCtx.destination);

      humOsc.start(now);
      humSubOsc.start(now);
      lfoOsc.start(now);
    }

    function stopIdleHum() {
      if (humOsc) {
        try {
          humOsc.stop();
          humSubOsc.stop();
          lfoOsc.stop();
        } catch (e) {}
        humOsc = null;
      }
    }

    // 2. Ignition Sound (起動時の「シューン！」)
    function playIgnitionSound() {
      initAudio();
      if (audioCtx.state === 'suspended') audioCtx.resume();

      const now = audioCtx.currentTime;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const filter = audioCtx.createBiquadFilter();

      osc.type = 'sawtooth';
      // Pitch sweeps rapidly from 60Hz up to 480Hz
      osc.frequency.setValueAtTime(60, now);
      osc.frequency.exponentialRampToValueAtTime(480, now + 0.35);

      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(300, now);
      filter.frequency.exponentialRampToValueAtTime(2200, now + 0.3);

      gain.gain.setValueAtTime(0.01, now);
      gain.gain.linearRampToValueAtTime(0.5, now + 0.1);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);

      osc.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(now);
      osc.stop(now + 0.45);

      // Noise burst layer for sizzle ignition
      createSizzleBurst(0.3);
    }

    // 3. Retraction Sound (収納時の「ピシューン...」)
    function playRetractSound() {
      if (!audioCtx) return;

      const now = audioCtx.currentTime;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const filter = audioCtx.createBiquadFilter();

      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(450, now);
      osc.frequency.exponentialRampToValueAtTime(50, now + 0.35);

      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(1800, now);
      filter.frequency.exponentialRampToValueAtTime(150, now + 0.35);

      gain.gain.setValueAtTime(0.4, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);

      osc.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(now);
      osc.stop(now + 0.4);
    }

    // 4. Dynamic Swing / Woosh Sound (振った時のスイング音)
    function playSwingWoosh(intensity) {
      if (!audioCtx || !isActive) return;

      const now = audioCtx.currentTime;
      // Rate limit swings (min 180ms apart)
      if (now - lastSwingTime < 0.18) return;
      lastSwingTime = now;

      // intensity is normalized 0.0 ~ 1.0
      const duration = 0.25 + (1 - intensity) * 0.15;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const filter = audioCtx.createBiquadFilter();

      osc.type = 'sine';
      
      // Pitch swells up and down based on swing speed
      const baseFreq = 120 + intensity * 80;
      const peakFreq = 280 + intensity * 260; // Up to ~540Hz
      
      osc.frequency.setValueAtTime(baseFreq, now);
      osc.frequency.linearRampToValueAtTime(peakFreq, now + duration * 0.4);
      osc.frequency.exponentialRampToValueAtTime(baseFreq, now + duration);

      // Filter sweep for Doppler effect
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(400, now);
      filter.frequency.linearRampToValueAtTime(1200 + intensity * 1800, now + duration * 0.4);
      filter.frequency.exponentialRampToValueAtTime(300, now + duration);

      const vol = 0.3 + intensity * 0.45;
      gain.gain.setValueAtTime(0.01, now);
      gain.gain.linearRampToValueAtTime(vol, now + duration * 0.3);
      gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

      osc.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(now);
      osc.stop(now + duration);
    }

    // 5. Impact / Clash Sound (衝撃・ぶつかった音)
    function triggerClashSound() {
      if (!audioCtx || !isActive) return;

      const now = audioCtx.currentTime;

      // Flash Screen
      flashOverlay.style.opacity = '0.8';
      setTimeout(() => { flashOverlay.style.opacity = '0'; }, 100);

      // High pitch metallic clash burst
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'square';
      osc.frequency.setValueAtTime(880, now);
      osc.frequency.exponentialRampToValueAtTime(110, now + 0.2);

      gain.gain.setValueAtTime(0.6, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(now);
      osc.stop(now + 0.2);

      createSizzleBurst(0.25);
    }

    // White noise generator helper
    function createSizzleBurst(duration) {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;

      const bufferSize = audioCtx.sampleRate * duration;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const output = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        output[i] = Math.random() * 2 - 1;
      }

      const whiteNoise = audioCtx.createBufferSource();
      whiteNoise.buffer = buffer;

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(1500, now);
      filter.Q.setValueAtTime(2, now);

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + duration);

      whiteNoise.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);

      whiteNoise.start(now);
    }

    // -------------------------------------------------------------
    // Lightsaber Power Toggle Logic
    // -------------------------------------------------------------
    function togglePower() {
      initAudio();
      if (audioCtx.state === 'suspended') audioCtx.resume();

      isActive = !isActive;

      if (isActive) {
        bladeWrapper.classList.add('active');
        hiltButton.classList.add('active');
        btnTogglePower.classList.add('active');
        btnTogglePower.innerHTML = '<span>🔥 収納 / OFF</span>';
        
        playIgnitionSound();
        setTimeout(startIdleHum, 300);
      } else {
        bladeWrapper.classList.remove('active');
        hiltButton.classList.remove('active');
        btnTogglePower.classList.remove('active');
        btnTogglePower.innerHTML = '<span>⚡ 起動 / OFF</span>';

        stopIdleHum();
        playRetractSound();
      }
    }

    // Color Change Logic
    colorBtns.forEach(btn => {
      btn.addEventListener('click', (e) => {
        colorBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        const hex = btn.getAttribute('data-hex');
        currentHex = hex;

        document.documentElement.style.setProperty('--current-saber-color', hex);
        document.documentElement.style.setProperty('--current-glow', `0 0 20px ${hex}, 0 0 40px ${hex}, 0 0 80px ${hex}`);
      });
    });

    // -------------------------------------------------------------
    // Smartphone Motion & Gyro Sensor Controls
    // -------------------------------------------------------------
    async function requestSensors() {
      initAudio();
      if (audioCtx.state === 'suspended') audioCtx.resume();

      if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
        try {
          const state = await DeviceMotionEvent.requestPermission();
          if (state === 'granted') {
            window.addEventListener('devicemotion', handleMotion);
            sensorStatus.textContent = 'センサー作動中 (iOS)';
          }
        } catch (e) {
          sensorStatus.textContent = 'エラー: ' + e.message;
        }
      } else {
        window.addEventListener('devicemotion', handleMotion);
        sensorStatus.textContent = 'センサー作動中 (Android/Standard)';
      }
    }

    function handleMotion(e) {
      let acc = e.acceleration || e.accelerationIncludingGravity;
      if (!acc || (acc.x === null && acc.y === null)) {
        acc = e.accelerationIncludingGravity;
      }
      if (!acc) return;

      const x = acc.x || 0;
      const y = acc.y || 0;
      const z = acc.z || 0;

      const totalAcc = Math.sqrt(x * x + y * y + z * z);
      valMotion.textContent = `${totalAcc.toFixed(1)} m/s²`;

      if (!isActive) return;

      // Detect Swing Threshold (Acceleration > 14 m/s2)
      if (totalAcc > 26) {
        // High impact clash
        triggerClashSound();
      } else if (totalAcc > 14) {
        // Swing woosh
        const intensity = Math.min(1.0, (totalAcc - 14) / 12);
        playSwingWoosh(intensity);
      }
    }

    // -------------------------------------------------------------
    // Interactive PC / Touch Fallback Controls
    // -------------------------------------------------------------
    btnTogglePower.addEventListener('click', togglePower);
    hiltButton.addEventListener('click', togglePower);
    btnSensorPermission.addEventListener('click', requestSensors);

    // Click/Drag on stage triggers swing on PC
    let lastX = 0, lastY = 0;
    saberStage.addEventListener('pointerdown', (e) => {
      if (!isActive) {
        togglePower();
        return;
      }
      lastX = e.clientX;
      lastY = e.clientY;
    });

    saberStage.addEventListener('pointermove', (e) => {
      if (!isActive || e.buttons === 0) return;
      const dx = e.clientX - lastX;
      const dy = e.clientY - lastY;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (dist > 30) {
        const intensity = Math.min(1.0, dist / 100);
        playSwingWoosh(intensity);
        lastX = e.clientX;
        lastY = e.clientY;
      }
    });

    // Spacebar to swing / toggle
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        if (!isActive) togglePower();
        else playSwingWoosh(0.8);
      }
    });
  </script>
</body>
</html>

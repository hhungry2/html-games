<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>パネルパニック</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--dk:#0a0d18;--hi:#ffd23c;--cy:#3fe0ff;--pk:#ff5da8}
html,body{width:100%;height:100%;overflow:hidden;background:#070a12;color:#fff;
  font-family:'Hiragino Maru Gothic ProN','Yu Gothic UI',Meiryo,system-ui,-apple-system,sans-serif;
  user-select:none;overscroll-behavior:none;touch-action:none}
canvas#cv{position:absolute;inset:0;display:block;touch-action:none}
.out{text-shadow:2px 2px 0 var(--dk),-2px 2px 0 var(--dk),2px -2px 0 var(--dk),-2px -2px 0 var(--dk)}

/* ================= HUD ================= */
#hud{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .25s}
#hud.on{opacity:1}
#top{position:absolute;left:50%;top:calc(5px + env(safe-area-inset-top));transform:translateX(-50%);
  width:min(94vw,620px);display:flex;flex-direction:column;align-items:center;gap:3px}
#row1{display:flex;align-items:center;justify-content:space-between;width:100%;font-size:clamp(11px,3.1vw,15px);
  font-weight:900;letter-spacing:.5px}
#row1>div{display:flex;align-items:center;gap:5px}
#stg{color:var(--cy)}
#lifeBox{letter-spacing:1px;font-size:clamp(12px,3.4vw,17px)}
#time{font-variant-numeric:tabular-nums}
#time.warn{color:#ff6b6b;animation:tk .5s infinite alternate}
@keyframes tk{from{transform:scale(1)}to{transform:scale(1.14)}}
#score{font-variant-numeric:tabular-nums;color:var(--hi)}
#barw{position:relative;width:100%;height:19px;background:#131828;border:3px solid var(--dk);
  border-radius:999px;overflow:hidden;box-shadow:0 3px 0 #00000066}
#bfill{position:absolute;left:0;top:0;bottom:0;width:0%;border-radius:999px;
  background:linear-gradient(180deg,#9dfcff,#26c6ff 55%,#0f8ede);transition:width .18s ease-out}
#bfill.hit{background:linear-gradient(180deg,#fff3b0,#ffd23c 55%,#ff9c1a)}
#bmark{position:absolute;top:-3px;bottom:-3px;width:4px;background:var(--pk);box-shadow:0 0 6px #ff5da8}
#btxt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:900;font-variant-numeric:tabular-nums;color:#fff;
  text-shadow:0 1px 2px #000,0 0 4px #000}

/* ================= コントロール ================= */
#ctrl{position:absolute;inset:0;pointer-events:none;display:none}
#ctrl.on{display:block}
#dpad{position:absolute;left:calc(12px + env(safe-area-inset-left));bottom:calc(14px + env(safe-area-inset-bottom));
  width:156px;height:156px;pointer-events:auto}
.dk{position:absolute;width:52px;height:52px;border:3px solid var(--dk);background:#ffffffcc;color:var(--dk);
  border-radius:12px;font-size:20px;font-weight:900;display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 0 var(--dk);font-family:inherit}
.dk.on{background:var(--hi);transform:translateY(3px);box-shadow:0 1px 0 var(--dk)}
#dU{left:52px;top:0}#dD{left:52px;top:104px}#dL{left:0;top:52px}#dR{left:104px;top:52px}
#bDraw{position:absolute;right:calc(16px + env(safe-area-inset-right));bottom:calc(24px + env(safe-area-inset-bottom));
  width:104px;height:104px;border-radius:50%;border:4px solid var(--dk);pointer-events:auto;
  background:radial-gradient(circle at 35% 30%,#fff6b0,#ffcb2e 60%,#ef9a08);color:var(--dk);
  font-size:19px;font-weight:900;box-shadow:0 5px 0 var(--dk);font-family:inherit;line-height:1.1}
#bDraw small{display:block;font-size:10px;margin-top:2px;letter-spacing:0}
#bDraw.on{transform:translateY(4px);box-shadow:0 1px 0 var(--dk);
  background:radial-gradient(circle at 35% 30%,#d6fbff,#3fe0ff 60%,#0f8ede)}
@media (max-height:520px){#dpad{width:132px;height:132px}.dk{width:44px;height:44px;font-size:17px}
  #dU{left:44px}#dD{left:44px;top:88px}#dL{top:44px}#dR{left:88px;top:44px}
  #bDraw{width:88px;height:88px;font-size:16px}}

#bMute{position:absolute;right:calc(8px + env(safe-area-inset-right));top:calc(4px + env(safe-area-inset-top));
  width:36px;height:36px;border-radius:10px;border:3px solid var(--dk);background:#ffffffcc;color:var(--dk);
  font-size:15px;box-shadow:0 3px 0 var(--dk);font-family:inherit;z-index:6}
#bMute:active{transform:translateY(2px);box-shadow:0 1px 0 var(--dk)}

/* ================= オーバーレイ ================= */
.ov{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;padding:20px;text-align:center;z-index:5}
.ov.on{display:flex}
#title{background:radial-gradient(120% 90% at 50% 20%,#233166 0%,#0a0d18 70%)}
#title h1{font-size:clamp(38px,11vw,86px);font-weight:900;letter-spacing:2px;line-height:.98;
  background:linear-gradient(180deg,#fff 10%,#ffd23c 55%,#ff8a3d 90%);-webkit-background-clip:text;
  background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #0a0d18) drop-shadow(0 0 16px #ff9c3d66)}
#title .sub{font-size:clamp(11px,3.2vw,15px);font-weight:900;color:#9fd8ff;letter-spacing:1px}
.btn{border:4px solid var(--dk);border-radius:16px;background:#fff;color:var(--dk);font-family:inherit;
  font-size:clamp(15px,4.2vw,20px);font-weight:900;padding:12px 30px;box-shadow:0 5px 0 var(--dk);cursor:pointer;
  min-width:180px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--dk)}
.btn.y{background:linear-gradient(180deg,#fff0a8,#ffcb2e)}
.btn.c{background:linear-gradient(180deg,#cdf6ff,#4fd8ff)}
.btn.s{font-size:clamp(12px,3.4vw,15px);padding:9px 18px;min-width:0;border-width:3px}
.card{background:#0d1220e8;border:4px solid var(--dk);border-radius:18px;padding:16px 20px;
  box-shadow:0 6px 0 #00000055;max-width:min(92vw,520px)}
.card h2{font-size:clamp(22px,6.5vw,38px);font-weight:900;letter-spacing:1px;margin-bottom:6px}
.card p{font-size:clamp(12px,3.4vw,15px);font-weight:700;line-height:1.7;color:#cfe2ff}
.rowsc{display:flex;justify-content:space-between;gap:16px;font-size:clamp(13px,3.6vw,17px);font-weight:900;
  border-bottom:2px dotted #ffffff33;padding:4px 2px}
.rowsc b{color:var(--hi);font-variant-numeric:tabular-nums}
#help{font-size:clamp(11px,3vw,14px);font-weight:700;color:#b9cbe8;line-height:1.75;max-width:min(92vw,520px);
  background:#0d122099;border-radius:14px;padding:11px 15px;border:2px solid #ffffff22}
#help b{color:var(--hi)}
#help i{color:var(--cy);font-style:normal}
#stgpick{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;max-width:min(92vw,520px)}
#msg{position:absolute;left:0;right:0;top:26%;text-align:center;font-size:clamp(30px,9vw,72px);font-weight:900;
  opacity:0;pointer-events:none;letter-spacing:2px;z-index:4}
#msg.show{animation:msgIn 1.4s ease-out forwards}
@keyframes msgIn{0%{opacity:0;transform:scale(1.8)}13%{opacity:1;transform:scale(1)}70%{opacity:1;transform:scale(1)}
  100%{opacity:0;transform:scale(1.2)}}
#err{position:absolute;left:0;right:0;bottom:0;background:#c00;color:#fff;font-size:11px;padding:5px 8px;
  display:none;z-index:99;white-space:pre-wrap;font-family:monospace}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud">
  <div id="top">
    <div id="row1" class="out">
      <div><span id="stg">STAGE 1</span></div>
      <div><span id="lifeBox">❤❤❤</span></div>
      <div><span>⏱</span><span id="time">99</span></div>
      <div><span id="score">0</span></div>
    </div>
    <div id="barw"><i id="bfill"></i><u id="bmark"></u><span id="btxt">0.0%</span></div>
  </div>
</div>

<div id="ctrl">
  <div id="dpad">
    <div class="dk" id="dU">▲</div><div class="dk" id="dL">◀</div>
    <div class="dk" id="dR">▶</div><div class="dk" id="dD">▼</div>
  </div>
  <button id="bDraw">ひく<small>おしながら</small></button>
</div>
<button id="bMute">🔊</button>

<div id="msg" class="out"></div>

<div class="ov on" id="title">
  <h1>PANEL<br>PANIC</h1>
  <div class="sub">ギャルズパニック風 じんとりアクション</div>
  <div id="help">
    ▸ わくの上を歩き、<b>「ひく」</b>を押しながら中へ入ると<b>線</b>がのびる<br>
    ▸ 線をわくまでつなぐと、囲んだ内側が<i>ぬりつぶされて絵があらわれる</i><br>
    ▸ <b>てき</b>が線にふれるとミス。てきをせまく囲みこむのがコツ<br>
    ▸ わくの上を走る<i>スパーク</i>にも当たらないように<br>
    ▸ <b>80%</b>まで塗ればステージクリア！
  </div>
  <button class="btn y" id="bStart">スタート</button>
  <div id="stgpick"></div>
</div>

<div class="ov" id="ovc">
  <div class="card" id="ovcard"></div>
  <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
    <button class="btn c" id="bNext">つぎへ</button>
    <button class="btn s" id="bTitle">タイトル</button>
  </div>
</div>

<div id="err"></div>

<script>
"use strict";
window.onerror=function(m,s,l,c){var e=document.getElementById('err');
  e.style.display='block';e.textContent='ERR: '+m+' @'+l+':'+c;};

/* ==================================================================
   パネルパニック  ―  Qix / ギャルズパニック系 じんとりアクション
   ================================================================== */

/* ---------------- 定数 ---------------- */
var GW=120, GH=90;            // フィールドのマス数
var NC=GW*GH;
var CS=6;                     // 絵1マスあたりのピクセル
var PW=GW*CS, PH=GH*CS;       // 絵のサイズ 720x540
var BW=2;                     // 外わくの厚み(マス)
var EMPTY=0, FILL=1, TRAIL=2;
var INNER=(GW-BW*2)*(GH-BW*2);

/* ---------------- DOM ---------------- */
var cv=document.getElementById('cv'), ctx=cv.getContext('2d');
var $=function(id){return document.getElementById(id);};
var elHud=$('hud'), elStg=$('stg'), elLife=$('lifeBox'), elTime=$('time'), elScore=$('score');
var elFill=$('bfill'), elMark=$('bmark'), elBtxt=$('btxt'), elMsg=$('msg');
var elTitle=$('title'), elOvc=$('ovc'), elCard=$('ovcard'), elCtrl=$('ctrl');
var elNext=$('bNext'), elPick=$('stgpick');

/* ==================================================================
   サウンド
   ================================================================== */
var AC=null, MASTER=null, MUSIC=null, muted=false;
try{ muted = localStorage.getItem('pp_mute')==='1'; }catch(e){}
function ac(){
  if(muted) return null;
  if(!AC){
    try{
      var K=window.AudioContext||window.webkitAudioContext;
      if(!K) return null;
      AC=new K();
      MASTER=AC.createGain(); MASTER.gain.value=0.25; MASTER.connect(AC.destination);
      MUSIC=AC.createGain(); MUSIC.gain.value=0.5; MUSIC.connect(MASTER);
    }catch(e){ AC=null; return null; }
  }
  if(AC.state==='suspended'){ try{AC.resume();}catch(e){} }
  return AC;
}
function tone(f,dur,type,vol,delay,f2,dest){
  var a=ac(); if(!a) return;
  var t=a.currentTime+(delay||0);
  var o=a.createOscillator(), g=a.createGain();
  o.type=type||'square'; o.frequency.setValueAtTime(f,t);
  if(f2) o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+dur);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol||0.2,t+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(dest||MASTER); o.start(t); o.stop(t+dur+0.03);
}
function noise(dur,vol,delay,lp){
  var a=ac(); if(!a) return;
  var t=a.currentTime+(delay||0), n=Math.floor(a.sampleRate*dur);
  var b=a.createBuffer(1,n,a.sampleRate), d=b.getChannelData(0);
  for(var i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  var s=a.createBufferSource(); s.buffer=b;
  var f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=lp||1800;
  var g=a.createGain(); g.gain.value=vol||0.2;
  s.connect(f); f.connect(g); g.connect(MASTER); s.start(t);
}
var SFX={
  draw:function(){ tone(880,0.06,'triangle',0.12,0,1180); },
  fill:function(p){ // p:0-1 塗った割合
    var base=[523,659,784,1047,1319];
    var n=Math.min(5,2+Math.floor(p*22));
    for(var i=0;i<n;i++) tone(base[i%5]*(i>=5?2:1),0.15,'square',0.16,i*0.055,0);
    noise(0.2,0.1,0,3000);
  },
  bounce:function(){ tone(180,0.05,'sawtooth',0.05,0,120); },
  die:function(){ tone(440,0.5,'sawtooth',0.22,0,60); noise(0.4,0.16,0,900); },
  clear:function(){ var m=[523,659,784,1047,1319,1568,2093];
    for(var i=0;i<m.length;i++) tone(m[i],0.28,'square',0.17,i*0.085); },
  over:function(){ var m=[392,349,294,233];
    for(var i=0;i<m.length;i++) tone(m[i],0.42,'triangle',0.2,i*0.16); },
  warn:function(){ tone(1046,0.08,'square',0.11); },
  ui:function(){ tone(1320,0.06,'square',0.13,0,1760); }
};

/* --- かんたんBGM --- */
var BGM={on:false,next:0,step:0,tid:0};
var BASS=[0,0,7,7,5,5,3,3];
var ARP=[[0,4,7,12],[0,4,7,12],[7,11,14,19],[7,11,14,19],[5,9,12,17],[5,9,12,17],[3,7,10,15],[3,7,10,15]];
function nt(s){ return 220*Math.pow(2,s/12); }
function bgmTick(){
  var a=ac(); if(!a||!BGM.on) return;
  var spb=60/138/2; // 8分
  if(BGM.next<a.currentTime) BGM.next=a.currentTime+0.05;
  while(BGM.next < a.currentTime+0.25){
    var s=BGM.step, bar=(s>>3)%8, k=s&7;
    var d=BGM.next-a.currentTime;
    if(k%2===0) tone(nt(BASS[bar]-12),spb*1.6,'triangle',0.16,d,0,MUSIC);
    var ar=ARP[bar];
    tone(nt(ar[k%4]+12),spb*0.8,'square',0.055,d,0,MUSIC);
    if(k===0||k===4) noise(0.05,0.06,d,4000);
    BGM.next+=spb; BGM.step++;
  }
}
function bgmStart(){ if(!ac())return; BGM.on=true; BGM.next=0;
  if(!BGM.tid) BGM.tid=setInterval(bgmTick,60); }
function bgmStop(){ BGM.on=false; }

/* ==================================================================
   絵（ステージごとの一枚絵をプロシージャル描画）
   ================================================================== */
function rnd(seed){ var s=seed; return function(){ s=(s*1103515245+12345)&0x7fffffff; return s/0x7fffffff; }; }


/* ---------------- 背景 ---------------- */
function bgSun(g){ // 青空とひまわり
  var gr=g.createLinearGradient(0,0,0,PH);
  gr.addColorStop(0,'#3aa8f0'); gr.addColorStop(.45,'#8fd6ff'); gr.addColorStop(.72,'#d9f2ff'); gr.addColorStop(1,'#bde78d');
  g.fillStyle=gr; g.fillRect(0,0,PW,PH);
  // 太陽
  var sg=g.createRadialGradient(600,90,10,600,90,150);
  sg.addColorStop(0,'#fffbe0'); sg.addColorStop(.35,'#ffe98a55'); sg.addColorStop(1,'#ffe98a00');
  g.fillStyle=sg; g.fillRect(430,-70,340,330);
  // 雲
  g.fillStyle='rgba(255,255,255,.92)';
  var cl=[[110,96,52],[168,110,38],[62,116,34],[540,180,40],[600,192,28],[486,190,26]];
  for(var i=0;i<cl.length;i++){ g.beginPath(); g.arc(cl[i][0],cl[i][1],cl[i][2],0,7); g.fill(); }
  // 地面
  g.fillStyle='#8dcb5a'; g.beginPath(); g.moveTo(0,PH); g.lineTo(0,404);
  g.quadraticCurveTo(360,376,PW,406); g.lineTo(PW,PH); g.closePath(); g.fill();
  // ひまわり
  var R=rnd(7);
  for(var k=0;k<16;k++){
    var x=18+k*46+R()*22, y=396+R()*90, s=.5+R()*.55;
    if(x>250&&x<470&&y<470) continue;
    g.strokeStyle='#3f8f36'; g.lineWidth=6*s; g.beginPath();
    g.moveTo(x,y+70*s); g.lineTo(x,y); g.stroke();
    g.fillStyle='#3f8f36'; g.beginPath(); g.ellipse(x+16*s,y+34*s,17*s,9*s,-.4,0,7); g.fill();
    g.fillStyle='#ffcf3d';
    for(var p=0;p<11;p++){ var a=p/11*6.283;
      g.beginPath(); g.ellipse(x+Math.cos(a)*24*s,y+Math.sin(a)*24*s,13*s,7.5*s,a,0,7); g.fill(); }
    g.fillStyle='#7a4a1c'; g.beginPath(); g.arc(x,y,15*s,0,7); g.fill();
  }
}
function bgCafe(g){ // 木のカフェ
  var gr=g.createLinearGradient(0,0,0,PH);
  gr.addColorStop(0,'#6a4a37'); gr.addColorStop(.6,'#8d6448'); gr.addColorStop(1,'#5b3d2c');
  g.fillStyle=gr; g.fillRect(0,0,PW,PH);
  g.strokeStyle='rgba(0,0,0,.13)'; g.lineWidth=3;
  for(var x=0;x<PW;x+=52){ g.beginPath(); g.moveTo(x,0); g.lineTo(x,PH); g.stroke(); }
  // 窓
  g.fillStyle='#2b1d16'; g.fillRect(38,74,180,196);
  var wg=g.createLinearGradient(0,84,0,262); wg.addColorStop(0,'#ffd9a0'); wg.addColorStop(1,'#ff9f66');
  g.fillStyle=wg; g.fillRect(48,84,160,176);
  g.fillStyle='#2b1d16'; g.fillRect(122,84,10,176); g.fillRect(48,166,160,10);
  // ランプ
  g.strokeStyle='#2b1d16'; g.lineWidth=5; g.beginPath(); g.moveTo(596,0); g.lineTo(596,80); g.stroke();
  g.fillStyle='#f2b23c'; g.beginPath(); g.moveTo(548,138); g.lineTo(644,138); g.lineTo(618,80); g.lineTo(574,80); g.closePath(); g.fill();
  var lg=g.createRadialGradient(596,150,6,596,150,150);
  lg.addColorStop(0,'#fff0b866'); lg.addColorStop(1,'#fff0b800');
  g.fillStyle=lg; g.fillRect(446,138,300,240);
  // 棚とカップ
  g.fillStyle='#4a3123'; g.fillRect(452,214,244,14);
  var cc=['#ffffff','#ffd8e6','#cfe9ff'];
  for(var i=0;i<4;i++){ g.fillStyle=cc[i%3];
    g.beginPath(); g.moveTo(470+i*58,214); g.lineTo(506+i*58,214); g.lineTo(500+i*58,180); g.lineTo(476+i*58,180); g.closePath(); g.fill(); }
  // 床
  g.fillStyle='#3a271c'; g.fillRect(0,430,PW,PH-430);
  g.fillStyle='rgba(255,255,255,.06)';
  for(var fy=430;fy<PH;fy+=26) for(var fx=(fy/26|0)%2*26;fx<PW;fx+=52) g.fillRect(fx,fy,26,26);
}
function bgSea(g){ // 夏の海
  var gr=g.createLinearGradient(0,0,0,PH);
  gr.addColorStop(0,'#1a72d6'); gr.addColorStop(.32,'#79cdf5'); gr.addColorStop(.45,'#bfeaff');
  g.fillStyle=gr; g.fillRect(0,0,PW,240);
  var sg=g.createLinearGradient(0,240,0,400); sg.addColorStop(0,'#1e93d8'); sg.addColorStop(1,'#0d5fa8');
  g.fillStyle=sg; g.fillRect(0,240,PW,164);
  g.fillStyle='rgba(255,255,255,.55)';
  var R=rnd(19);
  for(var i=0;i<40;i++){ var x=R()*PW, y=246+R()*150, w=20+R()*54;
    g.fillRect(x,y,w,3); }
  // 砂浜
  var bg2=g.createLinearGradient(0,392,0,PH); bg2.addColorStop(0,'#ffe9b8'); bg2.addColorStop(1,'#e8c27e');
  g.fillStyle=bg2; g.beginPath(); g.moveTo(0,PH); g.lineTo(0,408);
  g.quadraticCurveTo(360,382,PW,410); g.lineTo(PW,PH); g.closePath(); g.fill();
  g.fillStyle='rgba(255,255,255,.85)';
  g.beginPath(); g.moveTo(0,404); g.quadraticCurveTo(360,378,PW,406);
  g.quadraticCurveTo(360,396,0,420); g.closePath(); g.fill();
  // 雲
  g.fillStyle='rgba(255,255,255,.9)';
  var cl=[[92,72,40],[136,84,30],[556,60,34],[604,72,26]];
  for(var c=0;c<cl.length;c++){ g.beginPath(); g.arc(cl[c][0],cl[c][1],cl[c][2],0,7); g.fill(); }
  // ヤシ
  g.strokeStyle='#6b4a24'; g.lineWidth=13; g.lineCap='round';

var grid=new Uint8Array(NC);
var visit=new Uint8Array(NC);
var stk=new Int32Array(NC);
var flashCell=new Uint8Array(NC);

var picCv=null, dimCv=null, maskCv=null, mctx=null, mimg=null, revCv=null, rctx=null;
var outline=null;

var state='title';           // title / play / die / clear / over / win
var stage=0, score=0, lives=3, timeLeft=0, pct=0, target=0.8;
var dieT=0, clearT=0, flashT=0, shake=0, msgT=0;

try{ maxStageOpen=Math.min(4,parseInt(localStorage.getItem('pp_open')||'0',10)||0); }catch(e){}

var trail=[];
var player={x:0,y:0,dx:0,dy:0,sub:0,drawing:false,inv:0,ang:0};
var fuse={on:false,pos:0,idle:0};
var foes=[], sparks=[], parts=[];

var SPD_EDGE=46, SPD_DRAW=37, FUSE_SPD=24;

/* ---------------- マス関数 ---------------- */
function ix(x,y){ return y*GW+x; }
function inb(x,y){ return x>=0&&y>=0&&x<GW&&y<GH; }
function isEdge(x,y){
  if(!inb(x,y)||grid[ix(x,y)]!==FILL) return false;
  if(y>0   && grid[ix(x,y-1)]===EMPTY) return true;
  if(y<GH-1&& grid[ix(x,y+1)]===EMPTY) return true;
  if(x>0   && grid[ix(x-1,y)]===EMPTY) return true;
  if(x<GW-1&& grid[ix(x+1,y)]===EMPTY) return true;
  return false;
}
function solidAt(x,y){ // 敵にとっての壁
  if(!inb(x,y)) return true;
  return grid[ix(x,y)]===FILL;
}
function blockedCircle(x,y,r){
  var x0=Math.floor(x-r), x1=Math.floor(x+r), y0=Math.floor(y-r), y1=Math.floor(y+r);
  for(var yy=y0;yy<=y1;yy++) for(var xx=x0;xx<=x1;xx++){
    if(!inb(xx,yy)) return true;
    if(grid[ix(xx,yy)]===FILL){
      var dx=Math.max(xx,Math.min(x,xx+1))-x, dy=Math.max(yy,Math.min(y,yy+1))-y;
      if(dx*dx+dy*dy < r*r) return true;
    }
  }
  return false;
}
function touchesTrail(x,y,r){
  var x0=Math.floor(x-r), x1=Math.floor(x+r), y0=Math.floor(y-r), y1=Math.floor(y+r);
  for(var yy=y0;yy<=y1;yy++) for(var xx=x0;xx<=x1;xx++){
    if(!inb(xx,yy)) continue;
    if(grid[ix(xx,yy)]===TRAIL){
      var dx=xx+0.5-x, dy=yy+0.5-y;
      if(dx*dx+dy*dy < r*r) return true;
    }
  }
  return false;
}

/* ---------------- 面の初期化 ---------------- */
function resetField(){
  grid.fill(EMPTY);
  for(var y=0;y<GH;y++) for(var x=0;x<GW;x++)
    if(x<BW||y<BW||x>=GW-BW||y>=GH-BW) grid[ix(x,y)]=FILL;
  trail.length=0;
  recount();
  rebuildMask(); rebuildReveal(); buildOutline();
}
function recount(){
  var n=0;
  for(var y=BW;y<GH-BW;y++){ var b=y*GW;
    for(var x=BW;x<GW-BW;x++) if(grid[b+x]===FILL) n++; }
  pct=n/INNER;
}

/* ---------------- マスク／絵の合成 ---------------- */
function initCanvases(){
  maskCv=document.createElement('canvas'); maskCv.width=GW; maskCv.height=GH;
  mctx=maskCv.getContext('2d'); mimg=mctx.createImageData(GW,GH);
  for(var i=0;i<NC;i++){ mimg.data[i*4]=255; mimg.data[i*4+1]=255; mimg.data[i*4+2]=255; }
  revCv=document.createElement('canvas'); revCv.width=PW; revCv.height=PH;
  rctx=revCv.getContext('2d');
}
function rebuildMask(){
  var d=mimg.data;
  for(var i=0;i<NC;i++) d[i*4+3]=(grid[i]===FILL)?255:0;
  mctx.putImageData(mimg,0,0);
}
function rebuildReveal(){
  rctx.clearRect(0,0,PW,PH);
  rctx.drawImage(picCv,0,0);
  rctx.globalCompositeOperation='destination-in';
  rctx.imageSmoothingEnabled=false;
  rctx.drawImage(maskCv,0,0,PW,PH);
  rctx.globalCompositeOperation='source-over';
}
function buildOutline(){
  var p=new Path2D();
  for(var y=0;y<GH;y++){
    for(var x=0;x<GW;x++){
      var a=grid[ix(x,y)]===FILL;
      if(x<GW-1){ var b=grid[ix(x+1,y)]===FILL;
        if(a!==b){ p.moveTo((x+1)*CS,y*CS); p.lineTo((x+1)*CS,(y+1)*CS); } }
      if(y<GH-1){ var c=grid[ix(x,y+1)]===FILL;
        if(a!==c){ p.moveTo(x*CS,(y+1)*CS); p.lineTo((x+1)*CS,(y+1)*CS); } }
    }
  }
  outline=p;
}

/* ---------------- 線を閉じる ---------------- */
function finishLine(){
  var i,j;
  for(i=0;i<trail.length;i++) grid[trail[i]]=FILL;
  visit.fill(0);
  // 敵のいる領域は残す
  var sp=0;
  for(i=0;i<foes.length;i++){
    var fx2=Math.floor(foes[i].x), fy2=Math.floor(foes[i].y);
    for(var oy=-1;oy<=1;oy++) for(var ox=-1;ox<=1;ox++){
      var xx=fx2+ox, yy=fy2+oy;
      if(!inb(xx,yy)) continue;
      var k=ix(xx,yy);
      if(grid[k]===EMPTY&&!visit[k]){ visit[k]=1; stk[sp++]=k; }
    }
  }
  while(sp>0){
    var c=stk[--sp], cx2=c%GW, cy2=(c/GW)|0;
    if(cx2>0){ var l=c-1; if(grid[l]===EMPTY&&!visit[l]){visit[l]=1;stk[sp++]=l;} }
    if(cx2<GW-1){ var r=c+1; if(grid[r]===EMPTY&&!visit[r]){visit[r]=1;stk[sp++]=r;} }
    if(cy2>0){ var u=c-GW; if(grid[u]===EMPTY&&!visit[u]){visit[u]=1;stk[sp++]=u;} }
    if(cy2<GH-1){ var d2=c+GW; if(grid[d2]===EMPTY&&!visit[d2]){visit[d2]=1;stk[sp++]=d2;} }
  }
  // 囲めた分を塗る
  flashCell.fill(0);
  var gained=0;
  for(i=0;i<trail.length;i++) flashCell[trail[i]]=1;
  for(i=0;i<NC;i++){
    if(grid[i]===EMPTY&&!visit[i]){
      grid[i]=FILL; flashCell[i]=1;
      var gx=i%GW, gy=(i/GW)|0;
      if(gx>=BW&&gy>=BW&&gx<GW-BW&&gy<GH-BW) gained++;
    }
  }
  var before=pct;
  trail.length=0; player.drawing=false; fuse.on=false; fuse.pos=0; fuse.idle=0;
  recount(); rebuildMask(); rebuildReveal(); buildOutline();
  var got=pct-before;
  flashT=0.45; buildFlash();
  if(gained>0){
    score+=Math.round(gained*3*(1+stage*0.25)) + (got>0.12? 1500:0);
    SFX.fill(got);
    if(got>=0.25) showMsg('EXCELLENT!','#ffd23c');
    else if(got>=0.12) showMsg('NICE!','#3fe0ff');
    for(i=0;i<26;i++){
      var t=Math.floor(Math.random()*NC);
      if(flashCell[t]) burst((t%GW)+0.5,((t/GW)|0)+0.5,1,'#fff');
    }
  }
  snapToEdge();
  updateHud();
  if(pct>=target) doClear();
}

/* プレイヤーが縁でなくなったら最寄りの縁へ寄せる */
function snapToEdge(){
  if(isEdge(player.x,player.y)) return;
  visit.fill(0);
  var sp=0, s=ix(player.x,player.y);
  visit[s]=1; stk[sp++]=s;
  var head=0, q=[s];
  while(head<q.length){
    var c=q[head++], cx2=c%GW, cy2=(c/GW)|0;
    if(isEdge(cx2,cy2)){ player.x=cx2; player.y=cy2; player.sub=0; return; }
    var nb=[cx2>0?c-1:-1, cx2<GW-1?c+1:-1, cy2>0?c-GW:-1, cy2<GH-1?c+GW:-1];
    for(var k=0;k<4;k++){
      var n=nb[k];
      if(n>=0&&!visit[n]&&grid[n]===FILL){ visit[n]=1; q.push(n); }
    }
    if(q.length>NC) break;
  }
}

/* ---------------- プレイヤー ---------------- */
function drawAllowed(){
  return input.draw || perfNow()<input.armUntil;
}
function canEnter(nx,ny){
  if(!inb(nx,ny)) return false;
  var t=grid[ix(nx,ny)];
  if(player.drawing){
    if(t===TRAIL) return false;
    return true;
  }
  if(t===FILL) return isEdge(nx,ny);
  if(t===EMPTY) return drawAllowed();
  return false;
}
function pickDir(){
  var wx=input.dx, wy=input.dy;
  if(!wx&&!wy) return false;
  var cand=[];
  if(input.axis==='x'){ if(wx) cand.push([wx,0]); if(wy) cand.push([0,wy]); }
  else { if(wy) cand.push([0,wy]); if(wx) cand.push([wx,0]); }
  for(var i=0;i<cand.length;i++){
    if(canEnter(player.x+cand[i][0],player.y+cand[i][1])){
      player.dx=cand[i][0]; player.dy=cand[i][1]; return true;
    }
  }
  return false;
}
function endStep(){
  player.x+=player.dx; player.y+=player.dy;
  var k=ix(player.x,player.y), t=grid[k];
  if(player.drawing){
    if(t===EMPTY){ grid[k]=TRAIL; trail.push(k); }
    else if(t===FILL){ finishLine(); }
  }else{
    if(t===EMPTY){
      player.drawing=true; grid[k]=TRAIL; trail.push(k);
      fuse.on=false; fuse.pos=0; fuse.idle=0;
      SFX.draw();
    }
  }
}
function stepPlayer(dt){
  var sp=(player.drawing?SPD_DRAW:SPD_EDGE)*(state==='play'?1:0);
  var acc=sp*dt, advanced=false, guard=0;
  while(acc>0 && guard++<40){
    if(player.sub===0){
      if(!pickDir()) break;
    }
    var need=1-player.sub;
    if(acc<need){ player.sub+=acc; acc=0; advanced=true; }
    else{
      acc-=need; player.sub=0; advanced=true;
      var wasDrawing=player.drawing;
      endStep();
      if(!player.drawing&&wasDrawing) break;   // 線を閉じた
      if(state!=='play') break;
    }
  }
  if(advanced) player.ang=Math.atan2(player.dy,player.dx);
  // 導火線
  if(player.drawing&&trail.length>1){
    if(advanced){ fuse.idle=0; if(fuse.on){ fuse.pos=Math.max(0,fuse.pos-dt*FUSE_SPD*2); if(fuse.pos<=0) fuse.on=false; } }
    else{
      fuse.idle+=dt;
      if(fuse.idle>0.85){
        fuse.on=true; fuse.pos+=FUSE_SPD*dt;
        if(fuse.pos>=trail.length-0.5){ die(); }
      }
    }
  }else{ fuse.on=false; fuse.pos=0; fuse.idle=0; }
}

/* ---------------- 敵（フィールド） ---------------- */
function spawnFoes(st){
  foes.length=0;
  var n=st.foe, base=15+st.spd*7;
  for(var i=0;i<n;i++){
    var big=(i===0&&st.foe>=3);
    var a=Math.PI*(0.25+0.5*Math.random()+i*0.7);
    foes.push({
      x:GW*(0.3+0.4*((i+1)/(n+1))), y:GH*(0.32+0.3*Math.random()),
      vx:Math.cos(a)*base, vy:Math.sin(a)*base*0.85,
      r:big?3.6:2.4, kind:big?'boss':(i%2?'star':'ball'),
      spin:0, hue:[0,140,215,300][i%4], wob:Math.random()*6.28
    });
  }
}
function stepFoes(dt){
  for(var i=0;i<foes.length;i++){
    var f=foes[i];
    f.spin+=dt*(f.kind==='boss'?2.4:5.2);
    f.wob+=dt*2.2;
    // 線に向かうゆらぎ
    if(f.kind==='star'&&trail.length>2&&state==='play'){
      var tc=trail[(trail.length*0.6)|0], tx=tc%GW+0.5, ty=((tc/GW)|0)+0.5;
      var dx=tx-f.x, dy=ty-f.y, dl=Math.hypot(dx,dy)||1;
      f.vx+=dx/dl*10*dt; f.vy+=dy/dl*10*dt;
    }
    var sp2=Math.hypot(f.vx,f.vy), lim=(f.kind==='boss'?17:26)+stageSpd()*8;
    if(sp2>lim){ f.vx=f.vx/sp2*lim; f.vy=f.vy/sp2*lim; }
    if(sp2<6){ var a=Math.random()*6.28; f.vx=Math.cos(a)*12; f.vy=Math.sin(a)*12; }
    var steps=Math.max(1,Math.ceil(sp2*dt/0.4)), d=dt/steps;
    for(var s=0;s<steps;s++){
      if(state==='play'&&touchesTrail(f.x,f.y,f.r+0.4)){ die(); return; }
      var nx=f.x+f.vx*d;
      if(blockedCircle(nx,f.y,f.r)){ f.vx=-f.vx; SFX.bounce(); }
      else f.x=nx;
      var ny=f.y+f.vy*d;
      if(blockedCircle(f.x,ny,f.r)){ f.vy=-f.vy; SFX.bounce(); }
      else f.y=ny;
    }
    // はまり込み対策
    if(blockedCircle(f.x,f.y,f.r*0.6)){
      f.x+=(GW/2-f.x)*0.06; f.y+=(GH/2-f.y)*0.06;
    }
    if(state==='play'&&player.drawing&&player.inv<=0){
      var px=player.x+player.dx*player.sub+0.5, py=player.y+player.dy*player.sub+0.5;
      if((px-f.x)*(px-f.x)+(py-f.y)*(py-f.y) < (f.r+1.6)*(f.r+1.6)){ die(); return; }
    }
  }
}
function stageSpd(){ return STAGES[Math.min(stage,STAGES.length-1)].spd; }

/* ---------------- スパーク（わく上の敵） ---------------- */
function spawnSparks(st){
  sparks.length=0;
  var pos=[[GW>>1,BW-1],[BW-1,GH>>1],[GW-BW,GH>>1]];
  for(var i=0;i<st.spark;i++){
    var p=pos[i%3];
    var s={x:p[0],y:p[1],dx:i%2?1:-1,dy:0,sub:0,spd:22+st.spd*7,t:Math.random()*6.28};
    if(!isEdge(s.x,s.y)){ s.x=GW>>1; s.y=BW-1; }
    if(i===1){ s.dx=0; s.dy=1; }
    sparks.push(s);
  }
}
function sparkStep(s){
  var order=[[s.dx,s.dy]];
  if(s.dx){ order.push([0,s.dx]); order.push([0,-s.dx]); order.push([-s.dx,0]); }
  else{ order.push([-s.dy,0]); order.push([s.dy,0]); order.push([0,-s.dy]); }
  for(var i=0;i<order.length;i++){
    var nx=s.x+order[i][0], ny=s.y+order[i][1];
    if(isEdge(nx,ny)){ s.dx=order[i][0]; s.dy=order[i][1]; return true; }
  }
  return false;
}
function stepSparks(dt){
  for(var i=0;i<sparks.length;i++){
    var s=sparks[i];
    s.t+=dt*9;
    if(!isEdge(s.x,s.y)){
      // 縁でなくなったら最寄りの縁へ
      var best=-1,bd=1e9;
      for(var y=0;y<GH;y+=1) for(var x=0;x<GW;x+=1){
        if(!isEdge(x,y)) continue;
        var d2=(x-s.x)*(x-s.x)+(y-s.y)*(y-s.y);
        if(d2<bd){bd=d2;best=ix(x,y);}
      }
      if(best<0){ continue; }
      s.x=best%GW; s.y=(best/GW)|0; s.sub=0;
    }
    var acc=s.spd*dt, guard=0;
    while(acc>0&&guard++<30){
      if(s.sub===0){ if(!sparkStep(s)) break; }
      var need=1-s.sub;
      if(acc<need){ s.sub+=acc; acc=0; }
      else{ acc-=need; s.sub=0; s.x+=s.dx; s.y+=s.dy; }
    }
    if(state==='play'&&player.inv<=0){
      var px=player.x+player.dx*player.sub, py=player.y+player.dy*player.sub;
      var sx=s.x+s.dx*s.sub, sy=s.y+s.dy*s.sub;
      if((px-sx)*(px-sx)+(py-sy)*(py-sy) < 4.4){ die(); return; }
    }
  }
}

/* ---------------- パーティクル ---------------- */
function burst(x,y,n,col){
  for(var i=0;i<n;i++){
    var a=Math.random()*6.28, v=6+Math.random()*22;
    parts.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:0.4+Math.random()*0.5,t:0,c:col,s:0.5+Math.random()});
  }
}
function stepParts(dt){
  for(var i=parts.length-1;i>=0;i--){
    var p=parts[i]; p.t+=dt;
    if(p.t>=p.life){ parts.splice(i,1); continue; }
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=0.94; p.vy=p.vy*0.94+18*dt;
  }
}

  var d=fimg.data;

  fctx.putImageData(fimg,0,0);
}

function startStage(i){

  player.drawing=false; player.inv=1.6;

function respawn(){
  for(var i=0;i<trail.length;i++) grid[trail[i]]=EMPTY;
  trail.length=0; player.drawing=false;
  fuse.on=false; fuse.pos=0; fuse.idle=0;
  player.x=GW>>1; player.y=GH-BW; player.dx=0; player.dy=0; player.sub=0; player.inv=2.0;
  snapToEdge();
  // スパークをプレイヤーから遠ざける
  for(var s=0;s<sparks.length;s++){
    if(Math.abs(sparks[s].x-player.x)+Math.abs(sparks[s].y-player.y)<26){
      sparks[s].x=BW; sparks[s].y=BW; sparks[s].sub=0;
      if(!isEdge(sparks[s].x,sparks[s].y)){ sparks[s].x=GW>>1; sparks[s].y=BW-1; }
    }
  }
  rebuildMask(); rebuildReveal(); buildOutline();
  state='play'; updateHud();
}
function die(){
  if(state!=='play'||player.inv>0) return;
  lives--; state='die'; dieT=0; shake=0.6;
  SFX.die();
  var px=player.x+0.5, py=player.y+0.5;
  burst(px,py,34,'#ff5d6c'); burst(px,py,18,'#ffd23c');
  for(var i=0;i<trail.length;i++){
    grid[trail[i]]=EMPTY;
    if(i%9===0) burst(trail[i]%GW+0.5,((trail[i]/GW)|0)+0.5,1,'#ff9c3d');
  }
  trail.length=0; player.drawing=false;
  fuse.on=false; fuse.pos=0; fuse.idle=0;
  updateHud();
}

var input={dx:0,dy:0,axis:'x',draw:false,armUntil:0};
var keys={L:0,R:0,U:0,D:0};
function syncDir(axis){
  input.dx=(keys.R?1:0)-(keys.L?1:0);
  input.dy=(keys.D?1:0)-(keys.U?1:0);
  if(axis) input.axis=axis;
  else if(input.dx&&!input.dy) input.axis='x';
  else if(input.dy&&!input.dx) input.axis='y';
  refreshPad();
}
var KMAP={ArrowLeft:'L',ArrowRight:'R',ArrowUp:'U',ArrowDown:'D',
  a:'L',d:'R',w:'U',s:'D',A:'L',D:'R',W:'U',S:'D',
  h:'L',l:'R',k:'U',j:'D'};
function isDrawKey(k){ return k===' '||k==='Shift'||k==='z'||k==='Z'||k==='Enter'||k==='x'||k==='X'; }
window.addEventListener('keydown',function(e){
  if(e.repeat){ if(KMAP[e.key]||isDrawKey(e.key)) e.preventDefault(); return; }
  var m=KMAP[e.key];
  if(m){ keys[m]=1; syncDir((m==='L'||m==='R')?'x':'y'); e.preventDefault(); }
  else if(isDrawKey(e.key)){
    if(state==='title'){ e.preventDefault(); beginGame(0); return; }
    if(state==='over'||state==='clearcard'){ }
    input.draw=true; input.armUntil=perfNow()+0.35; setDrawBtn(true); e.preventDefault();
  }
});
window.addEventListener('keyup',function(e){
  var m=KMAP[e.key];
  if(m){ keys[m]=0; syncDir(); e.preventDefault(); }
  else if(isDrawKey(e.key)){ input.draw=false; setDrawBtn(false); }
});
function setDrawBtn(on){ var b=$('bDraw'); if(b) b.classList.toggle('on',!!on); }
function refreshPad(){
  $('dL').classList.toggle('on',!!keys.L); $('dR').classList.toggle('on',!!keys.R);
  $('dU').classList.toggle('on',!!keys.U); $('dD').classList.toggle('on',!!keys.D);
}
/* --- タッチ --- */
var touchMode=('ontouchstart' in window)||navigator.maxTouchPoints>0;
function bindPad(id,k,axis){
  var el=$(id);
  el.addEventListener('pointerdown',function(e){ e.preventDefault(); ac();
    try{el.setPointerCapture(e.pointerId);}catch(x){}
    keys[k]=1; syncDir(axis); },{passive:false});
  var up=function(e){ keys[k]=0; syncDir(); };
  el.addEventListener('pointerup',up); el.addEventListener('pointercancel',up);
  el.addEventListener('pointerleave',up);
}
bindPad('dL','L','x'); bindPad('dR','R','x'); bindPad('dU','U','y'); bindPad('dD','D','y');
(function(){
  var b=$('bDraw');
  b.addEventListener('pointerdown',function(e){ e.preventDefault(); ac();
    try{b.setPointerCapture(e.pointerId);}catch(x){}
    input.draw=true; input.armUntil=perfNow()+0.35; setDrawBtn(true); },{passive:false});
  var up=function(){ input.draw=false; setDrawBtn(false); };
  b.addEventListener('pointerup',up); b.addEventListener('pointercancel',up);
})();
/* --- スワイプ --- */
var swipe={id:-1,x:0,y:0};
cv.addEventListener('pointerdown',function(e){
  if(state!=='play') return;
  swipe.id=e.pointerId; swipe.x=e.clientX; swipe.y=e.clientY;
},{passive:true});
cv.addEventListener('pointermove',function(e){
  if(e.pointerId!==swipe.id) return;
  var dx=e.clientX-swipe.x, dy=e.clientY-swipe.y;
  var th=16;
  if(Math.abs(dx)<th&&Math.abs(dy)<th) return;
  keys.L=keys.R=keys.U=keys.D=0;
  if(Math.abs(dx)>Math.abs(dy)){ if(dx>0)keys.R=1; else keys.L=1; syncDir('x'); }
  else { if(dy>0)keys.D=1; else keys.U=1; syncDir('y'); }
  swipe.x=e.clientX; swipe.y=e.clientY;
},{passive:true});
function swEnd(e){ if(e.pointerId!==swipe.id) return; swipe.id=-1;
  keys.L=keys.R=keys.U=keys.D=0; syncDir(); }
cv.addEventListener('pointerup',swEnd); cv.addEventListener('pointercancel',swEnd);

/* ==================================================================
   レイアウト
   ================================================================== */
var VW=0,VH=0,fx=0,fy=0,fw=0,fh=0,cs=1;
function resize(){
  var dpr=Math.min(2,window.devicePixelRatio||1);
  var w=window.innerWidth, h=window.innerHeight;
  VW=w; VH=h;
  cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr);
  cv.style.width=w+'px'; cv.style.height=h+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  var topPad=Math.min(72,h*0.11)+6;
  var botPad=touchMode? (w>h?100:(h>620?150:112)) : 22;
  var availW=w-14;
  var availH=Math.max(h*0.5,h-topPad-botPad);
  fw=Math.min(availW,availH*4/3); fh=fw*0.75;
  fx=Math.round((w-fw)/2);
  fy=Math.round(topPad+(availH-fh)/2);
  cs=fw/GW;
  elCtrl.classList.toggle('on',touchMode);
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){ setTimeout(resize,120); });

/* ==================================================================
   更新
   ================================================================== */
var hudAcc=0, lastBeep=99;
function update(dt){
  if(shake>0) shake=Math.max(0,shake-dt*1.7);
  if(flashT>0) flashT=Math.max(0,flashT-dt);
  stepParts(dt);
  if(state==='play'){
    timeLeft-=dt;
    if(player.inv>0) player.inv-=dt;
    stepPlayer(dt);
    if(state==='play') stepFoes(dt);
    if(state==='play') stepSparks(dt);
    if(state==='play'&&timeLeft<=0) timeUp();
    hudAcc+=dt; if(hudAcc>0.18){ hudAcc=0; updateHud(); }
    var tl=Math.ceil(timeLeft);
    if(tl<=10&&tl>0&&tl!==lastBeep){ lastBeep=tl; SFX.warn(); }
  }else if(state==='die'){
    dieT+=dt;
    stepFoes(dt); stepSparks(dt);
    if(dieT>1.25){ if(lives<=0) gameOver(); else respawn(); }
  }else if(state==='clear'){
    clearT+=dt;
    if(clearCells&&clearI<clearCells.length){
      var n=Math.ceil(clearCells.length*dt/0.85)+6;
      for(var i=0;i<n&&clearI<clearCells.length;i++,clearI++) grid[clearCells[clearI]]=FILL;
      rebuildMask(); rebuildReveal();
      if(clearI>=clearCells.length){ buildOutline(); recount(); updateHud(); }
    }else if(clearT>1.9&&!elOvc.classList.contains('on')){
      stageResult();
    }
  }
}

/* ==================================================================
   描画
   ================================================================== */
function SX(gx){ return fx+gx*cs; }
function SY(gy){ return fy+gy*cs; }

function drawBack(){
  var g=ctx.createLinearGradient(0,0,0,VH);
  g.addColorStop(0,'#0c1128'); g.addColorStop(.55,'#161d3c'); g.addColorStop(1,'#070a16');
  ctx.fillStyle=g; ctx.fillRect(0,0,VW,VH);
  ctx.save(); ctx.globalAlpha=.045; ctx.strokeStyle='#8fc7ff'; ctx.lineWidth=2;
  var t=(perfNow()*14)%44;
  for(var x=-VH+t;x<VW;x+=44){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x+VH,VH); ctx.stroke(); }
  ctx.restore();
}
function drawFrame(){
  var t=BW*cs;
  ctx.save();
  ctx.beginPath(); ctx.rect(fx-4,fy-4,fw+8,fh+8);
  ctx.rect(fx+t,fy+t,fw-2*t,fh-2*t);
  var g=ctx.createLinearGradient(fx,fy,fx+fw,fy+fh);
  g.addColorStop(0,'#6d7cb8'); g.addColorStop(.28,'#2b3358'); g.addColorStop(.5,'#8b9ad4');
  g.addColorStop(.72,'#2b3358'); g.addColorStop(1,'#6d7cb8');
  ctx.fillStyle=g; ctx.fill('evenodd');
  // レール溝
  ctx.beginPath(); ctx.rect(fx+cs*0.9,fy+cs*0.9,fw-cs*1.8,fh-cs*1.8);
  ctx.rect(fx+t,fy+t,fw-2*t,fh-2*t);
  ctx.fillStyle='rgba(8,11,22,.5)'; ctx.fill('evenodd');
  ctx.strokeStyle='rgba(255,255,255,.4)'; ctx.lineWidth=2;
  ctx.strokeRect(fx+t,fy+t,fw-2*t,fh-2*t);
  ctx.strokeStyle='#080b16'; ctx.lineWidth=4;
  ctx.strokeRect(fx-4,fy-4,fw+8,fh+8);
  // リベット
  ctx.fillStyle='rgba(255,255,255,.5)';
  var rr=Math.max(1.4,cs*0.36);
  for(var i=0;i<=8;i++){
    var px=fx+fw*i/8, py=fy+fh*i/8;
    ctx.beginPath(); ctx.arc(px,fy+cs*0.5,rr,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(px,fy+fh-cs*0.5,rr,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(fx+cs*0.5,py,rr,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(fx+fw-cs*0.5,py,rr,0,7); ctx.fill();
  }
  ctx.restore();
}
function drawTrail(){
  if(!trail.length) return;
  var pts=[],i,c,x,y,n;
  for(i=0;i<trail.length;i++){
    c=trail[i]; x=c%GW; y=(c/GW)|0; n=pts.length;
    if(n>=2){ var a=pts[n-2], b=pts[n-1];
      if((b[0]-a[0])===(x-b[0])&&(b[1]-a[1])===(y-b[1])){ pts[n-1]=[x,y]; continue; } }
    pts.push([x,y]);
  }
  pts.push([player.x+player.dx*player.sub,player.y+player.dy*player.sub]);
  ctx.save(); ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.beginPath();
  ctx.moveTo(SX(pts[0][0]+0.5),SY(pts[0][1]+0.5));
  for(i=1;i<pts.length;i++) ctx.lineTo(SX(pts[i][0]+0.5),SY(pts[i][1]+0.5));
  ctx.strokeStyle='rgba(6,9,20,.9)'; ctx.lineWidth=cs*2.0; ctx.stroke();
  ctx.shadowColor='#3fe0ff'; ctx.shadowBlur=Math.max(6,cs*2.4);
  ctx.strokeStyle='#3fe0ff'; ctx.lineWidth=cs*1.15; ctx.stroke();
  ctx.shadowBlur=0;
  ctx.strokeStyle='rgba(255,255,255,.95)'; ctx.lineWidth=cs*0.4; ctx.stroke();
  ctx.restore();
  // 導火線
  if(fuse.on){
    var k=Math.min(trail.length-1,Math.floor(fuse.pos));
    var fc=trail[k], fxx=SX(fc%GW+0.5), fyy=SY(((fc/GW)|0)+0.5);
    ctx.save();
    ctx.shadowColor='#ff8a1a'; ctx.shadowBlur=cs*4;
    var pr=cs*(1.5+Math.sin(perfNow()*22)*0.35);
    var gg=ctx.createRadialGradient(fxx,fyy,0,fxx,fyy,pr*1.6);
    gg.addColorStop(0,'#fff6c0'); gg.addColorStop(.45,'#ffb62e'); gg.addColorStop(1,'rgba(255,90,20,0)');
    ctx.fillStyle=gg; ctx.beginPath(); ctx.arc(fxx,fyy,pr*1.6,0,7); ctx.fill();
    ctx.restore();
    if(Math.random()<0.5) burst(fc%GW+0.5,((fc/GW)|0)+0.5,1,'#ffb62e');
  }
}
function drawFoes(){
  for(var i=0;i<foes.length;i++){
    var f=foes[i], x=SX(f.x), y=SY(f.y), r=f.r*cs;
    ctx.save();
    ctx.translate(x,y);
    // 影
    ctx.fillStyle='rgba(0,0,0,.3)'; ctx.beginPath(); ctx.arc(r*0.16,r*0.2,r,0,7); ctx.fill();
    if(f.kind==='star'){
      ctx.rotate(f.spin);
      ctx.shadowColor='hsl('+f.hue+',100%,60%)'; ctx.shadowBlur=cs*3;
      ctx.beginPath();
      for(var p=0;p<10;p++){
        var rad=(p%2? r*0.46:r*1.28), a=p*0.6283-1.5708;
        var px=Math.cos(a)*rad, py=Math.sin(a)*rad;
        if(p===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
      }
      ctx.closePath();
      var sg=ctx.createRadialGradient(0,0,0,0,0,r*1.3);
      sg.addColorStop(0,'#fff'); sg.addColorStop(.5,'hsl('+f.hue+',100%,66%)'); sg.addColorStop(1,'hsl('+f.hue+',90%,42%)');
      ctx.fillStyle=sg; ctx.fill();
      ctx.lineWidth=Math.max(1.4,cs*0.3); ctx.strokeStyle='#0a0d18'; ctx.stroke();
    }else{
      var big=f.kind==='boss';
      // とげ
      ctx.rotate(f.spin*(big?0.5:1));
      ctx.fillStyle=big?'#ff3d6e':'hsl('+f.hue+',85%,52%)';
      var sp=big?10:8;
      for(var q=0;q<sp;q++){
        var aa=q/sp*6.283;
        ctx.beginPath();
        ctx.moveTo(Math.cos(aa-0.24)*r*0.9,Math.sin(aa-0.24)*r*0.9);
        ctx.lineTo(Math.cos(aa)*r*1.46,Math.sin(aa)*r*1.46);
        ctx.lineTo(Math.cos(aa+0.24)*r*0.9,Math.sin(aa+0.24)*r*0.9);
        ctx.closePath(); ctx.fill();
      }
      ctx.rotate(-f.spin*(big?0.5:1));
      var bg2=ctx.createRadialGradient(-r*0.3,-r*0.35,r*0.1,0,0,r*1.1);
      bg2.addColorStop(0,'#fff'); bg2.addColorStop(.35,big?'#ff8aa8':'hsl('+f.hue+',95%,72%)');
      bg2.addColorStop(1,big?'#a11038':'hsl('+f.hue+',85%,38%)');
      ctx.fillStyle=bg2; ctx.beginPath(); ctx.arc(0,0,r,0,7); ctx.fill();
      ctx.lineWidth=Math.max(1.6,cs*0.34); ctx.strokeStyle='#0a0d18'; ctx.stroke();
      // 目
      var ang=Math.atan2(f.vy,f.vx), ox=Math.cos(ang)*r*0.16, oy=Math.sin(ang)*r*0.16;
      ctx.fillStyle='#fff';
      ctx.beginPath(); ctx.ellipse(-r*0.32+ox,-r*0.08+oy,r*0.26,r*0.3,0,0,7); ctx.fill();
      ctx.beginPath(); ctx.ellipse(r*0.32+ox,-r*0.08+oy,r*0.26,r*0.3,0,0,7); ctx.fill();
      ctx.fillStyle='#0a0d18';
      ctx.beginPath(); ctx.arc(-r*0.3+ox*2,-r*0.05+oy*2,r*0.14,0,7); ctx.fill();
      ctx.beginPath(); ctx.arc(r*0.34+ox*2,-r*0.05+oy*2,r*0.14,0,7); ctx.fill();
      ctx.strokeStyle='#0a0d18'; ctx.lineWidth=Math.max(1.2,cs*0.2);
      ctx.beginPath(); ctx.moveTo(-r*0.56,-r*0.42); ctx.lineTo(-r*0.12,-r*0.24); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(r*0.56,-r*0.42); ctx.lineTo(r*0.12,-r*0.24); ctx.stroke();
    }
    ctx.restore();
  }
}
function drawSparks(){
  for(var i=0;i<sparks.length;i++){
    var s=sparks[i];
    var x=SX(s.x+s.dx*s.sub+0.5), y=SY(s.y+s.dy*s.sub+0.5), r=cs*1.9;
    ctx.save(); ctx.translate(x,y);
    ctx.shadowColor='#ffe14d'; ctx.shadowBlur=cs*3.4;
    var g=ctx.createRadialGradient(0,0,0,0,0,r*1.3);
    g.addColorStop(0,'#ffffff'); g.addColorStop(.4,'#ffe14d'); g.addColorStop(1,'rgba(255,140,20,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,r*1.3,0,7); ctx.fill();
    ctx.shadowBlur=0;
    ctx.strokeStyle='#fff8d0'; ctx.lineWidth=Math.max(1.2,cs*0.28); ctx.lineCap='round';
    for(var k=0;k<4;k++){
      var a=s.t*0.5+k*1.57;
      ctx.beginPath(); ctx.moveTo(0,0);
      ctx.lineTo(Math.cos(a)*r*0.8,Math.sin(a)*r*0.8);
      ctx.lineTo(Math.cos(a+0.5)*r*1.5,Math.sin(a+0.5)*r*1.5);
      ctx.stroke();
    }
    ctx.restore();
  }
}
function drawPlayer(){
  if(state==='die'||state==='clear') return;
  var px=SX(player.x+player.dx*player.sub+0.5), py=SY(player.y+player.dy*player.sub+0.5);
  var r=Math.max(5,cs*2.0);
  ctx.save();
  if(player.inv>0&&((perfNow()*13)|0)%2===0) ctx.globalAlpha=0.4;
  if(player.drawing){
    var pr=r*(2.1+Math.sin(perfNow()*10)*0.24);
    var ag=ctx.createRadialGradient(px,py,r*0.6,px,py,pr);
    ag.addColorStop(0,'rgba(63,224,255,.32)'); ag.addColorStop(1,'rgba(63,224,255,0)');
    ctx.fillStyle=ag; ctx.beginPath(); ctx.arc(px,py,pr,0,7); ctx.fill();
  }
  ctx.translate(px,py);
  ctx.fillStyle='rgba(0,0,0,.35)';
  ctx.beginPath(); ctx.ellipse(r*0.15,r*0.5,r*0.95,r*0.5,0,0,7); ctx.fill();
  // 体
  var bg=ctx.createLinearGradient(0,-r,0,r);
  bg.addColorStop(0,'#ffffff'); bg.addColorStop(.55,'#ffe6f2'); bg.addColorStop(1,'#ffb3d4');
  ctx.fillStyle=bg;
  ctx.beginPath(); ctx.arc(0,0,r,0,7); ctx.fill();
  ctx.lineWidth=Math.max(1.6,cs*0.36); ctx.strokeStyle='#0a0d18'; ctx.stroke();
  // ぼうし
  ctx.fillStyle=player.drawing?'#3fe0ff':'#ffd23c';
  ctx.beginPath(); ctx.moveTo(-r*0.85,-r*0.5); ctx.lineTo(r*0.85,-r*0.5);
  ctx.quadraticCurveTo(r*0.2,-r*1.9,-r*0.3,-r*1.5); ctx.closePath(); ctx.fill();
  ctx.lineWidth=Math.max(1.2,cs*0.24); ctx.stroke();
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(-r*0.34,-r*1.52,r*0.28,0,7); ctx.fill();
  ctx.strokeStyle='#0a0d18'; ctx.stroke();
  // 目
  var lx=player.dx*r*0.16, ly=player.dy*r*0.16;
  ctx.fillStyle='#0a0d18';
  ctx.beginPath(); ctx.ellipse(-r*0.32+lx,r*0.06+ly,r*0.15,r*0.22,0,0,7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(r*0.32+lx,r*0.06+ly,r*0.15,r*0.22,0,0,7); ctx.fill();
  ctx.fillStyle='rgba(255,120,150,.55)';
  ctx.beginPath(); ctx.arc(-r*0.6,r*0.34,r*0.16,0,7); ctx.fill();
  ctx.beginPath(); ctx.arc(r*0.6,r*0.34,r*0.16,0,7); ctx.fill();
  ctx.restore();
}
function drawParts(){
  for(var i=0;i<parts.length;i++){
    var p=parts[i], a=1-p.t/p.life;
    ctx.globalAlpha=a; ctx.fillStyle=p.c;
    var s=Math.max(1.2,cs*0.8*p.s*a);
    ctx.fillRect(SX(p.x)-s/2,SY(p.y)-s/2,s,s);
  }
  ctx.globalAlpha=1;
}
function draw(){
  ctx.save();
  if(shake>0) ctx.translate((Math.random()-0.5)*shake*16,(Math.random()-0.5)*shake*16);
  drawBack();
  if(state!=='title'&&picCv){
    // 台の影
    ctx.save();
    ctx.shadowColor='rgba(0,0,0,.6)'; ctx.shadowBlur=26; ctx.shadowOffsetY=8;
    ctx.fillStyle='#0a0d18'; ctx.fillRect(fx-4,fy-4,fw+8,fh+8);
    ctx.restore();
    ctx.drawImage(dimCv,fx,fy,fw,fh);
    ctx.drawImage(revCv,fx,fy,fw,fh);
    if(flashT>0&&flCv){
      ctx.save(); ctx.globalCompositeOperation='lighter';
      ctx.globalAlpha=Math.min(1,flashT/0.45)*0.8;
      ctx.imageSmoothingEnabled=false;
      ctx.drawImage(flCv,fx,fy,fw,fh);
      ctx.restore();
    }
    if(outline){
      ctx.save(); ctx.translate(fx,fy); ctx.scale(fw/PW,fh/PH);
      ctx.lineCap='butt';
      ctx.strokeStyle='rgba(8,11,22,.75)'; ctx.lineWidth=4.6*PW/fw; ctx.stroke(outline);
      ctx.strokeStyle='rgba(255,255,255,.9)'; ctx.lineWidth=2*PW/fw; ctx.stroke(outline);
      ctx.restore();
    }
    drawFrame();
    if(state!=='clear'){ drawTrail(); drawFoes(); drawSparks(); }
    drawPlayer();
    drawParts();
  }
  ctx.restore();
}

/* ==================================================================
   メインループ
   ================================================================== */
var lastT=0;
function frame(t){
  if(!lastT) lastT=t;
  var dt=(t-lastT)/1000; lastT=t;
  if(!(dt>=0)) dt=0;
  if(dt>0.05) dt=0.05;
  update(dt); draw();
  requestAnimationFrame(frame);
}
/* デバッグ用: rAFが止まる環境でも手動で回せる */
window.sim=function(n,fn){ for(var i=0;i<n;i++){ if(fn)fn(i); frame(lastT+16.667); } };
window.PP={get state(){return state;},get pct(){return pct;},get lives(){return lives;},
  get player(){return player;},get foes(){return foes;},get sparks(){return sparks;},
  get trail(){return trail;},grid:grid,startStage:function(i){beginGame(i);},
  stages:STAGES,pic:function(i){ return makePic(STAGES[i]); }};

/* ==================================================================
   初期化
   ================================================================== */
initCanvases();
buildPick();
$('bMute').textContent=muted?'🔇':'🔊';
resize();
requestAnimationFrame(frame);
</script>

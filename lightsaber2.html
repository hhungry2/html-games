<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>LIGHTSABER</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    width:100%;height:100%;overflow:hidden;background:#000;
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Segoe UI",sans-serif;
    color:#cfd6e4;overscroll-behavior:none;touch-action:none;user-select:none;
  }
  body{
    display:flex;flex-direction:column;align-items:center;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }

  /* ===== 背景 ===== */
  #bgGlow{
    position:fixed;inset:0;pointer-events:none;z-index:0;
    background:radial-gradient(ellipse 60% 45% at 50% 45%, var(--c) 0%, transparent 70%);
    opacity:0;transition:opacity .35s ease;mix-blend-mode:screen;
  }

  /* ===== ヘッダ ===== */
  header{
    position:relative;z-index:5;width:100%;padding:10px 14px 4px;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
  }
  h1{font-size:13px;letter-spacing:.34em;font-weight:600;color:#68748c;}
  #colors{display:flex;gap:9px;}
  .sw{
    width:26px;height:26px;border-radius:50%;border:2px solid rgba(255,255,255,.18);
    background:var(--sc);box-shadow:0 0 10px var(--sc);opacity:.5;transition:.2s;
  }
  .sw.on{opacity:1;transform:scale(1.16);border-color:rgba(255,255,255,.85);}

  /* ===== セイバー ===== */
  #stage{
    position:relative;z-index:2;flex:1;width:100%;
    display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
    padding-bottom:8px;
  }
  #saber{
    position:relative;display:flex;flex-direction:column;align-items:center;
    transform-origin:50% 100%;will-change:transform;
  }
  #blade{
    width:22px;height:52vh;border-radius:11px;
    transform:scaleY(0);transform-origin:50% 100%;
    background:linear-gradient(to top, #fff 0%, #fff 76%, var(--c-pale) 93%, var(--c-mid) 100%);
    box-shadow:
      0 0 12px 4px var(--c),
      0 0 34px 10px var(--c),
      0 0 78px 22px var(--c-70),
      0 0 150px 46px var(--c-40);
    opacity:0;
    transition:transform .42s cubic-bezier(.2,.9,.25,1), opacity .12s linear;
    will-change:transform,filter;
  }
  #blade.on{opacity:1;}
  #blade.retract{transition:transform .3s cubic-bezier(.6,0,.9,.4), opacity .12s linear;}

  /* 柄 */
  #hilt{
    width:40px;height:132px;border-radius:7px 7px 9px 9px;margin-top:-4px;
    background:
      linear-gradient(90deg,#0d0f13 0%,#5c626e 18%,#c9cfda 42%,#eef2f7 52%,#a8aeba 68%,#3a3f49 88%,#0b0d10 100%);
    box-shadow:0 8px 26px rgba(0,0,0,.8), inset 0 0 8px rgba(0,0,0,.6);
    position:relative;overflow:hidden;
  }
  #hilt::before{
    content:"";position:absolute;left:0;right:0;top:14px;height:8px;
    background:linear-gradient(90deg,#000,#7d8492,#dfe4ec,#6b7280,#000);
  }
  #hilt::after{
    content:"";position:absolute;left:0;right:0;bottom:22px;height:26px;
    background:repeating-linear-gradient(90deg,#0a0c0f 0 3px,#585e69 3px 6px);
    opacity:.85;
  }
  #led{
    position:absolute;left:50%;top:44px;transform:translateX(-50%);
    width:10px;height:10px;border-radius:50%;background:#3a1010;
    box-shadow:inset 0 0 3px #000;z-index:2;transition:.2s;
  }
  #led.on{background:#ff4d4d;box-shadow:0 0 10px #ff2d2d,0 0 20px #ff2d2d;}

  /* ===== コントロール ===== */
  #panel{
    position:relative;z-index:5;width:100%;max-width:460px;
    padding:10px 18px 16px;display:flex;flex-direction:column;gap:12px;
  }
  #power{
    width:100%;padding:17px 0;border:none;border-radius:15px;
    font-size:16px;font-weight:700;letter-spacing:.16em;color:#e8edf5;
    background:linear-gradient(180deg,#1b2029,#0d1015);
    border:1px solid rgba(255,255,255,.14);
    box-shadow:0 6px 22px rgba(0,0,0,.6);
    transition:.18s;cursor:pointer;
  }
  #power:active{transform:scale(.975);}
  #power.on{
    color:#fff;border-color:var(--c-70);
    background:linear-gradient(180deg, var(--c-25), #0b0e12);
    box-shadow:0 0 22px var(--c-40), 0 6px 22px rgba(0,0,0,.6);
  }
  .row{display:flex;align-items:center;gap:12px;font-size:11px;color:#7b8598;letter-spacing:.06em;}
  .row label{white-space:nowrap;}
  input[type=range]{
    flex:1;-webkit-appearance:none;appearance:none;height:3px;border-radius:2px;
    background:#252b35;outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:20px;height:20px;border-radius:50%;
    background:var(--c);box-shadow:0 0 10px var(--c);
  }
  input[type=range]::-moz-range-thumb{
    width:20px;height:20px;border:none;border-radius:50%;
    background:var(--c);box-shadow:0 0 10px var(--c);
  }
  #meterWrap{height:4px;border-radius:2px;background:#1a1f27;overflow:hidden;}
  #meter{height:100%;width:0%;background:var(--c);box-shadow:0 0 10px var(--c);transition:width .05s linear;}
  #status{
    font-size:10.5px;color:#5b6577;text-align:center;letter-spacing:.05em;line-height:1.5;
  }
  #status b{color:var(--c);font-weight:600;}
</style>
</head>
<body>

<div id="bgGlow"></div>

<header>
  <h1>LIGHTSABER</h1>
  <div id="colors"></div>
</header>

<div id="stage">
  <div id="saber">
    <div id="blade"></div>
    <div id="hilt"><div id="led"></div></div>
  </div>
</div>

<div id="panel">
  <div id="meterWrap"><div id="meter"></div></div>
  <button id="power">IGNITE</button>
  <div class="row">
    <label>感度</label>
    <input id="sens" type="range" min="0" max="100" value="55">
    <label>音量</label>
    <input id="vol" type="range" min="0" max="100" value="80">
  </div>
  <div id="status">起動ボタンを押してください</div>
</div>

<script>
(() => {
'use strict';

/* ========================================================
   カラー
   ======================================================== */
const COLORS = [
  {name:'blue',   c:'#3fa9ff'},
  {name:'green',  c:'#3dff9e'},
  {name:'red',    c:'#ff3b30'},
  {name:'purple', c:'#b06bff'},
];
let colorIdx = 0;
const root = document.documentElement;

const el = {
  blade:   document.getElementById('blade'),
  saber:   document.getElementById('saber'),
  led:     document.getElementById('led'),
  power:   document.getElementById('power'),
  glow:    document.getElementById('bgGlow'),
  status:  document.getElementById('status'),
  meter:   document.getElementById('meter'),
  sens:    document.getElementById('sens'),
  vol:     document.getElementById('vol'),
  colors:  document.getElementById('colors'),
};

function rgb(hex) {
  return [1, 3, 5].map(i => parseInt(hex.substr(i, 2), 16));
}
function applyColor(hex) {
  const [r, g, b] = rgb(hex);
  const mix = (p) => 'rgb(' + [r, g, b].map(v => Math.round(v * p + 255 * (1 - p))).join(',') + ')';
  const a = (v) => 'rgba(' + r + ',' + g + ',' + b + ',' + v + ')';
  root.style.setProperty('--c', hex);
  root.style.setProperty('--c-pale', mix(0.40));
  root.style.setProperty('--c-mid',  mix(0.68));
  root.style.setProperty('--c-70', a(0.70));
  root.style.setProperty('--c-40', a(0.40));
  root.style.setProperty('--c-25', 'rgb(' + [r, g, b].map((v, i) => Math.round(v * 0.26 + [18, 22, 28][i] * 0.74)).join(',') + ')');
}

COLORS.forEach((col, i) => {
  const b = document.createElement('div');
  b.className = 'sw' + (i === 0 ? ' on' : '');
  b.style.setProperty('--sc', col.c);
  b.addEventListener('click', () => {
    colorIdx = i;
    applyColor(col.c);
    [...el.colors.children].forEach((n, j) => n.classList.toggle('on', i === j));
  });
  el.colors.appendChild(b);
});
applyColor(COLORS[0].c);

/* ========================================================
   Web Audio
   ======================================================== */
const AC = window.AudioContext || window.webkitAudioContext;
let ctx = null, master = null, noiseBuf = null;
let hum = null, woosh = null;
let audioReady = false;

function makeNoise(sec = 2) {
  const len = ctx.sampleRate * sec;
  const buf = ctx.createBuffer(1, len, ctx.sampleRate);
  const d = buf.getChannelData(0);
  let last = 0;
  for (let i = 0; i < len; i++) {
    const w = Math.random() * 2 - 1;
    last = (last + 0.02 * w) / 1.02;   // 少しブラウンノイズ寄りに
    d[i] = w * 0.7 + last * 3.0;
  }
  return buf;
}

function initAudio() {
  if (audioReady) return;
  ctx = new AC();
  master = ctx.createGain();
  master.gain.value = 0.8;
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -14;
  comp.ratio.value = 6;
  master.connect(comp);
  comp.connect(ctx.destination);
  noiseBuf = makeNoise();
  buildHum();
  buildWoosh();
  audioReady = true;
}

/* --- 定常ハム音（ブーン） --- */
function buildHum() {
  const g = ctx.createGain(); g.gain.value = 0.0001;

  const lp = ctx.createBiquadFilter();
  lp.type = 'lowpass'; lp.frequency.value = 760; lp.Q.value = 7;

  const o1 = ctx.createOscillator(); o1.type = 'sawtooth'; o1.frequency.value = 62;
  const o2 = ctx.createOscillator(); o2.type = 'sawtooth'; o2.frequency.value = 62.9;
  const o3 = ctx.createOscillator(); o3.type = 'square';   o3.frequency.value = 31;
  const o3g = ctx.createGain(); o3g.gain.value = 0.22;

  // ビブラート（生きている感じ）
  const lfo = ctx.createOscillator(); lfo.frequency.value = 5.4;
  const lfoG = ctx.createGain(); lfoG.gain.value = 2.4;
  lfo.connect(lfoG); lfoG.connect(o1.frequency); lfoG.connect(o2.frequency);

  // 微妙な音量ゆらぎ
  const alfo = ctx.createOscillator(); alfo.frequency.value = 0.83;
  const alfoG = ctx.createGain(); alfoG.gain.value = 0.02;
  alfo.connect(alfoG); alfoG.connect(g.gain);

  o1.connect(lp); o2.connect(lp); o3.connect(o3g); o3g.connect(lp);
  lp.connect(g); g.connect(master);
  [o1, o2, o3, lfo, alfo].forEach(o => o.start());

  hum = {g, lp, o1, o2, o3, base1: 62, base2: 62.9, base3: 31};
}

/* --- 振ったときの風切り音（連続・回転速度に追従） --- */
function buildWoosh() {
  const src = ctx.createBufferSource();
  src.buffer = noiseBuf; src.loop = true;

  const bp = ctx.createBiquadFilter();
  bp.type = 'bandpass'; bp.frequency.value = 400; bp.Q.value = 1.1;

  const hp = ctx.createBiquadFilter();
  hp.type = 'highpass'; hp.frequency.value = 220;

  const g = ctx.createGain(); g.gain.value = 0.0001;

  src.connect(bp); bp.connect(hp); hp.connect(g); g.connect(master);
  src.start();
  woosh = {g, bp};
}

/* --- 起動音 --- */
function sfxIgnite() {
  const t = ctx.currentTime;

  const n = ctx.createBufferSource(); n.buffer = noiseBuf;
  const bp = ctx.createBiquadFilter();
  bp.type = 'bandpass'; bp.Q.value = 0.85;
  bp.frequency.setValueAtTime(160, t);
  bp.frequency.exponentialRampToValueAtTime(2800, t + 0.34);
  bp.frequency.exponentialRampToValueAtTime(900, t + 0.8);
  const ng = ctx.createGain();
  ng.gain.setValueAtTime(0.0001, t);
  ng.gain.exponentialRampToValueAtTime(0.55, t + 0.05);
  ng.gain.exponentialRampToValueAtTime(0.0008, t + 0.85);
  n.connect(bp); bp.connect(ng); ng.connect(master);
  n.start(t); n.stop(t + 0.95);

  const o = ctx.createOscillator(); o.type = 'sawtooth';
  o.frequency.setValueAtTime(38, t);
  o.frequency.exponentialRampToValueAtTime(190, t + 0.32);
  const ol = ctx.createBiquadFilter();
  ol.type = 'lowpass'; ol.frequency.value = 1400; ol.Q.value = 3;
  const og = ctx.createGain();
  og.gain.setValueAtTime(0.0001, t);
  og.gain.exponentialRampToValueAtTime(0.42, t + 0.08);
  og.gain.exponentialRampToValueAtTime(0.001, t + 0.75);
  o.connect(ol); ol.connect(og); og.connect(master);
  o.start(t); o.stop(t + 0.8);
}

/* --- 収納音 --- */
function sfxRetract() {
  const t = ctx.currentTime;

  const n = ctx.createBufferSource(); n.buffer = noiseBuf;
  const bp = ctx.createBiquadFilter();
  bp.type = 'bandpass'; bp.Q.value = 1.0;
  bp.frequency.setValueAtTime(2200, t);
  bp.frequency.exponentialRampToValueAtTime(140, t + 0.42);
  const ng = ctx.createGain();
  ng.gain.setValueAtTime(0.45, t);
  ng.gain.exponentialRampToValueAtTime(0.0008, t + 0.5);
  n.connect(bp); bp.connect(ng); ng.connect(master);
  n.start(t); n.stop(t + 0.55);

  const o = ctx.createOscillator(); o.type = 'sawtooth';
  o.frequency.setValueAtTime(170, t);
  o.frequency.exponentialRampToValueAtTime(30, t + 0.4);
  const og = ctx.createGain();
  og.gain.setValueAtTime(0.32, t);
  og.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
  o.connect(og); og.connect(master);
  o.start(t); o.stop(t + 0.5);
}

/* --- スイング（振り抜き）の効果音 --- */
function sfxSwing(v) {          // v: 0..1
  const t = ctx.currentTime;
  const dur = 0.30 + v * 0.14;

  const n = ctx.createBufferSource();
  n.buffer = noiseBuf;
  n.playbackRate.value = 0.85 + v * 0.5;

  const bp = ctx.createBiquadFilter();
  bp.type = 'bandpass'; bp.Q.value = 2.4;
  bp.frequency.setValueAtTime(480, t);
  bp.frequency.linearRampToValueAtTime(900 + 2000 * v, t + dur * 0.38);
  bp.frequency.exponentialRampToValueAtTime(360, t + dur);

  const g = ctx.createGain();
  const peak = 0.16 + 0.5 * v;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(peak, t + 0.05);
  g.gain.exponentialRampToValueAtTime(0.0008, t + dur);

  n.connect(bp); bp.connect(g); g.connect(master);
  n.start(t); n.stop(t + dur + 0.05);

  // 芯になる金属的な唸り
  const o = ctx.createOscillator(); o.type = 'sawtooth';
  o.frequency.setValueAtTime(150 + 110 * v, t);
  o.frequency.exponentialRampToValueAtTime(70, t + dur);
  const ol = ctx.createBiquadFilter();
  ol.type = 'lowpass'; ol.frequency.value = 1100;
  const og = ctx.createGain();
  og.gain.setValueAtTime(0.0001, t);
  og.gain.exponentialRampToValueAtTime(0.14 + 0.2 * v, t + 0.05);
  og.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(ol); ol.connect(og); og.connect(master);
  o.start(t); o.stop(t + dur + 0.05);
}

/* --- 打ち合い（強い衝撃） --- */
function sfxClash() {
  const t = ctx.currentTime;

  const n = ctx.createBufferSource();
  n.buffer = noiseBuf; n.playbackRate.value = 1.6;
  const hp = ctx.createBiquadFilter();
  hp.type = 'highpass'; hp.frequency.value = 1400;
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.7, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
  n.connect(hp); hp.connect(g); g.connect(master);
  n.start(t); n.stop(t + 0.25);

  [820, 1230, 1870].forEach((f, i) => {
    const o = ctx.createOscillator(); o.type = 'square';
    o.frequency.setValueAtTime(f, t);
    o.frequency.exponentialRampToValueAtTime(f * 0.6, t + 0.18);
    const og = ctx.createGain();
    og.gain.setValueAtTime(0.16 / (i + 1), t);
    og.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
    o.connect(og); og.connect(master);
    o.start(t); o.stop(t + 0.2);
  });
  flash();
}

/* ========================================================
   ON / OFF
   ======================================================== */
let on = false;

function ignite() {
  on = true;
  el.blade.classList.remove('retract');
  el.blade.classList.add('on');
  el.blade.style.transform = 'scaleY(1)';
  el.led.classList.add('on');
  el.power.classList.add('on');
  el.power.textContent = 'RETRACT';
  el.glow.style.opacity = '0.30';
  sfxIgnite();
  hum.g.gain.cancelScheduledValues(ctx.currentTime);
  hum.g.gain.setTargetAtTime(0.16, ctx.currentTime + 0.18, 0.14);
  vib([12, 40, 70]);
}

function retract() {
  on = false;
  el.blade.classList.add('retract');
  el.blade.style.transform = 'scaleY(0)';
  el.led.classList.remove('on');
  el.power.classList.remove('on');
  el.power.textContent = 'IGNITE';
  el.glow.style.opacity = '0';
  sfxRetract();
  hum.g.gain.cancelScheduledValues(ctx.currentTime);
  hum.g.gain.setTargetAtTime(0.0001, ctx.currentTime, 0.12);
  woosh.g.gain.setTargetAtTime(0.0001, ctx.currentTime, 0.08);
  setTimeout(() => { if (!on) el.blade.classList.remove('on'); }, 320);
  vib(30);
}

function flash() {
  el.glow.style.opacity = '0.85';
  el.blade.style.filter = 'brightness(1.9)';
  setTimeout(() => {
    el.glow.style.opacity = on ? '0.30' : '0';
    el.blade.style.filter = '';
  }, 90);
}

function vib(p) { if (navigator.vibrate) { try { navigator.vibrate(p); } catch (e) {} } }

/* ========================================================
   センサー
   ======================================================== */
let sensorOn = false;
let rawSpeed = 0;      // deg/s
let speed = 0;         // 平滑化
let lastAcc = null;
let lastSwing = 0, lastClash = 0;
let motionSeen = false, motionNoticed = false;

async function requestSensor() {
  if (sensorOn) return;
  const D = window.DeviceMotionEvent;
  if (!D) { setStatus('この端末はモーションセンサー非対応（画面スワイプで代用できます）'); return; }

  if (typeof D.requestPermission === 'function') {
    try {
      const res = await D.requestPermission();
      if (res !== 'granted') { setStatus('センサーが許可されませんでした。画面スワイプで代用できます'); return; }
    } catch (e) {
      setStatus('センサー許可に失敗（HTTPS で開いてください）。スワイプで代用できます');
      return;
    }
  }
  window.addEventListener('devicemotion', onMotion, {passive:true});
  sensorOn = true;
  setStatus('セイバーを振ってください');
  setTimeout(() => {
    if (!motionSeen) setStatus('センサー反応なし。画面をスワイプしても音が出ます');
  }, 2500);
}

function onMotion(e) {
  const r = e.rotationRate;
  let mag = 0;
  if (r && (r.alpha || r.beta || r.gamma)) {
    mag = Math.hypot(r.alpha || 0, r.beta || 0, r.gamma || 0);   // deg/s
    motionSeen = true;
  }

  // rotationRate が無い端末は加速度の変化量から擬似的に算出
  const a = e.accelerationIncludingGravity;
  if (a && (a.x !== null)) {
    motionSeen = true;
    if (lastAcc) {
      const d = Math.hypot(a.x - lastAcc.x, a.y - lastAcc.y, a.z - lastAcc.z);
      if (mag === 0) mag = d * 22;
    }
    lastAcc = {x:a.x || 0, y:a.y || 0, z:a.z || 0};
  }

  if (motionSeen && !motionNoticed) { motionNoticed = true; setStatus('セイバーを振ってください'); }

  if (mag > rawSpeed) rawSpeed = mag; else rawSpeed = rawSpeed * 0.7 + mag * 0.3;

  // 衝撃 → クラッシュ音
  const la = e.acceleration;
  if (on && la && la.x !== null) {
    const am = Math.hypot(la.x || 0, la.y || 0, la.z || 0);
    const now = performance.now();
    if (am > 32 && now - lastClash > 420) {
      lastClash = now; lastSwing = now;
      sfxClash(); vib([0, 25, 30, 25]);
    }
  }
}

/* --- PC / センサー無し端末用：画面スワイプ --- */
let ptr = null;
function onPtrDown(e) { ptr = {x:e.clientX, y:e.clientY, t:performance.now()}; }
function onPtrMove(e) {
  if (!ptr) return;
  const now = performance.now();
  const dt = Math.max(now - ptr.t, 8);
  const d = Math.hypot(e.clientX - ptr.x, e.clientY - ptr.y);
  const v = d / dt * 1000;              // px/s
  rawSpeed = Math.max(rawSpeed, v * 0.55);
  ptr = {x:e.clientX, y:e.clientY, t:now};
}
function onPtrUp() { ptr = null; }
document.addEventListener('pointerdown', onPtrDown);
document.addEventListener('pointermove', onPtrMove);
document.addEventListener('pointerup', onPtrUp);
document.addEventListener('pointercancel', onPtrUp);

/* ========================================================
   メインループ
   ======================================================== */
function threshold() {
  // 感度スライダー: 0 → 鈍い(900deg/s で最大) / 100 → 敏感(220deg/s で最大)
  const s = +el.sens.value / 100;
  return 900 - s * 680;
}

function loop() {
  requestAnimationFrame(loop);

  speed += (rawSpeed - speed) * 0.30;
  rawSpeed *= 0.86;

  const t = Math.min(speed / threshold(), 1);
  el.meter.style.width = (t * 100).toFixed(1) + '%';

  if (!audioReady) return;

  if (on) {
    // 連続的な風切り音
    const target = t * t * 0.42;
    woosh.g.gain.setTargetAtTime(Math.max(target, 0.0001), ctx.currentTime, 0.045);
    woosh.bp.frequency.setTargetAtTime(360 + t * 1500, ctx.currentTime, 0.05);

    // ハム音のピッチも少し上がる
    const m = 1 + t * 0.30;
    hum.o1.frequency.setTargetAtTime(hum.base1 * m, ctx.currentTime, 0.06);
    hum.o2.frequency.setTargetAtTime(hum.base2 * m, ctx.currentTime, 0.06);
    hum.o3.frequency.setTargetAtTime(hum.base3 * m, ctx.currentTime, 0.06);
    hum.lp.frequency.setTargetAtTime(760 + t * 900, ctx.currentTime, 0.06);

    // 振り抜きの単発音
    const now = performance.now();
    if (t > 0.42 && now - lastSwing > 190) {
      lastSwing = now;
      sfxSwing(t);
      vib(Math.round(10 + t * 22));
    }

    // 刀身の揺らぎ
    el.blade.style.filter = 'brightness(' + (1 + t * 0.5).toFixed(2) + ')';
    el.glow.style.opacity = (0.30 + t * 0.4).toFixed(2);
  } else {
    woosh.g.gain.setTargetAtTime(0.0001, ctx.currentTime, 0.08);
  }
}
requestAnimationFrame(loop);

/* ========================================================
   UI イベント
   ======================================================== */
function setStatus(s) { el.status.innerHTML = s; }

el.power.addEventListener('click', async () => {
  initAudio();
  if (ctx.state === 'suspended') await ctx.resume();
  if (!sensorOn) await requestSensor();
  on ? retract() : ignite();
});

el.vol.addEventListener('input', () => {
  if (master) master.gain.value = (+el.vol.value / 100) * 0.9;
});

document.addEventListener('visibilitychange', () => {
  if (document.hidden && on) retract();
});

// 端末を傾けると柄も少し傾く（雰囲気づけ）
window.addEventListener('deviceorientation', (e) => {
  if (e.gamma == null) return;
  const g = Math.max(-30, Math.min(30, e.gamma));
  el.saber.style.transform = 'rotate(' + (g * 0.35).toFixed(1) + 'deg)';
}, {passive:true});

setStatus('<b>IGNITE</b> を押すと起動音が鳴ります');
})();
</script>

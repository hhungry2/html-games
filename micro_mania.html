<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>MICRO MANIA｜メイドインワリオ風 プチゲーム集</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:#0d0d16;overflow:hidden;touch-action:none;
  -webkit-user-select:none;user-select:none;
  font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;color:#fff;}
#app{height:100dvh;display:flex;flex-direction:column;}
#screen{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px;}
canvas{display:block;border-radius:10px;background:#000;
  box-shadow:0 6px 24px rgba(0,0,0,.6),0 0 0 3px #2b2b44;}
/* たて画面（スマホ）は 画面を 上に よせて 十字キーとの あいだを あける */
@media (orientation:portrait){body.touch #screen{align-items:flex-start;}}
/* よこ画面（スマホ）は 十字キーと Ａボタンを 画面の 左右下に かさねる */
@media (orientation:landscape){
  body.touch #pad{position:fixed;left:0;right:0;bottom:0;padding:0;pointer-events:none;}
  body.touch .dpad{position:absolute;left:8px;bottom:8px;pointer-events:auto;opacity:.9;
    width:126px;height:126px;}
  body.touch .dpad button{width:42px;height:42px;}
  body.touch .dpad .u{left:42px;top:0}body.touch .dpad .d{left:42px;top:84px}
  body.touch .dpad .l{left:0;top:42px}body.touch .dpad .r{left:84px;top:42px}
  body.touch .dpad .c{left:42px;top:42px}
  body.touch #abtn{position:absolute;right:14px;bottom:16px;pointer-events:auto;opacity:.9;
    width:96px;height:96px;font-size:32px;}
}
#pad{display:none;flex:0 0 auto;padding:4px 12px 16px;justify-content:space-between;align-items:flex-end;gap:8px;}
body.touch #pad{display:flex;}
.dpad{position:relative;width:144px;height:144px;flex:0 0 auto;}
.dpad button{position:absolute;width:48px;height:48px;background:#39395a;border:2px solid #5a5a88;
  color:#cfd0ff;font-size:18px;border-radius:10px;line-height:1;}
.dpad .u{left:48px;top:0}.dpad .d{left:48px;top:96px}.dpad .l{left:0;top:48px}.dpad .r{left:96px;top:48px}
.dpad .c{left:48px;top:48px;background:#2b2b44;border-color:#44446a;pointer-events:none}
#abtn{flex:0 0 auto;width:112px;height:112px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#ff8f8f,#c62828);
  border:3px solid #ffb0b0;color:#fff;font-size:36px;font-weight:bold;box-shadow:0 5px 0 #7d1414;}
button{font-family:inherit;-webkit-user-select:none;user-select:none;}
button:active{filter:brightness(1.35);}
#abtn:active{transform:translateY(3px);box-shadow:0 2px 0 #7d1414;}
</style>
</head>
<body>
<div id="app">
  <div id="screen"><canvas id="cv" width="480" height="360"></canvas></div>
  <div id="pad">
    <div class="dpad">
      <button class="u" data-k="u">▲</button>
      <button class="l" data-k="l">◀</button>
      <button class="c"></button>
      <button class="r" data-k="r">▶</button>
      <button class="d" data-k="d">▼</button>
    </div>
    <button id="abtn" data-k="a">A</button>
  </div>
</div>
<script>
(function(){
'use strict';

/* =======================================================================
   MICRO MANIA  ―  メイドインワリオ風 プチゲーム集
   ・数秒で終わる「プチゲーム」を、命令文だけを頼りに次々あそぶ
   ・操作は十字キーと A ボタンのみ
   ======================================================================= */

var W=480,H=360;
var cv=document.getElementById('cv'), c=cv.getContext('2d');

/* ---------------- ちいさな道具 ---------------- */
function rnd(a,b){return a+Math.random()*(b-a);}
function rndi(a,b){return Math.floor(a+Math.random()*(b-a+1));}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function hit(ax,ay,aw,ah,bx,by,bw,bh){return ax<bx+bw&&ax+aw>bx&&ay<by+bh&&ay+ah>by;}
function dist(x1,y1,x2,y2){var dx=x1-x2,dy=y1-y2;return Math.sqrt(dx*dx+dy*dy);}

function bg(col){c.fillStyle=col;c.fillRect(0,0,W,H);}
function rect(x,y,w,h,col){c.fillStyle=col;c.fillRect(x,y,w,h);}
function rrect(x,y,w,h,r,col){
  r=Math.min(r,w/2,h/2);
  c.beginPath();
  c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();
  if(col){c.fillStyle=col;c.fill();}
}
function circ(x,y,r,col){c.beginPath();c.arc(x,y,r,0,6.2832);if(col){c.fillStyle=col;c.fill();}}
function ellip(x,y,rx,ry,col,rot){c.beginPath();c.ellipse(x,y,rx,ry,rot||0,0,6.2832);if(col){c.fillStyle=col;c.fill();}}
function line(x1,y1,x2,y2,col,w){c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.strokeStyle=col;c.lineWidth=w||2;c.stroke();}
function poly(pts,col){c.beginPath();c.moveTo(pts[0],pts[1]);for(var i=2;i<pts.length;i+=2)c.lineTo(pts[i],pts[i+1]);c.closePath();if(col){c.fillStyle=col;c.fill();}}
function txt(s,x,y,size,col,align,weight){
  c.font=(weight||'bold')+' '+size+'px "Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif';
  c.textAlign=align||'center';c.textBaseline='middle';c.fillStyle=col||'#fff';c.fillText(s,x,y);
}
function otxt(s,x,y,size,col,ocol,align,ow){
  c.font='bold '+size+'px "Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif';
  c.textAlign=align||'center';c.textBaseline='middle';
  c.lineWidth=ow||Math.max(3,size*0.16);c.lineJoin='round';c.strokeStyle=ocol||'#000';
  c.strokeText(s,x,y);c.fillStyle=col||'#fff';c.fillText(s,x,y);
}
/* 汎用の人型（多くのプチゲームで使う） */
function guy(x,y,s,col,pose){
  pose=pose||0; // 0:立ち 1:走りA 2:走りB 3:バンザイ 4:しゃがみ
  var sk='#ffd9a8';
  c.save();c.translate(x,y);c.scale(s,s);
  var legA=pose===1?-0.5:(pose===2?0.5:0.15);
  line(-4,0,-4+legA*10,14,'#2b3a55',5);
  line(4,0,4-legA*10,14,'#2b3a55',5);
  rrect(-8,-18,16,20,5,col);
  var armA=pose===3?-1.2:(pose===1?0.7:(pose===2?-0.7:0.2));
  line(-7,-14,-7-8*Math.cos(armA),-14+10*Math.sin(armA)+(pose===3?-6:6),sk,5);
  line(7,-14,7+8*Math.cos(armA),-14-10*Math.sin(armA)+(pose===3?-6:6),sk,5);
  circ(0,-26,10,sk);
  circ(-3.5,-27,1.8,'#222');circ(3.5,-27,1.8,'#222');
  c.restore();
}

/* ---------------- 入力（十字キー＋A） ---------------- */
var IN={l:0,r:0,u:0,d:0,a:0,pl:0,pr:0,pu:0,pd:0,pa:0,taps:0};
function press(k){
  if(!IN[k]){IN['p'+k]=1;if(k==='a')IN.taps++;}
  IN[k]=1;Snd.init();
}
function release(k){IN[k]=0;}
function clearEdges(){IN.pl=IN.pr=IN.pu=IN.pd=IN.pa=0;IN.taps=0;}
var KMAP={ArrowLeft:'l',ArrowRight:'r',ArrowUp:'u',ArrowDown:'d',
  KeyA:'l',KeyD:'r',KeyW:'u',KeyS:'d',KeyZ:'a',KeyX:'a',KeyJ:'a',Space:'a',Enter:'a'};
addEventListener('keydown',function(e){
  var k=KMAP[e.code];if(k){e.preventDefault();press(k);}
  if(e.code==='KeyM'){Snd.toggle();}
},{passive:false});
addEventListener('keyup',function(e){var k=KMAP[e.code];if(k){e.preventDefault();release(k);}},{passive:false});

if('ontouchstart' in window||navigator.maxTouchPoints>0)document.body.classList.add('touch');
/* 画面いっぱいに キャンバスを ひろげる（4:3を たもつ） */
function fitCanvas(){
  var box=document.getElementById('screen').getBoundingClientRect();
  var s=Math.min((box.width-16)/W,(box.height-16)/H);
  if(!(s>0))s=1;
  cv.style.width=Math.floor(W*s)+'px';
  cv.style.height=Math.floor(H*s)+'px';
}
addEventListener('resize',fitCanvas);
addEventListener('orientationchange',function(){setTimeout(fitCanvas,150);});
if(window.visualViewport)visualViewport.addEventListener('resize',fitCanvas);
fitCanvas();
Array.prototype.forEach.call(document.querySelectorAll('[data-k]'),function(b){
  var k=b.getAttribute('data-k');
  b.addEventListener('pointerdown',function(e){e.preventDefault();b.setPointerCapture(e.pointerId);press(k);});
  b.addEventListener('pointerup',function(e){e.preventDefault();release(k);});
  b.addEventListener('pointercancel',function(e){release(k);});
  b.addEventListener('contextmenu',function(e){e.preventDefault();});
});
/* 画面タップ：メニューでは決定、右上はミュート */
cv.addEventListener('pointerdown',function(e){
  e.preventDefault();Snd.init();
  var r=cv.getBoundingClientRect();
  var x=(e.clientX-r.left)/r.width*W, y=(e.clientY-r.top)/r.height*H;
  if(x>W-40&&y<34){Snd.toggle();return;}
  if(G.state==='title'||G.state==='select'||G.state==='howto'||G.state==='over'||G.state==='clear'){
    press('a');setTimeout(function(){release('a');},80);
  }
});

/* ---------------- 音（Web Audio で合成） ---------------- */
var Snd={
  ac:null,mg:null,muted:/[?&]mute/.test(location.search),
  bpm:150,next:0,step:0,on:false,
  init:function(){
    if(this.ac){if(this.ac.state==='suspended')this.ac.resume();return;}
    var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    this.ac=new AC();this.mg=this.ac.createGain();
    this.mg.gain.value=this.muted?0:0.35;this.mg.connect(this.ac.destination);
    this.next=this.ac.currentTime+0.05;
  },
  toggle:function(){this.muted=!this.muted;if(this.mg)this.mg.gain.value=this.muted?0:0.35;},
  tone:function(f,t,dur,type,vol,f2){
    if(!this.ac||this.muted)return;
    var o=this.ac.createOscillator(),g=this.ac.createGain();
    o.type=type||'square';o.frequency.setValueAtTime(f,t);
    if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+dur);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol||0.2,t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(this.mg);o.start(t);o.stop(t+dur+0.02);
  },
  noise:function(t,dur,vol,hp){
    if(!this.ac||this.muted)return;
    var n=Math.floor(this.ac.sampleRate*dur),b=this.ac.createBuffer(1,n,this.ac.sampleRate),d=b.getChannelData(0);
    for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
    var s=this.ac.createBufferSource();s.buffer=b;
    var f=this.ac.createBiquadFilter();f.type=hp?'highpass':'lowpass';f.frequency.value=hp||1200;
    var g=this.ac.createGain();g.gain.value=vol||0.2;
    s.connect(f);f.connect(g);g.connect(this.mg);s.start(t);
  },
  /* 効果音 */
  se:function(name){
    if(!this.ac)return;var t=this.ac.currentTime;
    if(name==='ok'){[523,659,784,1046].forEach(function(f,i){Snd.tone(f,t+i*0.05,0.16,'square',0.22);});}
    else if(name==='miss'){this.tone(220,t,0.35,'sawtooth',0.22,70);this.noise(t,0.2,0.12);}
    else if(name==='blip'){this.tone(880,t,0.06,'square',0.16);}
    else if(name==='sel'){this.tone(660,t,0.07,'square',0.18);this.tone(990,t+0.06,0.09,'square',0.16);}
    else if(name==='hit'){this.noise(t,0.12,0.28,900);this.tone(160,t,0.12,'square',0.2,60);}
    else if(name==='jump'){this.tone(420,t,0.14,'square',0.18,760);}
    else if(name==='coin'){this.tone(988,t,0.07,'square',0.18);this.tone(1319,t+0.06,0.14,'square',0.16);}
    else if(name==='swish'){this.noise(t,0.14,0.16,2500);}
    else if(name==='speed'){[392,523,659,784,1046,1319].forEach(function(f,i){Snd.tone(f,t+i*0.07,0.2,'square',0.22);});}
    else if(name==='boss'){[110,110,131,147].forEach(function(f,i){Snd.tone(f,t+i*0.14,0.3,'sawtooth',0.2);});}
    else if(name==='fanfare'){[523,523,523,659,587,659,784].forEach(function(f,i){Snd.tone(f,t+i*0.12,0.28,'square',0.22);});}
    else if(name==='over'){[392,349,311,262,196].forEach(function(f,i){Snd.tone(f,t+i*0.16,0.4,'triangle',0.22);});}
  },
  /* BGM（16分でスケジュール） */
  BASS:[0,0,7,0, 0,0,7,0, -3,-3,4,-3, -3,-3,4,-3, -5,-5,2,-5, -5,-5,2,-5, -7,-7,0,-7, -7,0,2,4],
  LEAD:[12,-1,14,16, -1,16,14,12, -1,-1,9,-1, 12,-1,-1,-1,
        9,-1,11,12, -1,12,11,9, -1,-1,7,-1, 9,-1,-1,-1,
        7,-1,9,11, -1,11,9,7, -1,-1,4,-1, 7,-1,-1,-1,
        5,-1,7,9, -1,9,7,5, -1,4,-1,7, -1,-1,-1,-1],
  tick:function(tempo,active){
    if(!this.ac||this.muted)return;
    var spb=60/(tempo*4);
    var now=this.ac.currentTime;
    if(this.next<now)this.next=now+0.02;
    while(this.next<now+0.2){
      var s=this.step%64,t=this.next;
      if(active){
        if(s%8===0)this.tone(70,t,0.16,'sine',0.4,40);
        if(s%8===4){this.noise(t,0.12,0.2,1800);}
        if(s%2===0)this.noise(t,0.03,0.05,6000);
        var b=this.BASS[s%32];
        this.tone(110*Math.pow(2,b/12),t,0.1,'square',0.13);
        var l=this.LEAD[s];
        if(l>=0)this.tone(440*Math.pow(2,l/12),t,0.09,'square',0.09);
      }
      this.next+=spb;this.step++;
    }
  }
};

/* ---------------- プチゲームの登録 ---------------- */
var GAMES=[],GBY={};
function MG(o){GAMES.push(o);GBY[o.id]=o;}

/* ---------------- ゲーム全体の状態 ---------------- */
var STAGES=[
  {id:'sports',name:'スポーツの ジン',cat:'sports',col:'#2196f3',col2:'#0d47a1',face:'jin',
   desc:'あせと なみだの スポーツ プチゲーム!',boss:'boss_rush'},
  {id:'action',name:'アクションの モモ',cat:'action',col:'#e91e63',col2:'#880e4f',face:'momo',
   desc:'ドキドキ! はんしゃしんけいの アクション!',boss:'boss_wario'},
  {id:'weird', name:'ヘンテコ はかせ',cat:'weird', col:'#9c27b0',col2:'#4a148c',face:'doc',
   desc:'なんじゃこりゃ! な へんてこ プチゲーム!',boss:'boss_escape'},
  {id:'retro', name:'レトロの ドット',cat:'retro', col:'#4caf50',col2:'#1b5e20',face:'dot',
   desc:'なつかしの ドットえ プチゲーム!',boss:'boss_rush'},
  {id:'puzzle',name:'ナゾの クエス',cat:'puzzle',col:'#ff9800',col2:'#e65100',face:'ques',
   desc:'あたまを つかう ナゾの プチゲーム!',boss:'boss_wario'},
  {id:'mania', name:'マニー しゃちょう',cat:'all',   col:'#ffc107',col2:'#f57f17',face:'boss',
   desc:'ぜんぶ まぜて エンドレス! どこまで いける?',boss:null}
];
var STAGE_GOAL=12;         /* ステージのプチゲーム数（このあとボス） */

var G={
  state:'title',st:0,stage:STAGES[0],sel:0,mode:'stage',
  life:4,cleared:0,total:0,speed:1,
  queue:[],counts:{},cur:null,gi:null,bossTurn:false,lastWin:true,
  shake:0,flash:0,best:{},unlocked:{}
};
var SAVE='micro_mania_v1';
function load(){
  try{var d=JSON.parse(localStorage.getItem(SAVE)||'{}');
    G.best=d.best||{};G.unlocked=d.unlocked||{};}catch(e){}
}
function save(){
  try{localStorage.setItem(SAVE,JSON.stringify({best:G.best,unlocked:G.unlocked}));}catch(e){}
}
load();

function setState(s){G.state=s;G.st=0;}
function beat(){return 0.5/G.speed;}

function poolFor(cat){
  var a=[];for(var i=0;i<GAMES.length;i++){if(GAMES[i].boss)continue;
    if(cat==='all'||GAMES[i].cat===cat)a.push(GAMES[i]);}
  return a;
}
function refillQueue(){
  G.queue=shuffle(poolFor(G.stage.cat).slice());
}
function nextGame(){
  if(G.mode==='stage'&&G.cleared>=STAGE_GOAL&&!G.bossTurn&&G.stage.boss){
    G.bossTurn=true;startMicro(GBY[G.stage.boss],3);setState('bosscmd');Snd.se('boss');return;
  }
  if(G.mode==='mania'&&G.cleared>0&&G.cleared%20===0&&!G.bossTurn){
    G.bossTurn=true;startMicro(pick([GBY.boss_wario,GBY.boss_escape,GBY.boss_rush]),3);
    setState('bosscmd');Snd.se('boss');return;
  }
  if(!G.queue.length)refillQueue();
  var def=G.queue.pop();
  G.counts[def.id]=(G.counts[def.id]||0)+1;
  var d=Math.min(3,G.counts[def.id]);
  startMicro(def,d);
  setState('cmd');
}
function startMicro(def,diff){
  G.cur=def;
  /* dur は「ゲーム内の時間」。スピードアップ時は dt のほうを速く進めるので、
     見た目のテンポだけが上がり、内容は最後まで同じように遊べる */
  var gi={t:0,dur:def.beats*0.5,diff:diff,won:null,endT:0,s:{},boss:!!def.boss};
  gi.win=function(){if(gi.won===null){gi.won=true;gi.endT=gi.t+(def.boss?0.9:0.45);Snd.se('ok');}};
  gi.lose=function(){if(gi.won===null){gi.won=false;gi.endT=gi.t+0.45;Snd.se('miss');G.shake=0.4;}};
  gi.left=function(){return clamp(1-gi.t/gi.dur,0,1);};
  G.gi=gi;
  def.init(gi);
}
function finishMicro(){
  var g=G.gi;
  if(g.won){G.cleared++;G.total++;}
  else{G.life--;}
  G.lastWin=!!g.won;
  setState('result');
}
function afterResult(){
  if(G.life<=0){
    if(G.mode==='mania'){
      if((G.best.mania||0)<G.total){G.best.mania=G.total;save();}
    }
    Snd.se('over');setState('over');return;
  }
  if(G.bossTurn){
    if(G.lastWin&&G.mode==='stage'){
      G.unlocked[G.stage.id]=Math.max(G.unlocked[G.stage.id]||0,1);
      var bi=G.best[G.stage.id]||0;if(G.total>bi){G.best[G.stage.id]=G.total;}
      save();Snd.se('fanfare');setState('clear');return;
    }
    G.bossTurn=false;
  }
  if(G.cleared>0&&G.cleared%4===0&&G.speed<2.1&&!(G.mode==='stage'&&G.cleared>=STAGE_GOAL)){
    G.speed=Math.min(2.1,G.speed*1.13);Snd.se('speed');setState('speedup');return;
  }
  nextGame();
}
function startRun(stage,mode){
  G.stage=stage;G.mode=mode;G.life=4;G.cleared=0;G.total=0;
  G.speed=mode==='mania'?1.05:1;G.counts={};G.bossTurn=false;
  refillQueue();setState('brief');
}

/* ---------------- キャラの顔 ---------------- */
function charFace(kind,x,y,r,t){
  var bob=Math.sin(t*4)*r*0.05;y+=bob;
  if(kind==='boss'){
    circ(x,y,r,'#ffd9a8');
    ellip(x,y+r*0.18,r*0.62,r*0.42,'#e8b57f');            /* あごひげ */
    rect(x-r*1.05,y-r*0.95,r*2.1,r*0.42,'#ffcc00');       /* ぼうし */
    rrect(x-r*0.6,y-r*1.5,r*1.2,r*0.62,4,'#ffcc00');
    txt('M',x,y-r*1.18,r*0.5,'#7b4b00');
    circ(x-r*0.35,y-r*0.2,r*0.14,'#222');circ(x+r*0.35,y-r*0.2,r*0.14,'#222');
    ellip(x,y+r*0.12,r*0.3,r*0.22,'#f0a070');             /* はな */

/* =========================================================
   メインループ
   ========================================================= */
var last=0;
function frame(now){
  requestAnimationFrame(frame);
  var dt=Math.min(0.05,(now-last)/1000);last=now;
  if(!dt)dt=0.016;
  G.st+=dt;
  if(G.shake>0)G.shake=Math.max(0,G.shake-dt);
  update(dt);
  c.save();
  if(G.shake>0){c.translate(rnd(-1,1)*G.shake*14,rnd(-1,1)*G.shake*14);}
  render();
  c.restore();
  clearEdges();
  Snd.tick(126*(G.state==='play'||G.state==='cmd'||G.state==='result'?G.speed:1),
           G.state!=='title'&&G.state!=='howto'&&G.state!=='select');
}
function update(dt){
  var s=G.state,t=G.st;
  if(s==='title'){
    if(IN.pa){Snd.se('sel');setState('select');}
    if(IN.pd){Snd.se('sel');setState('howto');}
  }else if(s==='howto'){
    if(IN.pa){Snd.se('sel');setState('title');}
  }else if(s==='select'){
    if(IN.pl){G.sel=(G.sel+STAGES.length-1)%STAGES.length;Snd.se('blip');}
    if(IN.pr){G.sel=(G.sel+1)%STAGES.length;Snd.se('blip');}
    if(IN.pd){Snd.se('sel');setState('howto');}
    if(IN.pa){
      var st=STAGES[G.sel];Snd.se('sel');
      startRun(st,st.id==='mania'?'mania':'stage');
    }
  }else if(s==='brief'){
    if(t>2.0||IN.pa)nextGame();
  }else if(s==='cmd'){
    if(G.cur.idle)G.cur.idle(G.gi,dt);
    if(t>=1.0/G.speed){setState('play');G.gi.t=0;}
  }else if(s==='bosscmd'){
    if(t>=1.8){setState('play');G.gi.t=0;}
  }else if(s==='play'){
    var g=G.gi,sdt=dt*G.speed;g.t+=sdt;
    G.cur.update(g,sdt);
    if(g.won===null&&g.t>=g.dur){if(G.cur.survive)g.win();else g.lose();}
    if(g.won!==null&&g.t>=g.endT)finishMicro();
  }else if(s==='result'){
    if(G.gi)G.gi.t+=dt*G.speed;
    if(t>=0.85/G.speed)afterResult();
  }else if(s==='speedup'){
    if(t>=1.6)nextGame();
  }else if(s==='clear'||s==='over'){
    if(t>0.6&&IN.pa){Snd.se('sel');setState('title');}
  }
}
function render(){
  var s=G.state,t=G.st;
  if(s==='title')drawTitle(t);
  else if(s==='howto')drawHowto(t);
  else if(s==='select')drawSelect(t);
  else if(s==='brief')drawBrief(t);
  else if(s==='cmd')drawCmd(t);
  else if(s==='bosscmd')drawBossCmd(t);
  else if(s==='play'){G.cur.draw(G.gi);drawHUD();drawMute();}
  else if(s==='result')drawResult(t);
  else if(s==='speedup')drawSpeedup(t);
  else if(s==='clear')drawClear(t);
  else if(s==='over')drawOver(t);
}

/* うて！ 野球のバッティング */
MG({id:'bat',cat:'sports',cmd:'うて!',beats:8,
init:function(g){
  var d=g.diff,sp=[230,280,330][d-1],x0=152,y0=176,tx=368,ty=238;
  var cv2=d>=3?rnd(-90,110):(d===2?rnd(-40,60):0);   /* たてのヘンカ */
  var T=(tx-x0)/sp;
  g.s={bx:x0,by:y0,vx:sp,vy:(ty-y0-0.5*cv2*T*T)/T,swing:0,done:0,fly:null,curve:cv2,wait:0.55};
},
update:function(g,dt){
  var s=g.s;
  if(s.wait>0){s.wait-=dt;return;}
  if(!s.fly){
    s.bx+=s.vx*dt;s.by+=s.vy*dt;s.vy+=s.curve*dt;
    if(IN.pa&&s.swing<=0&&!s.done){s.swing=0.22;Snd.se('swish');
      if(s.bx>314&&s.bx<394&&Math.abs(s.by-238)<62){
        s.fly={x:s.bx,y:s.by,vx:-rnd(120,200),vy:-rnd(240,300)};
        Snd.se('hit');g.win();
      }else s.done=1;
    }
    if(s.swing>0)s.swing-=dt;
    if(s.bx>430)g.lose();
  }else{
    s.fly.x+=s.fly.vx*dt;s.fly.y+=s.fly.vy*dt;s.fly.vy+=200*dt;
  }
},
draw:function(g){
  var s=g.s;
  var sky=c.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#7ec8f0');sky.addColorStop(1,'#cfeaff');
  c.fillStyle=sky;c.fillRect(0,0,W,H);

  rect(0,110,W,7,'#90a4ae');
  rect(0,117,W,H-117,'#59a94a');            /* しばふ */
  for(var m=0;m<8;m++){c.globalAlpha=0.08;rect(0,124+m*30,W,15,'#fff');c.globalAlpha=1;}
  ellip(250,332,200,74,'#c08a52');           /* ないや */
  ellip(152,206,46,17,'#c08a52');            /* マウンド */
  /* ホームベース */
  poly([334,288,378,288,378,298,356,308,334,298],'#fff');
  line(300,268,300,330,'#ffffff88',3);line(410,268,410,330,'#ffffff88',3);
  guy(150,190,1.1,'#e53935',2);            /* ピッチャー */
  /* バッター */
  var sw=s.swing>0?(0.22-s.swing)/0.22:0;
  c.save();c.translate(372,238);
  guy(0,42,1.25,'#1e88e5',0);
  c.rotate(s.swing>0?(-1.4+sw*3.0):-1.2);
  rect(0,-4,54,8,'#c8a165');rrect(48,-6,12,12,3,'#8d6e63');
  c.restore();
  var ballX=s.fly?s.fly.x:s.bx, ballY=s.fly?s.fly.y:s.by;
  if(s.wait<=0||!s.fly){
    circ(ballX,ballY,10,'#fff');
    c.strokeStyle='#9e9e9e';c.lineWidth=1.5;c.stroke();
    line(ballX-6,ballY-4,ballX+6,ballY+2,'#e53935',2);
    line(ballX-6,ballY+4,ballX+6,ballY-2,'#e53935',2);
  }
  if(s.fly)otxt('ナイスバッティング!',W/2,70,26,'#fff','#c62828');
  else if(s.done)otxt('からぶり…',W/2,70,24,'#fff','#333');
  otxt('タイミングよく Ａ!',W/2,H-40,15,'#fff','#000');

      L.cars[j].x+=L.dir*L.sp*dt;

  for(var r=0;r<m.length;r++)for(var q=0;q<m[r].length;q++){
    if(m[r][q]==='S'){sx=q;sy=r;}
    if(m[r][q]==='G'){gx=q;gy=r;}
  }
  g.s={m:m,cx:sx,cy:sy,gx:gx,gy:gy,x:sx,y:sy,cell:40,ox:60,oy:44,move:0};
},
update:function(g,dt){
  var s=g.s;
  var sp=[6,7.5,9][g.diff-1];
  s.x+=(s.cx-s.x)*Math.min(1,dt*14);s.y+=(s.cy-s.y)*Math.min(1,dt*14);
  var can=function(q,r){
    if(r<0||r>=s.m.length||q<0||q>=s.m[0].length)return 0;
    return s.m[r][q]!=='#';
  };
  s.move-=dt;
  var dx=0,dy=0;
  if(IN.pl||IN.pr||IN.pu||IN.pd||s.move<=0){
    if(IN.l)dx=-1;else if(IN.r)dx=1;else if(IN.u)dy=-1;else if(IN.d)dy=1;
    if((dx||dy)&&can(s.cx+dx,s.cy+dy)){
      s.cx+=dx;s.cy+=dy;s.move=1/sp;Snd.se('blip');
    }
  }
  if(s.cx===s.gx&&s.cy===s.gy&&g.won===null){Snd.se('coin');g.win();}

      circ(x+s.cell/2,y+s.cell/2,13,'#ffeb3b');

  circ(px2,py2,13,'#ff7043');

      c.save();c.translate(it.x,it.y);c.scale(Math.abs(Math.cos(it.rot))*0.7+0.3,1);

    }
  }
  for(var j=0;j<s.spark.length;j++){var p=s.spark[j];c.globalAlpha=p.l*2;circ(p.x,p.y,3,'#fff59d');c.globalAlpha=1;}
  /* かご */
  guy(s.x,320,1.3,'#7b1fa2',0);

  rect(-32,-13,64,6,'#a1887f');

}});

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ネコネコ大進撃</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --ink:#2b2118; --paper:#fff8ec; --line:#c8a882;
    --gold:#ffb733; --gold2:#ff8c1a; --blue:#4aa8ff; --red:#ff5d5d;
  }
  html,body{height:100%}
  body{
    background:#20303f;
    font-family:"Segoe UI","Hiragino Kaku Gothic ProN",Meiryo,system-ui,sans-serif;
    color:var(--ink);display:flex;align-items:center;justify-content:center;
    min-height:100dvh;padding:6px;overflow:hidden;
    -webkit-user-select:none;user-select:none;touch-action:manipulation;
  }
  #wrap{width:min(100%,980px);display:flex;flex-direction:column;gap:5px}

  /* ---------- 上段：所持金 ---------- */
  #top{
    display:flex;align-items:center;gap:8px;
    background:linear-gradient(180deg,#fff8ec,#f0e0c8);
    border:3px solid var(--line);border-radius:12px;padding:5px 9px;
    box-shadow:0 3px 0 rgba(0,0,0,.35);
  }
  #moneyWrap{flex:1;min-width:0}
  #moneyTxt{font-size:13px;font-weight:800;display:flex;justify-content:space-between;align-items:baseline}
  #moneyTxt small{font-weight:600;opacity:.65;font-size:10px}
  #moneyBar{height:11px;border-radius:6px;background:#d9c6a8;overflow:hidden;border:1px solid #b09068;margin-top:2px}
  #moneyFill{height:100%;width:0%;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .08s linear}
  .mini{
    background:linear-gradient(180deg,#fffdf6,#ecdcc0);border:2px solid var(--line);
    border-radius:9px;padding:4px 8px;font-size:11px;font-weight:800;line-height:1.25;
    text-align:center;white-space:nowrap;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.28);
  }
  .mini:active{transform:translateY(2px);box-shadow:none}
  .mini.dis{opacity:.45;cursor:default}
  .mini b{color:#c0392b}
  #stageName{font-size:12px;font-weight:800;padding:0 4px;white-space:nowrap}

  /* ---------- 戦場 ---------- */
  #field{position:relative;line-height:0}
  canvas{
    width:100%;aspect-ratio:960/430;height:auto;display:block;
    border:3px solid #6b5236;border-radius:12px;background:#8fd0f0;
    box-shadow:0 6px 20px rgba(0,0,0,.5);touch-action:none;
  }
  #ov{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:11px;text-align:center;padding:14px;
    background:rgba(20,26,36,.82);backdrop-filter:blur(3px);border-radius:12px;color:#fff8ec;
  }
  #ov.hide{display:none}
  #ov h1{font-size:clamp(24px,6vw,40px);letter-spacing:.06em;
    background:linear-gradient(180deg,#fff,#ffd166 55%,#ff8c1a);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  #ov h2{font-size:clamp(18px,4.6vw,28px);color:var(--gold)}
  #ov p{font-size:clamp(11px,2.7vw,13.5px);line-height:1.65;max-width:520px;opacity:.94}
  #stages{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;max-width:600px}
  .sbtn{
    background:linear-gradient(180deg,#fffdf6,#e8d5b5);border:2px solid var(--line);color:var(--ink);
    border-radius:10px;padding:7px 12px;font-size:12px;font-weight:800;cursor:pointer;
    box-shadow:0 3px 0 rgba(0,0,0,.4);min-width:118px;
  }
  .sbtn:active{transform:translateY(3px);box-shadow:none}
  .sbtn.lock{opacity:.4;cursor:default}
  .sbtn i{display:block;font-style:normal;font-size:10px;font-weight:600;opacity:.7;margin-top:1px}
  .sbtn.cleared{background:linear-gradient(180deg,#fff6d8,#ffdf9a);border-color:#d8a53a}
  .big{
    background:linear-gradient(180deg,#ffd166,#ff8c1a);border:3px solid #fff8ec;color:#3a2410;
    border-radius:12px;padding:10px 22px;font-size:15px;font-weight:900;cursor:pointer;
    box-shadow:0 4px 0 rgba(0,0,0,.45);letter-spacing:.05em;
  }
  .big:active{transform:translateY(4px);box-shadow:none}

  /* ---------- 下段：出撃ボタン ---------- */
  #dock{display:flex;gap:5px;align-items:stretch}
  #units{display:flex;gap:4px;flex:1;min-width:0;overflow-x:auto;padding-bottom:2px}
  .unit{
    position:relative;flex:1 0 82px;min-width:70px;
    background:linear-gradient(180deg,#fffdf6,#ead9bd);border:2px solid var(--line);
    border-radius:10px;padding:3px 2px 2px;text-align:center;cursor:pointer;overflow:hidden;
    box-shadow:0 3px 0 rgba(0,0,0,.35);
  }
  .unit:active{transform:translateY(3px);box-shadow:none}
  .unit .nm{font-size:10.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .unit .ic{width:100%;height:34px;display:block}
  .unit .cs{font-size:11px;font-weight:900;color:#b8541f}
  .unit .cool{
    position:absolute;left:0;right:0;bottom:0;background:rgba(30,40,60,.62);
    pointer-events:none;height:0%;transition:height .1s linear;
  }
  .unit .num{
    position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    font-size:19px;font-weight:900;color:#fff;text-shadow:0 2px 4px #000;pointer-events:none;
  }
  .unit.wait .num{display:flex}
  .unit.poor{filter:grayscale(.75) brightness(.9)}
  #side{display:flex;flex-direction:column;gap:4px;width:96px;flex:0 0 96px}
  #cannon{
    flex:1;background:linear-gradient(180deg,#ffe8a8,#ffb733);border:2px solid #c98a1e;
    border-radius:10px;font-size:11px;font-weight:900;color:#4a2c06;cursor:pointer;
    box-shadow:0 3px 0 rgba(0,0,0,.35);position:relative;overflow:hidden;padding:4px;
  }
  #cannon:active{transform:translateY(3px);box-shadow:none}
  #cannon .cool{position:absolute;left:0;right:0;bottom:0;background:rgba(30,40,60,.55);height:100%;transition:height .1s linear}
  #cannon span{position:relative}
  @media(max-width:640px){
    .unit{flex:1 0 66px;min-width:60px}
    .unit .ic{height:28px}
    #side{width:78px;flex:0 0 78px}
  }
</style>
</head>
<body>
<div id="wrap">

  <div id="top">
    <div id="moneyWrap">
      <div id="moneyTxt"><span id="mNow">0</span><small id="mMax">/ 400</small></div>
      <div id="moneyBar"><div id="moneyFill"></div></div>
    </div>
    <div class="mini" id="walletBtn">はたらきネコ Lv<span id="wLv">1</span><br><b id="wCost">200</b></div>
    <div class="mini" id="speedBtn">はやさ<br><b id="spdTxt">x1</b></div>
    <div id="stageName">-</div>
    <div class="mini" id="giveup">やめる</div>
  </div>

  <div id="field">
    <canvas id="cv"></canvas>
    <div id="ov"></div>
  </div>

  <div id="dock">
    <div id="units"></div>
    <div id="side">
      <div id="cannon"><span>ネコ砲<br><i id="cnTxt">0%</i></span><div class="cool" id="cnCool"></div></div>
    </div>
  </div>

</div>

<script>
(() => {
'use strict';

/* ==========================================================
   基本設定
========================================================== */
const VW=960, VH=430;              // 描画上の論理サイズ
const FIELD=2700;                  // 戦場の全長（ワールド座標）
const GROUND=352;                  // 地面のY
const BASE_L=90, BASE_R=FIELD-90;  // 自陣・敵陣の位置

const cv=document.getElementById('cv');
let ctx=cv.getContext('2d');        // アイコン描画時に一時的に差し替える
const mainCtx=ctx;
const dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1));
cv.width=VW*dpr; cv.height=VH*dpr;
ctx.setTransform(dpr,0,0,dpr,0,0);

const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const rnd=(a,b)=>a+Math.random()*(b-a);

/* ==========================================================
   サウンド
========================================================== */
let AC=null;
function ac(){
  if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } }
  if(AC.state==='suspended') AC.resume();
  return AC;
}
function tone(f,dur,type,vol,to){
  const a=ac(); if(!a) return;
  const o=a.createOscillator(), g=a.createGain();
  o.type=type||'square';
  o.frequency.setValueAtTime(f,a.currentTime);
  if(to) o.frequency.exponentialRampToValueAtTime(Math.max(30,to),a.currentTime+dur);
  g.gain.setValueAtTime(vol==null?0.07:vol,a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0008,a.currentTime+dur);
  o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+dur+0.03);
}
function noise(dur,vol,f0,f1){
  const a=ac(); if(!a) return;
  const n=Math.floor(a.sampleRate*dur), b=a.createBuffer(1,n,a.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);
  const s=a.createBufferSource(); s.buffer=b;
  const fl=a.createBiquadFilter(); fl.type='lowpass';
  fl.frequency.setValueAtTime(f0||1600,a.currentTime);
  fl.frequency.exponentialRampToValueAtTime(f1||160,a.currentTime+dur);
  const g=a.createGain(); g.gain.value=vol||0.2;
  s.connect(fl); fl.connect(g); g.connect(a.destination); s.start();
}
const SFX={
  spawn(){ tone(880,0.06,'square',0.06,1320); },
  hit(){ noise(0.05,0.06,900,300); },
  slash(){ noise(0.09,0.09,2600,600); },
  ko(){ tone(300,0.16,'triangle',0.08,90); },
  cannon(){ noise(0.5,0.3,2400,80); tone(120,0.4,'sawtooth',0.1,40); },
  coin(){ tone(1046,0.05,'square',0.06); setTimeout(()=>tone(1568,0.07,'square',0.06),50); },
  win(){ [523,659,784,1046,1318].forEach((f,i)=>setTimeout(()=>tone(f,0.16,'triangle',0.11),i*110)); },
  lose(){ [392,330,262,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.11),i*190)); },
  base(){ noise(0.25,0.18,700,120); }
};

/* ==========================================================
   ユニット定義（味方）
   cost 出撃コスト / cd 再出撃(秒) / hp / atk / range 射程
   speed 移動速度 / itv 攻撃間隔 / kb ふっとび回数 / area 範囲攻撃
========================================================== */
const UNITS=[
  {id:'cat',  name:'ふつうネコ', cost:50,  cd:2.2, hp:230,  atk:42,  range:44, speed:58, itv:1.2,  kb:3, area:false, w:30,
   art:{kind:'cat', body:'#ffffff', ear:'#ffc9d4', prop:null,  sc:0.92}},
  {id:'wall', name:'かべネコ',   cost:95,  cd:4.8, hp:1500, atk:12,  range:36, speed:44, itv:2.2,  kb:4, area:false, w:34,
   art:{kind:'cat', body:'#f2ede2', ear:'#d9c8ae', prop:'wall',sc:1.0}},
  {id:'cow',  name:'うしネコ',   cost:120, cd:2.8, hp:280,  atk:78,  range:42, speed:112,itv:0.95, kb:3, area:false, w:32,
   art:{kind:'cat', body:'#ffffff', ear:'#ffc9d4', prop:'cow', sc:0.95}},
  {id:'axe',  name:'おのネコ',   cost:190, cd:6.0, hp:640,  atk:145, range:48, speed:62, itv:1.4,  kb:3, area:false, w:34,
   art:{kind:'cat', body:'#ffe0b0', ear:'#e8a86a', prop:'axe', sc:1.05}},
  {id:'gun',  name:'てっぽうネコ',cost:280, cd:8.5, hp:400,  atk:155, range:230,speed:46, itv:2.4,  kb:3, area:false, w:32,
   art:{kind:'cat', body:'#cfe4ff', ear:'#9dbde8', prop:'gun', sc:1.0}},
  {id:'mage', name:'まほうネコ', cost:360, cd:12,  hp:500,  atk:180, range:165,speed:44, itv:2.7,  kb:3, area:true,  w:32,
   art:{kind:'cat', body:'#e8d6ff', ear:'#c0a0e8', prop:'wand',sc:1.0}},
  {id:'titan',name:'きょじんネコ',cost:1050,cd:30,  hp:4800, atk:520, range:60, speed:34, itv:3.2,  kb:2, area:true,  w:52,
   art:{kind:'cat', body:'#ffffff', ear:'#ffc9d4', prop:null,  sc:1.9}}
];
const UMAP={}; UNITS.forEach(u=>UMAP[u.id]=u);

/* 敵定義 */
const ENEMIES={
  pup:   {name:'こいぬ',   hp:440,   atk:58,  range:42, speed:46, itv:1.2, kb:3, area:false, w:32, money:22,
          art:{kind:'dog', body:'#e8dcc8', ear:'#b8a48a', sc:0.95}},
  red:   {name:'あかいぬ', hp:820,   atk:115, range:44, speed:80, itv:1.0, kb:3, area:false, w:32, money:38,
          art:{kind:'dog', body:'#ff8a6a', ear:'#c8523a', sc:0.98}},
  snake: {name:'へびさん', hp:1700,  atk:195, range:130,speed:38, itv:2.0, kb:2, area:false, w:40, money:65,
          art:{kind:'snake',body:'#9be07a', ear:'#5aa83e', sc:1.0}},
  bull:  {name:'おおいぬ', hp:3800,  atk:340, range:50, speed:34, itv:1.8, kb:3, area:false, w:44, money:120,
          art:{kind:'dog', body:'#8f7ad0', ear:'#5c4a99', sc:1.35}},
  boar:  {name:'いのしし', hp:6800,  atk:540, range:54, speed:28, itv:2.4, kb:2, area:true,  w:52, money:200,
          art:{kind:'boar',body:'#a98b6e', ear:'#6d5641', sc:1.4}},
  eleph: {name:'ゾウさん', hp:23000, atk:1050,range:110,speed:20, itv:3.0, kb:2, area:true,  w:78, money:650,
          art:{kind:'eleph',body:'#b9c3cf', ear:'#8d97a6', sc:2.1}},
  king:  {name:'ぬしイヌ', hp:42000, atk:1550,range:125,speed:18, itv:3.2, kb:3, area:true,  w:88, money:1300,
          art:{kind:'dog', body:'#3f4a63', ear:'#20263a', sc:2.4}}
};

/* ==========================================================
   ステージ定義
   waves: {t:出現秒 / hpAt:敵城HP割合で出現, type, n:体数, gap:間隔, loop:繰返し秒}
========================================================== */
const STAGES=[
  {name:'ネコ町 ひろば', myHp:5000, enHp:5500, waves:[
    {t:3,type:'pup',n:3,gap:3.5},
    {t:18,type:'pup',n:4,gap:3},
    {t:36,type:'red',n:2,gap:4},
    {t:50,type:'pup',n:99,gap:6,loop:true},
    {hpAt:0.55,type:'red',n:3,gap:3}
  ]},
  {name:'いぬ谷', myHp:5000, enHp:10000, waves:[
    {t:2,type:'pup',n:4,gap:2.5},
    {t:16,type:'red',n:3,gap:3},
    {t:32,type:'snake',n:2,gap:5},
    {t:44,type:'red',n:99,gap:5,loop:true},
    {hpAt:0.6,type:'bull',n:1,gap:1},
    {hpAt:0.3,type:'snake',n:3,gap:3.5}
  ]},
  {name:'むらさきの丘', myHp:5000, enHp:17000, waves:[
    {t:2,type:'red',n:4,gap:2.2},
    {t:18,type:'snake',n:3,gap:3.5},
    {t:34,type:'bull',n:2,gap:7},
    {t:46,type:'pup',n:99,gap:4,loop:true},
    {hpAt:0.65,type:'bull',n:2,gap:5},
    {hpAt:0.35,type:'boar',n:1,gap:1},
    {hpAt:0.15,type:'snake',n:4,gap:2.5}
  ]},
  {name:'いのしし平原', myHp:5000, enHp:26000, waves:[
    {t:3,type:'pup',n:3,gap:3},
    {t:18,type:'red',n:3,gap:3},
    {t:34,type:'bull',n:2,gap:6},
    {t:50,type:'snake',n:4,gap:6},
    {t:62,type:'red',n:99,gap:7,loop:true},
    {hpAt:0.7,type:'bull',n:3,gap:3.5},
    {hpAt:0.4,type:'boar',n:2,gap:7},
    {hpAt:0.18,type:'red',n:6,gap:1.8}
  ]},
  {name:'ゾウさん城', myHp:5000, enHp:38000, waves:[
    {t:2,type:'pup',n:4,gap:2.5},
    {t:16,type:'red',n:4,gap:3},
    {t:34,type:'bull',n:3,gap:5},
    {t:52,type:'boar',n:2,gap:7},
    {t:58,type:'red',n:99,gap:6.5,loop:true},
    {t:80,type:'bull',n:4,gap:9},
    {hpAt:0.75,type:'eleph',n:1,gap:1},
    {hpAt:0.45,type:'bull',n:4,gap:3.5},
    {hpAt:0.2,type:'boar',n:3,gap:5}
  ]},
  {name:'ぬしイヌの間', myHp:6000, enHp:44000, waves:[
    {t:2,type:'pup',n:5,gap:2.2},
    {t:16,type:'red',n:4,gap:2.6},
    {t:32,type:'snake',n:4,gap:3.5},
    {t:48,type:'bull',n:4,gap:4},
    {t:60,type:'red',n:99,gap:5.5,loop:true},
    {t:78,type:'boar',n:3,gap:7},
    {t:95,type:'bull',n:5,gap:7},
    {hpAt:0.8,type:'eleph',n:1,gap:1},
    {hpAt:0.5,type:'king',n:1,gap:1},
    {hpAt:0.25,type:'boar',n:4,gap:4}
  ]}
];

/* ==========================================================
   ゲーム状態
========================================================== */
let G=null;          // 進行中のバトル
let mode='title';    // title / play / result
let cleared=loadSave();
let camX=0, camTarget=0, dragX=null, dragCam=0, dragged=false;
let tick=0, shake=0, speedMul=1;

function loadSave(){
  try{ return JSON.parse(localStorage.getItem('nyanko_clear')||'[]'); }catch(e){ return []; }
}
function saveClear(i){
  if(!cleared.includes(i)){ cleared.push(i); try{ localStorage.setItem('nyanko_clear',JSON.stringify(cleared)); }catch(e){} }
}

function newBattle(si){
  const st=STAGES[si];
  G={
    si, st,
    myHp:st.myHp, myMax:st.myHp, enHp:st.enHp, enMax:st.enHp,
    money:200, walletLv:1, time:0,
    units:[],      // 味方
    foes:[],       // 敵
    shots:[], fx:[], nums:[],
    cd:{},         // 出撃クールダウン
    cannon:0,      // 0-100
    waves:st.waves.map(w=>Object.assign({},w,{spawned:0,timer:0,started:false})),
    over:0, result:null, id:1
  };
  UNITS.forEach(u=>G.cd[u.id]=0);
  camX=0; camTarget=0; shake=0;
}

/* 所持金まわり */
const WALLET_COST=[200,340,520,760,1050,1400,1800,2300,2900];
const walletMax=lv=>400+320*(lv-1);       // 所持金の上限
const walletRate=lv=>26+16*lv;            // 1秒あたりの収入
const walletCost=lv=>WALLET_COST[lv-1]||99999;

/* ==========================================================
   ユニット生成
========================================================== */
function mkUnit(def,side){
  return {
    id:G.id++, def, side, name:def.name,
    x: side==='ally' ? BASE_L+rnd(-6,10) : BASE_R+rnd(-10,6),
    hp:def.hp, maxHp:def.hp, atk:def.atk, range:def.range,
    speed:def.speed, itv:def.itv, area:!!def.area, w:def.w,
    kb:def.kb, kbLeft:def.kb, atkT:rnd(0,0.3), state:'walk',
    kbT:0, kbVX:0, anim:rnd(0,6), hitT:0, lunge:0, dead:false,
    yoff: side==='ally' ? -(G.units.length%3)*7 : -(G.foes.length%3)*7
  };
}
function spawnUnit(id){
  const def=UMAP[id];
  if(!def||G.over) return false;
  if(G.cd[id]>0 || G.money<def.cost) return false;
  if(G.units.length>=26) return false;
  G.money-=def.cost;
  G.cd[id]=def.cd;
  G.units.push(mkUnit(def,'ally'));
  SFX.spawn();
  return true;
}
function spawnFoe(type){
  const def=ENEMIES[type];
  if(!def||G.foes.length>=30) return;
  G.foes.push(mkUnit(def,'enemy'));
}

/* ==========================================================
   戦闘ロジック
========================================================== */
function foesOf(u){ return u.side==='ally' ? G.foes : G.units; }
// 前方のいちばん近い敵
function frontFoe(u){
  const list=foesOf(u); let best=null;
  for(const f of list){
    if(f.dead) continue;
    const d = u.side==='ally' ? f.x-u.x : u.x-f.x;
    if(d < -(u.w/2+f.w/2)) continue;          // 完全に後ろにいる相手は対象外
    if(!best || d < (u.side==='ally' ? best.x-u.x : u.x-best.x)) best=f;
  }
  return best;
}
function dist(u,f){ return u.side==='ally' ? f.x-u.x : u.x-f.x; }

function damage(t,amount,src){
  if(t.dead) return;
  t.hp-=amount; t.hitT=0.12;
  G.nums.push({x:t.x,y:GROUND+t.yoff-46-rnd(0,14),v:amount|0,life:0.75,crit:amount>=300});
  // ふっとび判定
  if(t.hp>0 && t.kbLeft>1){
    const th=t.maxHp*(t.kbLeft-1)/t.kb;
    if(t.hp<=th){
      t.kbLeft--;
      t.state='kb'; t.kbT=0.42;
      t.kbVX=(t.side==='ally'?-1:1)*230;
    }
  }
  if(t.hp<=0){
    t.dead=true; SFX.ko();
    if(t.side==='enemy'){
      G.money=Math.min(walletMax(G.walletLv), G.money+(t.def.money||20));
      SFX.coin();
    }
    for(let i=0;i<8;i++) G.fx.push({x:t.x,y:GROUND+t.yoff-20,vx:rnd(-90,90),vy:rnd(-160,-30),
      life:rnd(.3,.6),c:t.side==='ally'?'#ffffff':'#ffd9a0',s:rnd(3,6)});
  }
}
function attackBase(u){
  if(u.side==='ally'){ G.enHp-=u.atk; }
  else { G.myHp-=u.atk; }
  shake=Math.max(shake,5);
  SFX.base();
  G.nums.push({x:u.side==='ally'?BASE_R:BASE_L, y:GROUND-120, v:u.atk|0, life:0.8, crit:true});
}

function updateUnit(u,dt){
  if(u.dead) return;
  u.anim+=dt*(u.state==='walk'?6:3);
  if(u.hitT>0) u.hitT-=dt;
  if(u.lunge>0) u.lunge=Math.max(0,u.lunge-dt*4);

  if(u.state==='kb'){
    u.kbT-=dt;
    u.x+=u.kbVX*dt;
    u.kbVX*=0.90;
    u.x=clamp(u.x,BASE_L-30,BASE_R+30);
    if(u.kbT<=0){ u.state='walk'; u.atkT=Math.min(u.atkT,u.itv*0.5); }
    return;
  }

  const f=frontFoe(u);
  const baseDist = u.side==='ally' ? (BASE_R-u.x) : (u.x-BASE_L);
  const target = f && dist(u,f)<=u.range ? f : (baseDist<=u.range ? 'base' : null);

  // 接触していたら前に進めない
  let blocked=false;
  if(f && dist(u,f) <= u.w/2+f.w/2) blocked=true;
  if(baseDist<=u.range) blocked=true;

  if(target){
    u.state='attack';
    u.atkT-=dt;
    if(u.atkT<=0){
      u.atkT=u.itv; u.lunge=1;
      if(target==='base'){ attackBase(u); }
      else{
        if(u.area){
          for(const g of foesOf(u)) if(!g.dead && dist(u,g)<=u.range && dist(u,g)>=-(u.w/2+g.w/2)) damage(g,u.atk,u);
        }else damage(target,u.atk,u);
        if(u.range>90){
          G.shots.push({x:u.x+(u.side==='ally'?18:-18),y:GROUND+u.yoff-34,
            tx:target.x,ty:GROUND+target.yoff-30,life:0.16,side:u.side});
          SFX.hit();
        }else SFX.slash();
      }
    }
  }else{
    u.state='walk';
    if(!blocked){
      u.x += (u.side==='ally'?1:-1)*u.speed*dt;
      u.x = clamp(u.x, BASE_L-20, BASE_R+20);
    }
  }
}

function updateWaves(dt){
  const frac=G.enHp/G.enMax;
  for(const w of G.waves){
    if(!w.started){
      if(w.hpAt!==undefined){ if(frac<=w.hpAt) w.started=true; }
      else if(G.time>=w.t) w.started=true;
      if(w.started) w.timer=0;
      else continue;
    }
    if(w.spawned>=w.n) continue;
    w.timer-=dt;
    if(w.timer<=0){
      spawnFoe(w.type);
      w.spawned++;
      w.timer=w.gap;
      if(w.loop && w.spawned>=w.n) w.spawned=0;
    }
  }
}

function fireCannon(){
  if(!G||G.over||G.cannon<100) return;
  G.cannon=0;
  SFX.cannon();
  shake=Math.max(shake,14);
  const left=camX, right=camX+VW;
  for(const f of G.foes){
    if(f.dead) continue;
    if(f.x<left-100||f.x>right+100) continue;
    damage(f,420,null);
    if(!f.dead){ f.state='kb'; f.kbT=0.5; f.kbVX=340; }
  }
  for(let i=0;i<40;i++) G.fx.push({x:camX+rnd(0,VW),y:GROUND-rnd(0,90),vx:rnd(60,320),vy:rnd(-140,40),
    life:rnd(.3,.8),c:['#fff','#9be7ff','#ffd166'][(Math.random()*3)|0],s:rnd(3,8)});
  G.fx.push({beam:true,x:BASE_L,life:0.45,max:0.45});
}

function upgradeWallet(){
  if(!G||G.over) return;
  if(G.walletLv>=10) return;
  const c=walletCost(G.walletLv);
  if(G.money<c) return;
  G.money-=c; G.walletLv++;
  SFX.coin();
}

/* ==========================================================
   更新
========================================================== */
function update(dt){
  tick+=dt;
  if(shake>0) shake=Math.max(0,shake-dt*22);
  if(!G) return;

  if(G.over){
    G.over-=dt;
    stepFx(dt);
    if(G.over<=0 && mode==='play'){ showResult(); }
    return;
  }

  G.time+=dt;
  G.money=Math.min(walletMax(G.walletLv), G.money+walletRate(G.walletLv)*dt);
  G.cannon=Math.min(100,G.cannon+dt*(100/38));
  for(const k in G.cd) if(G.cd[k]>0) G.cd[k]=Math.max(0,G.cd[k]-dt);

  updateWaves(dt);
  for(const u of G.units) updateUnit(u,dt);
  for(const f of G.foes) updateUnit(f,dt);
  G.units=G.units.filter(u=>!u.dead);
  G.foes=G.foes.filter(u=>!u.dead);

  stepFx(dt);

  // カメラ：最前線を追う
  let front=BASE_L;
  for(const u of G.units) if(u.x>front) front=u.x;
  let efront=BASE_R;
  for(const f of G.foes) if(f.x<efront) efront=f.x;
  camTarget=clamp((front+efront)/2-VW/2, 0, FIELD-VW);
  if(dragX===null) camX+=(camTarget-camX)*Math.min(1,dt*2.4);
  camX=clamp(camX,0,FIELD-VW);

  if(G.enHp<=0){ G.enHp=0; G.over=1.4; G.result='win'; SFX.win(); saveClear(G.si); shake=16; }
  else if(G.myHp<=0){ G.myHp=0; G.over=1.4; G.result='lose'; SFX.lose(); shake=16; }
}
function stepFx(dt){
  for(const p of G.fx){
    p.life-=dt;
    if(p.beam) continue;
    p.vy+=520*dt; p.x+=p.vx*dt; p.y+=p.vy*dt;
  }
  G.fx=G.fx.filter(p=>p.life>0);
  for(const s of G.shots) s.life-=dt;
  G.shots=G.shots.filter(s=>s.life>0);
  for(const n of G.nums){ n.life-=dt; n.y-=34*dt; }
  G.nums=G.nums.filter(n=>n.life>0);
}

  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);     ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

/* --- キャラ描画 --- */
function drawUnit(u){
  const x=u.x-camX;
  if(x<-120||x>VW+120) return;
  const y=GROUND+u.yoff;
  const a=u.def.art, sc=a.sc||1;
  // ネコ絵は右向き・敵絵は左向きに描いてあるので反転はしない
  const dir = u.side==='ally' ? 1 : -1;
  const walkB = u.state==='walk' ? Math.abs(Math.sin(u.anim))*3 : Math.sin(u.anim)*1.2;
  const lunge = u.lunge*10*dir;

  ctx.save();
  ctx.translate(x+lunge,y);
  // 影
  ctx.fillStyle='rgba(0,0,0,.22)';
  ctx.beginPath(); ctx.ellipse(0,2,20*sc,6*sc,0,0,7); ctx.fill();
  ctx.scale(sc,sc);
  ctx.translate(0,-walkB);
  if(u.state==='kb') ctx.rotate(-0.35*dir);
  if(u.hitT>0){ ctx.globalAlpha=0.85; }

  if(a.kind==='cat') drawCat(u,a);
  else if(a.kind==='dog') drawDog(u,a);
  else if(a.kind==='snake') drawSnake(u,a);
  else if(a.kind==='boar') drawBoar(u,a);
  else drawEleph(u,a);

  ctx.restore();

  // 被弾フラッシュ
  if(u.hitT>0){
    ctx.save(); ctx.globalAlpha=u.hitT*3; ctx.globalCompositeOperation='lighter';
    ctx.fillStyle='#ff8080';
    ctx.beginPath(); ctx.ellipse(x,y-22*sc,20*sc,24*sc,0,0,7); ctx.fill();
    ctx.restore();
  }
  // HPバー
  const hpf=u.hp/u.maxHp;
  if(hpf<1){
    const w=Math.max(24,28*sc), bx=x-w/2, by=y-52*sc;
    ctx.fillStyle='rgba(0,0,0,.45)'; rr(bx-1,by-1,w+2,6,3); ctx.fill();
    ctx.fillStyle=u.side==='ally'?'#5ce05c':'#ff6b6b';
    rr(bx,by,w*hpf,4,2); ctx.fill();
  }
}

  ctx.beginPath(); ctx.ellipse(-14,-46,12,10,-0.3,0,7); ctx.fill();
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.ellipse(-18,-49,4,4,0,0,7); ctx.ellipse(-9,-50,4,4,0,0,7); ctx.fill();
  ctx.fillStyle='#2b2118';
  ctx.beginPath(); ctx.ellipse(-19,-49,1.7,2.4,0,0,7); ctx.ellipse(-10,-50,1.7,2.4,0,0,7); ctx.fill();
  ctx.strokeStyle='#ff5d5d'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(-24,-43); ctx.lineTo(-33,-40+Math.sin(t*3)*3); ctx.stroke();
}
function drawBoar(u,a){
  const t=u.anim;
  ctx.fillStyle=a.body;
  ctx.beginPath(); ctx.ellipse(2,-20,23,18,0,0,7); ctx.fill();
  ctx.fillStyle=a.ear;
  ctx.beginPath(); ctx.ellipse(-10,-4,7,5,0,0,7); ctx.ellipse(12,-4,7,5,0,0,7); ctx.fill();
  // たてがみ
  ctx.strokeStyle=a.ear; ctx.lineWidth=3;
  for(let i=0;i<5;i++){ ctx.beginPath(); ctx.moveTo(6-i*5,-36); ctx.lineTo(4-i*5,-48-((i%2)*4)); ctx.stroke(); }
  ctx.fillStyle=a.body;
  ctx.beginPath(); ctx.ellipse(-16,-30,16,14,0,0,7); ctx.fill();
  ctx.fillStyle=a.ear;
  ctx.beginPath(); ctx.ellipse(-28,-26,9,7,0,0,7); ctx.fill();
  ctx.fillStyle='#3a2a20';
  ctx.beginPath(); ctx.ellipse(-33,-27,2.5,2,0,0,7); ctx.ellipse(-31,-23,2.5,2,0,0,7); ctx.fill();
  // 牙
  ctx.fillStyle='#fff8e0'; ctx.strokeStyle='#d8cba8'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(-28,-20); ctx.quadraticCurveTo(-36,-18,-34,-30); ctx.quadraticCurveTo(-30,-24,-26,-21); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#2b2118';
  ctx.beginPath(); ctx.ellipse(-20,-36,2.6,3,0,0,7); ctx.fill();
  ctx.strokeStyle='#2b2118'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(-26,-42); ctx.lineTo(-16,-40); ctx.stroke();
  if(u.state==='attack'&&Math.sin(t*6)>0){
    ctx.fillStyle='rgba(255,255,255,.5)';
    ctx.beginPath(); ctx.ellipse(-40,-24,6,3,0,0,7); ctx.fill();
  }
}
function drawEleph(u,a){
  const t=u.anim;
  ctx.fillStyle=a.body;
  ctx.beginPath(); ctx.ellipse(4,-24,26,21,0,0,7); ctx.fill();
  ctx.fillStyle=a.ear;
  ctx.beginPath(); ctx.ellipse(-10,-5,8,6,0,0,7); ctx.ellipse(14,-5,8,6,0,0,7); ctx.fill();
  ctx.fillStyle=a.body;
  ctx.beginPath(); ctx.ellipse(-16,-38,17,16,0,0,7); ctx.fill();
  // 耳
  ctx.fillStyle=a.ear;
  ctx.beginPath(); ctx.ellipse(-8,-40,10,13,0.2,0,7); ctx.fill();
  // 鼻
  ctx.strokeStyle=a.body; ctx.lineWidth=9; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(-28,-36);
  ctx.quadraticCurveTo(-42,-30+Math.sin(t)*5,-38,-12+Math.sin(t)*3); ctx.stroke();
  // 牙
  ctx.fillStyle='#fff8e0';
  ctx.beginPath(); ctx.moveTo(-30,-26); ctx.quadraticCurveTo(-40,-22,-36,-34); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#2b2118';
  ctx.beginPath(); ctx.ellipse(-24,-44,3,3.4,0,0,7); ctx.fill();
  ctx.strokeStyle='#2b2118'; ctx.lineWidth=2.4;
  ctx.beginPath(); ctx.moveTo(-31,-51); ctx.lineTo(-19,-48); ctx.stroke();
}

function drawShots(){
  for(const s of G.shots){
    const x=s.x-camX, tx=s.tx-camX;
    ctx.save();
    ctx.globalAlpha=Math.min(1,s.life*8);
    ctx.strokeStyle=s.side==='ally'?'#fff3a0':'#ffb0b0';
    ctx.lineWidth=3; ctx.setLineDash([7,5]);
    ctx.beginPath(); ctx.moveTo(x,s.y); ctx.lineTo(tx,s.ty); ctx.stroke();
    ctx.restore();
  }
}
function drawFx(){
  for(const p of G.fx){
    if(p.beam){
      const k=p.life/p.max;
      ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=k;
      const g=ctx.createLinearGradient(0,0,VW,0);
      g.addColorStop(0,'rgba(255,255,255,.95)'); g.addColorStop(.5,'rgba(150,220,255,.7)'); g.addColorStop(1,'rgba(120,180,255,0)');
      ctx.fillStyle=g;
      const h=70*k+18;
      ctx.fillRect(0,GROUND-60-h/2,VW,h);
      ctx.restore();
    }else{
      ctx.globalAlpha=Math.max(0,Math.min(1,p.life*2.4));
      ctx.fillStyle=p.c;
      ctx.fillRect(p.x-camX-p.s/2,p.y-p.s/2,p.s,p.s);
    }
  }
  ctx.globalAlpha=1;
}
function drawNums(){
  ctx.textAlign='center';
  for(const n of G.nums){
    ctx.globalAlpha=Math.max(0,Math.min(1,n.life*2));
    ctx.font='bold '+(n.crit?17:13)+'px system-ui';
    ctx.lineWidth=3.5; ctx.strokeStyle='rgba(40,25,10,.8)';
    ctx.strokeText(n.v,n.x-camX,n.y);
    ctx.fillStyle=n.crit?'#ffd166':'#fff';
    ctx.fillText(n.v,n.x-camX,n.y);
  }
  ctx.globalAlpha=1;
}
function drawMiniMap(){
  const w=200,h=8,x=VW-w-14,y=13;
  ctx.fillStyle='rgba(20,25,35,.5)'; rr(x-3,y-3,w+6,h+6,5); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.25)'; rr(x,y,w,h,4); ctx.fill();
  const px=v=>x+(v/FIELD)*w;
  for(const u of G.units){ ctx.fillStyle='#7ef0a0'; ctx.fillRect(px(u.x)-1,y+1,2,h-2); }
  for(const f of G.foes){ ctx.fillStyle='#ff8a8a'; ctx.fillRect(px(f.x)-1,y+1,2,h-2); }
  ctx.strokeStyle='#fff'; ctx.lineWidth=1.5;
  ctx.strokeRect(px(camX),y-2,(VW/FIELD)*w,h+4);
}

function render(){
  ctx.save();
  if(shake>0) ctx.translate(rnd(-shake,shake)*.6, rnd(-shake,shake)*.4);
  drawBG();
  if(G){
    drawBase('ally'); drawBase('enemy');
    const all=G.units.concat(G.foes);
    all.sort((a,b)=>(a.yoff-b.yoff)||(a.x-b.x));
    for(const u of all) drawUnit(u);
    drawShots();
    drawFx();
    drawNums();
    drawMiniMap();
    if(G.over>0 && G.result){
      ctx.fillStyle=G.result==='win'?'rgba(255,220,140,.25)':'rgba(60,20,20,.3)';
      ctx.fillRect(0,0,VW,VH);
    }
  }
  ctx.restore();
}

/* ==========================================================
   HTML UI
========================================================== */
function buildDock(){
  const box=$('units'); box.innerHTML='';
  UNITS.forEach(u=>{
    const d=document.createElement('div');
    d.className='unit'; d.dataset.id=u.id;
    d.innerHTML='<div class="nm">'+u.name+'</div>'+
      '<canvas class="ic" width="120" height="68"></canvas>'+
      '<div class="cs">'+u.cost+'</div>'+
      '<div class="cool"></div><div class="num"></div>';
    box.appendChild(d);
    drawIcon(d.querySelector('canvas'),u);
    d.addEventListener('pointerdown',e=>{ e.preventDefault(); ac(); if(mode==='play') spawnUnit(u.id); });
  });
}
function drawIcon(c,u){
  const g=c.getContext('2d');
  g.setTransform(1,0,0,1,0,0); g.clearRect(0,0,120,68);
  g.save();
  g.translate(60,64);
  const s=1.15/Math.sqrt(u.art.sc||1);   // 大きいネコもアイコンでは小さくしすぎない
  g.scale(s,s);
  const fake={def:u,anim:0.6,state:'idle',lunge:0,hitT:0,hp:1,maxHp:1};
  ctx=g;                       // 描画関数は ctx を使うので一時的に差し替える
  try{ drawCat(fake,u.art); } finally { ctx=mainCtx; }
  g.restore();
}

function updateUI(){
  if(!G) return;
  const max=walletMax(G.walletLv);
  $('mNow').textContent=Math.floor(G.money);
  $('mMax').textContent='/ '+max;
  $('moneyFill').style.width=(G.money/max*100)+'%';
  $('wLv').textContent=G.walletLv;
  const wc=G.walletLv>=10?'MAX':walletCost(G.walletLv);
  $('wCost').textContent=wc;
  $('walletBtn').classList.toggle('dis',G.walletLv>=10||G.money<walletCost(G.walletLv));
  $('stageName').textContent=G.st.name;
  $('spdTxt').textContent='x'+speedMul;
  document.querySelectorAll('#units .unit').forEach(d=>{
    const u=UMAP[d.dataset.id], cd=G.cd[u.id];
    const c=d.querySelector('.cool');
    c.style.height=(cd/u.cd*100)+'%';
    d.classList.toggle('wait',cd>0);
    d.classList.toggle('poor',G.money<u.cost);
    if(cd>0) d.querySelector('.num').textContent=cd.toFixed(1);
  });
  $('cnTxt').textContent=Math.floor(G.cannon)+'%';
  $('cnCool').style.height=(100-G.cannon)+'%';
}

function showTitle(){
  mode='title';
  const list=STAGES.map((s,i)=>{
    const lock = i>0 && !cleared.includes(i-1);
    return '<div class="sbtn'+(lock?' lock':'')+(cleared.includes(i)?' cleared':'')+'" data-i="'+i+'">'+
      (lock?'？？？':s.name)+'<i>'+(lock?'前のステージをクリア':'敵城HP '+s.enHp+(cleared.includes(i)?' ★クリア済':''))+'</i></div>';
  }).join('');
  $('ov').innerHTML=
    '<h1>ネコネコ大進撃</h1>'+
    '<p>お金をためてネコを出撃させ、敵の城を壊すゲーム。<br>'+
    'ネコは自動で進軍して戦います。<b>はたらきネコ</b>を育てるとお金がたまりやすくなり、'+
    '<b>ネコ砲</b>は画面内の敵をまとめて吹き飛ばします。</p>'+
    '<div id="stages">'+list+'</div>'+
    '<p style="opacity:.7">画面をドラッグで戦場スクロール ／ 数字キー1-7で出撃 ／ Cでネコ砲</p>';
  $('ov').classList.remove('hide');
  $('ov').querySelectorAll('.sbtn').forEach(b=>{
    if(b.classList.contains('lock')) return;
    b.addEventListener('pointerdown',e=>{ e.preventDefault(); ac(); startStage(+b.dataset.i); });
  });
}
function startStage(i){
  newBattle(i);
  mode='play';
  $('ov').classList.add('hide');
  updateUI();
}
function showResult(){
  mode='result';
  const win=G.result==='win';
  $('ov').innerHTML=
    '<h1>'+(win?'せんとうに かった！':'やられた…')+'</h1>'+
    '<h2>'+G.st.name+'</h2>'+
    '<p>'+(win?'残り自城HP '+Math.ceil(G.myHp)+' ／ かかった時間 '+G.time.toFixed(1)+'秒'
              :'敵城を あと '+Math.ceil(G.enHp)+' けずれなかった…')+'</p>'+
    '<div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">'+
      '<div class="big" id="again">もういちど</div>'+
      (win&&G.si+1<STAGES.length?'<div class="big" id="next">つぎのステージ</div>':'')+
      '<div class="big" id="back">ステージ選択</div>'+
    '</div>';
  $('ov').classList.remove('hide');
  const si=G.si;
  $('again').addEventListener('pointerdown',e=>{e.preventDefault();startStage(si);});
  const nx=$('next'); if(nx) nx.addEventListener('pointerdown',e=>{e.preventDefault();startStage(si+1);});
  $('back').addEventListener('pointerdown',e=>{e.preventDefault();showTitle();});
}

/* ==========================================================
   入力
========================================================== */
$('walletBtn').addEventListener('pointerdown',e=>{ e.preventDefault(); ac(); if(mode==='play') upgradeWallet(); });
$('cannon').addEventListener('pointerdown',e=>{ e.preventDefault(); ac(); if(mode==='play') fireCannon(); });
$('speedBtn').addEventListener('pointerdown',e=>{ e.preventDefault(); speedMul = speedMul===1?2:1; });
$('giveup').addEventListener('pointerdown',e=>{ e.preventDefault(); if(mode!=='title') showTitle(); });

cv.addEventListener('pointerdown',e=>{
  ac();
  dragX=e.clientX; dragCam=camX; dragged=false;
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove',e=>{
  if(dragX===null) return;
  const r=cv.getBoundingClientRect();
  const d=(dragX-e.clientX)*(VW/r.width);
  if(Math.abs(d)>4) dragged=true;
  camX=clamp(dragCam+d,0,FIELD-VW);
});
function endDrag(){ dragX=null; }
cv.addEventListener('pointerup',endDrag);
cv.addEventListener('pointercancel',endDrag);

addEventListener('keydown',e=>{
  if(mode!=='play') return;
  const n=parseInt(e.key,10);
  if(n>=1&&n<=UNITS.length){ ac(); spawnUnit(UNITS[n-1].id); }
  if(e.key==='c'||e.key==='C'){ ac(); fireCannon(); }
  if(e.key==='w'||e.key==='W'){ ac(); upgradeWallet(); }
  if(e.key==='ArrowLeft') camX=clamp(camX-90,0,FIELD-VW);
  if(e.key==='ArrowRight') camX=clamp(camX+90,0,FIELD-VW);
});

/* ==========================================================
   メインループ
========================================================== */
buildDock();
showTitle();

let last=performance.now();
function loop(now){
  let dt=(now-last)/1000; last=now;
  if(dt>0.05) dt=0.05;
  if(mode==='play') update(dt*speedMul);
  else { tick+=dt; if(shake>0) shake=Math.max(0,shake-dt*22); }
  render();
  if(mode==='play') updateUI();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

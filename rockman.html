<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>ROCKBOT - ブレイズマン ステージ</title>
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:#08080f;color:#c8d0e8;
    font-family:"Courier New",monospace;-webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;overflow-x:hidden;}
  #wrap{max-width:800px;margin:0 auto;padding:8px 8px 24px;}
  #bar{display:flex;justify-content:space-between;align-items:center;gap:8px;
    background:#141428;border:2px solid #3a4a80;border-bottom:none;padding:4px 8px;
    font-size:12px;font-weight:bold;letter-spacing:1px;color:#6fe0ff;}
  #bar .ttl{color:#ffd447;}
  #bar button{background:#2a2a48;border:2px solid #4a5a90;color:#c8d0e8;
    font-family:inherit;font-size:11px;font-weight:bold;padding:2px 8px;cursor:pointer;}
  #bar button:hover{background:#3a3a60;}
  canvas#cv{display:block;width:100%;height:auto;aspect-ratio:256/224;
    image-rendering:pixelated;image-rendering:crisp-edges;
    background:#000;border:2px solid #3a4a80;touch-action:none;}
  #pad{display:none;margin-top:8px;}
  #pad.on{display:flex;justify-content:space-between;gap:10px;}
  .cluster{display:grid;gap:6px;}
  .dpad{grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,44px);}
  .acts{grid-template-columns:repeat(2,64px);align-items:center;}
  .k{background:#2a2f52;border:2px solid #5a68a0;border-radius:6px;color:#dfe6ff;
    font-family:inherit;font-size:13px;font-weight:bold;display:flex;
    align-items:center;justify-content:center;touch-action:none;cursor:pointer;}
  .k.hit{background:#5a68a0;color:#101020;}
  .k.big{height:64px;border-radius:32px;font-size:15px;}
  .k.a{background:#5a2038;border-color:#c05070;}
  .k.b{background:#1e3a5a;border-color:#4a90c0;}
  .sp{visibility:hidden;}
  #help{margin-top:10px;font-size:11px;line-height:1.7;color:#8894b8;
    background:#101020;border:2px solid #2a3358;padding:8px 10px;}
  #help b{color:#ffd447;}
  #help .kk{color:#6fe0ff;}
</style>
</head>
<body>
<div id="wrap">
  <div id="bar">
    <span class="ttl">ROCKBOT</span>
    <span>BLAZE MAN STAGE</span>
    <button id="btnSound">SOUND: ON</button>
  </div>
  <canvas id="cv" width="256" height="224"></canvas>
  <div id="pad">
    <div class="cluster dpad">
      <div class="sp"></div><div class="k" data-k="up">▲</div><div class="sp"></div>
      <div class="k" data-k="left">◀</div><div class="sp"></div><div class="k" data-k="right">▶</div>
      <div class="sp"></div><div class="k" data-k="down">▼</div><div class="sp"></div>
    </div>
    <div class="cluster acts">
      <div class="k big b" data-k="jump">JUMP</div>
      <div class="k big a" data-k="shoot">SHOT</div>
    </div>
  </div>
  <div id="help">
    <b>操作</b> &nbsp;
    <span class="kk">← →</span> 移動 /
    <span class="kk">↑ ↓</span> はしご /
    <span class="kk">X または Space</span> ジャンプ /
    <span class="kk">Z</span> ショット（長押しでチャージ） /
    <span class="kk">↓ + ジャンプ</span> スライディング /
    <span class="kk">Enter</span> ポーズ<br>
    <b>目標</b> ステージ最奥のボスドアを抜けて <b>ブレイズマン</b> を倒せ。チャージショットは3倍ダメージ。トゲは即死。
  </div>
</div>
<script>
(function(){
'use strict';

/* ==================================================================
   基本定数
   ================================================================== */
const VW=256, VH=224, TS=16;
const cv=document.getElementById('cv');
const ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;

const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const rnd=(a,b)=>a+Math.random()*(b-a);
const rndi=(a,b)=>Math.floor(rnd(a,b+1));
const sgn=v=>v<0?-1:(v>0?1:0);
const R=(x,y,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(x|0,y|0,w|0,h|0);};

/* パレット */
const P={
  blk:'#0a0a18', wht:'#f8f8f8',
  b1:'#0e2a86', b2:'#2060f0', b3:'#5fa8ff', b4:'#a8dcff',
  sk:'#f8c088', sk2:'#c07038',
  cy:'#40e8ff',
  r1:'#8c1010', r2:'#e02828', r3:'#ff6a30', r4:'#ffc040', r5:'#fff0a0',
  g1:'#186830', g2:'#38c060',
  m1:'#20203a', m2:'#3a3a62', m3:'#5c5c90', m4:'#8a8ac0',
  y1:'#c08000', y2:'#ffd040',
  pu:'#7a3aa8'
};

/* ==================================================================
   ステージデータ（16タイル×14行のセグメントを連結）
   # 壁 / ^ トゲ / L はしご / S 開始 / P 中間 / D ボスドア / B ボス
   m メットール / f 飛行敵 / c 砲台 / j ジョー / e エネルギー
   H 動く床(長) / h 動く床(短)
   ================================================================== */
const SEG=[
[ /* 0 スタート */
'................','................','................','................',
'................','................','................','................',
'................','................','................','..S.............',
'################','################'],
[ /* 1 */
'................','................','................','................',
'................','................','................','................',
'................','.......###......','................','...m........m...',
'################','################'],
[ /* 2 トゲ穴 */
'................','................','................','................',
'................','................','......f.........','................',
'................','....###..###....','................','................',
'###.........####','###^^^^^^^^^####'],
[ /* 3 はしご */
'................','................','.....e..........','...####L####....',
'.......L........','.......L........','.......L........','.......L........',
'.......L........','.......L........','.......L........','.......L...m....',
'################','################'],
[ /* 4 動く足場 */
'................','................','................','................',
'................','................','................','................',
'................','................','................','..H.............',
'###.........####','###^^^^^^^^^####'],
[ /* 5 砲台 */
'................','................','................','................',
'................','................','..........c.....','..........##....',
'................','.....##.........','................','................',
'################','################'],
[ /* 6 ジョー */
'................','................','................','................',
'................','................','................','................',
'................','....####........','................','......j.......j.',
'################','################'],
[ /* 7 動く足場2 */
'................','................','................','................',
'................','................','........f.......','................',
'................','...###..........','................','......h.........',
'##...........###','##^^^^^^^^^^^###'],
[ /* 8 階段で上へ */
'................','................','................','................',
'................','................','................','................',
'.............e..','...........#####','.......##.......','...##...........',
'################','################'],
[ /* 9 上層 */
'................','................','................','................',
'................','................','................','................',
'..m.........f...','####..##########','................','................',
'................','^^^^^^^^^^^^^^^^'],
[ /* 10 上層2 */
'................','................','................','................',
'................','................','................','................',
'..c.......j.....','#####...########','................','................',
'................','^^^^^^^^^^^^^^^^'],
[ /* 11 ボス前 */
'................','................','................','................',
'................','................','................','...............D',
'..........P....D','################','################','################',
'################','################'],
[ /* 12 ボス部屋 */
'################','...............#','...............#','...............#',
'...............#','...............#','...............#','...........B...#',
'...............#','################','################','################',
'################','################']
];

const MH=14, MW=SEG.length*16;
let MAP=[];
for(let r=0;r<MH;r++){ let s=''; for(const sg of SEG) s+=sg[r]; MAP.push(s); }
const MAPW=MW*TS, MAPH=MH*TS;

/* エンティティ定義の抽出 */
const defs=[];
let startPt={x:32,y:176}, doorDef=null, bossDef=null;
for(let ty=0;ty<MH;ty++){
  const row=MAP[ty].split('');
  for(let tx=0;tx<MW;tx++){
    const c=row[tx];
    if('SmfcjeHhPBD'.indexOf(c)<0) continue;
    row[tx]='.';
    const bx=tx*TS, by=(ty+1)*TS;
    if(c==='S') startPt={x:bx,y:by};
    else if(c==='P') defs.push({t:'chk',x:bx,y:by});
    else if(c==='D'){ if(!doorDef) doorDef={x:bx,y:ty*TS,w:TS,h:TS*2}; }
    else if(c==='B') bossDef={x:bx,y:by};
    else defs.push({t:c,x:bx,y:by,ty:ty,tx:tx});
  }
  MAP[ty]=row.join('');
}

/* ==================================================================
   サウンド
   ================================================================== */
const A={ctx:null,on:true,noise:null};
function aInit(){
  if(A.ctx) return;
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC) return;
  A.ctx=new AC();
  A.master=A.ctx.createGain(); A.master.gain.value=0.45; A.master.connect(A.ctx.destination);
  A.mus=A.ctx.createGain(); A.mus.gain.value=0.30; A.mus.connect(A.master);
  A.sfx=A.ctx.createGain(); A.sfx.gain.value=0.60; A.sfx.connect(A.master);
  const n=(A.ctx.sampleRate*0.6)|0, buf=A.ctx.createBuffer(1,n,A.ctx.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
  A.noise=buf;
}
function midi(n){ return 440*Math.pow(2,(n-69)/12); }
function tone(f1,f2,dur,type,vol,dest,t0){
  if(!A.ctx||!A.on) return;
  const t=(t0!==undefined?t0:A.ctx.currentTime);
  const o=A.ctx.createOscillator(), g=A.ctx.createGain();
  o.type=type||'square';
  o.frequency.setValueAtTime(Math.max(20,f1),t);
  if(f2&&f2!==f1) o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+dur);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002,vol),t+0.006);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(dest||A.sfx);
  o.start(t); o.stop(t+dur+0.03);
}
function nz(dur,vol,f,t0){
  if(!A.ctx||!A.on||!A.noise) return;
  const t=(t0!==undefined?t0:A.ctx.currentTime);
  const s=A.ctx.createBufferSource(); s.buffer=A.noise;
  const bp=A.ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=f||900; bp.Q.value=0.8;
  const g=A.ctx.createGain();
  g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(bp); bp.connect(g); g.connect(A.sfx);
  s.start(t); s.stop(t+dur+0.02);
}
const SFX={
  shot(){ tone(1200,420,0.09,'square',0.18); },
  shotM(){ tone(900,300,0.14,'square',0.22); tone(1350,450,0.14,'square',0.10); },
  shotL(){ tone(700,180,0.22,'sawtooth',0.22); tone(1100,300,0.22,'square',0.12); },
  chargeUp(){ tone(500,900,0.10,'square',0.07); },
  ping(){ tone(2200,1500,0.05,'square',0.14); },
  hit(){ nz(0.09,0.28,1800); },
  boom(){ nz(0.35,0.42,420); tone(180,50,0.35,'sawtooth',0.18); },
  hurt(){ tone(420,120,0.28,'sawtooth',0.28); },
  die(){ tone(700,90,0.55,'sawtooth',0.3); nz(0.4,0.3,600); },
  item(){ tone(880,880,0.07,'square',0.2); tone(1320,1320,0.09,'square',0.2,null,(A.ctx?A.ctx.currentTime+0.07:0)); },
  life(){ [0,1,2,3].forEach(i=>tone(midi(72+i*4),midi(72+i*4),0.1,'square',0.2,null,(A.ctx?A.ctx.currentTime+i*0.09:0))); },
  door(){ nz(0.25,0.3,260); tone(140,90,0.3,'square',0.14); },
  land(){ nz(0.05,0.12,320); },
  slide(){ nz(0.18,0.16,1400); },
  bossHit(){ nz(0.07,0.3,1200); tone(300,180,0.08,'square',0.16); }
};

/* 音楽 */
const SONGS={
  stage:{ spb:0.1225, tracks:[
    {type:'square',vol:0.16,len:0.85,notes:[
      69,72,76,81, 79,76,72,76,  65,69,72,77, 76,72,69,72,
      67,71,74,79, 77,74,71,74,  64,68,71,76, 74,71,68,71]},
    {type:'square',vol:0.09,len:0.5,notes:[
      81,0,0,0, 0,0,0,0, 77,0,0,0, 0,0,0,0,
      79,0,0,0, 0,0,0,0, 76,0,0,0, 0,0,0,0]},
    {type:'triangle',vol:0.22,len:0.9,notes:[
      45,45,40,40, 45,45,40,40,  41,41,48,48, 41,41,48,48,
      43,43,50,50, 43,43,50,50,  40,40,40,40, 47,47,47,47]}
  ], drum:[1,0,2,0, 1,0,2,0, 1,0,2,0, 1,0,2,1]},
  boss:{ spb:0.1015, tracks:[
    {type:'square',vol:0.18,len:0.7,notes:[
      74,74,0,74, 77,0,74,0,  81,0,79,0, 77,0,74,0,
      73,73,0,73, 76,0,73,0,  80,0,78,0, 76,0,73,0,
      74,77,81,84, 83,81,77,74,  75,0,77,0, 78,0,80,0,
      81,81,0,81, 80,0,78,0,  77,0,75,0, 74,0,0,0]},
    {type:'triangle',vol:0.24,len:0.55,notes:[
      38,38,38,38, 38,38,38,38,  38,38,38,38, 38,38,38,38,
      37,37,37,37, 37,37,37,37,  37,37,37,37, 37,37,37,37,
      38,38,38,38, 38,38,38,38,  39,39,39,39, 40,40,40,40,
      41,41,41,41, 41,41,41,41,  38,38,38,38, 38,38,38,38]}
  ], drum:[1,0,1,0, 2,0,1,0, 1,0,1,0, 2,0,1,1]},
  clear:{ spb:0.13, loop:false, tracks:[
    {type:'square',vol:0.2,len:0.9,notes:[
      72,0,72,0, 72,0,76,0, 79,0,0,0, 84,0,0,0,
      81,0,0,0, 79,0,0,0, 84,0,0,0, 0,0,0,0]},
    {type:'triangle',vol:0.22,len:0.9,notes:[
      48,48,48,48, 48,48,48,48, 55,55,55,55, 60,60,60,60,
      57,57,57,57, 55,55,55,55, 60,60,60,60, 0,0,0,0]}
  ]},
  over:{ spb:0.17, loop:false, tracks:[
    {type:'square',vol:0.2,len:0.9,notes:[69,0,67,0,65,0,64,0,62,0,0,0,60,0,0,0,0,0,0,0]},
    {type:'triangle',vol:0.2,len:0.9,notes:[45,45,43,43,41,41,40,40,38,38,38,38,36,36,36,36,0,0,0,0]}
  ]}
};
const MUS={name:null,seq:null,step:0,t:0,spb:0.12};
function musPlay(name){
  aInit();
  if(MUS.name===name) return;
  MUS.name=name; MUS.seq=SONGS[name]; MUS.step=0;
  MUS.spb=MUS.seq?MUS.seq.spb:0.12;
  MUS.t=A.ctx?A.ctx.currentTime+0.06:0;
}
function musStop(){ MUS.name=null; MUS.seq=null; }
function musUpdate(){
  if(!A.ctx||!MUS.seq||!A.on) return;
  const now=A.ctx.currentTime;
  if(MUS.t<now-0.5) MUS.t=now;
  let guard=0;
  while(MUS.t<now+0.22 && guard++<64){
    const s=MUS.step;
    let len=0;
    for(const tr of MUS.seq.tracks){
      len=Math.max(len,tr.notes.length);
      const n=tr.notes[s%tr.notes.length];
      if(n>0) tone(midi(n),midi(n),(tr.len||0.9)*MUS.spb,tr.type,tr.vol,A.mus,MUS.t);
    }
    if(MUS.seq.drum){
      const d=MUS.seq.drum[s%MUS.seq.drum.length];
      if(d===1) nz(0.05,0.22,3200,MUS.t);
      else if(d===2) nz(0.11,0.26,700,MUS.t);
    }
    MUS.step++; MUS.t+=MUS.spb;
    if(MUS.seq.loop===false && MUS.step>=len){ MUS.seq=null; MUS.name=null; break; }
  }
}

/* ==================================================================
   入力
   ================================================================== */
const IN={left:0,right:0,up:0,down:0,jump:0,shoot:0,start:0};
const PREV={};
const K={};
function down(k){ if(!IN[k]) IN[k]=1; }
function up(k){ IN[k]=0; }
const KEYMAP={
  ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right',
  ArrowUp:'up', KeyW:'up', ArrowDown:'down', KeyS:'down',
  KeyX:'jump', Space:'jump', KeyK:'jump', ShiftLeft:'jump',
  KeyZ:'shoot', KeyJ:'shoot', ControlLeft:'shoot',
  Enter:'start', Escape:'start'
};
addEventListener('keydown',e=>{
  const k=KEYMAP[e.code]; if(!k) return;
  e.preventDefault(); aInit(); if(A.ctx&&A.ctx.state==='suspended') A.ctx.resume();
  down(k);
},{passive:false});
addEventListener('keyup',e=>{ const k=KEYMAP[e.code]; if(!k) return; e.preventDefault(); up(k); },{passive:false});
addEventListener('blur',()=>{ for(const k in IN) IN[k]=0; });

/* タッチパッド */
const pad=document.getElementById('pad');
if('ontouchstart' in window || navigator.maxTouchPoints>0) pad.classList.add('on');
pad.querySelectorAll('.k').forEach(el=>{
  const key=el.dataset.k;
  const on=e=>{ e.preventDefault(); aInit(); if(A.ctx&&A.ctx.state==='suspended')A.ctx.resume();
    down(key); el.classList.add('hit'); };
  const off=e=>{ e.preventDefault(); up(key); el.classList.remove('hit'); };
  el.addEventListener('touchstart',on,{passive:false});
  el.addEventListener('touchend',off,{passive:false});
  el.addEventListener('touchcancel',off,{passive:false});
  el.addEventListener('mousedown',on); el.addEventListener('mouseup',off);
  el.addEventListener('mouseleave',off);
});
cv.addEventListener('pointerdown',()=>{ aInit(); if(A.ctx&&A.ctx.state==='suspended')A.ctx.resume(); });
document.getElementById('btnSound').addEventListener('click',function(){
  A.on=!A.on; this.textContent='SOUND: '+(A.on?'ON':'OFF');
  if(!A.on) musStop(); else musPlay(G.mode==='boss'||G.mode==='bossintro'?'boss':'stage');
});
function pressed(k){ return IN[k] && !PREV[k]; }

/* ==================================================================
   タイル判定
   ================================================================== */
const extra=[]; /* 動く床・ドアなどの追加当たり判定 */
function tileAt(tx,ty){
  if(tx<0||tx>=MW) return '#';
  if(ty<0||ty>=MH) return '.';
  return MAP[ty][tx];
}
function isSolid(tx,ty){
  if(tx<0||tx>=MW) return true;
  if(ty<0||ty>=MH) return false;
  return MAP[ty][tx]==='#';
}
function hitSolid(x,y,w,h){
  const x0=Math.floor(x/TS), x1=Math.floor((x+w-0.01)/TS);
  const y0=Math.floor(y/TS), y1=Math.floor((y+h-0.01)/TS);
  for(let ty=y0;ty<=y1;ty++) for(let tx=x0;tx<=x1;tx++) if(isSolid(tx,ty)) return true;
  for(let i=0;i<extra.length;i++){ const r=extra[i];
    if(x<r.x+r.w && x+w>r.x && y<r.y+r.h && y+h>r.y) return true; }
  return false;
}
function hitTileChar(x,y,w,h,ch){
  const x0=Math.floor(x/TS), x1=Math.floor((x+w-0.01)/TS);
  const y0=Math.floor(y/TS), y1=Math.floor((y+h-0.01)/TS);
  for(let ty=y0;ty<=y1;ty++) for(let tx=x0;tx<=x1;tx++)
    if(tileAt(tx,ty)===ch) return true;
  return false;
}
/* 1pxずつ進めて解決する堅実な移動 */
function moveX(e,dx){
  if(!dx) return false;
  const n=Math.ceil(Math.abs(dx)), st=dx/n;
  for(let i=0;i<n;i++){
    e.x+=st;
    if(hitSolid(e.x,e.y,e.w,e.h)){ e.x-=st; return true; }
  }
  return false;
}
function moveY(e,dy){
  if(!dy) return false;
  const n=Math.ceil(Math.abs(dy)), st=dy/n;
  for(let i=0;i<n;i++){
    e.y+=st;
    if(hitSolid(e.x,e.y,e.w,e.h)){ e.y-=st; return true; }
  }
  return false;
}
function grounded(e){ return hitSolid(e.x,e.y+1,e.w,e.h); }
/* はしご最上段は「上からだけ乗れる床」として扱う */
function isLadderTop(tx,ty){ return tileAt(tx,ty)==='L' && tileAt(tx,ty-1)!=='L'; }
function ladderTopCross(x,w,prevBottom,newBottom){
  if(newBottom<prevBottom) return null;
  const x0=Math.floor(x/TS), x1=Math.floor((x+w-0.01)/TS);
  const ty0=Math.floor(prevBottom/TS), ty1=Math.floor(newBottom/TS);
  for(let ty=ty0;ty<=ty1;ty++){
    const top=ty*TS;
    if(prevBottom>top+0.01||newBottom<top) continue;
    for(let tx=x0;tx<=x1;tx++) if(isLadderTop(tx,ty)) return top;
  }
  return null;
}
function playerGrounded(){
  if(hitSolid(PL.x,PL.y+1,PL.w,PL.h)) return true;
  if(PL.climbing) return false;
  const b=PL.y+PL.h, ty=Math.round(b/TS);
  if(Math.abs(ty*TS-b)<=1.2){
    const x0=Math.floor(PL.x/TS), x1=Math.floor((PL.x+PL.w-0.01)/TS);
    for(let tx=x0;tx<=x1;tx++) if(isLadderTop(tx,ty)) return true;
  }
  return false;
}

/* ==================================================================
   プレイヤー
   ================================================================== */
const PL={
  x:0,y:0,w:12,h:22, vx:0,vy:0, dir:1,
  hp:28, maxhp:28,
  onGround:false, jumpHeld:false,
  shootT:0, chargeT:0, charging:false,
  climbing:false, climbAnim:0,
  sliding:0, slideDir:1,
  inv:0, hurtT:0, dead:false, deadT:0,
  anim:0, lock:false, autoWalk:0, spawning:0
};
const GRAV=0.26, MAXFALL=7.2, WALK=1.55, JUMPV=5.7, SLIDESP=3.1, CLIMBSP=1.35;

function resetPlayer(x,y){
  PL.x=x; PL.y=y-PL.h; PL.vx=0; PL.vy=0; PL.dir=1;
  PL.hp=PL.maxhp; PL.onGround=false; PL.shootT=0; PL.chargeT=0; PL.charging=false;
  PL.climbing=false; PL.sliding=0; PL.inv=0; PL.hurtT=0; PL.dead=false; PL.deadT=0;
  PL.lock=false; PL.autoWalk=0; PL.anim=0; PL.spawning=34;
  PL.h=22; PL.y=-44;
}
function playerBox(){ return {x:PL.x,y:PL.y,w:PL.w,h:PL.h}; }

function fireBuster(){
  const lvl = PL.chargeT>=112?2 : (PL.chargeT>=44?1:0);
  if(lvl===0){
    let n=0; for(const b of bullets) if(b.own===0&&b.lvl===0) n++;
    if(n>=3) return false;
  }
  const bx=PL.x+(PL.dir>0?PL.w-2:-6), by=PL.y+(PL.sliding>0?4:8);
  const sz=[[6,6],[11,10],[16,14]][lvl];
  bullets.push({own:0,lvl,x:bx-(lvl?sz[0]/2-3:0),y:by-(sz[1]-6)/2,
    w:sz[0],h:sz[1],vx:PL.dir*(lvl===2?6.4:5.6),vy:0,dmg:[1,2,3][lvl],t:0});
  PL.shootT=16;
  if(lvl===0) SFX.shot(); else if(lvl===1) SFX.shotM(); else SFX.shotL();
  return true;
}

function playerHurt(dmg,fromX){
  if(PL.inv>0||PL.dead||G.mode==='clear') return;
  PL.hp-=dmg;
  if(PL.hp<=0){ PL.hp=0; killPlayer(); return; }
  PL.inv=72; PL.hurtT=22;
  PL.climbing=false;
  /* スライド姿勢(h=13)のまま h だけ戻すと足元が9px下に伸びて地面にめり込み、
     以降まったく動けなくなる。足元を固定して上へ伸ばす。
     頭上が塞がっている場合は立てないのでスライド姿勢を維持する */
  if(PL.h<22){
    if(!hitSolid(PL.x,PL.y-9,PL.w,9)){ PL.y-=9; PL.h=22; PL.sliding=0; }
    else PL.sliding=Math.max(PL.sliding,1);
  } else PL.sliding=0;
  PL.vx=(PL.x+PL.w/2<fromX?-1:1)*1.15; PL.vy=-1.4;
  PL.chargeT=0; PL.charging=false;
  SFX.hurt();
}
function killPlayer(){
  if(PL.dead) return;
  PL.dead=true; PL.deadT=0; PL.hp=0; PL.h=22;
  SFX.die(); shake(3,20);
  for(let i=0;i<8;i++){
    const a=i*Math.PI/4;
    addPart(PL.x+6,PL.y+11,Math.cos(a)*2.1,Math.sin(a)*2.1,70,P.cy,3,0);
  }
  for(let i=0;i<8;i++){
    const a=i*Math.PI/4+Math.PI/8;
    addPart(PL.x+6,PL.y+11,Math.cos(a)*1.25,Math.sin(a)*1.25,70,P.b3,3,0);
  }
  G.mode='dead'; G.t=0; musStop();
}

function updatePlayer(){
  if(PL.dead){ PL.deadT++; return; }
  if(PL.spawning>0){
    PL.spawning--;
    PL.y+= (PL.spawning>10)? 11 : 0;
    const gy=G.respawn.y-PL.h;
    if(PL.y>gy){ PL.y=gy; }
    if(PL.spawning===10) SFX.land();
    return;
  }
  const L=PL.lock?0:IN.left, Rr=PL.lock?0:IN.right;
  const jumpP=PL.lock?false:pressed('jump');

  if(PL.inv>0) PL.inv--;
  if(PL.shootT>0) PL.shootT--;
  if(PL.hurtT>0){
    PL.hurtT--;
    PL.vy+=GRAV; PL.vy=Math.min(PL.vy,MAXFALL);
    moveX(PL,PL.vx); if(moveY(PL,PL.vy)) PL.vy=0;
    PL.onGround=grounded(PL);
    if(PL.onGround) PL.vx*=0.7;
    checkHazards(); return;
  }

  /* --- チャージ --- */
  if(!PL.lock){
    if(IN.shoot){
      if(!PREV.shoot){ PL.chargeT=0; PL.charging=true; fireBuster(); }
      else if(PL.charging){
        PL.chargeT++;
        if(PL.chargeT===44||PL.chargeT===112) SFX.chargeUp();
        if(PL.chargeT>20 && PL.chargeT%9===0){
          const a=rnd(0,6.283), r=rnd(10,20);
          addPart(PL.x+6+Math.cos(a)*r,PL.y+10+Math.sin(a)*r,-Math.cos(a)*1.3,-Math.sin(a)*1.3,
            10,PL.chargeT>=112?P.r5:(PL.chargeT>=44?P.b4:P.cy),2,0);
        }
      }
    } else if(PL.charging){
      if(PL.chargeT>=44) fireBuster();
      PL.charging=false; PL.chargeT=0;
    }
  }

  /* --- スライディング --- */
  if(PL.sliding>0){
    PL.sliding--;
    PL.h=13;
    const blocked=moveX(PL,PL.slideDir*SLIDESP);
    if(PL.sliding%5===0) addPart(PL.x+(PL.slideDir>0?0:PL.w),PL.y+11,-PL.slideDir*rnd(0.4,1.2),-rnd(0.2,0.8),16,'#b0b8d8',2,0);
    PL.vy+=GRAV; PL.vy=Math.min(PL.vy,MAXFALL);
    if(moveY(PL,PL.vy)) PL.vy=0;
    PL.onGround=grounded(PL);
    const canStand=!hitSolid(PL.x,PL.y-9,PL.w,9);
    const wantJump=!PL.lock && jumpP;
    /* 起き上がりは必ず1回だけ。2回引くと canStand で確認した9pxを超えて
       持ち上がり、頭上のブロックにめり込んで動けなくなる */
    if((PL.sliding<=0||blocked||!PL.onGround||wantJump) && canStand){
      PL.y-=9; PL.h=22; PL.sliding=0;
      if(wantJump){ PL.vy=-JUMPV; PL.jumpHeld=true; }
    } else if(PL.sliding<=0&&!canStand){ PL.sliding=1; }
    PL.dir=PL.slideDir;
    checkHazards(); return;
  }

  /* --- はしご --- */
  const cx=PL.x+PL.w/2;
  const onLadderNow = tileAt((cx/TS)|0,((PL.y+PL.h/2)/TS)|0)==='L';
  const ladderAtFeet = tileAt((cx/TS)|0,((PL.y+PL.h+2)/TS)|0)==='L';
  if(!PL.climbing && !PL.lock){
    if(IN.up && (onLadderNow||tileAt((cx/TS)|0,((PL.y+4)/TS)|0)==='L')){
      PL.climbing=true; PL.vy=0; PL.vx=0;
      PL.x=((cx/TS)|0)*TS+TS/2-PL.w/2;
    } else if(pressed('down') && PL.onGround && ladderAtFeet && !onLadderNow){
      PL.climbing=true; PL.vy=0; PL.vx=0; PL.y+=6;
      PL.x=((cx/TS)|0)*TS+TS/2-PL.w/2;
    }
  }
  if(PL.climbing){
    const stillLadder = tileAt((cx/TS)|0,((PL.y+PL.h/2)/TS)|0)==='L'
                     || tileAt((cx/TS)|0,((PL.y+PL.h-1)/TS)|0)==='L';
    if(!stillLadder && !ladderAtFeet){ PL.climbing=false; }
    else {
      let dy=0;
      if(!PL.lock && PL.shootT<=0){
        if(IN.up) dy=-CLIMBSP; else if(IN.down) dy=CLIMBSP;
      }
      if(dy) PL.climbAnim+=0.18;
      if(dy<0){
        /* はしご最上段の上面まで登ったら、そこに立って登り終わる */
        const col=(cx/TS)|0;
        let topRow=((PL.y+PL.h-1)/TS)|0;
        while(topRow>0 && tileAt(col,topRow-1)==='L') topRow--;
        const surf=topRow*TS;
        if(PL.y+PL.h+dy<=surf){
          PL.y=surf-PL.h; PL.vy=0; PL.climbing=false; PL.onGround=true;
        } else moveY(PL,dy);
      } else if(dy>0){
        if(moveY(PL,dy)) PL.climbing=false;
        else if(grounded(PL)) PL.climbing=false;
      }
      if(!PL.lock && jumpP){ PL.climbing=false; PL.vy=0; }
      if(PL.climbing){
        PL.vy=0; PL.onGround=false;
        if(!PL.lock && (L||Rr)) PL.dir=Rr?1:-1;
        checkHazards(); return;
      }
    }
  }

  /* --- 通常移動 --- */
  let mv=0;
  if(L&&!Rr) mv=-1; else if(Rr&&!L) mv=1;
  if(PL.autoWalk>0){ mv=1; PL.autoWalk--; }
  if(mv){ PL.dir=mv; PL.anim+=0.19; } else PL.anim=0;
  PL.vx=mv*WALK;
  moveX(PL,PL.vx);

  PL.onGround=playerGrounded();
  if(jumpP && PL.onGround){
    if(IN.down && !PL.lock){
      PL.sliding=26; PL.slideDir=PL.dir; PL.y+=9; PL.h=13; SFX.slide();
      checkHazards(); return;
    }
    PL.vy=-JUMPV; PL.onGround=false; PL.jumpHeld=true;
  }
  /* 可変ジャンプ：離した瞬間に一度だけ上昇を切る */
  if(PL.jumpHeld && !IN.jump){
    if(PL.vy<0) PL.vy*=0.45;
    PL.jumpHeld=false;
  }

  PL.vy+=GRAV;
  if(PL.vy>MAXFALL) PL.vy=MAXFALL;
  const wasAir=!PL.onGround, prevBottom=PL.y+PL.h;
  let landed=moveY(PL,PL.vy);
  if(!landed && PL.vy>0 && !IN.down){
    const s=ladderTopCross(PL.x,PL.w,prevBottom,PL.y+PL.h);
    if(s!==null){ PL.y=s-PL.h; landed=true; }
  }
  if(landed){
    if(PL.vy>2.5 && wasAir){ SFX.land();
      for(let i=0;i<3;i++) addPart(PL.x+3+i*3,PL.y+PL.h-2,rnd(-0.8,0.8),-rnd(0.2,0.9),12,'#c0c8e8',2,0.05); }
    PL.vy=0;
  }
  PL.onGround=playerGrounded();
  if(PL.y>MAPH+40) killPlayer();
  checkHazards();
}

function checkHazards(){
  if(PL.dead) return;
  if(hitTileChar(PL.x+2,PL.y+2,PL.w-4,PL.h-4,'^')) killPlayer();
}

function eshot(x,y,vx,vy,dmg,type){
  ebullets.push({x:x-3,y:y-3,w:6,h:6,vx,vy,dmg:dmg||2,type:type||0,t:0,life:400});
}
function updateBullets(){
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i]; b.t++;
    b.x+=b.vx; b.y+=b.vy;
    if(b.x<camX-40||b.x>camX+VW+40||hitSolid(b.x+1,b.y+1,b.w-2,b.h-2)){
      if(hitSolid(b.x+1,b.y+1,b.w-2,b.h-2)) burst(b.x+b.w/2,b.y+b.h/2,3,P.b4,1.6,10);
      bullets.splice(i,1);
    }
  }
  for(let i=ebullets.length-1;i>=0;i--){
    const b=ebullets[i]; b.t++; b.life--;
    b.x+=b.vx; b.y+=b.vy;
    if(b.type===3){ b.vy+=0.14; }
    if(b.life<=0||b.x<camX-60||b.x>camX+VW+60||b.y<-40||b.y>MAPH+40||
       (b.type!==2&&hitSolid(b.x+1,b.y+1,b.w-2,b.h-2))){
      ebullets.splice(i,1); continue;
    }
    if(overlap(b,playerBox())){ playerHurt(b.dmg,b.x+b.w/2); ebullets.splice(i,1); }
  }
}
function drawBullets(){
  for(const b of bullets){
    const x=b.x-camX, y=b.y-camY;
    if(b.lvl===0){ R(x+1,y,4,6,P.b4); R(x,y+1,6,4,P.b4); R(x+1,y+1,4,4,P.wht); }
    else if(b.lvl===1){
      R(x+2,y,7,10,P.b3); R(x,y+2,11,6,P.b3);
      R(x+2,y+2,7,6,P.b4); R(x+3,y+3,5,4,P.wht);
    } else {
      const f=(b.t>>1)%2;
      R(x+3,y,10,14,P.b2); R(x,y+3,16,8,P.b2);
      R(x+3,y+2,10,10,P.b3); R(x+2,y+4,12,6,P.b4);
      R(x+5,y+5,6,4,P.wht);
      R(x+(f?0:13),y+5,3,4,P.cy);
    }
  }
  for(const b of ebullets){
    const x=b.x-camX, y=b.y-camY;
    if(b.type===1){ /* 炎弾 */
      const f=(b.t>>2)%2;
      R(x-1,y-1,8,8,P.r3); R(x,y,6,6,P.r4); R(x+2-f,y+2,3,3,P.r5);
    } else if(b.type===2){ /* 衝撃波 */
      const f=(b.t>>2)%2;
      R(x-4,y-10,14,14,P.r3); R(x-2,y-8+f,10,10,P.r4); R(x+1,y-5,4,5,P.r5);
    } else {
      R(x+1,y,4,6,P.r4); R(x,y+1,6,4,P.r4); R(x+1,y+1,4,4,P.r5);
    }
  }
}

function dropItem(x,y,forced){
  let t=forced;
  if(!t){
    const r=Math.random();
    if(r<0.055) t='life'; else if(r<0.18) t='big'; else if(r<0.42) t='small'; else return;
  }
  items.push({t,x:x-6,y:y-6,w:12,h:12,vy:-1.2,life:t==='fixed'?1e9:420,age:0,fixed:false});
}
function updateItems(){
  for(let i=items.length-1;i>=0;i--){
    const it=items[i]; it.age++;
    if(!it.fixed){
      it.vy=Math.min(it.vy+0.25,6);
      if(moveY(it,it.vy)) it.vy=0;
      it.life--;
      if(it.life<=0){ items.splice(i,1); continue; }
    }
    if(overlap(it,playerBox())){
      if(it.t==='life'){ G.lives++; SFX.life(); G.score+=1000; }
      else { PL.hp=Math.min(PL.maxhp,PL.hp+(it.t==='small'?3:10)); SFX.item(); }
      burst(it.x+6,it.y+6,5,P.g2,1.5,14);
      items.splice(i,1);
    }
  }
}
function drawItems(){
  for(const it of items){
    if(it.life<120 && !it.fixed && (it.life>>2)%2===0) continue;
    const x=it.x-camX, y=it.y-camY;
    if(it.t==='life'){
      R(x+1,y,10,12,P.b2); R(x+2,y+1,8,3,P.b4); R(x+3,y+5,6,5,P.sk);
      R(x+4,y+6,1,2,P.blk); R(x+7,y+6,1,2,P.blk);
    } else if(it.t==='big'){
      R(x,y+2,12,8,P.g1); R(x+1,y+3,10,6,P.g2); R(x+2,y+4,8,2,'#a8ffc0');
      R(x+5,y,2,12,P.g1);
    } else {
      R(x+3,y+4,6,5,P.g1); R(x+4,y+5,4,3,P.g2);
    }
  }
}

       Math.abs((PL.y+PL.h)-p.y)<=3 && PL.vy>=0){

/* ==================================================================
   敵
   ================================================================== */
const EDEF={
  m:{w:14,h:13,hp:1,touch:3,score:100},
  f:{w:16,h:12,hp:1,touch:3,score:150},
  c:{w:16,h:16,hp:4,touch:4,score:200},
  j:{w:16,h:22,hp:6,touch:4,score:400}
};
function spawnEnemy(d){
  const s=EDEF[d.t];
  const e={t:d.t,def:d,w:s.w,h:s.h,hp:s.hp,maxhp:s.hp,touch:s.touch,score:s.score,
    x:d.x+(TS-s.w)/2, y:d.y-s.h, vx:0,vy:0,dir:-1,st:0,tm:0,flash:0,alive:true,
    baseY:d.y-s.h, guard:0};
  if(d.t==='f'){ e.y=d.y-TS; e.baseY=e.y; e.dir=-1; }
  if(d.t==='j'){ e.st=0; e.guard=1; }
  return e;
}
function killEnemy(e,idx){
  burst(e.x+e.w/2,e.y+e.h/2,10,P.r4,2.4,26);
  burst(e.x+e.w/2,e.y+e.h/2,6,P.r5,1.6,20);
  SFX.boom(); G.score+=e.score;
  dropItem(e.x+e.w/2,e.y+e.h/2);
  /* live を消し armed=false にすることで「画面外に出るまで復活しない」挙動になる */
  e.def.live=null; e.def.armed=false; e.alive=false;
  enemies.splice(idx,1);
}
function updateEnemies(){
  /* スポーン管理（画面外に出ると再武装、入ると復活） */
  for(const d of defs){
    if(!EDEF[d.t]) continue;   /* chk / H / h / e は敵ではない */
    const on = d.x>camX-32 && d.x<camX+VW+32;
    if(!on) d.armed=true;
    if(on && d.armed && !d.live){ const e=spawnEnemy(d); d.live=e; enemies.push(e); d.armed=false; }
  }
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    if(e.flash>0) e.flash--;
    const off = e.x<camX-72||e.x>camX+VW+72;
    if(off){ e.def.live=null; e.def.armed=true; enemies.splice(i,1); continue; }
    e.tm++;
    const pcx=PL.x+PL.w/2, pcy=PL.y+PL.h/2, ecx=e.x+e.w/2, ecy=e.y+e.h/2;
    const toP=sgn(pcx-ecx)||1;

    if(e.t==='m'){ /* メットール */
      if(e.st===0){ /* 隠れ */
        if(Math.abs(pcx-ecx)<108 && Math.abs(pcy-ecy)<60 && e.tm>34){ e.st=1; e.tm=0; e.dir=toP; }
      } else if(e.st===1){ /* 開く→3way */
        if(e.tm===16){
          for(const a of [-0.42,0,0.42]) eshot(ecx+e.dir*6,ecy-1,Math.cos(a)*2.1*e.dir,Math.sin(a)*2.1,3,0);
          SFX.shot();
        }
        if(e.tm>46){ e.st=2; e.tm=0; e.hops=0; }
      } else { /* ホップ移動 */
        e.vy+=GRAV;
        if(grounded(e)&&e.vy>=0){
          e.vy=0;
          if(e.tm>14){ e.vy=-2.6; e.dir=toP; e.tm=0; e.hops++; if(e.hops>=2){ e.st=0; e.tm=0; } }
        }
        if(e.vy<0||!grounded(e)) moveX(e,e.dir*0.9);
        if(moveY(e,e.vy)) e.vy=0;
      }
    }
    else if(e.t==='f'){ /* 飛行敵 */
      e.dir=toP;
      moveX(e,e.dir*1.15);
      e.y=e.baseY+Math.sin(e.tm*0.075)*22;
      if(e.tm%110===55 && Math.abs(pcx-ecx)<130) eshot(ecx,ecy+6,0,2.4,3,0);
    }
    else if(e.t==='c'){ /* 砲台 */
      if(e.st===0){ if(e.tm>60){ e.st=1; e.tm=0; } }
      else {
        if(e.tm%26===12 && e.tm<80){
          const dx=pcx-ecx, dy=pcy-ecy, d=Math.hypot(dx,dy)||1;
          eshot(ecx,ecy,dx/d*2.5,dy/d*2.5,3,0); SFX.shot();
        }
        if(e.tm>110){ e.st=0; e.tm=0; }
      }
      e.dir=toP;
    }
    else if(e.t==='j'){ /* ジョー */
      e.vy+=GRAV; e.vy=Math.min(e.vy,MAXFALL);
      if(e.st===0){ /* ガード */
        e.guard=1; e.dir=toP;
        if(e.tm>52){ e.st=Math.random()<0.45?2:1; e.tm=0; }
      } else if(e.st===1){ /* 射撃 */
        e.guard=0;
        if(e.tm===12||e.tm===32){ eshot(ecx+e.dir*10,e.y+8,e.dir*3.0,0,4,0); SFX.shot(); }
        if(e.tm>52){ e.st=3; e.tm=0; }
      } else if(e.st===2){ /* ジャンプ */
        e.guard=1;
        if(e.tm===10&&grounded(e)) e.vy=-4.6;
        if(e.tm>10){ moveX(e,e.dir*1.0); }
        if(e.tm>20&&grounded(e)){ e.st=0; e.tm=0; }
      } else { /* 歩き */
        e.guard=1;
        moveX(e,e.dir*0.72);
        if(e.tm>44){ e.st=0; e.tm=0; }
      }
      if(moveY(e,e.vy)) e.vy=0;
    }

    /* 接触 */
    if(overlap(e,playerBox())) playerHurt(e.touch,e.x+e.w/2);

    /* 自機弾との判定 */
    for(let k=bullets.length-1;k>=0;k--){
      const b=bullets[k];
      if(!overlap(b,e)) continue;
      let block=false;
      if(e.t==='m'&&e.st===0) block=true;
      if(e.t==='c'&&e.st===0) block=true;
      if(e.t==='j'&&e.guard&&sgn(b.vx)===-e.dir) block=true;
      if(block){
        SFX.ping(); burst(b.x+b.w/2,b.y+b.h/2,4,P.m4,2,12);
        bullets.splice(k,1); continue;
      }
      e.hp-=b.dmg; e.flash=6; SFX.hit();
      burst(b.x+b.w/2,b.y+b.h/2,3,P.r5,1.8,10);
      bullets.splice(k,1);
      if(e.hp<=0){ killEnemy(e,i); break; }
    }
  }
}

const BOSS_MAXHP=28;
function initBoss(){
  boss={
    x:bossDef.x-5, y:20, w:26,h:32,
    vx:0,vy:0,dir:-1,
    hp:0, maxhp:BOSS_MAXHP,
    st:'fall', tm:0, inv:0, flash:0,
    last:'', jumps:0, dashT:0, pillarN:0, dead:false, deadT:0,
    pose:0, appearDone:false
  };
}
const bossFires=[]; /* 炎柱 */

function bossPickAttack(){
  const b=boss, pcx=PL.x+PL.w/2, bcx=b.x+b.w/2;
  const far=Math.abs(pcx-bcx)>96;
  const pool=[];
  pool.push('jump','jump');
  pool.push('tri','tri');
  pool.push('pillar');
  if(far) pool.push('dash','dash'); else pool.push('dash');
  let pick=pool[rndi(0,pool.length-1)];
  let guard=0;
  while(pick===b.last && guard++<6) pick=pool[rndi(0,pool.length-1)];
  b.last=pick;
  b.st=pick; b.tm=0;
  b.dir=sgn(pcx-bcx)||b.dir;
  if(pick==='jump') b.jumps=enraged()?3:2;
  if(pick==='pillar') b.pillarN=0;
}
function enraged(){ return boss && boss.hp<=BOSS_MAXHP*0.4; }

function bossLand(){
  SFX.land(); shake(2.5,12);
  for(let i=0;i<6;i++) addPart(boss.x+3+i*4,boss.y+boss.h-2,rnd(-1.4,1.4),-rnd(0.4,1.6),18,'#ffb060',2,0.08);
}
function bossShockwave(){
  const y=boss.y+boss.h-6;
  for(const d of [-1,1]){
    ebullets.push({x:boss.x+boss.w/2-5+d*10,y:y,w:10,h:10,vx:d*2.6,vy:0,dmg:4,type:2,t:0,life:150});
  }
  SFX.boom(); shake(3,14);
}
function bossFirePillar(px){
  bossFires.push({x:px-8,y:0,w:16,h:0,t:0,life:78});
}
function updateBossFires(){
  for(let i=bossFires.length-1;i>=0;i--){
    const f=bossFires[i]; f.t++;
    const ground=144; /* ボス部屋の床 */
    if(f.t<14){ f.h=Math.min(46,f.t*4); }
    else if(f.t>58){ f.h=Math.max(0,46-(f.t-58)*4); }
    else f.h=46;
    f.y=ground-f.h;
    if(f.t>14&&f.h>6){
      const box={x:f.x+3,y:f.y,w:f.w-6,h:f.h};
      if(overlap(box,playerBox())) playerHurt(5,f.x+8);
    }
    if(f.t%4===0&&f.h>4) addPart(f.x+rnd(2,14),f.y+rnd(0,8),rnd(-0.4,0.4),-rnd(0.6,1.6),20,P.r4,2,0);
    if(f.t>=f.life) bossFires.splice(i,1);
  }
}

function updateBoss(){
  const b=boss; if(!b) return;
  if(b.flash>0) b.flash--;
  if(b.inv>0) b.inv--;
  const pcx=PL.x+PL.w/2, bcx=b.x+b.w/2;

  if(b.dead){
    b.deadT++;
    if(b.deadT%5===0){
      const a=rnd(0,6.283), r=rnd(0,16);
      burst(bcx+Math.cos(a)*r,b.y+16+Math.sin(a)*r,4,Math.random()<0.5?P.r4:P.r5,2.2,22);
      SFX.boom(); shake(2,6);
    }
    return;
  }

  b.tm++;
  switch(b.st){
    case 'fall':
      b.vy=Math.min(b.vy+0.42,8);
      if(moveY(b,b.vy)){ b.vy=0; b.st='pose'; b.tm=0; bossLand(); shake(4,18);
        for(let i=0;i<10;i++) addPart(b.x+rnd(0,26),b.y+30,rnd(-2,2),-rnd(0.5,2.5),26,P.r4,2,0.08); }
      break;
    case 'pose':
      b.dir=sgn(pcx-bcx)||-1;
      if(b.tm%6===0) addPart(b.x+13+rnd(-8,8),b.y+rnd(-4,4),rnd(-0.5,0.5),-rnd(0.5,1.5),18,P.r4,2,0);
      if(b.tm>56 && b.hp>=b.maxhp){ b.st='wait'; b.tm=0; }
      break;
    case 'wait':
      b.dir=sgn(pcx-bcx)||b.dir;
      b.vy=Math.min(b.vy+GRAV,MAXFALL); if(moveY(b,b.vy)) b.vy=0;
      if(b.tm> (enraged()?22:38)) bossPickAttack();
      break;
    case 'jump': {
      if(b.tm===1){
        b.vy=-6.4; b.vx=(enraged()?2.3:1.85)*b.dir;
      }
      b.vy=Math.min(b.vy+0.30,MAXFALL);
      if(moveX(b,b.vx)) b.vx*=-1;
      if(b.x<3072+4){ b.x=3072+4; b.vx=Math.abs(b.vx); }
      if(b.x+b.w>3072+240){ b.x=3072+240-b.w; b.vx=-Math.abs(b.vx); }
      if(moveY(b,b.vy)){
        if(b.vy>0){
          b.vy=0; b.vx=0; bossLand(); bossShockwave();
          b.jumps--;
          if(b.jumps>0){ b.tm=0; b.dir=sgn(pcx-bcx)||b.dir; }
          else { b.st='wait'; b.tm=0; }
        } else b.vy=0;
      }
      break; }
    case 'tri': {
      b.vy=Math.min(b.vy+GRAV,MAXFALL); if(moveY(b,b.vy)) b.vy=0;
      if(b.tm===1) b.dir=sgn(pcx-bcx)||b.dir;
      if(b.tm===20||(enraged()&&b.tm===46)){
        const sp=2.7;
        for(const a of [-0.55,0,0.55]){
          ebullets.push({x:bcx+b.dir*10,y:b.y+14,w:8,h:8,
            vx:Math.cos(a)*sp*b.dir, vy:Math.sin(a)*sp, dmg:4,type:1,t:0,life:260});
        }
        SFX.shotM();
        for(let i=0;i<5;i++) addPart(bcx+b.dir*14,b.y+18,b.dir*rnd(0.5,2),rnd(-1,1),16,P.r4,2,0);
      }
      if(b.tm>(enraged()?70:52)){ b.st='wait'; b.tm=0; }
      break; }
    case 'dash': {
      b.vy=Math.min(b.vy+GRAV,MAXFALL); if(moveY(b,b.vy)) b.vy=0;
      if(b.tm<18){ b.dir=sgn(pcx-bcx)||b.dir; }
      else if(b.tm<(enraged()?66:54)){
        const sp=enraged()?4.4:3.6;
        if(moveX(b,b.dir*sp)) b.dir*=-1;
        if(b.x<3072+4){ b.x=3072+4; b.dir=1; }
        if(b.x+b.w>3072+240){ b.x=3072+240-b.w; b.dir=-1; }
        if(b.tm%3===0){
          addPart(bcx-b.dir*10,b.y+rnd(8,30),-b.dir*rnd(0.3,1.2),-rnd(0.2,1.2),20,
            Math.random()<0.5?P.r3:P.r4,3,-0.01);
        }
      } else { b.st='wait'; b.tm=0; }
      break; }
    case 'pillar': {
      b.vy=Math.min(b.vy+GRAV,MAXFALL); if(moveY(b,b.vy)) b.vy=0;
      b.dir=sgn(pcx-bcx)||b.dir;
      const gap=enraged()?16:22;
      if(b.tm>12 && (b.tm-12)%gap===0 && b.pillarN<(enraged()?5:4)){
        const base=bcx, step=(pcx-bcx)/(enraged()?5:4);
        bossFirePillar(clamp(base+step*(b.pillarN+1)+rnd(-6,6),3084,3072+234));
        b.pillarN++;
        SFX.shotL();
      }
      if(b.pillarN>=(enraged()?5:4)&&b.tm>12+gap*5){ b.st='wait'; b.tm=0; }
      break; }
  }

  /* 接触ダメージ */
  if(b.st!=='fall'&&overlap(b,playerBox())) playerHurt(6,bcx);

  /* 被弾 */
  if(b.st!=='fall'&&b.st!=='pose'){
    for(let k=bullets.length-1;k>=0;k--){
      const bl=bullets[k];
      if(!overlap(bl,b)) continue;
      bullets.splice(k,1);
      if(b.inv>0){ burst(bl.x,bl.y,3,P.m4,1.6,10); continue; }
      b.hp-=bl.dmg; b.inv=10; b.flash=14;
      SFX.bossHit();
      burst(bl.x+bl.w/2,bl.y+bl.h/2,4,P.r5,2,12);
      if(b.hp<=0){
        b.hp=0; b.dead=true; b.deadT=0;
        musStop(); shake(4,30);
        G.score+=5000;
        break;
      }
    }
  }
}

function clearWorld(){
  bullets.length=0; ebullets.length=0; enemies.length=0;
  items.length=0; parts.length=0; plats.length=0; bossFires.length=0;
  for(const d of defs){ d.live=null; d.armed=true; }
  boss=null;
}
function buildLevelEntities(){
  for(const d of defs){
    if(d.t==='H') plats.push(makePlat(d.x,d.y-10,9));
    else if(d.t==='h') plats.push(makePlat(d.x,d.y-10,6));
    else if(d.t==='e') items.push({t:'big',x:d.x+2,y:d.y-14,w:12,h:12,vy:0,life:1e9,age:0,fixed:true});
  }
}
function startStage(){
  G.mode='ready'; G.t=0; G.lives=3; G.score=0;
  G.respawn={x:startPt.x,y:startPt.y};
  clearWorld(); buildLevelEntities(); initDoor();
  resetPlayer(G.respawn.x,G.respawn.y);
  camX=clamp(PL.x-VW/2,0,MAPW-VW);
  musPlay('stage');
}
function respawn(){
  G.mode='ready'; G.t=0;
  clearWorld(); buildLevelEntities(); initDoor();
  resetPlayer(G.respawn.x,G.respawn.y);
  camX=clamp(PL.x-VW/2,0,MAPW-VW);
  musPlay('stage');
}

let doorPhase=0, doorT=0;
function startDoorSeq(){
  G.mode='door'; doorPhase=0; doorT=0;
  PL.lock=true; PL.vx=0; PL.charging=false; PL.chargeT=0;
  bullets.length=0; ebullets.length=0;
  SFX.door();
}
function updateDoorSeq(){
  doorT++;
  if(doorPhase===0){
    door.open=Math.min(1,doorT/28);
    if(doorT>=28){ doorPhase=1; doorT=0; PL.autoWalk=200; }
  } else if(doorPhase===1){
    updatePlayer();
    if(PL.x>door.x+22){ doorPhase=2; doorT=0; PL.autoWalk=0; PL.lock=true; SFX.door(); }
  } else if(doorPhase===2){
    door.open=Math.max(0,1-doorT/24);
    if(doorT>=24){
      door.open=0;
      G.mode='bossintro'; G.t=0;
      initBoss(); boss.x=bossDef.x-5;
    }
  }
  camX=clamp(PL.x+PL.w/2-VW/2,0,MAPW-VW);
}

function updateBossIntro(){
  G.t++;
  updateBoss();
  updateParts();
  if(boss.st==='pose'){
    if(G.t%3===0 && boss.hp<boss.maxhp){
      boss.hp++;
      tone(1000+boss.hp*22,1000+boss.hp*22,0.04,'square',0.16);
    }
  }
  if(boss.st==='wait'){ G.mode='boss'; PL.lock=false; musPlay('boss'); }
  camX=3072;
}

function updateCheckpoints(){
  for(const d of defs){
    if(d.t!=='chk') continue;
    if(PL.x+PL.w/2>d.x && G.respawn.x!==d.x){ G.respawn={x:d.x,y:d.y}; }
  }
}

function updatePlay(){
  updatePlats();
  ridePlats();
  updatePlayer();
  updateEnemies();
  updateBullets();
  updateItems();
  updateParts();
  updateCheckpoints();
  if(door && door.state==='shut' && !PL.dead &&
     PL.x+PL.w>door.x-30 && PL.y+PL.h>door.y && PL.y<door.y+door.h){
    door.state='opening'; startDoorSeq(); return;
  }
  camX=clamp(PL.x+PL.w/2-VW/2,0,MAPW-VW);
}

function updateBossFight(){
  updatePlayer();
  updateBoss();
  updateBossFires();
  updateBullets();
  updateItems();
  updateParts();
  camX=3072;
  if(boss.dead && boss.deadT>150){
    G.mode='clear'; G.t=0; musPlay('clear');
    PL.lock=true;
  }
}

/* extra（動く床・ドア）の当たり判定を毎フレーム再構築 */
function rebuildExtra(){
  extra.length=0;
  for(const p of plats) extra.push({x:p.x,y:p.y,w:p.w,h:p.h});
  if(door && door.open<0.5) extra.push({x:door.x,y:door.y,w:door.w,h:door.h});
}

/* ==================================================================
   メインループ
   ================================================================== */
function update(){
  G.frames++;
  if(shakeT>0){ shakeT--; if(shakeT<=0) shakeM=0; }
  musUpdate();
  rebuildExtra();

  if(G.mode==='title'){
    if(pressed('jump')||pressed('shoot')||pressed('start')){ startStage(); }
    updateParts();
  }
  else if(G.mode==='ready'){
    G.t++;
    updatePlayer(); updateParts();
    camX=clamp(PL.x+PL.w/2-VW/2,0,MAPW-VW);
    if(G.t>78) G.mode='play';
  }
  else if(G.mode==='play'||G.mode==='boss'){
    if(pressed('start')){ G.paused=!G.paused; }
    if(!G.paused){ (G.mode==='play'?updatePlay:updateBossFight)(); }
  }
  else if(G.mode==='door'){ updateDoorSeq(); updateParts(); updatePlats(); }
  else if(G.mode==='bossintro'){ updateBossIntro(); }
  else if(G.mode==='dead'){
    G.t++; updateParts(); updateBullets();
    if(G.t===1){ if(G.lives<=0){} }
    if(G.t>132){
      if(G.lives>0){ G.lives--; respawn(); }
      else { G.mode='over'; G.t=0; musPlay('over'); }
    }
  }
  else if(G.mode==='clear'){
    G.t++; updateParts();
    if(G.t%10===0&&G.t<120) burst(rnd(camX+40,camX+220),rnd(40,130),4,[P.r5,P.b4,P.g2][rndi(0,2)],2,30);
    if(G.t>150&&(pressed('jump')||pressed('shoot')||pressed('start'))){ G.mode='title'; G.t=0; musPlay('stage'); }
  }
  else if(G.mode==='over'){
    G.t++;
    if(G.t>90&&(pressed('jump')||pressed('shoot')||pressed('start'))){ G.mode='title'; G.t=0; musPlay('stage'); }
  }
  for(const k in IN) PREV[k]=IN[k];
}

  R(10,16,6,4,P.r4); R(11,17,4,2,f?P.r5:'#fff8d0'); R(6,23,14,2,P.r1);
  R(2,18,6,8,P.r2); R(18,18,6,8,P.r2);
  R(1,25,8,5,P.r3); R(17,25,8,5,P.r3);
  R(2,26,6,2,P.r4); R(18,26,6,2,P.r4);
  R(6,24,6,5,P.r2); R(14,24,6,5,P.r2);
  R(4,28,9,4,P.r3); R(13,28,9,4,P.r3);
  R(4,31,9,1,P.r1); R(13,31,9,1,P.r1);
}

function render(){
  ctx.clearRect(0,0,VW,VH);
  if(G.mode==='title'){ drawTitle(); return; }

  drawWorld();
  drawHUD();

  if(G.mode==='ready'){
    if((G.t>>3)%2===0) text('READY',VW/2,100,'#f8f8f8',16);
  }
  else if(G.mode==='bossintro'){
    if(boss&&boss.st==='pose'&&(G.frames>>3)%2===0)
      text('BLAZE  MAN',VW/2,60,'#ff8020',13);
  }
  else if(G.mode==='dead'){
    if(G.t>60) text('DEFEATED...',VW/2,100,'#ff6060',12);
  }
  else if(G.mode==='clear'){
    ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(0,0,VW,VH);
    text('STAGE  CLEAR !',VW/2,58,'#ffd447',18);
    text('BLAZE MAN DEFEATED',VW/2,92,'#ff8020',11);
    text('SCORE   '+('00000000'+G.score).slice(-7),VW/2,116,'#f8f8f8',11);
    text('LIFE  x'+G.lives,VW/2,134,'#78e0ff',11);
    text('WEAPON GET :  BLAZE BUSTER',VW/2,160,'#ff6a30',9);
    if(G.t>150&&(G.frames>>4)%2===0) text('PRESS  X  TO  TITLE',VW/2,192,'#c8d0e8',9);
  }
  else if(G.mode==='over'){
    ctx.fillStyle='rgba(0,0,0,0.75)'; ctx.fillRect(0,0,VW,VH);
    text('GAME  OVER',VW/2,90,'#ff4040',20);
    text('SCORE   '+('00000000'+G.score).slice(-7),VW/2,124,'#f8f8f8',11);
    if(G.t>90&&(G.frames>>4)%2===0) text('PRESS  X  TO  TITLE',VW/2,160,'#c8d0e8',10);
  }
  if(G.paused){
    ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(0,0,VW,VH);
    text('PAUSE',VW/2,100,'#f8f8f8',18);
  }
}

let last=performance.now(), acc=0;
function frame(t){
  requestAnimationFrame(frame);
  let dt=t-last; last=t;
  if(dt>250) dt=250;
  acc+=dt;
  let n=0;
  while(acc>=1000/60 && n<5){ acc-=1000/60; update(); n++; }
  render();
}

/* 起動 */
clearWorld(); buildLevelEntities(); initDoor();
resetPlayer(startPt.x,startPt.y);
PL.spawning=0; PL.y=startPt.y-PL.h;
G.mode='title';
requestAnimationFrame(frame);

/* デバッグ用フック（動作には影響しません） */
try{ window.__RB={G,PL,IN,defs,enemies,bullets,ebullets,items,plats,parts,
  getBoss:()=>boss,getDoor:()=>door,update,render,MAP,MW,MH,startStage}; }catch(e){}

})();
</script>

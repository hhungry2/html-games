<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SPIRE ASCENT - HTML5 デッキ構築ローグライク（Slay the Spire風）</title>
<meta name="description" content="HTML5 Canvasで作ったSlay the Spire風のデッキ構築型ローグライク。3クラス・150枚以上のカード・レリック・ポーション・分岐マップ・エリート/ボス戦・イベント・ショップ・休憩所を搭載。スマホ/PC対応。">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body { height: 100%; }

body {
  background: #0b0910;
  background-image:
    radial-gradient(circle at 50% -20%, #2a1c3a 0%, transparent 62%),
    radial-gradient(circle at 8% 108%, #3a2416 0%, transparent 55%),
    radial-gradient(circle at 96% 96%, #16283a 0%, transparent 50%);
  color: #e9e2d4;
  font-family: "Segoe UI", "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 5px;
  overflow: hidden;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

.wrap {
  width: 100%;
  max-width: 1180px;
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.topbar {
  display: flex;
  align-items: center;
  gap: 7px;
  font-family: "Consolas", monospace;
  font-size: 11px;
  color: #9c8f7a;
}
.topbar .title {
  flex: 1;
  letter-spacing: .14em;
  color: #f0c04a;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
  text-shadow: 0 0 12px rgba(240,192,74,.35);
}
.sbtn {
  background: rgba(255,255,255,.07);
  border: 1px solid rgba(255,255,255,.16);
  color: #ddd2bd;
  border-radius: 6px;
  padding: 4px 9px;
  font-size: 11px;
  font-family: inherit;
  cursor: pointer;
  white-space: nowrap;
}
.sbtn:active { background: rgba(255,255,255,.2); }
.sbtn.off { color: #6b6152; }

@media (max-width: 560px) {
  .topbar { gap: 4px; }
  .sbtn { padding: 4px 6px; font-size: 10px; }
  .topbar .title { font-size: 10px; letter-spacing: .06em; }
}

.screen {
  position: relative;
  width: 100%;
  max-width: min(1180px, calc((100vh - 52px) * 1.62));
  aspect-ratio: 8 / 5;
  max-height: calc(100vh - 52px);
  margin: 0 auto;
  border-radius: 10px;
  overflow: hidden;
  background: #08060c;
  box-shadow: 0 10px 40px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.07) inset;
  touch-action: none;
}

canvas#game {
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
  cursor: default;
}

body.fs-active { padding: 0; }
body.fs-active .wrap { max-width: none; gap: 0; height: 100%; }
body.fs-active .topbar { display: none; }
body.fs-active .screen { height: 100vh; max-height: 100vh; max-width: 100vw; aspect-ratio: auto; border-radius: 0; }

.rotate-hint {
  display: none;
  text-align: center;
  font-size: 12px;
  color: #b0a48c;
  padding: 8px 4px 2px;
  letter-spacing: .04em;
}
@media (orientation: portrait) and (max-width: 900px) {
  .rotate-hint { display: block; }
}

(function (global) {

/* ---------------------------------------------------------------- 基本 */
var VW = 1024, VH = 640;          // 仮想解像度
var canvas = document.getElementById('game');
var cx = canvas.getContext('2d');
var view = { scale: 1, ox: 0, oy: 0, dpr: 1, w: VW, h: VH };

function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function lerp(a, b, t) { return a + (b - a) * t; }
function sign(v) { return v < 0 ? -1 : (v > 0 ? 1 : 0); }
function nowMs() { return performance.now(); }

/* シード付き乱数（xorshift32） */
function RNG(seed) {
  this.s = (seed >>> 0) || 1;
  if (this.s === 0) this.s = 0x9e3779b9;
}
RNG.prototype.next = function () {
  var x = this.s;
  x ^= x << 13; x >>>= 0;
  x ^= x >> 17;
  x ^= x << 5; x >>>= 0;
  this.s = x;
  return x / 4294967296;
};
RNG.prototype.int = function (n) { return Math.floor(this.next() * n); };
RNG.prototype.range = function (a, b) { return a + Math.floor(this.next() * (b - a + 1)); };
RNG.prototype.pick = function (arr) { return arr[Math.floor(this.next() * arr.length)]; };
RNG.prototype.shuffle = function (arr) {
  for (var i = arr.length - 1; i > 0; i--) {
    var j = Math.floor(this.next() * (i + 1));
    var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
};
RNG.prototype.chance = function (p) { return this.next() < p; };

var rng = new RNG(Date.now() & 0x7fffffff);   // UI 演出などに使う汎用乱数

/* ---------------------------------------------------------------- 音 */
var Audio_ = {
  ctx: null, on: true, master: null,
  init: function () {
    if (this.ctx) return;
    try {
      var AC = global.AudioContext || global.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.22;
      this.master.connect(this.ctx.destination);
    } catch (e) { this.ctx = null; }
  },
  resume: function () {
    if (this.ctx && this.ctx.state === 'suspended') { try { this.ctx.resume(); } catch (e) {} }
  },
  tone: function (freq, dur, type, vol, delay, slideTo) {
    if (!this.on || !this.ctx) return;
    var t0 = this.ctx.currentTime + (delay || 0);
    var o = this.ctx.createOscillator();
    var g = this.ctx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.3, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0 + dur + 0.03);
  },
  noise: function (dur, vol, filterFreq, delay) {
    if (!this.on || !this.ctx) return;
    var t0 = this.ctx.currentTime + (delay || 0);
    var len = Math.max(1, Math.floor(this.ctx.sampleRate * dur));
    var buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    var src = this.ctx.createBufferSource(); src.buffer = buf;
    var f = this.ctx.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = filterFreq || 1400;
    var g = this.ctx.createGain(); g.gain.value = vol || 0.3;
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t0);
  }
};

var SFX = {

  heal:   function () { Audio_.tone(600, 0.1, 'sine', 0.12, 0, 900); Audio_.tone(900, 0.14, 'sine', 0.08, 0.08, 1200); },
  gold:   function () { Audio_.tone(1200, 0.06, 'square', 0.09); Audio_.tone(1600, 0.08, 'square', 0.07, 0.05); },

  step:   function () { Audio_.tone(200, 0.09, 'triangle', 0.1, 0, 320); },

/* ================================================================
   BGM（Web Audio によるステップシーケンサー）
   ================================================================ */
var NOTE = { C: 0, Cs: 1, D: 2, Ds: 3, E: 4, F: 5, Fs: 6, G: 7, Gs: 8, A: 9, As: 10, B: 11 };
function freqOf(semi) { return 440 * Math.pow(2, (semi - 9) / 12); }

/* 曲：コード進行（ルート半音・和音の構成音）とテンポ */
var TRACKS = {
  title:  { bpm: 76,  root: NOTE.A, prog: [[0, 3, 7], [-4, 0, 3], [-7, -3, 0], [-5, -1, 2]], drums: false, lead: 'slow', wave: 'triangle' },
  map:    { bpm: 92,  root: NOTE.D, prog: [[0, 3, 7], [-3, 0, 5], [-5, -1, 2], [-7, -4, 0]], drums: 'soft', lead: 'slow', wave: 'triangle' },
  combat: { bpm: 126, root: NOTE.A, prog: [[0, 3, 7], [-2, 3, 5], [-4, 0, 3], [-5, -1, 2]], drums: true, lead: 'fast', wave: 'square' },
  elite:  { bpm: 138, root: NOTE.E, prog: [[0, 3, 6], [-1, 2, 5], [0, 3, 7], [-3, 1, 4]], drums: true, lead: 'fast', wave: 'sawtooth' },
  boss:   { bpm: 148, root: NOTE.C, prog: [[0, 3, 6], [-2, 1, 5], [-4, 0, 3], [-1, 2, 6]], drums: true, lead: 'fast', wave: 'sawtooth' },
  shop:   { bpm: 104, root: NOTE.F, prog: [[0, 4, 7], [-3, 2, 5], [-5, 0, 4], [-1, 2, 7]], drums: 'soft', lead: 'slow', wave: 'triangle' },
  rest:   { bpm: 68,  root: NOTE.G, prog: [[0, 4, 7], [-5, 0, 4], [-3, 2, 7], [-7, -3, 0]], drums: false, lead: 'slow', wave: 'sine' }
};

var BGM = {
  cur: null, step: 0, nextTime: 0, timer: null, gain: null, on: true,
  ensure: function () {
    if (!Audio_.ctx) Audio_.init();
    if (!Audio_.ctx) return false;
    if (!this.gain) {
      this.gain = Audio_.ctx.createGain();
      this.gain.gain.value = 0.0;
      this.gain.connect(Audio_.master);
    }
    return true;
  },
  play: function (name) {
    if (this.cur === name) return;
    this.cur = name;
    this.step = 0;
    if (!this.ensure()) return;
    this.nextTime = Audio_.ctx.currentTime + 0.06;
    var g = this.gain.gain, t = Audio_.ctx.currentTime;
    g.cancelScheduledValues(t);
    g.setValueAtTime(g.value, t);
    g.linearRampToValueAtTime(Audio_.on ? 0.5 : 0, t + 0.5);
    if (!this.timer) {
      var self = this;
      this.timer = setInterval(function () { self.tick(); }, 40);
    }
  },
  stop: function () {
    this.cur = null;
    if (this.gain && Audio_.ctx) {
      var t = Audio_.ctx.currentTime;
      this.gain.gain.cancelScheduledValues(t);
      this.gain.gain.setValueAtTime(this.gain.gain.value, t);
      this.gain.gain.linearRampToValueAtTime(0, t + 0.35);
    }
  },
  setVolume: function () {
    if (!this.gain || !Audio_.ctx) return;
    var t = Audio_.ctx.currentTime;
    this.gain.gain.cancelScheduledValues(t);
    this.gain.gain.linearRampToValueAtTime(Audio_.on && this.cur ? 0.5 : 0, t + 0.2);
  },
  note: function (freq, time, dur, type, vol, detune) {
    var c = Audio_.ctx;
    var o = c.createOscillator(), g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, time);
    if (detune) o.detune.setValueAtTime(detune, time);
    g.gain.setValueAtTime(0.0001, time);
    g.gain.exponentialRampToValueAtTime(vol, time + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
    o.connect(g); g.connect(this.gain);
    o.start(time); o.stop(time + dur + 0.02);
  },
  perc: function (time, kind) {
    var c = Audio_.ctx;
    if (kind === 'kick') {
      var o = c.createOscillator(), g = c.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(130, time);
      o.frequency.exponentialRampToValueAtTime(42, time + 0.12);
      g.gain.setValueAtTime(0.5, time);
      g.gain.exponentialRampToValueAtTime(0.0001, time + 0.16);
      o.connect(g); g.connect(this.gain);
      o.start(time); o.stop(time + 0.18);
    } else {
      var len = Math.floor(c.sampleRate * (kind === 'snare' ? 0.14 : 0.05));
      var buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
      for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
      var src = c.createBufferSource(); src.buffer = buf;
      var f = c.createBiquadFilter();
      f.type = kind === 'snare' ? 'bandpass' : 'highpass';
      f.frequency.value = kind === 'snare' ? 1800 : 7000;
      var g2 = c.createGain(); g2.gain.value = kind === 'snare' ? 0.3 : 0.14;
      src.connect(f); f.connect(g2); g2.connect(this.gain);
      src.start(time);
    }
  },
  tick: function () {
    if (!this.cur || !Audio_.ctx || !this.gain) return;
    if (!Audio_.on) return;
    var T = TRACKS[this.cur] || TRACKS.map;
    var c = Audio_.ctx;
    var stepDur = 60 / T.bpm / 2;   /* 8分音符 */
    if (this.nextTime < c.currentTime) this.nextTime = c.currentTime + 0.05;
    while (this.nextTime < c.currentTime + 0.25) {
      var st = this.step;
      var bar = Math.floor(st / 8) % T.prog.length;
      var chord = T.prog[bar];
      var inBar = st % 8;
      var base = T.root + 36;
      var t = this.nextTime;
      /* ベース */
      if (inBar % 2 === 0) {
        this.note(freqOf(base + chord[0] - 12), t, stepDur * 1.4, 'triangle', 0.26);
      }
      /* アルペジオ */
      var arpIdx = [0, 1, 2, 1, 2, 1, 0, 2][inBar];
      this.note(freqOf(base + 12 + chord[arpIdx]), t, stepDur * 0.9, T.wave, 0.085);
      /* リード */
      if (T.lead === 'fast' && (inBar === 0 || inBar === 3 || inBar === 6)) {
        this.note(freqOf(base + 24 + chord[(arpIdx + 1) % 3]), t, stepDur * 1.3, 'square', 0.05, 6);
      } else if (T.lead === 'slow' && inBar === 0 && bar % 2 === 0) {
        this.note(freqOf(base + 24 + chord[2]), t, stepDur * 3, 'sine', 0.06);
      }
      /* ドラム */
      if (T.drums) {
        if (inBar === 0 || inBar === 4) this.perc(t, 'kick');
        if (T.drums === true) {
          if (inBar === 2 || inBar === 6) this.perc(t, 'snare');
          this.perc(t, 'hat');
        } else if (inBar % 4 === 2) this.perc(t, 'hat');
      }
      this.nextTime += stepDur;
      this.step = (this.step + 1) % (8 * T.prog.length);
    }
  }
};
function sceneTrack() {
  if (scene === 'combat' && game && game.cb) {
    if (game.cb.kind === 'boss') return 'boss';
    if (game.cb.kind === 'elite') return 'elite';
    return 'combat';

  if (scene === 'shop') return 'shop';
  if (scene === 'rest' || scene === 'event' || scene === 'treasure') return 'rest';
  if (scene === 'title' || scene === 'charselect' || scene === 'help') return 'title';
  if (scene === 'gameover' || scene === 'victory') return null;
  return 'map';
}
function updateBgm() {
  var want = sceneTrack();
  if (!want) { if (BGM.cur) BGM.stop(); return; }
  if (BGM.cur !== want) BGM.play(want);
}

/* ================================================================
   カード定義
   ================================================================ */
var CARDS = {};      // id -> 定義
var CARD_LIST = [];  // 全定義（配列）

/*
  def(id, name, cls, type, rarity, cost, opt)
    cls    : 'warrior' | 'shade' | 'automaton' | 'neutral' | 'curse' | 'status'
    type   : 'attack' | 'skill' | 'power' | 'status' | 'curse'
    rarity : 'basic' | 'common' | 'uncommon' | 'rare' | 'special'
    opt.v      : { key:[通常値, 強化値] }
    opt.desc   : function(v, inst) -> 説明文（{} で囲むと強調表示）
    opt.target : 'enemy' | 'none' | 'all' | 'self'
    opt.play   : function(g, inst, target, v)
    opt.costUp : 強化後のコスト
    opt.exhaust, opt.ethereal, opt.innate, opt.retain, opt.unplayable
    opt.xcost  : X コスト
*/
function def(id, name, cls, type, rarity, cost, opt) {
  opt = opt || {};
  var c = {
    id: id, name: name, cls: cls, type: type, rarity: rarity, cost: cost,
    v: opt.v || {}, descFn: opt.desc || function () { return ''; },
    target: opt.target || (type === 'attack' ? 'enemy' : 'none'),
    play: opt.play || function () {},
    costUp: (opt.costUp === undefined ? null : opt.costUp),
    exhaust: !!opt.exhaust, exhaustUp: !!opt.exhaustUp,
    ethereal: !!opt.ethereal, etherealOff: !!opt.etherealOff,
    innate: !!opt.innate, innateUp: !!opt.innateUp,
    retain: !!opt.retain, retainUp: !!opt.retainUp,
    unplayable: !!opt.unplayable,
    xcost: !!opt.xcost,
    upName: opt.upName || null,
    art: opt.art || null,
    canPlay: opt.canPlay || null,
    onDraw: opt.onDraw || null,
    onDiscard: opt.onDiscard || null,
    onExhaust: opt.onExhaust || null,
    onRetainTurn: opt.onRetainTurn || null,
    noUpgrade: !!opt.noUpgrade
  };
  CARDS[id] = c;
  CARD_LIST.push(c);
  return c;
}

/* カード実体 */
var uidSeq = 1;
function mk(id, up) {
  return { id: id, up: !!up, uid: uidSeq++, tmpCost: null, costMod: 0 };
}
function cardDef(inst) { return CARDS[inst.id]; }
function cardVals(inst) {
  var d = CARDS[inst.id], o = {}, k;
  for (k in d.v) { o[k] = inst.up ? d.v[k][1] : d.v[k][0]; }
  return o;
}
function cardName(inst) {
  var d = CARDS[inst.id];
  if (!inst.up || d.type === 'curse' || d.type === 'status') return d.name;
  return (d.upName || d.name) + '+';
}
function cardCost(inst) {
  var d = CARDS[inst.id];
  if (inst.tmpCost !== null && inst.tmpCost !== undefined) return Math.max(0, inst.tmpCost);
  var base = (inst.up && d.costUp !== null) ? d.costUp : d.cost;
  return Math.max(0, base + (inst.costMod || 0));
}
function cardDesc(inst) {
  var d = CARDS[inst.id];
  return d.descFn(cardVals(inst), inst);
}
function cardExhaust(inst) { var d = CARDS[inst.id]; return d.exhaust || (inst.up && d.exhaustUp); }
function cardEthereal(inst) { var d = CARDS[inst.id]; return d.ethereal && !(inst.up && d.etherealOff); }
function cardInnate(inst) { var d = CARDS[inst.id]; return d.innate || (inst.up && d.innateUp); }
function cardRetain(inst) { var d = CARDS[inst.id]; return d.retain || (inst.up && d.retainUp); }
function canUpgrade(inst) {
  var d = CARDS[inst.id];
  return !inst.up && !d.noUpgrade && d.type !== 'curse' && d.type !== 'status';
}

   ================================================================ */
var RELICS = {};
var RELIC_LIST = [];
/* rarity: starter / common / uncommon / rare / boss / shop / event */
function rel(id, name, rarity, icon, desc, hooks, cls) {
  var r = { id: id, name: name, rarity: rarity, icon: icon, desc: desc, hooks: hooks || {}, cls: cls || 'any' };
  RELICS[id] = r; RELIC_LIST.push(r);
  return r;
}

/* ================================================================
   敵データ
   ================================================================ */
var ENEMIES = {};
function ene(id, name, o) {
  o.id = id; o.name = name;
  ENEMIES[id] = o;
  return o;
}
/* plan = { intent, dmg, times, name, run } */
function P(intent, name, run, dmg, times, extra) {
  var p = { intent: intent, name: name, run: run, dmg: dmg || 0, times: times || 1 };
  if (extra) for (var k in extra) p[k] = extra[k];
  return p;
}

/* ================================================================
   ゲーム状態
   ================================================================ */
var game = null;
var SAVE_KEY = 'spireAscent.save.v1';
var STAT_KEY = 'spireAscent.stats.v1';
var scene = 'title';
var overlay = null;     // { type:'handSelect'|'pileSelect'|'deckView'|... }
var msgLog = [];

function newGame(clsId, ascension) {
  var C = CLASSES[clsId];
  var g = {
    player: {
      cls: clsId, name: C.name, hp: C.maxHp, maxHp: C.maxHp, gold: C.gold,
      deck: [], relics: [], potions: [null, null, null], maxPotions: 3,
      baseEnergy: 3, baseDraw: 5
    },
    act: 0, floor: 0, ascension: ascension || 0,
    map: null, node: null, path: [],
    cb: null, seed: Date.now() & 0x7fffffff,
    stats: { kills: 0, elites: 0, bosses: 0, damageDealt: 0, cardsPlayed: 0, turns: 0, floorReached: 0 },
    shopStock: null, eventData: null, rewards: null, restDone: false,
    bottled: {}, potionChance: 0.4, cardRng: new RNG((Date.now() ^ 0x5bf03635) & 0x7fffffff),
    eliteCount: 0, unknownCount: 0, shopSeen: 0
  };
  C.deck.forEach(function (id) { g.player.deck.push(mk(id, false)); });
  if (g.ascension >= 3) g.player.deck.push(mk('ascendersBane', false));
  if (g.ascension >= 4) { g.player.maxHp -= 6; g.player.hp = g.player.maxHp; }
  game = g;
  gainRelic(g, C.relic, true);
  buildMap(g);
  return g;
}

/* ---------------------------------------------------------------- マップ生成 */
var MAP_ROWS = 15, MAP_COLS = 7, MAP_PATHS = 6;
function buildMap(g) {
  var R = new RNG((g.seed + g.act * 7919) & 0x7fffffff);
  var grid = [], r, c;
  for (r = 0; r < MAP_ROWS; r++) { grid.push([]); for (c = 0; c < MAP_COLS; c++) grid[r].push(null); }

  function node(r, c) {
    if (!grid[r][c]) grid[r][c] = { row: r, col: c, type: null, next: [], prev: [], visited: false };
    return grid[r][c];
  }
  var firstCols = {};
  for (var p = 0; p < MAP_PATHS; p++) {
    var col = R.int(MAP_COLS);
    if (p === 1) { var guard = 0; while (firstCols[col] && guard++ < 20) col = R.int(MAP_COLS); }
    firstCols[col] = true;
    var cur = node(0, col);
    for (r = 1; r < MAP_ROWS; r++) {
      var opts = [];
      if (cur.col > 0) opts.push(cur.col - 1);
      opts.push(cur.col);
      if (cur.col < MAP_COLS - 1) opts.push(cur.col + 1);
      /* 交差を避ける：左右への移動が既存エッジと交差する場合は除外 */
      opts = opts.filter(function (nc) {
        if (nc === cur.col) return true;
        var mid = grid[r - 1][nc];
        if (!mid) return true;
        return !mid.next.some(function (n2) { return (nc < cur.col) ? n2.col > nc && n2.col <= cur.col : n2.col < nc && n2.col >= cur.col; });
      });
      var nc2 = opts[R.int(opts.length)];
      var nx = node(r, nc2);
      if (cur.next.indexOf(nx) < 0) { cur.next.push(nx); nx.prev.push(cur); }
      cur = nx;
    }
  }
  /* タイプ割当 */
  var nodes = [];
  for (r = 0; r < MAP_ROWS; r++) for (c = 0; c < MAP_COLS; c++) if (grid[r][c]) nodes.push(grid[r][c]);

  function typeAllowed(n, t) {
    if (t === 'rest' && n.row === MAP_ROWS - 2) return false;
    if ((t === 'rest' || t === 'elite') && n.row < 5) return false;
    if (t === 'shop' && n.row < 3) return false;
    if (t === 'elite' && n.row > MAP_ROWS - 3) return false;
    /* 同じ親から同じ種類（rest/shop/elite）が2つ出ない、直前と同じにしない */
    if (t === 'rest' || t === 'shop' || t === 'elite') {
      for (var i = 0; i < n.prev.length; i++) {
        if (n.prev[i].type === t) return false;
        for (var j = 0; j < n.prev[i].next.length; j++) if (n.prev[i].next[j].type === t) return false;
      }
    }
    return true;
  }
  var weights = [['monster', 45], ['event', 22], ['elite', 16], ['rest', 12], ['shop', 5]];
  nodes.forEach(function (n) {
    if (n.row === 0) { n.type = 'monster'; return; }
    if (n.row === 8) { n.type = 'treasure'; return; }
    if (n.row === MAP_ROWS - 1) { n.type = 'rest'; return; }
    var total = 0, i;
    var pool = weights.filter(function (w) { return typeAllowed(n, w[0]); });
    for (i = 0; i < pool.length; i++) total += pool[i][1];
    var roll = R.next() * total, acc = 0;
    for (i = 0; i < pool.length; i++) { acc += pool[i][1]; if (roll < acc) { n.type = pool[i][0]; return; } }
    n.type = 'monster';
  });

  g.map = { grid: grid, nodes: nodes, rows: MAP_ROWS, cols: MAP_COLS, bossName: pickBossName(g) };
  g.node = null;
  g.mapScroll = 0;
}
function pickBossName(g) {
  var list = ACTS[g.act].boss;
  var pick = list[(g.seed + g.act * 31) % list.length];
  g.bossEncounter = pick;
  return pick.map(function (id) { return ENEMIES[id].name; }).join(' & ');
}

function nodeAvailable(g, n) {
  if (!g.node) return n.row === 0;
  return g.node.next.indexOf(n) >= 0;
}

/* ---------------------------------------------------------------- 進行 */
function enterNode(g, n) {
  g.node = n;
  g.floor++;
  g.stats.floorReached = Math.max(g.stats.floorReached, g.floor);
  n.visited = true;
  saveGame(g);
  switch (n.type) {
    case 'monster': startCombat(g, pickEncounter(g, 'normal'), 'normal'); break;
    case 'elite': g.eliteCount++; startCombat(g, pickEncounter(g, 'elite'), 'elite'); break;
    case 'boss': startCombat(g, g.bossEncounter, 'boss'); break;
    case 'rest': openRest(g); break;
    case 'shop': openShop(g); break;
    case 'treasure': openTreasure(g); break;
    case 'event': openEvent(g); break;
  }
}
function pickEncounter(g, kind) {
  var A = ACTS[g.act];
  var pool;
  if (kind === 'elite') pool = A.elite;
  else if (kind === 'boss') pool = A.boss;
  else {
    g.normalCount = (g.normalCount || 0) + 1;
    pool = (g.normalCount <= 3) ? A.weak : A.normal;
  }
  var enc = rng.pick(pool);
  if (g.lastEnc && pool.length > 1 && enc.join() === g.lastEnc) enc = rng.pick(pool);
  g.lastEnc = enc.join();
  return enc.slice();
}

function goToMap(g) {
  scene = 'map';
  overlay = null;
  centerMap(g);
  saveGame(g);
}
function centerMap(g) {
  if (!g.map) return;
  var geo = mapGeom(g);
  var row = g.node ? g.node.row : 0;
  var target = row * geo.rowGap - 150;
  g.mapScroll = clamp(target, 0, Math.max(0, geo.totalH - (VH - 150)));
}

function nextAct(g) {
  g.act++;
  if (g.act >= ACTS.length) { winRun(g); return; }
  g.normalCount = 0;
  buildMap(g);
  scene = 'map';
  toast(g, ACTS[g.act].name + ' へ');
  saveGame(g);
}

function winRun(g) {
  scene = 'victory';
  SFX.win();
  recordStats(g, true);
  clearSave();
}
function loseRun(g) {
  scene = 'gameover';
  SFX.lose();
  recordStats(g, false);
  clearSave();
}
function recordStats(g, won) {
  var s = loadStats();
  s.runs++;
  if (won) s.wins++;
  s.bestFloor = Math.max(s.bestFloor, g.floor);
  s.totalKills += g.stats.kills;
  if (!s.classWins) s.classWins = {};
  if (won) {
    s.classWins[g.player.cls] = (s.classWins[g.player.cls] || 0) + 1;
    s.maxAsc = Math.max(s.maxAsc || 0, g.ascension);
  }
  try { localStorage.setItem(STAT_KEY, JSON.stringify(s)); } catch (e) {}
}
function loadStats() {
  var s = { runs: 0, wins: 0, bestFloor: 0, totalKills: 0, classWins: {}, maxAsc: 0 };
  try {
    var raw = localStorage.getItem(STAT_KEY);
    if (raw) { var o = JSON.parse(raw); for (var k in o) s[k] = o[k]; }
  } catch (e) {}
  return s;
}

/* ---------------------------------------------------------------- セーブ */
function saveGame(g) {
  if (!g) return;
  try {
    var o = {
      p: {
        cls: g.player.cls, hp: g.player.hp, maxHp: g.player.maxHp, gold: g.player.gold,
        deck: g.player.deck.map(function (c) { return [c.id, c.up ? 1 : 0, c.sbLv || 0, c.gaBonus || 0]; }),
        relics: g.player.relics.map(function (r) { return [r.id, r.n || 0, r.card ? [r.card.id, r.card.up ? 1 : 0] : null]; }),
        potions: g.player.potions, maxPotions: g.player.maxPotions,
        baseEnergy: g.player.baseEnergy, baseDraw: g.player.baseDraw
      },
      act: g.act, floor: g.floor, seed: g.seed, asc: g.ascension,
      map: g.map.nodes.map(function (n) { return [n.row, n.col, n.type, n.visited ? 1 : 0]; }),
      nodeRC: g.node ? [g.node.row, g.node.col] : null,
      stats: g.stats, nc: g.normalCount || 0, ec: g.eliteCount, scene: (scene === 'combat' ? 'map' : scene)
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(o));
  } catch (e) {}
}
function hasSave() {
  try { return !!localStorage.getItem(SAVE_KEY); } catch (e) { return false; }
}
function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }
function loadGame() {
  try {
    var raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    var o = JSON.parse(raw);
    var g = newGame(o.p.cls, o.asc || 0);
    g.player.hp = o.p.hp; g.player.maxHp = o.p.maxHp; g.player.gold = o.p.gold;
    g.player.deck = o.p.deck.map(function (a) { var c = mk(a[0], !!a[1]); c.sbLv = a[2] || 0; c.gaBonus = a[3] || 0; return c; });
    g.player.relics = [];
    o.p.relics.forEach(function (a) {
      var r = { id: a[0], n: a[1] || 0 };
      if (a[2]) r.card = mk(a[2][0], !!a[2][1]);
      g.player.relics.push(r);
    });
    g.player.potions = o.p.potions; g.player.maxPotions = o.p.maxPotions;
    g.player.baseEnergy = o.p.baseEnergy; g.player.baseDraw = o.p.baseDraw;
    g.act = o.act; g.floor = o.floor; g.seed = o.seed;
    g.stats = o.stats || g.stats; g.normalCount = o.nc || 0; g.eliteCount = o.ec || 0;
    buildMap(g);
    o.map.forEach(function (a) {
      var n = g.map.grid[a[0]] && g.map.grid[a[0]][a[1]];
      if (n) { n.type = a[2]; n.visited = !!a[3]; }
    });
    if (o.nodeRC && g.map.grid[o.nodeRC[0]]) g.node = g.map.grid[o.nodeRC[0]][o.nodeRC[1]] || null;
    game = g;
    scene = 'map';
    return true;
  } catch (e) { return false; }
}

/* ---------------------------------------------------------------- 汎用ゲーム操作 */
function arrRemove(arr, item) { var i = arr.indexOf(item); if (i >= 0) arr.splice(i, 1); return i >= 0; }
function gainGold(g, n) {
  if (hasRelic(g, 'shopCourier')) n = Math.floor(n * 1.1);
  g.player.gold += n;
  SFX.gold();
  toast(g, 'ゴールド +' + n);
}
function hasRelic(g, id) { return g.player.relics.some(function (r) { return r.id === id; }); }
function getRelic(g, id) { for (var i = 0; i < g.player.relics.length; i++) if (g.player.relics[i].id === id) return g.player.relics[i]; return null; }
function gainRelic(g, id, silent) {
  if (!RELICS[id] || hasRelic(g, id)) return null;
  var inst = { id: id, n: 0 };
  g.player.relics.push(inst);
  var d = RELICS[id];
  if (d.hooks.pickup) d.hooks.pickup(g, inst);
  if (!silent) { toast(g, d.icon + ' ' + d.name + ' を手に入れた'); SFX.power(); }
  saveGame(g);
  return d;
}
function bottlePick(g, r, type) {
  var pool = g.player.deck.filter(function (c) { return CARDS[c.id].type === type; });
  if (!pool.length) return;
  openDeckSelect(g, '瓶に封入するカードを選ぶ', function (ci) { if (ci) r.card = ci; },
    function (c) { return CARDS[c.id].type === type; });
}
function relicHook(g, name, a, b) {
  if (!g.player) return;
  for (var i = 0; i < g.player.relics.length; i++) {
    var r = g.player.relics[i], d = RELICS[r.id];
    if (d && d.hooks[name]) d.hooks[name](g, r, a, b);
  }
}
function relicSum(g, name) {
  var s = 0;
  for (var i = 0; i < g.player.relics.length; i++) {
    var r = g.player.relics[i], d = RELICS[r.id];
    if (d && d.hooks[name]) s += d.hooks[name](g, r) || 0;
  }
  return s;
}
function grantRandomRelic(g, forceRarity) {
  var pool = RELIC_LIST.filter(function (r) {
    if (hasRelic(g, r.id)) return false;
    if (r.cls !== 'any' && r.cls !== g.player.cls) return false;
    if (r.rarity === 'starter' || r.rarity === 'boss' || r.rarity === 'shop') return false;
    if (forceRarity) return r.rarity === forceRarity;
    return true;
  });
  if (!pool.length) return null;
  var pick = rng.pick(pool);
  return gainRelic(g, pick.id);
}
function randomRelicId(g, rarity) {
  var pool = RELIC_LIST.filter(function (r) {
    if (hasRelic(g, r.id)) return false;
    if (r.cls !== 'any' && r.cls !== g.player.cls) return false;
    if (rarity) return r.rarity === rarity;
    return r.rarity === 'common' || r.rarity === 'uncommon' || r.rarity === 'rare';
  });
  if (!pool.length) return null;
  return rng.pick(pool).id;
}
function randomCurseId() {
  return rng.pick(['regret', 'pain', 'doubt', 'clumsy', 'shame', 'decay', 'injury', 'normality']);
}
function addCardToDeck(g, id, up) {
  g.player.deck.push(mk(id, up));
  if (CARDS[id].type === 'curse' && hasRelic(g, 'darkstonePeriapt')) { g.player.maxHp += 6; g.player.hp += 6; }
  saveGame(g);
}
function removeCardFromDeck(g, ci) {
  if (!ci) return;
  if (ci.id === 'ascendersBane') return;
  if (ci.id === 'parasite') { g.player.maxHp = Math.max(1, g.player.maxHp - 3); g.player.hp = Math.min(g.player.hp, g.player.maxHp); }
  arrRemove(g.player.deck, ci);
  saveGame(g);
}
function upgradeRandomDeck(g, n) {
  var pool = g.player.deck.filter(function (c) { return canUpgrade(c); });
  rng.shuffle(pool);
  for (var i = 0; i < n && i < pool.length; i++) pool[i].up = true;
  saveGame(g);
}
function upgradeRandom(g, type, n) {
  var pool = g.player.deck.filter(function (c) { return canUpgrade(c) && CARDS[c.id].type === type; });
  rng.shuffle(pool);
  for (var i = 0; i < n && i < pool.length; i++) pool[i].up = true;
}
function healP2(g, n) {
  if (n <= 0) return;
  g.player.hp = Math.min(g.player.maxHp, g.player.hp + n);
  SFX.heal();
}
function addPotion(g, id) {
  if (!id) return false;
  for (var i = 0; i < g.player.maxPotions; i++) {
    if (!g.player.potions[i]) { g.player.potions[i] = id; SFX.potion(); return true; }
  }
  return false;
}
function randomPotionId(g) {
  var pool = POTION_LIST.filter(function (p) { return p.cls === 'any' || p.cls === g.player.cls; });
  var roll = rng.next(), rarity = roll < 0.65 ? 'common' : (roll < 0.90 ? 'uncommon' : 'rare');
  var sub = pool.filter(function (p) { return p.rarity === rarity; });
  if (!sub.length) sub = pool;
  return rng.pick(sub).id;
}
function potionSlotsFree(g) {
  var n = 0;
  for (var i = 0; i < g.player.maxPotions; i++) if (!g.player.potions[i]) n++;
  return n;
}

/* ================================================================
   戦闘エンジン
   ================================================================ */
function getBuff(c, k) { return (c && c.buffs && c.buffs[k]) || 0; }
function setBuff(c, k, v) { if (v === 0) delete c.buffs[k]; else c.buffs[k] = v; }
function removeBuff(c, k) { delete c.buffs[k]; }

function applyBuff(g, c, k, n) {
  if (!c || n === 0) return;
  if (!c.buffs) c.buffs = {};
  c.buffs[k] = (c.buffs[k] || 0) + n;
  if (c.buffs[k] === 0) delete c.buffs[k];
  if (n > 0 && BUFFS[k] && BUFFS[k].good) { SFX.buff(); floatDamage(g, c, buffIcon(k) + (BUFFS[k].name), '#7fe08a', -18); }
}
function applyDebuff(g, c, k, n) {
  if (!c) return;
  if (!c.buffs) c.buffs = {};
  var negative = (n > 0 && BUFFS[k] && !BUFFS[k].good) || (n < 0);
  if (negative && getBuff(c, 'artifact') > 0) {
    c.buffs.artifact--; if (!c.buffs.artifact) delete c.buffs.artifact;
    floatDamage(g, c, '無効化', '#8fd0ff', -18);
    return;
  }
  c.buffs[k] = (c.buffs[k] || 0) + n;
  if (c.buffs[k] === 0) delete c.buffs[k];
  SFX.debuff();
  floatDamage(g, c, buffIcon(k) + buffName(k), '#ff9f9f', -18);
  if (!c.isPlayer && negative) {
    var sad = getBuff(g.cb.player, 'sadistic');
    if (sad > 0) dmgToRaw(g, c, sad);
  }
}
function clearPlayerBuffs(g) {
  var p = g.cb.player, k;
  for (k in p.buffs) if (BUFFS[k] && BUFFS[k].good) delete p.buffs[k];
}

function aliveEnemies(g) { return g.cb ? g.cb.enemies.filter(function (e) { return e.hp > 0 && !e.escaped; }) : []; }
function randomEnemy(g) { var a = aliveEnemies(g); return a.length ? rng.pick(a) : null; }
function randomOtherEnemy(g, e) { var a = aliveEnemies(g).filter(function (x) { return x !== e; }); return a.length ? rng.pick(a) : null; }
function mostHurtOther(g, e) {
  var a = aliveEnemies(g).filter(function (x) { return x !== e && x.hp < x.maxHp; });
  a.sort(function (p, q) { return (p.hp / p.maxHp) - (q.hp / q.maxHp); });
  return a[0] || null;
}
function lowestHpEnemy(g) {
  var a = aliveEnemies(g);
  if (!a.length) return null;
  a.sort(function (p, q) { return p.hp - q.hp; });
  return a[0];
}
function allCombatCards(g) { return g.cb.hand.concat(g.cb.draw, g.cb.discard, g.cb.exhaust); }

/* ---- ダメージ計算 ---- */
function calcPlayerDamage(g, base, target) {
  var p = g.cb.player;
  var d = base + getBuff(p, 'str') + getBuff(p, 'vigor');
  if (getBuff(p, 'weak') > 0) d = Math.floor(d * 0.75);
  if (target && getBuff(target, 'vuln') > 0) d = Math.floor(d * 1.5);
  if (getBuff(p, 'phantasmal') > 0) d *= 2;
  if (d < 0) d = 0;
  if (hasRelic(g, 'theBoot') && d > 0 && d < 5) d = 5;
  return d;
}
function calcEnemyDamage(g, e, base) {
  var d = base + getBuff(e, 'str');
  if (getBuff(e, 'weak') > 0) d = Math.floor(d * 0.75);
  if (getBuff(g.cb.player, 'vuln') > 0) d = Math.floor(d * 1.5);
  return Math.max(0, d);
}

/* creature にダメージを与える（ブロック考慮）。HPに通った量を返す */
function damageCreature(g, c, amount, opts) {
  opts = opts || {};
  if (amount <= 0 || c.hp <= 0) return 0;
  if (getBuff(c, 'intangible') > 0 && !opts.pierce) amount = Math.min(amount, 1);
  if (c.isPlayer) {
    if (hasRelic(g, 'torii') && amount <= 5 && !opts.noRelic) amount = 1;
    if (getBuff(c, 'invincible') > 0) amount = Math.min(amount, c.invincibleLeft || amount);
  }
  var blocked = 0;
  if (!opts.pierce) {
    blocked = Math.min(c.block, amount);
    c.block -= blocked;
    amount -= blocked;
    if (blocked > 0) SFX.block();
  }
  if (getBuff(c, 'plated') > 0 && opts.fromAttack) applyBuff(g, c, 'plated', -1);
  if (getBuff(c, 'flight') > 0 && opts.fromAttack) { applyBuff(g, c, 'flight', -1); }
  if (amount > 0) {
    if (c.isPlayer && hasRelic(g, 'tungstenRod')) amount = Math.max(0, amount - 1);
    if (c.isPlayer && getBuff(c, 'buffer') > 0) {
      applyBuff(g, c, 'buffer', -1);
      floatDamage(g, c, 'BUFFER', '#8fd0ff');
      return 0;
    }
    if (!c.isPlayer && getBuff(c, 'buffer') > 0) { applyBuff(g, c, 'buffer', -1); return 0; }
    c.hp -= amount;
    if (c.isPlayer) { g.player.hp = Math.max(0, c.hp); onPlayerDamaged(g, amount, opts); }
    else { c.dmgTaken = (c.dmgTaken || 0) + amount; }
    shake(g, c, Math.min(14, 4 + amount * 0.35));
    floatDamage(g, c, '-' + amount, c.isPlayer ? '#ff6b6b' : '#ffffff');
    SFX.hit();
    if (c.hp <= 0) {
      c.hp = 0;
      if (c.isPlayer) onPlayerDeath(g);
      else onEnemyDeath(g, c);
    }
  } else if (blocked > 0) {
    floatDamage(g, c, 'BLOCK', '#8fd0ff');
  }
  return amount;
}

function onPlayerDamaged(g, amount, opts) {
  var p = g.cb.player;
  relicHook(g, 'onLoseHp');
  if (getBuff(p, 'staticDis') > 0) { for (var i = 0; i < getBuff(p, 'staticDis'); i++) channelOrb(g, 'lightning'); }
  if (getBuff(p, 'rupture') > 0 && opts && opts.selfInflicted) applyBuff(g, p, 'str', getBuff(p, 'rupture'));
  if (getBuff(p, 'angry') > 0) applyBuff(g, p, 'str', getBuff(p, 'angry'));
}
function onPlayerDeath(g) {
  /* 妖精のフラスコ / トカゲの尻尾 */
  var fi = g.player.potions.indexOf('fairy');
  if (fi >= 0) {
    g.player.potions[fi] = null;
    g.player.hp = Math.max(1, Math.ceil(g.player.maxHp * 0.3));
    g.cb.player.hp = g.player.hp;
    floatText(g, '妖精が命を繋いだ！', '#ffd6f5');
    SFX.heal();
    return;
  }
  var lt = getRelic(g, 'lizardTail');
  if (lt && !lt.n) {
    lt.n = 1;
    g.player.hp = Math.max(1, Math.ceil(g.player.maxHp * 0.5));
    g.cb.player.hp = g.player.hp;
    floatText(g, 'トカゲの尻尾が身代わりになった！', '#7fe08a');
    SFX.heal();
    return;
  }
  g.player.hp = 0;
  g.cb.dead = true;
  queueAct(g, 900, function () { loseRun(g); });
}
function onEnemyDeath(g, e) {
  if (ENEMIES[e.defId].onDeath) {
    var revived = ENEMIES[e.defId].onDeath(g, e);
    if (revived) return;
  }
  if (getBuff(e, 'corpseExp') > 0) {
    aliveEnemies(g).forEach(function (x) { if (x !== e) damageCreature(g, x, e.maxHp, { pierce: true }); });
  }
  if (getBuff(e, 'splitting') > 0 && !e.hasSplit) { /* 分裂は死亡ではなく半減時 */ }
  e.hp = 0;
  e.dying = 1;
  g.stats.kills++;
  SFX.die();
  relicHook(g, 'onKill');
  /* 親玉が死んだら手下は逃げる */
  if (ENEMIES[e.defId].boss) {
    aliveEnemies(g).forEach(function (x) { if (ENEMIES[x.defId].minion) { x.escaped = true; x.hp = 0; } });
  }
}

/* ---- プレイヤーの攻撃 ---- */
function dmgTo(g, target, base) {
  if (!target || target.hp <= 0) { target = randomEnemy(g); if (!target) return 0; }
  var amount = calcPlayerDamage(g, base, target);
  var dealt = damageCreature(g, target, amount, { fromAttack: true });
  g.stats.damageDealt += dealt;
  SFX.slash();
  spawnSlash(g, target);
  /* 攻撃後の効果 */
  var p = g.cb.player;
  if (getBuff(p, 'vigor') > 0) removeBuff(p, 'vigor');
  if (dealt > 0 && getBuff(p, 'envenom') > 0) applyPoison(g, target, getBuff(p, 'envenom'));
  if (target.hp > 0 && getBuff(target, 'thorns') > 0) damageCreature(g, g.cb.player, getBuff(target, 'thorns'), { pierce: false });
  return dealt;
}
function dmgToRaw(g, target, amount) {
  if (!target || target.hp <= 0) return 0;
  var dealt = damageCreature(g, target, amount, {});
  g.stats.damageDealt += dealt;
  return dealt;
}
function dmgAll(g, base) {
  aliveEnemies(g).forEach(function (e) { dmgTo(g, e, base); });
}
function dmgAllRaw(g, amount) {
  aliveEnemies(g).forEach(function (e) { dmgToRaw(g, e, amount); });
}

/* ---- ブロック ---- */
function gainBlock(g, n) {
  var p = g.cb.player;
  var v = n + getBuff(p, 'dex');
  if (getBuff(p, 'frail') > 0) v = Math.floor(v * 0.75);
  gainBlockRaw(g, Math.max(0, v));
}
function gainBlockRaw(g, n) {
  if (n <= 0) return;
  g.cb.player.block += n;
  SFX.block();
  floatDamage(g, g.cb.player, '+' + n + '🛡', '#8fd0ff', -10);
  var j = getBuff(g.cb.player, 'juggernaut');
  if (j > 0) { var e = randomEnemy(g); if (e) dmgToRaw(g, e, j); }
}

/* ---- HP ---- */
function healP(g, n) {
  if (n <= 0) return;
  if (hasRelic(g, 'magicFlower') && g.cb) n = Math.floor(n * 1.5);
  g.player.hp = Math.min(g.player.maxHp, g.player.hp + n);
  if (g.cb) { g.cb.player.hp = g.player.hp; floatDamage(g, g.cb.player, '+' + n, '#7fe08a', -10); }
  SFX.heal();
}
function loseHpP(g, n) {
  if (n <= 0) return;
  g.player.hp -= n;
  if (g.cb) {
    g.cb.player.hp = g.player.hp;
    floatDamage(g, g.cb.player, '-' + n, '#ff8f8f');
    onPlayerDamaged(g, n, { selfInflicted: true });
    if (g.player.hp <= 0) onPlayerDeath(g);
  } else if (g.player.hp <= 0) { g.player.hp = 1; }
  shake(g, g.cb ? g.cb.player : null, 6);
}
function applyPoison(g, target, n) {
  if (!target || n <= 0) return;
  applyDebuff(g, target, 'poison', n);
}

/* ---- エナジー / ドロー ---- */
function gainEnergy(g, n) {
  g.cb.energy += n;
  if (n > 0) floatText(g, 'エナジー +' + n, '#ffd45e');
}
function drawCards(g, n) {
  if (getBuff(g.cb.player, 'noDraw') > 0) return;
  for (var i = 0; i < n; i++) {
    if (g.cb.hand.length >= 10) { floatText(g, '手札がいっぱい', '#ff9f9f'); break; }
    if (!g.cb.draw.length) {
      if (!g.cb.discard.length) break;
      reshuffle(g);
    }
    var c = g.cb.draw.pop();
    g.cb.hand.push(c);
    c.drawAnim = 1;
    var d = CARDS[c.id];
    if (d.onDraw) d.onDraw(g, c);
    if (d.type === 'status') {
      var ev = getBuff(g.cb.player, 'evolve');
      if (ev > 0) drawCards(g, ev);
    }
    if (d.type === 'status' || d.type === 'curse') {
      var fb = getBuff(g.cb.player, 'fireBreath');
      if (fb > 0) dmgAllRaw(g, fb);
    }
  }
}
function reshuffle(g) {
  if (!g.cb.discard.length) return;
  g.cb.draw = g.cb.discard.slice();
  g.cb.discard.length = 0;
  rng.shuffle(g.cb.draw);
  relicHook(g, 'onShuffle');
  g.cb.shuffleFx = 1;
}
function discardFromHand(g, ci) {
  if (!arrRemove(g.cb.hand, ci)) return;
  ci.tmpCost = null;
  g.cb.discard.push(ci);
  g.cb.discardedThisTurn++;
  var d = CARDS[ci.id];
  if (d.onDiscard) d.onDiscard(g, ci);
  relicHook(g, 'onDiscardCard');
}
function exhaustFromHand(g, ci) {
  if (!arrRemove(g.cb.hand, ci)) return;
  exhaustCard(g, ci);
}
function exhaustCard(g, ci) {
  ci.tmpCost = null;
  g.cb.exhaust.push(ci);
  SFX.exhaust();
  var d = CARDS[ci.id];
  if (d.onExhaust) d.onExhaust(g, ci);
  var p = g.cb.player;
  if (getBuff(p, 'darkEmbrace') > 0) drawCards(g, getBuff(p, 'darkEmbrace'));
  if (getBuff(p, 'feelNoPain') > 0) gainBlock(g, getBuff(p, 'feelNoPain'));
  relicHook(g, 'onExhaustCard');
}
function addInstToHand(g, inst) {
  if (g.cb.hand.length >= 10) { g.cb.discard.push(inst); return; }
  g.cb.hand.push(inst);
  inst.drawAnim = 1;
}
function addToDraw(g, id, up, count) {
  for (var i = 0; i < count; i++) {
    var inst = mk(id, up);
    var pos = g.cb.draw.length ? rng.int(g.cb.draw.length + 1) : 0;
    g.cb.draw.splice(pos, 0, inst);
  }
}
function addCardToPlayerDiscard(g, id, n) {
  for (var i = 0; i < n; i++) g.cb.discard.push(mk(id, false));
  floatText(g, CARDS[id].name + ' ×' + n + ' が捨て札に', '#ff9f9f');
}
function addCardToPlayerDrawTop(g, id, n) {
  for (var i = 0; i < n; i++) g.cb.draw.push(mk(id, false));
  floatText(g, CARDS[id].name + ' ×' + n + ' が山札の上に', '#ff9f9f');
}

/* ---- オーブ ---- */
function channelOrb(g, type) {
  if (!g.cb) return;
  if (g.cb.orbSlots <= 0) return;
  if (g.cb.orbs.length >= g.cb.orbSlots) evokeOrb(g, 0, true);
  g.cb.orbs.push({ type: type, amount: type === 'dark' ? 6 + getBuff(g.cb.player, 'focus') : 0, anim: 1 });
  if (type === 'frost') g.cb.frostChanneled++;
  if (type === 'lightning') g.cb.lightningChanneled++;
  SFX.select();
}
function evokeOrb(g, idx, remove) {
  var o = g.cb.orbs[idx];
  if (!o) return;
  var focus = getBuff(g.cb.player, 'focus');
  if (o.type === 'lightning') {
    var dmg = Math.max(0, 8 + focus);
    if (getBuff(g.cb.player, 'electro') > 0) dmgAll(g, dmg);
    else { var e = randomEnemy(g); if (e) dmgTo(g, e, dmg); }
  } else if (o.type === 'frost') {
    gainBlock(g, Math.max(0, 5 + focus));
  } else if (o.type === 'dark') {
    var tgt = lowestHpEnemy(g);
    if (tgt) dmgToRaw(g, tgt, Math.max(0, o.amount));
  } else if (o.type === 'plasma') {
    gainEnergy(g, 2);
  }
  if (remove !== false) g.cb.orbs.splice(idx, 1);
}
function evokeRight(g, times, removeAfter) {
  if (!g.cb.orbs.length) return;
  var idx = g.cb.orbs.length - 1;
  for (var i = 0; i < times; i++) {
    if (!g.cb.orbs[idx]) break;
    evokeOrb(g, idx, i === times - 1 ? true : false);
  }
}
function orbPassive(g) {
  var focus = getBuff(g.cb.player, 'focus');
  g.cb.orbs.forEach(function (o) {
    if (o.type === 'lightning') {
      var dmg = Math.max(0, 3 + focus);
      if (getBuff(g.cb.player, 'electro') > 0) dmgAll(g, dmg);
      else { var e = randomEnemy(g); if (e) dmgTo(g, e, dmg); }
    } else if (o.type === 'frost') {
      gainBlock(g, Math.max(0, 2 + focus));
    } else if (o.type === 'dark') {
      o.amount += Math.max(0, 6 + focus);
    } else if (o.type === 'plasma') {
      applyBuff(g, g.cb.player, 'energized', 1);
    }
  });
}

/* ---------------------------------------------------------------- 戦闘開始 */
function makeEnemy(g, id, index) {
  var d = ENEMIES[id];
  var asc = g.ascension;
  var hp = rng.range(d.hp[0], d.hp[1]);
  if (asc >= 1 && !d.elite && !d.boss) hp = Math.ceil(hp * 1.1);
  if (asc >= 2 && (d.elite || d.boss)) hp = Math.ceil(hp * 1.12);
  var e = {
    defId: id, name: d.name, hp: hp, maxHp: hp, block: d.startBlock || 0,
    buffs: {}, plan: null, slotIndex: index, x: 0, y: 0, shakeT: 0, dying: 0,
    art: d.art, color: d.color, scale: d.scale || 1, minion: !!d.minion,
    animT: rng.next() * 10, turnCount: 0
  };
  if (d.buffs) for (var k in d.buffs) e.buffs[k] = d.buffs[k];
  if (d.asleep) e.asleep = true;
  if (asc >= 5) { e.buffs.str = (e.buffs.str || 0) + 1; }
  return e;
}
function startCombat(g, ids, kind) {
  var cb = {
    kind: kind, enemies: [], turn: 0, phase: 'start',
    player: { isPlayer: true, hp: g.player.hp, maxHp: g.player.maxHp, block: 0, buffs: {}, shakeT: 0, x: 0, y: 0 },
    draw: [], hand: [], discard: [], exhaust: [],
    energy: 0, energyPerTurn: g.player.baseEnergy, drawPerTurn: g.player.baseDraw,
    orbs: [], orbSlots: (g.player.cls === 'automaton' ? 3 : 0),
    clawBonus: 0, frostChanneled: 0, lightningChanneled: 0,
    cardsPlayedThisTurn: 0, discardedThisTurn: 0, attacksThisTurn: 0,
    queue: [], floats: [], slashes: [], particles: [],
    selected: null, dragging: null, dragX: 0, dragY: 0, hoverEnemy: null,
    reward: null, dead: false, nightmare: null, retainAll: false,
    echoUsed: false, firstCardThisTurn: true
  };
  g.cb = cb;
  ids.forEach(function (id, i) { cb.enemies.push(makeEnemy(g, id, i)); });
  layoutEnemies(g);

  if (hasRelic(g, 'preservedInsect') && kind === 'elite') {
    cb.enemies.forEach(function (e) { e.hp = Math.ceil(e.hp * 0.75); });
  }
  if (hasRelic(g, 'pantograph') && kind === 'boss') healP(g, 25);

  /* デッキを山札へ */
  cb.draw = g.player.deck.map(function (c) {
    var n = mk(c.id, c.up);
    n.src = c; n.sbLv = c.sbLv || 0; n.gaBonus = c.gaBonus || 0;
    return n;
  });
  rng.shuffle(cb.draw);
  /* 生得カードを上に */
  var innates = cb.draw.filter(function (c) { return cardInnate(c); });
  innates.forEach(function (c) { arrRemove(cb.draw, c); cb.draw.push(c); });
  /* 瓶詰めレリック */
  ['bottledFlame', 'bottledLightning', 'bottledTornado'].forEach(function (rid) {
    var r = getRelic(g, rid);
    if (r && r.card) {
      var found = cb.draw.filter(function (c) { return c.src === r.card; })[0];
      if (found) { arrRemove(cb.draw, found); cb.draw.push(found); found.bottled = true; }
    }
  });
  scene = 'combat';
  cb.phase = 'player';
  cb.banner = {
    t: 0,
    text: kind === 'boss' ? 'BOSS BATTLE' : (kind === 'elite' ? 'ELITE ENEMY' : 'BATTLE START'),
    sub: cb.enemies.map(function (e) { return e.name; }).filter(function (v, i, a) { return a.indexOf(v) === i; }).join('　'),
    col: kind === 'boss' ? '#ff4d6d' : (kind === 'elite' ? '#ff9f4a' : '#ffcf4a')
  };
  relicHook(g, 'combatStart');
  startPlayerTurn(g, true);
}

function layoutEnemies(g) {
  var list = g.cb.enemies.filter(function (e) { return e.hp > 0 || e.dying; });
  var n = list.length;
  if (!n) return;
  var widths = list.map(function (e) { return Math.max(96, 146 * e.scale * 0.8); });
  var gap = n >= 4 ? 12 : (n === 3 ? 20 : 34);
  var total = widths.reduce(function (a, b) { return a + b; }, 0) + gap * (n - 1);
  var minLeft = 352, maxRight = VW - 46;
  var start = 664 - total / 2;
  if (start + total > maxRight) start = maxRight - total;
  if (start < minLeft) start = minLeft;
  var x = start;
  list.forEach(function (e, i) {
    e.baseX = x + widths[i] / 2;
    e.baseY = GROUND_Y;
    x += widths[i] + gap;
  });
}

function startPlayerTurn(g, first) {
  var cb = g.cb, p = cb.player;
  cb.turn++;
  cb.phase = 'player';
  g.stats.turns++;
  cb.cardsPlayedThisTurn = 0;
  cb.discardedThisTurn = 0;
  cb.attacksThisTurn = 0;
  cb.typesPlayed = {};
  cb.echoUsed = false;
  cb.firstCardThisTurn = true;
  cb.retainAll = false;

  /* ブロック持ち越し */
  if (getBuff(p, 'barricade') > 0 || getBuff(p, 'blur') > 0) { /* 維持 */ }
  else if (hasRelic(g, 'calipers')) p.block = Math.max(0, p.block - 15);
  else p.block = 0;
  if (getBuff(p, 'blur') > 0) applyBuff(g, p, 'blur', -1);

  /* エナジー */
  var carry = hasRelic(g, 'iceCream') ? cb.energy : 0;
  cb.energy = carry + cb.energyPerTurn + getBuff(p, 'energized');
  if (getBuff(p, 'energized') > 0) removeBuff(p, 'energized');
  if (!hasRelic(g, 'iceCream')) { /* 持ち越さない（既定） */ }

  /* 毒 */
  var po = getBuff(p, 'poison');
  if (po > 0) { damageCreature(g, p, po, { pierce: true }); applyBuff(g, p, 'poison', -1); }

  /* ターン開始のパワー */
  if (getBuff(p, 'demon') > 0) applyBuff(g, p, 'str', getBuff(p, 'demon'));
  if (getBuff(p, 'brutality') > 0) { loseHpP(g, getBuff(p, 'brutality')); drawCards(g, getBuff(p, 'brutality')); }
  if (getBuff(p, 'wraithForm') > 0) applyBuff(g, p, 'dex', -getBuff(p, 'wraithForm'));
  if (getBuff(p, 'biased') > 0) applyBuff(g, p, 'focus', -1);
  if (getBuff(p, 'noxious') > 0) aliveEnemies(g).forEach(function (e) { applyPoison(g, e, getBuff(p, 'noxious')); });
  if (getBuff(p, 'infBlades') > 0) for (var i = 0; i < getBuff(p, 'infBlades'); i++) addInstToHand(g, mk('shiv', false));
  if (getBuff(p, 'nextBlock') > 0) { gainBlockRaw(g, getBuff(p, 'nextBlock')); removeBuff(p, 'nextBlock'); }
  if (getBuff(p, 'loop') > 0) evokeRight(g, getBuff(p, 'loop'), false);
  if (getBuff(p, 'ritual') > 0) applyBuff(g, p, 'str', getBuff(p, 'ritual'));

  relicHook(g, 'turnStart');

  /* ドロー */
  var n = cb.drawPerTurn + getBuff(p, 'nextTurnDraw');
  if (getBuff(p, 'nextTurnDraw') > 0) removeBuff(p, 'nextTurnDraw');
  if (first) n += relicSum(g, 'combatStartDraw');
  drawCards(g, n);
  if (getBuff(p, 'tools') > 0) {
    drawCards(g, 1);
    if (cb.hand.length) startHandSelect(g, '捨てるカードを選ぶ', 1, false, function (sel) { sel.forEach(function (ci) { discardFromHand(g, ci); }); });
  }
  /* 悪夢 */
  if (cb.nightmare) {
    for (var k = 0; k < 3; k++) addInstToHand(g, mk(cb.nightmare.id, cb.nightmare.up));
    cb.nightmare = null;
  }
  /* スネッコの目 */
  if (hasRelic(g, 'bossSnecko')) {
    cb.hand.forEach(function (ci) { if (!CARDS[ci.id].unplayable && !CARDS[ci.id].xcost) ci.tmpCost = rng.int(4); });
  }
  /* ギャンブルチップ */
  if (first && hasRelic(g, 'gamblingChip') && cb.hand.length) {
    startHandSelect(g, '捨てるカードを選ぶ（引き直す枚数）', cb.hand.length, true, function (sel) {
      sel.forEach(function (ci) { discardFromHand(g, ci); });
      drawCards(g, sel.length);
    });
  }
  /* 敵の意図 */
  planEnemies(g);
  saveGame(g);
}

function planEnemies(g) {
  aliveEnemies(g).forEach(function (e) {
    e.turnCount++;
    var d = ENEMIES[e.defId];
    e.plan = d.ai(e, g, e.turnCount);
  });
}

/* ---------------------------------------------------------------- カード使用 */
function canPlayCard(g, inst) {
  var d = CARDS[inst.id];
  if (d.unplayable) {
    if (d.type === 'curse' && hasRelic(g, 'blueCandle')) return true;
    return false;
  }
  if (getBuff(g.cb.player, 'entangle') > 0 && d.type === 'attack') return false;
  if (hasRelic(g, 'bossVelvetChoker') && g.cb.cardsPlayedThisTurn >= 6) return false;
  if (hasCard(g.player.deck, 'normality') && g.cb.cardsPlayedThisTurn >= 3) return false;
  if (d.canPlay && !d.canPlay(g, inst)) return false;
  var cost = effectiveCost(g, inst);
  return g.cb.energy >= cost;
}
function hasCard(deck, id) { return deck.some(function (c) { return c.id === id; }); }
function effectiveCost(g, inst) {
  var d = CARDS[inst.id];
  if (d.xcost) return 0;
  var cost = cardCost(inst);
  if (d.type === 'skill' && getBuff(g.cb.player, 'corruption') > 0) return 0;
  if (inst.id === 'masterfulStab') cost += (g.player.maxHp - g.player.hp) > 0 ? Math.floor((g.player.maxHp - g.player.hp) / 5) : 0;
  if (inst.id === 'forceField') cost = Math.max(0, cost - (g.cb.powersPlayed || 0) * 3);
  return Math.max(0, cost);
}
function needsTarget(g, inst) {
  var d = CARDS[inst.id];
  if (d.target !== 'enemy') return false;
  return aliveEnemies(g).length > 1;
}

function playCard(g, inst, target) {
  var cb = g.cb, d = CARDS[inst.id], p = cb.player;
  if (!canPlayCard(g, inst)) return false;
  var cost = effectiveCost(g, inst);
  var xval = 0;
  if (d.xcost) { xval = cb.energy; cost = cb.energy; }
  cb.energy -= cost;
  arrRemove(cb.hand, inst);
  cb.cardsPlayedThisTurn++;
  g.stats.cardsPlayed++;
  SFX.card();
  (function () {
    var L = null;
    if (cb.handLayout) { for (var li = 0; li < cb.handLayout.length; li++) if (cb.handLayout[li].inst === inst) L = cb.handLayout[li]; }
    cb.playFx = cb.playFx || [];
    cb.playFx.push({
      inst: inst, t: 0,
      x: L ? L.x : VW / 2 - 66, y: L ? L.y : VH - 190,
      tx: (target && target.hp > 0 && d.target === 'enemy') ? target.baseX - 66 : VW / 2 - 66,
      ty: (target && target.hp > 0 && d.target === 'enemy') ? GROUND_Y - 200 : 220
    });
    if (cb.playFx.length > 4) cb.playFx.shift();
  })();

  if (!target || target.hp <= 0) target = aliveEnemies(g)[0] || null;

  /* カースを青いロウソクで使用 */
  if (d.unplayable && d.type === 'curse') {
    loseHpP(g, 1);
    exhaustCard(g, inst);
    afterCardPlayed(g, inst, d);
    return true;
  }

  var times = 1;
  if (d.type === 'attack' && getBuff(p, 'doubleTap') > 0) { times = 2; applyBuff(g, p, 'doubleTap', -1); }
  if (d.type === 'skill' && getBuff(p, 'burst') > 0) { times = 2; applyBuff(g, p, 'burst', -1); }
  if (d.type === 'power' && getBuff(p, 'amplify') > 0) { times = 2; applyBuff(g, p, 'amplify', -1); }
  if (getBuff(p, 'dupPotion') > 0) { times = Math.max(times, 2); applyBuff(g, p, 'dupPotion', -1); }
  if (cb.firstCardThisTurn && getBuff(p, 'echo') > 0 && !cb.echoUsed) { times = Math.max(times, 2); cb.echoUsed = true; }

  var v = cardVals(inst);
  for (var i = 0; i < times; i++) {
    d.play(g, inst, (target && target.hp > 0) ? target : (aliveEnemies(g)[0] || target), v, xval);
  }
  if (d.type === 'attack') cb.attacksThisTurn++;
  if (d.type === 'power') cb.powersPlayed = (cb.powersPlayed || 0) + 1;

  /* 使用後の行き先 */
  var exhaust = cardExhaust(inst) || (d.type === 'skill' && getBuff(p, 'corruption') > 0);
  if (d.type === 'power') {
    /* パワーは場に消える */
    inst.tmpCost = null;
  } else if (exhaust) {
    exhaustCard(g, inst);
  } else {
    inst.tmpCost = null;
    if (cb.reboundNext) { cb.draw.push(inst); cb.reboundNext = false; }
    else cb.discard.push(inst);
  }
  afterCardPlayed(g, inst, d);
  return true;
}

function afterCardPlayed(g, inst, d) {
  var cb = g.cb, p = cb.player;
  cb.firstCardThisTurn = false;
  relicHook(g, 'onPlayCard', inst);
  if (getBuff(p, 'rage') > 0 && d.type === 'attack') gainBlock(g, getBuff(p, 'rage'));
  if (getBuff(p, 'thousandCuts') > 0) dmgAllRaw(g, getBuff(p, 'thousandCuts'));
  if (getBuff(p, 'afterImage') > 0) gainBlock(g, getBuff(p, 'afterImage'));
  if (getBuff(p, 'heatsinks') > 0 && d.type === 'power') drawCards(g, getBuff(p, 'heatsinks'));
  if (getBuff(p, 'storm') > 0 && d.type === 'power') channelOrb(g, 'lightning');
  /* 敵側の反応 */
  aliveEnemies(g).forEach(function (e) {
    if (getBuff(e, 'choke') > 0) damageCreature(g, p, getBuff(e, 'choke'), { pierce: true });
    if (getBuff(e, 'painful') > 0) damageCreature(g, p, getBuff(e, 'painful'), {});
    if (getBuff(e, 'nobRage') > 0 && d.type === 'skill') applyBuff(g, e, 'str', 2);
    if (getBuff(e, 'beatOfDeath') > 0) damageCreature(g, p, getBuff(e, 'beatOfDeath'), {});
    if (getBuff(e, 'timeWarp') > 0) {
      e.warpCount = (e.warpCount || 0) + 1;
      if (e.warpCount >= 12) { e.warpCount = 0; applyBuff(g, e, 'str', 2); floatText(g, '時が止まった！ ターン終了', '#7fe0e0'); queueAct(g, 450, function () { endTurn(g); }); }
    }
  });
  /* 苦痛のカース */
  var painCount = cb.hand.filter(function (ci) { return ci.id === 'pain'; }).length;
  if (painCount > 0) damageCreature(g, p, painCount, { pierce: true });
  if (hasRelic(g, 'unceasingTop') && cb.hand.length === 0 && cb.phase === 'player') drawCards(g, 1);
  if (hasRelic(g, 'shopOrangePellets')) {
    cb.typesPlayed = cb.typesPlayed || {};
    cb.typesPlayed[d.type] = 1;
    if (cb.typesPlayed.attack && cb.typesPlayed.skill && cb.typesPlayed.power) {
      cb.typesPlayed = {};
      var removed = 0;
      for (var bk in p.buffs) { if (BUFFS[bk] && !BUFFS[bk].good) { delete p.buffs[bk]; removed++; } }
      if (removed) { floatText(g, 'デバフを解除した', '#8fe08a'); }
    }
  }
  checkCombatEnd(g);
}

function playTopCard(g) {
  if (!g.cb.draw.length) { if (g.cb.discard.length) reshuffle(g); else return; }
  var c = g.cb.draw.pop();
  var d = CARDS[c.id];
  if (d.unplayable) { g.cb.discard.push(c); return; }
  g.cb.hand.push(c);
  var savedEnergy = g.cb.energy;
  g.cb.energy = 99;
  playCardForced(g, c);
  g.cb.energy = savedEnergy;
}
function playCardForced(g, inst) {
  var d = CARDS[inst.id];
  var target = aliveEnemies(g)[0];
  arrRemove(g.cb.hand, inst);
  g.cb.hand.push(inst);
  playCard(g, inst, target);
  /* 「無謀」で使ったカードは廃棄 */
  if (arrRemove(g.cb.discard, inst)) exhaustCard(g, inst);
}

/* ---------------------------------------------------------------- ターン終了 / 敵ターン */
function endTurn(g) {
  var cb = g.cb, p = cb.player;
  if (cb.phase !== 'player' || overlay) return;
  cb.phase = 'endTurn';
  cb.selected = null;

  /* 火傷 / 呪詛の処理 */
  var burns = cb.hand.filter(function (ci) { return ci.id === 'burn'; });
  burns.forEach(function (ci) { damageCreature(g, p, ci.up ? 4 : 2, { pierce: true }); });
  var regrets = cb.hand.filter(function (ci) { return ci.id === 'regret'; });
  if (regrets.length) damageCreature(g, p, cb.hand.length * regrets.length, { pierce: true });
  if (cb.hand.some(function (ci) { return ci.id === 'doubt'; })) applyDebuff(g, p, 'weak', 1);
  if (cb.hand.some(function (ci) { return ci.id === 'shame'; })) applyDebuff(g, p, 'frail', 1);
  if (cb.hand.some(function (ci) { return ci.id === 'decay'; })) damageCreature(g, p, 2, { pierce: true });

  relicHook(g, 'turnEndPre');

  /* エセリアル / 保持 */
  var retainN = getBuff(p, 'plans');
  var toDiscard = [];
  cb.hand.slice().forEach(function (ci) {
    if (cardEthereal(ci)) { arrRemove(cb.hand, ci); exhaustCard(g, ci); return; }
    if (cardRetain(ci)) return;
    if (cb.retainAll) return;
    if (retainN > 0) { retainN--; return; }
    toDiscard.push(ci);
  });
  toDiscard.forEach(function (ci) { discardFromHand(g, ci); });

  /* パワー系のターン終了処理 */
  if (getBuff(p, 'combust') > 0) { loseHpP(g, 1); dmgAllRaw(g, getBuff(p, 'combust')); }
  if (getBuff(p, 'metallic') > 0) gainBlockRaw(g, getBuff(p, 'metallic'));
  if (getBuff(p, 'plated') > 0) gainBlockRaw(g, getBuff(p, 'plated'));
  if (getBuff(p, 'regen') > 0) { healP(g, getBuff(p, 'regen')); applyBuff(g, p, 'regen', -1); }
  if (getBuff(p, 'strDown') > 0) { applyBuff(g, p, 'str', -getBuff(p, 'strDown')); removeBuff(p, 'strDown'); }
  if (getBuff(p, 'dexDown') > 0) { applyBuff(g, p, 'dex', -getBuff(p, 'dexDown')); removeBuff(p, 'dexDown'); }
  removeBuff(p, 'flameBarrier');
  removeBuff(p, 'rage');
  removeBuff(p, 'vigor');
  orbPassive(g);
  relicHook(g, 'turnEnd');
  decayBuffs(g, p);

  checkCombatEnd(g);
  if (cb.done) return;
  cb.phase = 'enemy';
  runEnemyTurn(g);
}

function decayBuffs(g, c) {
  for (var k in c.buffs) {
    var b = BUFFS[k];
    if (!b) continue;
    if (b.dec === 'turn') {
      c.buffs[k] -= 1;
      if (c.buffs[k] <= 0) delete c.buffs[k];
    }
  }
  if (c.isPlayer) { removeBuff(c, 'phantasmal2'); if (getBuff(c, 'phantasmal') > 0) { c.buffs.phantasmal2 = 1; } }
}

function runEnemyTurn(g) {
  var cb = g.cb;
  var list = aliveEnemies(g);
  var delay = 140;
  list.forEach(function (e) {
    queueAct(g, delay, function () {
      if (!g.cb || g.cb !== cb || cb.done || cb.dead || e.hp <= 0) return;
      /* 毒 */
      var po = getBuff(e, 'poison');
      if (po > 0) {
        damageCreature(g, e, po, { pierce: true });
        applyBuff(g, e, 'poison', -1);
      }
      if (e.hp <= 0) return;
      e.attackAnim = 1;
      if (e.plan && e.plan.run) e.plan.run(g, e);
      /* 敵ターン終了処理 */
      if (getBuff(e, 'ritual') > 0) applyBuff(g, e, 'str', getBuff(e, 'ritual'));
      if (getBuff(e, 'strengthUp') > 0) applyBuff(g, e, 'str', getBuff(e, 'strengthUp'));
      if (getBuff(e, 'metallic') > 0) e.block += getBuff(e, 'metallic');
      if (getBuff(e, 'plated') > 0) e.block += getBuff(e, 'plated');
      if (getBuff(e, 'shackled') > 0) { applyBuff(g, e, 'str', getBuff(e, 'shackled')); removeBuff(e, 'shackled'); }
      decayBuffs(g, e);
      checkCombatEnd(g);
    });
    delay += 520;
  });
  queueAct(g, 220, function () {
    if (!g.cb || g.cb !== cb || cb.done || cb.dead) return;
    aliveEnemies(g).forEach(function (e) { e.block = 0; });
    checkCombatEnd(g);
    if (!cb.done) startPlayerTurn(g);
  });
}

/* 敵の行動ヘルパー */
function eAttack(g, e, base, times) {
  var p = g.cb.player;
  for (var i = 0; i < times; i++) {
    if (p.hp <= 0) break;
    var dmg = calcEnemyDamage(g, e, base);
    var before = p.block;
    var dealt = damageCreature(g, p, dmg, { fromAttack: true });
    spawnSlash(g, p);
    SFX.slash();
    /* 棘・炎の壁 */
    if (getBuff(p, 'thorns') > 0) damageCreature(g, e, getBuff(p, 'thorns'), {});
    if (getBuff(p, 'flameBarrier') > 0) damageCreature(g, e, getBuff(p, 'flameBarrier'), {});
    if (getBuff(e, 'sharp') > 0 && before > 0) damageCreature(g, p, getBuff(e, 'sharp'), { pierce: true });
    if (e.hp <= 0) break;
  }
}
function eBlock(g, e, n) { e.block += n; SFX.block(); floatDamage(g, e, '+' + n + '🛡', '#8fd0ff', -10); }
function eBuff(g, e, k, n) { if (n) applyBuff(g, e, k, n); }
function eDebuffPlayer(g, e, k, n) { applyDebuff(g, g.cb.player, k, n); }
function summonEnemy(g, id) {
  if (g.cb.enemies.filter(function (e) { return e.hp > 0; }).length >= 5) return;
  var e = makeEnemy(g, id, g.cb.enemies.length);
  g.cb.enemies.push(e);
  layoutEnemies(g);
  e.turnCount = 0;
  e.plan = ENEMIES[id].ai(e, g, 1);
  e.spawnAnim = 1;
}

/* ---------------------------------------------------------------- 戦闘終了 */
function checkCombatEnd(g) {
  var cb = g.cb;
  if (!cb || cb.done) return;
  if (g.player.hp <= 0) return;
  /* 分裂チェック */
  cb.enemies.forEach(function (e) {
    if (e.hp > 0 && getBuff(e, 'splitting') > 0 && !e.hasSplit && e.hp <= e.maxHp / 2) {
      e.hasSplit = true;
      var childId = ENEMIES[e.defId].splitInto;
      var hp = e.hp;
      e.hp = 0; e.escaped = true;
      for (var i = 0; i < 2; i++) {
        var c = makeEnemy(g, childId, g.cb.enemies.length);
        c.hp = c.maxHp = hp;
        c.spawnAnim = 1;
        cb.enemies.push(c);
        c.turnCount = 0;
        c.plan = ENEMIES[childId].ai(c, g, 1);
      }
      layoutEnemies(g);
      floatText(g, '分裂した！', '#9fe08a');
    }
    /* モードシフト（守護者） */
    if (e.hp > 0 && getBuff(e, 'modeShift') > 0 && e.dmgTaken >= getBuff(e, 'modeShift') && !e.defensive) {
      e.defensive = true; e.dcyc = 0; e.dmgTaken = 0;
      e.buffs.modeShift = (e.modeShiftMax = (e.modeShiftMax || 30) + 10);
      e.plan = ENEMIES[e.defId].ai(e, g, e.turnCount);
      floatText(g, '防御態勢に移行！', '#8fd0ff');
    }
  });
  if (aliveEnemies(g).length === 0) {
    cb.done = true;
    cb.phase = 'done';
    queueAct(g, 620, function () { endCombat(g); });
  }
}
function endCombat(g) {
  var cb = g.cb;
  if (getBuff(cb.player, 'selfRepair') > 0) healP(g, getBuff(cb.player, 'selfRepair'));
  relicHook(g, 'combatEnd');
  /* 進行状態を戻す */
  g.player.hp = Math.max(0, Math.min(g.player.maxHp, cb.player.hp));
  if (g.player.hp <= 0) { loseRun(g); return; }
  var kind = cb.kind;
  var stolenGold = 0;
  cb.enemies.forEach(function (e) { if (e.stolen) stolenGold += e.stolen; });
  g.cb = null;
  scene = 'reward';
  buildRewards(g, kind, stolenGold);
  saveGame(g);
}
function escapeCombat(g) {
  if (g.cb.kind === 'boss') { floatText(g, 'ボスからは逃げられない！', '#ff9f9f'); return; }
  g.player.hp = Math.max(0, g.cb.player.hp);
  g.cb = null;
  goToMap(g);
}

/* ================================================================
   演出ヘルパー
   ================================================================ */
var toasts = [];
function toast(g, text) { toasts.push({ text: text, t: 0, life: 150 }); if (toasts.length > 5) toasts.shift(); }
function floatText(g, text, color) {
  if (!g || !g.cb) { toast(g, text); return; }
  g.cb.floats.push({ x: 300, y: 200, text: text, color: color || '#fff', t: 0, life: 70, vy: -0.5, big: true });
}
function floatDamage(g, c, text, color, dy) {
  if (!g || !g.cb || !c) return;
  var x = c.isPlayer ? (200 + c.x) : (c.baseX + c.x), y = (c.isPlayer ? 320 : c.baseY) + (dy || 0) + c.y;
  g.cb.floats.push({ x: x + (rng.next() * 30 - 15), y: y, text: text, color: color || '#fff', t: 0, life: 55, vy: -0.9 });
}
function shake(g, c, amt) { if (c) c.shakeT = Math.max(c.shakeT || 0, amt); }
function spawnSlash(g, c) {
  if (!g.cb || !c) return;
  var x = c.isPlayer ? (200 + c.x) : (c.baseX + c.x), y = (c.isPlayer ? 330 : c.baseY) + c.y;
  g.cb.slashes.push({ x: x, y: y, t: 0, life: 16, a: rng.next() * 0.8 - 0.4 });
  for (var i = 0; i < 8; i++) {

/* カード報酬の抽選 */
function rollCardRewards(g, n) {
  var out = [], i, guard = 0;
  var pool = CARD_LIST.filter(function (d) {
    return d.cls === g.player.cls && d.rarity !== 'basic' && d.rarity !== 'special';
  });
  var byRar = { common: [], uncommon: [], rare: [] };
  pool.forEach(function (d) { if (byRar[d.rarity]) byRar[d.rarity].push(d); });
  while (out.length < n && guard++ < 200) {
    var roll = rng.next() + (g.cardLuck || 0);
    var rar = roll < 0.60 ? 'common' : (roll < 0.92 ? 'uncommon' : 'rare');
    var list = byRar[rar];
    if (!list.length) continue;
    var d = rng.pick(list);
    if (out.some(function (o) { return o.id === d.id; })) continue;
    var inst = mk(d.id, false);
    if (rng.chance(0.08 + g.act * 0.03)) { if (canUpgrade(inst)) inst.up = true; }
    out.push(inst);
  }

}

  if (goldAmt) list.push({ type: 'gold', amount: goldAmt });
  var potionChance = 0.4 + (hasRelic(g, 'shopChemical') ? 0.2 : 0);
  if (rng.chance(potionChance)) list.push({ type: 'potion', id: randomPotionId(g) });
  var nCards = 3 + (hasRelic(g, 'bossBusted') ? -2 : 0) + (hasRelic(g, 'questionCard') ? 1 : 0);
  if (kind !== 'shop') list.push({ type: 'card', cards: rollCardRewards(g, Math.max(1, nCards)) });
  if (kind === 'elite' || kind === 'mushroom') {

    rng.shuffle(pool);

  g.treasure = { relic: randomRelicId(g, rarity) || randomRelicId(g), gold: rng.chance(0.5) ? rng.range(25, 75) : 0, potion: rng.chance(0.35) ? randomPotionId(g) : null, opened: false };
}

function openShop(g) {

  var cards = [];

  var colorless = CARD_LIST.filter(function (d) { return d.cls === 'colorless'; });

    cards.push({ inst: mk(d.id, false), price: priceOf(d.rarity) });
  }
  if (colorless.length) {
    cards.push({ inst: mk(colorless[0].id, false), price: priceOf(colorless[0].rarity) });

  cx.moveTo(x + r, y);
  cx.lineTo(x + w - r, y); cx.quadraticCurveTo(x + w, y, x + w, y + r);
  cx.lineTo(x + w, y + h - r); cx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  cx.lineTo(x + r, y + h); cx.quadraticCurveTo(x, y + h, x, y + h - r);
  cx.lineTo(x, y + r); cx.quadraticCurveTo(x, y, x + r, y);
  cx.closePath();
}

  cx.fillStyle = col || '#fff';

}

function wrapTokens(s, size, maxW, weight) {
  cx.font = (weight || '') + ' ' + size + 'px "Hiragino Kaku Gothic ProN","Meiryo",sans-serif';
  var lines = [], cur = [], curW = 0, hi = false, i, ch, w;
  var breakBefore = '、。」）,.!?';
  for (i = 0; i < s.length; i++) {
    ch = s.charAt(i);
    if (ch === '{') { hi = true; continue; }
    if (ch === '}') { hi = false; continue; }
    if (ch === '\n') { lines.push(cur); cur = []; curW = 0; continue; }
    w = cx.measureText(ch).width;
    if (curW + w > maxW && cur.length && breakBefore.indexOf(ch) < 0) { lines.push(cur); cur = []; curW = 0; }
    cur.push({ ch: ch, hi: hi });

}

  var lines = wrapTokens(s, size, maxW, weight);
  cx.font = (weight || '') + ' ' + size + 'px "Hiragino Kaku Gothic ProN","Meiryo",sans-serif';
  cx.textBaseline = 'middle';
  for (var li = 0; li < lines.length; li++) {
    var line = lines[li], lw = 0, k;
    for (k = 0; k < line.length; k++) lw += cx.measureText(line[k].ch).width;
    var px = align === 'center' ? x - lw / 2 : x;
    for (k = 0; k < line.length; k++) {
      cx.fillStyle = line[k].hi ? (hiCol || '#ffe89a') : col;
      cx.fillText(line[k].ch, px, y + li * lineH);
      px += cx.measureText(line[k].ch).width;
    }
  }
  return lines.length * lineH;
}

/* ---------------------------------------------------------------- イミディエイトUI */

function uiBegin() { ui.rects.length = 0; }

  ui.rects.push(o);

var TYPE_COLORS = {
  attack: { bg1: '#4a2222', bg2: '#241012', bar: '#c0483c', name: 'アタック' },
  skill:  { bg1: '#1e3a4a', bg2: '#0f1c26', bar: '#3c8fc0', name: 'スキル' },
  power:  { bg1: '#3d2a4a', bg2: '#1d1426', bar: '#a05fc0', name: 'パワー' },
  status: { bg1: '#33363d', bg2: '#191b20', bar: '#6b7280', name: 'ステータス' },
  curse:  { bg1: '#2a2430', bg2: '#141018', bar: '#4b4453', name: 'カース' }
};
var RARITY_COLORS = { basic: '#9aa0a6', common: '#c9c4b5', uncommon: '#6fc0e0', rare: '#ffcf4a', special: '#c77dff' };

function hashStr(s) { var h = 0; for (var i = 0; i < s.length; i++) { h = (h * 31 + s.charCodeAt(i)) | 0; } return Math.abs(h); }

function drawCardArt(x, y, w, h, inst) {
  var d = CARDS[inst.id];
  var hs = hashStr(inst.id);
  var t = TYPE_COLORS[d.type] || TYPE_COLORS.skill;
  cx.save();
  rr(x, y, w, h, 4); cx.clip();
  var gr = cx.createLinearGradient(x, y, x, y + h);
  gr.addColorStop(0, rgba(t.bar, 0.35));
  gr.addColorStop(1, 'rgba(0,0,0,.45)');
  cx.fillStyle = gr; cx.fillRect(x, y, w, h);
  var ccx = x + w / 2, ccy = y + h / 2, s = Math.min(w, h) * 0.42;
  cx.strokeStyle = 'rgba(255,255,255,.55)'; cx.lineWidth = Math.max(1.2, s * 0.11);
  cx.lineCap = 'round'; cx.lineJoin = 'round';
  cx.fillStyle = rgba(t.bar, 0.85);
  var kind = hs % 8;
  if (d.type === 'attack') {
    if (kind < 3) { /* 剣 */
      cx.beginPath(); cx.moveTo(ccx - s * 0.6, ccy + s * 0.7); cx.lineTo(ccx + s * 0.65, ccy - s * 0.7); cx.stroke();
      cx.beginPath(); cx.moveTo(ccx + s * 0.1, ccy - s * 0.15); cx.lineTo(ccx + s * 0.55, ccy + s * 0.3); cx.stroke();
    } else if (kind < 5) { /* 斬撃 */
      for (var i = 0; i < 3; i++) {
        cx.beginPath();
        cx.moveTo(ccx - s * 0.8 + i * s * 0.3, ccy + s * 0.8);
        cx.quadraticCurveTo(ccx + i * s * 0.1, ccy, ccx + s * 0.4 + i * s * 0.2, ccy - s * 0.8);
        cx.stroke();
      }
    } else if (kind < 7) { /* 拳 */
      cx.beginPath(); cx.arc(ccx, ccy, s * 0.62, 0, TAU); cx.fill();
      cx.beginPath(); cx.arc(ccx, ccy, s * 0.62, 0, TAU); cx.stroke();
      cx.beginPath(); cx.moveTo(ccx - s * 0.3, ccy - s * 0.1); cx.lineTo(ccx + s * 0.3, ccy - s * 0.1); cx.stroke();
    } else { /* 矢 */
      cx.beginPath(); cx.moveTo(ccx - s * 0.7, ccy + s * 0.5); cx.lineTo(ccx + s * 0.7, ccy - s * 0.5); cx.stroke();
      cx.beginPath(); cx.moveTo(ccx + s * 0.7, ccy - s * 0.5); cx.lineTo(ccx + s * 0.2, ccy - s * 0.5);
      cx.moveTo(ccx + s * 0.7, ccy - s * 0.5); cx.lineTo(ccx + s * 0.7, ccy); cx.stroke();
    }
  } else if (d.type === 'skill') {
    if (kind < 3) { /* 盾 */
      cx.beginPath();
      cx.moveTo(ccx, ccy - s * 0.85); cx.lineTo(ccx + s * 0.7, ccy - s * 0.5);
      cx.lineTo(ccx + s * 0.55, ccy + s * 0.45); cx.lineTo(ccx, ccy + s * 0.9);
      cx.lineTo(ccx - s * 0.55, ccy + s * 0.45); cx.lineTo(ccx - s * 0.7, ccy - s * 0.5);
      cx.closePath(); cx.fill(); cx.stroke();
    } else if (kind < 5) { /* 渦 */
      cx.beginPath();
      for (var a = 0; a < TAU * 2.2; a += 0.15) {
        var rr2 = s * 0.15 + a * s * 0.13;
        var px = ccx + Math.cos(a) * rr2, py = ccy + Math.sin(a) * rr2;
        if (a === 0) cx.moveTo(px, py); else cx.lineTo(px, py);
      }
      cx.stroke();
    } else if (kind < 7) { /* 羽根 */
      cx.beginPath();
      cx.moveTo(ccx - s * 0.6, ccy + s * 0.7);
      cx.quadraticCurveTo(ccx - s * 0.2, ccy - s * 0.9, ccx + s * 0.7, ccy - s * 0.6);
      cx.quadraticCurveTo(ccx + s * 0.2, ccy + s * 0.3, ccx - s * 0.6, ccy + s * 0.7);
      cx.fill(); cx.stroke();
    } else { /* 三日月 */
      cx.beginPath(); cx.arc(ccx + s * 0.15, ccy, s * 0.75, 0.6, TAU - 0.6); cx.stroke();
      cx.beginPath(); cx.arc(ccx - s * 0.25, ccy, s * 0.45, 0, TAU); cx.fill();
    }
  } else if (d.type === 'power') {
    cx.beginPath(); cx.arc(ccx, ccy, s * 0.5, 0, TAU); cx.fill();
    for (var k = 0; k < 6; k++) {
      var an = k * TAU / 6 + (hs % 10) * 0.1;
      cx.beginPath();
      cx.moveTo(ccx + Math.cos(an) * s * 0.62, ccy + Math.sin(an) * s * 0.62);
      cx.lineTo(ccx + Math.cos(an) * s * 0.95, ccy + Math.sin(an) * s * 0.95);
      cx.stroke();
    }
  } else {
    cx.beginPath(); cx.arc(ccx, ccy, s * 0.7, 0, TAU); cx.stroke();
    cx.beginPath(); cx.moveTo(ccx - s * 0.45, ccy - s * 0.45); cx.lineTo(ccx + s * 0.45, ccy + s * 0.45);
    cx.moveTo(ccx + s * 0.45, ccy - s * 0.45); cx.lineTo(ccx - s * 0.45, ccy + s * 0.45); cx.stroke();
  }
  cx.restore();
}

function drawCard(x, y, w, h, inst, opts) {
  opts = opts || {};
  var d = CARDS[inst.id];
  var t = TYPE_COLORS[d.type] || TYPE_COLORS.skill;
  var scale = opts.scale || 1;
  cx.save();
  if (opts.rot) { cx.translate(x + w / 2, y + h / 2); cx.rotate(opts.rot); cx.translate(-(x + w / 2), -(y + h / 2)); }
  if (opts.shadow !== false) { cx.shadowColor = 'rgba(0,0,0,.55)'; cx.shadowBlur = 12 * scale; cx.shadowOffsetY = 4 * scale; }
  var gr = cx.createLinearGradient(x, y, x, y + h);
  gr.addColorStop(0, t.bg1); gr.addColorStop(1, t.bg2);
  fillRR(x, y, w, h, 9 * scale, gr);
  cx.shadowColor = 'transparent'; cx.shadowBlur = 0; cx.shadowOffsetY = 0;
  /* レアリティ枠 */
  var rc = RARITY_COLORS[d.rarity] || '#c9c4b5';
  if (inst.up) rc = '#7fe08a';
  strokeRR(x + 1, y + 1, w - 2, h - 2, 8 * scale, rc, opts.selected ? 2.6 : 1.6);
  if (opts.glow) {
    cx.save(); cx.shadowColor = opts.glow; cx.shadowBlur = 18;
    strokeRR(x + 1, y + 1, w - 2, h - 2, 8 * scale, opts.glow, 2);
    cx.restore();
  }
  /* 名前帯 */
  var nameH = h * 0.145;
  var nameL = x + w * 0.305, nameR = x + w - 5 * scale;
  fillRR(nameL - 4, y + 4 * scale, nameR - nameL + 4, nameH, 5 * scale, 'rgba(0,0,0,.5)');
  var nm = cardName(inst);
  var nsz = w * 0.112;
  cx.font = '700 ' + nsz + 'px "Hiragino Kaku Gothic ProN","Meiryo",sans-serif';
  while (cx.measureText(nm).width > (nameR - nameL - 6) && nsz > 5.5) { nsz -= 0.4; cx.font = '700 ' + nsz + 'px "Hiragino Kaku Gothic ProN","Meiryo",sans-serif'; }
  txt(nm, (nameL + nameR) / 2, y + 4 * scale + nameH / 2, nsz, inst.up ? '#9ff0a8' : '#f2e9d8', 'center', '700');
  /* アート */
  var artY = y + nameH + 8 * scale, artH = h * 0.31;
  drawCardArt(x + 8 * scale, artY, w - 16 * scale, artH, inst);
  /* タイプ帯 */
  var tyY = artY + artH + 3 * scale;
  txt(t.name, x + w / 2, tyY + 7 * scale, w * 0.085, rgba(t.bar, 0.95), 'center', '600');
  /* 説明 */
  var dsY = tyY + 17 * scale;
  var desc = cardDesc(inst);
  var extra = [];
  if (cardExhaust(inst) && desc.indexOf('廃棄') < 0) extra.push('廃棄。');
  if (cardEthereal(inst) && desc.indexOf('エセリアル') < 0) extra.push('エセリアル。');
  if (cardInnate(inst) && desc.indexOf('生得') < 0) extra.push('生得。');
  if (cardRetain(inst) && desc.indexOf('保持') < 0) extra.push('保持。');
  if (extra.length) desc = desc + ' ' + extra.join(' ');
  var fs = w * 0.088, lh = fs * 1.28;
  var maxLines = Math.floor((y + h - 6 * scale - dsY) / lh);
  var lines = wrapTokens(desc, fs, w - 16 * scale, '');
  while (lines.length > maxLines && fs > 5) { fs -= 0.4; lh = fs * 1.28; maxLines = Math.floor((y + h - 6 * scale - dsY) / lh); lines = wrapTokens(desc, fs, w - 16 * scale, ''); }
  var totalH = lines.length * lh;
  var startY = dsY + Math.max(0, ((y + h - 8 * scale) - dsY - totalH) / 2) + lh / 2;
  drawWrapped(desc, x + w / 2, startY, fs, w - 16 * scale, lh, '#ddd3c2', '#ffe89a', 'center');
  /* コスト */
  var cr = w * 0.15;
  var cost = game && game.cb ? effectiveCost(game, inst) : cardCost(inst);
  var costTxt = d.xcost ? 'X' : (d.unplayable ? '-' : String(cost));
  cx.beginPath(); cx.arc(x + cr * 0.95, y + cr * 0.95, cr, 0, TAU);
  var cgr = cx.createRadialGradient(x + cr * 0.7, y + cr * 0.6, 1, x + cr * 0.95, y + cr * 0.95, cr);
  cgr.addColorStop(0, '#6a5a2a'); cgr.addColorStop(1, '#241d0d');
  cx.fillStyle = cgr; cx.fill();
  cx.strokeStyle = (game && game.cb && cost < cardCost(inst)) ? '#7fe08a' : '#c9a94a'; cx.lineWidth = 1.6; cx.stroke();
  txt(costTxt, x + cr * 0.95, y + cr * 0.95 + 1, cr * 1.25, d.unplayable ? '#8b8b8b' : '#ffe89a', 'center', '700');
  cx.restore();
}

function eyes(x, y, w, col, angry, glow) {

  if (glow) { cx.save(); cx.shadowColor = col || '#fff'; cx.shadowBlur = 10; }
  cx.beginPath(); cx.ellipse(x - w, y, w * 0.42, w * 0.5, 0, 0, TAU); cx.fill();
  cx.beginPath(); cx.ellipse(x + w, y, w * 0.42, w * 0.5, 0, 0, TAU); cx.fill();
  if (glow) cx.restore();
  if (angry) {
    cx.strokeStyle = '#0008'; cx.lineWidth = w * 0.3; cx.lineCap = 'round';
    cx.beginPath(); cx.moveTo(x - w * 1.6, y - w * 0.85); cx.lineTo(x - w * 0.4, y - w * 0.35); cx.stroke();
    cx.beginPath(); cx.moveTo(x + w * 1.6, y - w * 0.85); cx.lineTo(x + w * 0.4, y - w * 0.35); cx.stroke();
  }
}
function blob(x, y, w, h, wob, col, col2) {
  var gr = cx.createLinearGradient(x, y - h, x, y);
  gr.addColorStop(0, col2 || shade(col, 40));
  gr.addColorStop(1, col);
  cx.fillStyle = gr;
  cx.beginPath();
  var steps = 22;
  for (var i = 0; i <= steps; i++) {
    var a = Math.PI + (i / steps) * Math.PI;
    var rx = w * (1 + Math.sin(wob + i * 0.6) * 0.045);
    var ry = h * (1 + Math.cos(wob * 1.3 + i * 0.4) * 0.05);
    var px = x + Math.cos(a) * rx, py = y + Math.sin(a) * ry * (Math.sin(a) < 0 ? 1 : 0.2);
    if (i === 0) cx.moveTo(px, py); else cx.lineTo(px, py);
  }
  cx.closePath(); cx.fill();
}
function limb(x1, y1, x2, y2, w, col) {

  cx.beginPath();

  if (stroke) { cx.strokeStyle = stroke; cx.lineWidth = lw || 2; cx.stroke(); }
}

  } else if (art === 'book') {
    cx.save();

    /* 動力炉 */

    cx.fillStyle = '#ffd45e';
    cx.beginPath(); cx.arc(x, y - S * 0.6, S * 0.1 + Math.sin(t * 0.08) * S * 0.008, 0, TAU); cx.fill();
    cx.restore();
    /* 肩と腕 */
    [-1, 1].forEach(function (sgn) {
      cx.fillStyle = light;
      cx.beginPath(); cx.arc(x + sgn * S * 0.4, y - S * 0.72, S * 0.13, 0, TAU); cx.fill();
      var sw = Math.sin(wob + (sgn > 0 ? 1.6 : 0)) * S * 0.06;
      limb(x + sgn * S * 0.4, y - S * 0.72, x + sgn * S * 0.58, y - S * 0.4 + sw, S * 0.1, shade(col, -14));

    cx.fillStyle = '#2a1c0a';

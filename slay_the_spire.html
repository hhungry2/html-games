    cx.fillStyle = '#ff5d5d';
    cx.fillRect(x - S * 0.12, y - S * 0.945, S * 0.09, S * 0.055);
    cx.fillRect(x + S * 0.03, y - S * 0.945, S * 0.09, S * 0.055);
    cx.restore();
    poly([x - S * 0.02, y - S * 1.02, x + S * 0.02, y - S * 1.02, x + S * 0.05, y - S * 1.16, x - S * 0.05, y - S * 1.16], light);
  } else if (art === 'champ') {
    /* 脚 */
    limb(x - S * 0.14, y - S * 0.42, x - S * 0.2, y - S * 0.02, S * 0.12, dark);
    limb(x + S * 0.14, y - S * 0.42, x + S * 0.2, y - S * 0.02, S * 0.12, dark);
    cx.fillStyle = '#6b6f78';
    cx.fillRect(x - S * 0.3, y - S * 0.06, S * 0.22, S * 0.06);
    cx.fillRect(x + S * 0.08, y - S * 0.06, S * 0.22, S * 0.06);
    /* 胴（鎧） */
    poly([x - S * 0.3, y - S * 0.38, x - S * 0.36, y - S * 0.78, x + S * 0.36, y - S * 0.78, x + S * 0.3, y - S * 0.38], col, dark, 2.2);
    cx.fillStyle = '#b9bec8';
    poly([x - S * 0.3, y - S * 0.72, x + S * 0.3, y - S * 0.72, x + S * 0.24, y - S * 0.52, x - S * 0.24, y - S * 0.52], '#aeb4bf', '#7e838c', 1.4);
    cx.fillStyle = '#c9a94a';
    cx.beginPath(); cx.arc(x, y - S * 0.62, S * 0.06, 0, TAU); cx.fill();
    /* 肩当て */
    [-1, 1].forEach(function (sgn) {
      cx.fillStyle = '#9ba1ab';
      cx.beginPath(); cx.ellipse(x + sgn * S * 0.36, y - S * 0.74, S * 0.14, S * 0.11, sgn * 0.3, 0, TAU); cx.fill();
      cx.strokeStyle = '#6f747c'; cx.lineWidth = 1.4; cx.stroke();
    });
    /* 腕と大剣 */
    var sw2 = Math.sin(wob) * S * 0.05;
    limb(x - S * 0.34, y - S * 0.7, x - S * 0.56, y - S * 0.34 - sw2, S * 0.09, col);
    limb(x + S * 0.34, y - S * 0.72, x + S * 0.56, y - S * 0.86 + sw2, S * 0.09, col);
    cx.save();
    cx.translate(x + S * 0.6, y - S * 0.9 + sw2);
    cx.rotate(-0.45 + Math.sin(wob) * 0.05);
    cx.fillStyle = '#7a5a34'; cx.fillRect(-S * 0.03, -S * 0.02, S * 0.06, S * 0.2);
    cx.fillStyle = '#c9a94a'; cx.fillRect(-S * 0.11, -S * 0.05, S * 0.22, S * 0.045);
    poly([-S * 0.07, -S * 0.06, S * 0.07, -S * 0.06, S * 0.05, -S * 0.62, 0, -S * 0.74, -S * 0.05, -S * 0.62], '#dfe4ec', '#98a0aa', 1.6);
    cx.restore();
    /* 頭（兜） */
    cx.fillStyle = '#c6ccd6';
    cx.beginPath(); cx.arc(x, y - S * 0.92, S * 0.16, 0, TAU); cx.fill();
    cx.fillStyle = '#8f3a3a';
    cx.fillRect(x - S * 0.16, y - S * 0.95, S * 0.32, S * 0.07);
    cx.save(); cx.shadowColor = '#ff3d3d'; cx.shadowBlur = 10;
    eyes(x, y - S * 0.92, S * 0.035, '#ff3d3d', false, false);
    cx.restore();
    poly([x - S * 0.03, y - S * 1.06, x + S * 0.03, y - S * 1.06, x + S * 0.07, y - S * 1.28, x - S * 0.07, y - S * 1.28], '#8f3a3a');
  } else if (art === 'collector') {
    poly([x - S * 0.45, y, x - S * 0.3, y - S * 0.85, x + S * 0.3, y - S * 0.85, x + S * 0.45, y], col, dark, 2);

    for (var cc = 0; cc < 3; cc++) {
      var ca = -0.6 + cc * 0.6 + Math.sin(wob + cc) * 0.15;

    }
  } else if (art === 'torch') {
    limb(x, y, x, y - S * 0.5, S * 0.1, '#6a4a2a');
    cx.fillStyle = col;
    for (var fl = 0; fl < 3; fl++) {
      cx.beginPath();
      cx.ellipse(x + Math.sin(t * 0.1 + fl) * S * 0.05, y - S * 0.65 - fl * S * 0.06, S * (0.2 - fl * 0.05), S * (0.26 - fl * 0.06), 0, 0, TAU);
      cx.fillStyle = fl === 0 ? col : (fl === 1 ? '#ffcf4a' : '#fff0c0');
      cx.fill();
    }
    eyes(x, y - S * 0.62, S * 0.045, '#1a1a1a', true);
  } else if (art === 'darkling') {
    blob(x, y, S * 0.42, S * 0.55, wob, col, light);
    poly([x - S * 0.3, y - S * 0.5, x - S * 0.55, y - S * 0.95, x - S * 0.1, y - S * 0.6], col);
    poly([x + S * 0.3, y - S * 0.5, x + S * 0.55, y - S * 0.95, x + S * 0.1, y - S * 0.6], col);
    eyes(x, y - S * 0.42, S * 0.06, '#ffef8a', true, true);
    cx.fillStyle = '#1a0a18';
    cx.beginPath(); cx.ellipse(x, y - S * 0.2, S * 0.16, S * 0.09, 0, 0, TAU); cx.fill();
  } else if (art === 'maw') {
    blob(x, y, S * 0.62, S * 0.72, wob, col, light);
    cx.fillStyle = '#1a0508';
    cx.beginPath(); cx.ellipse(x, y - S * 0.35, S * 0.42, S * 0.25, 0, 0, TAU); cx.fill();
    cx.fillStyle = '#fff';
    for (var mw = 0; mw < 7; mw++) {
      poly([x - S * 0.38 + mw * S * 0.12, y - S * 0.55, x - S * 0.33 + mw * S * 0.12, y - S * 0.3, x - S * 0.28 + mw * S * 0.12, y - S * 0.55], '#f0ece0');
      poly([x - S * 0.38 + mw * S * 0.12, y - S * 0.16, x - S * 0.33 + mw * S * 0.12, y - S * 0.4, x - S * 0.28 + mw * S * 0.12, y - S * 0.16], '#f0ece0');
    }
    eyes(x, y - S * 0.75, S * 0.07, '#ffef8a', true, true);
  } else if (art === 'nemesis') {
    poly([x - S * 0.4, y, x - S * 0.28, y - S * 0.8, x, y - S * 1.0, x + S * 0.28, y - S * 0.8, x + S * 0.4, y], col, dark, 2);
    cx.fillStyle = dark;
    poly([x - S * 0.2, y - S * 0.78, x, y - S * 1.05, x + S * 0.2, y - S * 0.78], dark);
    eyes(x, y - S * 0.72, S * 0.06, '#ff2d5d', true, true);
    for (var nm = 0; nm < 4; nm++) {
      var na = -1.4 + nm * 0.5;
      limb(x, y - S * 0.5, x + Math.cos(na) * S * 0.7, y - S * 0.5 + Math.sin(na) * S * 0.55 + Math.sin(wob + nm) * S * 0.05, S * 0.04, light);
    }
  } else if (art === 'dagger') {
    cx.save();
    cx.translate(x, y - S * 0.4);

    poly([0, -S * 0.4, S * 0.09, 0, 0, S * 0.35, -S * 0.09, 0], '#cfd8e0', '#8a95a0', 1.5);
    cx.fillStyle = col; cx.fillRect(-S * 0.14, S * 0.05, S * 0.28, S * 0.07);
    cx.restore();
  } else if (art === 'awakened') {
    /* 翼 */
    [-1, 1].forEach(function (sgn) {
      cx.beginPath();
      cx.moveTo(x + sgn * S * 0.18, y - S * 0.82);
      cx.quadraticCurveTo(x + sgn * S * 0.78, y - S * 1.34 - Math.sin(wob) * S * 0.05, x + sgn * S * 1.02, y - S * 0.86);
      cx.quadraticCurveTo(x + sgn * S * 0.84, y - S * 0.9, x + sgn * S * 0.82, y - S * 0.6);

      cx.fillStyle = rgba(col, 0.62); cx.fill();
      cx.strokeStyle = dark; cx.lineWidth = 1.6; cx.stroke();
    });
    /* ローブ */
    cx.beginPath();

    cx.quadraticCurveTo(x + S * 0.42, y - S * 0.4, x + S * 0.16, y - S * 0.86);

    cx.beginPath(); cx.moveTo(x, y - S * 0.66); cx.lineTo(x, y - S * 0.38); cx.stroke();

  } else if (art === 'donu' || art === 'deca') {
    cx.save();

function drawPlayerArt(g, x, y, S, t) {
  var C = CLASSES[g.player.cls];
  var col = C.color, light = C.color2, dark = shade(col, -55);
  var wob = t * 0.045;
  var bob = Math.sin(wob) * 2;
  var hipY = y - S * 0.42, shY = y - S * 0.72, headY = y - S * 0.88;
  hipY += bob; shY += bob; headY += bob;
  var swing = Math.sin(wob) * S * 0.02;
  cx.save();
  cx.lineCap = 'round'; cx.lineJoin = 'round';
  /* 脚 */
  limb(x - S * 0.09, hipY, x - S * 0.16, y, S * 0.1, dark);
  limb(x + S * 0.09, hipY, x + S * 0.17, y, S * 0.1, dark);
  /* マント */
  poly([x - S * 0.2, shY, x + S * 0.2, shY, x + S * 0.3, y - S * 0.05, x - S * 0.3, y - S * 0.05], shade(col, -30), 'rgba(0,0,0,.35)', 1.5);
  /* 胴 */
  poly([x - S * 0.17, shY - S * 0.02, x + S * 0.17, shY - S * 0.02, x + S * 0.14, hipY + S * 0.02, x - S * 0.14, hipY + S * 0.02],
    col, dark, 2);
  /* 首・頭 */
  limb(x, shY, x, headY + S * 0.06, S * 0.07, '#e0c49c');
  cx.fillStyle = '#e8cfa8';
  cx.beginPath(); cx.arc(x, headY, S * 0.115, 0, TAU); cx.fill();
  if (g.player.cls === 'warrior') {
    /* 兜 */
    cx.fillStyle = '#aeb4bf';
    cx.beginPath(); cx.arc(x, headY - S * 0.01, S * 0.125, Math.PI * 1.02, TAU * 1.02); cx.fill();
    cx.fillRect(x - S * 0.125, headY - S * 0.03, S * 0.25, S * 0.045);
    poly([x - S * 0.02, headY - S * 0.14, x + S * 0.02, headY - S * 0.14, x + S * 0.05, headY - S * 0.3, x - S * 0.05, headY - S * 0.3], '#c0392b');
    eyes(x, headY + S * 0.03, S * 0.028, '#3a2a1a');
    /* 剣を持つ腕 */
    limb(x + S * 0.16, shY + S * 0.04, x + S * 0.3, shY + swing, S * 0.075, col);
    limb(x + S * 0.3, shY + swing, x + S * 0.38, shY - S * 0.12 + swing, S * 0.07, '#e0c49c');
    cx.save();
    cx.translate(x + S * 0.4, shY - S * 0.14 + swing);
    cx.rotate(-0.5 + Math.sin(wob) * 0.05);
    cx.fillStyle = '#7a5a34'; cx.fillRect(-S * 0.022, -S * 0.02, S * 0.044, S * 0.14);
    cx.fillStyle = '#8a6a44'; cx.fillRect(-S * 0.08, -S * 0.035, S * 0.16, S * 0.032);
    poly([-S * 0.032, -S * 0.04, S * 0.032, -S * 0.04, S * 0.022, -S * 0.42, 0, -S * 0.5, -S * 0.022, -S * 0.42], '#d8dce4', '#98a0aa', 1.5);
    cx.restore();
    /* 盾を持つ腕 */
    limb(x - S * 0.16, shY + S * 0.04, x - S * 0.3, shY + S * 0.12 - swing, S * 0.075, col);
    cx.save();
    cx.translate(x - S * 0.36, shY + S * 0.14 - swing);
    poly([-S * 0.11, -S * 0.16, S * 0.11, -S * 0.16, S * 0.13, S * 0.08, 0, S * 0.2, -S * 0.13, S * 0.08], '#8a5a3a', '#5a3a22', 2);
    cx.fillStyle = '#c9a94a';
    cx.beginPath(); cx.arc(0, 0, S * 0.045, 0, TAU); cx.fill();
    cx.restore();
  } else if (g.player.cls === 'shade') {
    /* フード */
    cx.fillStyle = dark;
    cx.beginPath(); cx.arc(x, headY - S * 0.005, S * 0.135, Math.PI * 0.88, TAU * 1.12); cx.fill();
    poly([x - S * 0.13, headY + S * 0.02, x + S * 0.13, headY + S * 0.02, x + S * 0.06, headY + S * 0.14, x - S * 0.06, headY + S * 0.14], dark);
    eyes(x, headY + S * 0.035, S * 0.026, '#8fe8a0', false, true);
    /* 二刀 */
    limb(x + S * 0.16, shY + S * 0.03, x + S * 0.33, shY - S * 0.05 + swing, S * 0.065, light);
    poly([x + S * 0.32, shY - S * 0.08 + swing, x + S * 0.58, shY - S * 0.2 + swing, x + S * 0.34, shY + S * 0.01 + swing], '#dfe4ec', '#98a0aa', 1.4);
    limb(x - S * 0.16, shY + S * 0.03, x - S * 0.33, shY + S * 0.08 - swing, S * 0.065, light);
    poly([x - S * 0.32, shY + S * 0.05 - swing, x - S * 0.56, shY - S * 0.05 - swing, x - S * 0.34, shY + S * 0.14 - swing], '#dfe4ec', '#98a0aa', 1.4);
  } else {
    /* 機械の頭 */

    cx.fillStyle = '#39404a';

    cx.restore();
    limb(x + S * 0.16, shY + S * 0.04, x + S * 0.34, shY + S * 0.1 + swing, S * 0.08, '#7a8590');
    limb(x - S * 0.16, shY + S * 0.04, x - S * 0.34, shY + S * 0.1 - swing, S * 0.08, '#7a8590');
    for (var i = 0; i < 3; i++) {
      var a = tick * 0.02 + i * TAU / 3;

      cx.fillStyle = '#8fe6ff';
      cx.beginPath(); cx.arc(x + Math.cos(a) * S * 0.4, shY - S * 0.1 + Math.sin(a) * S * 0.1, S * 0.022, 0, TAU); cx.fill();

function drawHpBar(x, y, w, h, hp, maxHp, block, col, preview) {
  fillRR(x, y, w, h, h / 2, 'rgba(0,0,0,.62)');
  var ratio = clamp(hp / maxHp, 0, 1);
  var c1 = col || '#c0392b', c2 = col ? shade(col, 40) : '#e74c3c';
  if (ratio > 0) {
    var gr = cx.createLinearGradient(x, y, x, y + h);
    gr.addColorStop(0, c2); gr.addColorStop(1, c1);
    fillRR(x + 1, y + 1, Math.max(3, (w - 2) * ratio), h - 2, (h - 2) / 2, gr);
  }
  if (preview > 0) {
    var afterHp = Math.max(0, hp - Math.max(0, preview - (block || 0)));
    var r2 = clamp(afterHp / maxHp, 0, 1);
    var lost = Math.max(0, (ratio - r2)) * (w - 2);
    if (lost > 0.5) {
      cx.save();
      rr(x + 1, y + 1, w - 2, h - 2, (h - 2) / 2); cx.clip();
      cx.fillStyle = 'rgba(255,246,214,' + (0.72 + Math.sin(tick * 0.16) * 0.18) + ')';
      cx.fillRect(x + 1 + (w - 2) * r2, y + 1, lost, h - 2);
      cx.fillStyle = 'rgba(255,120,90,.9)';
      cx.fillRect(x + 1 + (w - 2) * r2, y + 1, 2, h - 2);
      cx.restore();
    }
  }
  strokeRR(x, y, w, h, h / 2, 'rgba(255,255,255,.22)', 1);
  txtShadow(hp + '/' + maxHp, x + w / 2, y + h / 2 + 0.5, Math.min(13, h * 0.72), '#fff', 'center', '700');
  if (block > 0) {
    var bx = x - h * 0.6, by = y + h / 2;
    cx.save();
    cx.beginPath();
    cx.moveTo(bx, by - h * 0.75); cx.lineTo(bx + h * 0.62, by - h * 0.4);
    cx.lineTo(bx + h * 0.62, by + h * 0.3); cx.lineTo(bx, by + h * 0.85);
    cx.lineTo(bx - h * 0.62, by + h * 0.3); cx.lineTo(bx - h * 0.62, by - h * 0.4);
    cx.closePath();
    var bgr = cx.createLinearGradient(bx, by - h, bx, by + h);
    bgr.addColorStop(0, '#8fc0e8'); bgr.addColorStop(1, '#3a6a9a');
    cx.fillStyle = bgr; cx.fill();
    cx.strokeStyle = '#cfe8ff'; cx.lineWidth = 1.2; cx.stroke();
    txtShadow(String(block), bx, by + 0.5, h * 0.8, '#0d1a26', 'center', '700');
    cx.restore();
  }
}

function drawBuffs(g, c, x, y, size, center) {

function drawIntent(g, e, x, y) {

function intentDesc(g, e) {
  var p = e.plan, s = '';
  if (p.intent.indexOf('attack') === 0) s += calcEnemyDamage(g, e, p.dmg) + ' ダメージ' + (p.times > 1 ? ' ×' + p.times + ' 回' : '') + '。';
  if (p.intent === 'attackDefend') s += ' ブロックも得る。';
  if (p.intent === 'attackDebuff') s += ' デバフも与えてくる。';

  if (p.intent === 'buff') s += '自身を強化する。';
  if (p.intent === 'debuff') s += 'こちらを弱体化させる。';

function previewDamageFor(g, e) {
  var cb = g.cb;
  var pc = cb.dragging || cb.selected || cb.hoverCard;
  if (!pc || cb.phase !== 'player' || overlay) return 0;
  var d = CARDS[pc.id];
  if (d.type !== 'attack') return 0;
  var v = cardVals(pc);
  if (v.d === undefined) return 0;
  if (d.target === 'enemy') {
    var list = aliveEnemies(g);
    var tgt = cb.hoverEnemy || (list.length === 1 ? list[0] : null);
    if (!tgt || tgt !== e) return 0;
  }
  return calcPlayerDamage(g, v.d, e);
}
function drawCombat(g) {
  var cb = g.cb, t = tick;
  drawBackground(g, cb.kind);
  var hoveredEnemy = null;

  /* ---- 敵 ---- */
  cb.enemies.forEach(function (e) {

    if (e.spawnAnim > 0) { alpha = Math.min(1, 1.4 - e.spawnAnim); e.spawnAnim = Math.max(0, e.spawnAnim - 0.05); }
    if (alpha <= 0) return;
    cx.save();
    cx.globalAlpha = alpha;
    /* 影 */
    cx.fillStyle = 'rgba(0,0,0,.36)';
    cx.beginPath(); cx.ellipse(ex, ey + 4, S * 0.42, S * 0.1, 0, 0, TAU); cx.fill();
    var atkOff = 0;
    if (e.attackAnim > 0) { atkOff = -Math.sin(e.attackAnim * Math.PI) * 34; e.attackAnim = Math.max(0, e.attackAnim - 0.06); }
    cx.translate(atkOff, 0);
    if (cb.hoverEnemy === e || (cb.selected && cb.targetEnemy === e)) {
      cx.save(); cx.shadowColor = '#ffcf4a'; cx.shadowBlur = 26;
      cx.strokeStyle = 'rgba(255,207,74,.8)'; cx.lineWidth = 2;
      cx.beginPath(); cx.ellipse(ex, ey + 4, S * 0.44, S * 0.12, 0, 0, TAU); cx.stroke();
      cx.restore();
    }
    drawEnemyArt(e, ex, ey, S, t);
    cx.restore();
    if (e.hp <= 0) return;
    e.shakeT = Math.max(0, e.shakeT - 0.9);
    /* HPバー / バフ / インテント */
    var bw = Math.max(84, S * 0.86);
    drawHpBar(ex - bw / 2, ey + 12, bw, 13, e.hp, e.maxHp, e.block, null, previewDamageFor(g, e));
    drawBuffs(g, e, ex, ey + 30, 20, true);
    var topY = artTop(e, S);
    var prevDmg = previewDamageFor(g, e);
    var showName = aliveEnemies(g).length <= 3 || cb.hoverEnemy === e;
    if (prevDmg > 0 && showName) {

    if (o.hover) hoveredEnemy = e;

  cx.shadowColor = 'rgba(255,190,60,.5)'; cx.shadowBlur = 20;

  cx.restore();
  cx.strokeStyle = '#ffe08a'; cx.lineWidth = 2;
  cx.beginPath(); cx.arc(ex2, ey2, 34, 0, TAU); cx.stroke();
  txtShadow(cb.energy + '/' + cb.energyPerTurn, ex2, ey2 + 1, 21, '#3a2408', 'center', '700');

/* ---- 手札 ---- */
function handLayout(g) {
  var cb = g.cb, n = cb.hand.length;
  var out = [];
  if (!n) return out;
  var cw = 132, ch = 176;
  var maxW = VW - 320;
  var gap = Math.min(cw + 8, maxW / n);
  var totalW = gap * (n - 1) + cw;
  var startX = (VW - totalW) / 2 - 16;
  var baseY = VH - ch - 6;
  var mid = (n - 1) / 2;
  var maxOff = mid * mid;
  for (var i = 0; i < n; i++) {
    var inst = cb.hand[i];
    var cxp = startX + i * gap;
    var off = i - mid;
    var rot = off * 0.03;
    var yo = -(maxOff - off * off) * 1.1;
    out.push({ inst: inst, x: cxp, y: baseY + yo, w: cw, h: ch, rot: rot, idx: i });
  }
  return out;
}
function drawHand(g) {
  var cb = g.cb;
  var layout = handLayout(g);
  cb.handLayout = layout;
  var hovered = null;
  /* 当たり判定は逆順（右のカードが上） */
  for (var i = layout.length - 1; i >= 0; i--) {
    var L = layout[i];
    var o = uiAdd(L.x, L.y, L.w, L.h * 0.9, null, 'card', L);
    if (o.hover && !hovered && !overlay) hovered = L;
  }
  cb.hoverCard = hovered ? hovered.inst : null;
  for (var k = 0; k < layout.length; k++) {
    var L2 = layout[k];
    var inst = L2.inst;
    if (cb.dragging === inst) continue;
    var isSel = cb.selected === inst;
    var isHover = hovered === L2;
    var y = L2.y - (isSel ? 42 : (isHover ? 24 : 0));
    var scale = (isSel || isHover) ? 1.1 : 1;
    var w = L2.w * scale, h = L2.h * scale;
    var x = L2.x - (w - L2.w) / 2;
    y -= (h - L2.h) / 2;
    if (inst.drawAnim > 0) {
      var a = inst.drawAnim;
      inst.drawAnim = Math.max(0, a - 0.08);
      x = lerp(40, x, 1 - a); y = lerp(VH - 40, y, 1 - a);
    }
    var playable = canPlayCard(g, inst) && cb.phase === 'player';
    cx.save();
    if (!playable) cx.globalAlpha = 0.62;
    drawCard(x, y, w, h, inst, {
      rot: (isSel || isHover) ? 0 : L2.rot, selected: isSel,
      glow: isSel ? '#ffcf4a' : (playable && isHover ? 'rgba(255,207,74,.55)' : null)
    });
    cx.restore();
    if (!playable && cb.phase === 'player') {
      txtShadow('×', x + w / 2, y + h / 2, 42, 'rgba(255,90,90,.55)', 'center', '700');
    }
  }
  /* ドラッグ中のカード */
  if (cb.dragging) {
    var dw = 132 * 1.12, dh = 178 * 1.12;
    drawCard(cb.dragX - dw / 2, cb.dragY - dh / 2, dw, dh, cb.dragging, { glow: '#ffcf4a', selected: true });
  }
  /* 選択中の操作ヒント */
  if (cb.selected && !cb.dragging) {
    var hint = CARDS[cb.selected.id].target === 'enemy' ? '対象の敵をタップ（またはカードを敵へドラッグ）' : 'もう一度タップして使用（上へドラッグでも可）';
    var hw = 340;
    fillRR(VW / 2 - hw / 2, VH - 210, hw, 26, 13, 'rgba(20,16,28,.9)');
    strokeRR(VW / 2 - hw / 2, VH - 210, hw, 26, 13, 'rgba(255,207,74,.55)', 1);
    txt(hint, VW / 2, VH - 197, 13, '#ffe89a', 'center', '600');
  }
  /* ターゲット矢印 */
  if (cb.selected && CARDS[cb.selected.id].target === 'enemy' && !cb.dragging) {
    var tgt = cb.hoverEnemy || cb.targetEnemy;
    var sl = null;
    for (var m = 0; m < layout.length; m++) if (layout[m].inst === cb.selected) sl = layout[m];
    if (sl && tgt && tgt.hp > 0) drawArrow(sl.x + sl.w / 2, sl.y - 30, tgt.baseX, GROUND_Y - 70 * tgt.scale);
  }
}
function drawArrow(x1, y1, x2, y2) {
  cx.save();
  cx.strokeStyle = 'rgba(255,207,74,.85)'; cx.lineWidth = 4; cx.lineCap = 'round';
  cx.setLineDash([10, 8]); cx.lineDashOffset = -tick * 0.6;
  cx.beginPath();
  cx.moveTo(x1, y1);
  cx.quadraticCurveTo((x1 + x2) / 2, Math.min(y1, y2) - 90, x2, y2);
  cx.stroke();
  cx.setLineDash([]);
  var ang = Math.atan2(y2 - (Math.min(y1, y2) - 90), x2 - (x1 + x2) / 2);
  cx.translate(x2, y2); cx.rotate(ang);
  cx.fillStyle = 'rgba(255,207,74,.95)';
  cx.beginPath(); cx.moveTo(14, 0); cx.lineTo(-10, -10); cx.lineTo(-10, 10); cx.closePath(); cx.fill();
  cx.restore();
}

function drawEffects(g) {
  var cb = g.cb;
  /* 使用したカードの残像 */
  if (cb.playFx) {
    for (var fi = cb.playFx.length - 1; fi >= 0; fi--) {
      var fx = cb.playFx[fi];
      fx.t++;
      if (fx.t > 26) { cb.playFx.splice(fi, 1); continue; }
      var kk = fx.t / 26;
      var ease = 1 - Math.pow(1 - kk, 2.2);
      var sc2 = 1 - kk * 0.55;
      var w2 = 132 * sc2, h2 = 176 * sc2;
      cx.save();
      cx.globalAlpha = (1 - kk) * 0.92;
      drawCard(lerp(fx.x, fx.tx, ease), lerp(fx.y, fx.ty, ease), w2, h2, fx.inst, { shadow: false, glow: 'rgba(255,207,74,.6)' });
      cx.restore();
    }
  }
  /* 斬撃 */
  for (var i = cb.slashes.length - 1; i >= 0; i--) {
    var s = cb.slashes[i];
    s.t++;
    if (s.t > s.life) { cb.slashes.splice(i, 1); continue; }
    var k = s.t / s.life;
    cx.save();
    cx.translate(s.x, s.y); cx.rotate(s.a);
    cx.globalAlpha = (1 - k) * 0.9;
    cx.strokeStyle = '#fff'; cx.lineWidth = 6 * (1 - k) + 1;
    cx.beginPath();
    cx.arc(0, 0, 60, -0.9 + k * 0.5, 0.9 + k * 0.5);
    cx.stroke();
    cx.restore();
  }
  /* パーティクル */
  for (i = cb.particles.length - 1; i >= 0; i--) {
    var pt = cb.particles[i];
    pt.t++; pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.22;
    if (pt.t > pt.life) { cb.particles.splice(i, 1); continue; }
    cx.globalAlpha = 1 - pt.t / pt.life;
    cx.fillStyle = pt.col;
    cx.beginPath(); cx.arc(pt.x, pt.y, pt.r, 0, TAU); cx.fill();
    cx.globalAlpha = 1;
  }
  /* フロートテキスト */
  for (i = cb.floats.length - 1; i >= 0; i--) {
    var f = cb.floats[i];
    f.t++; f.y += f.vy; f.vy *= 0.97;
    if (f.t > f.life) { cb.floats.splice(i, 1); continue; }
    var alpha = f.t > f.life - 16 ? (f.life - f.t) / 16 : 1;
    cx.save();
    cx.globalAlpha = alpha;
    txtShadow(f.text, f.x, f.y, f.big ? 26 : 19, f.color, 'center', '700');
    cx.restore();
  }
}

function mapGeom(g) {

function drawMapBackground(g) {

function drawMap(g) {

  g.mapScroll = clamp(g.mapScroll, 0, Math.max(0, geo.totalH - (VH - 150)));

  cx.beginPath(); cx.rect(0, 70, VW, VH - 70 - 36); cx.clip();
  g.map.nodes.forEach(function (n) {

  });

function drawMapNode(g, x, y, type, avail, current, onClick, r, visited) {
  r = r || 26;
  var col = NODE_COLOR[type];
  var o = uiAdd(x - r, y - r, r * 2, r * 2, avail ? onClick : null, 'mapnode');
  var hov = o.hover && avail;

  }

  else { gr.addColorStop(0, shade(col, -58)); gr.addColorStop(1, shade(col, -96)); }
  cx.fillStyle = gr; cx.fill();
  cx.restore();
  cx.strokeStyle = current ? '#fff' : (avail ? shade(col, 40) : rgba(col, 0.45));
  cx.lineWidth = current ? 3 : (avail ? 2 : 1);
  cx.beginPath(); cx.arc(x, y, r, 0, TAU); cx.stroke();
  cx.save();
  cx.globalAlpha = avail ? 1 : (visited ? 0.55 : 0.8);
  drawNodeIcon(type, x, y, r * 0.72);

/* ================================================================
   入力
   ================================================================ */
var pointer = { down: false, x: 0, y: 0, sx: 0, sy: 0, moved: 0, id: null, downTime: 0 };
var dragCandidate = null;
var mapDrag = null;
var longPressTarget = null;

function toView(clientX, clientY) {
  var rect = canvas.getBoundingClientRect();
  var px = (clientX - rect.left) * (canvas.width / rect.width);
  var py = (clientY - rect.top) * (canvas.height / rect.height);
  return { x: (px - view.ox) / view.scale, y: (py - view.oy) / view.scale };
}

function onDown(vx, vy) {
  pointer.down = true; pointer.x = vx; pointer.y = vy; pointer.sx = vx; pointer.sy = vy; pointer.moved = 0;
  pointer.downTime = nowMs();
  ui.mx = vx; ui.my = vy;
  var hit = uiHitTest(vx, vy);
  ui.pressed = hit;
  longPressTarget = null;
  if (hit && hit.id === 'potion') longPressTarget = hit;
  if (!overlay && scene === 'combat' && game && game.cb && game.cb.phase === 'player') {
    if (hit && hit.id === 'card') dragCandidate = hit.data;
  }
  if (!overlay && scene === 'map') mapDrag = { y: vy, scroll: game.mapScroll };
  if (overlay && (overlay.type === 'select' || overlay.type === 'view') && overlay.maxScroll > 0) {
    mapDrag = { y: vy, scroll: overlay.scroll || 0, overlay: true };
  }
}
function onMove(vx, vy) {
  ui.mx = vx; ui.my = vy;
  if (!pointer.down) return;
  pointer.moved += Math.abs(vx - pointer.x) + Math.abs(vy - pointer.y);
  pointer.x = vx; pointer.y = vy;
  if (dragCandidate && pointer.moved > 10 && game.cb) {
    game.cb.dragging = dragCandidate.inst;
    game.cb.selected = dragCandidate.inst;
  }
  if (game && game.cb && game.cb.dragging) { game.cb.dragX = vx; game.cb.dragY = vy; }
  if (mapDrag) {
    if (mapDrag.overlay && overlay) {
      overlay.scroll = clamp((overlay.scroll || 0) - (vy - mapDrag.y), 0, overlay.maxScroll);
      mapDrag.y = vy;
    } else if (scene === 'map' && game) {
      game.mapScroll = mapDrag.scroll + (vy - mapDrag.y);
    }
  }
}
function onUp(vx, vy) {
  ui.mx = vx; ui.my = vy;
  var wasDragging = game && game.cb && game.cb.dragging;
  var hit = uiHitTest(vx, vy);
  if (wasDragging) {
    var inst = game.cb.dragging;
    game.cb.dragging = null;
    dragCandidate = null;
    pointer.down = false;
    var d = CARDS[inst.id];
    if (hit && hit.id === 'enemy' && d.target === 'enemy') {
      tryPlay(game, inst, hit.data);
    } else if (vy < VH - 200) {
      if (d.target === 'enemy') {
        var e = hit && hit.id === 'enemy' ? hit.data : nearestEnemy(game, vx, vy);
        tryPlay(game, inst, e);
      } else {
        tryPlay(game, inst, null);
      }
    } else {
      game.cb.selected = null;
    }
    mapDrag = null;
    return;
  }
  dragCandidate = null;
  pointer.down = false;
  mapDrag = null;
  if (pointer.moved > 16) return;
  if (!hit) {
    if (game && game.cb) {
      var selc = game.cb.selected;
      if (selc && CARDS[selc.id].target !== 'enemy' && vy < VH - 200 && game.cb.phase === 'player') tryPlay(game, selc, null);
      else game.cb.selected = null;
    }
    return;
  }
  if (rectContains(hit, pointer.sx, pointer.sy) || hit.id === 'card' || hit.id === 'enemy') {
    if (hit.id === 'card') { onCardClick(game, hit.data.inst); return; }
    if (hit.onClick) { hit.onClick(); }
  }
}
function nearestEnemy(g, x, y) {
  var best = null, bd = 1e9;
  aliveEnemies(g).forEach(function (e) {
    var dx = e.baseX - x, dy = (GROUND_Y - 60) - y;
    var d2 = dx * dx + dy * dy;
    if (d2 < bd) { bd = d2; best = e; }
  });
  return best;
}
function onCardClick(g, inst) {
  if (!g || !g.cb || g.cb.phase !== 'player' || overlay) return;
  var d = CARDS[inst.id];
  if (g.cb.selected === inst) {
    if (d.target === 'enemy') {
      var list = aliveEnemies(g);
      if (list.length === 1) tryPlay(g, inst, list[0]);
      else g.cb.selected = null;
    } else {
      tryPlay(g, inst, null);
    }
  } else {
    if (!canPlayCard(g, inst)) {
      var d2 = CARDS[inst.id];
      floatText(g, d2.unplayable ? 'このカードは使用できない' : 'エナジーが足りない', '#ff9f9f');
      SFX.debuff();
      return;
    }
    g.cb.selected = inst;
    SFX.select();
  }
}
function onEnemyClick(g, e) {
  if (!g.cb || g.cb.phase !== 'player') return;
  if (g.potionTarget !== undefined && g.potionTarget !== null) {
    var idx = g.potionTarget; g.potionTarget = null;
    usePotion(g, idx, e);
    return;
  }
  var inst = g.cb.selected;
  if (!inst) return;
  var d = CARDS[inst.id];
  if (d.target === 'enemy') tryPlay(g, inst, e);
  else tryPlay(g, inst, null);
}
function tryPlay(g, inst, target) {
  if (!canPlayCard(g, inst)) {
    floatText(g, CARDS[inst.id].unplayable ? 'このカードは使用できない' : 'エナジーが足りない', '#ff9f9f');
    g.cb.selected = null;
    return;
  }
  g.cb.selected = null;
  playCard(g, inst, target);
  saveGame(g);
}
function onPotionClick(g, idx) {
  var id = g.player.potions[idx];
  if (!id) return;
  var p = POTIONS[id];
  if (longPressTarget && nowMs() - pointer.downTime > 600) { discardPotion(g, idx); toast(g, p.name + ' を捨てた'); return; }
  if (p.target === 'enemy' && g.cb) {
    var list = aliveEnemies(g);
    if (list.length === 1) { usePotion(g, idx, list[0]); return; }
    g.potionTarget = idx;
    toast(g, '対象の敵をタップ');
    return;
  }
  usePotion(g, idx, null);
}

canvas.addEventListener('pointerdown', function (ev) {
  ev.preventDefault();
  Audio_.init(); Audio_.resume();
  if (!BGM.cur) { var wt = sceneTrack(); if (wt) BGM.play(wt); }
  var v = toView(ev.clientX, ev.clientY);
  try { canvas.setPointerCapture(ev.pointerId); } catch (e) {}
  onDown(v.x, v.y);
});
canvas.addEventListener('pointermove', function (ev) {
  var v = toView(ev.clientX, ev.clientY);
  onMove(v.x, v.y);
});
canvas.addEventListener('pointerup', function (ev) {
  ev.preventDefault();
  var v = toView(ev.clientX, ev.clientY);
  onUp(v.x, v.y);
});
canvas.addEventListener('pointercancel', function () {
  pointer.down = false; dragCandidate = null; mapDrag = null;
  if (game && game.cb) game.cb.dragging = null;
});
canvas.addEventListener('pointerleave', function () { ui.mx = -999; ui.my = -999; });
canvas.addEventListener('wheel', function (ev) {
  ev.preventDefault();
  if (overlay && overlay.maxScroll > 0) overlay.scroll = clamp((overlay.scroll || 0) + ev.deltaY * 0.6, 0, overlay.maxScroll);
  else if (scene === 'map' && game) game.mapScroll = clamp(game.mapScroll - ev.deltaY * 0.6, -4000, 4000);
}, { passive: false });
canvas.addEventListener('contextmenu', function (ev) { ev.preventDefault(); });

global.addEventListener('keydown', function (ev) {
  var k = ev.key;
  if (k === 'Escape') {
    if (overlay) { if (overlay.type === 'view' || overlay.type === 'menu') overlay = null; }
    else if (game && (scene === 'combat' || scene === 'map')) overlay = { type: 'menu' };
    return;
  }
  if (k === 'f' || k === 'F') { toggleFullscreen(); return; }
  if (k === 'm' || k === 'M') { toggleSound(); return; }
  if (!game || scene !== 'combat' || overlay) return;
  if (k === ' ' || k === 'e' || k === 'E' || k === 'Enter') { ev.preventDefault(); endTurn(game); return; }
  if (k === 'd' || k === 'D') { viewPile(game, game.player.deck, 'デッキ（' + game.player.deck.length + '枚）'); return; }
  var n = parseInt(k, 10);
  if (!isNaN(n) && n >= 1 && n <= 9) {
    var inst = game.cb.hand[n - 1];
    if (inst) onCardClick(game, inst);
  }
});

/* ================================================================
   メインループ
   ================================================================ */
var tick = 0;
function resize() {
  var rect = canvas.getBoundingClientRect();
  view.dpr = Math.min(2, global.devicePixelRatio || 1);
  canvas.width = Math.max(2, Math.round(rect.width * view.dpr));
  canvas.height = Math.max(2, Math.round(rect.height * view.dpr));
  view.scale = Math.min(canvas.width / VW, canvas.height / VH);
  view.ox = (canvas.width - VW * view.scale) / 2;
  view.oy = (canvas.height - VH * view.scale) / 2;
}
global.addEventListener('resize', resize);
global.addEventListener('orientationchange', function () { setTimeout(resize, 120); });

function processQueue(g, dt) {
  if (!g || !g.cb) return;
  var q = g.cb.queue;
  while (q.length) {
    q[0].t -= dt;
    if (q[0].t > 0) break;
    var item = q.shift();
    item.fn();
    if (!g.cb) break;
  }
}

var lastFrameTime = 0;
function frame(ts) {
  tick++;
  if (!ts) ts = nowMs();
  var dt = lastFrameTime ? clamp(ts - lastFrameTime, 1, 120) : 16;
  lastFrameTime = ts;
  cx.setTransform(1, 0, 0, 1, 0, 0);
  cx.fillStyle = '#05040a';
  cx.fillRect(0, 0, canvas.width, canvas.height);
  cx.setTransform(view.scale, 0, 0, view.scale, view.ox, view.oy);
  cx.save();
  cx.beginPath(); cx.rect(0, 0, VW, VH); cx.clip();

  tooltip = null;
  updateBgm();
  uiBegin();

  try {
  processQueue(game, dt);
  validateScene();

  if (scene === 'title') drawTitle();
  else if (scene === 'charselect') drawCharSelect();
  else if (scene === 'help') drawHelp();
  else if (scene === 'combat' && game && game.cb) drawCombat(game);
  else if (scene === 'map' && game) drawMap(game);
  else if (scene === 'reward' && game) drawReward(game);
  else if (scene === 'treasure' && game) drawTreasure(game);
  else if (scene === 'rest' && game) drawRest(game);
  else if (scene === 'shop' && game) drawShop(game);
  else if (scene === 'event' && game) drawEvent(game);
  else if (scene === 'actEnd' && game) drawActEnd(game);
  else if (scene === 'gameover' && game) drawGameOver(game);
  else if (scene === 'victory' && game) drawVictory(game);
  else drawTitle();

  drawOverlay(game);
  } catch (err) {
    if (!frame.errLogged) { frame.errLogged = true; try { console.error(err); } catch (e2) {} }
    toast(game, '描画エラーから復帰しました');
    overlay = null;
    if (game && scene !== 'title') scene = game.cb ? 'combat' : 'map';
  }
  drawToasts();
  drawTooltip();

  cx.restore();
  requestAnimationFrame(frame);
}
/* シーンに必要なデータが無い場合の保険 */
function validateScene() {
  if (!game) { if (scene !== 'title' && scene !== 'charselect' && scene !== 'help') scene = 'title'; return; }
  if (scene === 'shop' && !game.shopStock) openShop(game);
  else if (scene === 'rest' && !game.restOptions) openRest(game);
  else if (scene === 'treasure' && !game.treasure) openTreasure(game);
  else if (scene === 'event' && !game.eventData) openEvent(game);
  else if (scene === 'reward' && !game.rewards) goToMap(game);
  else if (scene === 'combat' && !game.cb) goToMap(game);
  else if (scene === 'map' && !game.map) buildMap(game);
}
function drawToasts() {
  for (var i = toasts.length - 1; i >= 0; i--) {
    var t = toasts[i];
    t.t++;
    if (t.t > t.life) { toasts.splice(i, 1); continue; }
  }
  toasts.forEach(function (t, i) {
    var alpha = t.t > t.life - 30 ? (t.life - t.t) / 30 : Math.min(1, t.t / 8);
    var y = 70 + i * 34;
    cx.save();
    cx.globalAlpha = alpha;
    var w = Math.max(180, cx.measureText(t.text).width + 60);
    cx.font = '600 15px "Hiragino Kaku Gothic ProN",sans-serif';
    w = cx.measureText(t.text).width + 40;
    fillRR(VW / 2 - w / 2, y, w, 30, 15, 'rgba(20,16,28,.92)');
    strokeRR(VW / 2 - w / 2, y, w, 30, 15, 'rgba(255,207,74,.5)', 1);
    txt(t.text, VW / 2, y + 15, 15, '#ffe89a', 'center', '600');
    cx.restore();
  });
}

  Audio_.on = !Audio_.on;
  BGM.setVolume();
  var b = document.getElementById('soundBtn');
  if (b) { b.textContent = Audio_.on ? 'SOUND ON' : 'SOUND OFF'; b.className = 'sbtn' + (Audio_.on ? '' : ' off'); }
}

function toggleFullscreen() {
  var el = document.documentElement;
  if (!document.fullscreenElement && !document.webkitFullscreenElement) {
    if (el.requestFullscreen) el.requestFullscreen();
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  } else {
    if (document.exitFullscreen) document.exitFullscreen();
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
  }
}
document.getElementById('fullscreenBtn').addEventListener('click', toggleFullscreen);

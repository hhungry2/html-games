<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>WAVE RIDERS - ウェーブレース風 水上バイクレース</title>
<meta name="description" content="ウェーブレース64風の水上バイク（ジェットスキー）レース。HTML1枚。うねる波を3Dで再現、赤ブイは左・黄ブイは右を通過してパワーアップ。全6コース・チャンピオンシップ／タイムアタック／スタントモード。スマホ/PC対応。">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#02121f;
  font-family:"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;color:#eaf8ff;
  user-select:none;-webkit-user-select:none;touch-action:none}
#app{position:fixed;inset:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:contain;
  image-rendering:pixelated;image-rendering:crisp-edges;background:#02121f}

/* ===== メニュー ===== */
#ui{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  padding:14px;overflow-y:auto;overscroll-behavior:contain;
  background:radial-gradient(120% 90% at 50% 0%,#0b4f86 0%,#06304f 42%,#02121f 100%)}
#ui.hide{display:none}
#ui.clear{background:none;pointer-events:none}
#ui.clear .panel{pointer-events:auto}
.panel{width:min(580px,100%);max-height:100%;padding:18px 16px 22px;border-radius:16px;
  background:linear-gradient(180deg,rgba(9,42,72,.94),rgba(3,18,34,.96));
  border:2px solid rgba(110,220,255,.45);
  box-shadow:0 0 0 1px rgba(0,255,200,.18),0 14px 50px rgba(0,0,0,.7),inset 0 0 44px rgba(40,150,255,.14)}
h1{font-size:clamp(22px,7vw,40px);letter-spacing:2px;text-align:center;line-height:1.05;
  background:linear-gradient(180deg,#fff 0%,#a8f0ff 42%,#1e9bff 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 0 #0a6ab0) drop-shadow(0 0 14px rgba(80,220,255,.55))}
.sub{text-align:center;font-size:12px;letter-spacing:3px;color:#7fe4ff;margin-top:2px}
.lead{text-align:center;font-size:13px;color:#b9dcf0;margin:10px 2px;line-height:1.65}
h2{font-size:16px;letter-spacing:2px;color:#8ff0ff;text-align:center;margin-bottom:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.btn{flex:1 1 150px;min-height:48px;padding:10px 12px;border-radius:10px;cursor:pointer;
  border:2px solid rgba(130,230,255,.5);color:#eaf8ff;font-size:14px;font-weight:700;letter-spacing:1px;
  background:linear-gradient(180deg,rgba(20,90,160,.88),rgba(8,34,66,.92));
  transition:transform .08s,box-shadow .12s,border-color .12s}
.btn small{display:block;font-weight:400;font-size:11px;color:#9fd0e8;margin-top:3px;letter-spacing:0}
.btn:hover{border-color:#7ef0ff;box-shadow:0 0 16px rgba(90,220,255,.45)}
.btn:active{transform:translateY(2px)}
.btn.pri{background:linear-gradient(180deg,#12b6c8,#066a80);border-color:#8ff6ff}
.btn.on{background:linear-gradient(180deg,#00d08a,#04664a);border-color:#7bffd0}
.btn.gray{flex:0 1 auto;min-height:40px;font-size:12px;padding:8px 14px;white-space:nowrap;
  background:linear-gradient(180deg,rgba(50,74,100,.8),rgba(14,26,44,.9))}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:10px}
.card{position:relative;padding:8px;border-radius:10px;cursor:pointer;text-align:left;
  border:2px solid rgba(120,200,255,.32);background:linear-gradient(180deg,rgba(14,54,92,.9),rgba(5,20,38,.95))}
.card:hover{border-color:#7ef0ff}
.card.sel{border-color:#ffde4d;box-shadow:0 0 18px rgba(255,210,80,.4)}
.card.lock{opacity:.45;cursor:not-allowed}
.card h3{font-size:14px;letter-spacing:1px;color:#fff}
.card .en{font-size:10px;color:#8ac4e0;letter-spacing:1px}
.card canvas{width:100%;height:auto;display:block;border-radius:6px;background:#04182c;margin:4px 0}
.stat{display:flex;align-items:center;gap:5px;font-size:10px;color:#a9d4e4;margin-top:2px}
.stat b{width:44px;flex:0 0 44px;white-space:nowrap;color:#7fe4ff;font-weight:600;font-size:9px}
.bar{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#2adfff,#00e08a)}
.tag{position:absolute;top:6px;right:6px;font-size:9px;padding:2px 6px;border-radius:20px;
  background:rgba(0,190,220,.85);letter-spacing:1px}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:5px 4px;text-align:left;border-bottom:1px solid rgba(140,210,255,.18)}
th{color:#7fe4ff;font-size:10px;letter-spacing:1px}
td.n{text-align:right;font-variant-numeric:tabular-nums}
tr.me td{background:rgba(255,222,77,.14);color:#ffe98a;font-weight:700}
.scroll{max-height:min(46vh,340px);overflow-y:auto;margin-top:8px;
  border:1px solid rgba(140,210,255,.2);border-radius:8px}
.keys{font-size:11px;color:#9fd0e8;line-height:1.8;margin-top:10px;text-align:center}
.keys b{color:#ffde4d}
kbd{display:inline-block;min-width:20px;padding:1px 5px;margin:0 1px;border-radius:4px;font-size:10px;
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25)}
.big{font-size:clamp(26px,9vw,50px);text-align:center;letter-spacing:3px;font-weight:800;
  color:#ffde4d;text-shadow:0 0 18px rgba(255,190,40,.6);margin:6px 0}
.buoyLine{display:flex;gap:10px;justify-content:center;align-items:center;margin:8px 0;flex-wrap:wrap}
.bch{display:flex;align-items:center;gap:6px;font-size:12px;padding:6px 10px;border-radius:8px;
  background:rgba(255,255,255,.06);border:1px solid rgba(140,210,255,.25)}
.bdot{width:14px;height:18px;border-radius:4px}

/* ===== タッチ操作 ===== */
#touch{position:absolute;inset:0;display:none;z-index:5}
#touch.on{display:block}
#pad{position:absolute;left:0;bottom:0;width:48%;height:66%;touch-action:none}
#knob{position:absolute;width:74px;height:74px;margin:-37px 0 0 -37px;border-radius:50%;opacity:0;
  border:2px solid rgba(140,240,255,.75);background:radial-gradient(circle,rgba(80,220,255,.35),rgba(10,50,90,.25));
  transition:opacity .15s;pointer-events:none}
#ring{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;opacity:0;
  border:2px dashed rgba(140,240,255,.35);transition:opacity .15s;pointer-events:none}
.tb{position:absolute;border-radius:50%;border:2px solid rgba(255,255,255,.4);color:#fff;
  font-size:11px;font-weight:800;letter-spacing:1px;text-shadow:0 1px 2px #000;touch-action:none}
#bAcc{right:14px;bottom:16px;width:98px;height:98px;background:radial-gradient(circle at 35% 30%,#5cffc4,#068b6a)}
#bBrk{right:120px;bottom:22px;width:70px;height:70px;background:radial-gradient(circle at 35% 30%,#ff9a8a,#a4331b)}
#bTrk{right:26px;bottom:122px;width:74px;height:74px;background:radial-gradient(circle at 35% 30%,#ffe07a,#c26a06)}
.tb:active{filter:brightness(1.5)}
#pauseBtn{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:40px;height:32px;z-index:6;
  border-radius:8px;border:2px solid rgba(255,255,255,.3);color:#fff;font-size:14px;
  background:rgba(4,24,48,.6);display:none}
#pauseBtn.on{display:block}
#load{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:9;
  background:#02121f;color:#8ff0ff;font-size:14px;letter-spacing:4px}
#load.on{display:flex}
@media(max-width:520px){.panel{padding:14px 10px 18px}.btn{flex:1 1 46%}}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>
  <div id="touch">
    <div id="pad"><div id="ring"></div><div id="knob"></div></div>
    <button class="tb" id="bAcc">ACCEL</button>
    <button class="tb" id="bBrk">BRAKE</button>
    <button class="tb" id="bTrk">TRICK</button>
  </div>
  <button id="pauseBtn">| |</button>
  <div id="ui"></div>
  <div id="load">L O A D I N G . . .</div>
</div>
<script>
'use strict';
/* =========================================================
   WAVE RIDERS ／ ウェーブレース風 水上バイクレース
   - 海面はサイン波の合成でできた高さ場。カメラの前に張った
     グリッドを毎フレーム海面の高さで持ち上げて描いている。
   - 赤ブイは左を、黄ブイは右を通過。連続で正しく通ると
     パワーが上がって最高速アップ。5回ミスで失格。
   ========================================================= */
const $ = id => document.getElementById(id);
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const angNorm = a => { a %= TAU; if (a > Math.PI) a -= TAU; if (a < -Math.PI) a += TAU; return a; };
const KMH = 3.6;                      // 1m/s = 3.6km/h
function newCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
const sh = (hex, f) => {
  const n = parseInt(hex.slice(1), 16);
  return 'rgb(' + (clamp((n >> 16) * f, 0, 255) | 0) + ',' + (clamp(((n >> 8) & 255) * f, 0, 255) | 0) + ',' + (clamp((n & 255) * f, 0, 255) | 0) + ')';
};
const hexRGB = hex => { const n = parseInt(hex.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; };
const mixRGB = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const rgbStr = c => 'rgb(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ')';
const rgba = (hex, a) => { const c = hexRGB(hex); return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; };

/* =========================================================
   サウンド（Web Audioで合成：エンジン・水しぶき・BGM）
   ========================================================= */
const SND = {
  ctx: null, mst: null, on: true, eng: null, bgmOn: false, tmr: 0, stp: 0, next: 0, tempo: .125, key: 0, bg: null,
  init() {
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    this.ctx = new AC();
    this.mst = this.ctx.createGain(); this.mst.gain.value = this.on ? .6 : 0; this.mst.connect(this.ctx.destination);
    const n = this.ctx.createBuffer(1, 44100, 44100), d = n.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    this.noise = n;
  },
  resume() { this.init(); if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  toggle() { this.on = !this.on; if (this.mst) this.mst.gain.value = this.on ? .6 : 0; return this.on; },
  /* --- 水上バイクの2ストローク音：のこぎり波＋うなり＋水のノイズ --- */
  startEngine() {
    if (!this.ctx || this.eng) return;
    const c = this.ctx, g = c.createGain(); g.gain.value = 0; g.connect(this.mst);
    const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 1100; f.Q.value = 4; f.connect(g);
    const o1 = c.createOscillator(); o1.type = 'sawtooth'; o1.frequency.value = 70; o1.connect(f);
    const o2 = c.createOscillator(); o2.type = 'square'; o2.frequency.value = 71.5; o2.connect(f);
    const ng = c.createGain(); ng.gain.value = 0; ng.connect(this.mst);        // 水を切る音
    const nf = c.createBiquadFilter(); nf.type = 'bandpass'; nf.frequency.value = 1200; nf.Q.value = .7; nf.connect(ng);
    const ns = c.createBufferSource(); ns.buffer = this.noise; ns.loop = true; ns.connect(nf);
    o1.start(); o2.start(); ns.start();
    this.eng = { g, f, o1, o2, ng, nf };
  },
  stopEngine() { if (!this.eng) return; try { this.eng.o1.stop(); this.eng.o2.stop(); } catch (e) { } this.eng.g.disconnect(); this.eng.ng.disconnect(); this.eng = null; },
  engine(r, air, spray) {
    if (!this.eng) return;
    const e = this.eng, t = this.ctx.currentTime;
    const f = 62 + r * 250 + (air ? 90 : 0);                                   // 空中は空吹かしで高く
    e.o1.frequency.setTargetAtTime(f, t, .05); e.o2.frequency.setTargetAtTime(f * 1.497, t, .05);
    e.f.frequency.setTargetAtTime(600 + r * 2400, t, .06);
    e.g.gain.setTargetAtTime(.05 + r * .10, t, .08);
    e.ng.gain.setTargetAtTime(air ? .004 : (.012 + spray * .06), t, .12);
    e.nf.frequency.setTargetAtTime(500 + spray * 2200, t, .12);
  },
  blip(freq, dur, type, vol, slide) {
    if (!this.ctx) return;
    const c = this.ctx, t = c.currentTime, o = c.createOscillator(), g = c.createGain();
    o.type = type || 'square'; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, slide), t + dur);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol || .2, t + .008);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(this.mst); o.start(t); o.stop(t + dur + .02);
  },
  nz(dur, vol, f0, f1, type) {
    if (!this.ctx) return;
    const c = this.ctx, t = c.currentTime, s = c.createBufferSource(); s.buffer = this.noise;
    const fl = c.createBiquadFilter(); fl.type = type || 'bandpass'; fl.frequency.setValueAtTime(f0, t);
    fl.frequency.exponentialRampToValueAtTime(Math.max(60, f1 || f0), t + dur); fl.Q.value = 1.0;
    const g = c.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    s.connect(fl); fl.connect(g); g.connect(this.mst); s.start(t); s.stop(t + dur + .02);
  },
  sfx(k) {
    if (!this.ctx || !this.on) return;
    switch (k) {
      case 'splash': this.nz(.45, .28, 2600, 300); break;                       // 着水
      case 'small': this.nz(.16, .10, 3000, 900); break;
      case 'jump': this.nz(.3, .16, 900, 2600); this.blip(320, .25, 'triangle', .07, 760); break;
      case 'buoy': this.blip(1180, .09, 'sine', .16, 1560); break;              // ブイ通過（正）
      case 'miss': this.blip(240, .3, 'sawtooth', .16, 90); break;              // ブイ通過（誤）
      case 'hit': this.nz(.26, .3, 1200, 160, 'lowpass'); this.blip(110, .2, 'square', .12, 48); break;
      case 'trick': [0, 5, 9, 12].forEach((n, i) => setTimeout(() => this.blip(520 * Math.pow(2, n / 12), .12, 'square', .13), i * 55)); break;
      case 'ring': this.blip(880, .1, 'sine', .16, 1760); break;
      case 'power': this.blip(660, .16, 'square', .16, 1320); break;
      case 'beep': this.blip(700, .12, 'square', .2); break;
      case 'go': this.blip(1400, .5, 'square', .22); break;
      case 'lap': this.blip(880, .1, 'square', .16); setTimeout(() => this.blip(1320, .2, 'square', .16), 90); break;
      case 'ok': [0, 4, 7, 12].forEach((n, i) => setTimeout(() => this.blip(440 * Math.pow(2, n / 12), .22, 'square', .17), i * 90)); break;
      case 'ng': [0, -3, -7].forEach((n, i) => setTimeout(() => this.blip(330 * Math.pow(2, n / 12), .3, 'sawtooth', .15), i * 130)); break;
      case 'dq': [0, -2, -5, -9].forEach((n, i) => setTimeout(() => this.blip(300 * Math.pow(2, n / 12), .4, 'sawtooth', .16), i * 160)); break;
    }
  }
};
/* --- BGM（16分音符のステップシーケンサ：サーフロック風） --- */
Object.assign(SND, {
  toneAt(f, dur, type, vol, t, dec) {
    const c = this.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .01);
    g.gain.exponentialRampToValueAtTime(.0001, t + (dec || dur));
    o.connect(g); g.connect(this.bg); o.start(t); o.stop(t + dur + .05);
  },
  drumAt(kind, t) {
    const c = this.ctx;
    if (kind === 'k') {
      const o = c.createOscillator(), g = c.createGain();
      o.type = 'sine'; o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(44, t + .12);
      g.gain.setValueAtTime(.5, t); g.gain.exponentialRampToValueAtTime(.001, t + .18);
      o.connect(g); g.connect(this.bg); o.start(t); o.stop(t + .2);
    } else {
      const s = c.createBufferSource(); s.buffer = this.noise;
      const f = c.createBiquadFilter(); f.type = kind === 's' ? 'bandpass' : 'highpass';
      f.frequency.value = kind === 's' ? 1900 : 7600; f.Q.value = 1;
      const g = c.createGain(); const v = kind === 's' ? .3 : .09, d = kind === 's' ? .14 : .04;
      g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
      s.connect(f); f.connect(g); g.connect(this.bg); s.start(t); s.stop(t + d + .02);
    }
  },
  bgmStart(seed) {
    this.init(); if (!this.ctx) return;
    if (!this.bg) { this.bg = this.ctx.createGain(); this.bg.gain.value = .30; this.bg.connect(this.mst); }
    this.bgmOn = true; this.stp = 0; this.next = this.ctx.currentTime + .08;
    this.key = [0, 5, 3, 7, 10, 2][seed % 6];
    this.tempo = [.126, .122, .118, .130, .114, .110][seed % 6];
    clearInterval(this.tmr); this.tmr = setInterval(() => this.sched(), 25);
  },
  bgmStop() { this.bgmOn = false; clearInterval(this.tmr); this.tmr = 0; },
  sched() {
    if (!this.bgmOn || !this.ctx) return;
    while (this.next < this.ctx.currentTime + .2) { this.beat(this.stp, this.next); this.next += this.tempo; this.stp++; }
  },
  beat(s, t) {
    const mid = n => 440 * Math.pow(2, (n - 69) / 12);
    const prog = [0, 5, 3, -2], root = 38 + this.key + prog[(s >> 4) & 3];
    const arp = [0, 7, 12, 16, 19, 16, 12, 7], sc = [0, 2, 4, 7, 9];
    const i = s & 15;
    if (i % 2 === 0) this.toneAt(mid(root + (i % 8 === 6 ? 12 : 0)), .13, 'sawtooth', .17, t, .17);   // ベース
    this.toneAt(mid(root + 24 + arp[i & 7]), .06, 'square', .07, t, .1);                              // アルペジオ
    if (i % 8 === 0 || i === 10) this.toneAt(mid(root + 31 + sc[(s >> 2) % 5]), .34, 'triangle', .08, t, .38);
    if (i % 4 === 0) this.drumAt('k', t);
    if (i % 8 === 4) this.drumAt('s', t);
    if (i % 2 === 1) this.drumAt('h', t);
  }
});

/* =========================================================
   海面：進む向きの違うサイン波を4本重ねた高さ場
   波長から角周波数を ω=√(g·k) で決めているので、
   長い波ほどゆっくり、短い波ほど速く進む（深海波の関係）
   ========================================================= */
const WCOMP = [
  { a: 1.00, len: 78, dir: 0.00, w: 1.00 },   // うねり（本命）
  { a: 0.52, len: 44, dir: 0.70, w: 1.00 },   // 斜めから来る波
  { a: 0.26, len: 21, dir: -1.05, w: 1.05 },  // さざ波
  { a: 0.11, len: 9.5, dir: 2.10, w: 1.15 }   // 細かいチョップ
];
const WV = WCOMP.map(() => ({ A: 0, kx: 0, kz: 0, om: 0, ph: 0 }));
let SEA = 1;                                   // 波の高さ倍率（コース×設定）
function setupSea(amp, base) {
  SEA = amp;
  for (let i = 0; i < WCOMP.length; i++) {
    const c = WCOMP[i], k = TAU / c.len, d = base + c.dir, v = WV[i];
    v.A = c.a * amp; v.kx = k * Math.cos(d); v.kz = k * Math.sin(d);
    v.om = Math.sqrt(9.8 * k) * c.w; v.ph = 0;
  }
}
function seaPhase(t) { for (let i = 0; i < WV.length; i++) WV[i].ph = -WV[i].om * t; }
const RIDE = 3;                                // 船体が乗る波（短いチョップは除く）
function seaH(x, z, n) {
  const N = n || WV.length;
  let h = 0;
  for (let i = 0; i < N; i++) { const v = WV[i]; h += v.A * Math.sin(v.kx * x + v.kz * z + v.ph); }
  return h;
}
/* 高さと傾き（∂h/∂x, ∂h/∂z）をまとめて返す */
const SL = { h: 0, dx: 0, dz: 0 };
function seaSlope(x, z, n) {
  const N = n || WV.length;
  let h = 0, dx = 0, dz = 0;
  for (let i = 0; i < N; i++) {

function boxFaces(add, c, hx, hy, hz, role) {

  add(role, [[X0, Y0, Z0], [X0, Y1, Z0], [X1, Y1, Z0], [X1, Y0, Z0]]);
  add(role, [[X0, Y0, Z0], [X1, Y0, Z0], [X1, Y0, Z1], [X0, Y0, Z1]]);
  add(role, [[X0, Y1, Z0], [X0, Y1, Z1], [X1, Y1, Z1], [X1, Y1, Z0]]);
  add(role, [[X0, Y0, Z0], [X0, Y0, Z1], [X0, Y1, Z1], [X0, Y1, Z0]]);

/* 2点をつなぐ四角柱（腕・脚・胴・支柱に使う） */
function tubeFaces(add, a, b, r, role) {
  const dx = b[0] - a[0], dy = b[1] - a[1], dz = b[2] - a[2];
  const L = Math.hypot(dx, dy, dz) || 1;
  const ux = dx / L, uy = dy / L, uz = dz / L;
  let px = -uy, py = ux, pz = 0, pl = Math.hypot(px, py, pz);
  if (pl < 1e-4) { px = 1; py = 0; pz = 0; pl = 1; }
  px /= pl; py /= pl; pz /= pl;
  const qx = uy * pz - uz * py, qy = uz * px - ux * pz, qz = ux * py - uy * px;
  const c = [[px, py, pz], [qx, qy, qz], [-px, -py, -pz], [-qx, -qy, -qz]];
  for (let i = 0; i < 4; i++) {
    const c0 = c[i], c1 = c[(i + 1) % 4];
    add(role, [
      [a[0] + c0[0] * r, a[1] + c0[1] * r, a[2] + c0[2] * r],
      [a[0] + c1[0] * r, a[1] + c1[1] * r, a[2] + c1[2] * r],
      [b[0] + c1[0] * r, b[1] + c1[1] * r, b[2] + c1[2] * r],
      [b[0] + c0[0] * r, b[1] + c0[1] * r, b[2] + c0[2] * r]]);
  }
  add(role, c.map(v => [b[0] + v[0] * r, b[1] + v[1] * r, b[2] + v[2] * r]));
  add(role, c.map(v => [a[0] + v[0] * r, a[1] + v[1] * r, a[2] + v[2] * r]));
}

const SPR_N = 24, SPR_SC = 30, SPR_W = 110, SPR_H = 92, SPR_AX = 55, SPR_AY = 66;
const EL = .30, CEL = Math.cos(EL), SEL = Math.sin(EL);
function drawModel(g, model, cols, a) {
  const ca = Math.cos(a), sa = Math.sin(a), LT = [-.42, -.32, .85], faces = [];
  for (const f of model) {
    const v = f.p.map(q => {
      const X = q[0] * ca + q[1] * sa, Y = -q[0] * sa + q[1] * ca, Z = q[2];
      return { X, Y, Z, sx: SPR_AX + X * SPR_SC, sy: SPR_AY - (Y * SEL + Z * CEL) * SPR_SC, d: Y * CEL - Z * SEL };
    });
    const ax = v[1].X - v[0].X, ay = v[1].Y - v[0].Y, az = v[1].Z - v[0].Z;
    const bx = v[2].X - v[0].X, by = v[2].Y - v[0].Y, bz = v[2].Z - v[0].Z;
    let nx = ay * bz - az * by, ny = az * bx - ax * bz, nz = ax * by - ay * bx;
    const nl = Math.hypot(nx, ny, nz) || 1; nx /= nl; ny /= nl; nz /= nl;
    if (ny * CEL - nz * SEL > 0) { nx = -nx; ny = -ny; nz = -nz; }
    const li = clamp(.56 + .58 * (nx * LT[0] + ny * LT[1] + nz * LT[2]), .34, 1.28);
    let dep = 0; for (const q of v) dep += q.d; dep /= v.length;
    faces.push({ v, dep, c: cols[f.c], li });
  }
  faces.sort((p, q) => q.dep - p.dep);
  for (const f of faces) {
    g.beginPath(); g.moveTo(f.v[0].sx, f.v[0].sy);
    for (let i = 1; i < f.v.length; i++) g.lineTo(f.v[i].sx, f.v[i].sy);
    g.closePath();
    g.fillStyle = sh(f.c, f.li); g.fill();
    g.lineWidth = .6; g.strokeStyle = 'rgba(0,20,40,.45)'; g.stroke();
  }

/* =========================================================
   コース生成：スプライン → 等間隔サンプル → ブイ／景色
   ========================================================= */
const STEP = 4;                                    // コース中心線のサンプル間隔(m)
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const cr = (p0, p1, p2, p3, t) => {                 // Catmull-Rom
  const t2 = t * t, t3 = t2 * t;
  return .5 * ((2 * p1) + (-p0 + p2) * t + (2 * p0 - 5 * p1 + 4 * p2 - p3) * t2 + (-p0 + 3 * p1 - 3 * p2 + p3) * t3);
};
let TR = null;
function buildCourse(ci) {
  const cs = COURSES[ci], rng = mulberry32(1234 + ci * 977);
  /* --- 中心線 --- */
  const K = .82;                                   // コース全体の大きさ
  const ctrl = cs.wp.map(w => [Math.cos(w[0] * Math.PI / 180) * w[1] * K, Math.sin(w[0] * Math.PI / 180) * w[1] * K]);
  const n = ctrl.length, raw = [];
  for (let i = 0; i < n; i++) {
    const p0 = ctrl[(i - 1 + n) % n], p1 = ctrl[i], p2 = ctrl[(i + 1) % n], p3 = ctrl[(i + 2) % n];
    for (let s = 0; s < 30; s++) {
      const t = s / 30;
      raw.push([cr(p0[0], p1[0], p2[0], p3[0], t), cr(p0[1], p1[1], p2[1], p3[1], t)]);
    }
  }
  /* 弧長で等間隔に取り直す */
  const rn = raw.length, seg = [];
  let len = 0;
  for (let i = 0; i < rn; i++) {
    const a = raw[i], b = raw[(i + 1) % rn];
    const d = Math.hypot(b[0] - a[0], b[1] - a[1]);
    seg.push(d); len += d;
  }
  const m = Math.max(64, Math.round(len / STEP)), total = m * STEP;
  const PT = [];
  let si = 0, acc = 0;
  for (let i = 0; i < m; i++) {
    const want = i * len / m;
    while (acc + seg[si] < want && si < rn - 1) { acc += seg[si]; si++; }
    const f = seg[si] > 0 ? (want - acc) / seg[si] : 0;
    const a = raw[si], b = raw[(si + 1) % rn];
    PT.push({ x: lerp(a[0], b[0], f), z: lerp(a[1], b[1], f), ang: 0, rx: 0, rz: 0 });
  }
  for (let i = 0; i < m; i++) {
    const a = PT[i], b = PT[(i + 1) % m];
    const ang = Math.atan2(b.x - a.x, b.z - a.z);
    a.ang = ang; a.rx = Math.cos(ang); a.rz = -Math.sin(ang);     // 進行方向に対する右
  }
  /* --- ブイ（pat の1文字＝1ゲート） --- */
  const pat = cs.pat, gc = pat.length, buoys = [], gates = [];
  for (let i = 0; i < gc; i++) {
    const k = pat[i], s = ((i + .75) / gc) * total;
    const g = { s, bs: [], tl: 0, k };
    if (k === 'G') {
      g.bs.push(mkBuoy(PT, m, s, cs.gw, 'r', -1));
      g.bs.push(mkBuoy(PT, m, s, -cs.gw, 'y', 1));
      g.tl = 0;
    } else if (k === 'L') {
      g.bs.push(mkBuoy(PT, m, s, -cs.boff * .5, 'r', -1));
      g.tl = -cs.boff * .5 - 7;
    } else {
      g.bs.push(mkBuoy(PT, m, s, cs.boff * .5, 'y', 1));
      g.tl = cs.boff * .5 + 7;
    }
    for (const b of g.bs) { b.g = gates.length; buoys.push(b); }
    gates.push(g);
  }
  /* --- CPUの走行ライン（ゲート間をなめらかにつなぐ） --- */
  const LINE = new Float32Array(m);
  for (let gi = 0; gi < gates.length; gi++) {

/* =========================================================

   ========================================================= */
function updateRacer(r, dt) {

  }

  const fx = Math.sin(r.yaw), fz = Math.cos(r.yaw);

  for (let i = 0; i < RIDE; i++) { const v = WV[i]; dh += -v.A * v.om * Math.cos(v.kx * r.x + v.kz * r.z + v.ph); }

    const need = (dh - r.lastDh) / Math.max(dt, .001);  // 海面に貼りつくのに要る加速度
    r.y = sh0;

      const n = Math.max(1, Math.floor(turns + .22));
      r.tscore += 300 * n;
      r.boostT = Math.max(r.boostT, .85);
      r.power = Math.min(5, r.power + 1);
      if (r.isP) { toast((r.trick.kind === 'roll' ? 'バレルロール' : 'フリップ') + ' ×' + n + '　+' + (300 * n)); SND.sfx('trick'); }
    } else if (turns > .3) {
      r.spd *= .6;
      if (r.isP) toast('トリック しっぱい…');

  }

    r.wipe = 1.7; r.spd *= .18; SND.sfx('splash');
    if (r.isP) { toast('てんとう！'); G.shake = .5; }
  } else {
    if (r.airT > .34) {

/* =========================================================
   CPU
   ========================================================= */

  const p = pathPos(r.prog + look, tl);

    r.trot = 0;
  }

  const P = G.P;
  if (P && !P.dq) {
    const gap = (r.lap * TR.total + r.prog) - (P.lap * TR.total + P.prog);

/* レーサー同士のあたり */

  for (let i = 0; i < rs.length; i++) for (let j = i + 1; j < rs.length; j++) {
    const a = rs[i], b = rs[j];
    if (a.fin && b.fin) continue;
    const dx = b.x - a.x, dz = b.z - a.z, d2 = dx * dx + dz * dz;
    if (d2 > 9 || d2 < .0001) continue;

    b.x += nx * push * (wa / tw); b.z += nz * push * (wa / tw);
    if (a.hitT <= 0 && b.hitT <= 0) {

/* ブイ・障害物・ジャンプ台・リングとのあたり */

/* =========================================================

const IN = { steer: 0, acc: 0, brk: 0, lean: 0, trick: 0, kl: 0, kr: 0, ku: 0, kd: 0 };
const KEY = {};
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(k)) e.preventDefault();
  if (KEY[k]) return; KEY[k] = 1; keyUpd();
  if (k === 'p' || k === 'escape') togglePause();
  if (k === 'm') { const on = SND.toggle(); toast(on ? 'SOUND ON' : 'SOUND OFF'); }
});
window.addEventListener('keyup', e => { KEY[e.key.toLowerCase()] = 0; keyUpd(); });
window.addEventListener('blur', () => { for (const k in KEY) KEY[k] = 0; keyUpd(); });
function keyUpd() {
  IN.kl = (KEY['arrowleft'] || KEY['a']) ? 1 : 0;
  IN.kr = (KEY['arrowright'] || KEY['d']) ? 1 : 0;
  IN.ku = (KEY['arrowup'] || KEY['w']) ? 1 : 0;
  IN.kd = (KEY['arrowdown'] || KEY['s']) ? 1 : 0;
  IN.acc = (KEY['z'] || KEY[' ']) ? 1 : 0;
  IN.brk = (KEY['x']) ? 1 : 0;
  IN.trick = (KEY['c'] || KEY['shift']) ? 1 : 0;
}
let padId = null, padX = 0, padY = 0, tSteer = 0, tLean = 0;
function initTouch() {
  const pad = $('pad'), knob = $('knob'), ring = $('ring');
  const set = (x, y, show) => {
    knob.style.left = x + 'px'; knob.style.top = y + 'px';
    ring.style.left = ring.style.left; knob.style.opacity = ring.style.opacity = show ? 1 : 0;
  };
  const setRing = (x, y) => { ring.style.left = x + 'px'; ring.style.top = y + 'px'; };
  pad.addEventListener('touchstart', e => {
    const t = e.changedTouches[0]; padId = t.identifier; padX = t.clientX; padY = t.clientY;
    const r = pad.getBoundingClientRect(); setRing(t.clientX - r.left, t.clientY - r.top); set(t.clientX - r.left, t.clientY - r.top, 1);
    e.preventDefault();
  }, { passive: false });
  pad.addEventListener('touchmove', e => {
    for (const t of e.changedTouches) if (t.identifier === padId) {
      tSteer = clamp((t.clientX - padX) / 54, -1, 1);
      tLean = clamp(-(t.clientY - padY) / 54, -1, 1);
      const r = pad.getBoundingClientRect();
      set(clamp(t.clientX - r.left, 0, r.width), clamp(t.clientY - r.top, 0, r.height), 1);
    }
    e.preventDefault();
  }, { passive: false });
  const end = e => { for (const t of e.changedTouches) if (t.identifier === padId) { padId = null; tSteer = 0; tLean = 0; set(0, 0, 0); } };
  pad.addEventListener('touchend', end); pad.addEventListener('touchcancel', end);
  const hold = (el, on, off) => {
    const s = e => { e.preventDefault(); on(); }, t = e => { e.preventDefault(); off(); };
    el.addEventListener('touchstart', s, { passive: false });
    el.addEventListener('touchend', t); el.addEventListener('touchcancel', t);
    el.addEventListener('mousedown', s); el.addEventListener('mouseup', t); el.addEventListener('mouseleave', t);
  };
  hold($('bAcc'), () => IN.acc = 1, () => IN.acc = 0);
  hold($('bBrk'), () => IN.brk = 1, () => IN.brk = 0);
  hold($('bTrk'), () => IN.trick = 1, () => IN.trick = 0);
  $('pauseBtn').addEventListener('click', () => togglePause());
}
function readInput() {
  const p = G.P; if (!p) return;
  const st = clamp(IN.kr - IN.kl + tSteer, -1, 1);
  const ln = clamp(IN.ku - IN.kd + tLean, -1, 1);
  p.in.steer = st; p.in.lean = ln;
  p.in.acc = (IN.acc || G.autoAcc) ? 1 : 0;
  p.in.brk = IN.brk;
  p.in.trick = IN.trick;
  if (G.phase === 'finish' || G.phase === 'dq') { p.in.acc = G.phase === 'finish' ? 1 : 0; p.in.steer *= .4; }
  /* 空中でトリック */
  if (p.air && p.airT > .1 && !p.trick && IN.trick && p.wipe <= 0) {
    let kind = 'roll', sp = TAU * 1.35;
    if (Math.abs(st) > .3) { kind = 'roll'; sp = TAU * 1.4 * (st > 0 ? 1 : -1); }
    else if (ln < -.3) { kind = 'flip'; sp = TAU * 1.15; }
    else if (ln > .3) { kind = 'flip'; sp = -TAU * 1.15; }
    p.trick = { kind, sp }; p.trot = 0;
  }
}

/* =========================================================
   レース進行
   ========================================================= */
function startRace(mode) {
  G.mode = mode || G.mode;
  $('load').classList.add('on');
  hideUI();
  setTimeout(() => {
    TR = buildCourse(G.ci);
    const cs = TR.cs;
    setupSea(cs.sea * SEASET[G.seaSet].k, cs.wdir);
    buildLUT(cs); buildBackdrop(cs);
    G.laps = cs.laps; G.time = 0; G.wt = 0; G.finN = 0; G.finT = 0; G.bestLap = 0;
    G.rings = 0; G.buoyOK = 0; G.stuntT = 90; G.msgT = 0; G.shake = 0;
    G.buoyFlash = 0; G.missFlash = 0; G.paused = false;
    FX.length = 0;
    const solo = (mode === 'time' || mode === 'stunt');
    const rs = [];
    if (solo) {
      const r = makeRacer(G.rider, true, 1); rs.push(r);
    } else {
      const order = [];
      for (let i = 0; i < RIDERS.length; i++) if (i !== G.rider) order.push(i);
      for (let i = order.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0;[order[i], order[j]] = [order[j], order[i]]; }
      order.push(G.rider);                                  // プレイヤーは最後尾スタート
      for (let g = 0; g < order.length; g++) {
        const r = makeRacer(order[g], order[g] === G.rider, g + 1);
        r.sk = G.skill * r.R.sk * rand(.965, 1.035);
        r.aiTop = r.R.top * r.sk;
        r.aiLane = rand(-2.6, 2.6);
        rs.push(r);
      }
    }
    G.racers = rs; G.P = rs.find(r => r.isP);
    for (let i = 0; i < rs.length; i++) placeOnGrid(rs[i], solo ? 0 : i, rs.length);
    seaPhase(0);
    cam.x = G.P.x - Math.sin(G.P.yaw) * 9; cam.z = G.P.z - Math.cos(G.P.yaw) * 9;
    cam.yaw = G.P.yaw; cam.y = seaH(cam.x, cam.z) + 2.75; cam.pitch = 0; cam.roll = 0;
    HZ = VH * .38;
    G.phase = 'count'; G.count = 3.6; G.state = 'race';
    G.touch = touchMode();
    $('touch').classList.toggle('on', G.touch);
    $('pauseBtn').classList.add('on');
    $('load').classList.remove('on');
    SND.resume(); SND.startEngine(); SND.bgmStart(G.ci);
    lastT = performance.now();
  }, 40);
}
function updateRace(dt) {
  G.wt += dt;
  seaPhase(G.wt);
  if (G.phase === 'count') {
    G.count -= dt;
    const n = Math.ceil(G.count);
    if (n !== G.lastCount) { G.lastCount = n; if (n > 0 && n <= 3) SND.sfx('beep'); }
    if (G.count <= 0) { G.phase = 'race'; SND.sfx('go'); G.P.lapS = 0; }
  } else if (G.phase === 'race') {
    G.time += dt;
    if (G.mode === 'stunt') {
      G.stuntT -= dt;
      if (G.stuntT <= 0) { G.stuntT = 0; G.phase = 'finish'; G.finT = 0; SND.sfx('ok'); }
    }
  } else {
    /* ゴール後：ほかのレーサーが入ってくるのを少し待つ */
    G.finT += dt; G.time += dt;
    const done = G.phase === 'dq' || G.racers.every(r => r.fin);
    if (!G.resultShown && (G.finT > 9 || (done && G.finT > 2.8))) { G.resultShown = 1; showResult(); }
  }
  readInput();
  for (const r of G.racers) {
    if (!r.isP) aiControl(r, dt);
    if (r.fin && !r.isP) { r.in.acc = 1; }
    updateRacer(r, dt);
    objectCollide(r, dt);
  }
  racerCollide();
  /* 順位 */
  const rs = G.racers.slice();
  rs.sort((a, b) => {
    if (a.fin && b.fin) return a.finRank - b.finRank;
    if (a.fin) return -1; if (b.fin) return 1;
    return (b.lap * TR.total + b.prog) - (a.lap * TR.total + a.prog);
  });
  for (let i = 0; i < rs.length; i++) rs[i].rank = i + 1;
  updFX(dt);
  if (G.msgT > 0) G.msgT -= dt;
  if (G.shake > 0) G.shake -= dt * 1.6;
  if (G.buoyFlash > 0) G.buoyFlash -= dt * 1.6;
  if (G.missFlash > 0) G.missFlash -= dt * 1.6;
  /* 全員ゴールしたら終了 */
  if (G.phase === 'race' && G.mode !== 'stunt' && G.P.fin) { }
  const p = G.P;
  SND.engine(clamp(p.spd / p.R.top, 0, 1.15) * (p.in.acc ? 1 : .55), p.air, p.sprayV);
}
function togglePause() {

  else { hideUI(); SND.startEngine(); $('touch').classList.toggle('on', G.touch); $('pauseBtn').classList.add('on'); lastT = performance.now(); }
}
function quitRace() {

/* =========================================================
   メインループ
   ========================================================= */
let lastT = 0, accT = 0;
function loop(t) {
  requestAnimationFrame(loop);
  const now = t || performance.now();
  let dt = (now - lastT) / 1000; lastT = now;
  if (!(dt > 0)) dt = 1 / 60;
  if (dt > .1) dt = .1;
  if (G.state !== 'race' || !TR) return;
  if (!G.paused) {
    accT += dt;
    let n = 0;
    while (accT >= 1 / 120 && n < 12) { updateRace(1 / 120); accT -= 1 / 120; n++; }
    updateCam(dt);
  }
  const t0 = performance.now();
  render();
  /* 重かったら描画を粗くする */
  Q.acc += performance.now() - t0; Q.n++;
  if (Q.n >= 90) {
    if (!Q.low && Q.acc / Q.n > 13) { Q.low = true; resize(); }
    Q.acc = 0; Q.n = 0;
  }
}

    g.fillStyle = gr; g.fillRect(0, 0, c.width, c.height);
    const k = Math.min(c.width, c.height) / t.mm.S;
    g.drawImage(t.map, (c.width - t.mm.S * k) / 2, (c.height - t.mm.S * k) / 2, t.mm.S * k, t.mm.S * k);
  });
  TR = null;
}
function riderScreen() {
  let h = '<div class="panel"><h2>ライダーをえらぶ</h2><div class="grid">';
  for (let i = 0; i < RIDERS.length; i++) {
    const R = RIDERS[i];
    h += '<div class="card' + (i === G.rider ? ' sel' : '') + '" data-r="' + i + '">' +
      '<h3 style="color:' + R.c1 + '">' + R.name + '</h3><div class="en">' + R.en + ' / ' + R.mach + '</div>' +
      '<canvas class="rc" width="150" height="84" data-ri="' + i + '"></canvas>' +
      statBar('最高速', R.top - 28.5, 4.2) + statBar('加速', R.acc - 6.8, 3.2) +
      statBar('旋回', R.turn - 1.7, .8) + statBar('安定', R.wt - .7, .7) + '</div>';
  }
  h += '</div><div class="row"><button class="btn pri" id="bGo">スタート</button>' +
    '<button class="btn gray" id="bBack">もどる</button></div></div>';
  const u = showUI(h);
  paintRiderCards();
  u.querySelectorAll('.card').forEach(el => el.onclick = () => {
    G.rider = +el.dataset.r;
    u.querySelectorAll('.card').forEach(e2 => e2.classList.toggle('sel', +e2.dataset.r === G.rider));
  });
  u.querySelector('#bGo').onclick = () => { G.resultShown = 0; startRace(G.mode); };
  u.querySelector('#bBack').onclick = () => G.mode === 'gp' ? cupScreen() : courseScreen();
}
function paintRiderCards() {
  document.querySelectorAll('canvas.rc').forEach(c => {
    const g = c.getContext('2d'), i = +c.dataset.ri;
    g.clearRect(0, 0, c.width, c.height);
    const im = SPR[i][20], k = Math.min(c.width / SPR_W, c.height / SPR_H) * 1.5;
    g.imageSmoothingEnabled = true;
    g.drawImage(im, (c.width - SPR_W * k) / 2, (c.height - SPR_H * k) / 2 + 6, SPR_W * k, SPR_H * k);
  });
}
function pauseScreen() {
  const u = showUI('<div class="panel" style="width:min(360px,100%)"><h2>ポーズ</h2>' +
    '<div class="lead">' + TR.cs.name + '　LAP ' + clamp(G.P.lap, 1, G.laps) + '/' + G.laps + '</div>' +
    '<div class="row"><button class="btn pri" id="bR">つづける</button></div>' +
    '<div class="row"><button class="btn gray" id="bS">' + (SND.on ? '🔊 サウンド' : '🔇 サウンド') + '</button>' +
    '<button class="btn gray" id="bQ">やめる</button></div></div>');
  u.querySelector('#bR').onclick = () => togglePause();
  u.querySelector('#bS').onclick = e => { const on = SND.toggle(); e.target.textContent = on ? '🔊 サウンド' : '🔇 サウンド'; };
  u.querySelector('#bQ').onclick = () => { quitRace(); titleScreen(); };
}
/* =========================================================
   リザルト
   ========================================================= */
function showResult() {
  const p = G.P, cs = TR.cs, b = G.best[cs.id] || (G.best[cs.id] = {});
  SND.stopEngine(); SND.bgmStop();
  $('touch').classList.remove('on'); $('pauseBtn').classList.remove('on');
  G.paused = true;
  if (G.mode === 'stunt') {
    const sc = p.tscore;
    const nb = !b.stunt || sc > b.stunt;
    if (nb) { b.stunt = sc; save(); }
    const u = showUI('<div class="panel"><h2>スタント リザルト</h2>' +
      '<div class="big">' + sc + ' pt</div>' +
      '<div class="lead">リング ' + G.rings + '/' + TR.rings.length + '　' + (nb ? '<b style="color:#ffde4d">ハイスコア更新！</b>' : 'ベスト ' + b.stunt + ' pt') + '</div>' +
      '<div class="row"><button class="btn pri" id="bA">もういちど</button>' +
      '<button class="btn" id="bC">コースをかえる</button>' +
      '<button class="btn gray" id="bT">タイトル</button></div></div>');
    u.querySelector('#bA').onclick = () => { G.resultShown = 0; startRace('stunt'); };
    u.querySelector('#bC').onclick = () => { quitRace(); courseScreen(); };
    u.querySelector('#bT').onclick = () => { quitRace(); titleScreen(); };
    return;
  }
  if (G.phase === 'dq') {
    const u = showUI('<div class="panel"><h2>しっかく</h2>' +
      '<div class="lead">ブイを5回まちがえてしまった。<br>赤いブイは<b style="color:#ff8a7a">左</b>、黄色いブイは<b style="color:#ffe07a">右</b>を通ろう。</div>' + BUOYHELP +
      '<div class="row"><button class="btn pri" id="bA">やりなおす</button>' +
      '<button class="btn gray" id="bT">タイトル</button></div></div>');
    u.querySelector('#bA').onclick = () => { G.resultShown = 0; startRace(G.mode); };
    u.querySelector('#bT').onclick = () => { quitRace(); titleScreen(); };
    return;
  }
  if (G.mode === 'time') {
    const tot = p.finT, nbl = !b.lap || G.bestLap < b.lap, nbt = !b.race || tot < b.race;
    if (nbl) b.lap = G.bestLap;
    if (nbt) b.race = tot;
    if (nbl || nbt) save();
    let rows = '';
    p.lapT.forEach((t, i) => rows += '<tr><td>LAP ' + (i + 1) + '</td><td class="n">' + fmtT(t) + '</td></tr>');
    const u = showUI('<div class="panel"><h2>タイムアタック リザルト</h2>' +
      '<div class="big">' + fmtT(tot) + '</div>' +
      '<div class="lead">ベストラップ <b style="color:#8ff0ff">' + fmtT(G.bestLap) + '</b>' + (nbl ? ' <b style="color:#ffde4d">更新！</b>' : '') + '</div>' +
      '<table>' + rows + '</table>' +
      '<div class="row"><button class="btn pri" id="bA">もういちど</button>' +
      '<button class="btn" id="bC">コースをかえる</button>' +
      '<button class="btn gray" id="bT">タイトル</button></div></div>');
    u.querySelector('#bA').onclick = () => { G.resultShown = 0; startRace('time'); };
    u.querySelector('#bC').onclick = () => { quitRace(); courseScreen(); };
    u.querySelector('#bT').onclick = () => { quitRace(); titleScreen(); };
    return;
  }
  /* レース（フリーラン／チャンピオンシップ） */
  const order = G.racers.slice().sort((a, b2) => {
    if (a.fin && b2.fin) return a.finRank - b2.finRank;
    if (a.fin) return -1; if (b2.fin) return 1;
    return (b2.lap * TR.total + b2.prog) - (a.lap * TR.total + a.prog);
  });
  if (G.bestLap && (!b.lap || G.bestLap < b.lap)) { b.lap = G.bestLap; save(); }
  let rows = '<tr><th>順位</th><th>ライダー</th><th>タイム</th>' + (G.mode === 'gp' ? '<th class="n">PT</th>' : '') + '</tr>';
  order.forEach((r, i) => {
    const pt = POINTS[i] || 0;
    if (G.mode === 'gp') G.gp.pts[r.ri] += pt;
    rows += '<tr class="' + (r.isP ? 'me' : '') + '"><td>' + (i + 1) + '</td><td>' + r.name + '</td>' +
      '<td class="n">' + (r.fin ? fmtT(r.finT) : '- - -') + '</td>' + (G.mode === 'gp' ? '<td class="n">' + pt + '</td>' : '') + '</tr>';
  });
  const rank = order.indexOf(p) + 1;
  let h = '<div class="panel"><h2>' + TR.cs.name + '　リザルト</h2>' +
    '<div class="big">' + ORD(rank) + '</div>' +
    '<div class="lead">ベストラップ <b style="color:#8ff0ff">' + fmtT(G.bestLap) + '</b>　ブイ成功 ' + G.buoyOK + '　ミス ' + p.miss + '</div>' +
    '<div class="scroll"><table>' + rows + '</table></div>';
  if (G.mode === 'gp') {
    const cup = CUPS[G.cup], ok = rank <= cup.need;
    h += '<div class="lead">' + (ok ? '<b style="color:#7bffd0">' + cup.need + '位以内！つぎのコースへ</b>' : '<b style="color:#ff8a7a">' + cup.need + '位以内に入れなかった…</b>') + '</div>' +
      '<div class="row">' + (ok ? '<button class="btn pri" id="bN">つぎへ</button>' : '<button class="btn pri" id="bA">やりなおす</button>') +
      '<button class="btn gray" id="bT">やめる</button></div></div>';
  } else {
    h += '<div class="row"><button class="btn pri" id="bA">もういちど</button>' +
      '<button class="btn" id="bC">コースをかえる</button>' +
      '<button class="btn gray" id="bT">タイトル</button></div></div>';
  }
  const u = showUI(h);
  const bA = u.querySelector('#bA'), bN = u.querySelector('#bN'), bC = u.querySelector('#bC');
  if (bA) bA.onclick = () => { if (G.mode === 'gp') { for (let i = 0; i < RIDERS.length; i++) G.gp.pts[i] -= (POINTS[order.findIndex(r => r.ri === i)] || 0); } G.resultShown = 0; startRace(G.mode); };
  if (bC) bC.onclick = () => { quitRace(); courseScreen(); };
  if (bN) bN.onclick = () => { quitRace(); gpStandings(); };
  u.querySelector('#bT').onclick = () => { quitRace(); titleScreen(); };
}
function gpStandings() {
  const cup = CUPS[G.cup];
  const ids = Object.keys(G.gp.pts).map(Number).sort((a, b) => G.gp.pts[b] - G.gp.pts[a]);
  let rows = '<tr><th>順位</th><th>ライダー</th><th class="n">PT</th></tr>';
  ids.forEach((id, i) => {
    rows += '<tr class="' + (id === G.rider ? 'me' : '') + '"><td>' + (i + 1) + '</td><td>' + RIDERS[id].name + '</td>' +
      '<td class="n">' + G.gp.pts[id] + '</td></tr>';
  });
  G.gp.idx++;
  const last = G.gp.idx >= cup.cs.length;
  const myRank = ids.indexOf(G.rider) + 1;
  let h = '<div class="panel"><h2>' + cup.name + 'クラス　そうごう</h2>' +
    '<div class="lead">' + Math.min(G.gp.idx, cup.cs.length) + ' / ' + cup.cs.length + ' コース終了</div>' +
    '<div class="scroll"><table>' + rows + '</table></div>';
  if (last) {
    if (myRank === 1) { G.cleared['cup' + G.cup] = 1; save(); }
    h += '<div class="big">' + (myRank === 1 ? 'ゆうしょう！' : ORD(myRank)) + '</div>' +
      '<div class="lead">' + (myRank === 1 ? 'チャンピオンだ！ 海のいちばん速い男／女はキミだ。' : 'つぎはもっと上をめざそう。') + '</div>' +
      '<div class="row"><button class="btn pri" id="bT">タイトルへ</button></div></div>';
  } else {
    G.ci = cup.cs[G.gp.idx];
    h += '<div class="lead">つぎは <b style="color:#8ff0ff">' + COURSES[G.ci].name + '</b><br>' + COURSES[G.ci].tip + '</div>' +
      '<div class="row"><button class="btn pri" id="bN">つぎのレースへ</button>' +
      '<button class="btn gray" id="bT">やめる</button></div></div>';
  }
  const u = showUI(h);
  const bN = u.querySelector('#bN');
  if (bN) bN.onclick = () => { G.resultShown = 0; startRace('gp'); };
  u.querySelector('#bT').onclick = titleScreen;
}

/* =========================================================
   起動
   ========================================================= */
buildSprites();
resize();
initTouch();
titleScreen();
requestAnimationFrame(loop);
</script>

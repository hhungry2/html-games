<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TUMBLE PARTY - フォールガイズ風 バトルロイヤル</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root{
    --pink:#ff5fa2; --pink2:#ff9ecb; --purple:#7a4dff; --blue:#39c5ff;
    --gold:#ffd23f; --cream:#fff6e9; --dark:#3a2560; --green:#3ddc84;
  }
  html,body{
    width:100%; height:100%; overflow:hidden;
    background:
      radial-gradient(circle at 20% 15%, rgba(255,255,255,.30) 0 22%, transparent 23%),
      radial-gradient(circle at 82% 78%, rgba(255,255,255,.22) 0 18%, transparent 19%),
      linear-gradient(160deg,#8b5cff 0%, #ff69b4 55%, #ffb36b 100%);
    color:#fff;
    font-family:'Yu Gothic UI','Hiragino Kaku Gothic ProN',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    user-select:none; -webkit-user-select:none; touch-action:none;
  }
  #wrap{ position:relative; width:100vw; height:100vh; display:flex; align-items:center; justify-content:center; }
  canvas{ display:block; width:100%; height:100%; object-fit:contain; }

  /* ===== HUD ===== */
  #hud{ position:absolute; inset:0; pointer-events:none; z-index:10; padding:10px 12px; }
  .row{ display:flex; gap:8px; align-items:flex-start; justify-content:space-between; }
  .chip{
    background:rgba(58,37,96,.72); border:2px solid rgba(255,255,255,.35);
    border-radius:14px; padding:6px 12px; font-weight:800; letter-spacing:.04em;
    box-shadow:0 4px 0 rgba(0,0,0,.18); font-size:15px; white-space:nowrap;
  }
  .chip small{ display:block; font-size:10px; opacity:.75; font-weight:700; letter-spacing:.12em; }
  #cTime{ color:var(--gold); font-size:22px; text-align:center; min-width:96px; }
  #cQual{ color:#aef7c8; }
  #cRound{ color:#ffe6f3; }
  #banner{
    position:absolute; left:50%; top:32%; transform:translate(-50%,-50%);
    font-size:74px; font-weight:900; text-align:center; letter-spacing:.06em;
    text-shadow:0 7px 0 rgba(0,0,0,.30), 0 0 34px rgba(255,255,255,.65), 0 0 70px rgba(255,210,63,.5);
    opacity:0; transition:opacity .18s; white-space:nowrap;
  }
  #banner.pop{ animation:bpop .62s cubic-bezier(.18,1.7,.4,1); }
  @keyframes bpop{
    0%{ transform:translate(-50%,-50%) scale(.25) rotate(-10deg); opacity:0; }
    55%{ transform:translate(-50%,-50%) scale(1.18) rotate(3deg); opacity:1; }
    75%{ transform:translate(-50%,-50%) scale(.96) rotate(-1deg); }
    100%{ transform:translate(-50%,-50%) scale(1) rotate(0); opacity:1; }
  }
  .card.in{ animation:cardIn .46s cubic-bezier(.2,1.5,.4,1); }
  @keyframes cardIn{
    0%{ transform:translateY(34px) scale(.86); opacity:0; }
    100%{ transform:none; opacity:1; }
  }

  /* ===== オーバーレイ ===== */
  #ov{ position:absolute; inset:0; z-index:20; display:flex; align-items:center; justify-content:center;
       background:rgba(38,20,70,.55); backdrop-filter:blur(3px); }
  #ov.hide{ display:none; }
  .card{
    width:min(680px,92vw); max-height:92vh; overflow:auto;
    background:linear-gradient(180deg,#fff 0%, #ffeef7 100%);
    color:var(--dark); border-radius:28px; padding:26px 28px 24px;
    box-shadow:0 14px 0 rgba(90,40,130,.45), 0 24px 60px rgba(0,0,0,.4);
    border:6px solid #fff; text-align:center;
  }
  .card h1{ font-size:38px; line-height:1.15; letter-spacing:.02em;
    background:linear-gradient(180deg,#ff4f9a,#7a4dff); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .card h2{ font-size:26px; margin-top:2px; color:#6b3fd4; }
  .card .tag{ display:inline-block; background:var(--gold); color:#6b3d00; font-weight:900;
    padding:4px 16px; border-radius:999px; font-size:14px; letter-spacing:.18em; margin-bottom:8px; }
  .card p{ font-size:15px; line-height:1.7; color:#5b4a7a; margin:10px 0; font-weight:600; }
  .keys{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin:12px 0 4px; }
  .key{ background:#fff; border:3px solid #e5d5f5; border-radius:12px; padding:8px 12px; font-size:13px;
        font-weight:800; color:#6b3fd4; box-shadow:0 3px 0 #e5d5f5; }
  .btn{
    pointer-events:auto; cursor:pointer; border:none; margin:12px 6px 0;
    background:linear-gradient(180deg,#ff77b3,#ff2d87); color:#fff; font-weight:900; font-size:19px;
    padding:14px 34px; border-radius:999px; box-shadow:0 6px 0 #c2005e; letter-spacing:.06em;
    transition:transform .08s, box-shadow .08s; font-family:inherit;
  }
  .btn:active{ transform:translateY(4px); box-shadow:0 2px 0 #c2005e; }
  .btn.sub{ background:linear-gradient(180deg,#9d8bff,#6b3fd4); box-shadow:0 6px 0 #40219a; font-size:16px; padding:12px 26px; }
  .grid{ display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-top:10px; }
  .nm{ font-size:13px; font-weight:800; padding:5px 10px; border-radius:999px; background:#eee6fb; color:#5b4a7a;
       display:flex; align-items:center; gap:6px; }
  .nm i{ width:11px; height:11px; border-radius:50%; display:inline-block; }
  .nm.q{ background:#d6ffe6; color:#12703f; }
  .nm.o{ background:#ffe0e6; color:#a3123c; text-decoration:line-through; opacity:.75; }
  .nm.me{ outline:3px solid var(--gold); }
  /* ステージ選択リスト */
  .slist{ display:flex; flex-direction:column; gap:8px; margin:14px 0 6px; }
  .srow{
    cursor:pointer; display:flex; align-items:center; gap:12px; width:100%;
    background:#fff; border:3px solid #ecdcfb; border-radius:16px; padding:10px 14px;
    text-align:left; font-family:inherit;
    box-shadow:0 4px 0 #e3d2f7; transition:transform .08s, box-shadow .08s, border-color .12s;
  }
  .srow:hover{ border-color:#ff9ecb; }
  .srow:active{ transform:translateY(3px); box-shadow:0 1px 0 #e3d2f7; }
  .sic{ font-size:26px; width:34px; text-align:center; flex:none; }
  .stx{ flex:1; display:flex; flex-direction:column; gap:2px; min-width:0; }
  .stx b{ font-size:16px; color:#5b3fb0; }
  .stx small{ font-size:11.5px; color:#7b6a9c; font-weight:600; line-height:1.45; }
  .snum{ font-size:11px; font-weight:800; color:#a48fd0; white-space:nowrap; flex:none; }
  @media (max-width:640px){ .stx b{ font-size:14px; } .stx small{ font-size:10.5px; } .sic{ font-size:21px; width:26px; } }
  .sect{ font-size:12px; font-weight:900; letter-spacing:.2em; color:#a48fd0; margin-top:16px; }

  /* ===== タッチ操作 ===== */
  #touch{ position:absolute; inset:0; z-index:15; display:none; }
  #touch.on{ display:block; }
  #stickArea{ position:absolute; left:0; bottom:0; width:46%; height:62%; }
  #stick{ position:absolute; width:118px; height:118px; border-radius:50%; border:4px solid rgba(255,255,255,.5);
          background:rgba(58,37,96,.3); transform:translate(-50%,-50%); display:none; }
  #knob{ position:absolute; left:50%; top:50%; width:52px; height:52px; margin:-26px 0 0 -26px; border-radius:50%;
         background:rgba(255,255,255,.85); box-shadow:0 3px 10px rgba(0,0,0,.3); }
  #btns{ position:absolute; right:16px; bottom:24px; display:flex; gap:14px; align-items:flex-end; }
  .tb{ width:92px; height:92px; border-radius:50%; border:4px solid rgba(255,255,255,.6);
       background:rgba(255,45,135,.72); color:#fff; font-weight:900; font-size:16px; letter-spacing:.05em;
       display:flex; align-items:center; justify-content:center; box-shadow:0 6px 0 rgba(0,0,0,.25); font-family:inherit; }
  .tb.d{ background:rgba(122,77,255,.75); width:78px; height:78px; font-size:14px; }
  .tb:active{ transform:translateY(4px); box-shadow:0 2px 0 rgba(0,0,0,.25); }
  /* 敗退時の選択パネル（ゲームは裏で進行中） */
  #lose{ position:absolute; left:0; right:0; bottom:18px; z-index:18;
         display:flex; justify-content:center; pointer-events:none; }
  #lose.hide{ display:none; }
  #lose .lcard{
    pointer-events:auto; text-align:center; max-width:94vw;
    background:linear-gradient(180deg, rgba(58,37,96,.92), rgba(38,20,70,.92));
    border:4px solid rgba(255,255,255,.35); border-radius:24px; padding:12px 22px 14px;
    box-shadow:0 12px 34px rgba(0,0,0,.5);
  }
  #lose .ltitle{ font-size:24px; font-weight:900; letter-spacing:.12em; color:#ff7a90;
                 text-shadow:0 3px 0 rgba(0,0,0,.35); }
  #lose .lsub{ font-size:13px; font-weight:700; color:#ffe6f3; margin:3px 0 9px; }
  #lose .lbtns{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  #lose.in .lcard{ animation:loseIn .42s cubic-bezier(.2,1.5,.4,1); }
  @keyframes loseIn{ from{ transform:translateY(46px); opacity:0; } to{ transform:none; opacity:1; } }
  .btn.sm{ font-size:15px; padding:11px 24px; margin:0; box-shadow:0 5px 0 #c2005e; }
  .btn.sub.sm{ box-shadow:0 5px 0 #40219a; }
  .btn.sm:active{ transform:translateY(3px); box-shadow:0 2px 0 #c2005e; }
  @media (max-width:640px){
    #lose .ltitle{ font-size:19px; } #lose .lsub{ font-size:11px; }
    .btn.sm{ font-size:13px; padding:9px 16px; }
  }
  #sound{ position:absolute; right:12px; top:12px; z-index:16; pointer-events:auto; cursor:pointer;
    background:rgba(58,37,96,.72); border:2px solid rgba(255,255,255,.35); color:#fff; border-radius:12px;
    width:40px; height:36px; font-size:16px; font-family:inherit; }
  @media (max-width:640px){
    .card h1{ font-size:28px; } .card h2{ font-size:20px; } .card p{ font-size:13px; }
    #banner{ font-size:44px; }
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="960" height="640"></canvas>

  <div id="hud">
    <div class="row">
      <div class="chip" id="cRound"><small>ROUND</small><span id="rname">-</span></div>
      <div class="chip" id="cTime"><small>TIME</small><span id="rtime">0</span></div>
      <div class="chip" id="cQual"><small>QUALIFIED</small><span id="rqual">0 / 0</span></div>
    </div>
    <div id="banner"></div>
  </div>

  <button id="sound">🔊</button>

  <div id="touch">
    <div id="stickArea"><div id="stick"><div id="knob"></div></div></div>
    <div id="btns">
      <div class="tb d" id="bDive">DIVE</div>
      <div class="tb" id="bJump">JUMP</div>
    </div>
  </div>

  <div id="lose" class="hide">
    <div class="lcard">
      <div class="ltitle">ELIMINATED</div>
      <div class="lsub" id="lrank"></div>
      <div class="lbtns">
        <button class="btn sub sm" id="lWatch">観戦する</button>
        <button class="btn sm" id="lAgain">もう一度あそぶ</button>
      </div>
    </div>
  </div>

  <div id="ov"><div class="card" id="card"></div></div>
</div>

<script>
'use strict';
// =====================================================================
//  TUMBLE PARTY  －  フォールガイズ風 2D バトルロイヤル（3D不使用）
//  ・トップビュー＋高さ(z)を持つ疑似立体判定
//  ・ROUND1 レース / ROUND2 サバイバル / FINAL 王冠争奪
// =====================================================================

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const VW = 960, VH = 640;
const TAU = Math.PI * 2;

const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
const rnd   = (a,b)=> a + Math.random()*(b-a);
const irnd  = (a,b)=> Math.floor(rnd(a,b+1));
const pick  = a => a[Math.floor(Math.random()*a.length)];
const lerp  = (a,b,t)=> a+(b-a)*t;

// ---------------------------------------------------------------- 効果音
let actx = null, muted = false;
function ac(){
  if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ actx = null; } }
  if(actx && actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(freq, dur, type, vol, to){
  const a = ac(); if(!a || muted) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(freq, a.currentTime);
  if(to) o.frequency.exponentialRampToValueAtTime(Math.max(45,to), a.currentTime+dur);
  g.gain.setValueAtTime(vol||0.08, a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime+dur);
  o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+dur+0.02);
}
function noise(dur, vol){
  const a = ac(); if(!a || muted) return;
  const len = Math.floor(a.sampleRate*dur);
  const buf = a.createBuffer(1, len, a.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i] = (Math.random()*2-1) * (1-i/len);
  const s = a.createBufferSource(); s.buffer = buf;
  const g = a.createGain(); g.gain.value = vol||0.08;
  const f = a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=1400;
  s.connect(f); f.connect(g); g.connect(a.destination); s.start();
}
const sfx = {
  jump(){ tone(430,0.11,'square',0.05,760); },
  dive(){ tone(300,0.16,'sawtooth',0.05,120); },
  land(){ noise(0.06,0.05); },
  hit(){ noise(0.18,0.10); tone(190,0.20,'sawtooth',0.06,70); },
  door(){ noise(0.22,0.12); tone(120,0.18,'square',0.05,60); },
  bump(){ tone(110,0.10,'square',0.05,80); },
  fall(){ tone(600,0.55,'sine',0.07,90); },
  pad(){ tone(300,0.20,'square',0.07,980); },
  count(){ tone(660,0.10,'square',0.07); },
  go(){ tone(880,0.28,'square',0.09,1320); },
  qual(){ sfx.fanfare(); },
  fanfare(){
    [523,659,784,1046].forEach((f,i)=> setTimeout(()=>tone(f,0.22,'square',0.075), i*80));
    setTimeout(()=>{ tone(1046,0.6,'square',0.06); tone(1318,0.6,'triangle',0.045); tone(1568,0.6,'sine',0.03); }, 340);
  },
  sparkle(){ for(let i=0;i<4;i++) setTimeout(()=>tone(1200+Math.random()*900, 0.10, 'sine', 0.05), i*55); },
  out(){ [440,330,220].forEach((f,i)=>setTimeout(()=>tone(f,0.22,'triangle',0.07),i*120)); },
  crown(){ [523,659,784,1046,1318].forEach((f,i)=>setTimeout(()=>tone(f,0.30,'square',0.08),i*110)); }
};

// ---------------------------------------------------------------- 物理定数
const ACC = 0.62, MAXSPD = 3.55, FRIC = 0.86, AIRFRIC = 0.978;
const GRAV = 0.42, JUMPV = 6.4;
const DIVE_SPD = 6.6, DIVE_VZ = 3.4;
const BEAN_R = 15, BEAN_H = 30;

const NAMES = ['ぷにお','もちこ','どんぐり','ぷりん','まめた','ころん','ぱんだ','ぴよ','てるてる','なめこ',
               'ぷくぷく','ぽんず','きなこ','ずんだ','おもち','ふわり','どてら','ちくわ','みたらし','あんこ'];
const COLORS= ['#ff7096','#5fc9ff','#ffd23f','#7ee08a','#c08bff','#ff9f5a','#66e0d0','#ff6bd6','#9db4ff','#ffe08a',
               '#7fd6ff','#ffa8c9','#b5e86a','#ffb347','#8ce0c0','#e08bff','#ff8f8f','#6fd9a5','#d6c2ff','#ffc46b'];
const FRUITC= ['#ff6b6b','#ffa94d','#ffd43b','#69db7c','#a78bfa','#ff8fd0'];

// ---------------------------------------------------------------- 入力
const keys = {};
const stick = { x:0, y:0, id:null, ox:0, oy:0 };
let tJump = false, tDive = false;
addEventListener('keydown', e=>{
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].indexOf(e.code)>=0) e.preventDefault();
  keys[e.code] = true;
  if(e.code==='Enter' || e.code==='Space'){ const b = document.querySelector('#ov .btn'); if(b && !document.getElementById('ov').classList.contains('hide')) b.click(); }
});
addEventListener('keyup', e=>{ keys[e.code] = false; });
addEventListener('blur', ()=>{ for(const k in keys) keys[k]=false; });

(function setupTouch(){
  const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  const t = document.getElementById('touch');
  if(isTouch) t.classList.add('on');
  const area = document.getElementById('stickArea');
  const sEl = document.getElementById('stick'), knob = document.getElementById('knob');
  area.addEventListener('pointerdown', e=>{
    stick.id = e.pointerId; stick.ox = e.clientX; stick.oy = e.clientY;
    const r = t.getBoundingClientRect();
    sEl.style.display='block'; sEl.style.left = (e.clientX-r.left)+'px'; sEl.style.top = (e.clientY-r.top)+'px';
    knob.style.left='50%'; knob.style.top='50%';
    area.setPointerCapture(e.pointerId);
  });
  area.addEventListener('pointermove', e=>{
    if(stick.id !== e.pointerId) return;
    let dx = e.clientX-stick.ox, dy = e.clientY-stick.oy;
    const d = Math.hypot(dx,dy), max = 48;
    if(d > max){ dx = dx/d*max; dy = dy/d*max; }
    knob.style.left = (50 + dx/1.2)+'%'; knob.style.top = (50 + dy/1.2)+'%';
    stick.x = clamp(dx/max*1.4,-1,1); stick.y = clamp(dy/max*1.4,-1,1);
  });
  const end = e=>{ if(stick.id!==e.pointerId) return; stick.id=null; stick.x=stick.y=0; sEl.style.display='none'; };
  area.addEventListener('pointerup', end); area.addEventListener('pointercancel', end);
  const bind=(id,set)=>{ const el=document.getElementById(id);
    el.addEventListener('pointerdown',e=>{ e.preventDefault(); set(true); ac(); });
    el.addEventListener('pointerup',e=>{ e.preventDefault(); set(false); });
    el.addEventListener('pointerleave',()=>set(false));
    el.addEventListener('pointercancel',()=>set(false));
  };
  bind('bJump', v=> tJump=v); bind('bDive', v=> tDive=v);
})();

document.getElementById('sound').addEventListener('click', function(){
  muted = !muted; this.textContent = muted ? '🔇' : '🔊'; if(!muted) ac();
});

// ---------------------------------------------------------------- ゲーム状態
// 各ステージの実装を1か所に集約する。
//   kind : 'race'（縦スクロールのコース）/ 'arena'（固定画面）/ 'roll'（回転リング）
//   goal : 'first'（先着で通過）/ 'survive'（生き残りで通過）/ 'crown'（王冠を取った者が優勝）
//   build/update/drawFloor/ai/hud を差し替えれば新ステージを追加できる。
const STAGES = {
  race: {
    key:'race', kind:'race', goal:'first', solo:20,
    label:'ゲートクラッシュ・ダッシュ', icon:'🏁',
    blurb:'スピナー・スライム・ニセ扉・転がる果実・落とし穴の障害物レース',
    build: buildRace, update: updateRace, drawFloor: drawRaceFloor, ai: aiRace,
    hud:(alive,R)=> G.finishOrder.length + ' / ' + R.qualify
  },
  jump: {
    key:'jump', kind:'arena', goal:'survive', solo:12,
    label:'ジャンプ・クラブ', icon:'🌀',
    blurb:'回転バーを飛び越え／くぐって円形ステージで生き残る',
    build: buildArena, update: updateJump, drawFloor: drawArenaFloor, ai: aiArena,
    hud:(alive,R)=> '残り ' + alive + '（' + R.qualify + '人まで）'
  },
  floor: {
    key:'floor', kind:'floor', goal:'survive', solo:12,
    label:'フロア・アウト', icon:'🧱',
    blurb:'床パネルが次々に抜け落ちる。乗り続けた床も割れるので動き回って生き残れ',
    build: buildFloor, update: updateFloor, drawFloor: drawFloorArena, ai: aiFloor,
    hud:(alive,R)=> (R.qualify > 0 ? '残り ' + alive + '人（' + R.qualify + '人まで）'
                                   : '残り ' + alive + '人（生存で全員クリア）')
  },
  hex: {
    key:'hex', kind:'hex', goal:'survive', solo:12,
    label:'ヘックス・ア・ゴーン', icon:'⬡',
    blurb:'踏んだ六角タイルが消えていく3層フィールド。最下層から落ちたら脱落',
    build: buildHex, update: updateHex, drawFloor: drawHexFloor, ai: aiHex,
    hud:(alive,R)=> 'LAYER ' + (viewLayer()+1) + '/3　残り ' + alive + '人'
  },
  gimmick: {
    key:'gimmick', kind:'race', goal:'first', solo:8,
    label:'ギミック・ラッシュ', icon:'⚙️',
    blurb:'コンベア→ジャンプ台→消える床→氷→動く床→回転床のアスレチック',
    build: buildGimmick, update: updateRace, drawFloor: drawRaceFloor, ai: aiRace,
    hud:(alive,R)=> G.finishOrder.length + ' / ' + R.qualify
  },
  roll: {
    key:'roll', kind:'roll', goal:'survive', solo:8,
    label:'ロール・アウト', icon:'🛢️',
    blurb:'5本のリングが回る巨大ローラー。流されず穴も避けて時間まで耐える',
    build: buildRoll, update: updateRoll, drawFloor: drawRollFloor, ai: aiRoll,
    hud:(alive,R)=> R.qualify > 0 ? '残り ' + alive + '人（' + R.qualify + '人まで）'
                                  : '残り ' + alive + '人（生存で全員クリア）'
  },
  final: {

    doorSel:{}, bridge:0, aiT:irnd(0,40), noJumpT:0, alive:true, layer:0, hT:null, dropT:0
  };

function tumble(b, p){
  if(b.inv > 0 || b.done || b.out) return;
  b.state = 'tumble'; b.stun = Math.floor(30 + p*10); b.inv = 12;
  b.vz = Math.max(b.vz, 2.6 + p*0.7); b.z = Math.max(b.z, 0.01);
  b.spinRate = (Math.random()<0.5?-1:1) * rnd(0.16,0.3);
  sfx.hit(); burst(b.x, b.y, b.z+14, 7, '#fff', 2.6);
  if(b.isPlayer){ G.shake = 10; }
}
function startDive(b){
  if(b.state !== 'run' || b.diveCd > 0) return;
  b.state = 'dive'; b.diveCd = 42;
  const sp = Math.hypot(b.vx, b.vy);
  const v = Math.max(sp, DIVE_SPD * b.skill);
  b.vx = Math.cos(b.face)*v; b.vy = Math.sin(b.face)*v;
  if(b.z <= 0.02){ b.vz = DIVE_VZ; b.z = 0.02; }
  sfx.dive();
}

function updateBean(b, cmd){
  if(b.out || b.done) return;
  if(b.inv > 0) b.inv--;
  if(b.jumpCd > 0) b.jumpCd--;
  if(b.diveCd > 0) b.diveCd--;
  if(b.noJumpT > 0) b.noJumpT--;
  b.anim += Math.min(0.5, Math.hypot(b.vx,b.vy)*0.09);

  if(b.state === 'fall'){
    b.fallT++; b.z -= 3.4; b.x += b.vx*0.5; b.y += b.vy*0.5;
    return;
  }
  const grounded = b.z <= 0.02;
  if(b.stun > 0){ b.stun--; if(b.stun === 0 && grounded && (b.state==='tumble'||b.state==='prone')) b.state='run'; }
  if(b.state === 'tumble') b.spin += b.spinRate * (grounded?0.5:1);
  else b.spin *= 0.8;

  const canMove = (b.stun <= 0 && b.state === 'run' && G.freeze <= 0);
  if(canMove && cmd){
    let mx = cmd.mx, my = cmd.my;
    const m = Math.hypot(mx,my);
    if(m > 0.15){
      mx /= m; my /= m;
      b.face = Math.atan2(my,mx);
      const a = (grounded ? (b.slip ? ACC*0.5 : ACC) : ACC*0.5) * b.skill;
      b.vx += mx*a; b.vy += my*a;
    }
    if(cmd.jump && grounded && b.jumpCd <= 0){ b.vz = JUMPV; b.z = 0.02; b.jumpCd = 8; sfx.jump(); }
    if(cmd.dive) startDive(b);
  }
  if(b.cheer && grounded && b.state === 'run' && Math.random() < 0.07){ b.vz = 4.8; b.z = 0.02; }

  // 速度制限（操作中のみ）
  if(b.state === 'run'){
    const cap = MAXSPD * b.skill * b.zoneMul;
    const sp = Math.hypot(b.vx,b.vy);
    if(sp > cap){ const k = Math.max(cap/sp, 0.94); b.vx *= k; b.vy *= k; }
  }
  // 摩擦
  let f;
  if(grounded) f = (b.state==='prone') ? 0.935 : (b.state==='tumble' ? 0.90 : (b.slip ? 0.974 : FRIC));
  else         f = (b.state==='dive') ? 0.995 : AIRFRIC;
  b.vx *= f; b.vy *= f;

  b.x += b.vx; b.y += b.vy;

  // 高さ
  b.z += b.vz; b.vz -= GRAV;
  if(b.z <= 0){
    const hard = b.vz < -3.4;
    b.z = 0; b.vz = 0;
    if(b.state === 'dive'){ b.state = 'prone'; b.stun = 24; burst(b.x,b.y,2,5,'#ffffff',1.8); sfx.land(); }
    else if(hard){ burst(b.x,b.y,2,4,'rgba(255,255,255,.8)',1.4); sfx.land(); }
  }
  b.zoneMul = 1; b.slip = 0;
}

// ---------------------------------------------------------------- 当たり判定
function collideBean(b, c){
  if(b.out || b.done || b.state === 'fall') return;
  const top = b.z + BEAN_H;
  if(b.z >= c.hi || top <= c.lo) return;

  let nx, ny, depth;
  if(c.t === 'circle'){
    let dx = b.x-c.x, dy = b.y-c.y;
    let d = Math.hypot(dx,dy); if(d < 1e-4){ dx = 1; dy = 0; d = 1e-4; }
    const pen = c.r + BEAN_R - d;
    if(pen <= 0) return;
    nx = dx/d; ny = dy/d; depth = pen;
  } else {
    const ca = Math.cos(c.a||0), sa = Math.sin(c.a||0);
    const ex = b.x-c.x, ey = b.y-c.y;
    const rx =  ex*ca + ey*sa;
    const ry = -ex*sa + ey*ca;
    const hx = c.w/2, hy = c.h/2;
    const qx = clamp(rx,-hx,hx), qy = clamp(ry,-hy,hy);
    let dx = rx-qx, dy = ry-qy;
    let d = Math.hypot(dx,dy);
    if(d > BEAN_R) return;
    if(d < 1e-4){ // めり込み → 最も近い辺へ押し出し
      const dl = rx+hx, dr = hx-rx, dt = ry+hy, db = hy-ry;
      const mn = Math.min(dl,dr,dt,db);
      if(mn === dl){ dx=-1; dy=0; depth = BEAN_R+dl; }
      else if(mn === dr){ dx=1; dy=0; depth = BEAN_R+dr; }
      else if(mn === dt){ dx=0; dy=-1; depth = BEAN_R+dt; }
      else { dx=0; dy=1; depth = BEAN_R+db; }
    } else { depth = BEAN_R-d; dx/=d; dy/=d; }
    nx = dx*ca - dy*sa; ny = dx*sa + dy*ca;
  }

  // 面の速度
  let svx = c.vx||0, svy = c.vy||0;
  if(c.spin){ const rx = b.x-c.px, ry = b.y-c.py; svx += -c.spin*ry; svy += c.spin*rx; }

  if(c.mode === 'door'){
    const s = c.ref;
    const into = (b.vx*-nx + b.vy*-ny);
    if(!s.solid){
      if(into > 0.7 || b.state === 'dive'){ breakDoor(s, b); return; }
    } else if(!s.tried && into > 1.2){ s.tried = true; s.shake = 12; sfx.bump(); }
    b.x += nx*depth; b.y += ny*depth;
    const vn = b.vx*nx + b.vy*ny;
    if(vn < 0){ b.vx -= vn*nx*1.15; b.vy -= vn*ny*1.15; }
    return;
  }
  b.x += nx*depth; b.y += ny*depth;
  if(c.mode === 'block'){
    const vn = b.vx*nx + b.vy*ny;
    if(vn < 0){ b.vx -= vn*nx; b.vy -= vn*ny; }
    return;
  }
  const p = c.power || 1;
  b.vx = nx*3.1*p + svx*1.15;
  b.vy = ny*3.1*p + svy*1.15;
  tumble(b, p);
}
function breakDoor(s, b){
  s.broken = true; s.tried = true; s.shake = 0;
  b.vx *= 0.55; b.vy *= 0.55;
  burst(s.x, s.wy, 14, 26, s.color, 4.2);
  sfx.door(); if(b.isPlayer) G.shake = 8;
}

function beanVsBean(){
  const A = G.beans;
  for(let i=0;i<A.length;i++){
    const a = A[i]; if(a.out||a.done||a.state==='fall') continue;
    for(let j=i+1;j<A.length;j++){
      const b = A[j]; if(b.out||b.done||b.state==='fall') continue;
      if(a.layer !== b.layer || a.state === 'drop' || b.state === 'drop') continue;
      if(Math.abs(a.z-b.z) > 24) continue;
      const dx = b.x-a.x, dy = b.y-a.y;
      let d = Math.hypot(dx,dy); if(d < 1e-4){ d = 1e-4; }
      const pen = BEAN_R*2 - d;
      if(pen <= 0) continue;
      const nx = dx/d, ny = dy/d;
      a.x -= nx*pen*0.5; a.y -= ny*pen*0.5;
      b.x += nx*pen*0.5; b.y += ny*pen*0.5;
      const rel = (b.vx-a.vx)*nx + (b.vy-a.vy)*ny;
      if(rel < 0){
        const p = rel*0.62;
        a.vx += nx*p; a.vy += ny*p;
        b.vx -= nx*p; b.vy -= ny*p;
        const sa = Math.hypot(a.vx,a.vy), sb = Math.hypot(b.vx,b.vy);
        if(a.state==='dive' && sa > 4.4) tumble(b, 0.9);
        if(b.state==='dive' && sb > 4.4) tumble(a, 0.9);
      }
    }
  }
}

function Spinner(x,y,len,arms,om,opt){

    hi: opt.hi||24, power: opt.power||1.2, col2: opt.color||'#ff5fa2',
    up(){ this.a += this.om; },
    col(out){
      for(let i=0;i<this.arms;i++){
        const ang = this.a + i*TAU/this.arms;
        out.push({ t:'box', x:this.x+Math.cos(ang)*this.len*0.5, y:this.y+Math.sin(ang)*this.len*0.5,
                   w:this.len, h:18, a:ang, lo:0, hi:this.hi, spin:this.om, px:this.x, py:this.y,
                   power:this.power, mode:'knock' });
      }
    },
    draw(){
      const sx = this.x-cam.x, sy = this.y-cam.y;
      ctx.save(); ctx.translate(sx,sy);
      for(let pass=0; pass<2; pass++){
        const off = pass===0 ? 0 : -9;
        ctx.globalAlpha = pass===0 ? 0.22 : 1;
        for(let i=0;i<this.arms;i++){
          const ang = this.a + i*TAU/this.arms;
          ctx.save(); ctx.translate(0,off); ctx.rotate(ang);
          ctx.fillStyle = pass===0 ? '#000' : this.col2;
          roundRect(0,-9,this.len,18,9); ctx.fill();
          if(pass===1){
            ctx.fillStyle = 'rgba(255,255,255,.55)';
            for(let k=1;k<5;k++){ roundRect(this.len*k/5-6,-7,12,6,3); ctx.fill(); }
          }
          ctx.restore();
        }
        ctx.beginPath(); ctx.arc(0,off,20,0,TAU);
        ctx.fillStyle = pass===0 ? '#000' : '#fff'; ctx.fill();
        if(pass===1){ ctx.beginPath(); ctx.arc(0,off,11,0,TAU); ctx.fillStyle=this.col2; ctx.fill(); }
      }
      ctx.globalAlpha = 1; ctx.restore();
    }
  };
}
function Sweeper(y, o){

    high:!!o.high, hiZ:o.hiZ||24, power:o.power||1.25, color:o.color||'#7a4dff', t:0, x:400, vx:0,
    up(){ this.t++; const p = this.t*this.spd + this.ph;
          this.x = 400 + Math.sin(p)*this.amp; this.vx = Math.cos(p)*this.amp*this.spd; },
    col(out){ out.push({ t:'box', x:this.x, y:this.y, w:this.w, h:this.h, a:0,
                lo:this.high?34:0, hi:this.high?130:this.hiZ, vx:this.vx*1.7, vy:0,
                power:this.power, mode:'knock' }); },
    draw(){
      const sx = this.x-cam.x, sy = this.y-cam.y, lift = this.high ? 56 : (this.hiZ>30? 18 : 6);
      ctx.save();
      ctx.globalAlpha = .22; ctx.fillStyle = '#000';
      roundRect(sx-this.w/2, sy-this.h/2, this.w, this.h, 10); ctx.fill();
      ctx.globalAlpha = 1;

      }

}
function Piston(side, y, ph){

    up(){ this.t++; const p = this.t*0.028 + this.ph, s = Math.sin(p);

function FruitLane(yFar, yNear, every, opt){

    spawn(y){ this.list.push({ x:rnd(70,730), y, r:rnd(rMin,rMax), vy:rnd(vMin,vMax), rot:Math.random()*TAU,
                               om:rnd(-0.05,0.05), c: opt.big ? pick(['#ff6b6b','#ffa94d','#a78bfa']) : pick(FRUITC) }); },
    up(){
      this.t++;

      for(const f of this.list){ f.y += f.vy; f.rot += f.om; }
      for(let i=this.list.length-1;i>=0;i--) if(this.list[i].y > this.yNear+90) this.list.splice(i,1);
    },
    col(out){ for(const f of this.list) out.push({ t:'circle', x:f.x, y:f.y, r:f.r, lo:0, hi:this.big?76:46,
                                                   vx:0, vy:f.vy, power:this.big?1.8:1.5, mode:'knock' }); },
    draw(){
      for(const f of this.list){
        const sx = f.x-cam.x, sy = f.y-cam.y;
        if(sy < -f.r-10){                      // 画面外から迫っている → 上端に警告
          if(sy > -460){

            ctx.fillStyle = f.c;
            ctx.beginPath(); ctx.moveTo(sx-15, 10); ctx.lineTo(sx+15, 10); ctx.lineTo(sx, 32); ctx.closePath(); ctx.fill();
            ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.arc(sx, 4, f.r*0.28, 0, TAU); ctx.stroke();
            ctx.restore();
          }
          continue;
        }
        ctx.save();
        ctx.globalAlpha=.22; ctx.fillStyle='#000';
        ctx.beginPath(); ctx.ellipse(sx, sy+6, f.r, f.r*0.55, 0,0,TAU); ctx.fill();
        ctx.globalAlpha=1;
        ctx.translate(sx, sy-8); ctx.rotate(f.rot);
        ctx.beginPath(); ctx.arc(0,0,f.r,0,TAU); ctx.fillStyle=f.c; ctx.fill();
        ctx.strokeStyle='rgba(0,0,0,.15)'; ctx.lineWidth=3; ctx.stroke();
        ctx.fillStyle='rgba(255,255,255,.5)';
        ctx.beginPath(); ctx.ellipse(-f.r*0.32,-f.r*0.36,f.r*0.26,f.r*0.18,-0.6,0,TAU); ctx.fill();
        ctx.fillStyle='rgba(0,0,0,.12)';
        ctx.beginPath(); ctx.ellipse(f.r*0.3, f.r*0.28, f.r*0.3, f.r*0.2, 0.5,0,TAU); ctx.fill();
        ctx.restore();
      }
    }
  };
  for(let y=yFar; y<yNear; y+=170) o.spawn(y);
  return o;
}
function DoorWall(id, y, n, openCount){
  const slotW = 800/n, slots = [];
  const idx = []; for(let i=0;i<n;i++) idx.push(i);
  for(let i=idx.length-1;i>0;i--){ const j=irnd(0,i); const t=idx[i]; idx[i]=idx[j]; idx[j]=t; }
  const open = idx.slice(0, openCount);
  for(let i=0;i<n;i++){
    slots.push({ i, x:slotW*(i+0.5), wy:y, w:slotW-18, solid:open.indexOf(i)<0, broken:false, tried:false,
                 shake:0, color: pick(['#ffd23f','#5fc9ff','#ff7096','#7ee08a','#c08bff']) });
  }
  return { kind:'doorwall', id, y, slots, slotW,
    up(){ for(const s of this.slots) if(s.shake>0) s.shake--; },
    col(out){
      for(const s of this.slots) if(!s.broken)
        out.push({ t:'box', x:s.x, y:this.y, w:s.w, h:26, a:0, lo:0, hi:80, mode:'door', ref:s });
      for(let i=0;i<=this.slots.length;i++)
        out.push({ t:'box', x:this.slotW*i, y:this.y, w:20, h:30, a:0, lo:0, hi:80, mode:'block' });
    },
    draw(){
      const sy = this.y-cam.y;
      ctx.save();
      ctx.fillStyle='rgba(0,0,0,.18)'; ctx.fillRect(0-cam.x, sy-13+8, 800, 26);
      for(const s of this.slots){
        const sx = s.x-cam.x + (s.shake? Math.sin(s.shake*2)*4 : 0);
        if(s.broken){
          ctx.fillStyle='rgba(255,255,255,.28)';
          roundRect(sx-s.w/2, sy-8, s.w, 16, 6); ctx.fill();
          continue;
        }
        ctx.fillStyle = s.color;
        roundRect(sx-s.w/2, sy-13-26, s.w, 40, 8); ctx.fill();
        ctx.fillStyle='rgba(255,255,255,.35)';
        roundRect(sx-s.w/2+8, sy-13-20, s.w-16, 10, 5); ctx.fill();
        ctx.fillStyle='rgba(0,0,0,.18)';
        ctx.beginPath(); ctx.arc(sx+s.w*0.32, sy-13-6, 5, 0, TAU); ctx.fill();
      }
      for(let i=0;i<=this.slots.length;i++){
        const px = this.slotW*i - cam.x;
        ctx.fillStyle='#6b3fd4'; roundRect(px-10, sy-15-30, 20, 46, 6); ctx.fill();
        ctx.fillStyle='#9d8bff'; roundRect(px-10, sy-15-30, 20, 10, 5); ctx.fill();
      }
      ctx.restore();
    }
  };
}
function RotBar(cx,cy,len,om,high,opt){
  opt = opt||{};
  return { kind:'rotbar', cx, cy, len, om, high, a:opt.a||0, power:opt.power||1.22,
    up(){ this.a += this.om; },
    col(out){
      out.push({ t:'box', x:this.cx, y:this.cy, w:this.len, h:20, a:this.a,
                 lo:this.high?34:0, hi:this.high?130:24, spin:this.om, px:this.cx, py:this.cy,
                 power:this.power, mode:'knock' });
    },
    draw(){
      const sx = this.cx-cam.x, sy = this.cy-cam.y, lift = this.high ? 58 : 7;
      ctx.save(); ctx.translate(sx,sy);
      ctx.save(); ctx.rotate(this.a);
      ctx.globalAlpha=.2; ctx.fillStyle='#000'; roundRect(-this.len/2,-10,this.len,20,10); ctx.fill();
      ctx.restore();
      ctx.save(); ctx.translate(0,-lift); ctx.rotate(this.a);
      ctx.globalAlpha=1;
      ctx.fillStyle = this.high ? '#ffd23f' : '#ff5fa2';
      roundRect(-this.len/2,-10,this.len,20,10); ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.5)';
      for(let k=-this.len/2+16;k<this.len/2-10;k+=40){ roundRect(k,-7,18,6,3); ctx.fill(); }
      ctx.restore();
      ctx.globalAlpha=1;
      ctx.beginPath(); ctx.arc(0,-lift*0.4,18,0,TAU); ctx.fillStyle='#fff'; ctx.fill();
      ctx.beginPath(); ctx.arc(0,-lift*0.4,9,0,TAU); ctx.fillStyle = this.high?'#ffb703':'#ff2d87'; ctx.fill();
      ctx.restore();
    }
  };
}

function roundRect(x,y,w,h,r){
  const rr = Math.min(r, Math.abs(w)/2, Math.abs(h)/2);
  ctx.beginPath();
  ctx.moveTo(x+rr,y);
  ctx.lineTo(x+w-rr,y); ctx.quadraticCurveTo(x+w,y,x+w,y+rr);
  ctx.lineTo(x+w,y+h-rr); ctx.quadraticCurveTo(x+w,y+h,x+w-rr,y+h);
  ctx.lineTo(x+rr,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-rr);
  ctx.lineTo(x,y+rr); ctx.quadraticCurveTo(x,y,x+rr,y);
  ctx.closePath();
}

function updateGimmicks(){
  for(const p of plats){
    const nx = p.cx + Math.sin(G.rt*p.spd + p.ph)*p.amp - p.w/2;
    p.vx = nx - p.x; p.prev = p.x; p.x = nx;
  }
  for(const t of tiles){
    const c = (G.rt + t.ph) % t.period;
    t.on = c < t.period*0.66;
    t.warn = t.on && c > t.period*0.66 - 42;
  }
  for(const p of pads) if(p.t > 0) p.t--;
}
function inRect(b, r){ return b.x > r.x-2 && b.x < r.x+r.w+2 && b.y > r.y-2 && b.y < r.y+r.h+2; }
function onFloor(b){
  for(const t of tiles) if(t.on && inRect(b,t)) return true;
  for(const p of plats) if(inRect(b,p)) return true;
  for(const z of zones) if(z.t === 'turn' && Math.hypot(b.x-z.cx, b.y-z.cy) < z.r) return true;
  return false;
}
function checkPads(b){
  if(b.z > 4 || b.state === 'fall' || b.done || b.out) return;
  for(const p of pads){
    if(inRect(b, p)){
      b.vz = 10.0; b.vy = Math.min(b.vy, -3.6); b.z = 2.5; p.t = 16;   // 前方へ大ジャンプ
      sfx.pad(); burst(b.x, p.y+p.h/2, 8, 10, '#7ee08a', 2.4);
      break;
    }
  }
}

// スタート時に障害物へめり込まない位置へビーンを並べる
function spotBlocked(x, y, placed){
  const pad = 14;
  for(const p of placed) if(Math.hypot(p.x-x, p.y-y) < BEAN_R*2+6) return true;
  for(const c of cols){
    if(c.t === 'circle'){ if(Math.hypot(c.x-x, c.y-y) < c.r+BEAN_R+pad) return true; }
    else {
      const ca = Math.cos(c.a||0), sa = Math.sin(c.a||0);
      const ex = x-c.x, ey = y-c.y;
      const rx =  ex*ca + ey*sa, ry = -ex*sa + ey*ca;
      const qx = clamp(rx,-c.w/2,c.w/2), qy = clamp(ry,-c.h/2,c.h/2);
      if(Math.hypot(rx-qx, ry-qy) < BEAN_R+pad) return true;
    }
  }
  return false;
}
function placeArenaBeans(radius){
  cols.length = 0; for(const o of obstacles) o.col(cols);
  const n = G.beans.length, placed = [];
  G.beans.forEach((b,i)=>{
    const base = i/n*TAU + 0.2;
    let bx = arena.cx + Math.cos(base)*radius, by = arena.cy + Math.sin(base)*radius;
    for(let k=0;k<80;k++){
      const a = base + (k%2 ? -1 : 1) * Math.ceil(k/2) * (TAU/80);
      const px = arena.cx + Math.cos(a)*radius, py = arena.cy + Math.sin(a)*radius;
      if(!spotBlocked(px, py, placed)){ bx = px; by = py; break; }
    }
    b.x = bx; b.y = by;
    b.face = Math.atan2(arena.cy-by, arena.cx-bx);
    placed.push({x:bx, y:by});
  });
  cols.length = 0;
}

// ---------------------------------------------------------------- ヘックス・ア・ゴーン
// 踏むと消える六角タイルが3層。足場を失うと下の層へ落ち、最下層で落ちたら脱落。
let hex = { R:30, w:0, vs:0, ox:0, oy:0, cols:17, rows:12, grid:[] };
const HEXCOL = ['#5fc9ff','#7ee08a','#ff8fd0'];
const HEXDIM = ['#2b5a78','#3a6a44','#7a3d61'];
const HEX_LIT = 66;                         // 踏んでから消えるまで（フレーム）

function hexPath(cx, cy, R){
  ctx.beginPath();
  for(let i=0;i<6;i++){
    const a = (Math.PI/180)*(60*i - 90);
    const x = cx + R*Math.cos(a), y = cy + R*Math.sin(a);
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.closePath();
}
function buildHex(){
  obstacles = []; zones = []; holes = []; parts = []; pads = []; tiles = []; plats = [];
  hex.R = 30; hex.cols = 17; hex.rows = 12;
  hex.w = Math.sqrt(3)*hex.R; hex.vs = 1.5*hex.R;
  hex.ox = 480 - ((hex.cols-1)*hex.w + hex.w/2)/2;
  hex.oy = 320 - ((hex.rows-1)*hex.vs)/2;
  hex.grid = [];
  for(let L=0;L<3;L++){
    const g = [];
    for(let r=0;r<hex.rows;r++) for(let c=0;c<hex.cols;c++){
      g.push({ c, r, L, x: hex.ox + c*hex.w + ((r&1)?hex.w/2:0), y: hex.oy + r*hex.vs,
               state:'ok', t:0 });
    }
    hex.grid.push(g);
  }
  const n = G.beans.length;
  G.beans.forEach((b,i)=>{
    const a = i/n*TAU, rr = 120 + (i%3)*46;
    b.x = 480 + Math.cos(a)*rr; b.y = 320 + Math.sin(a)*rr*0.75;
    b.z = 0; b.vx = b.vy = b.vz = 0; b.face = -Math.PI/2;
    b.state='run'; b.stun=0; b.inv=0; b.out=false; b.done=false; b.fallT=0; b.spin=0; b.cheer=0;
    b.layer = 0; b.hT = null; b.dropT = 0; b.aiT = irnd(0,12);
  });
  cam.x = 0; cam.y = 0;
}
function tileAt(L, x, y){
  const g = hex.grid[L]; if(!g) return null;
  const r0 = Math.round((y - hex.oy)/hex.vs);
  let best = null, bd = 1e9;
  for(let rr=r0-1; rr<=r0+1; rr++){
    if(rr < 0 || rr >= hex.rows) continue;
    const off = (rr&1) ? hex.w/2 : 0;
    const c0 = Math.round((x - hex.ox - off)/hex.w);
    for(let cc=c0-1; cc<=c0+1; cc++){
      if(cc < 0 || cc >= hex.cols) continue;
      const t = g[rr*hex.cols + cc];
      const d = (t.x-x)*(t.x-x) + (t.y-y)*(t.y-y);
      if(d < bd){ bd = d; best = t; }
    }
  }
  return (best && bd < hex.R*hex.R*1.2) ? best : null;
}
function hexNeighbors(L, t){
  const out = [];
  for(let k=0;k<6;k++){
    const a = k*Math.PI/3;
    const n = tileAt(L, t.x + Math.cos(a)*hex.w, t.y + Math.sin(a)*hex.w);
    if(n) out.push(n);
  }
  return out;
}
function viewLayer(){
  const p = G.player;
  if(p && !p.out && !G.spectate) return p.layer;
  const cnt = [0,0,0];
  for(const b of G.beans) if(!b.out) cnt[b.layer]++;
  let bi = 0; for(let i=1;i<3;i++) if(cnt[i] > cnt[bi]) bi = i;
  return bi;
}
function updateHex(){
  const R = G.round;
  const live = (G.freeze <= 0 && G.endT <= 0);
  if(live){
    for(let L=0;L<3;L++) for(const t of hex.grid[L]){
      if(t.state === 'lit' && --t.t <= 0){
        t.state = 'gone';
        if(L === viewLayer()) burst(t.x, t.y, 8, 10, HEXCOL[L], 2.8);
      }
    }
  }
  for(const b of G.beans){
    if(b.out && b.state !== 'fall') continue;
    if(b.state === 'fall'){
      updateBean(b, null);
      if(b.fallT > 40 && !b.out) eliminate(b);
      continue;
    }
    if(b.state === 'drop'){                       // 下の層へ落下中
      b.dropT--;
      b.x += b.vx*0.4; b.y += b.vy*0.4;
      if(b.dropT <= 0){
        b.layer++; b.state = 'run'; b.stun = 10; b.z = 0; b.vz = 0;
        b.vx *= 0.35; b.vy *= 0.35; b.hT = null;
        burst(b.x, b.y, 6, 10, HEXCOL[b.layer], 2.4);
        sfx.land();
        if(b.isPlayer) G.shake = 6;
      }
      continue;
    }
    const cmd = cmdFor(b);
    updateBean(b, cmd);
    if(!live) continue;
    if(b.z <= 2){
      const t = tileAt(b.layer, b.x, b.y);
      if(!t || t.state === 'gone'){
        if(b.layer >= 2){                         // 最下層 → 脱落
          b.state = 'fall'; b.fallT = 0; sfx.fall();
          if(b.isPlayer) G.flash = 8;
        } else {
          b.state = 'drop'; b.dropT = 26; sfx.fall();
          if(b.isPlayer) G.flash = 5;
        }
        continue;
      }
      if(t.state === 'ok'){ t.state = 'lit'; t.t = HEX_LIT; }
    }
  }
  beanVsBean();

  const alive = G.beans.filter(b=> !b.out && b.state !== 'fall').length;
  const me = G.player;
  const need = G.practice ? 1 : (R.qualify || 1);
  const clear = (txt)=>{
    G.endT = 150;
    if(me && !me.out && !G.spectate) qualifyFX(txt, me); else showBanner(txt, '#3ddc84');
    celebrateRound();
  };
  if(G.endT > 0){ if(--G.endT === 0) endRound(); }
  else if(alive <= 1) clear('LAST ONE!!');
  else if(alive <= need) clear('SURVIVED!!');
  else if(G.timeLeft <= 0) clear('SURVIVED!!');
}
function aiHex(b){
  const cur = tileAt(b.layer, b.x, b.y);
  const patience = 22 + (1-b.skill)*26;                 // 消える何フレーム前に動くか
  const urgent = !cur || cur.state === 'gone' || (cur.state === 'lit' && cur.t < patience);

  if(!urgent && cur){                                    // 安全 → タイル中央で待つ（床を減らさない）
    b.hT = null;
    const dx = cur.x-b.x, dy = cur.y-b.y, d = Math.hypot(dx,dy);
    if(d < 7) return { mx:0, my:0, jump:false, dive:false };
    return { mx:dx/d*0.7, my:dy/d*0.7, jump:false, dive:false };
  }

  if(!b.hT || b.hT.state === 'gone' || (b.hT.state === 'lit' && b.hT.t < 14)){
    let best = null, bs = -1e9, far = false;
    let cands = cur ? hexNeighbors(b.layer, cur) : [];
    if(!cands.length){                                   // 周りが全部消えた → 少し遠くへ跳ぶ
      far = true;
      cands = hex.grid[b.layer].filter(t=> t.state !== 'gone' &&
                Math.hypot(t.x-b.x, t.y-b.y) < hex.w*2.6);
    }
    for(const t of cands){
      if(t.state === 'gone') continue;
      let sc = -Math.hypot(t.x-b.x, t.y-b.y)*0.25;
      if(t.state === 'lit') sc -= 220 + (HEX_LIT - t.t)*1.5;
      let around = 0;
      for(const n2 of hexNeighbors(b.layer, t)) if(n2.state !== 'gone') around++;
      sc += around*26;
      if(b.layer < 2){
        const bl = tileAt(b.layer+1, t.x, t.y);
        if(!bl || bl.state === 'gone') sc -= 80;          // 落ちた先が無い場所は避ける
      }
      for(const o of G.beans){
        if(o === b || o.out || o.layer !== b.layer) continue;
        if(Math.hypot(o.x-t.x, o.y-t.y) < 44) sc -= 170;
      }
      if(sc > bs){ bs = sc; best = t; }
    }
    b.hT = best; b.hFar = far;
  }
  if(!b.hT) return { mx:0, my:0, jump:false, dive:false };
  let mx = b.hT.x-b.x, my = b.hT.y-b.y;
  const m = Math.hypot(mx,my) || 1;
  const jump = b.hFar && m > hex.w*1.2 && b.z <= 0;
  return { mx:mx/m, my:my/m, jump, dive:false };
}
function drawHexLayer(L, alpha, dim){
  const g = hex.grid[L];
  ctx.save(); ctx.globalAlpha = alpha;
  for(const t of g){
    if(t.state === 'gone') continue;
    const lit = t.state === 'lit';
    const jx = lit ? rnd(-1.6,1.6) : 0, jy = lit ? rnd(-1.6,1.6) : 0;
    ctx.fillStyle = 'rgba(0,0,0,.45)';
    hexPath(t.x+jx, t.y+jy+7, hex.R-2); ctx.fill();
    if(dim){
      ctx.fillStyle = HEXDIM[L];
      hexPath(t.x+jx, t.y+jy, hex.R-2); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.16)'; ctx.lineWidth = 2;
      hexPath(t.x+jx, t.y+jy, hex.R-4); ctx.stroke();
    }
    else {
      ctx.fillStyle = (lit && Math.floor(t.t/4)%2 === 0) ? '#ffffff' : HEXCOL[L];
      hexPath(t.x+jx, t.y+jy, hex.R-2); ctx.fill();
    }
    if(!dim){
      ctx.fillStyle = 'rgba(255,255,255,.32)';
      hexPath(t.x+jx, t.y+jy-4, hex.R-14); ctx.fill();
      if(lit){
        ctx.strokeStyle = 'rgba(255,70,110,.95)'; ctx.lineWidth = 4;
        hexPath(t.x+jx, t.y+jy, hex.R-6); ctx.stroke();
      }
    }
  }
  ctx.restore();
}
function drawHexGhost(b, alpha, scale){
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = b.isPlayer ? '#ff2d87' : b.color;
  ctx.beginPath(); ctx.ellipse(b.x, b.y - b.z, 13*scale, 15*scale, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 2; ctx.stroke();
  ctx.restore();
}
function drawHexFloor(){
  ctx.fillStyle = '#0d0520'; ctx.fillRect(0,0,VW,VH);
  const vl = viewLayer();
  for(let L = 2; L > vl; L--) drawHexLayer(L, L === vl+1 ? 0.75 : 0.34, true);
  for(const b of G.beans){ if(b.out || b.layer <= vl) continue; drawHexGhost(b, 0.45, 0.85); }
  drawHexLayer(vl, 1, false);
  for(const b of G.beans){ if(b.out || b.layer >= vl) continue; drawHexGhost(b, 0.22, 1.1); }
}

// ---------------------------------------------------------------- フロア・アウト
// 床パネルが時間経過で抜けていくサバイバル。落ちたら脱落。
let farena = { x:46, y:70, cols:7, rows:5, pw:124, ph:100, cells:[], waveT:0 };
const FPAL = ['#5fc9ff','#7ee08a','#ffd23f','#ff9f5a','#c08bff','#ff8fd0','#9db4ff'];

function buildFloor(){
  obstacles = []; zones = []; holes = []; parts = []; pads = []; tiles = []; plats = [];
  farena.cols = 8; farena.rows = 6; farena.pw = 112; farena.ph = 92;
  farena.x = 480 - farena.cols*farena.pw/2;
  farena.y = 320 - farena.rows*farena.ph/2;
  farena.cells = []; farena.waveT = 150;
  for(let r=0;r<farena.rows;r++) for(let c=0;c<farena.cols;c++){
    farena.cells.push({ c, r, x:farena.x+c*farena.pw, y:farena.y+r*farena.ph,
                        w:farena.pw, h:farena.ph, state:'ok', t:0, wear:0, sh:0,
                        col: FPAL[(c*2+r*3) % FPAL.length] });
  }
  const n = G.beans.length;
  G.beans.forEach((b,i)=>{
    const cell = farena.cells[Math.floor(i * farena.cells.length / n)];
    b.x = cell.x + cell.w/2 + rnd(-24,24);
    b.y = cell.y + cell.h/2 + rnd(-20,20);
    b.z = 0; b.vx = b.vy = b.vz = 0; b.face = -Math.PI/2;
    b.state='run'; b.stun=0; b.inv=0; b.out=false; b.done=false; b.fallT=0; b.spin=0; b.cheer=0;
    b.fT = null; b.aiT = irnd(0,14);
  });
  cam.x = 0; cam.y = 0;
}
function cellAt(x, y){
  const c = Math.floor((x-farena.x)/farena.pw), r = Math.floor((y-farena.y)/farena.ph);
  if(c < 0 || r < 0 || c >= farena.cols || r >= farena.rows) return null;
  return farena.cells[r*farena.cols + c];
}
function breakCell(cell, warnT){
  if(cell.state !== 'ok') return;
  cell.state = 'warn'; cell.t = warnT;
}
function updateFloor(){
  const R = G.round;
  const live = (G.freeze <= 0 && G.endT <= 0);
  const prog = clamp(G.rt/(R.time*60), 0, 1);

  if(live){
    // 崩落ウェーブ（だんだん速く・多く）
    if(--farena.waveT <= 0){
      const ok = farena.cells.filter(c=> c.state === 'ok');
      const k = Math.min(ok.length - 4, 1 + Math.floor(prog*3));
      for(let i=0;i<k;i++){
        const cell = ok.splice(irnd(0, ok.length-1), 1)[0];
        if(cell) breakCell(cell, Math.round(95 - prog*40));
      }
      farena.waveT = Math.round(190 - prog*105);
    }
    for(const cell of farena.cells){
      if(cell.sh > 0) cell.sh--;
      if(cell.state === 'warn'){
        cell.sh = 4;
        if(--cell.t <= 0){
          cell.state = 'gone';
          burst(cell.x+cell.w/2, cell.y+cell.h/2, 10, 16, cell.col, 3.4);
          sfx.land();
        }
      } else if(cell.state === 'ok' && cell.wear > 0) cell.wear -= 0.7;
    }
  }

  for(const b of G.beans){
    if(b.out && b.state !== 'fall') continue;
    if(b.state === 'fall'){
      updateBean(b, null);
      if(b.fallT > 40 && !b.out) eliminate(b);
      continue;
    }
    const cmd = cmdFor(b);
    updateBean(b, cmd);
    if(!live) continue;
    const cell = cellAt(b.x, b.y);
    if(b.z <= 2){
      if(!cell || cell.state === 'gone'){
        b.state = 'fall'; b.fallT = 0; sfx.fall();
        if(b.isPlayer) G.flash = 8;
        continue;
      }
      // 乗り続けると足元がすり減って割れる
      cell.wear += 1;
      if(cell.wear > 190) breakCell(cell, 60);
    }
  }
  beanVsBean();

  const alive = G.beans.filter(b=> !b.out && b.state !== 'fall').length;
  const me = G.player;
  const clear = ()=>{
    G.endT = 150;
    if(me && !me.out && !G.spectate) qualifyFX('SURVIVED!!', me); else showBanner('SURVIVED!', '#3ddc84');
    celebrateRound();
  };
  if(G.endT > 0){ if(--G.endT === 0) endRound(); }
  else if(alive <= 1){ G.endT = 130; showBanner('LAST ONE!', '#ffd23f'); celebrateRound(); }
  else if(R.qualify > 0 && alive <= R.qualify) clear();
  else if(G.timeLeft <= 0) clear();
}
function aiFloor(b){
  if(--b.aiT <= 0 || !b.fT){
    b.aiT = irnd(9, 18);
    const cur = cellAt(b.x, b.y);
    let best = null, bs = -1e9;
    for(const c of farena.cells){
      if(c.state === 'gone') continue;
      const cx = c.x+c.w/2, cy = c.y+c.h/2;
      const d = Math.hypot(cx-b.x, cy-b.y);
      if(d > 340) continue;
      let sc = -d*0.85 - c.wear*0.9;
      if(c.state === 'warn') sc -= 400 + c.t;
      if(cur && c === cur) sc -= 55;                      // 居座らない
      for(const o of G.beans){
        if(o === b || o.out) continue;
        if(Math.abs(o.x-cx) < 46 && Math.abs(o.y-cy) < 42) sc -= 130;
      }
      // 残っている床が多い方向を好む
      let around = 0;
      for(const n2 of farena.cells){
        if(n2.state === 'gone') continue;
        if(Math.abs(n2.c-c.c) <= 1 && Math.abs(n2.r-c.r) <= 1) around++;
      }
      sc += around*14;
      if(sc > bs){ bs = sc; best = {x:cx, y:cy}; }
    }
    b.fT = best;
  }
  if(!b.fT) return { mx:0, my:0, jump:false, dive:false };
  let mx = b.fT.x-b.x, my = b.fT.y-b.y;
  const m = Math.hypot(mx,my) || 1;
  const mid = cellAt(b.x+mx*0.55, b.y+my*0.55);
  const jump = (!mid || mid.state === 'gone') && m > 55 && b.z <= 0;
  return { mx:mx/m, my:my/m, jump, dive:false };
}
function drawFloorArena(){
  ctx.fillStyle = '#2a1550'; ctx.fillRect(0,0,VW,VH);
  ctx.fillStyle = 'rgba(255,255,255,.07)';
  for(let i=0;i<8;i++){
    const x = (i*191 + G.elapsed*0.3) % (VW+220) - 110, y = 40 + (i*113)%560;
    ctx.beginPath(); ctx.ellipse(x, y, 78, 28, 0, 0, TAU); ctx.fill();
  }
  for(const c of farena.cells){
    if(c.state === 'gone') continue;
    const jx = c.sh > 0 ? rnd(-2.5,2.5) : 0, jy = c.sh > 0 ? rnd(-2.5,2.5) : 0;
    const x = c.x+3+jx, y = c.y+3+jy, w = c.w-6, h = c.h-6;
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    roundRect(x, y+10, w, h, 16); ctx.fill();
    const warnBlink = c.state === 'warn' && (Math.floor(c.t/5) % 2 === 0);
    ctx.fillStyle = warnBlink ? '#ffffff' : c.col;
    roundRect(x, y, w, h, 16); ctx.fill();
    // すり減り表現
    if(c.wear > 30){
      ctx.globalAlpha = clamp(c.wear/240, 0, 0.5);
      ctx.fillStyle = '#3a2560'; roundRect(x, y, w, h, 16); ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.fillStyle = 'rgba(255,255,255,.4)';
    roundRect(x+12, y+9, w-24, 14, 7); ctx.fill();
    if(c.state === 'warn'){
      ctx.strokeStyle = 'rgba(255,60,90,.95)'; ctx.lineWidth = 5;
      roundRect(x+4, y+4, w-8, h-8, 13); ctx.stroke();
      ctx.fillStyle = 'rgba(255,60,90,'+(0.25+0.2*Math.sin(G.elapsed*0.4))+')';
      roundRect(x, y, w, h, 16); ctx.fill();
    }
    ctx.restore();
  }
}

// ---------------------------------------------------------------- ROUND4 ロール・アウト
// 円筒の表面を展開したトップビュー。縦5本の帯＝リングで、各帯の床が上下にスクロールする。
function buildRoll(){
  obstacles = []; zones = []; holes = []; parts = []; pads = []; tiles = []; plats = [];
  roll.x = 64; roll.y = 66; roll.w = 832; roll.h = 512; roll.n = 5;
  roll.cw = roll.w/roll.n; roll.per = roll.h + 240; roll.cols = [];
  for(let i=0;i<roll.n;i++){
    const dir = (i%2===0) ? 1 : -1;
    const c = { x: roll.x + i*roll.cw, w: roll.cw, dir, spd: rnd(0.50,0.78), off: rnd(0,roll.per), holes:[] };
    const nh = 3;
    for(let k=0;k<nh;k++){
      c.holes.push({ s: roll.per*(k/nh) + rnd(0, roll.per/nh*0.5),
                     ox: rnd(0.04,0.44), w: c.w*rnd(0.44,0.60), h: 104 });
    }
    roll.cols.push(c);
  }
  // 穴の上に湧かないように配置する
  const n = G.beans.length, placed = [];
  G.beans.forEach((b,i)=>{
    const bx = roll.x + roll.w*((i+0.5)/n);
    let px = bx, py = roll.y + roll.h*0.5, ok = false;
    for(let k=0;k<90 && !ok;k++){
      const x = clamp(bx + rnd(-46,46), roll.x+BEAN_R+6, roll.x+roll.w-BEAN_R-6);
      const y = roll.y + roll.h*0.5 + rnd(-110,110);
      if(rollSpotBad(x, y, placed)) continue;
      px = x; py = y; ok = true;
    }
    if(!ok){ const sp = bestRollSpot(placed); px = sp.x; py = sp.y; }
    b.x = px; b.y = py; placed.push({x:px, y:py});
    b.z = 0; b.vx = b.vy = b.vz = 0; b.face = -Math.PI/2;
    b.state='run'; b.stun=0; b.inv=0; b.out=false; b.done=false; b.fallT=0; b.spin=0; b.cheer=0;
  });
  cam.x = 0; cam.y = 0;
}
function colAt(x){
  const i = Math.floor((x - roll.x)/roll.cw);
  return (i>=0 && i<roll.cols.length) ? roll.cols[i] : null;
}
// 穴からも他のビーンからも最も離れた場所を探す（最後の砦）
function bestRollSpot(placed){
  let best = null, bs = -1;
  for(let x = roll.x+34; x < roll.x+roll.w-34; x += 26){
    const c = colAt(x); if(!c) continue;
    const hr = holeRects(c);
    for(let y = roll.y+44; y < roll.y+roll.h-44; y += 26){
      let sc = Math.min((y-roll.y)*0.8, (roll.y+roll.h-y)*0.8);
      for(const h of hr){
        const dx = Math.max(h.x-x, 0, x-(h.x+h.w)), dy = Math.max(h.y-y, 0, y-(h.y+h.h));
        sc = Math.min(sc, Math.hypot(dx,dy));
      }
      for(const q of placed) sc = Math.min(sc, Math.hypot(q.x-x, q.y-y)*0.8);
      if(sc > bs){ bs = sc; best = {x, y}; }
    }
  }
  return best || { x: roll.x+roll.w/2, y: roll.y+roll.h/2 };
}
function rollSpotBad(x, y, placed){
  for(const q of placed) if(Math.hypot(q.x-x, q.y-y) < BEAN_R*2+8) return true;
  const c = colAt(x); if(!c) return true;
  for(const h of holeRects(c)){
    if(x > h.x-BEAN_R-12 && x < h.x+h.w+BEAN_R+12 && y > h.y-BEAN_R-12 && y < h.y+h.h+BEAN_R+12) return true;
  }
  return false;
}
function holeRects(c){
  const out = [];
  for(const h of c.holes) out.push({ x: c.x + h.ox*c.w, y: roll.y - 120 + fmod(h.s + c.off, roll.per), w: h.w, h: h.h });
  return out;
}
function inRollHole(b){
  const c = colAt(b.x); if(!c) return false;
  for(const h of holeRects(c))
    if(b.x > h.x+3 && b.x < h.x+h.w-3 && b.y > h.y+3 && b.y < h.y+h.h-3) return true;
  return false;
}
function rollBlocked(x, y, range){
  const c = colAt(x); if(!c) return true;
  for(const h of holeRects(c)){
    if(x > h.x-BEAN_R-8 && x < h.x+h.w+BEAN_R+8){
      if(Math.abs((h.y+h.h/2) - y) < range) return true;
    }
  }
  return false;
}
function aiRoll(b){
  // 流される向きの上流側をキープ
  const c = colAt(b.x);
  const ty = c ? (c.dir > 0 ? roll.y + roll.h*0.30 : roll.y + roll.h*0.70) : roll.y + roll.h*0.5;
  let my = clamp((ty - b.y)/110, -1, 1);
  // 穴のない x へ寄る
  let tx = b.x, bd = 1e9;
  for(let x = roll.x+22; x < roll.x+roll.w-22; x += 22){
    if(rollBlocked(x, b.y, 150)) continue;
    const d = Math.abs(x-b.x); if(d < bd){ bd = d; tx = x; }
  }
  let mx = clamp((tx - b.x)/70, -1, 1);
  // 目の前に穴が迫っていたら飛び越える
  let jump = false;
  if(c){
    for(const h of holeRects(c)){
      if(b.x > h.x-BEAN_R && b.x < h.x+h.w+BEAN_R){
        const dy = (h.y + h.h/2) - b.y;
        if(Math.abs(dy) < 92 && b.z <= 0 && bd > 60) jump = true;
      }
    }
  }
  return { mx, my, jump, dive:false };
}
function addRollHole(){
  for(const c of roll.cols){
    c.holes.push({ s: rnd(0, roll.per), ox: rnd(0.04,0.44), w: c.w*rnd(0.44,0.60), h: 104 });
  }
  showBanner('HOLE +1', '#ff5f6d');
}
function updateRoll(){
  const R = G.round;
  const boost = 1 + clamp(G.rt/(R.rampT||2700), 0, 1)*(R.ramp||1.15);
  if(R.addHole && G.rt > 0 && G.rt % 900 === 0 && G.rt <= 3600) addRollHole();
  const live = (G.freeze <= 0 && G.endT <= 0);      // 決着後は危険を止める
  if(live){
    for(const c of roll.cols) c.off = fmod(c.off + c.dir*c.spd*boost, roll.per);
    if(G.rt === 1200 || G.rt === 2400) showBanner('SPEED UP!', '#ffd23f');
  }
  cols.length = 0;

  for(const b of G.beans){
    if(b.out && b.state !== 'fall') continue;
    if(b.state === 'fall'){
      updateBean(b, null);
      if(b.fallT > 40 && !b.out) eliminate(b);
      continue;
    }
    const cmd = cmdFor(b);
    updateBean(b, cmd);
    if(!live) continue;
    // 回転している床に運ばれる（空中なら流されない）
    const c = colAt(b.x);
    if(b.z <= 0.02 && c) b.y += c.dir*c.spd*boost;
    // 円筒の端は壁
    if(b.x < roll.x+BEAN_R){ b.x = roll.x+BEAN_R; if(b.vx<0) b.vx *= -0.3; }
    if(b.x > roll.x+roll.w-BEAN_R){ b.x = roll.x+roll.w-BEAN_R; if(b.vx>0) b.vx *= -0.3; }
    // 穴・端から落下
    if(b.z <= 2 && (b.y < roll.y+2 || b.y > roll.y+roll.h-2 || inRollHole(b))){
      b.state = 'fall'; b.fallT = 0; sfx.fall();
      if(b.isPlayer) G.flash = 8;
    }
  }
  beanVsBean();

  const alive = G.beans.filter(b=> !b.out && b.state !== 'fall').length;   // 落下中は生存に数えない
  const me = G.player;
  const clear = ()=>{
    G.endT = 150;
    if(me && !me.out && !G.spectate) qualifyFX('SURVIVED!!', me); else showBanner('SURVIVED!', '#3ddc84');
    celebrateRound();
  };
  if(G.endT > 0){ if(--G.endT === 0) endRound(); }
  else if(alive <= 1){ G.endT = 130; showBanner('LAST ONE!', '#ffd23f'); celebrateRound(); }
  else if(R.qualify > 0 && alive <= R.qualify) clear();   // 規定数まで減ったら終了
  else if(G.timeLeft <= 0) clear();                       // 時間切れ：残っている人は全員クリア
}
function drawRollFloor(){
  ctx.fillStyle = '#241246'; ctx.fillRect(0,0,VW,VH);
  // 落下ゾーンのハザード帯
  ctx.save();
  ctx.fillStyle = '#1a0c36';
  ctx.fillRect(0,0,VW,roll.y); ctx.fillRect(0,roll.y+roll.h,VW,VH-(roll.y+roll.h));
  ctx.fillStyle = 'rgba(255,210,63,.85)';
  for(let x=-40; x<VW; x+=44){
    ctx.beginPath(); ctx.moveTo(x, roll.y-14); ctx.lineTo(x+20, roll.y-14); ctx.lineTo(x+8, roll.y); ctx.lineTo(x-12, roll.y);
    ctx.closePath(); ctx.fill();
    const yb = roll.y+roll.h;
    ctx.beginPath(); ctx.moveTo(x, yb+14); ctx.lineTo(x+20, yb+14); ctx.lineTo(x+8, yb); ctx.lineTo(x-12, yb);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();

  for(const c of roll.cols){
    ctx.save();
    ctx.beginPath(); ctx.rect(c.x, roll.y, c.w, roll.h); ctx.clip();
    // 円筒の丸みを表すグラデーション
    const g = ctx.createLinearGradient(0, roll.y, 0, roll.y+roll.h);
    g.addColorStop(0,   '#6b4bb8');
    g.addColorStop(0.16,'#c9a7ff');
    g.addColorStop(0.5, '#ffe9f7');
    g.addColorStop(0.84,'#c9a7ff');
    g.addColorStop(1,   '#6b4bb8');
    ctx.fillStyle = g; ctx.fillRect(c.x, roll.y, c.w, roll.h);
    // 回転が分かる横板
    ctx.strokeStyle = 'rgba(122,77,255,.30)'; ctx.lineWidth = 5;
    for(let k=0;k<Math.ceil(roll.per/64);k++){
      const y = roll.y - 120 + fmod(k*64 + c.off, roll.per);
      if(y < roll.y-10 || y > roll.y+roll.h+10) continue;
      ctx.beginPath(); ctx.moveTo(c.x+2, y); ctx.lineTo(c.x+c.w-2, y); ctx.stroke();
    }
    // 穴
    for(const h of holeRects(c)){
      if(h.y > roll.y+roll.h || h.y+h.h < roll.y) continue;
      ctx.fillStyle = 'rgba(20,8,44,.45)';
      roundRect(h.x-5, h.y-5, h.w+10, h.h+10, 20); ctx.fill();
      const hg = ctx.createLinearGradient(0, h.y, 0, h.y+h.h);
      hg.addColorStop(0,'#160a34'); hg.addColorStop(0.5,'#0d0520'); hg.addColorStop(1,'#160a34');
      ctx.fillStyle = hg; roundRect(h.x, h.y, h.w, h.h, 16); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.22)'; ctx.lineWidth = 3;
      roundRect(h.x+3, h.y+3, h.w-6, h.h-6, 14); ctx.stroke();
    }
    ctx.restore();
    // リングの継ぎ目
    ctx.fillStyle = '#4b2f96'; ctx.fillRect(c.x-3, roll.y, 6, roll.h);
    ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.fillRect(c.x-3, roll.y, 2, roll.h);
    // 回転方向の表示
    ctx.save();
    ctx.globalAlpha = .8; ctx.fillStyle = '#ffd23f';
    const ax = c.x + c.w/2;
    for(const ay of [roll.y+16, roll.y+roll.h-16]){
      ctx.save(); ctx.translate(ax, ay); ctx.scale(1, c.dir);
      ctx.beginPath(); ctx.moveTo(-13,-7); ctx.lineTo(13,-7); ctx.lineTo(0,9); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    ctx.restore();
  }
  ctx.fillStyle = '#4b2f96';
  ctx.fillRect(roll.x-8, roll.y, 8, roll.h); ctx.fillRect(roll.x+roll.w, roll.y, 8, roll.h);
}

// ---------------------------------------------------------------- AI
// プレイヤーは入力、それ以外は現ステージのAI
function cmdFor(b){ return (b.isPlayer && !G.spectate) ? playerCmd(b) : G.stage.ai(b); }

function playerCmd(b){
  let mx = 0, my = 0;
  if(keys['ArrowLeft'] ||keys['KeyA']) mx -= 1;
  if(keys['ArrowRight']||keys['KeyD']) mx += 1;
  if(keys['ArrowUp']   ||keys['KeyW']) my -= 1;
  if(keys['ArrowDown'] ||keys['KeyS']) my += 1;
  mx += stick.x; my += stick.y;
  const jump = !!(keys['Space'] || tJump);
  const dive = !!(keys['ShiftLeft'] || keys['ShiftRight'] || keys['KeyJ'] || keys['KeyK'] || tDive);
  return { mx, my, jump, dive };
}

function nearDanger(b, ahead){
  // 前方の障害物を調べ、回避ベクトルとジャンプ判断を返す
  let avx = 0, avy = 0, jump = false, noJump = false;
  const dirx = Math.cos(b.face), diry = Math.sin(b.face);
  for(const c of cols){
    if(c.mode === 'block' || c.mode === 'door') continue;
    let cx, cy, rad;
    if(c.t === 'circle'){ cx = c.x; cy = c.y; rad = c.r; }
    else {
      cx = c.x; cy = c.y; rad = Math.max(c.w, c.h)*0.5;
      if(c.w > 120){ // 長い棒は最寄り点で判定
        const ca = Math.cos(c.a||0), sa = Math.sin(c.a||0);
        const ex = b.x-c.x, ey = b.y-c.y;
        const t = clamp(ex*ca+ey*sa, -c.w/2, c.w/2);
        cx = c.x + ca*t; cy = c.y + sa*t; rad = c.h*0.5;
      }
    }
    const dx = cx-b.x, dy = cy-b.y;
    const d = Math.hypot(dx,dy);
    const range = rad + ahead;
    if(d > range) continue;
    const dot = (dx*dirx + dy*diry)/(d||1);
    if(dot < -0.35) continue;
    const low = c.hi <= 26 && c.lo <= 1;
    const high = c.lo >= 30;
    if(low && d < rad + 46) jump = true;
    else if(high && d < rad + 70) noJump = true;
    else if(!low){
      const w = (range-d)/range;
      avx += (-dx/(d||1))*w*1.6; avy += (-dy/(d||1))*w*1.0;
      // 横へ逃げる
      avx += (-diry)*w*(dx>0?-1:1)*1.2;
    }
  }
  return { avx, avy, jump, noJump };
}

// 穴の上を渡るとき、乗れる足場へ誘導する
function guideFloor(b){
  for(const h of holes){
    if(!h.cross) continue;                                  // 足場を渡る穴だけ誘導
    if(b.y > h.y + h.h + 150 || b.y < h.y + 8) continue;   // 向こう岸に着いたら誘導終了
    const cand = [];
    for(const t of tiles) if(t.on && !t.warn) cand.push(t);
    for(const pl of plats) cand.push(pl);
    for(const z of zones) if(z.t === 'turn')
      cand.push({ x:z.cx-z.r, y:z.cy-z.r, w:z.r*2, h:z.r*2, disc:z });

    let cur = null;                                      // いま乗っている足場
    for(const t of tiles) if(t.on && inRect(b,t)) cur = t;
    if(!cur) for(const pl of plats) if(inRect(b,pl)) cur = pl;
    if(!cur) for(const c of cand) if(c.disc && Math.hypot(b.x-c.disc.cx, b.y-c.disc.cy) < c.disc.r-4) cur = c;

    let best = null, bd = 1e9;
    for(const c of cand){
      const ccx = c.x+c.w/2, ccy = c.y+c.h/2;
      if(ccy > b.y - 24 || ccy < b.y - 260) continue;     // 前方の隣の段だけ
      if(cur){                                            // 今の足場と横に重なっていること
        const ov = Math.min(cur.x+cur.w, c.x+c.w) - Math.max(cur.x, c.x);
        if(ov < 46) continue;
      }
      const d = Math.abs(ccx-b.x)*1.2 + Math.abs(ccy-b.y);
      const pad = c.amp ? 58 : 32;                       // 動く床は内側を狙う
      if(d < bd){
        bd = d;
        if(c.disc) best = { x:c.disc.cx, y:c.disc.cy };
        else {
          const tx = clamp(b.x, c.x+pad, c.x+c.w-pad);
          // 横位置が合うまでは前に出ない（動く床に踏み外して落ちるのを防ぐ）
          best = { x:tx, y: Math.abs(b.x-tx) < 26 ? ccy : b.y };
        }
      }
    }
    if(best) return best;
    if(cur){
      // 次の足場が無い＝ここが最後。今の足場が向こう岸まで届くならそのまま前へ抜ける
      let top;
      if(cur.disc){
        const dx = b.x - cur.disc.cx, k = cur.disc.r*cur.disc.r - dx*dx;
        top = (k > 0) ? cur.disc.cy - Math.sqrt(k) : cur.disc.cy;
      } else top = cur.y;
      if(top <= h.y + 4) return { x:b.x, y:h.y - 60 };
      return cur.disc ? { x:cur.disc.cx, y:cur.disc.cy }                 // 回転盤は中心が安全
                      : { x: clamp(b.x, cur.x+(cur.amp?58:36), cur.x+cur.w-(cur.amp?58:36)), y: b.y };
    }
    return { x:b.x, y:b.y };
  }
  return null;
}

function aiRace(b){
  let tx = clamp(400 + b.lane, 70, 730), ty = b.y - 260;
  const gf = guideFloor(b);
  if(gf){ tx = gf.x; ty = gf.y; }

  // 穴セクション → 橋へ
  if(b.y < -1780 && b.y > -2330){
    const bridges = [210, 580];
    if(b.y > -1980) b.bridge = (Math.abs(bridges[0]-b.x) < Math.abs(bridges[1]-b.x)) ? 0 : 1;
    tx = bridges[b.bridge];
  }
  // ドアウォール → 扉を選ぶ
  for(const o of obstacles){
    if(o.kind !== 'doorwall') continue;
    if(b.y > o.y && b.y < o.y + 360){
      const broken = o.slots.filter(s=>s.broken);
      if(broken.length){
        let best = broken[0], bd = 1e9;
        for(const s of broken){ const d = Math.abs(s.x-b.x); if(d<bd){ bd=d; best=s; } }
        tx = best.x;
      } else {
        if(b.doorSel[o.id] === undefined || o.slots[b.doorSel[o.id]].tried){
          const cand = [];
          for(let i=0;i<o.slots.length;i++) if(!o.slots[i].tried) cand.push(i);
          b.doorSel[o.id] = cand.length ? pick(cand) : irnd(0,o.slots.length-1);
        }
        tx = o.slots[b.doorSel[o.id]].x;
      }
      ty = o.y - 60;
    }
  }
  let mx = tx - b.x, my = ty - b.y;
  const m = Math.hypot(mx,my) || 1; mx/=m; my/=m;

  const dg = nearDanger(b, 78);
  mx += dg.avx; my += dg.avy;

  if(b.x < 60) mx += 1.2;
  if(b.x > 740) mx -= 1.2;

  const jump = dg.jump && !dg.noJump;
  let dive = false;
  b.aiT--;
  if(b.aiT <= 0){ b.aiT = irnd(70,190); if(Math.random() < 0.35 && !dg.noJump) dive = true; }
  if(b.y < world.goalY + 260 && b.z <= 0 && Math.random() < 0.05) dive = true;

  return { mx, my, jump, dive };
}

function aiArena(b){
  const dx = b.x - arena.cx, dy = b.y - arena.cy;
  const dist = Math.hypot(dx,dy) || 1;
  const th = Math.atan2(dy,dx);
  let mx = 0, my = 0;

  // ジャンプ・クラブ：中心寄りの安全半径を保つ
  const want = arena.r*0.55;
  const rr = (want - dist)/60;
  mx = Math.cos(th)*rr; my = Math.sin(th)*rr;
  // 少しうろつく
  mx += Math.cos(b.anim*0.13 + b.id)*0.35;
  my += Math.sin(b.anim*0.11 + b.id)*0.35;

  let jump = false, danger = false;
  for(const o of obstacles){
    if(o.kind !== 'rotbar') continue;
    // バー角度と自分の角度の差（バーは直径なのでπ周期）
    let d = th - o.a;
    d = Math.atan2(Math.sin(d), Math.cos(d));
    if(d > Math.PI/2) d -= Math.PI;
    if(d < -Math.PI/2) d += Math.PI;
    const t = o.om !== 0 ? d/o.om : 1e9; // バーが自分に到達するまでのフレーム
    const react = 3 + (1-b.skill)*30;
    if(t > 0 && t < 20 + react){
      if(o.high) danger = true;
      else if(t > 4 && t < 15 + react*0.4 && b.z <= 0) jump = true;
    }
  }
  if(danger) jump = false;
  return { mx, my, jump, dive:false };
}

// ---------------------------------------------------------------- ゾーン/落下
function applyZones(b){
  if(b.z > 6 || b.state === 'fall') return;
  for(const z of zones){
    if(b.x > z.x && b.x < z.x+z.w && b.y > z.y && b.y < z.y+z.h){
      if(z.t === 'slime'){ b.zoneMul = 0.55; b.vx *= 0.90; b.vy *= 0.90; }
      else if(z.t === 'wind'){ b.vx += z.ax; }
      else if(z.t === 'conveyor'){ b.vx += z.ax; b.vy += z.ay || 0; }
      else if(z.t === 'ice'){ b.slip = 1; }
      else if(z.t === 'turn'){
        const rx = b.x-z.cx, ry = b.y-z.cy, d = Math.hypot(rx,ry);
        if(d < z.r){
          b.x += -z.om*ry*0.55; b.y += z.om*rx*0.55;   // 床に持っていかれる（摩擦では抵抗できない）
          if(d > 1){ b.x += rx/d*0.24; b.y += ry/d*0.24; }   // 遠心力で外へ
        }
      }
    }
  }
}
function checkHoles(b){
  if(b.z > 2 || b.state === 'fall' || b.done || b.out) return;
  for(const h of holes){
    if(b.x > h.x+4 && b.x < h.x+h.w-4 && b.y > h.y+4 && b.y < h.y+h.h-4){
      if(onFloor(b)) return;
      b.state = 'fall'; b.fallT = 0; sfx.fall();
      if(b.isPlayer) G.flash = 8;
      return;
    }
  }
}
function respawnRace(b){
  let cp = world.cps[0];
  for(const c of world.cps) if(c > b.y + 40) cp = c;   // 手前のチェックポイントへ
  b.state = 'run'; b.stun = 0; b.inv = 60; b.z = 0; b.vx = b.vy = b.vz = 0;
  b.x = clamp(b.x, 90, 710); b.y = cp; b.fallT = 0;
  burst(b.x, b.y, 10, 12, b.color, 3);
}

// ---------------------------------------------------------------- 進行管理
function eliminate(b){
  if(b.out) return;
  b.out = true; b.alive = false; b.state = 'fall';
  const remain = G.beans.filter(x=>!x.out && !x.done).length + 1;
  b.finalRank = remain;
  G.outOrder.push(b);
  if(b.isPlayer && !G.spectate){ sfx.out(); showBanner('ELIMINATED', '#ff5f6d'); G.loseT = 70; }
}
function finish(b){
  if(b.done) return;
  b.done = true; b.place = G.finishOrder.length + 1;
  b.finalRank = b.place;
  G.finishOrder.push(b);
  b.cheer = 1;
  confetti(b.x, b.y, 34); ring(b.x, b.y, '#ffd23f');
  if(b.isPlayer) qualifyFX('QUALIFIED!', b);
  else sfx.sparkle();
}
// プレイヤーが通過した瞬間の爽快演出
function qualifyFX(text, b){
  showBanner(text, '#3ddc84');
  sfx.qual();
  G.slow = 46; G.flash = 16; G.shake = 6; G.cheer = 1;
  if(b){ ring(b.x, b.y, '#fff'); ring(b.x, b.y, '#ffd23f'); confetti(b.x, b.y, 70); }
  rainConfetti(70);
}
// ラウンド終了時の祝勝演出
function celebrateRound(){
  G.cheer = 1; rainConfetti(90); sfx.fanfare();
  for(const b of G.beans) if(!b.out){ b.cheer = 1; ring(b.x, b.y, '#ffd23f'); }
}

let bannerT = 0;
function showBanner(text, color){
  const el = document.getElementById('banner');
  el.textContent = text; el.style.color = color || '#fff'; el.style.opacity = 1;
  el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
  bannerT = 135;
}

function startGame(){
  G.beans = [];
  const pIdx = irnd(0, START_BEANS-1);
  for(let i=0;i<START_BEANS;i++){
    const b = makeBean(i, i === pIdx);
    if(b.isPlayer){ b.skill = 1.0; G.player = b; }
    G.beans.push(b);
  }
  G.roundIdx = 0; G.spectate = false; G.winner = null; G.practice = false; G.variantKey = null;
  startRound(0);
}
function startRound(idx){
  hideLosePanel(); G.loseT = 0;
  G.roundIdx = idx;
  const base = ROUNDS[idx];
  let v = null;
  if(base.variants){
    if(G.variantKey) v = base.variants.filter(x=> x.key === G.variantKey)[0];
    if(!v) v = pick(base.variants);                 // トーナメントでは毎回ランダム
  }
  const R = Object.assign({}, base, v || {});
  if(R.rule) R.rule = R.rule.replace('{Q}', R.qualify);
  G.round = R;
  G.stage = STAGES[R.stage];
  G.mode = R.stage;
  G.finishOrder = []; G.outOrder = [];
  G.timeLeft = R.time*60; G.elapsed = 0; G.rt = 0; G.endT = 0; G.freeze = CD_ALL; G.winner = null;
  G.slow = 0; G.cheer = 0; rings = [];
  for(const b of G.beans) b.cheer = 0;
  for(const b of G.beans){ b.out = false; b.done = false; b.place = 0; b.alive = true; }
  G.stage.build();
  G.phase = 'intro';
  showIntro(G.round);
}
function endRound(){
  hideLosePanel(); G.loseT = 0;
  G.phase = 'result';
  const R = G.round;
  let qualified, eliminated;
  if(G.stage.goal === 'first'){
    qualified = G.finishOrder.slice(0, R.qualify);
    // 時間切れで完走者が足りないときは先頭から繰り上げ
    if(qualified.length < R.qualify){
      const rest = G.beans.filter(b=> qualified.indexOf(b) < 0).sort((a,b)=> a.y - b.y);
      while(qualified.length < R.qualify && rest.length) qualified.push(rest.shift());
    }
    eliminated = G.beans.filter(b=> qualified.indexOf(b) < 0);
    // 未通過の順位付け（残り距離順）
    eliminated.sort((a,b)=> b.y - a.y);
    eliminated.forEach((b,i)=>{ if(!b.finalRank || b.done) b.finalRank = qualified.length + i + 1; });
  } else if(G.stage.goal === 'survive'){
    qualified = G.beans.filter(b=>!b.out);
    eliminated = G.beans.filter(b=>b.out);
    if(qualified.length === 0){                       // 全滅時は最後に落ちた2人を復活
      qualified = G.outOrder.slice(-2);
      eliminated = G.beans.filter(b=> qualified.indexOf(b) < 0);
    }
  } else {
    qualified = G.winner ? [G.winner] : [];
    eliminated = G.beans.filter(b=> b !== G.winner);
  }
  showResult(qualified, eliminated);
}

// ---------------------------------------------------------------- 更新
function updateRace(){
  updateGimmicks();
  if(G.stage.goal === 'crown' && G.freeze <= 0 && !G.winner){
    crown.t++;
    crown.z = 62 + Math.sin(crown.t*0.040)*30;      // 上下に動く王冠（低い時が狙い目）
  }
  for(const o of obstacles){ o.up(); }
  cols.length = 0; for(const o of obstacles) o.col(cols);

  let leadY = world.startY;
  for(const b of G.beans){ const v = b.done ? world.goalY : b.y; if(v < leadY) leadY = v; }

  for(const b of G.beans){
    if(b.out) continue;
    if(b.done){
      // ゴール後は惰性で走り抜けて、その場で喜ぶ
      b.y += Math.min(0, b.vy); b.vy *= 0.94; b.x += b.vx; b.vx *= 0.94;
      b.anim += 0.3;
      b.z += b.vz; b.vz -= GRAV;
      if(b.z <= 0){ b.z = 0; b.vz = 0; if(Math.random() < 0.045) b.vz = 4.8; }
      continue;
    }
    if(b.state === 'fall'){
      updateBean(b, null);
      if(b.fallT > 34) respawnRace(b);
      continue;
    }
    let cmd;
    if(b.isPlayer && !G.spectate) cmd = playerCmd(b);
    else {
      cmd = G.stage.ai(b);
      // 軽いラバーバンド（gap>0 なら先頭より遅れている）
      const gap = b.y - leadY;
      b.skillBoost = gap > 620 ? 1.05 : (gap < 120 ? 0.97 : 1);
    }
    const base = b.skill;
    if(b.skillBoost) b.skill = base * b.skillBoost;
    updateBean(b, cmd);
    b.skill = base;

    applyZones(b);
    if(b.z <= 0.02 && b.state !== 'fall'){          // 動く床に乗って運ばれる（移動前の位置で判定）
      for(const pl of plats){
        const px = (pl.prev !== undefined) ? pl.prev : pl.x;
        if(b.x > px-2 && b.x < px+pl.w+2 && b.y > pl.y-2 && b.y < pl.y+pl.h+2){ b.x += pl.vx; break; }
      }
    }
    if(G.freeze <= 0){
      checkPads(b);
      for(const c of cols) collideBean(b, c);
    }
    // 壁
    if(b.x < BEAN_R){ b.x = BEAN_R; if(b.vx<0) b.vx *= -0.3; }
    if(b.x > world.w-BEAN_R){ b.x = world.w-BEAN_R; if(b.vx>0) b.vx *= -0.3; }
    if(b.y > -20){ b.y = -20; if(b.vy>0) b.vy = 0; }
    checkHoles(b);
    if(G.stage.goal === 'crown'){
      if(!G.winner && b.state !== 'fall' && b.state !== 'tumble' && b.stun <= 0){
        const cd = Math.hypot(b.x-crown.x, b.y-crown.y);
        if(cd < 34 && b.z + BEAN_H >= crown.z && b.z > 6) crownGrab(b);
      }
      if(b.y < world.goalY - 40){ b.y = world.goalY - 40; if(b.vy < 0) b.vy = 0; }
    }
    else if(b.y < world.goalY) finish(b);
  }
  beanVsBean();

  // カメラ（プレイヤーを画面下寄りに置き、進行方向＝上を広く見せる）
  const tgt = camTarget();
  const want = clamp(tgt.y - 420, world.camMin, world.camMax);
  cam.y += (want - cam.y) * 0.12;

  // 終了判定
  const R = G.round;
  if(G.endT > 0){ if(--G.endT === 0) endRound(); }
  else if(G.stage.goal === 'crown'){
    if(G.timeLeft <= 0){ G.endT = 120; showBanner('TIME UP', '#ffd23f'); }
  }
  else if(G.finishOrder.length >= R.qualify){
    G.endT = 130;
    const me = G.player;
    if(me && !me.done && !G.spectate){ sfx.out(); showBanner('ELIMINATED', '#ff5f6d'); G.loseT = 70; }
    else showBanner('RACE OVER', '#ffd23f');
    celebrateRound();
  }
  else if(G.timeLeft <= 0){ G.endT = 1; }
}

function updateJump(){
  // 難度上昇（カウントダウン中は進まない）
  const t = G.rt;
  arena.r = arena.r0 - clamp((t-1500)/2400, 0, 1) * 88;
  const spd = 1 + clamp(t/3300, 0, 1) * 0.95;
  obstacles[0].om =  0.0105 * spd;
  obstacles[1].om = -0.0088 * spd;
  if(t === 1700){ obstacles.push(RotBar(arena.cx, arena.cy, 560, 0.0140, false, {a:1.0})); showBanner('BAR ADD!', '#ffd23f'); }
  if(t === 3000){ showBanner('SPEED UP!', '#ffd23f'); }

  // カウントダウン中と決着後はバーを止め、当たり判定も切る
  const live = (G.freeze <= 0 && G.endT <= 0);
  if(live){ for(const o of obstacles) o.up(); }
  for(const o of obstacles) if(o.kind === 'rotbar'){ o.cx = arena.cx; o.cy = arena.cy; }
  cols.length = 0; for(const o of obstacles) o.col(cols);

  for(const b of G.beans){
    if(b.out && b.state !== 'fall') continue;
    if(b.state === 'fall'){
      updateBean(b, null);
      if(b.fallT > 40 && !b.out) eliminate(b);
      continue;
    }
    const cmd = cmdFor(b);
    updateBean(b, cmd);
    if(live){
      for(const c of cols) collideBean(b, c);
      const d = Math.hypot(b.x-arena.cx, b.y-arena.cy);
      if(d > arena.r && b.z <= 0.5){
        b.state = 'fall'; b.fallT = 0; sfx.fall();
        if(b.isPlayer) G.flash = 8;
      }
    }
  }
  beanVsBean();

  const R = G.round;
  const alive = G.beans.filter(b=> !b.out && b.state !== 'fall').length;   // 落下中は生存に数えない
  if(G.endT > 0){ if(--G.endT === 0) endRound(); }
  else if(alive <= R.qualify){ G.endT = 130; showBanner('SURVIVED!', '#3ddc84'); celebrateRound(); }
  else if(G.timeLeft <= 0){ G.endT = 130; showBanner('TIME UP', '#ffd23f'); celebrateRound(); }
}

function camTarget(){
  const p = G.player;
  if(p && !p.out && !G.spectate) return p;
  let best = null, by = 1e9;                       // レースは y が小さいほど先頭
  for(const b of G.beans){ if(b.out) continue; const v = b.done ? world.goalY-400 : b.y; if(v < by){ by = v; best = b; } }
  return best || p || {x:400, y:world.startY};
}

// ---------------------------------------------------------------- 描画
function drawRaceFloor(){
  const y0 = Math.floor(cam.y/80)*80 - 80, y1 = cam.y + VH + 80;
  // 背景（コース外）
  ctx.fillStyle = '#5f3fb8';
  ctx.fillRect(0,0,VW,VH);
  ctx.save();
  // 床
  for(let y=y0; y<y1; y+=80){
    for(let x=0; x<world.w; x+=80){
      const odd = ((x/80) + Math.floor(y/80)) % 2 === 0;
      ctx.fillStyle = odd ? '#ffe9f4' : '#ffd4ea';
      ctx.fillRect(x-cam.x, y-cam.y, 80, 80);
    }
  }
  // サイド壁
  ctx.fillStyle = '#7a4dff';
  ctx.fillRect(0-cam.x-26, y0-cam.y, 26, y1-y0);
  ctx.fillRect(world.w-cam.x, y0-cam.y, 26, y1-y0);
  ctx.fillStyle = 'rgba(255,255,255,.35)';
  for(let y=y0; y<y1; y+=60){
    ctx.fillRect(0-cam.x-26, y-cam.y, 26, 26);
    ctx.fillRect(world.w-cam.x, y-cam.y+30, 26, 26);
  }
  // チェックポイント
  ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 5; ctx.setLineDash([16,14]);
  for(const c of world.cps){
    if(c < y0 || c > y1) continue;
    ctx.beginPath(); ctx.moveTo(0-cam.x, c-cam.y); ctx.lineTo(world.w-cam.x, c-cam.y); ctx.stroke();
  }
  ctx.setLineDash([]);
  // スタートライン
  if(-340 > y0 && -340 < y1){
    ctx.fillStyle = '#fff';
    for(let x=0;x<world.w;x+=40) ctx.fillRect(x-cam.x, -344-cam.y, 20, 10);
  }
  // ゾーン
  for(const z of zones){
    if(z.y+z.h < y0 || z.y > y1) continue;
    if(z.t === 'slime'){
      ctx.fillStyle = 'rgba(61,220,132,.55)';
      ctx.fillRect(z.x-cam.x, z.y-cam.y, z.w, z.h);
      ctx.fillStyle = 'rgba(255,255,255,.35)';
      for(let i=0;i<14;i++){
        const bx = z.x + ((i*97)%z.w), by = z.y + 18 + ((i*53)%(z.h-30));
        const r = 5 + (i%3)*3 + Math.sin(G.elapsed*0.06+i)*2;
        ctx.beginPath(); ctx.arc(bx-cam.x, by-cam.y, r, 0, TAU); ctx.fill();
      }
    } else if(z.t === 'wind'){
      ctx.fillStyle = 'rgba(95,201,255,.35)';
      ctx.fillRect(z.x-cam.x, z.y-cam.y, z.w, z.h);
      ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 4; ctx.lineCap='round';
      for(let i=0;i<9;i++){
        const yy = z.y + 18 + i*18, off = (G.elapsed*3 + i*90) % (z.w+120) - 60;
        ctx.beginPath(); ctx.moveTo(off-cam.x, yy-cam.y); ctx.lineTo(off+52-cam.x, yy-cam.y); ctx.stroke();
      }
      ctx.lineCap='butt';
    } else if(z.t === 'conveyor'){
      ctx.fillStyle = '#6b5aa8'; ctx.fillRect(z.x-cam.x, z.y-cam.y, z.w, z.h);
      ctx.fillStyle = 'rgba(255,255,255,.16)';
      ctx.fillRect(z.x-cam.x, z.y-cam.y, z.w, 8);
      ctx.fillRect(z.x-cam.x, z.y+z.h-8-cam.y, z.w, 8);
      const dir = z.ax >= 0 ? 1 : -1, sp = (G.rt*2.4*dir) % 60;
      ctx.save();
      ctx.beginPath(); ctx.rect(z.x-cam.x, z.y-cam.y, z.w, z.h); ctx.clip();
      ctx.fillStyle = '#ffd23f';
      for(let yy = z.y+22; yy < z.y+z.h-10; yy += 30){
        for(let k=-1; k<z.w/60+1; k++){
          const x = z.x + k*60 + sp;
          ctx.save(); ctx.translate(x-cam.x, yy-cam.y); ctx.scale(dir,1);
          ctx.beginPath(); ctx.moveTo(-9,-9); ctx.lineTo(7,0); ctx.lineTo(-9,9); ctx.lineTo(-4,0);
          ctx.closePath(); ctx.fill(); ctx.restore();
        }
      }
      ctx.restore();
    } else if(z.t === 'ice'){
      ctx.fillStyle = 'rgba(190,235,255,.85)'; ctx.fillRect(z.x-cam.x, z.y-cam.y, z.w, z.h);
      ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 3;
      for(let i=0;i<10;i++){
        const bx = z.x + ((i*137)%z.w), by = z.y + 20 + ((i*71)%(z.h-40));
        ctx.beginPath(); ctx.moveTo(bx-cam.x, by-cam.y); ctx.lineTo(bx+34-cam.x, by+16-cam.y); ctx.stroke();
      }
      ctx.strokeStyle = 'rgba(120,190,230,.7)'; ctx.lineWidth = 5;
      ctx.strokeRect(z.x-cam.x+2, z.y-cam.y+2, z.w-4, z.h-4);
    }
  }
  // 穴
  for(const h of holes){
    if(h.y+h.h < y0 || h.y > y1) continue;
    ctx.fillStyle = 'rgba(40,15,80,.35)';
    roundRect(h.x-cam.x-4, h.y-cam.y-4, h.w+8, h.h+8, 18); ctx.fill();
    const g = ctx.createLinearGradient(0, h.y-cam.y, 0, h.y+h.h-cam.y);
    g.addColorStop(0,'#3a1a6e'); g.addColorStop(1,'#150835');
    ctx.fillStyle = g; roundRect(h.x-cam.x, h.y-cam.y, h.w, h.h, 14); ctx.fill();
  }
  // 消える床
  for(const t of tiles){
    if(t.y+t.h < y0 || t.y > y1 || !t.on) continue;
    const blink = t.warn && Math.floor(G.rt/4)%2 === 0;
    const tx = t.x-cam.x+5, ty = t.y-cam.y+5, tw = t.w-10, th = t.h-10;
    ctx.fillStyle = 'rgba(0,0,0,.28)';
    roundRect(tx, ty+7, tw, th, 12); ctx.fill();
    ctx.fillStyle = blink ? '#ffffff' : t.col;
    roundRect(tx, ty, tw, th, 12); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.4)';
    roundRect(tx+10, ty+8, tw-20, 12, 6); ctx.fill();
    if(t.warn){
      ctx.strokeStyle = 'rgba(255,60,90,.9)'; ctx.lineWidth = 4;
      roundRect(tx+3, ty+3, tw-6, th-6, 10); ctx.stroke();
    }
  }
  // 動く床
  for(const pl of plats){
    if(pl.y+pl.h < y0 || pl.y > y1) continue;
    ctx.fillStyle = 'rgba(0,0,0,.30)';
    roundRect(pl.x-cam.x, pl.y-cam.y+9, pl.w, pl.h, 14); ctx.fill();
    ctx.fillStyle = '#ff9f5a';
    roundRect(pl.x-cam.x, pl.y-cam.y, pl.w, pl.h, 14); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.45)';
    roundRect(pl.x-cam.x+12, pl.y-cam.y+10, pl.w-24, 14, 7); ctx.fill();
    ctx.fillStyle = 'rgba(58,37,96,.35)';
    for(let k=0;k<pl.w-30;k+=44) roundRect(pl.x-cam.x+16+k, pl.y+pl.h-22-cam.y, 26, 10, 5), ctx.fill();
  }
  // 回転床（穴の上に浮かぶ足場なので穴より後に描く）
  for(const z of zones){
    if(z.t !== 'turn') continue;
    if(z.cy+z.r < y0 || z.cy-z.r > y1) continue;
    const cx = z.cx-cam.x, cy = z.cy-cam.y;
    ctx.save();
    ctx.globalAlpha = .35; ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(cx, cy+9, z.r, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.translate(cx, cy);
    ctx.beginPath(); ctx.arc(0,0,z.r,0,TAU); ctx.fillStyle='#8f6fe8'; ctx.fill();
    ctx.beginPath(); ctx.arc(0,0,z.r-9,0,TAU); ctx.fillStyle='#b79bff'; ctx.fill();
    ctx.save();
    ctx.rotate(G.rt*z.om);
    ctx.fillStyle='rgba(255,255,255,.5)';
    for(let k=0;k<6;k++){
      ctx.save(); ctx.rotate(k*TAU/6);
      roundRect(20, -10, z.r-34, 20, 10); ctx.fill();
      // 回転方向の矢羽根
      ctx.beginPath();
      const e = z.r-16, sgn = z.om>0 ? 1 : -1;
      ctx.moveTo(e-16, -10*sgn); ctx.lineTo(e, 0); ctx.lineTo(e-16, 10*sgn);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    ctx.restore();
    ctx.beginPath(); ctx.arc(0,0,17,0,TAU); ctx.fillStyle='#fff'; ctx.fill();
    ctx.beginPath(); ctx.arc(0,0,8,0,TAU); ctx.fillStyle='#8f6fe8'; ctx.fill();
    ctx.restore();
  }
  // ジャンプ台（トランポリン帯）
  for(const pd of pads){
    if(pd.y+pd.h < y0-60 || pd.y > y1+60) continue;
    const sq = pd.t>0 ? 1 + Math.sin(pd.t/16*Math.PI)*0.22 : 1;
    const px = pd.x-cam.x, py = pd.y-cam.y;
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,.25)'; roundRect(px, py+8, pd.w, pd.h, 18); ctx.fill();
    ctx.fillStyle = '#2ec27e'; roundRect(px, py, pd.w, pd.h, 18); ctx.fill();
    ctx.fillStyle = '#7ee08a'; roundRect(px+8, py+5, pd.w-16, pd.h-12, 14); ctx.fill();
    ctx.strokeStyle='#fff'; ctx.lineWidth=5; ctx.lineCap='round';
    for(let x=44; x<pd.w-20; x+=96){
      const cy = py + pd.h/2, w = 15*sq;
      ctx.beginPath(); ctx.moveTo(px+x-w, cy+8); ctx.lineTo(px+x, cy-9); ctx.lineTo(px+x+w, cy+8); ctx.stroke();
    }
    ctx.lineCap='butt';
    ctx.restore();
  }
  // ゴール
  const gy = world.goalY;
  if(gy > y0-300 && gy < y1+300){
    for(let x=0;x<world.w;x+=40){
      for(let k=0;k<2;k++){
        ctx.fillStyle = ((x/40)+k)%2 ? '#fff' : '#3a2560';
        ctx.fillRect(x-cam.x, gy-20-cam.y+k*20, 40, 20);
      }
    }
    if(G.stage.goal !== 'crown'){          // 王冠ステージは台座と王冠が主役なので文字は出さない
      ctx.fillStyle = '#ffd23f'; ctx.font = '900 42px sans-serif'; ctx.textAlign='center';
      ctx.fillText('GOAL', 400-cam.x, gy-52-cam.y);
      ctx.textAlign='left';
    }
  }
  ctx.restore();
}

function drawArenaFloor(){
  ctx.fillStyle = '#4a2a9e';
  ctx.fillRect(0,0,VW,VH);
  // 奥の雲
  ctx.fillStyle = 'rgba(255,255,255,.10)';
  for(let i=0;i<7;i++){
    const x = (i*173 + G.elapsed*0.25) % (VW+200) - 100, y = 60 + (i*97)%520;
    ctx.beginPath(); ctx.ellipse(x, y, 70, 26, 0, 0, TAU); ctx.fill();
  }
  const a = arena;
  ctx.save();
  ctx.globalAlpha = .3; ctx.fillStyle = '#1b0d3d';
  ctx.beginPath(); ctx.arc(a.cx, a.cy+16, a.r+12, 0, TAU); ctx.fill();
  ctx.globalAlpha = 1;
  // 縁
  ctx.beginPath(); ctx.arc(a.cx, a.cy, a.r+10, 0, TAU);
  ctx.fillStyle = '#ff5fa2'; ctx.fill();
  // 天板
  ctx.save();
  ctx.beginPath(); ctx.arc(a.cx, a.cy, a.r, 0, TAU); ctx.clip();
  ctx.fillStyle = '#ffe9f4'; ctx.fillRect(a.cx-a.r, a.cy-a.r, a.r*2, a.r*2);
  for(let y=-a.r; y<a.r; y+=56){
    for(let x=-a.r; x<a.r; x+=56){
      if((Math.round(x/56)+Math.round(y/56))%2 === 0){
        ctx.fillStyle = '#ffd4ea'; ctx.fillRect(a.cx+x, a.cy+y, 56, 56);
      }
    }
  }
  // 中心マーク
  ctx.strokeStyle = 'rgba(122,77,255,.25)'; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.arc(a.cx, a.cy, a.r*0.55, 0, TAU); ctx.stroke();
  ctx.restore();
  ctx.restore();
}

function drawCrown(){
  const sx = crown.x - cam.x, sy = crown.y - cam.y;
  ctx.save();
  // 台座
  ctx.globalAlpha = .3; ctx.fillStyle='#000';
  ctx.beginPath(); ctx.ellipse(sx, sy+12, 62, 26, 0,0,TAU); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#c48b00';
  ctx.beginPath(); ctx.ellipse(sx, sy+4, 58, 24, 0,0,TAU); ctx.fill();
  ctx.fillStyle = '#ffd23f';
  ctx.beginPath(); ctx.ellipse(sx, sy-2, 58, 24, 0,0,TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.45)';
  ctx.beginPath(); ctx.ellipse(sx, sy-6, 34, 12, 0,0,TAU); ctx.fill();

  const y = sy - crown.z;
  const reach = crown.z <= 80;
  ctx.strokeStyle = reach ? 'rgba(61,220,132,.95)' : 'rgba(255,255,255,.45)';
  ctx.lineWidth = 4; ctx.setLineDash([5,7]);
  ctx.beginPath(); ctx.moveTo(sx, sy-6); ctx.lineTo(sx, y+16); ctx.stroke(); ctx.setLineDash([]);
  const g = ctx.createRadialGradient(sx, y, 4, sx, y, 52);
  g.addColorStop(0, reach ? 'rgba(120,255,180,.75)' : 'rgba(255,220,90,.6)');
  g.addColorStop(1,'rgba(255,220,90,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(sx,y,52,0,TAU); ctx.fill();
  ctx.translate(sx, y); ctx.scale(1+Math.sin(crown.t*0.08)*0.05, 1);
  ctx.fillStyle = '#ffd23f'; ctx.strokeStyle='#c48b00'; ctx.lineWidth=3;
  ctx.beginPath();
  ctx.moveTo(-19, 11); ctx.lineTo(-22,-13); ctx.lineTo(-9,-2); ctx.lineTo(0,-20);
  ctx.lineTo(9,-2); ctx.lineTo(22,-13); ctx.lineTo(19,11);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.arc(0,-1,3.6,0,TAU); ctx.fill();
  ctx.restore();
}

function drawBean(b){
  if(G.stage && G.stage.kind === 'hex'){
    if(b.state === 'drop') return drawHexDrop(b);
    if(b.layer !== viewLayer()) return;
  }
  const sx = b.x - cam.x, sy = b.y - cam.y;
  if(sx < -70 || sx > VW+70 || sy < -110 || sy > VH+110) return;
  const z = Math.max(b.z, 0);
  const falling = b.state === 'fall';
  const k = falling ? Math.max(0, 1 - b.fallT/38) : 1;

  if(!falling){
    ctx.save();
    ctx.globalAlpha = clamp(0.30 - z*0.0022, 0.05, 0.30);
    ctx.fillStyle = '#000';
    const s = 1 - clamp(z,0,150)/300;
    ctx.beginPath(); ctx.ellipse(sx, sy+5, 15*s, 7.5*s, 0, 0, TAU); ctx.fill();
    ctx.restore();
  }

  if(b.isPlayer && !falling && z > 10){          // 高さが分かるガイド
    ctx.save();
    ctx.strokeStyle = 'rgba(255,45,135,.45)'; ctx.lineWidth = 3; ctx.setLineDash([4,6]);
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx, sy - z + 12); ctx.stroke();
    ctx.setLineDash([]); ctx.restore();
  }

  ctx.save();
  ctx.translate(sx, sy - z);
  if(falling){ ctx.scale(k,k); ctx.globalAlpha = k; ctx.rotate(b.fallT*0.12); }
  if(b.state === 'tumble') ctx.rotate(b.spin);

  let rx = 15, ry = 17, lean = 0;
  if(b.state === 'dive' || b.state === 'prone'){
    ctx.rotate(b.face - Math.PI/2);
    rx = 13; ry = 21;
  } else {
    const sp = Math.hypot(b.vx,b.vy);
    lean = clamp(sp*0.05, 0, 0.3) * (b.vx>0?1:-1);
    ctx.rotate(lean*0.5);
    if(b.z > 1){ rx = 14; ry = 19; }
  }
  const legSwing = Math.sin(b.anim) * (b.state==='run' ? 5 : 0);
  // 脚
  ctx.fillStyle = '#ffd9a8';
  roundRect(-8, ry-6 + legSwing*0.4, 7, 12, 3.5); ctx.fill();
  roundRect(1, ry-6 - legSwing*0.4, 7, 12, 3.5); ctx.fill();
  // 腕
  ctx.fillStyle = b.color;
  ctx.save(); ctx.rotate(-legSwing*0.05);
  ctx.beginPath(); ctx.ellipse(-rx-1, 1, 5, 8, -0.3, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse( rx+1, 1, 5, 8,  0.3, 0, TAU); ctx.fill();
  ctx.restore();
  // 胴
  ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, 0, TAU);
  ctx.fillStyle = b.color; ctx.fill();
  ctx.lineWidth = 2.5; ctx.strokeStyle = 'rgba(0,0,0,.16)'; ctx.stroke();
  // 衣装ライン
  ctx.save();
  ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, 0, TAU); ctx.clip();
  ctx.fillStyle = b.isPlayer ? '#ff2d87' : 'rgba(255,255,255,.35)';
  ctx.fillRect(-rx, ry*0.25, rx*2, ry);
  ctx.fillStyle = 'rgba(255,255,255,.35)';
  ctx.beginPath(); ctx.ellipse(-rx*0.35, -ry*0.45, rx*0.4, ry*0.25, -0.5, 0, TAU); ctx.fill();
  ctx.restore();
  // 顔
  const stunned = b.stun > 0 || b.state === 'tumble';
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.ellipse(-5.6, -4, 4.2, 5, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse( 5.6, -4, 4.2, 5, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#2b1d47';
  if(stunned){
    ctx.lineWidth = 2; ctx.strokeStyle = '#2b1d47';
    ctx.beginPath(); ctx.moveTo(-8,-6.5); ctx.lineTo(-3,-1.5); ctx.moveTo(-3,-6.5); ctx.lineTo(-8,-1.5);
    ctx.moveTo(3,-6.5); ctx.lineTo(8,-1.5); ctx.moveTo(8,-6.5); ctx.lineTo(3,-1.5); ctx.stroke();
  } else {
    const ex = clamp(b.vx*0.4,-1.6,1.6), ey = clamp(b.vy*0.4,-1.4,1.4);
    ctx.beginPath(); ctx.arc(-5.6+ex, -4+ey, 2.3, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc( 5.6+ex, -4+ey, 2.3, 0, TAU); ctx.fill();
  }
  ctx.strokeStyle = '#2b1d47'; ctx.lineWidth = 1.6;
  ctx.beginPath();
  if(b.z > 6 || b.state==='dive') ctx.arc(0, 4.5, 3, 0.1*Math.PI, 0.9*Math.PI);
  else ctx.arc(0, 3, 3.4, 0.15*Math.PI, 0.85*Math.PI);
  ctx.stroke();

  if(b === G.winner){
    ctx.fillStyle='#ffd23f'; ctx.strokeStyle='#c48b00'; ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(-11,-ry-4); ctx.lineTo(-13,-ry-16); ctx.lineTo(-5,-ry-9); ctx.lineTo(0,-ry-19);
    ctx.lineTo(5,-ry-9); ctx.lineTo(13,-ry-16); ctx.lineTo(11,-ry-4);
    ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  ctx.restore();

  // プレイヤーマーカー
  if(b.isPlayer && !falling){
    const by = sy - z - 34 - Math.abs(Math.sin(G.elapsed*0.08))*4;
    ctx.save();
    ctx.fillStyle = '#ffd23f'; ctx.strokeStyle='#8a5a00'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(sx-9, by-10); ctx.lineTo(sx+9, by-10); ctx.lineTo(sx, by); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.font = '900 12px sans-serif'; ctx.textAlign='center';
    ctx.lineWidth = 3.5; ctx.strokeStyle='rgba(0,0,0,.55)';
    ctx.strokeText('YOU', sx, by-14); ctx.fillStyle='#fff'; ctx.fillText('YOU', sx, by-14);
    ctx.textAlign='left';
    ctx.restore();
  }
  if(b.inv > 40 && !falling && Math.floor(G.elapsed/4)%2===0){
    ctx.save(); ctx.globalAlpha=.35; ctx.strokeStyle='#fff'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(sx, sy-z, 24, 0, TAU); ctx.stroke(); ctx.restore();
  }
}

// 下の層へ落ちていく演出
function drawHexDrop(b){
  const k = b.dropT/26;
  ctx.save();
  ctx.globalAlpha = 0.25 + 0.5*k;
  ctx.translate(b.x, b.y + (1-k)*26);
  ctx.scale(0.45+0.5*k, 0.45+0.5*k);
  ctx.fillStyle = b.isPlayer ? '#ffffff' : b.color;
  ctx.beginPath(); ctx.ellipse(0, 0, 15, 17, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.2)'; ctx.lineWidth = 2.5; ctx.stroke();
  ctx.restore();
}
function drawParts(){
  for(const p of parts){
    const sx = p.x-cam.x, sy = p.y-cam.y-p.z;
    ctx.save(); ctx.translate(sx,sy); ctx.rotate(p.rot);
    ctx.globalAlpha = clamp(p.life/26,0,1);
    ctx.fillStyle = p.c;
    ctx.fillRect(-p.r/2, -p.r/2, p.r, p.r*1.5);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

function drawProgress(){
  const x = VW-30, y0 = 96, y1 = 556;
  ctx.save();
  ctx.fillStyle = 'rgba(40,20,80,.55)';
  roundRect(x-11, y0-14, 22, y1-y0+28, 11); ctx.fill();
  ctx.fillStyle = '#ffd23f';
  ctx.beginPath(); ctx.arc(x, y0-6, 5, 0, TAU); ctx.fill();   // 上＝ゴール
  const span = world.startY - world.goalY;
  for(const b of G.beans){
    if(b.out) continue;
    const t = clamp((world.startY - (b.done ? world.goalY : b.y))/span, 0, 1);
    const py = y1 - (y1-y0)*t;
    ctx.beginPath(); ctx.arc(x, py, b.isPlayer?7:4.5, 0, TAU);
    ctx.fillStyle = b.done ? '#3ddc84' : b.color; ctx.fill();
    if(b.isPlayer){ ctx.lineWidth=2.5; ctx.strokeStyle='#ff2d87'; ctx.stroke(); }
  }
  ctx.restore();
}

function drawCountdown(){
  if(G.freeze <= 0) return;
  let txt, age;
  if(G.freeze > CD_GO){
    const n = Math.ceil((G.freeze - CD_GO)/CD_NUM);
    txt = String(Math.min(3, n));
    age = (CD_NUM - ((G.freeze - CD_GO) % CD_NUM)) % CD_NUM;
  } else {
    txt = 'GO!'; age = CD_GO - G.freeze;
  }
  const pop = Math.max(0, 1 - age/16);
  const sc = 1 + pop*0.55;
  ctx.save();
  ctx.translate(VW/2, VH/2-40); ctx.scale(sc, sc);
  ctx.globalAlpha = 0.28*pop;
  ctx.beginPath(); ctx.arc(0,0,120,0,TAU); ctx.fillStyle = '#fff'; ctx.fill();
  ctx.globalAlpha = 1;
  ctx.font = '900 118px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.lineWidth = 14; ctx.strokeStyle='rgba(58,37,96,.9)'; ctx.strokeText(txt,0,0);
  ctx.fillStyle = txt==='GO!' ? '#3ddc84' : '#ffd23f'; ctx.fillText(txt,0,0);
  ctx.restore();
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';
}

function draw(){
  ctx.save();
  if(G.shake > 0){ ctx.translate(rnd(-G.shake,G.shake)*0.6, rnd(-G.shake,G.shake)*0.6); }

  // 低い障害物＝ビーンより先に描く（ジャンプで飛び越えたら上に見える）
  // 高い障害物＝ビーンより後に描く（下をくぐったら手前に見える）
  const low = [], high = [];
  for(const o of obstacles){ (o.high ? high : low).push(o); }

  G.stage.drawFloor();
  if(G.stage.kind === 'race'){
    low.sort((a,b)=> (a.y||a.cy||0)-(b.y||b.cy||0));
    for(const o of low) if(o.kind !== 'fruitlane') o.draw();
    for(const o of low) if(o.kind === 'fruitlane') o.draw();
  } else {
    for(const o of low) o.draw();
  }

  drawRings();
  const sorted = G.beans.slice().sort((a,b)=> a.y - b.y);
  for(const b of sorted) drawBean(b);

  for(const o of high) o.draw();
  if(G.stage.goal === 'crown' && !G.winner) drawCrown();

  drawParts();
  ctx.restore();

  if(G.stage.kind === 'race') drawProgress();
  drawCountdown();

  if(G.flash > 0){
    ctx.fillStyle = 'rgba(255,255,255,'+(G.flash/22)+')';
    ctx.fillRect(0,0,VW,VH);
  }
  if(G.spectate){
    ctx.save();
    ctx.fillStyle='rgba(58,37,96,.75)'; roundRect(VW/2-72, 8, 144, 30, 15); ctx.fill();
    ctx.fillStyle='#fff'; ctx.font='900 15px sans-serif'; ctx.textAlign='center';
    ctx.fillText('観戦モード', VW/2, 28); ctx.textAlign='left';
    ctx.restore();
  }
}

const SELECT_LIST = [
  { k:'race' }, { k:'jump', v:'jumpclub' }, { k:'hex', v:'hexagone' }, { k:'floor', v:'floorout' }, { k:'gimmick' },
  { k:'roll', v:'sprint' }, { k:'roll', v:'attrition' }, { k:'final' }
];
function showStageSelect(){
  G.phase = 'title';
  let rows = '';
  for(const e of SELECT_LIST){
    const st = STAGES[e.k];
    const base = ROUNDS[roundIdxFor(e.k)];
    const va = e.v ? base.variants.filter(x=>x.key===e.v)[0] : null;
    const R = Object.assign({}, base, va || {});
    rows += '<button class="srow" data-k="'+e.k+'" data-v="'+(e.v||'')+'">'+
            '<span class="sic">'+st.icon+'</span>'+
            '<span class="stx"><b>'+(va ? st.label+'（'+va.badge+'）' : st.label)+'</b>'+
            '<small>'+(va ? va.short : st.blurb)+'</small></span>'+
            '<span class="snum">'+st.solo+'人 / '+R.time+'秒</span></button>';
  }
  openOv(
    '<div class="tag">STAGE SELECT</div>'+
    '<h1>ステージ選択</h1>'+
    '<p>好きなステージだけを単体でプレイできます。<br>トーナメントとは別扱いなので、何度でも練習できます。</p>'+
    '<div class="slist">'+rows+'</div>'+
    '<button class="btn sub" id="sBack">タイトルへ戻る</button>'
  );
  card.querySelectorAll('.srow').forEach(el=>{
    el.onclick = ()=>{ ac(); closeOv(); startStage(el.dataset.k, el.dataset.v || null); };
  });
  document.getElementById('sBack').onclick = ()=>{ showTitle(); };
}
function roundIdxFor(key){
  return ROUNDS.findIndex(r=> r.stage === key ||
    (r.variants||[]).some(v=> (v.stage||r.stage) === key));
}
function startStage(key, variant){
  const idx = roundIdxFor(key);
  G.variantKey = variant || null;
  const n = STAGES[key].solo;
  G.beans = [];
  const pIdx = irnd(0, n-1);
  for(let i=0;i<n;i++){
    const b = makeBean(i, i === pIdx);
    if(b.isPlayer){ b.skill = 1.0; G.player = b; }
    G.beans.push(b);
  }
  G.practice = true; G.spectate = false; G.winner = null;
  startRound(idx);
}

function nameChip(b, cls){

function showPracticeResult(qualified, eliminated){
  const p = G.player, st = G.stage;

  let head = '<div class="tag">'+st.icon+' '+((G.round && G.round.badge) ? st.label+'（'+G.round.badge+'）' : st.label)+'</div>';
  if(st.goal === 'crown'){
    head += win ? '<h1>👑 王冠GET！</h1><p>見事に飛びついた！</p>'
                : '<h1>'+(G.winner ? '取られた…' : '時間切れ')+'</h1>'+
                  '<p>'+(G.winner ? '<b>'+G.winner.name+'</b> が王冠を掴んだ' : '誰も王冠に届かなかった')+'</p>';
  } else if(win){
    head += '<h1>CLEAR!</h1><p>'+
      (st.goal === 'first' ? (p.place ? '<b>'+p.place+'位</b>でゴール！' : '上位で通過！') : '最後まで生き残った！')+'</p>';

    head += '<h1>FAILED…</h1><p>'+

  let body = '<div class="sect">'+(st.goal==='first' ? 'ゴール' : '生き残り')+' '+qualified.length+'</div><div class="grid">';

    body += '<div class="sect">脱落 '+eliminated.length+'</div><div class="grid">';

function showResult(qualified, eliminated){
  if(G.practice) return showPracticeResult(qualified, eliminated);
  const p = G.player;
  const pQual = qualified.indexOf(p) >= 0;
  const R = G.round;
  const last = G.roundIdx >= ROUNDS.length-1;
  let head, body = '';
  if(last){
    if(G.winner === p) head = '<div class="tag">CHAMPION</div><h1>👑 優勝！！</h1><p>20人の頂点に立った！ 王冠はあなたのもの！</p>';
    else if(G.winner && G.spectate) head = '<div class="tag">FINAL</div><h1>優勝：'+G.winner.name+'</h1>'+
         '<p>あなたの最終順位は <b>'+(p.finalRank||START_BEANS)+' 位</b> / '+START_BEANS+'人中</p>';
    else if(G.winner) head = '<div class="tag">FINAL</div><h1>惜しい！</h1><p>優勝は <b>'+G.winner.name+'</b>。あと少しだった…</p>';
    else head = '<div class="tag">FINAL</div><h1>時間切れ</h1><p>誰も王冠を掴めなかった…</p>';
  } else if(G.spectate){
    head = '<div class="tag">'+R.name+' 結果</div><h1>'+R.title+'</h1>';
  } else if(pQual){
    head = '<div class="tag">'+R.name+' 結果</div><h1>QUALIFIED!</h1>'+
           '<p>'+(G.stage.goal==='first' ? (p.place ? '<b>'+p.place+'位</b>でゴール通過！' : '時間切れ・上位で繰り上げ通過！') : '生き残った！')+'</p>';
  } else {
    head = '<div class="tag">'+R.name+' 結果</div><h1>ELIMINATED…</h1>'+
           '<p>最終順位 <b>'+(p.finalRank||G.beans.length)+' 位</b> / '+START_BEANS+'人中</p>';
  }
  body += '<div class="sect">通過 '+qualified.length+'</div><div class="grid">';
  qualified.forEach(b=> body += nameChip(b,'q'));
  body += '</div>';
  if(eliminated.length){
    body += '<div class="sect">脱落 '+eliminated.length+'</div><div class="grid">';
    eliminated.forEach(b=> body += nameChip(b,'o'));
    body += '</div>';
  }
  let btns = '';
  if(last) btns = '<button class="btn" id="bAgain">もう一度あそぶ</button>';
  else if(pQual) btns = '<button class="btn" id="bNext">次のラウンドへ</button>';
  else btns = '<button class="btn" id="bNext">観戦を続ける</button>'+
              '<button class="btn sub" id="bAgain">もう一度あそぶ</button>';
  openOv(head + body + btns);
  const bn = document.getElementById('bNext'), ba = document.getElementById('bAgain');
  const go = ()=>{
    closeOv();
    G.beans = qualified.slice();
    if(G.beans.indexOf(G.player) < 0) G.spectate = true;
    startRound(G.roundIdx+1);
  };
  if(bn) bn.onclick = go;
  if(ba) ba.onclick = ()=>{ closeOv(); showTitle(); };
}

// ---------------------------------------------------------------- メインループ
let acc = 0, last = performance.now();
function tick(now){
  requestAnimationFrame(tick);
  let dt = now - last; last = now;
  if(dt > 200) dt = 200;
  acc += dt;
  const step = 1000/60;
  let guard = 0;
  while(acc >= step && guard < 4){
    acc -= step; guard++;
    step1();
  }
  render();
}
function step1(){
  if(G.slow > 0){ G.slow--; if(G.slow & 1) return; }   // 通過の瞬間だけスロー再生
  G.elapsed++;
  if(G.shake > 0) G.shake -= 0.7;
  if(G.flash > 0) G.flash--;
  if(bannerT > 0){ if(--bannerT === 0) document.getElementById('banner').style.opacity = 0; }
  if(G.loseT > 0 && --G.loseT === 0) showLosePanel();
  if(G.cheer && G.endT > 0 && G.elapsed % 3 === 0) rainConfetti(7);
  updateParts(); updateRings();

  if(G.phase !== 'play') return;

  if(G.freeze > 0){
    if(G.freeze > CD_GO && (G.freeze - CD_GO) % CD_NUM === 0) sfx.count();
    if(G.freeze === CD_GO) sfx.go();
    G.freeze--;
  } else if(G.endT === 0){
    G.timeLeft--; G.rt++;
  }
  G.stage.update();
  updateHUD();
}
function render(){
  ctx.clearRect(0,0,VW,VH);
  if(G.phase === 'title'){
    // タイトル背景
    ctx.fillStyle = '#5f3fb8'; ctx.fillRect(0,0,VW,VH);
    ctx.save();
    for(let i=0;i<26;i++){
      const x = (i*137 + G.elapsed*0.6) % (VW+120) - 60;
      const y = 90 + ((i*211)%460) + Math.sin(G.elapsed*0.02+i)*16;
      ctx.globalAlpha = .5;
      ctx.fillStyle = COLORS[i%COLORS.length];
      ctx.beginPath(); ctx.ellipse(x, y, 16, 19, Math.sin(G.elapsed*0.03+i)*0.2, 0, TAU); ctx.fill();
    }
    ctx.restore();
    return;
  }
  draw();
}
requestAnimationFrame(tick);
showTitle();
</script>

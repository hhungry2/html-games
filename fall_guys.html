<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TUMBLE PARTY - フォールガイズ風 バトルロイヤル</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root{
    --pink:#ff5fa2; --pink2:#ff9ecb; --purple:#7a4dff; --blue:#39c5ff;
    --gold:#ffd23f; --cream:#fff6e9; --dark:#3a2560; --green:#3ddc84;
  }
  html,body{
    width:100%; height:100%; overflow:hidden;
    background:
      radial-gradient(circle at 20% 15%, rgba(255,255,255,.30) 0 22%, transparent 23%),
      radial-gradient(circle at 82% 78%, rgba(255,255,255,.22) 0 18%, transparent 19%),
      linear-gradient(160deg,#8b5cff 0%, #ff69b4 55%, #ffb36b 100%);
    color:#fff;
    font-family:'Yu Gothic UI','Hiragino Kaku Gothic ProN',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    user-select:none; -webkit-user-select:none; touch-action:none;
  }
  #wrap{ position:relative; width:100vw; height:100vh; display:flex; align-items:center; justify-content:center; }
  canvas{ display:block; width:100%; height:100%; object-fit:contain; }

  /* ===== HUD ===== */
  #hud{ position:absolute; inset:0; pointer-events:none; z-index:10; padding:10px 12px; }
  .row{ display:flex; gap:8px; align-items:flex-start; justify-content:space-between; }
  .chip{
    background:rgba(58,37,96,.72); border:2px solid rgba(255,255,255,.35);
    border-radius:14px; padding:6px 12px; font-weight:800; letter-spacing:.04em;
    box-shadow:0 4px 0 rgba(0,0,0,.18); font-size:15px; white-space:nowrap;
  }
  .chip small{ display:block; font-size:10px; opacity:.75; font-weight:700; letter-spacing:.12em; }
  #cTime{ color:var(--gold); font-size:22px; text-align:center; min-width:96px; }
  #cQual{ color:#aef7c8; }
  #cRound{ color:#ffe6f3; }
  #banner{
    position:absolute; left:50%; top:34%; transform:translate(-50%,-50%) scale(1);
    font-size:64px; font-weight:900; text-align:center; letter-spacing:.06em;
    text-shadow:0 6px 0 rgba(0,0,0,.28), 0 0 26px rgba(255,255,255,.5);
    opacity:0; transition:opacity .18s;
  }

  /* ===== オーバーレイ ===== */
  #ov{ position:absolute; inset:0; z-index:20; display:flex; align-items:center; justify-content:center;
       background:rgba(38,20,70,.55); backdrop-filter:blur(3px); }
  #ov.hide{ display:none; }
  .card{
    width:min(680px,92vw); max-height:92vh; overflow:auto;
    background:linear-gradient(180deg,#fff 0%, #ffeef7 100%);
    color:var(--dark); border-radius:28px; padding:26px 28px 24px;
    box-shadow:0 14px 0 rgba(90,40,130,.45), 0 24px 60px rgba(0,0,0,.4);
    border:6px solid #fff; text-align:center;
  }
  .card h1{ font-size:38px; line-height:1.15; letter-spacing:.02em;
    background:linear-gradient(180deg,#ff4f9a,#7a4dff); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .card h2{ font-size:26px; margin-top:2px; color:#6b3fd4; }
  .card .tag{ display:inline-block; background:var(--gold); color:#6b3d00; font-weight:900;
    padding:4px 16px; border-radius:999px; font-size:14px; letter-spacing:.18em; margin-bottom:8px; }
  .card p{ font-size:15px; line-height:1.7; color:#5b4a7a; margin:10px 0; font-weight:600; }
  .keys{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin:12px 0 4px; }
  .key{ background:#fff; border:3px solid #e5d5f5; border-radius:12px; padding:8px 12px; font-size:13px;
        font-weight:800; color:#6b3fd4; box-shadow:0 3px 0 #e5d5f5; }
  .btn{
    pointer-events:auto; cursor:pointer; border:none; margin:12px 6px 0;
    background:linear-gradient(180deg,#ff77b3,#ff2d87); color:#fff; font-weight:900; font-size:19px;
    padding:14px 34px; border-radius:999px; box-shadow:0 6px 0 #c2005e; letter-spacing:.06em;
    transition:transform .08s, box-shadow .08s; font-family:inherit;
  }
  .btn:active{ transform:translateY(4px); box-shadow:0 2px 0 #c2005e; }
  .btn.sub{ background:linear-gradient(180deg,#9d8bff,#6b3fd4); box-shadow:0 6px 0 #40219a; font-size:16px; padding:12px 26px; }
  .grid{ display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-top:10px; }
  .nm{ font-size:13px; font-weight:800; padding:5px 10px; border-radius:999px; background:#eee6fb; color:#5b4a7a;
       display:flex; align-items:center; gap:6px; }
  .nm i{ width:11px; height:11px; border-radius:50%; display:inline-block; }
  .nm.q{ background:#d6ffe6; color:#12703f; }
  .nm.o{ background:#ffe0e6; color:#a3123c; text-decoration:line-through; opacity:.75; }
  .nm.me{ outline:3px solid var(--gold); }
  .sect{ font-size:12px; font-weight:900; letter-spacing:.2em; color:#a48fd0; margin-top:16px; }

  /* ===== タッチ操作 ===== */
  #touch{ position:absolute; inset:0; z-index:15; display:none; }
  #touch.on{ display:block; }
  #stickArea{ position:absolute; left:0; bottom:0; width:46%; height:62%; }
  #stick{ position:absolute; width:118px; height:118px; border-radius:50%; border:4px solid rgba(255,255,255,.5);
          background:rgba(58,37,96,.3); transform:translate(-50%,-50%); display:none; }
  #knob{ position:absolute; left:50%; top:50%; width:52px; height:52px; margin:-26px 0 0 -26px; border-radius:50%;
         background:rgba(255,255,255,.85); box-shadow:0 3px 10px rgba(0,0,0,.3); }
  #btns{ position:absolute; right:16px; bottom:24px; display:flex; gap:14px; align-items:flex-end; }
  .tb{ width:92px; height:92px; border-radius:50%; border:4px solid rgba(255,255,255,.6);
       background:rgba(255,45,135,.72); color:#fff; font-weight:900; font-size:16px; letter-spacing:.05em;
       display:flex; align-items:center; justify-content:center; box-shadow:0 6px 0 rgba(0,0,0,.25); font-family:inherit; }
  .tb.d{ background:rgba(122,77,255,.75); width:78px; height:78px; font-size:14px; }
  .tb:active{ transform:translateY(4px); box-shadow:0 2px 0 rgba(0,0,0,.25); }
  #sound{ position:absolute; right:12px; top:12px; z-index:16; pointer-events:auto; cursor:pointer;
    background:rgba(58,37,96,.72); border:2px solid rgba(255,255,255,.35); color:#fff; border-radius:12px;
    width:40px; height:36px; font-size:16px; font-family:inherit; }
  @media (max-width:640px){
    .card h1{ font-size:28px; } .card h2{ font-size:20px; } .card p{ font-size:13px; }
    #banner{ font-size:44px; }
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="960" height="640"></canvas>

  <div id="hud">
    <div class="row">
      <div class="chip" id="cRound"><small>ROUND</small><span id="rname">-</span></div>
      <div class="chip" id="cTime"><small>TIME</small><span id="rtime">0</span></div>
      <div class="chip" id="cQual"><small>QUALIFIED</small><span id="rqual">0 / 0</span></div>
    </div>
    <div id="banner"></div>
  </div>

  <button id="sound">🔊</button>

  <div id="touch">
    <div id="stickArea"><div id="stick"><div id="knob"></div></div></div>
    <div id="btns">
      <div class="tb d" id="bDive">DIVE</div>
      <div class="tb" id="bJump">JUMP</div>
    </div>
  </div>

  <div id="ov"><div class="card" id="card"></div></div>
</div>

<script>
'use strict';
// =====================================================================
//  TUMBLE PARTY  －  フォールガイズ風 2D バトルロイヤル（3D不使用）
//  ・トップビュー＋高さ(z)を持つ疑似立体判定
//  ・ROUND1 レース / ROUND2 サバイバル / FINAL 王冠争奪
// =====================================================================

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const VW = 960, VH = 640;
const TAU = Math.PI * 2;

const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
const rnd   = (a,b)=> a + Math.random()*(b-a);
const irnd  = (a,b)=> Math.floor(rnd(a,b+1));
const pick  = a => a[Math.floor(Math.random()*a.length)];
const lerp  = (a,b,t)=> a+(b-a)*t;

// ---------------------------------------------------------------- 効果音
let actx = null, muted = false;
function ac(){
  if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ actx = null; } }
  if(actx && actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(freq, dur, type, vol, to){
  const a = ac(); if(!a || muted) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(freq, a.currentTime);
  if(to) o.frequency.exponentialRampToValueAtTime(Math.max(45,to), a.currentTime+dur);
  g.gain.setValueAtTime(vol||0.08, a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime+dur);
  o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+dur+0.02);
}
function noise(dur, vol){
  const a = ac(); if(!a || muted) return;
  const len = Math.floor(a.sampleRate*dur);
  const buf = a.createBuffer(1, len, a.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i] = (Math.random()*2-1) * (1-i/len);
  const s = a.createBufferSource(); s.buffer = buf;
  const g = a.createGain(); g.gain.value = vol||0.08;
  const f = a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=1400;
  s.connect(f); f.connect(g); g.connect(a.destination); s.start();
}
const sfx = {
  jump(){ tone(430,0.11,'square',0.05,760); },
  dive(){ tone(300,0.16,'sawtooth',0.05,120); },
  land(){ noise(0.06,0.05); },
  hit(){ noise(0.18,0.10); tone(190,0.20,'sawtooth',0.06,70); },
  door(){ noise(0.22,0.12); tone(120,0.18,'square',0.05,60); },
  bump(){ tone(110,0.10,'square',0.05,80); },
  fall(){ tone(600,0.55,'sine',0.07,90); },
  count(){ tone(660,0.10,'square',0.07); },
  go(){ tone(880,0.28,'square',0.09,1320); },
  qual(){ [660,880,1046].forEach((f,i)=>setTimeout(()=>tone(f,0.16,'square',0.07),i*90)); },
  out(){ [440,330,220].forEach((f,i)=>setTimeout(()=>tone(f,0.22,'triangle',0.07),i*120)); },
  crown(){ [523,659,784,1046,1318].forEach((f,i)=>setTimeout(()=>tone(f,0.30,'square',0.08),i*110)); }
};

// ---------------------------------------------------------------- 物理定数
const ACC = 0.62, MAXSPD = 3.55, FRIC = 0.86, AIRFRIC = 0.978;
const GRAV = 0.42, JUMPV = 6.4;
const DIVE_SPD = 6.6, DIVE_VZ = 3.4;
const BEAN_R = 15, BEAN_H = 30;

const NAMES = ['ぷにお','もちこ','どんぐり','ぷりん','まめた','ころん','ぱんだ','ぴよ','てるてる','なめこ',
               'ぷくぷく','ぽんず','きなこ','ずんだ','おもち','ふわり','どてら','ちくわ','みたらし','あんこ'];
const COLORS= ['#ff7096','#5fc9ff','#ffd23f','#7ee08a','#c08bff','#ff9f5a','#66e0d0','#ff6bd6','#9db4ff','#ffe08a',
               '#7fd6ff','#ffa8c9','#b5e86a','#ffb347','#8ce0c0','#e08bff','#ff8f8f','#6fd9a5','#d6c2ff','#ffc46b'];
const FRUITC= ['#ff6b6b','#ffa94d','#ffd43b','#69db7c','#a78bfa','#ff8fd0'];

// ---------------------------------------------------------------- 入力
const keys = {};
const stick = { x:0, y:0, id:null, ox:0, oy:0 };
let tJump = false, tDive = false;
addEventListener('keydown', e=>{
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].indexOf(e.code)>=0) e.preventDefault();
  keys[e.code] = true;
  if(e.code==='Enter' || e.code==='Space'){ const b = document.querySelector('#ov .btn'); if(b && !document.getElementById('ov').classList.contains('hide')) b.click(); }
});
addEventListener('keyup', e=>{ keys[e.code] = false; });
addEventListener('blur', ()=>{ for(const k in keys) keys[k]=false; });

(function setupTouch(){
  const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  const t = document.getElementById('touch');
  if(isTouch) t.classList.add('on');
  const area = document.getElementById('stickArea');
  const sEl = document.getElementById('stick'), knob = document.getElementById('knob');
  area.addEventListener('pointerdown', e=>{
    stick.id = e.pointerId; stick.ox = e.clientX; stick.oy = e.clientY;
    const r = t.getBoundingClientRect();
    sEl.style.display='block'; sEl.style.left = (e.clientX-r.left)+'px'; sEl.style.top = (e.clientY-r.top)+'px';
    knob.style.left='50%'; knob.style.top='50%';
    area.setPointerCapture(e.pointerId);
  });
  area.addEventListener('pointermove', e=>{
    if(stick.id !== e.pointerId) return;
    let dx = e.clientX-stick.ox, dy = e.clientY-stick.oy;
    const d = Math.hypot(dx,dy), max = 48;
    if(d > max){ dx = dx/d*max; dy = dy/d*max; }
    knob.style.left = (50 + dx/1.2)+'%'; knob.style.top = (50 + dy/1.2)+'%';
    stick.x = clamp(dx/max*1.4,-1,1); stick.y = clamp(dy/max*1.4,-1,1);
  });
  const end = e=>{ if(stick.id!==e.pointerId) return; stick.id=null; stick.x=stick.y=0; sEl.style.display='none'; };
  area.addEventListener('pointerup', end); area.addEventListener('pointercancel', end);
  const bind=(id,set)=>{ const el=document.getElementById(id);
    el.addEventListener('pointerdown',e=>{ e.preventDefault(); set(true); ac(); });
    el.addEventListener('pointerup',e=>{ e.preventDefault(); set(false); });
    el.addEventListener('pointerleave',()=>set(false));
    el.addEventListener('pointercancel',()=>set(false));
  };
  bind('bJump', v=> tJump=v); bind('bDive', v=> tDive=v);
})();

document.getElementById('sound').addEventListener('click', function(){
  muted = !muted; this.textContent = muted ? '🔇' : '🔊'; if(!muted) ac();
});

// ---------------------------------------------------------------- ゲーム状態
const ROUNDS = [
  { id:'race',  name:'ROUND 1', title:'ゲートクラッシュ・ダッシュ',
    rule:'障害物を抜けてゴールへ！ 先着した上位だけが次に進める。ニセ扉は体当たりで破れる！', time:110, qualify:10 },
  { id:'jump',  name:'ROUND 2', title:'ジャンプ・クラブ',
    rule:'回転バーを避けて生き残れ！ 低いバーはジャンプで飛び越え、高いバーはジャンプ厳禁。落ちたら脱落。', time:85, qualify:4 },
  { id:'final', name:'FINAL',   title:'クラウン・キャッチ',
    rule:'浮かぶ王冠へ飛びつけ！ 最初に掴んだ者が優勝。落ちても復帰できるが時間がない。', time:70, qualify:1 }
];
const START_BEANS = 20;

const G = {
  phase:'title',      // title / intro / play / result / over
  roundIdx:0, mode:'race',
  beans:[], player:null,
  timeLeft:0, elapsed:0, rt:0, freeze:0, endT:0,
  finishOrder:[], outOrder:[], winner:null,
  spectate:false, shake:0, flash:0
};
let obstacles = [], zones = [], holes = [], parts = [], cols = [];
let world = { w:800, goalY:4200, len:4400, cps:[] };
const cam = { x:-80, y:0 };
let arena = { cx:480, cy:320, r:250 };
let crown = { x:480, y:320, z:46, t:0 };

// ---------------------------------------------------------------- パーティクル
function burst(x,y,z,n,color,spd){
  for(let i=0;i<n;i++){
    const a = Math.random()*TAU, s = rnd(0.6,1)*(spd||3);
    parts.push({ x, y, z:z||6, vx:Math.cos(a)*s, vy:Math.sin(a)*s*0.6, vz:rnd(1,3.6),
                 life:rnd(24,46), c:color||'#fff', r:rnd(2,5), rot:Math.random()*TAU, om:rnd(-.3,.3) });
  }
}
function confetti(x,y,n){
  for(let i=0;i<n;i++){
    const a = Math.random()*TAU;
    parts.push({ x, y, z:rnd(20,90), vx:Math.cos(a)*rnd(.4,2.4), vy:Math.sin(a)*rnd(.3,1.6), vz:rnd(2,5.5),
                 life:rnd(50,90), c:pick(['#ffd23f','#ff5fa2','#5fc9ff','#7ee08a','#c08bff','#fff']), r:rnd(3,6),
                 rot:Math.random()*TAU, om:rnd(-.4,.4) });
  }
}
function updateParts(){
  for(let i=parts.length-1;i>=0;i--){
    const p = parts[i];
    p.x += p.vx; p.y += p.vy; p.z += p.vz; p.vz -= 0.22; p.rot += p.om;
    if(p.z < 0){ p.z = 0; p.vz *= -0.32; p.vx *= 0.7; p.vy *= 0.7; }
    if(--p.life <= 0) parts.splice(i,1);
  }
}

// ---------------------------------------------------------------- ビーン
function makeBean(i, isPlayer){
  return {
    id:i, name: isPlayer ? 'あなた' : NAMES[i % NAMES.length], color: isPlayer ? '#ffffff' : COLORS[i % COLORS.length],
    accent: isPlayer ? '#ff2d87' : '#ffffff', isPlayer,
    x:0, y:0, z:0, vx:0, vy:0, vz:0, face:Math.PI/2,
    state:'run', stun:0, inv:0, spin:0, spinRate:0, jumpCd:0, diveCd:0,
    zoneMul:1, skill:rnd(0.88,1.03), lane:rnd(-230,230), anim:Math.random()*10,
    out:false, done:false, place:0, finalRank:0, fallT:0, respawn:0,
    doorSel:{}, bridge:0, aiT:irnd(0,40), noJumpT:0, alive:true
  };
}
function tumble(b, p){
  if(b.inv > 0 || b.done || b.out) return;
  b.state = 'tumble'; b.stun = Math.floor(30 + p*10); b.inv = 12;
  b.vz = Math.max(b.vz, 2.6 + p*0.7); b.z = Math.max(b.z, 0.01);
  b.spinRate = (Math.random()<0.5?-1:1) * rnd(0.16,0.3);
  sfx.hit(); burst(b.x, b.y, b.z+14, 7, '#fff', 2.6);
  if(b.isPlayer){ G.shake = 10; }
}
function startDive(b){
  if(b.state !== 'run' || b.diveCd > 0) return;
  b.state = 'dive'; b.diveCd = 42;
  const sp = Math.hypot(b.vx, b.vy);
  const v = Math.max(sp, DIVE_SPD * b.skill);
  b.vx = Math.cos(b.face)*v; b.vy = Math.sin(b.face)*v;
  if(b.z <= 0.02){ b.vz = DIVE_VZ; b.z = 0.02; }
  sfx.dive();
}

function updateBean(b, cmd){
  if(b.out || b.done) return;
  if(b.inv > 0) b.inv--;
  if(b.jumpCd > 0) b.jumpCd--;
  if(b.diveCd > 0) b.diveCd--;
  if(b.noJumpT > 0) b.noJumpT--;
  b.anim += Math.min(0.5, Math.hypot(b.vx,b.vy)*0.09);

  if(b.state === 'fall'){
    b.fallT++; b.z -= 3.4; b.x += b.vx*0.5; b.y += b.vy*0.5;
    return;
  }
  const grounded = b.z <= 0.02;
  if(b.stun > 0){ b.stun--; if(b.stun === 0 && grounded && (b.state==='tumble'||b.state==='prone')) b.state='run'; }
  if(b.state === 'tumble') b.spin += b.spinRate * (grounded?0.5:1);
  else b.spin *= 0.8;

  const canMove = (b.stun <= 0 && b.state === 'run' && G.freeze <= 0);
  if(canMove && cmd){
    let mx = cmd.mx, my = cmd.my;
    const m = Math.hypot(mx,my);
    if(m > 0.15){
      mx /= m; my /= m;
      b.face = Math.atan2(my,mx);
      const a = (grounded ? ACC : ACC*0.5) * b.skill;
      b.vx += mx*a; b.vy += my*a;
    }
    if(cmd.jump && grounded && b.jumpCd <= 0){ b.vz = JUMPV; b.z = 0.02; b.jumpCd = 8; sfx.jump(); }
    if(cmd.dive) startDive(b);
  }

  // 速度制限（操作中のみ）
  if(b.state === 'run'){
    const cap = MAXSPD * b.skill * b.zoneMul;
    const sp = Math.hypot(b.vx,b.vy);
    if(sp > cap){ const k = Math.max(cap/sp, 0.94); b.vx *= k; b.vy *= k; }
  }
  // 摩擦
  let f;
  if(grounded) f = (b.state==='prone') ? 0.935 : (b.state==='tumble' ? 0.90 : FRIC);
  else         f = (b.state==='dive') ? 0.995 : AIRFRIC;
  b.vx *= f; b.vy *= f;

  b.x += b.vx; b.y += b.vy;

  // 高さ
  b.z += b.vz; b.vz -= GRAV;
  if(b.z <= 0){
    const hard = b.vz < -3.4;
    b.z = 0; b.vz = 0;
    if(b.state === 'dive'){ b.state = 'prone'; b.stun = 24; burst(b.x,b.y,2,5,'#ffffff',1.8); sfx.land(); }
    else if(hard){ burst(b.x,b.y,2,4,'rgba(255,255,255,.8)',1.4); sfx.land(); }
  }
  b.zoneMul = 1;
}

// ---------------------------------------------------------------- 当たり判定
function collideBean(b, c){
  if(b.out || b.done || b.state === 'fall') return;
  const top = b.z + BEAN_H;
  if(b.z >= c.hi || top <= c.lo) return;

  let nx, ny, depth;
  if(c.t === 'circle'){
    let dx = b.x-c.x, dy = b.y-c.y;
    let d = Math.hypot(dx,dy); if(d < 1e-4){ dx = 1; dy = 0; d = 1e-4; }
    const pen = c.r + BEAN_R - d;
    if(pen <= 0) return;
    nx = dx/d; ny = dy/d; depth = pen;
  } else {
    const ca = Math.cos(c.a||0), sa = Math.sin(c.a||0);
    const ex = b.x-c.x, ey = b.y-c.y;
    const rx =  ex*ca + ey*sa;
    const ry = -ex*sa + ey*ca;
    const hx = c.w/2, hy = c.h/2;
    const qx = clamp(rx,-hx,hx), qy = clamp(ry,-hy,hy);
    let dx = rx-qx, dy = ry-qy;
    let d = Math.hypot(dx,dy);
    if(d > BEAN_R) return;
    if(d < 1e-4){ // めり込み → 最も近い辺へ押し出し
      const dl = rx+hx, dr = hx-rx, dt = ry+hy, db = hy-ry;
      const mn = Math.min(dl,dr,dt,db);
      if(mn === dl){ dx=-1; dy=0; depth = BEAN_R+dl; }
      else if(mn === dr){ dx=1; dy=0; depth = BEAN_R+dr; }
      else if(mn === dt){ dx=0; dy=-1; depth = BEAN_R+dt; }
      else { dx=0; dy=1; depth = BEAN_R+db; }
    } else { depth = BEAN_R-d; dx/=d; dy/=d; }
    nx = dx*ca - dy*sa; ny = dx*sa + dy*ca;
  }

  // 面の速度
  let svx = c.vx||0, svy = c.vy||0;
  if(c.spin){ const rx = b.x-c.px, ry = b.y-c.py; svx += -c.spin*ry; svy += c.spin*rx; }

  if(c.mode === 'door'){
    const s = c.ref;
    const into = (b.vx*-nx + b.vy*-ny);
    if(!s.solid){
      if(into > 0.7 || b.state === 'dive'){ breakDoor(s, b); return; }
    } else if(!s.tried && into > 1.2){ s.tried = true; s.shake = 12; sfx.bump(); }
    b.x += nx*depth; b.y += ny*depth;
    const vn = b.vx*nx + b.vy*ny;
    if(vn < 0){ b.vx -= vn*nx*1.15; b.vy -= vn*ny*1.15; }
    return;
  }
  b.x += nx*depth; b.y += ny*depth;
  if(c.mode === 'block'){
    const vn = b.vx*nx + b.vy*ny;
    if(vn < 0){ b.vx -= vn*nx; b.vy -= vn*ny; }
    return;
  }
  const p = c.power || 1;
  b.vx = nx*3.1*p + svx*1.15;
  b.vy = ny*3.1*p + svy*1.15;
  tumble(b, p);
}
function breakDoor(s, b){
  s.broken = true; s.tried = true; s.shake = 0;
  b.vx *= 0.55; b.vy *= 0.55;
  burst(s.x, s.wy, 14, 26, s.color, 4.2);
  sfx.door(); if(b.isPlayer) G.shake = 8;
}

function beanVsBean(){
  const A = G.beans;
  for(let i=0;i<A.length;i++){
    const a = A[i]; if(a.out||a.done||a.state==='fall') continue;
    for(let j=i+1;j<A.length;j++){
      const b = A[j]; if(b.out||b.done||b.state==='fall') continue;
      if(Math.abs(a.z-b.z) > 24) continue;
      const dx = b.x-a.x, dy = b.y-a.y;
      let d = Math.hypot(dx,dy); if(d < 1e-4){ d = 1e-4; }
      const pen = BEAN_R*2 - d;
      if(pen <= 0) continue;
      const nx = dx/d, ny = dy/d;
      a.x -= nx*pen*0.5; a.y -= ny*pen*0.5;
      b.x += nx*pen*0.5; b.y += ny*pen*0.5;
      const rel = (b.vx-a.vx)*nx + (b.vy-a.vy)*ny;
      if(rel < 0){
        const p = rel*0.62;
        a.vx += nx*p; a.vy += ny*p;
        b.vx -= nx*p; b.vy -= ny*p;
        const sa = Math.hypot(a.vx,a.vy), sb = Math.hypot(b.vx,b.vy);
        if(a.state==='dive' && sa > 4.4) tumble(b, 0.9);
        if(b.state==='dive' && sb > 4.4) tumble(a, 0.9);
      }
    }
  }
}

function Spinner(x,y,len,arms,om,opt){
  opt = opt||{};
  return { kind:'spinner', x, y, len, arms, om, a:Math.random()*TAU,
    hi: opt.hi||24, power: opt.power||1.2, col2: opt.color||'#ff5fa2',
    up(){ this.a += this.om; },
    col(out){
      for(let i=0;i<this.arms;i++){
        const ang = this.a + i*TAU/this.arms;
        out.push({ t:'box', x:this.x+Math.cos(ang)*this.len*0.5, y:this.y+Math.sin(ang)*this.len*0.5,
                   w:this.len, h:18, a:ang, lo:0, hi:this.hi, spin:this.om, px:this.x, py:this.y,
                   power:this.power, mode:'knock' });
      }
    },
    draw(){
      const sx = this.x-cam.x, sy = this.y-cam.y;
      ctx.save(); ctx.translate(sx,sy);
      for(let pass=0; pass<2; pass++){
        const off = pass===0 ? 0 : -9;
        ctx.globalAlpha = pass===0 ? 0.22 : 1;
        for(let i=0;i<this.arms;i++){
          const ang = this.a + i*TAU/this.arms;
          ctx.save(); ctx.translate(0,off); ctx.rotate(ang);
          ctx.fillStyle = pass===0 ? '#000' : this.col2;
          roundRect(0,-9,this.len,18,9); ctx.fill();
          if(pass===1){
            ctx.fillStyle = 'rgba(255,255,255,.55)';
            for(let k=1;k<5;k++){ roundRect(this.len*k/5-6,-7,12,6,3); ctx.fill(); }
          }
          ctx.restore();
        }
        ctx.beginPath(); ctx.arc(0,off,20,0,TAU);
        ctx.fillStyle = pass===0 ? '#000' : '#fff'; ctx.fill();
        if(pass===1){ ctx.beginPath(); ctx.arc(0,off,11,0,TAU); ctx.fillStyle=this.col2; ctx.fill(); }
      }
      ctx.globalAlpha = 1; ctx.restore();
    }
  };
}
function Sweeper(y, o){
  o = o||{};
  return { kind:'sweeper', y, w:o.w||210, h:o.h||26, amp:o.amp||300, spd:o.spd||0.014, ph:o.ph||0,
    high:!!o.high, hiZ:o.hiZ||24, power:o.power||1.25, color:o.color||'#7a4dff', t:0, x:400, vx:0,
    up(){ this.t++; const p = this.t*this.spd + this.ph;
          this.x = 400 + Math.sin(p)*this.amp; this.vx = Math.cos(p)*this.amp*this.spd; },
    col(out){ out.push({ t:'box', x:this.x, y:this.y, w:this.w, h:this.h, a:0,
                lo:this.high?34:0, hi:this.high?130:this.hiZ, vx:this.vx*1.7, vy:0,
                power:this.power, mode:'knock' }); },
    draw(){
      const sx = this.x-cam.x, sy = this.y-cam.y, lift = this.high ? 48 : (this.hiZ>30? 16 : 8);
      ctx.save();
      ctx.globalAlpha = .22; ctx.fillStyle = '#000';
      roundRect(sx-this.w/2, sy-this.h/2, this.w, this.h, 10); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.fillStyle = this.high ? '#ffd23f' : this.color;
      roundRect(sx-this.w/2, sy-this.h/2-lift, this.w, this.h, 10); ctx.fill();

      for(let k=0;k<this.w;k+=34) roundRect(sx-this.w/2+k+8, sy-this.h/2-lift+5, 16, 6, 3), ctx.fill();
      if(this.high){
        ctx.strokeStyle='rgba(255,255,255,.6)'; ctx.lineWidth=3; ctx.setLineDash([5,6]);
        ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx, sy-lift); ctx.stroke(); ctx.setLineDash([]);
      }

}
function Piston(side, y, ph){

function FruitLane(y0,y1,every){

        ctx.restore();
      }

  for(let y=y0; y<y1; y+=150) o.spawn(y);

function DoorWall(id, y, n, openCount){
  const slotW = 800/n, slots = [];
  const idx = []; for(let i=0;i<n;i++) idx.push(i);
  for(let i=idx.length-1;i>0;i--){ const j=irnd(0,i); const t=idx[i]; idx[i]=idx[j]; idx[j]=t; }
  const open = idx.slice(0, openCount);
  for(let i=0;i<n;i++){
    slots.push({ i, x:slotW*(i+0.5), wy:y, w:slotW-18, solid:open.indexOf(i)<0, broken:false, tried:false,
                 shake:0, color: pick(['#ffd23f','#5fc9ff','#ff7096','#7ee08a','#c08bff']) });
  }
  return { kind:'doorwall', id, y, slots, slotW,
    up(){ for(const s of this.slots) if(s.shake>0) s.shake--; },
    col(out){
      for(const s of this.slots) if(!s.broken)
        out.push({ t:'box', x:s.x, y:this.y, w:s.w, h:26, a:0, lo:0, hi:80, mode:'door', ref:s });
      for(let i=0;i<=this.slots.length;i++)
        out.push({ t:'box', x:this.slotW*i, y:this.y, w:20, h:30, a:0, lo:0, hi:80, mode:'block' });
    },
    draw(){
      const sy = this.y-cam.y;
      ctx.save();
      ctx.fillStyle='rgba(0,0,0,.18)'; ctx.fillRect(0-cam.x, sy-13+8, 800, 26);
      for(const s of this.slots){
        const sx = s.x-cam.x + (s.shake? Math.sin(s.shake*2)*4 : 0);
        if(s.broken){
          ctx.fillStyle='rgba(255,255,255,.28)';
          roundRect(sx-s.w/2, sy-8, s.w, 16, 6); ctx.fill();
          continue;
        }
        ctx.fillStyle = s.color;
        roundRect(sx-s.w/2, sy-13-26, s.w, 40, 8); ctx.fill();
        ctx.fillStyle='rgba(255,255,255,.35)';
        roundRect(sx-s.w/2+8, sy-13-20, s.w-16, 10, 5); ctx.fill();
        ctx.fillStyle='rgba(0,0,0,.18)';
        ctx.beginPath(); ctx.arc(sx+s.w*0.32, sy-13-6, 5, 0, TAU); ctx.fill();
      }
      for(let i=0;i<=this.slots.length;i++){
        const px = this.slotW*i - cam.x;
        ctx.fillStyle='#6b3fd4'; roundRect(px-10, sy-15-30, 20, 46, 6); ctx.fill();
        ctx.fillStyle='#9d8bff'; roundRect(px-10, sy-15-30, 20, 10, 5); ctx.fill();
      }
      ctx.restore();
    }
  };
}
function RotBar(cx,cy,len,om,high,opt){
  opt = opt||{};
  return { kind:'rotbar', cx, cy, len, om, high, a:opt.a||0, power:opt.power||1.22,
    up(){ this.a += this.om; },
    col(out){
      out.push({ t:'box', x:this.cx, y:this.cy, w:this.len, h:20, a:this.a,
                 lo:this.high?34:0, hi:this.high?130:24, spin:this.om, px:this.cx, py:this.cy,
                 power:this.power, mode:'knock' });
    },
    draw(){
      const sx = this.cx-cam.x, sy = this.cy-cam.y, lift = this.high ? 50 : 10;
      ctx.save(); ctx.translate(sx,sy);
      ctx.save(); ctx.rotate(this.a);
      ctx.globalAlpha=.2; ctx.fillStyle='#000'; roundRect(-this.len/2,-10,this.len,20,10); ctx.fill();
      ctx.restore();
      ctx.save(); ctx.translate(0,-lift); ctx.rotate(this.a);
      ctx.globalAlpha=1;
      ctx.fillStyle = this.high ? '#ffd23f' : '#ff5fa2';
      roundRect(-this.len/2,-10,this.len,20,10); ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.5)';
      for(let k=-this.len/2+16;k<this.len/2-10;k+=40){ roundRect(k,-7,18,6,3); ctx.fill(); }
      ctx.restore();
      ctx.globalAlpha=1;
      ctx.beginPath(); ctx.arc(0,-lift*0.4,18,0,TAU); ctx.fillStyle='#fff'; ctx.fill();
      ctx.beginPath(); ctx.arc(0,-lift*0.4,9,0,TAU); ctx.fillStyle = this.high?'#ffb703':'#ff2d87'; ctx.fill();
      ctx.restore();
    }
  };
}

function roundRect(x,y,w,h,r){
  const rr = Math.min(r, Math.abs(w)/2, Math.abs(h)/2);
  ctx.beginPath();
  ctx.moveTo(x+rr,y);
  ctx.lineTo(x+w-rr,y); ctx.quadraticCurveTo(x+w,y,x+w,y+rr);
  ctx.lineTo(x+w,y+h-rr); ctx.quadraticCurveTo(x+w,y+h,x+w-rr,y+h);
  ctx.lineTo(x+rr,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-rr);
  ctx.lineTo(x,y+rr); ctx.quadraticCurveTo(x,y,x+rr,y);
  ctx.closePath();
}

function playerCmd(b){
  let mx = 0, my = 0;
  if(keys['ArrowLeft'] ||keys['KeyA']) mx -= 1;
  if(keys['ArrowRight']||keys['KeyD']) mx += 1;
  if(keys['ArrowUp']   ||keys['KeyW']) my -= 1;
  if(keys['ArrowDown'] ||keys['KeyS']) my += 1;
  mx += stick.x; my += stick.y;
  const jump = !!(keys['Space'] || tJump);

function nearDanger(b, ahead){
  // 前方の障害物を調べ、回避ベクトルとジャンプ判断を返す
  let avx = 0, avy = 0, jump = false, noJump = false;
  const dirx = Math.cos(b.face), diry = Math.sin(b.face);
  for(const c of cols){
    if(c.mode === 'block' || c.mode === 'door') continue;
    let cx, cy, rad;
    if(c.t === 'circle'){ cx = c.x; cy = c.y; rad = c.r; }
    else {
      cx = c.x; cy = c.y; rad = Math.max(c.w, c.h)*0.5;
      if(c.w > 120){ // 長い棒は最寄り点で判定
        const ca = Math.cos(c.a||0), sa = Math.sin(c.a||0);
        const ex = b.x-c.x, ey = b.y-c.y;
        const t = clamp(ex*ca+ey*sa, -c.w/2, c.w/2);
        cx = c.x + ca*t; cy = c.y + sa*t; rad = c.h*0.5;
      }
    }
    const dx = cx-b.x, dy = cy-b.y;
    const d = Math.hypot(dx,dy);
    const range = rad + ahead;
    if(d > range) continue;
    const dot = (dx*dirx + dy*diry)/(d||1);
    if(dot < -0.35) continue;
    const low = c.hi <= 26 && c.lo <= 1;
    const high = c.lo >= 30;
    if(low && d < rad + 46) jump = true;
    else if(high && d < rad + 70) noJump = true;
    else if(!low){
      const w = (range-d)/range;
      avx += (-dx/(d||1))*w*1.6; avy += (-dy/(d||1))*w*1.0;
      // 横へ逃げる
      avx += (-diry)*w*(dx>0?-1:1)*1.2;
    }
  }
  return { avx, avy, jump, noJump };
}

function aiRace(b){
  let tx = clamp(400 + b.lane, 70, 730), ty = b.y + 260;

  // 穴セクション → 橋へ
  if(b.y > 1830 && b.y < 2280){
    const bridges = [210, 580];
    if(b.y < 1980) b.bridge = (Math.abs(bridges[0]-b.x) < Math.abs(bridges[1]-b.x)) ? 0 : 1;
    tx = bridges[b.bridge];
  }
  // ドアウォール → 扉を選ぶ
  for(const o of obstacles){
    if(o.kind !== 'doorwall') continue;
    if(b.y < o.y && b.y > o.y - 360){
      const broken = o.slots.filter(s=>s.broken);
      if(broken.length){
        let best = broken[0], bd = 1e9;
        for(const s of broken){ const d = Math.abs(s.x-b.x); if(d<bd){ bd=d; best=s; } }
        tx = best.x;
      } else {
        if(b.doorSel[o.id] === undefined || o.slots[b.doorSel[o.id]].tried){
          const cand = [];
          for(let i=0;i<o.slots.length;i++) if(!o.slots[i].tried) cand.push(i);
          b.doorSel[o.id] = cand.length ? pick(cand) : irnd(0,o.slots.length-1);
        }
        tx = o.slots[b.doorSel[o.id]].x;
      }
      ty = o.y + 60;
    }
  }
  let mx = tx - b.x, my = ty - b.y;
  const m = Math.hypot(mx,my) || 1; mx/=m; my/=m;

  const dg = nearDanger(b, 78);
  mx += dg.avx; my += dg.avy;

  // 壁ぎわ補正
  if(b.x < 60) mx += 1.2;
  if(b.x > 740) mx -= 1.2;

  const jump = dg.jump && !dg.noJump;
  // たまにダイブ（直線的に前へ）
  let dive = false;
  b.aiT--;
  if(b.aiT <= 0){ b.aiT = irnd(70,190); if(Math.random() < 0.35 && !dg.noJump) dive = true; }
  if(b.y > world.goalY - 260 && b.z <= 0 && Math.random() < 0.05) dive = true;

  return { mx, my, jump, dive };
}

function aiArena(b, final){
  const dx = b.x - arena.cx, dy = b.y - arena.cy;
  const dist = Math.hypot(dx,dy) || 1;
  const th = Math.atan2(dy,dx);
  let mx = 0, my = 0;

  if(final){
    // 王冠へ向かう
    let tx = crown.x - b.x, ty = crown.y - b.y;
    const m = Math.hypot(tx,ty)||1; mx = tx/m; my = ty/m;
    if(dist > arena.r*0.86){ mx += -dx/dist*1.4; my += -dy/dist*1.4; }
    const dg = nearDanger(b, 66);
    mx += dg.avx*0.8; my += dg.avy*0.8;
    const cd = Math.hypot(crown.x-b.x, crown.y-b.y);
    const jump = (cd < 74 && b.z <= 0 && crown.z < 78) || (dg.jump && !dg.noJump);
    return { mx, my, jump, dive: cd < 90 && cd > 40 && Math.random()<0.05 };
  }

  // ジャンプ・クラブ：中心寄りの安全半径を保つ
  const want = arena.r*0.55;
  const rr = (want - dist)/60;
  mx = Math.cos(th)*rr; my = Math.sin(th)*rr;
  // 少しうろつく
  mx += Math.cos(b.anim*0.13 + b.id)*0.35;
  my += Math.sin(b.anim*0.11 + b.id)*0.35;

  let jump = false, danger = false;
  for(const o of obstacles){
    if(o.kind !== 'rotbar') continue;
    // バー角度と自分の角度の差（バーは直径なのでπ周期）
    let d = th - o.a;
    d = Math.atan2(Math.sin(d), Math.cos(d));
    if(d > Math.PI/2) d -= Math.PI;
    if(d < -Math.PI/2) d += Math.PI;
    const t = o.om !== 0 ? d/o.om : 1e9; // バーが自分に到達するまでのフレーム
    const react = 3 + (1-b.skill)*30;
    if(t > 0 && t < 20 + react){
      if(o.high) danger = true;
      else if(t > 4 && t < 15 + react*0.4 && b.z <= 0) jump = true;
    }
  }
  if(danger) jump = false;
  return { mx, my, jump, dive:false };
}

// ---------------------------------------------------------------- ゾーン/落下
function applyZones(b){
  if(b.z > 6 || b.state === 'fall') return;
  for(const z of zones){
    if(b.x > z.x && b.x < z.x+z.w && b.y > z.y && b.y < z.y+z.h){
      if(z.t === 'slime'){ b.zoneMul = 0.55; b.vx *= 0.90; b.vy *= 0.90; }
      else if(z.t === 'wind'){ b.vx += z.ax; }
    }
  }
}
function checkHoles(b){
  if(b.z > 2 || b.state === 'fall' || b.done || b.out) return;
  for(const h of holes){
    if(b.x > h.x+4 && b.x < h.x+h.w-4 && b.y > h.y+4 && b.y < h.y+h.h-4){
      b.state = 'fall'; b.fallT = 0; sfx.fall();
      if(b.isPlayer) G.flash = 8;
      return;
    }
  }
}
function respawnRace(b){
  let cp = world.cps[0];
  for(const c of world.cps) if(c < b.y - 40) cp = c;
  b.state = 'run'; b.stun = 0; b.inv = 60; b.z = 0; b.vx = b.vy = b.vz = 0;
  b.x = clamp(b.x, 90, 710); b.y = cp; b.fallT = 0;
  burst(b.x, b.y, 10, 12, b.color, 3);
}

// ---------------------------------------------------------------- 進行管理
function eliminate(b){
  if(b.out) return;
  b.out = true; b.alive = false; b.state = 'fall';
  const remain = G.beans.filter(x=>!x.out && !x.done).length + 1;
  b.finalRank = remain;
  G.outOrder.push(b);
  if(b.isPlayer){ sfx.out(); showBanner('ELIMINATED', '#ff5f6d'); }
}
function finish(b){
  if(b.done) return;
  b.done = true; b.place = G.finishOrder.length + 1;
  b.finalRank = b.place;
  G.finishOrder.push(b);
  confetti(b.x, b.y, 26);
  if(b.isPlayer){ sfx.qual(); showBanner('QUALIFIED!', '#3ddc84'); }
}

let bannerT = 0;
function showBanner(text, color){
  const el = document.getElementById('banner');
  el.textContent = text; el.style.color = color || '#fff'; el.style.opacity = 1;
  bannerT = 110;
}

function startGame(){
  G.beans = [];
  const pIdx = irnd(0, START_BEANS-1);
  for(let i=0;i<START_BEANS;i++){
    const b = makeBean(i, i === pIdx);
    if(b.isPlayer){ b.skill = 1.0; G.player = b; }
    G.beans.push(b);
  }
  G.roundIdx = 0; G.spectate = false; G.winner = null;
  startRound(0);
}
function startRound(idx){
  G.roundIdx = idx;
  const R = ROUNDS[idx];
  G.mode = R.id;
  G.finishOrder = []; G.outOrder = [];
  G.timeLeft = R.time*60; G.elapsed = 0; G.rt = 0; G.endT = 0; G.freeze = 190; G.winner = null;
  for(const b of G.beans){ b.out = false; b.done = false; b.place = 0; b.alive = true; }
  if(R.id === 'race') buildRace(); else buildArena(R.id === 'final');
  G.phase = 'intro';
  showIntro(R);
}
function endRound(){
  G.phase = 'result';
  const R = ROUNDS[G.roundIdx];
  let qualified, eliminated;
  if(G.mode === 'race'){
    qualified = G.finishOrder.slice(0, R.qualify);
    eliminated = G.beans.filter(b=> qualified.indexOf(b) < 0);
    // 未通過の順位付け（残り距離順）
    eliminated.sort((a,b)=> b.y - a.y);
    eliminated.forEach((b,i)=>{ if(!b.finalRank || b.done) b.finalRank = qualified.length + i + 1; });
  } else if(G.mode === 'jump'){
    qualified = G.beans.filter(b=>!b.out);
    eliminated = G.beans.filter(b=>b.out);
  } else {
    qualified = G.winner ? [G.winner] : [];
    eliminated = G.beans.filter(b=> b !== G.winner);
  }
  showResult(qualified, eliminated);
}

// ---------------------------------------------------------------- 更新
function updateRace(){
  for(const o of obstacles){ o.up(); }
  cols.length = 0; for(const o of obstacles) o.col(cols);

  const leadY = Math.max.apply(null, G.beans.map(b=> b.done ? world.goalY : b.y));
  for(const b of G.beans){
    if(b.out) continue;
    if(b.done){
      // ゴール後は惰性で走り抜ける
      b.y += Math.max(0, b.vy); b.vy *= 0.94; b.x += b.vx; b.vx *= 0.94;
      b.anim += 0.3;
      continue;
    }
    if(b.state === 'fall'){
      updateBean(b, null);
      if(b.fallT > 34) respawnRace(b);
      continue;
    }
    let cmd;
    if(b.isPlayer && !G.spectate) cmd = playerCmd(b);
    else {
      cmd = aiRace(b);
      // 軽いラバーバンド（見せ場を作る）
      const gap = leadY - b.y;
      if(gap > 620) b.skillBoost = 1.05; else if(gap < 120) b.skillBoost = 0.97; else b.skillBoost = 1;
    }
    const base = b.skill;
    if(b.skillBoost) b.skill = base * b.skillBoost;
    updateBean(b, cmd);
    b.skill = base;

    applyZones(b);
    for(const c of cols) collideBean(b, c);
    // 壁
    if(b.x < BEAN_R){ b.x = BEAN_R; if(b.vx<0) b.vx *= -0.3; }
    if(b.x > world.w-BEAN_R){ b.x = world.w-BEAN_R; if(b.vx>0) b.vx *= -0.3; }
    if(b.y < 20){ b.y = 20; if(b.vy<0) b.vy = 0; }
    checkHoles(b);
    if(b.y > world.goalY) finish(b);
  }
  beanVsBean();

  // カメラ
  const tgt = camTarget();
  const want = clamp(tgt.y - 420, -40, world.len - VH);
  cam.y += (want - cam.y) * 0.12;

  // 終了判定
  const R = ROUNDS[G.roundIdx];
  if(G.endT > 0){ if(--G.endT === 0) endRound(); }
  else if(G.finishOrder.length >= R.qualify){
    G.endT = 100;
    showBanner('RACE OVER', '#ffd23f');
  }
  else if(G.timeLeft <= 0){ G.endT = 1; }
}

function updateJump(){
  // 難度上昇
  const t = G.rt;
  arena.r = arena.r0 - clamp((t-1200)/2100, 0, 1) * 90;
  const spd = 1 + clamp(t/3300, 0, 1) * 0.9;
  obstacles[0].om =  0.0125 * spd;
  obstacles[1].om = -0.0100 * spd;
  if(t === 1500){ obstacles.push(RotBar(arena.cx, arena.cy, 560, 0.0155, false, {a:1.0})); showBanner('SPEED UP!', '#ffd23f'); }
  if(t === 3000){ showBanner('SPEED UP!', '#ffd23f'); }

  for(const o of obstacles){ o.up(); if(o.kind==='rotbar'){ o.cx = arena.cx; o.cy = arena.cy; } }
  cols.length = 0; for(const o of obstacles) o.col(cols);

  for(const b of G.beans){
    if(b.out && b.state !== 'fall') continue;
    if(b.state === 'fall'){
      updateBean(b, null);
      if(b.fallT > 40 && !b.out) eliminate(b);
      continue;
    }
    const cmd = (b.isPlayer && !G.spectate) ? playerCmd(b) : aiArena(b, false);
    updateBean(b, cmd);
    for(const c of cols) collideBean(b, c);
    const d = Math.hypot(b.x-arena.cx, b.y-arena.cy);
    if(d > arena.r && b.z <= 0.5){
      b.state = 'fall'; b.fallT = 0; sfx.fall();
      if(b.isPlayer) G.flash = 8;
    }
  }
  beanVsBean();

  const R = ROUNDS[G.roundIdx];
  const alive = G.beans.filter(b=>!b.out).length;
  if(G.endT > 0){ if(--G.endT === 0) endRound(); }
  else if(alive <= R.qualify){ G.endT = 90; showBanner('SURVIVED!', '#3ddc84'); }
  else if(G.timeLeft <= 0){ G.endT = 60; showBanner('TIME UP', '#ffd23f'); }
}

function updateFinal(){
  crown.t += 1;
  const R = ROUNDS[G.roundIdx];
  const prog = clamp(1 - G.timeLeft/(R.time*60), 0, 1);
  crown.x = arena.cx + Math.cos(crown.t*0.011)*96 + Math.sin(crown.t*0.019)*26;
  crown.y = arena.cy + Math.sin(crown.t*0.014)*76 + Math.cos(crown.t*0.023)*22;
  crown.z = 94 - prog*50 + Math.sin(crown.t*0.06)*3;   // 高すぎ→徐々に降下

  for(const o of obstacles) o.up();
  cols.length = 0; for(const o of obstacles) o.col(cols);

  for(const b of G.beans){
    if(b.out) continue;
    if(b.state === 'fall'){
      updateBean(b, null);
      if(b.fallT > 40){
        const a = Math.random()*TAU;
        b.x = arena.cx + Math.cos(a)*arena.r*0.7; b.y = arena.cy + Math.sin(a)*arena.r*0.7;
        b.z = 0; b.vx = b.vy = b.vz = 0; b.state='run'; b.stun=0; b.inv=70; b.fallT=0;
        burst(b.x,b.y,10,12,b.color,3);
      }
      continue;
    }
    const cmd = (b.isPlayer && !G.spectate) ? playerCmd(b) : aiArena(b, true);
    updateBean(b, cmd);
    for(const c of cols) collideBean(b, c);
    const d = Math.hypot(b.x-arena.cx, b.y-arena.cy);
    if(d > arena.r && b.z <= 0.5){ b.state='fall'; b.fallT=0; sfx.fall(); if(b.isPlayer) G.flash=8; }
    // 王冠キャッチ
    if(!G.winner && b.state !== 'fall'){
      const cd = Math.hypot(b.x-crown.x, b.y-crown.y);
      if(cd < 32 && b.z + BEAN_H >= crown.z && b.z > 6){
        G.winner = b; b.finalRank = 1;
        confetti(b.x, b.y, 90); sfx.crown();
        showBanner(b.isPlayer ? 'CROWN!!' : 'WINNER', '#ffd23f');
        G.endT = 150;
      }
    }
  }
  beanVsBean();

  if(G.endT > 0){ if(--G.endT === 0) endRound(); }
  else if(G.timeLeft <= 0){ G.endT = 60; showBanner('TIME UP', '#ffd23f'); }
  if(G.winner) confetti(G.winner.x, G.winner.y, 2);
}

function camTarget(){
  const p = G.player;
  if(p && !p.out && !G.spectate) return p;
  let best = null, by = -1e9;
  for(const b of G.beans){ if(b.out) continue; const v = b.done ? world.goalY+400 : b.y; if(v > by){ by = v; best = b; } }
  return best || p || {x:400,y:0};
}

// ---------------------------------------------------------------- 描画
function drawRaceFloor(){
  const y0 = Math.floor(cam.y/80)*80 - 80, y1 = cam.y + VH + 80;
  // 背景（コース外）
  ctx.fillStyle = '#5f3fb8';
  ctx.fillRect(0,0,VW,VH);
  ctx.save();
  // 床
  for(let y=y0; y<y1; y+=80){
    for(let x=0; x<world.w; x+=80){
      const odd = ((x/80) + Math.floor(y/80)) % 2 === 0;
      ctx.fillStyle = odd ? '#ffe9f4' : '#ffd4ea';
      ctx.fillRect(x-cam.x, y-cam.y, 80, 80);
    }
  }
  // サイド壁
  ctx.fillStyle = '#7a4dff';
  ctx.fillRect(0-cam.x-26, y0-cam.y, 26, y1-y0);
  ctx.fillRect(world.w-cam.x, y0-cam.y, 26, y1-y0);
  ctx.fillStyle = 'rgba(255,255,255,.35)';
  for(let y=y0; y<y1; y+=60){
    ctx.fillRect(0-cam.x-26, y-cam.y, 26, 26);
    ctx.fillRect(world.w-cam.x, y-cam.y+30, 26, 26);
  }
  // チェックポイント
  ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 5; ctx.setLineDash([16,14]);
  for(const c of world.cps){
    if(c < y0 || c > y1) continue;
    ctx.beginPath(); ctx.moveTo(0-cam.x, c-cam.y); ctx.lineTo(world.w-cam.x, c-cam.y); ctx.stroke();
  }
  ctx.setLineDash([]);
  // スタートライン
  if(340 > y0 && 340 < y1){
    ctx.fillStyle = '#fff';
    for(let x=0;x<world.w;x+=40) ctx.fillRect(x-cam.x, 336-cam.y, 20, 10);
  }
  // ゾーン
  for(const z of zones){
    if(z.y+z.h < y0 || z.y > y1) continue;
    if(z.t === 'slime'){
      ctx.fillStyle = 'rgba(61,220,132,.55)';
      ctx.fillRect(z.x-cam.x, z.y-cam.y, z.w, z.h);
      ctx.fillStyle = 'rgba(255,255,255,.35)';
      for(let i=0;i<14;i++){
        const bx = z.x + ((i*97)%z.w), by = z.y + 18 + ((i*53)%(z.h-30));
        const r = 5 + (i%3)*3 + Math.sin(G.elapsed*0.06+i)*2;
        ctx.beginPath(); ctx.arc(bx-cam.x, by-cam.y, r, 0, TAU); ctx.fill();
      }
    } else if(z.t === 'wind'){
      ctx.fillStyle = 'rgba(95,201,255,.35)';
      ctx.fillRect(z.x-cam.x, z.y-cam.y, z.w, z.h);
      ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 4; ctx.lineCap='round';
      for(let i=0;i<9;i++){
        const yy = z.y + 18 + i*18, off = (G.elapsed*3 + i*90) % (z.w+120) - 60;
        ctx.beginPath(); ctx.moveTo(off-cam.x, yy-cam.y); ctx.lineTo(off+52-cam.x, yy-cam.y); ctx.stroke();
      }
      ctx.lineCap='butt';
    }
  }
  // 穴
  for(const h of holes){
    if(h.y+h.h < y0 || h.y > y1) continue;
    ctx.fillStyle = 'rgba(40,15,80,.35)';
    roundRect(h.x-cam.x-4, h.y-cam.y-4, h.w+8, h.h+8, 18); ctx.fill();
    const g = ctx.createLinearGradient(0, h.y-cam.y, 0, h.y+h.h-cam.y);
    g.addColorStop(0,'#3a1a6e'); g.addColorStop(1,'#150835');
    ctx.fillStyle = g; roundRect(h.x-cam.x, h.y-cam.y, h.w, h.h, 14); ctx.fill();
  }
  // ゴール
  const gy = world.goalY;
  if(gy > y0-200 && gy < y1+200){
    for(let x=0;x<world.w;x+=40){
      for(let k=0;k<2;k++){
        ctx.fillStyle = ((x/40)+k)%2 ? '#fff' : '#3a2560';
        ctx.fillRect(x-cam.x, gy-cam.y+k*20, 40, 20);
      }
    }
    ctx.fillStyle = '#ffd23f'; ctx.font = '900 42px sans-serif'; ctx.textAlign='center';
    ctx.fillText('GOAL', 400-cam.x, gy-cam.y+112);
    ctx.textAlign='left';
  }
  ctx.restore();
}

function drawArenaFloor(final){
  ctx.fillStyle = '#4a2a9e';
  ctx.fillRect(0,0,VW,VH);
  // 奥の雲
  ctx.fillStyle = 'rgba(255,255,255,.10)';
  for(let i=0;i<7;i++){
    const x = (i*173 + G.elapsed*0.25) % (VW+200) - 100, y = 60 + (i*97)%520;
    ctx.beginPath(); ctx.ellipse(x, y, 70, 26, 0, 0, TAU); ctx.fill();
  }
  const a = arena;
  ctx.save();
  ctx.globalAlpha = .3; ctx.fillStyle = '#1b0d3d';
  ctx.beginPath(); ctx.arc(a.cx, a.cy+16, a.r+12, 0, TAU); ctx.fill();
  ctx.globalAlpha = 1;
  // 縁
  ctx.beginPath(); ctx.arc(a.cx, a.cy, a.r+10, 0, TAU);
  ctx.fillStyle = '#ff5fa2'; ctx.fill();
  // 天板
  ctx.save();
  ctx.beginPath(); ctx.arc(a.cx, a.cy, a.r, 0, TAU); ctx.clip();
  ctx.fillStyle = '#ffe9f4'; ctx.fillRect(a.cx-a.r, a.cy-a.r, a.r*2, a.r*2);
  for(let y=-a.r; y<a.r; y+=56){
    for(let x=-a.r; x<a.r; x+=56){
      if((Math.round(x/56)+Math.round(y/56))%2 === 0){
        ctx.fillStyle = '#ffd4ea'; ctx.fillRect(a.cx+x, a.cy+y, 56, 56);
      }
    }
  }
  // 中心マーク
  ctx.strokeStyle = 'rgba(122,77,255,.25)'; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.arc(a.cx, a.cy, a.r*0.55, 0, TAU); ctx.stroke();
  ctx.restore();
  ctx.restore();
}

function drawCrown(){
  const sx = crown.x, sy = crown.y;
  ctx.save();
  ctx.globalAlpha = .25; ctx.fillStyle='#000';
  ctx.beginPath(); ctx.ellipse(sx, sy+4, 16, 8, 0,0,TAU); ctx.fill();
  ctx.globalAlpha = 1;
  const y = sy - crown.z;
  ctx.strokeStyle = crown.z <= 80 ? 'rgba(61,220,132,.95)' : 'rgba(122,77,255,.6)';
  ctx.lineWidth = 4; ctx.setLineDash([5,7]);
  ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx, y+16); ctx.stroke(); ctx.setLineDash([]);
  // 光
  const g = ctx.createRadialGradient(sx, y, 4, sx, y, 46);
  g.addColorStop(0,'rgba(255,220,90,.65)'); g.addColorStop(1,'rgba(255,220,90,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(sx,y,46,0,TAU); ctx.fill();
  ctx.translate(sx, y); ctx.scale(1+Math.sin(crown.t*0.08)*0.05, 1);
  ctx.fillStyle = '#ffd23f'; ctx.strokeStyle='#c48b00'; ctx.lineWidth=3;
  ctx.beginPath();
  ctx.moveTo(-17, 10); ctx.lineTo(-20,-12); ctx.lineTo(-8,-2); ctx.lineTo(0,-18);
  ctx.lineTo(8,-2); ctx.lineTo(20,-12); ctx.lineTo(17,10);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.arc(0,-1,3.4,0,TAU); ctx.fill();
  ctx.restore();
}

function drawBean(b){
  const sx = b.x - cam.x, sy = b.y - cam.y;
  if(sx < -70 || sx > VW+70 || sy < -110 || sy > VH+110) return;
  const z = Math.max(b.z, 0);
  const falling = b.state === 'fall';
  const k = falling ? Math.max(0, 1 - b.fallT/38) : 1;

  if(!falling){
    ctx.save();
    ctx.globalAlpha = clamp(0.30 - z*0.0022, 0.05, 0.30);
    ctx.fillStyle = '#000';
    const s = 1 - clamp(z,0,150)/300;
    ctx.beginPath(); ctx.ellipse(sx, sy+5, 15*s, 7.5*s, 0, 0, TAU); ctx.fill();
    ctx.restore();
  }

  ctx.save();
  ctx.translate(sx, sy - z);
  if(falling){ ctx.scale(k,k); ctx.globalAlpha = k; ctx.rotate(b.fallT*0.12); }
  if(b.state === 'tumble') ctx.rotate(b.spin);

  let rx = 15, ry = 17, lean = 0;
  if(b.state === 'dive' || b.state === 'prone'){
    ctx.rotate(b.face - Math.PI/2);
    rx = 13; ry = 21;
  } else {
    const sp = Math.hypot(b.vx,b.vy);
    lean = clamp(sp*0.05, 0, 0.3) * (b.vx>0?1:-1);
    ctx.rotate(lean*0.5);
    if(b.z > 1){ rx = 14; ry = 19; }
  }
  const legSwing = Math.sin(b.anim) * (b.state==='run' ? 5 : 0);
  // 脚
  ctx.fillStyle = '#ffd9a8';
  roundRect(-8, ry-6 + legSwing*0.4, 7, 12, 3.5); ctx.fill();
  roundRect(1, ry-6 - legSwing*0.4, 7, 12, 3.5); ctx.fill();
  // 腕
  ctx.fillStyle = b.color;
  ctx.save(); ctx.rotate(-legSwing*0.05);
  ctx.beginPath(); ctx.ellipse(-rx-1, 1, 5, 8, -0.3, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse( rx+1, 1, 5, 8,  0.3, 0, TAU); ctx.fill();
  ctx.restore();
  // 胴
  ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, 0, TAU);
  ctx.fillStyle = b.color; ctx.fill();
  ctx.lineWidth = 2.5; ctx.strokeStyle = 'rgba(0,0,0,.16)'; ctx.stroke();
  // 衣装ライン
  ctx.save();
  ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, 0, TAU); ctx.clip();
  ctx.fillStyle = b.isPlayer ? '#ff2d87' : 'rgba(255,255,255,.35)';
  ctx.fillRect(-rx, ry*0.25, rx*2, ry);
  ctx.fillStyle = 'rgba(255,255,255,.35)';
  ctx.beginPath(); ctx.ellipse(-rx*0.35, -ry*0.45, rx*0.4, ry*0.25, -0.5, 0, TAU); ctx.fill();
  ctx.restore();
  // 顔
  const stunned = b.stun > 0 || b.state === 'tumble';
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.ellipse(-5.6, -4, 4.2, 5, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse( 5.6, -4, 4.2, 5, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#2b1d47';
  if(stunned){
    ctx.lineWidth = 2; ctx.strokeStyle = '#2b1d47';
    ctx.beginPath(); ctx.moveTo(-8,-6.5); ctx.lineTo(-3,-1.5); ctx.moveTo(-3,-6.5); ctx.lineTo(-8,-1.5);
    ctx.moveTo(3,-6.5); ctx.lineTo(8,-1.5); ctx.moveTo(8,-6.5); ctx.lineTo(3,-1.5); ctx.stroke();
  } else {
    const ex = clamp(b.vx*0.4,-1.6,1.6), ey = clamp(b.vy*0.4,-1.4,1.4);
    ctx.beginPath(); ctx.arc(-5.6+ex, -4+ey, 2.3, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc( 5.6+ex, -4+ey, 2.3, 0, TAU); ctx.fill();
  }
  ctx.strokeStyle = '#2b1d47'; ctx.lineWidth = 1.6;
  ctx.beginPath();
  if(b.z > 6 || b.state==='dive') ctx.arc(0, 4.5, 3, 0.1*Math.PI, 0.9*Math.PI);
  else ctx.arc(0, 3, 3.4, 0.15*Math.PI, 0.85*Math.PI);
  ctx.stroke();

  if(b === G.winner){
    ctx.fillStyle='#ffd23f'; ctx.strokeStyle='#c48b00'; ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(-11,-ry-4); ctx.lineTo(-13,-ry-16); ctx.lineTo(-5,-ry-9); ctx.lineTo(0,-ry-19);
    ctx.lineTo(5,-ry-9); ctx.lineTo(13,-ry-16); ctx.lineTo(11,-ry-4);
    ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  ctx.restore();

  // プレイヤーマーカー
  if(b.isPlayer && !falling){
    const by = sy - z - 34 - Math.abs(Math.sin(G.elapsed*0.08))*4;
    ctx.save();
    ctx.fillStyle = '#ffd23f'; ctx.strokeStyle='#8a5a00'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(sx-9, by-10); ctx.lineTo(sx+9, by-10); ctx.lineTo(sx, by); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.font = '900 12px sans-serif'; ctx.textAlign='center';
    ctx.lineWidth = 3.5; ctx.strokeStyle='rgba(0,0,0,.55)';
    ctx.strokeText('YOU', sx, by-14); ctx.fillStyle='#fff'; ctx.fillText('YOU', sx, by-14);
    ctx.textAlign='left';
    ctx.restore();
  }
  if(b.inv > 40 && !falling && Math.floor(G.elapsed/4)%2===0){
    ctx.save(); ctx.globalAlpha=.35; ctx.strokeStyle='#fff'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(sx, sy-z, 24, 0, TAU); ctx.stroke(); ctx.restore();
  }
}

function drawParts(){
  for(const p of parts){
    const sx = p.x-cam.x, sy = p.y-cam.y-p.z;
    ctx.save(); ctx.translate(sx,sy); ctx.rotate(p.rot);
    ctx.globalAlpha = clamp(p.life/26,0,1);
    ctx.fillStyle = p.c;
    ctx.fillRect(-p.r/2, -p.r/2, p.r, p.r*1.5);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

function drawProgress(){
  const x = VW-30, y0 = 96, y1 = 556;
  ctx.save();
  ctx.fillStyle = 'rgba(40,20,80,.55)';
  roundRect(x-11, y0-14, 22, y1-y0+28, 11); ctx.fill();
  ctx.fillStyle = '#ffd23f';
  ctx.beginPath(); ctx.arc(x, y0-6, 5, 0, TAU); ctx.fill();
  const span = world.goalY - 300;
  for(const b of G.beans){
    if(b.out) continue;
    const t = clamp((b.y-300)/span, 0, 1);
    const py = y1 - (y1-y0)*t;
    ctx.beginPath(); ctx.arc(x, py, b.isPlayer?7:4.5, 0, TAU);
    ctx.fillStyle = b.done ? '#3ddc84' : b.color; ctx.fill();
    if(b.isPlayer){ ctx.lineWidth=2.5; ctx.strokeStyle='#ff2d87'; ctx.stroke(); }
  }
  ctx.restore();
}

function drawCountdown(){
  if(G.freeze <= 0) return;
  const n = Math.ceil((G.freeze-30)/40);
  let txt = null;
  if(G.freeze > 30) txt = (n>=1 && n<=4) ? String(Math.min(3,n)) : null;
  else txt = 'GO!';
  if(!txt) return;
  const sc = 1 + (1 - ((G.freeze%40)/40))*0.25;
  ctx.save();
  ctx.translate(VW/2, VH/2-40); ctx.scale(sc,sc);
  ctx.font = '900 110px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.lineWidth = 12; ctx.strokeStyle='rgba(58,37,96,.85)'; ctx.strokeText(txt,0,0);
  ctx.fillStyle = txt==='GO!' ? '#3ddc84' : '#ffd23f'; ctx.fillText(txt,0,0);
  ctx.restore();
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';
}

function draw(){
  ctx.save();
  if(G.shake > 0){ ctx.translate(rnd(-G.shake,G.shake)*0.6, rnd(-G.shake,G.shake)*0.6); }

  if(G.mode === 'race'){
    drawRaceFloor();
    const drawables = obstacles.slice().sort((a,b)=> (a.y||a.cy||0)-(b.y||b.cy||0));
    for(const o of drawables) if(o.kind !== 'fruitlane') o.draw();
    for(const o of obstacles) if(o.kind === 'fruitlane') o.draw();
  } else {
    drawArenaFloor(G.mode === 'final');
    for(const o of obstacles) if(o.kind !== 'rotbar') o.draw();
  }

  const sorted = G.beans.slice().sort((a,b)=> a.y - b.y);
  for(const b of sorted) drawBean(b);

  if(G.mode !== 'race'){ for(const o of obstacles) if(o.kind === 'rotbar') o.draw(); }
  if(G.mode === 'final' && !G.winner) drawCrown();

  drawParts();
  ctx.restore();

  if(G.mode === 'race') drawProgress();
  drawCountdown();

  if(G.flash > 0){
    ctx.fillStyle = 'rgba(255,255,255,'+(G.flash/22)+')';
    ctx.fillRect(0,0,VW,VH);
  }
  if(G.spectate){
    ctx.save();
    ctx.fillStyle='rgba(58,37,96,.75)'; roundRect(VW/2-72, 8, 144, 30, 15); ctx.fill();
    ctx.fillStyle='#fff'; ctx.font='900 15px sans-serif'; ctx.textAlign='center';
    ctx.fillText('観戦モード', VW/2, 28); ctx.textAlign='left';
    ctx.restore();
  }
}

// ---------------------------------------------------------------- HUD/UI
function updateHUD(){
  const R = ROUNDS[G.roundIdx];
  document.getElementById('rname').textContent = R.name + '　' + R.title;
  document.getElementById('rtime').textContent = Math.ceil(Math.max(0,G.timeLeft)/60);
  const alive = G.beans.filter(b=>!b.out).length;
  if(G.mode === 'race') document.getElementById('rqual').textContent = G.finishOrder.length + ' / ' + R.qualify;
  else if(G.mode === 'jump') document.getElementById('rqual').textContent = '残り ' + alive + '（' + R.qualify + '人まで）';
  else document.getElementById('rqual').textContent = crown.z <= 80 ? '王冠：ジャンプで届く！' : '王冠：まだ高い…';
}
const ov = document.getElementById('ov'), card = document.getElementById('card');
function openOv(html){ card.innerHTML = html; ov.classList.remove('hide'); }
function closeOv(){ ov.classList.add('hide'); }

function showTitle(){
  G.phase = 'title';
  openOv(
    '<div class="tag">FALL GUYS 風パーティ</div>'+
    '<h1>TUMBLE PARTY</h1>'+
    '<p>20人のビーンが3ラウンドを勝ち抜くドタバタ・バトルロイヤル。<br>ぶつかり、転び、扉を破って、最後の王冠を掴め！</p>'+
    '<div class="keys">'+
      '<div class="key">移動：← ↑ ↓ → / WASD</div>'+
      '<div class="key">ジャンプ：SPACE</div>'+
      '<div class="key">ダイブ：SHIFT / J</div>'+
      '<div class="key">スマホ：左スティック＋右ボタン</div>'+
    '</div>'+
    '<p style="font-size:13px">ROUND1 レース → ROUND2 サバイバル → FINAL 王冠争奪</p>'+
    '<button class="btn" id="bStart">スタート！</button>'
  );
  document.getElementById('bStart').onclick = ()=>{ ac(); closeOv(); startGame(); };
}
function showIntro(R){
  openOv(
    '<div class="tag">'+R.name+'</div>'+
    '<h1>'+R.title+'</h1>'+
    '<p>'+R.rule+'</p>'+
    '<p style="color:#c2185b;font-weight:800">'+
      (R.id==='final' ? '生き残り '+G.beans.length+'人 → 優勝 1人'
                      : '参加 '+G.beans.length+'人 → 通過 '+R.qualify+'人')+'</p>'+
    '<button class="btn" id="bGo">レディ！</button>'
  );
  document.getElementById('bGo').onclick = ()=>{ ac(); closeOv(); G.phase='play'; G.freeze = 190; };
}
function nameChip(b, cls){
  return '<div class="nm '+cls+(b.isPlayer?' me':'')+'"><i style="background:'+(b.isPlayer?'#ff2d87':b.color)+'"></i>'+b.name+'</div>';
}
function showResult(qualified, eliminated){
  const p = G.player;
  const pQual = qualified.indexOf(p) >= 0;
  const R = ROUNDS[G.roundIdx];
  const last = G.roundIdx >= ROUNDS.length-1;
  let head, body = '';
  if(last){
    if(G.winner === p) head = '<div class="tag">CHAMPION</div><h1>👑 優勝！！</h1><p>20人の頂点に立った！ 王冠はあなたのもの！</p>';
    else if(G.winner && G.spectate) head = '<div class="tag">FINAL</div><h1>優勝：'+G.winner.name+'</h1>'+
         '<p>あなたの最終順位は <b>'+(p.finalRank||START_BEANS)+' 位</b> / '+START_BEANS+'人中</p>';
    else if(G.winner) head = '<div class="tag">FINAL</div><h1>惜しい！</h1><p>優勝は <b>'+G.winner.name+'</b>。あと少しだった…</p>';
    else head = '<div class="tag">FINAL</div><h1>時間切れ</h1><p>誰も王冠を掴めなかった…</p>';
  } else if(G.spectate){
    head = '<div class="tag">'+R.name+' 結果</div><h1>'+R.title+'</h1>';
  } else if(pQual){
    head = '<div class="tag">'+R.name+' 結果</div><h1>QUALIFIED!</h1>'+
           '<p>'+(G.mode==='race' ? '<b>'+p.place+'位</b>でゴール通過！' : '生き残った！')+'</p>';
  } else {
    head = '<div class="tag">'+R.name+' 結果</div><h1>ELIMINATED…</h1>'+
           '<p>最終順位 <b>'+(p.finalRank||G.beans.length)+' 位</b> / '+START_BEANS+'人中</p>';
  }
  body += '<div class="sect">通過 '+qualified.length+'</div><div class="grid">';
  qualified.forEach(b=> body += nameChip(b,'q'));
  body += '</div>';
  if(eliminated.length){
    body += '<div class="sect">脱落 '+eliminated.length+'</div><div class="grid">';
    eliminated.forEach(b=> body += nameChip(b,'o'));
    body += '</div>';
  }
  let btns = '';
  if(last) btns = '<button class="btn" id="bAgain">もう一度あそぶ</button>';
  else if(pQual || G.spectate) btns = '<button class="btn" id="bNext">次のラウンドへ</button>';
  else btns = '<button class="btn" id="bAgain">もう一度あそぶ</button>'+
              '<button class="btn sub" id="bWatch">観戦を続ける</button>';
  openOv(head + body + btns);
  const bn = document.getElementById('bNext'), ba = document.getElementById('bAgain'), bw = document.getElementById('bWatch');
  const go = ()=>{
    closeOv();
    G.beans = qualified.slice();
    if(G.beans.indexOf(G.player) < 0) G.spectate = true;
    startRound(G.roundIdx+1);
  };
  if(bn) bn.onclick = go;
  if(bw) bw.onclick = go;
  if(ba) ba.onclick = ()=>{ closeOv(); showTitle(); };
}

// ---------------------------------------------------------------- メインループ
let acc = 0, last = performance.now();
function tick(now){
  requestAnimationFrame(tick);
  let dt = now - last; last = now;
  if(dt > 200) dt = 200;
  acc += dt;
  const step = 1000/60;
  let guard = 0;
  while(acc >= step && guard < 4){
    acc -= step; guard++;
    step1();
  }
  render();
}
function step1(){
  G.elapsed++;
  if(G.shake > 0) G.shake -= 0.7;
  if(G.flash > 0) G.flash--;
  if(bannerT > 0){ if(--bannerT === 0) document.getElementById('banner').style.opacity = 0; }
  updateParts();

  if(G.phase !== 'play') return;

  if(G.freeze > 0){
    if(G.freeze % 40 === 0 && G.freeze > 40) sfx.count();
    if(G.freeze === 30) sfx.go();
    G.freeze--;
  } else if(G.endT === 0){
    G.timeLeft--; G.rt++;
  }
  if(G.mode === 'race') updateRace();
  else if(G.mode === 'jump') updateJump();
  else updateFinal();
  updateHUD();
}
function render(){
  ctx.clearRect(0,0,VW,VH);
  if(G.phase === 'title'){
    // タイトル背景
    ctx.fillStyle = '#5f3fb8'; ctx.fillRect(0,0,VW,VH);
    ctx.save();
    for(let i=0;i<26;i++){
      const x = (i*137 + G.elapsed*0.6) % (VW+120) - 60;
      const y = 90 + ((i*211)%460) + Math.sin(G.elapsed*0.02+i)*16;
      ctx.globalAlpha = .5;
      ctx.fillStyle = COLORS[i%COLORS.length];
      ctx.beginPath(); ctx.ellipse(x, y, 16, 19, Math.sin(G.elapsed*0.03+i)*0.2, 0, TAU); ctx.fill();
    }
    ctx.restore();
    return;
  }
  draw();
}
requestAnimationFrame(tick);
showTitle();
</script>

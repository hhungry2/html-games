<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>PIXEL ZOO ちいさなドットのどうぶつえん</title>
<style>
  :root{
    --cream:#fff6e6; --cream2:#ffe9c8; --line:#e0c49a; --ink:#4a3524; --dim:#957a5c;
    --green:#5bb46b; --green2:#489a58; --pink:#ff8fa8; --blue:#6fb6e8; --gold:#f5b942;
    --shadow:0 3px 0 rgba(122,90,58,.28);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0; background:#20344a; color:var(--ink); overflow:hidden;
    font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;
    font-size:14px; line-height:1.5; -webkit-text-size-adjust:100%;
    user-select:none; -webkit-user-select:none;
  }
  #app{position:fixed; inset:0; display:flex; flex-direction:column}

  /* ---------- HUD (§3.2) ---------- */
  #hud{
    flex:0 0 auto; background:var(--cream); border-bottom:3px solid var(--line);
    padding:calc(env(safe-area-inset-top) + 6px) 10px 6px;
    display:flex; align-items:center; gap:8px; min-height:44px; z-index:5;
  }
  .hchip{
    display:flex; align-items:center; gap:4px; font-size:13px; font-weight:700;
    background:var(--cream2); border:2px solid var(--line); border-radius:999px; padding:2px 10px;
    white-space:nowrap;
  }
  #hudTime{flex:0 1 auto; overflow:hidden; text-overflow:ellipsis}
  #hudCoin{color:#a97400}
  #hudRate{font-size:11px; color:var(--dim); font-weight:600; white-space:nowrap}
  #hud .sp{flex:1 1 auto}
  #btnMute{
    flex:0 0 auto; width:36px; height:36px; border-radius:50%; border:2px solid var(--line);
    background:var(--cream2); font-size:16px; cursor:pointer; color:var(--ink);
  }
  #btnMute.off{opacity:.5}

  /* ---------- stage ---------- */
  #stage{position:relative; flex:1 1 auto; min-height:0; overflow:hidden; background:#8fd3ff}
  #cv{display:block; touch-action:none; image-rendering:pixelated; image-rendering:crisp-edges; outline:none}
  .float{
    position:absolute; right:10px; width:46px; height:46px; border-radius:50%;
    border:3px solid var(--line); background:var(--cream); font-size:20px; cursor:pointer;
    box-shadow:0 2px 6px rgba(0,0,0,.25); display:flex; align-items:center; justify-content:center;
  }
  #btnFood{bottom:66px}
  #btnCam{bottom:12px}
  #btnFood.on{background:var(--pink); border-color:#e0637f}
  #tut{
    position:absolute; left:50%; top:14px; transform:translateX(-50%);
    background:var(--cream); border:3px solid var(--line); border-radius:14px;
    padding:8px 14px; font-size:13px; font-weight:700; box-shadow:var(--shadow);
    max-width:88%; text-align:center; z-index:3;
  }
  #tut:after{
    content:""; position:absolute; left:50%; bottom:-11px; margin-left:-8px;
    border:8px solid transparent; border-top-color:var(--line); border-bottom:0;
  }

  /* ---------- tabs ---------- */
  #tabs{
    flex:0 0 auto; background:var(--cream); border-top:3px solid var(--line);
    display:flex; padding-bottom:env(safe-area-inset-bottom); z-index:5;
  }
  #tabs button{
    flex:1; min-height:56px; border:0; background:none; cursor:pointer; position:relative;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
    font-size:10.5px; color:var(--dim); font-weight:700; font-family:inherit; padding:4px 0;
  }
  #tabs button b{font-size:19px; line-height:1; font-weight:400}
  #tabs button.on{color:var(--green2)}
  #tabs button.on:after{
    content:""; position:absolute; top:0; left:22%; right:22%; height:4px;
    background:var(--green); border-radius:0 0 4px 4px;
  }
  .badge{
    position:absolute; top:6px; right:50%; margin-right:-24px; min-width:18px; height:18px;
    border-radius:9px; background:var(--pink); color:#fff; font-size:11px; line-height:18px;
    text-align:center; padding:0 4px; box-shadow:0 1px 2px rgba(0,0,0,.3);
  }
  .hide{display:none !important}

  /* ---------- panels (SC-02/03/04) ---------- */
  #panel{
    position:absolute; inset:0; background:var(--cream); z-index:8;
    display:flex; flex-direction:column;
  }
  #panelHead{
    flex:0 0 auto; display:flex; align-items:center; gap:8px; padding:10px 12px;
    border-bottom:3px solid var(--line); background:var(--cream2);
  }
  #panelHead h2{margin:0; font-size:17px; flex:1}
  .xbtn{
    width:38px; height:38px; border-radius:50%; border:2px solid var(--line);
    background:var(--cream); font-size:18px; cursor:pointer; color:var(--ink); line-height:1;
  }
  #panelBody{flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:12px 12px 30px}
  h3.sec{
    font-size:13px; letter-spacing:.08em; color:var(--dim); margin:16px 0 8px;
    border-bottom:2px dotted var(--line); padding-bottom:4px;
  }
  h3.sec:first-child{margin-top:0}
  .row{
    display:flex; align-items:center; gap:10px; background:#fff; border:2px solid var(--line);
    border-radius:12px; padding:8px 10px; margin:8px 0;
  }
  .row canvas{image-rendering:pixelated; flex:0 0 auto}
  .row .info{flex:1 1 auto; min-width:0}
  .row .nm{font-weight:700; font-size:14px}
  .row .sub{font-size:11.5px; color:var(--dim); line-height:1.4}
  .row.lock{opacity:.55; background:#f3ece1}
  .buy{
    flex:0 0 auto; min-width:84px; min-height:44px; border-radius:12px; border:0;
    background:var(--green); color:#fff; font-weight:700; font-size:13px; cursor:pointer;
    box-shadow:0 3px 0 var(--green2); font-family:inherit; padding:4px 10px;
  }
  .buy:active{transform:translateY(2px); box-shadow:0 1px 0 var(--green2)}
  .buy.have{background:var(--blue); box-shadow:0 3px 0 #4a90c4}
  .buy[disabled]{background:#c9bcab; box-shadow:0 3px 0 #ab9d8b; cursor:default}
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(94px,1fr)); gap:8px}
  .bcard{
    background:#fff; border:2px solid var(--line); border-radius:12px; padding:6px 4px;
    text-align:center; cursor:pointer;
  }
  .bcard canvas{image-rendering:pixelated}
  .bcard .nm{font-size:12px; font-weight:700; margin-top:2px}
  .bcard.locked{background:#efe6d8; color:#b4a punkt}
  .bcard.locked .nm{color:#b4a691}
  .bcard .q{font-size:30px; color:#cbbba4; line-height:1.6}
  .note{
    background:#fffbf0; border-left:4px solid var(--gold); border-radius:0 10px 10px 0;
    padding:8px 12px; font-size:12px; color:var(--dim); margin:10px 0;
  }
  label.opt{display:flex; align-items:center; gap:10px; margin:12px 0; font-size:13px; font-weight:700}
  label.opt input[type=range]{flex:1}
  .segs{display:flex; gap:6px}
  .segs button{
    flex:1; min-height:44px; border:2px solid var(--line); background:#fff; border-radius:10px;
    font-family:inherit; font-weight:700; font-size:13px; cursor:pointer; color:var(--ink);
  }
  .segs button.on{background:var(--green); color:#fff; border-color:var(--green2)}
  .danger{
    width:100%; min-height:44px; border-radius:12px; border:0; background:#e2705f; color:#fff;
    font-weight:700; font-family:inherit; font-size:13px; cursor:pointer; box-shadow:0 3px 0 #b8503f;
  }

  /* ---------- animal card (SC-05) ---------- */
  #sheet{
    position:absolute; left:0; right:0; bottom:0; z-index:9;
    background:var(--cream); border-top:3px solid var(--line); border-radius:18px 18px 0 0;
    padding:12px 14px calc(env(safe-area-inset-bottom) + 14px);
    max-width:560px; margin:0 auto;
    box-shadow:0 -4px 18px rgba(0,0,0,.28); transform:translateY(105%);
    transition:transform .22s ease-out;
  }
  #sheet.on{transform:translateY(0)}
  #sheetTop{display:flex; gap:12px; align-items:flex-start}
  #sheetPic{image-rendering:pixelated; flex:0 0 auto; background:#ffeccf; border:2px solid var(--line); border-radius:12px}
  #sheetInfo{flex:1 1 auto; min-width:0}
  .kv{display:grid; grid-template-columns:60px 1fr; gap:1px 8px; font-size:12.5px; align-items:center}
  .kv i{color:var(--dim); font-style:normal}
  #nameIn{
    font-family:inherit; font-size:15px; font-weight:700; color:var(--ink); width:100%;
    border:2px dashed transparent; border-radius:8px; background:none; padding:1px 4px; min-width:0;
  }
  #nameIn:focus{border-color:var(--line); background:#fff; outline:none}
  .bar{display:block; height:10px; background:#e6d8c2; border-radius:5px; overflow:hidden; border:1px solid var(--line)}
  .bar i{display:block; height:100%; background:var(--gold); border-radius:4px}
  #sheetBtns{display:flex; gap:8px; margin-top:12px}
  #sheetBtns button{
    flex:1; min-height:48px; border-radius:14px; border:0; font-family:inherit; font-weight:700;
    font-size:14px; color:#fff; cursor:pointer;
  }
  #btnPet{background:var(--pink); box-shadow:0 3px 0 #d9647f}
  #btnFeed{background:var(--gold); box-shadow:0 3px 0 #c78f22}
  #sheetBtns button[disabled]{background:#c9bcab; box-shadow:0 3px 0 #ab9d8b}
  #sheetClose{position:absolute; right:12px; top:10px}

  /* ---------- modal / toast ---------- */
  #modal{position:absolute; inset:0; z-index:12; background:rgba(30,20,10,.42); display:flex; align-items:center; justify-content:center; padding:20px}
  #modalBox{background:var(--cream); border:3px solid var(--line); border-radius:18px; padding:18px; max-width:340px; width:100%; text-align:center; box-shadow:0 6px 24px rgba(0,0,0,.3)}
  #modalMsg{font-size:14px; font-weight:700; margin-bottom:14px; white-space:pre-wrap; line-height:1.7}
  #modalBtns{display:flex; gap:8px}
  #modalBtns button{flex:1; min-height:46px; border-radius:12px; border:0; font-family:inherit; font-weight:700; font-size:14px; cursor:pointer}
  #mOk{background:var(--green); color:#fff; box-shadow:0 3px 0 var(--green2)}
  #mNg{background:#e4d8c4; color:var(--ink); box-shadow:0 3px 0 #c3b49c}
  #toast{
    position:absolute; left:50%; bottom:84px; transform:translateX(-50%) translateY(14px);
    background:rgba(52,36,22,.92); color:#fff; font-size:13px; font-weight:700;
    padding:8px 16px; border-radius:999px; z-index:11; opacity:0; transition:.25s; pointer-events:none;
    max-width:90%; text-align:center;
  }
  #toast.on{opacity:1; transform:translateX(-50%) translateY(0)}
  @media (prefers-reduced-motion:reduce){
    #sheet{transition:none}
    #toast{transition:none}
  }
</style>
</head>
<body>
<div id="app">

  <header id="hud">
    <span class="hchip" id="hudTime">☀ あさ 7:00</span>
    <span class="hchip" id="hudCoin">🪙 0</span>
    <span class="hchip" id="hudGuest">👥 0</span>
    <span class="sp"></span>
    <span id="hudRate">+0 /ぷん</span>
    <button id="btnMute" title="おと">♪</button>
  </header>

  <div id="stage">
    <canvas id="cv" tabindex="0"></canvas>
    <div id="tut" class="hide">どうぶつを タップしてみてね</div>
    <button class="float" id="btnFood" title="ごはん">🍎</button>
    <button class="float" id="btnCam" title="しゃしん">📷</button>

    <div id="panel" class="hide">
      <div id="panelHead"><h2 id="panelTitle"></h2><button class="xbtn" id="panelClose">×</button></div>
      <div id="panelBody"></div>
    </div>
  </div>

  <nav id="tabs">
    <button data-tab="home" class="on"><b>🏠</b>ホーム</button>
    <button data-tab="shop"><b>🛒</b>ショップ<i class="badge hide" id="shopBadge">!</i></button>
    <button data-tab="book"><b>📖</b>ずかん</button>
    <button data-tab="opt"><b>⚙</b>せってい</button>
  </nav>

  <div id="sheet">
    <button class="xbtn" id="sheetClose">×</button>
    <div id="sheetTop">
      <canvas id="sheetPic" width="96" height="96"></canvas>
      <div id="sheetInfo"></div>
    </div>
    <div id="sheetBtns">
      <button id="btnPet">なでる</button>
      <button id="btnFeed">ごはん</button>
    </div>
  </div>

  <div id="modal" class="hide">
    <div id="modalBox">
      <div id="modalMsg"></div>
      <div id="modalBtns"><button id="mNg">やめる</button><button id="mOk">はい</button></div>
    </div>
  </div>

  <div id="toast"></div>
</div>

/* =====================================================================
   §4.4 描画パイプライン ― 文字列 → 拡大済みオフスクリーン（起動時にベイク）
   ===================================================================== */
function bake(rows, pal, scale, flip){
  var w = rows[0].length, h = rows.length;
  var cv = document.createElement('canvas');
  cv.width = w*scale; cv.height = h*scale;
  var g = cv.getContext('2d');
  g.imageSmoothingEnabled = false;
  for(var y=0;y<h;y++){
    var row = rows[y];
    for(var x=0;x<w;x++){
      var col = pal[row.charAt(flip ? (w-1-x) : x)];
      if(!col) continue;
      g.fillStyle = col;
      g.fillRect(x*scale, y*scale, scale, scale);
    }
  }
  return cv;
}

/* §4.6 表情差分 ― 目の行だけ差し替える（ふつう／まばたき／にっこり／おどろき） */
function expr(rows, eye, mode){
  if(mode === 'normal') return rows;
  var out = rows.slice(), i;
  var r0 = eye.rows[0], r1 = eye.rows[1], cols = eye.cols, half = cols.length/2;
  var baseL = rows[r0].charAt(cols[0]-1), baseR = rows[r0].charAt(cols[cols.length-1]+1);
  function set(r,c,ch){ var s = out[r].split(''); s[c] = ch; out[r] = s.join(''); }
  function base(i){ return i < half ? baseL : baseR; }
  if(mode === 'blink'){
    for(i=0;i<cols.length;i++){ set(r0, cols[i], base(i)); set(r1, cols[i], 'o'); }
  } else if(mode === 'smile'){
    for(i=0;i<cols.length;i++){
      var outer = (i % half === 0) === (i < half);
      set(r0, cols[i], outer ? 'o' : base(i));
      set(r1, cols[i], outer ? base(i) : 'o');
    }
  } else if(mode === 'surprise'){
    for(i=0;i<cols.length;i++){ set(r0, cols[i], 'o'); set(r1, cols[i], 'o'); }
    if(r0-1 >= 0){ set(r0-1, cols[0], 'o'); set(r0-1, cols[cols.length-1], 'o'); }
  }
  return out;
}

var cache = {};
function spriteOf(spK, rare, scale, mode, flip){
  var key = spK+':'+(rare?1:0)+':'+scale+':'+mode+':'+(flip?1:0);
  var c = cache[key];
  if(c) return c;
  var sp = SPECIES[spK], pal = {}, p;
  for(p in sp.pal) pal[p] = sp.pal[p];
  if(rare && sp.rare) for(p in sp.rare) pal[p] = sp.rare[p];
  cache[key] = bake(expr(DOTS[spK], sp.eye, mode), pal, scale, flip);
  return cache[key];
}
function tailSprite(spK, rare, scale, flip){
  var key = 'tail:'+spK+':'+(rare?1:0)+':'+scale+':'+(flip?1:0);
  if(!cache[key]){
    var sp = SPECIES[spK], pal = {o:sp.pal.o, a:sp.pal.a};
    if(rare && sp.rare && sp.rare.a) pal.a = sp.rare.a;
    cache[key] = bake(TAIL, pal, scale, flip);
  }
  return cache[key];
}

function newAnimal(spK, rare, name){
  var sp = SPECIES[spK];
  return {
    id:'a'+(uid++), sp:spK, rare:!!rare, name:name || sp.name,
    area:null,                       /* 通常は種別どおり。ぴよ(★1)だけ親のエリアに住む */
    x:0, y:0, dir:1, st:'idle', stEnd:0, tx:0, ty:0,
    mood:3, fed:0.8, phase:Math.random(), blinkAt:0, earAt:0,
    sleepiness:0, lastPet:-1e9, em:null, emT:0, parent:null
  };
}
function areaOf(a){ return a.area || SPECIES[a.sp].area; }
function ownedOf(spK){ var n=0; for(var i=0;i<G.animals.length;i++) if(G.animals[i].sp===spK) n++; return n; }
function inArea(k){ var n=0; for(var i=0;i<G.animals.length;i++) if(areaOf(G.animals[i])===k) n++; return n; }
function hasArea(k){ return G.areas.indexOf(k) >= 0; }
/* 同種を増やすほど少し高くなる（初回は §6 の表の価格ちょうど）。
   うさぎ・ぺんぎんは「初期」＝価格0なので、2ひきめ以降だけ おむかえ料をとる */
function priceOf(spK){
  var base = SPECIES[spK].price || 90;
  /* §8.2「初回は割引で30秒」― 割引は最初の1ぴきだけ、しかも安い種にかぎる */
  var off = (G.bought === 0 && base <= 200) ? 0.25 : 1;
  return Math.round(base * (1 + 0.6*ownedOf(spK)) * off);
}

/* §8.1 収入の計算式 */
function economy(){
  var inc = 0, appeal = 0, cnt = {}, i, a, sp;
  for(i=0;i<G.animals.length;i++){ a = G.animals[i]; cnt[a.sp] = (cnt[a.sp]||0)+1; }
  for(i=0;i<G.animals.length;i++){
    a = G.animals[i]; sp = SPECIES[a.sp];
    var ap = sp.appeal + Math.min(4, cnt[a.sp]-1) + (a.rare ? 2 : 0);   /* §7.3 むれボーナス */
    appeal += ap;
    if(a.fed <= 0) continue;                       /* おなかが空くと収入が止まるだけ */
    inc += ap * (0.6 + a.mood*0.1) * areaDef(areaOf(a)).mult;
  }
  for(i=0;i<G.decor.length;i++) appeal += decorDef(G.decor[i].k).appeal;
  return { inc: inc*0.1, guests: Math.min(20, Math.round(appeal*0.6)) };
}

/* ---------- セーブ／ロード（§13.3・壊れていても画面にエラーを出さない） ---------- */
function save(){
  try{
    var d = { v:1, t:Date.now(), coin:Math.floor(G.coin), areas:G.areas, book:G.book,
      gmin:Math.round(G.gmin), weather:G.weather, wday:G.wday, bought:G.bought, tut:G.tut,
      opt:G.opt, decor:G.decor, animals:[] };
    for(var i=0;i<G.animals.length;i++){
      var a = G.animals[i];
      d.animals.push({ sp:a.sp, name:a.name, mood:a.mood, fed:Math.round(a.fed*100)/100, rare:a.rare, area:a.area });
    }
    localStorage.setItem(SAVE_KEY, JSON.stringify(d));
  }catch(e){}
}
function load(){
  var d = null;
  try{ d = JSON.parse(localStorage.getItem(SAVE_KEY)); }catch(e){ d = null; }
  if(!d || d.v !== 1 || !d.animals || !d.animals.length){ firstRun(); return 0; }
  try{
    G.coin = +d.coin || 0;
    G.areas = d.areas && d.areas.length ? d.areas : ['forest','snow'];
    G.book  = d.book || [];
    G.gmin  = typeof d.gmin === 'number' ? d.gmin : 7*60;
    G.weather = d.weather || 'sunny';
    G.wday = d.wday || 0; G.bought = d.bought || 0; G.tut = d.tut || 0;
    G.decor = d.decor || [];
    if(d.opt){ for(var k in G.opt) if(k in d.opt) G.opt[k] = d.opt[k]; }
    for(var i=0;i<d.animals.length;i++){
      var s = d.animals[i];
      if(!SPECIES[s.sp]) continue;
      var a = newAnimal(s.sp, s.rare, s.name);
      a.mood = clamp(+s.mood || 0, 0, 5);
      a.fed  = clamp(typeof s.fed === 'number' ? s.fed : 0.8, 0, 1);
      if(s.area && hasArea(s.area)) a.area = s.area;
      G.animals.push(a);
    }
    if(!G.animals.length){ firstRun(); return 0; }
    /* §8.3 時計の巻き戻し対策：保存時刻より現在が過去なら経過0 */
    var el = clamp(Date.now() - (+d.t || 0), 0, IDLE_CAP);
    return el;
  }catch(e){ G.animals = []; firstRun(); return 0; }
}
function firstRun(){
  G.coin = 0; G.areas = ['forest','snow']; G.decor = []; G.bought = 0; G.tut = 0;
  G.animals = [ newAnimal('rabbit', false, 'ぴょんた'), newAnimal('penguin', false, 'ぺんこ') ];
  G.book = ['rabbit','penguin'];
  G.gmin = 7*60; G.weather = 'sunny'; G.wday = 0;
}

var MEL = [
  0,-1, 4,-1, 7,-1, 4,-1,   2,-1, 7,-1, 9,-1,-1,-1,
  4,-1, 9,-1,12,-1, 9,-1,   7,-1, 4,-1, 2,-1,-1,-1,

function hz(semi){ return 440 * Math.pow(2, (60 + semi - 69)/12); }
function tone(freq, dur, type, vol, when){
  if(!AC) return;
  var t0 = when || AC.currentTime;
  var o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(master);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
function audioOn(){
  if(AC) { if(AC.state === 'suspended') AC.resume(); return; }
  try{
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain();
    master.gain.value = G.opt.muted ? 0 : G.opt.vol;
    master.connect(AC.destination);
    bgmNext = AC.currentTime + 0.1; bgmStep = 0;
  }catch(e){ AC = null; }
}
function setVol(){ if(master) master.gain.value = G.opt.muted ? 0 : G.opt.vol; }
function bgmTick(){
  if(!AC || G.opt.muted || G.opt.vol <= 0) return;
  var step = 60/76/2;                      /* 8分音符 */
  var tr = (phaseOfDay() === 'night') ? -5 : 0;   /* §12 よるは −5半音 */
  while(bgmNext < AC.currentTime + 0.25){
    var i = bgmStep % MEL.length, n = MEL[i];
    if(n >= 0) tone(hz(n + tr), step*1.5, 'triangle', 0.055, bgmNext);
    if(i % 8 === 0) tone(hz(BASS[(i/8)|0] + tr - 24), step*3, 'square', 0.03, bgmNext);
    bgmNext += step; bgmStep++;
  }
}
function sePet(){ if(!AC) return; var t=AC.currentTime; tone(hz(12),.10,'triangle',.10,t); tone(hz(16),.10,'triangle',.10,t+.06); tone(hz(19),.16,'triangle',.10,t+.12); }
function seFeed(){ if(!AC) return; var t=AC.currentTime; tone(hz(-8),.09,'square',.06,t); tone(hz(-5),.12,'square',.06,t+.09); }
function seBuy(){ if(!AC) return; var t=AC.currentTime; [12,16,19,24].forEach(function(n,i){ tone(hz(n),.14,'triangle',.09,t+i*.07); }); }
function seCoin(){ if(!AC) return; tone(hz(21),.09,'square',.05,AC.currentTime); }
function seEmo(){ if(!AC) return; tone(hz(24),.06,'triangle',.028,AC.currentTime); }

/* =====================================================================
   §3.2 レイアウト ／ §14.1 高DPI
   ===================================================================== */
var stage = document.getElementById('stage');
var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');
var view = { w:360, h:480, cw:360, ox:0, cols:2, penW:170, penH:135, top:8, laneY:0, worldH:600, scale:3 };
var scrollY = 0, scrollV = 0;
var pens = [];

function baseScale(){
  /* §4.4 基準スケール：整数倍のみ */
  return clamp(Math.round(view.cw/120), 3, 6);
}
function layout(){
  view.cw = Math.min(view.w, 960);
  view.ox = Math.round((view.w - view.cw)/2);
  view.cols = view.cw >= 700 ? 3 : 2;
  var pad = 10, gap = 10;
  view.penW = (view.cw - pad*2 - gap*(view.cols-1)) / view.cols;
  view.penH = clamp(Math.round(view.penW * 0.82), 120, 210);
  view.scale = G.opt.zoom ? G.opt.zoom : baseScale();
  pens = [];
  for(var i=0;i<AREAS.length;i++){
    var cx = i % view.cols, cy = (i / view.cols)|0;
    var x = view.ox + pad + cx*(view.penW+gap);
    var y = view.top + cy*(view.penH+gap);
    pens.push({ a:AREAS[i], x:x, y:y, w:view.penW, h:view.penH,
                rx:x+7, ry:y+24, rw:view.penW-14, rh:view.penH-32 });
  }
  var rows = Math.ceil(AREAS.length/view.cols);
  view.laneY = view.top + rows*(view.penH+gap) + 4;
  view.worldH = view.laneY + 52 + pad;
  for(var j=0;j<G.animals.length;j++) placeIn(G.animals[j], G.animals[j].x === 0);
  /* エリアの大きさが変わっても、落ち葉とかざりが枠の外に残らないようにする */
  for(var l=0;l<leaves.length;l++){
    var lp = penOf(leaves[l].a);
    leaves[l].x = clamp(leaves[l].x, lp.rx+8, lp.rx+lp.rw-8);
    leaves[l].y = clamp(leaves[l].y, lp.ry+10, lp.ry+lp.rh-4);
  }
  for(var m=0;m<G.decor.length;m++){
    var dp = penOf(G.decor[m].a);
    G.decor[m].x = clamp(G.decor[m].x, 10, dp.rw-10);
    G.decor[m].y = clamp(G.decor[m].y, 16, dp.rh);
  }
  clampScroll();
}
function penOf(k){ for(var i=0;i<pens.length;i++) if(pens[i].a.k === k) return pens[i]; return pens[0]; }
function spSize(a){ var d = DOTS[a.sp]; return { w:d[0].length*view.scale, h:d.length*view.scale }; }
function bounds(a){
  var p = penOf(areaOf(a)), s = spSize(a);
  var x0 = p.rx + s.w/2, x1 = p.rx + p.rw - s.w/2;
  var y0 = p.ry + Math.min(s.h, p.rh - 6), y1 = p.ry + p.rh;
  if(x1 < x0){ x0 = x1 = p.rx + p.rw/2; }
  if(y1 < y0){ y0 = y1 = p.ry + p.rh; }
  return { x0:x0, x1:x1, y0:y0, y1:y1 };
}
function placeIn(a, fresh){
  var b = bounds(a);
  if(fresh){ a.x = rnd(b.x0, b.x1); a.y = rnd(b.y0, b.y1); a.tx = a.x; a.ty = a.y; }
  a.x = clamp(a.x, b.x0, b.x1); a.y = clamp(a.y, b.y0, b.y1);
}
function resize(){
  var r = stage.getBoundingClientRect();
  view.w = Math.max(260, Math.floor(r.width));
  view.h = Math.max(200, Math.floor(r.height));
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(view.w*dpr); cv.height = Math.round(view.h*dpr);
  cv.style.width = view.w+'px'; cv.style.height = view.h+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.imageSmoothingEnabled = false;      /* §14.1 setTransform後に再設定 */
  layout();
}
function clampScroll(){ scrollY = clamp(scrollY, 0, Math.max(0, view.worldH - view.h)); }

/* =====================================================================
   §11 時間帯・天気
   ===================================================================== */
function phaseOfDay(){
  var h = G.gmin/60;
  if(h >= 5 && h < 9) return 'morning';
  if(h >= 9 && h < 16) return 'day';
  if(h >= 16 && h < 19) return 'evening';
  return 'night';
}
var PHASE = {
  morning:{ jp:'あさ', sky:['#ffd9a8','#a8d8ff'], tint:'rgba(255,220,180,.12)' },
  day    :{ jp:'ひる', sky:['#8fd3ff','#d6f0ff'], tint:null },
  evening:{ jp:'ゆうがた', sky:['#ff9e6b','#ffd6a0'], tint:'rgba(255,150,90,.16)' },
  night  :{ jp:'よる', sky:['#12203f','#26365e'], tint:'rgba(40,60,120,.26)' }
};
var WEATHER = {
  sunny:{ jp:'はれ', icon:'☀', p:0.55 }, cloudy:{ jp:'くもり', icon:'☁', p:0.25 },
  rain:{ jp:'あめ', icon:'☂', p:0.15 }, snow:{ jp:'ゆき', icon:'❅', p:0.05 }
};
function rollWeather(){
  var r = Math.random(), acc = 0;
  for(var k in WEATHER){ acc += WEATHER[k].p; if(r < acc){ G.weather = k; return; } }
  G.weather = 'sunny';
}

/* =====================================================================
   §7 行動AI
   ===================================================================== */
function setState(a, st, dur, now){ a.st = st; a.stEnd = now + dur; }
function emote(a, k, now){ a.em = k; a.emT = now; if(k === 'heart' || k === 'star') seEmo(); }

function updateAnimal(a, dt, now){
  var sp = SPECIES[a.sp], b = bounds(a);

  /* おなか（減るのはこれだけ。ごきげんは下がらない） */
  a.fed = clamp(a.fed - HUNGER_PER_SEC*dt, 0, 1);

  /* ねむけ（§7.2） */
  var night = phaseOfDay() === 'night';
  var sleepy = (night !== !!sp.nocturnal) ? 3 : 0.4;
  a.sleepiness += sleepy*dt;

  /* まばたき・耳ぴく（個体ごとに位相をずらす） */
  if(now > a.blinkAt) a.blinkAt = now + rnd(3, 7);
  if(now > a.earAt)   a.earAt   = now + rnd(5, 12);

  if(now >= a.stEnd){
    if(a.st === 'sleep'){ a.sleepiness = 0; setState(a, 'idle', rnd(2,5), now); }
    else if(a.st === 'eat'){ setState(a, 'idle', rnd(2,4), now); }
    else if(a.st === 'happy' || a.st === 'social'){ setState(a, 'idle', rnd(2,5), now); }
    else if(a.st === 'idle'){
      if(a.sleepiness > 100){ setState(a, 'sleep', rnd(6,20), now); emote(a, 'sleep', now); }
      else { a.tx = rnd(b.x0, b.x1); a.ty = rnd(b.y0, b.y1); setState(a, 'walk', 20, now); }
    } else { setState(a, 'idle', rnd(2,5), now); }
  }

  if(a.st === 'walk'){
    var dx = a.tx - a.x, dy = a.ty - a.y, d = Math.sqrt(dx*dx + dy*dy);
    if(d < 2){ setState(a, 'idle', rnd(2,5), now); }
    else {
      var v = sp.speed*dt;
      a.x += dx/d*v; a.y += dy/d*v;
      if(Math.abs(dx) > 1) a.dir = dx > 0 ? 1 : -1;
    }
  }
  a.x = clamp(a.x, b.x0, b.x1); a.y = clamp(a.y, b.y0, b.y1);

  /* ごきげん4以上でたまに ♪ */
  if(!a.em && a.mood >= 4 && a.st === 'idle' && Math.random() < 0.06*dt) emote(a, 'note', now);
  /* おなか30%未満は … だけ（責めない） */
  if(!a.em && a.fed < 0.3 && Math.random() < 0.05*dt) emote(a, 'dots', now);
  /* 来園者が前を通ると ！（おどろき顔になる） */
  if(!a.em && a.st === 'idle' && visitors.length && Math.random() < 0.02*dt) emote(a, 'excl', now);
  if(a.st === 'sleep' && (!a.em || now - a.emT > 2.4)) emote(a, 'sleep', now);
  if(a.em && now - a.emT > 1.2 && a.st !== 'sleep') a.em = null;
}

function separate(){
  /* §7.2 個体距離：重ならないよう押し出す（1フレーム1回）
     しきい値はスプライトの大きさに比例させる（ズームを上げても重ならない） */
  for(var i=0;i<G.animals.length;i++){
    for(var j=i+1;j<G.animals.length;j++){
      var a = G.animals[i], c = G.animals[j];
      if(areaOf(a) !== areaOf(c)) continue;
      var min = Math.max(10, (spSize(a).w + spSize(c).w)*0.34);
      var rdx = c.x - a.x, rdy = c.y - a.y;
      var d = Math.sqrt(rdx*rdx + rdy*rdy*2.56);   /* 奥行き方向は近くても気にならない */
      if(d > min) continue;
      if(d < 0.5){ rdx = 1; rdy = 0.6; d = 0.5; }  /* 完全に重なったら決め打ちでずらす */
      var k = (min - d)/d*0.5;
      a.x -= rdx*k; c.x += rdx*k;
      a.y -= rdy*k*0.6; c.y += rdy*k*0.6;
      placeIn(a, false); placeIn(c, false);
    }
  }
}
var socialT = 0;
function socialCheck(now){
  /* §7.3 なかよし：3秒ごとに ★ ＋ ごきげん微増（相性の悪い組み合わせは作らない） */
  if(now - socialT < 3) return;
  socialT = now;
  for(var i=0;i<G.animals.length;i++){
    var a = G.animals[i], fr = SPECIES[a.sp].friends;
    if(!fr.length || a.st === 'sleep') continue;
    for(var j=0;j<G.animals.length;j++){
      var c = G.animals[j];
      if(c === a || fr.indexOf(c.sp) < 0) continue;
      if(Math.abs(c.x-a.x) < 46 && Math.abs(c.y-a.y) < 26){
        if(a.mood < 5) a.mood = Math.min(5, a.mood + 0.12);
        if(!a.em){ emote(a, 'star', now); setState(a, 'social', rnd(3,6), now); }
        break;
      }
    }
  }
}

/* =====================================================================
   §11.3 パーティクル（固定長プール200・生成時に new しない）
   ===================================================================== */
var POOL = new Array(200), poolI = 0;
for(var _i=0;_i<200;_i++) POOL[_i] = { on:false, x:0, y:0, vx:0, vy:0, life:0, max:1, col:'#fff', sz:3 };
function emit(x, y, vx, vy, life, col, sz){
  if(REDUCE) return;
  for(var n=0;n<200;n++){
    var p = POOL[(poolI+n)%200];
    if(p.on) continue;
    poolI = (poolI+n+1)%200;
    p.on = true; p.x = x; p.y = y; p.vx = vx; p.vy = vy; p.life = p.max = life; p.col = col; p.sz = sz||3;
    return;
  }
}
function updateParticles(dt){
  for(var i=0;i<200;i++){
    var p = POOL[i]; if(!p.on) continue;
    p.life -= dt; if(p.life <= 0){ p.on = false; continue; }
    p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 60*dt;
  }
}

/* 雨・雪（専用の軽い配列） */
var drops = [];
function updateWeatherFx(dt){
  var want = REDUCE ? 0 : (G.weather === 'rain' ? 120 : (G.weather === 'snow' ? 70 : 0));
  while(drops.length < want) drops.push({ x:rnd(-40, view.w+40), y:rnd(-view.h, view.h), v:rnd(180,300), s:rnd(1,2) });
  while(drops.length > want) drops.pop();
  var rain = G.weather === 'rain';
  for(var i=0;i<drops.length;i++){
    var d = drops[i];
    d.y += (rain ? d.v : d.v*0.22)*dt;
    d.x += (rain ? 60 : Math.sin(d.y*0.03)*14)*dt;
    if(d.y > view.h){ d.y = -10; d.x = rnd(-40, view.w+40); }
  }
}

/* 来園者（装飾・当たり判定なし） */
var visitors = [];
function syncVisitors(guests, dt){
  var want = Math.min(20, Math.round(guests*0.6));
  while(visitors.length < want) visitors.push({
    x:rnd(0, view.w), dir:Math.random()<.5?1:-1, sp:rnd(14,26), ph:Math.random(),
    hi:ri(0,4), fi:ri(0,3), bi:ri(0,5), pi:ri(0,3), lane:ri(0,1)
  });
  while(visitors.length > want) visitors.pop();
  for(var i=0;i<visitors.length;i++){
    var v = visitors[i];
    v.x += v.sp*v.dir*dt;
    if(v.x < -20){ v.x = view.w+18; } if(v.x > view.w+20){ v.x = -18; }
  }
}

/* そうじ：落ち葉（放置してもマイナスなし・§9） */
var leaves = [], leafT = -1;
function updateLeaves(now){
  if(leafT < 0){ leafT = now + rnd(12, 30); return; }
  if(now > leafT && leaves.length < 4 && G.animals.length){
    leafT = now + rnd(18, 40);
    var k = pick(G.areas), p = penOf(k);
    leaves.push({ a:k, x:rnd(p.rx+8, p.rx+p.rw-8), y:rnd(p.ry+10, p.ry+p.rh-4), t:now });
  }
}

/* =====================================================================
   §5.1 手続きアニメーション（コマ絵を持たない）
   ===================================================================== */
function exprMode(a, t){
  if(a.st === 'sleep') return 'blink';
  if(a.st === 'happy' || a.st === 'social') return 'smile';
  if(a.em === 'excl') return 'surprise';
  if(t < a.blinkAt && a.blinkAt - t < 0.09) return 'blink';    /* まばたき90ms */
  return 'normal';
}
function drawAnimal(a, t){
  var sp = SPECIES[a.sp], S = view.scale, flip = a.dir < 0;
  var img = spriteOf(a.sp, a.rare, S, exprMode(a, t), flip);
  var w = img.width, h = img.height;
  var sy = a.y - scrollY;
  if(sy < -h-20 || sy > view.h+40) return;

  var slow = (a.st === 'sleep') ? 2.4 : 1.6;
  var ph  = (t/slow + a.phase)*Math.PI*2;
  var bob = Math.round(Math.sin(ph));                    /* ボブ：-1/0/+1px */
  var sq  = (a.st === 'walk') ? Math.round(Math.sin(ph + Math.PI)) : 0;
  var hop = 0;
  if(a.st === 'walk' && sp.move === 'hop') hop = -Math.abs(Math.sin(t*7 + a.phase*6))*4*(S/3);
  var x = Math.round(a.x - w/2), y = Math.round(sy - h + hop);

  /* 影（跳ねると小さくなる＝浮遊感） */
  var lift = Math.max(0, -hop);
  var shW = w*0.34*(1 - lift*0.012) * (phaseOfDay()==='evening' ? 1.6 : 1);
  ctx.fillStyle = 'rgba(0,0,0,.18)';
  ctx.beginPath();
  ctx.ellipse(Math.round(a.x), Math.round(sy), Math.max(3, shW), Math.max(1.5, S*0.9*(1-lift*0.01)), 0, 0, 6.284);
  ctx.fill();

  if(a === hoverA){
    ctx.fillStyle = 'rgba(255,255,255,.20)';
    ctx.fillRect(x-2, y-2, w+4, h+4);
  }
  /* しっぽ（sin で3位置） */
  if(sp.tail){
    var ts = tailSprite(a.sp, a.rare, S, flip);
    var toff = Math.round(Math.sin(t*2.4 + a.phase*6));
    ctx.drawImage(ts, flip ? Math.round(a.x + w/2 - S) : Math.round(a.x - w/2 - ts.width + S),
                  y + h - ts.height - S*3 + toff*S);
  }
  var half = Math.floor(DOTS[a.sp].length/2)*S;
  var earPx = sp.ears ? sp.ears*S : 0;
  var twitch = (sp.ears && t < a.earAt && a.earAt - t < 0.18) ? (Math.sin(t*40)>0 ? S : -S) : 0;

  if(twitch){
    ctx.drawImage(img, 0, 0, w, earPx, x+twitch, y+bob, w, earPx);
    ctx.drawImage(img, 0, earPx, w, half-earPx, x, y+bob+earPx, w, half-earPx);
  } else {
    ctx.drawImage(img, 0, 0, w, half, x, y+bob, w, half);
  }
  ctx.drawImage(img, 0, half, w, h-half, x, y+bob+half-sq, w, h-half+sq);

  /* §5.2 エモート：1.2秒・ふわっと上へ */
  if(a.em){
    var k = clamp((t - a.emT)/1.2, 0, 1);
    var es = emoSprite(a.em, Math.max(2, S-1));
    ctx.globalAlpha = a.st === 'sleep' ? 0.85 : (1 - k*k);
    ctx.drawImage(es, Math.round(a.x - es.width/2), Math.round(y - es.height - 2 - k*6));
    ctx.globalAlpha = 1;
  }
}

/* =====================================================================
   背景・エリア・フレーム描画
   ===================================================================== */
function rrect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function drawSky(t){
  var ph = PHASE[phaseOfDay()], g = ctx.createLinearGradient(0,0,0,view.h);
  g.addColorStop(0, ph.sky[0]); g.addColorStop(1, ph.sky[1]);
  ctx.fillStyle = g; ctx.fillRect(0,0,view.w,view.h);
  var par = REDUCE ? 0 : scrollY*0.2;
  if(phaseOfDay() === 'night'){
    ctx.fillStyle = 'rgba(255,255,255,.7)';
    for(var i=0;i<40;i++){
      var sx = (i*79)%view.w, sy = (i*53)%Math.max(60, view.h*0.6) - par*0.4;
      if(sy < -4) sy += view.h;
      if((Math.floor(t*1.2)+i)%7) ctx.fillRect(sx, sy, 2, 2);
    }
    ctx.fillStyle = '#fdf6d8';
    ctx.beginPath(); ctx.arc(view.w-46, 40-par*0.3, 16, 0, 6.284); ctx.fill();
    ctx.fillStyle = PHASE.night.sky[0];
    ctx.beginPath(); ctx.arc(view.w-38, 34-par*0.3, 14, 0, 6.284); ctx.fill();
  } else {
    ctx.fillStyle = phaseOfDay()==='evening' ? '#ffeaa0' : '#fff6c8';
    ctx.beginPath(); ctx.arc(view.w-48, 42-par*0.3, 17, 0, 6.284); ctx.fill();
    if(G.weather !== 'rain'){
      ctx.fillStyle = 'rgba(255,255,255,.68)';
      for(var c=0;c<4;c++){
        var cx = (c*161 + t*5) % (view.w+140) - 70, cy = 28 + (c%2)*34 - par*0.35;
        ctx.beginPath();
        ctx.ellipse(cx, cy, 30, 11, 0, 0, 6.284); ctx.fill();
        ctx.beginPath(); ctx.ellipse(cx+16, cy-7, 18, 9, 0, 0, 6.284); ctx.fill();
      }
    }
  }
  /* 遠景の丘と木立 ― §3.2「左右に木立の装飾を置いて間延びを防ぐ」
     エリアの下に重なると読みにくいので、余白のある画面でだけ左右に描く */
  var night = phaseOfDay() === 'night';
  ctx.fillStyle = night ? '#1d3a2e' : '#5d9a52';
  var hy = view.h - 40 - par*0.5;
  ctx.beginPath(); ctx.ellipse(-30, hy, 130, 56, 0, 0, 6.284); ctx.fill();
  ctx.beginPath(); ctx.ellipse(view.w+30, hy, 130, 56, 0, 0, 6.284); ctx.fill();
  if(view.ox > 46){
    var ts = decorSprite('tree', 3);
    for(var k=0;k<6;k++){
      var ty = 30 + k*88 - par;
      if(ty < -40 || ty > view.h) continue;
      ctx.drawImage(ts, Math.round(view.ox/2 - ts.width/2 + (k%2)*10), Math.round(ty));
      ctx.drawImage(ts, Math.round(view.w - view.ox/2 - ts.width/2 - (k%2)*10), Math.round(ty + 34));
    }
  }
}
function drawPenBg(p, t){
  var A = p.a, x = p.x, y = p.y - scrollY;
  var open = hasArea(A.k);
  rrect(x, y, p.w, p.h, 12);
  if(!open){
    ctx.fillStyle = 'rgba(255,255,255,.30)'; ctx.fill();
    ctx.setLineDash([7,6]); ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(90,70,50,.55)'; ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(70,52,36,.78)'; ctx.textAlign = 'center';
    ctx.font = 'bold 26px system-ui,sans-serif'; ctx.fillText('＋', x+p.w/2, y+p.h/2 - 2);
    ctx.font = 'bold 12px system-ui,sans-serif'; ctx.fillText(A.name, x+p.w/2, y+p.h/2 + 18);
    ctx.font = '11px system-ui,sans-serif'; ctx.fillText('🪙 '+comma(A.price), x+p.w/2, y+p.h/2 + 34);
    ctx.textAlign = 'left';
    return false;
  }
  var g = ctx.createLinearGradient(0, y, 0, y+p.h);
  g.addColorStop(0, A.g1); g.addColorStop(1, A.g2);
  ctx.fillStyle = g; ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = A.fence; ctx.stroke();

  ctx.save(); rrect(x, y, p.w, p.h, 12); ctx.clip();
  var i, bx;
  if(A.k === 'forest' || A.k === 'grass'){
    ctx.fillStyle = 'rgba(255,255,255,.13)';
    for(i=0;i<10;i++) ctx.fillRect(x+8+((i*37)%(p.w-16)), y+30+((i*53)%(p.h-38)), 4, 2);
    ctx.fillStyle = A.k==='forest' ? '#3f7f42' : '#67a04c';
    for(i=0;i<3;i++){ bx = x + 14 + i*(p.w-30)/2; ctx.beginPath(); ctx.arc(bx, y+34, 11, 0, 6.284); ctx.fill(); }
  } else if(A.k === 'snow'){
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    for(i=0;i<4;i++){ ctx.beginPath(); ctx.ellipse(x+18+i*(p.w-26)/3, y+p.h-8, 20, 9, 0, 0, 6.284); ctx.fill(); }
  } else if(A.k === 'pond'){
    ctx.fillStyle = '#69bfd8';
    ctx.beginPath(); ctx.ellipse(x+p.w/2, y+p.h*0.62, p.w*0.34, p.h*0.24, 0, 0, 6.284); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.45)';
    ctx.fillRect(x+p.w/2-14, y+p.h*0.62 - 6 + Math.sin(t*2)*2, 20, 2);
  } else if(A.k === 'bamboo'){
    ctx.fillStyle = '#87b05a';
    for(i=0;i<5;i++){ bx = x+10+i*(p.w-20)/4; ctx.fillRect(bx, y+24, 5, p.h-30); }
    ctx.fillStyle = '#6d9146';
    for(i=0;i<5;i++){ bx = x+10+i*(p.w-20)/4; for(var q=0;q<4;q++) ctx.fillRect(bx, y+32+q*20, 5, 2); }
  } else if(A.k === 'desert'){
    ctx.fillStyle = 'rgba(255,255,255,.22)';
    for(i=0;i<6;i++) ctx.fillRect(x+10+((i*47)%(p.w-20)), y+34+((i*61)%(p.h-42)), 8, 2);
    ctx.fillStyle = '#6ea35a';
    ctx.fillRect(x+p.w-26, y+p.h-34, 6, 26); ctx.fillRect(x+p.w-32, y+p.h-26, 6, 5);
  }
  ctx.restore();

  /* ラベル */
  ctx.fillStyle = 'rgba(255,246,230,.9)';
  rrect(x+6, y+5, Math.min(p.w-12, 118), 16, 8); ctx.fill();
  ctx.fillStyle = '#5a4331'; ctx.font = 'bold 11px system-ui,sans-serif'; ctx.textAlign = 'left';
  ctx.fillText(A.name + ' ' + inArea(A.k) + '/' + MAX_PER_AREA, x+12, y+17);
  return true;
}
function drawFrame(t){
  ctx.imageSmoothingEnabled = false;
  drawSky(t);

  var i, j;
  /* かざり → 動物（Y昇順） */
  for(i=0;i<pens.length;i++){
    var p = pens[i];
    if(p.y - scrollY > view.h + 20 || p.y + p.h - scrollY < -20) continue;
    if(!drawPenBg(p, t)) continue;
    for(j=0;j<G.decor.length;j++){
      var d = G.decor[j];
      if(d.a !== p.a.k) continue;
      var ds = decorSprite(d.k, Math.max(2, view.scale-1));
      ctx.drawImage(ds, Math.round(p.rx + d.x - ds.width/2), Math.round(p.ry + d.y - ds.height - scrollY));
    }
    var list = [];
    for(j=0;j<G.animals.length;j++) if(areaOf(G.animals[j]) === p.a.k) list.push(G.animals[j]);
    list.sort(function(a,b){ return a.y - b.y; });
    for(j=0;j<list.length;j++) drawAnimal(list[j], t);
  }
  /* 落ち葉 */
  var ls = leafSprite(Math.max(2, view.scale-1));
  for(i=0;i<leaves.length;i++){
    var lf = leaves[i];
    ctx.drawImage(ls, Math.round(lf.x - ls.width/2), Math.round(lf.y - ls.height - scrollY + Math.sin(t*2+i)*2));
  }
  /* 来園者レイヤー */
  var vy = view.laneY - scrollY;
  if(vy < view.h + 40 && vy > -60){
    ctx.fillStyle = 'rgba(210,186,150,.55)';
    rrect(view.ox+10, vy, view.cw-20, 46, 10); ctx.fill();
    for(i=0;i<visitors.length;i++){
      var v = visitors[i], vs = visitorSprite(v.hi, v.fi, v.bi, v.pi, 2, v.dir<0);
      ctx.drawImage(vs, Math.round(v.x), Math.round(vy + 8 + v.lane*14 + Math.round(Math.sin(t*4+v.ph*7))));
    }
  }
  /* パーティクル（3〜5pxの矩形） */
  for(i=0;i<200;i++){
    var pt = POOL[i]; if(!pt.on) continue;
    ctx.globalAlpha = clamp(pt.life/pt.max, 0, 1);
    ctx.fillStyle = pt.col;
    ctx.fillRect(Math.round(pt.x), Math.round(pt.y - scrollY), pt.sz, pt.sz);
  }
  ctx.globalAlpha = 1;
  /* 天気 */
  if(drops.length){
    ctx.strokeStyle = 'rgba(190,220,255,.75)'; ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 1;
    for(i=0;i<drops.length;i++){
      var dr = drops[i];
      if(G.weather === 'rain'){ ctx.beginPath(); ctx.moveTo(dr.x, dr.y); ctx.lineTo(dr.x-3, dr.y+9); ctx.stroke(); }
      else ctx.fillRect(dr.x, dr.y, 2+dr.s, 2+dr.s);
    }
  }
  if(G.weather === 'cloudy'){ ctx.fillStyle = 'rgba(120,130,150,.12)'; ctx.fillRect(0,0,view.w,view.h); }
  /* §11.1 ティント：キャンバス全体に1枚だけ乗算 */
  var tint = PHASE[phaseOfDay()].tint;
  if(tint){
    ctx.globalCompositeOperation = 'multiply';
    ctx.fillStyle = tint; ctx.fillRect(0,0,view.w,view.h);
    ctx.globalCompositeOperation = 'source-over';
  }
  /* スクロールできることのヒント */
  if(view.worldH > view.h){
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    var bh = view.h*view.h/view.worldH;
    ctx.fillRect(view.w-4, (view.h-bh)*(scrollY/(view.worldH-view.h)), 3, bh);
  }
}

var nowT = 0, hoverA = null, foodMode = false;

function pet(a){

function feed(a){
  if(G.coin < FEED_COST){ toast('コインが たりないよ'); return; }

  refreshSheet(); refreshHud();
}
/* §10.1 当たり判定：足元中心の円（最小44px相当） */
function hitAnimal(wx, wy){
  var best = null;
  for(var i=0;i<G.animals.length;i++){
    var a = G.animals[i];
    if(!hasArea(areaOf(a))) continue;
    var s = spSize(a), r = Math.max(24, s.w*0.7);
    var dx = wx - a.x, dy = wy - (a.y - s.h*0.4);
    if(dx*dx + dy*dy <= r*r){ if(!best || a.y > best.y) best = a; }
  }
  return best;
}
function hitLeaf(wx, wy){
  for(var i=leaves.length-1;i>=0;i--){
    var l = leaves[i];
    if(Math.abs(wx-l.x) < 22 && Math.abs(wy-l.y) < 22) return i;
  }
  return -1;
}
function hitLockedPen(wx, wy){
  for(var i=0;i<pens.length;i++){
    var p = pens[i];
    if(hasArea(p.a.k)) continue;
    if(wx>=p.x && wx<=p.x+p.w && wy>=p.y && wy<=p.y+p.h) return p.a;
  }
  return null;
}

/* =====================================================================
   §10 操作仕様
   ===================================================================== */
var drag = { on:false, id:0, y0:0, sy0:0, moved:0, t0:0, holdT:null, target:null, decor:null };
function toWorld(e){
  var r = cv.getBoundingClientRect();
  return { x:e.clientX - r.left, y:e.clientY - r.top + scrollY, sy:e.clientY - r.top };
}
function hitDecor(wx, wy){
  for(var i=G.decor.length-1;i>=0;i--){
    var d = G.decor[i], p = penOf(d.a);
    var ds = decorSprite(d.k, Math.max(2, view.scale-1));
    var cx = p.rx + d.x, cy = p.ry + d.y;
    if(Math.abs(wx-cx) < ds.width/2+4 && wy < cy+6 && wy > cy - ds.height - 4) return d;
  }
  return null;
}
cv.addEventListener('pointerdown', function(e){
  audioOn();
  cv.setPointerCapture(e.pointerId);
  var w = toWorld(e);
  drag.on = true; drag.id = e.pointerId; drag.y0 = e.clientY; drag.sy0 = scrollY;
  drag.moved = 0; drag.t0 = nowT; drag.target = hitAnimal(w.x, w.y); drag.decor = null;
  scrollV = 0;
  if(!drag.target){
    var d = hitDecor(w.x, w.y);
    if(d){ drag.decor = d; return; }
  }
  if(drag.target){
    var a = drag.target;
    if(foodMode){ feed(a); drag.target = null; return; }
    pet(a);
    /* 長押しで なで続ける（0.5秒ごと） */
    drag.holdT = setInterval(function(){ if(drag.on && drag.target) pet(drag.target); }, 500);
  }
});
cv.addEventListener('pointermove', function(e){
  var w = toWorld(e);
  if(!drag.on){
    hoverA = (e.pointerType === 'mouse') ? hitAnimal(w.x, w.y) : null;
    cv.style.cursor = hoverA ? 'pointer' : 'default';
    return;
  }
  var dy = e.clientY - drag.y0;
  drag.moved = Math.max(drag.moved, Math.abs(dy));
  if(drag.decor){
    /* §8.4 かざりはドラッグ配置・8pxグリッドにスナップ */
    var p = penOf(drag.decor.a);
    drag.decor.x = clamp(Math.round((w.x - p.rx)/8)*8, 10, p.rw-10);
    drag.decor.y = clamp(Math.round((w.y - p.ry)/8)*8, 16, p.rh);
    return;
  }
  if(drag.moved > 8){
    if(drag.holdT){ clearInterval(drag.holdT); drag.holdT = null; }
    drag.target = null;
    scrollY = drag.sy0 - dy; clampScroll();
  }
});
function endDrag(e){
  if(!drag.on) return;
  if(drag.holdT){ clearInterval(drag.holdT); drag.holdT = null; }
  var w = toWorld(e);
  if(drag.decor){ drag.decor = null; drag.on = false; save(); return; }
  if(drag.moved <= 8){
    var li = hitLeaf(w.x, w.y);
    if(!drag.target && li >= 0){
      leaves.splice(li,1); G.coin += 5; seCoin(); toast('そうじ完了！ 🪙+5');
      for(var i=0;i<4;i++) emit(w.x, w.y, rnd(-30,30), rnd(-50,-20), .7, '#f5d089', 3);
      refreshHud();
    } else if(!drag.target){
      var ar = hitLockedPen(w.x, w.y);
      if(ar){ openPanel('shop'); }
    } else {
      /* ダブルタップで どうぶつカード */
      if(lastTap.a === drag.target && nowT - lastTap.t < 0.45) openSheet(drag.target);
      lastTap.a = drag.target; lastTap.t = nowT;
    }
  } else {
    scrollV = -(e.clientY - drag.y0)/Math.max(0.05, nowT - drag.t0)*0.35;   /* 慣性 */
  }
  drag.on = false; drag.target = null;
  if(G.tut === 0){ G.tut = 1; document.getElementById('tut').classList.add('hide'); save(); }
}
var lastTap = { a:null, t:-9 };
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', function(){ drag.on = false; if(drag.holdT){ clearInterval(drag.holdT); drag.holdT = null; } });
cv.addEventListener('wheel', function(e){
  if(e.ctrlKey){
    e.preventDefault();
    var z = [3,4,6], i = z.indexOf(view.scale);
    if(i < 0) i = 0;
    setZoom(z[clamp(i + (e.deltaY > 0 ? -1 : 1), 0, 2)]);
  } else { scrollY += e.deltaY; clampScroll(); }
}, { passive:false });
document.addEventListener('keydown', function(e){
  if(document.activeElement && document.activeElement.tagName === 'INPUT') return;
  var list = G.animals.filter(function(a){ return hasArea(areaOf(a)); });
  if(e.key === 'ArrowDown'){ scrollY += 40; clampScroll(); e.preventDefault(); }
  else if(e.key === 'ArrowUp'){ scrollY -= 40; clampScroll(); e.preventDefault(); }
  else if(e.key === 'Tab' && list.length){
    var i = list.indexOf(hoverA);
    hoverA = list[(i+1) % list.length];
    scrollY = clamp(hoverA.y - view.h/2, 0, Math.max(0, view.worldH - view.h));
    e.preventDefault();
  }
  else if(e.key === 'Enter' && hoverA){ audioOn(); pet(hoverA); e.preventDefault(); }
  else if(e.key === ' '){ G.gmin = (G.gmin + 360) % 1440; e.preventDefault(); refreshHud(); }
});

}
function rowEl(cv2, nm, sub, btnText, cls, on){
  var r = document.createElement('div'); r.className = 'row' + (cls ? ' '+cls : '');
  if(cv2) r.appendChild(cv2);
  var i = document.createElement('div'); i.className = 'info';
  i.innerHTML = '<div class="nm">'+nm+'</div><div class="sub">'+sub+'</div>';
  r.appendChild(i);
  if(btnText !== null){
    var b = document.createElement('button'); b.className = 'buy' + (on ? '' : ' have');
    b.innerHTML = btnText;
    if(on) b.onclick = on; else b.disabled = true;
    r.appendChild(b);
  }
  return r;
}
function buyAnimal(spK){
  var sp = SPECIES[spK], price = priceOf(spK);
  if(G.coin < price){ toast('コインが たりないよ'); return; }
  if(inArea(sp.area) >= MAX_PER_AREA){ toast(areaDef(sp.area).name+'は もう いっぱい'); return; }
  ask(sp.name+'を おむかえしますか？\n🪙 '+comma(price), function(){
    G.coin -= price; G.bought++;
    var rare = Math.random() < 0.03;               /* §4.6 レアカラー 3% */
    var a = newAnimal(spK, rare);
    if(rare) a.name = (sp.rareName || sp.name);
    G.animals.push(a); placeIn(a, true);
    if(G.book.indexOf(spK) < 0) G.book.push(spK);
    if(rare && G.book.indexOf(spK+':rare') < 0) G.book.push(spK+':rare');
    seBuy();
    for(var i=0;i<10;i++) emit(a.x + rnd(-14,14), a.y - 20, rnd(-40,40), rnd(-70,-20), 1.1, '#ffe066', 4);
    toast(rare ? '★ めずらしい '+(sp.rareName||sp.name)+' が きた！' : sp.name+'が なかまに なった！');
    /* ★1 ぴよ：ごきげん5の鳥類から低確率で出現 */
    save(); refreshHud(); openPanel('shop');
  });
}
function buyArea(k){
  var A = areaDef(k);
  if(G.coin < A.price){ toast('コインが たりないよ'); return; }
  ask(A.name+'を かいほうしますか？\n🪙 '+comma(A.price), function(){
    G.coin -= A.price; G.areas.push(k); seBuy();
    toast(A.name+'が かいほうされた！');
    save(); refreshHud(); openPanel('shop');
  });
}
function buyDecor(k){
  var D = decorDef(k);
  if(G.coin < D.price){ toast('コインが たりないよ'); return; }
  var p = penOf(pick(G.areas));
  G.coin -= D.price;
  G.decor.push({ k:k, a:p.a.k, x:Math.round(rnd(20, p.rw-20)/8)*8, y:Math.round(rnd(p.rh*0.5, p.rh)/8)*8 });
  seBuy(); toast(D.name+'を おいた！ ドラッグで うごかせるよ');
  save(); refreshHud(); openPanel('shop');
}
function buildShop(){
  var b = $('panelBody'); b.innerHTML = '';
  var h = document.createElement('h3'); h.className = 'sec'; h.textContent = 'どうぶつを おむかえ';
  b.appendChild(h);
  if(G.bought === 0){
    var n = document.createElement('div'); n.className = 'note';
    n.textContent = 'はじめての おむかえは わりびき中！ 75％オフ';
    b.appendChild(n);
  }
  ORDER.forEach(function(k){
    var sp = SPECIES[k];
    if(sp.hidden) return;
    var price = priceOf(k), open = hasArea(sp.area), full = inArea(sp.area) >= MAX_PER_AREA;
    var have = ownedOf(k);
    var sub = areaDef(sp.area).name+'／しゅうきゃく '+sp.appeal+'／こうぶつ '+esc(sp.food)
            + (have ? '　<b>'+have+'ひき かいちゅう</b>' : '');
    var can = open && !full && G.coin >= price;
    var label = !open ? areaDef(sp.area).name+'が<br>ひつよう' : (full ? 'エリアが<br>いっぱい' : '🪙 '+comma(price));
    b.appendChild(rowEl(thumb(k, false, 48), esc(sp.name), sub, label,
      (open && !full) ? (can ? '' : 'lock') : 'lock',
      can ? function(){ buyAnimal(k); } : null));
  });

  h = document.createElement('h3'); h.className = 'sec'; h.textContent = 'エリアを かいほう';
  b.appendChild(h);
  AREAS.forEach(function(A){
    var open = hasArea(A.k);
    var sub = 'しゅうにゅう ×'+A.mult.toFixed(2)+'／さいだい '+MAX_PER_AREA+'ひき';
    b.appendChild(rowEl(null, esc(A.name), sub, open ? 'かいほうずみ' : '🪙 '+comma(A.price),
      open ? '' : (G.coin >= A.price ? '' : 'lock'),
      (!open && G.coin >= A.price) ? function(){ buyArea(A.k); } : null));
  });

  h = document.createElement('h3'); h.className = 'sec'; h.textContent = 'かざり（じぶんごのみの えんに）';
  b.appendChild(h);
  DECOR.forEach(function(D){
    var c = document.createElement('canvas');
    var img = decorSprite(D.k, 3); c.width = img.width; c.height = img.height;
    c.getContext('2d').drawImage(img, 0, 0);
    b.appendChild(rowEl(c, esc(D.name), 'しゅうきゃく +'+D.appeal+'／ドラッグで いどう', '🪙 '+comma(D.price),
      G.coin >= D.price ? '' : 'lock',
      G.coin >= D.price ? function(){ buyDecor(D.k); } : null));
  });
}
function buildBook(){
  var b = $('panelBody'); b.innerHTML = '';
  var total = ORDER.length + 1, got = 0;
  ORDER.forEach(function(k){ if(G.book.indexOf(k) >= 0) got++; });
  if(G.book.indexOf('cat:rare') >= 0) got++;
  var n = document.createElement('div'); n.className = 'note';
  n.textContent = 'にゅうしゅりつ '+got+' / '+total+'（'+Math.round(got/total*100)+'％）';
  b.appendChild(n);

  var h = document.createElement('h3'); h.className = 'sec'; h.textContent = 'ずかん';
  b.appendChild(h);
  var g = document.createElement('div'); g.className = 'grid';
  ORDER.concat(['cat:rare']).forEach(function(key){
    var k = key.split(':')[0], rare = key.indexOf(':rare') > 0;
    var sp = SPECIES[k], open = G.book.indexOf(key) >= 0;
    var c = document.createElement('div'); c.className = 'bcard' + (open ? '' : ' locked');
    if(open){
      c.appendChild(thumb(k, rare, 54));
      var d = document.createElement('div'); d.className = 'nm';
      d.textContent = rare ? (sp.rareName || sp.name+'（レア）') : sp.name;
      c.appendChild(d);
      c.onclick = function(){
        tell((rare ? (sp.rareName||sp.name) : sp.name)+'\n'+areaDef(sp.area).name
          +'\nこうぶつ：'+sp.food+'\nしゅうきゃく：'+sp.appeal
          +'\nしぐさ：'+sp.idle.join('／')
          +(sp.friends.length ? '\nなかよし：'+sp.friends.map(function(f){ return SPECIES[f].name; }).join('・') : ''));
      };
    } else {
      c.innerHTML = '<div class="q">？</div><div class="nm">？？？</div>';
    }
    g.appendChild(c);
  });
  b.appendChild(g);

  h = document.createElement('h3'); h.className = 'sec'; h.textContent = 'うちの こ（'+G.animals.length+'ひき）';
  b.appendChild(h);
  G.animals.forEach(function(a){
    var sp = SPECIES[a.sp];
    b.appendChild(rowEl(thumb(a.sp, a.rare, 48), esc(a.name),
      esc(sp.name)+'／ごきげん '+moodStars(a.mood)+'／おなか '+Math.round(a.fed*100)+'％',
      'カード', '', function(){ closePanel(); openSheet(a); }));
  });
}
function buildOpt(){
  var b = $('panelBody');
  b.innerHTML =
    '<h3 class="sec">おと</h3>'+
    '<label class="opt">おんりょう <input type="range" id="oVol" min="0" max="100" value="'+Math.round(G.opt.vol*100)+'"><span id="oVolV">'+Math.round(G.opt.vol*100)+'</span></label>'+
    '<label class="opt"><input type="checkbox" id="oMute" '+(G.opt.muted?'checked':'')+'> ミュート</label>'+
    '<h3 class="sec">がめん</h3>'+
    '<div class="segs" id="oZoom"><button data-z="3">×3</button><button data-z="4">×4</button><button data-z="6">×6</button></div>'+
    '<div class="note">ドットの1辺を そろえるため、ばいりつは せいすうばい だけです（§4.4）。</div>'+
    '<label class="opt"><input type="checkbox" id="oReal" '+(G.opt.realtime?'checked':'')+'> じかんを じっさいの とけいに あわせる</label>'+
    '<div class="note">オフのとき：じっさいの1ぷん＝ゲームないの10ぷん（1にち＝2.4じかん）。<br>'+
      'PCは Space キーで じかんたいを きりかえられます。</div>'+
    '<h3 class="sec">あそびかた</h3>'+
    '<div class="note">タップ＝なでる／ながおし＝なでつづける／ダブルタップ＝どうぶつカード<br>'+
      '🍎ボタン＝ごはんモード（タップした こに ごはん）／📷＝しゃしん<br>'+
      'うえした ドラッグ＝えんないを スクロール／Ctrl+ホイール＝ズーム</div>'+
    '<h3 class="sec">データ</h3>'+
    '<button class="danger" id="oReset">さいしょから はじめる</button>'+
    '<div class="note">PIXEL ZOO v1.0 ― ドット絵・BGM・こうかおんは すべて コードから せいせいしています。<br>'+
      'がぞうファイル 0まい／おんせいファイル 0まい。</div>';
  $('oVol').oninput = function(){
    G.opt.vol = this.value/100; $('oVolV').textContent = this.value;
    audioOn(); setVol(); refreshHud();
  };
  $('oVol').onchange = save;
  $('oMute').onchange = function(){ G.opt.muted = this.checked; setVol(); refreshHud(); save(); };
  var zs = $('oZoom').querySelectorAll('button');
  for(var i=0;i<zs.length;i++){
    zs[i].classList.toggle('on', +zs[i].dataset.z === view.scale);
    zs[i].onclick = function(){ setZoom(+this.dataset.z); buildOpt(); };
  }
  $('oReal').onchange = function(){ G.opt.realtime = this.checked; save(); };
  $('oReset').onclick = function(){
    ask('ほんとうに さいしょから はじめますか？', function(){
      ask('どうぶつたちと おわかれに なります。\nそれでも いいですか？', function(){
        try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
        location.reload();
      });
    });
  };
}
function openPanel(tab){
  curTab = tab;
  $('panel').classList.remove('hide');
  $('panelTitle').textContent = { shop:'🛒 ショップ', book:'📖 ずかん', opt:'⚙ せってい' }[tab];
  ({ shop:buildShop, book:buildBook, opt:buildOpt })[tab]();
  $('panelBody').scrollTop = 0;
  syncTabs();
}
function closePanel(){ curTab = 'home'; $('panel').classList.add('hide'); syncTabs(); }
function syncTabs(){
  var bs = document.querySelectorAll('#tabs button');
  for(var i=0;i<bs.length;i++) bs[i].classList.toggle('on', bs[i].dataset.tab === curTab);
}
(function(){
  var bs = document.querySelectorAll('#tabs button');
  for(var i=0;i<bs.length;i++) bs[i].onclick = function(){
    audioOn();
    var t = this.dataset.tab;
    if(t === 'home' || t === curTab) closePanel(); else openPanel(t);
  };
})();
$('panelClose').onclick = closePanel;

/* =====================================================================
   §5.3 メインループ ／ §8.3 放置報酬 ／ 起動
   ===================================================================== */
var last = 0, running = true, saveT = 0, hudT = 0, sheetT = 0, chickT = 0;

function step(dt, t){
  var i;
  /* 時間（実時間1分＝ゲーム内10分） */
  if(G.opt.realtime){
    var d = new Date(); G.gmin = d.getHours()*60 + d.getMinutes();
  } else {
    G.gmin += dt*10/60;
    if(G.gmin >= 1440){ G.gmin -= 1440; G.wday++; rollWeather(); }   /* ゲーム内1日ごとに天気を抽選 */
  }
  for(i=0;i<G.animals.length;i++) updateAnimal(G.animals[i], dt, t);
  separate(); socialCheck(t);
  var e = economy();
  G.coin += e.inc*dt;
  syncVisitors(e.guests, dt);
  updateParticles(dt); updateWeatherFx(dt); updateLeaves(t);

  /* ★1 ぴよ：ごきげん5の鳥類から低確率で出現（もりに あらわれる） */
  if(t > chickT){
    chickT = t + 30;
    if(!ownedOf('chick') && G.animals.length >= 3){
      for(i=0;i<G.animals.length;i++){
        var a = G.animals[i];
        if(a.sp === 'penguin' && a.mood >= 5 && Math.random() < 0.08){
          var c = newAnimal('chick', false, 'ぴよ');
          c.area = areaOf(a);                       /* 親のあとをついて歩く */
          G.animals.push(c); placeIn(c, true);
          if(G.book.indexOf('chick') < 0) G.book.push('chick');
          toast('★ ぴよ が やってきた！'); seBuy(); save();
          break;
        }
      }
    }
  }
  /* 慣性スクロール */
  if(!drag.on && Math.abs(scrollV) > 1){
    scrollY += scrollV*dt; scrollV *= Math.pow(0.02, dt);
    var before = scrollY; clampScroll();
    if(before !== scrollY) scrollV = 0;
  }
}
function loop(ms){
  if(!running) return;
  var t = ms/1000;
  var dt = Math.min(0.1, last ? t - last : 0.016);   /* §5.3 dt は100msでクランプ */
  last = t; nowT = t;
  step(dt, t);
  drawFrame(t);
  bgmTick();
  if(t - hudT > 0.4){ hudT = t; refreshHud(); }
  if(sheetA && t - sheetT > 0.6){ sheetT = t; refreshSheet(); }
  if(t - saveT > 30){ saveT = t; save(); }           /* §13.3 30秒ごとに保存 */
  requestAnimationFrame(loop);
}
/* §5.3 タブ非表示でループ停止・復帰時は経過を放置報酬に換算 */
var hiddenAt = 0;
document.addEventListener('visibilitychange', function(){
  if(document.hidden){
    running = false; hiddenAt = Date.now(); save();
  } else {
    var el = hiddenAt ? clamp(Date.now() - hiddenAt, 0, IDLE_CAP) : 0;
    hiddenAt = 0;
    if(el > 60000) grantIdle(el);
    running = true; last = 0; requestAnimationFrame(loop);
  }
});
window.addEventListener('pagehide', save);
window.addEventListener('resize', function(){ resize(); });

function grantIdle(ms){
  var e = economy();
  var gain = Math.floor(e.inc * (ms/1000) * 0.5);    /* 起きている時の半分 */
  var mins = Math.floor(ms/60000);
  for(var i=0;i<G.animals.length;i++)                 /* 不在中は おなかが減るだけ */
    G.animals[i].fed = clamp(G.animals[i].fed - HUNGER_PER_SEC*(ms/1000), 0, 1);
  if(gain <= 0) return;
  G.coin += gain;
  tell('おかえりなさい！\n\n'+(mins >= 60 ? Math.floor(mins/60)+'じかん' : mins+'ふん')
     +'の あいだの おみやげ\n🪙 '+comma(gain));
  seBuy();
}

/* ---------- 起動 ---------- */
function boot(){
  var elapsed = load();
  resize();
  for(var i=0;i<G.animals.length;i++) placeIn(G.animals[i], true);
  refreshHud(); syncTabs();
  if(elapsed > 60000) setTimeout(function(){ grantIdle(elapsed); }, 400);
  if(G.tut === 0){
    setTimeout(function(){
      if(G.tut === 0) $('tut').classList.remove('hide');
    }, 3000);
  }
  requestAnimationFrame(loop);
}
document.getElementById('tut').onclick = function(){ G.tut = 1; this.classList.add('hide'); save(); };
window.addEventListener('orientationchange', function(){ setTimeout(resize, 250); });
boot();

})();
</script>

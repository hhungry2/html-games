<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>魔都転生 DIGITAL DEVIL - 女神転生風 3DダンジョンRPG</title>
<meta name="description" content="HTML5で作った女神転生風の3DダンジョンRPG。悪魔と会話して仲魔にし、邪教の館で悪魔合体。月齢・マグネタイト・LAW/NEUTRAL/CHAOSの属性で結末が変わる。全5フロアの地下迷宮、悪魔はすべてキャンバス描画、Web Audioで音楽と効果音を合成。スマホ/PC対応。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root {
  --win-bg: #06070f; --win-bd: #c9cbe0; --hl: #27305e;
  --gold: #ffd24a; --red: #ff5a5a; --cyan: #7fe3ff; --dim: #6b6f8a;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; background: #000; overflow: hidden; }
body {
  font-family: "DotGothic16", "MS Gothic", "Osaka-Mono", monospace;
  color: #e9e9f2;
  user-select: none; -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  touch-action: none;
}
button { font-family: inherit; }
#stage { position: fixed; inset: 0; overflow: hidden; background: radial-gradient(ellipse at 50% 40%, #150812 0%, #000 70%); }
#app { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
#screen {
  position: absolute; left: 0; top: 0; width: 400px; height: 496px;
  background: #000; overflow: hidden;
  box-shadow: 0 0 0 1px #1b1d2e, 0 10px 40px rgba(0,0,0,.8);
}

/* ---------- 上部バー ---------- */
#top {
  position: absolute; left: 0; top: 0; width: 400px; height: 24px;
  display: flex; align-items: center; gap: 6px; padding: 0 5px;
  font-size: 12px; line-height: 24px; white-space: nowrap;
  background: linear-gradient(#171a2c, #07080f); border-bottom: 1px solid #2c3050;
}
#moonCv { width: 18px; height: 18px; image-rendering: pixelated; flex: none; }
#moonTxt { color: #f3e7a8; min-width: 28px; }
#locTxt { flex: 1; overflow: hidden; text-overflow: ellipsis; color: #d8dcff; }
#alignTxt { padding: 0 4px; border-radius: 2px; font-size: 11px; line-height: 15px; }
#alignTxt.L { background: #1d3f7a; color: #bfe0ff; }
#alignTxt.N { background: #3b3b3b; color: #e6e6e6; }
#alignTxt.C { background: #6a1717; color: #ffc7c7; }
#magTxt { color: #b6ffb0; min-width: 62px; text-align: right; }
.tbtn {
  background: #1c2038; border: 1px solid #454b73; color: #e8e8f8;
  border-radius: 3px; font-size: 11px; line-height: 16px; padding: 0 5px; cursor: pointer;
}
.tbtn.off { color: #666a86; text-decoration: line-through; }

/* ---------- 3D ビュー ---------- */
#viewBox { position: absolute; left: 0; top: 26px; width: 400px; height: 250px; overflow: hidden; }
#view { width: 400px; height: 250px; display: block; image-rendering: pixelated; image-rendering: crisp-edges; background: #000; }

/* ---------- メッセージ ---------- */
.win {
  position: absolute; background: var(--win-bg);
  border: 1px solid var(--win-bd); border-radius: 2px;
  box-shadow: 0 0 0 1px #000, 0 0 0 3px #3a3f63, 0 5px 16px rgba(0,0,0,.75);
}
#msgBox {
  left: 5px; top: 282px; width: 390px; height: 96px;
  padding: 5px 9px; font-size: 15px; line-height: 21px; overflow: hidden;
  cursor: pointer;
}
#msgText { white-space: pre-wrap; word-break: break-all; }
#msgText .nm { color: var(--gold); }
#msgText .em { color: var(--red); }
#msgText .ok { color: #8fffa0; }
#msgText .bl { color: var(--cyan); }
#msgNext {
  position: absolute; right: 8px; bottom: 2px; color: #fff; font-size: 12px;
  animation: blink .8s steps(2) infinite; display: none;
}
@keyframes blink { 50% { opacity: 0; } }

/* ---------- パーティ ---------- */
#party {
  position: absolute; left: 5px; top: 386px; width: 390px; height: 106px;
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px;
}
.card {
  position: relative; background: #070812; border: 1px solid #3c4166; border-radius: 3px;
  padding: 4px 5px 3px; font-size: 11px; line-height: 15px; overflow: hidden;
}
.card.hero { border-color: #6ab0c8; }
.card.empty { border-style: dashed; border-color: #262a44; color: #3a3e5c; display: flex; align-items: center; justify-content: center; font-size: 12px; }
.card.act { box-shadow: 0 0 0 2px var(--gold) inset; background: #15172c; }
.card.dead { background: #1a0707; }
.card.dead .nm { color: #9a6060; }
.card .nm { font-size: 13px; line-height: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
.card .nm.sm { font-size: 10px; letter-spacing: -0.5px; }
.card .sub { color: #9aa0c8; display: flex; justify-content: space-between; white-space: nowrap; }
.card .sub .ail { color: #ff8ad8; }
.card .sub .ail.dead { color: #ff5050; }
.bar { position: relative; height: 15px; margin-top: 2px; display: flex; align-items: center; gap: 3px; }
.bar .lb { width: 14px; font-size: 10px; color: #8e94bb; }
.bar .gb { flex: 1; height: 6px; background: #1c1e33; border: 1px solid #2e3252; position: relative; }
.bar .gb i { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(#8dffa8, #2fb456); }
.bar.mp .gb i { background: linear-gradient(#9fd2ff, #3a6fe0); }
.bar.hp.low .gb i { background: linear-gradient(#ffd27a, #e0782a); }
.bar.hp.crit .gb i { background: linear-gradient(#ff8a8a, #d42a2a); }
.bar .n { width: 26px; text-align: right; font-size: 11px; color: #e6e6f2; }
.card.hit { animation: shake .32s linear; }
.card.hit::after { content: ''; position: absolute; inset: 0; background: rgba(255,40,40,.35); animation: fadeo .35s forwards; }
.card.heal::after { content: ''; position: absolute; inset: 0; background: rgba(90,255,160,.28); animation: fadeo .5s forwards; }
@keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-4px); } 40% { transform: translateX(4px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
@keyframes fadeo { to { opacity: 0; } }

/* ---------- メニュー／ウィンドウ ---------- */
#layer { position: absolute; left: 0; top: 0; width: 400px; height: 496px; pointer-events: none; z-index: 11; }
#storyText {
  position: absolute; left: 0; top: 0; width: 400px; height: 250px; display: flex; align-items: center; justify-content: center;
  text-align: center; white-space: pre-wrap; font-size: 15px; line-height: 24px; color: #f4ecf8; padding: 10px 18px;
  text-shadow: 0 0 6px #000, 0 0 2px #000; pointer-events: none; opacity: 0; transition: opacity .5s;
}
#compass { position: absolute; left: 5px; top: 5px; font-size: 11px; line-height: 16px; padding: 0 5px; background: rgba(0,0,0,.55); border: 1px solid rgba(160,170,210,.5); color: #ffe070; pointer-events: none; display: none; }
#layer .win { pointer-events: auto; }
.mwin { padding: 4px 5px; font-size: 15px; }
.mwin .ttl { color: var(--gold); font-size: 12px; line-height: 17px; padding: 0 3px 2px; border-bottom: 1px dashed #3f456d; margin-bottom: 2px; display: flex; justify-content: space-between; }
.mwin .ttl .tr { color: #9aa0c8; }
.mi {
  position: relative; display: flex; justify-content: space-between; align-items: center;
  height: 25px; line-height: 25px; padding: 0 5px 0 17px; white-space: nowrap; cursor: pointer; border-radius: 2px;
}
.mi .l { overflow: hidden; text-overflow: ellipsis; }
.mi .r { color: #aab2d8; margin-left: 10px; font-size: 13px; flex: none; }
.mi.cur { background: var(--hl); }
.mi.cur::before { content: '▶'; position: absolute; left: 3px; color: var(--red); font-size: 10px; }
.mi.dis { color: #5d6180; }
.mi.dis .r { color: #4d5170; }
.mi .tag { display: inline-block; font-size: 10px; line-height: 13px; padding: 0 3px; margin-right: 3px; border-radius: 2px; vertical-align: 1px; }
.scr { position: absolute; right: 4px; font-size: 9px; color: #9aa0c8; }
.scr.up { top: 18px; } .scr.dn { bottom: 1px; }
.dwin { padding: 5px 8px; font-size: 13px; line-height: 17px; color: #d9dcf2; white-space: pre-wrap; overflow: hidden; }
.dwin b { color: var(--gold); font-weight: normal; }
.el { display: inline-block; min-width: 15px; text-align: center; font-size: 11px; line-height: 14px; border-radius: 2px; margin-right: 1px; }
.el-phys { background: #5a5a5a; } .el-fire { background: #b4381f; } .el-ice { background: #2b7fc0; }
.el-elec { background: #b89a12; } .el-force { background: #2f9a55; } .el-light { background: #c8c08a; color: #222; }
.el-dark { background: #5b2a86; } .el-almighty { background: #888; } .el-heal { background: #2c8a7a; }
.el-sup { background: #44507a; } .el-ail { background: #8a2c6a; } .el-gun { background: #6b5a3a; }
.rw { color: #ff6b6b; } .rr { color: #9fd3ff; } .rn { color: #bbbbbb; } .rx { color: #ffe27a; } .rd { color: #8fff9f; }

/* ポップアップ */
.pop {
  position: absolute; transform: translate(-50%, -50%); font-size: 18px; color: #fff; pointer-events: none;
  text-shadow: 1px 1px 0 #000, -1px 1px 0 #000, 1px -1px 0 #000, -1px -1px 0 #000, 0 0 6px #000;
  animation: popup .95s ease-out forwards; white-space: nowrap; z-index: 5;
}
.pop.heal { color: #8fffa8; }
.pop.mp { color: #9fd2ff; }
.pop.tag { font-size: 12px; color: #ffe27a; }
.pop.weak { color: #ff7a4a; }
.pop.miss { color: #aaaacc; font-size: 14px; }
@keyframes popup { 0% { opacity: 0; margin-top: 6px; } 15% { opacity: 1; margin-top: -6px; } 70% { opacity: 1; margin-top: -14px; } 100% { opacity: 0; margin-top: -22px; } }
.elab {
  position: absolute; transform: translateX(-50%); font-size: 11px; line-height: 14px; padding: 0 4px;
  background: rgba(0,0,0,.62); color: #e6e6f2; white-space: nowrap; border-radius: 2px; pointer-events: auto; cursor: pointer;
}
.elab.tgt { color: #111; background: var(--gold); }
.elab .hpb { display: block; height: 3px; background: #2a0c0c; margin: 1px 0 1px; }
.elab .hpb i { display: block; height: 3px; background: #e84a4a; }

/* フェード */
#fade { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .35s; z-index: 20; }
#fade.on { opacity: 1; pointer-events: auto; }
#flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 19; }

/* タイトル */
#title { position: absolute; inset: 0; z-index: 10; display: none; }
#title.on { display: block; }
#tcv { position: absolute; left: 0; top: 0; width: 400px; height: 496px; image-rendering: pixelated; }
#logo { position: absolute; left: 0; right: 0; top: 70px; text-align: center; pointer-events: none; }
#logo .jp {
  font-size: 58px; line-height: 64px; letter-spacing: 6px; color: #fff4f0;
  font-family: "Yu Mincho", "YuMincho", "Hiragino Mincho ProN", "MS Mincho", serif; font-weight: 900;
  text-shadow: 0 0 4px #ff2a2a, 0 0 18px #c00000, 3px 3px 0 #300000;
}
#logo .en { font-size: 15px; letter-spacing: 9px; color: #ff6a6a; margin-top: 6px; text-shadow: 0 0 8px #800; }
#logo .sub { font-size: 11px; letter-spacing: 3px; color: #b9a6c6; margin-top: 10px; }
#tmenu { position: absolute; left: 100px; width: 200px; top: 300px; }
#tfoot { position: absolute; left: 0; right: 0; bottom: 8px; text-align: center; font-size: 10px; color: #6f6680; line-height: 14px; }

/* 名前入力 */
#nameBox { left: 50px; top: 150px; width: 300px; padding: 12px; z-index: 12; text-align: center; font-size: 14px; }
#nameBox input {
  width: 180px; margin: 10px 0; font-family: inherit; font-size: 20px; text-align: center;
  background: #000; color: #fff; border: 1px solid #8e93b8; padding: 4px; outline: none;
  user-select: text; -webkit-user-select: text;
}
#nameBox .btns { display: flex; gap: 10px; justify-content: center; }
.fbtn {
  font-size: 15px; background: #1d2244; color: #fff; border: 1px solid #aab; border-radius: 3px; padding: 5px 16px; cursor: pointer;
}
.fbtn:active { background: #3a4380; }

/* 全体マップ */
#mapWin { left: 8px; top: 30px; width: 384px; height: 244px; padding: 4px; z-index: 6; }
#mapCv { position: absolute; left: 4px; top: 22px; width: 220px; height: 220px; image-rendering: pixelated; }
#mapInfo { position: absolute; left: 232px; top: 24px; right: 6px; font-size: 11px; line-height: 16px; color: #c9cce8; }

/* ---------- パッド ---------- */
#pad { position: absolute; display: none; }
#pad.on { display: block; }
.pb {
  position: absolute; background: rgba(255,255,255,.07); border: 2px solid rgba(220,220,255,.35); color: #eef;
  border-radius: 10px; font-size: 18px; display: flex; align-items: center; justify-content: center;
  touch-action: none; cursor: pointer;
}
.pb.on { background: rgba(255,255,255,.3); }
.pb.round { border-radius: 50%; font-size: 22px; font-weight: bold; }
.pb.small { font-size: 12px; border-radius: 8px; }
#hint { position: absolute; font-size: 11px; color: #5f6282; white-space: nowrap; text-align: center; }
</style>
</head>
<body>
<div id="stage">
  <div id="app">
    <div id="screen">
      <div id="top">
        <canvas id="moonCv" width="16" height="16"></canvas>
        <span id="moonTxt">新月</span>
        <span id="locTxt"></span>
        <span id="alignTxt" class="N">N</span>
        <span id="magTxt">MAG 0</span>
        <button class="tbtn" id="sndBtn" title="サウンド (M)">♪</button>
      </div>
      <div id="viewBox"><canvas id="view" width="320" height="200"></canvas><div id="storyText"></div><div id="compass"></div></div>
      <div id="msgBox" class="win"><div id="msgText"></div><div id="msgNext">▼</div></div>
      <div id="party"></div>
      <div id="layer"></div>
      <div id="title">
        <canvas id="tcv" width="320" height="397"></canvas>
        <div id="logo"><div class="jp">魔都転生</div><div class="en">DIGITAL DEVIL</div><div class="sub">― 女神転生風 3DダンジョンRPG ―</div></div>
        <div id="tmenu"></div>
        <div id="tfoot">↑↓ 選択　Z/Enter 決定　X/Esc 取消　M 音のON/OFF</div>
      </div>
      <div id="flash"></div>
      <div id="fade"></div>
    </div>
    <div id="pad">
      <div class="pb" id="pU" data-b="up">▲</div>
      <div class="pb" id="pL" data-b="left">◀</div>
      <div class="pb" id="pR" data-b="right">▶</div>
      <div class="pb" id="pD" data-b="down">▼</div>
      <div class="pb small" id="pM" data-b="map">MAP</div>
      <div class="pb round" id="pB" data-b="b">B</div>
      <div class="pb round" id="pA" data-b="a">A</div>
    </div>
    <div id="hint">↑前進 ←→向きを変える ↓ふりかえる　Z決定/調べる　X取消/メニュー　Q地図　M音</div>
  </div>
</div>
<script>
(function () {
'use strict';

/* ============================================================
   ユーティリティ
   ============================================================ */
const $ = (id) => document.getElementById(id);
const rnd = (n) => Math.floor(Math.random() * n);
const rr = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const chance = (p) => Math.random() * 100 < p;
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
function speed() { return (Input.held.a ? 2.6 : 1) * (Opt.fast ? 1.8 : 1); }
function wait(ms) { return new Promise((r) => setTimeout(r, ms / speed())); }
const colCache = {};
function rgbOf(h) {
  let c = colCache[h];
  if (c) return c;
  let s = h.replace('#', '');
  if (s.length === 3) s = s[0] + s[0] + s[1] + s[1] + s[2] + s[2];
  const n = parseInt(s, 16);
  c = [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  colCache[h] = c;
  return c;
}
function css(r, g, b, a) {
  r = clamp(Math.round(r), 0, 255); g = clamp(Math.round(g), 0, 255); b = clamp(Math.round(b), 0, 255);
  return a === undefined ? 'rgb(' + r + ',' + g + ',' + b + ')' : 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
}
function shade(h, f, a) { const c = rgbOf(h); return css(c[0] * f, c[1] * f, c[2] * f, a); }
function mix(h1, h2, t, a) { const c1 = rgbOf(h1), c2 = rgbOf(h2); return css(c1[0] + (c2[0] - c1[0]) * t, c1[1] + (c2[1] - c1[1]) * t, c1[2] + (c2[2] - c1[2]) * t, a); }
function alpha(h, a) { const c = rgbOf(h); return css(c[0], c[1], c[2], a); }
function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]); }

/* 設定（ブラウザに保存） */
const OPT_KEY = 'mato_tensei_opt_v1';
const Opt = { sound: true, fast: false, textSpd: 1 };
try { Object.assign(Opt, JSON.parse(localStorage.getItem(OPT_KEY) || '{}')); } catch (e) { /* 無視 */ }
function saveOpt() { try { localStorage.setItem(OPT_KEY, JSON.stringify(Opt)); } catch (e) { /* 無視 */ } }

/* ============================================================
   入力
   ============================================================ */
const DIRS = ['up', 'down', 'left', 'right'];
const Input = {
  stack: [], held: {}, repT: 0, repI: 0, repB: null,
  push(fn) { this.stack.push(fn); },
  pop(fn) { const i = this.stack.lastIndexOf(fn); if (i >= 0) this.stack.splice(i, 1); },
  top() { return this.stack[this.stack.length - 1]; },
  press(b) {
    Snd.unlock();
    if (b === 'mute') { setSound(!Opt.sound); return; }
    if (this.held[b]) return;
    this.held[b] = true;
    this.dispatch(b, false);
    if (DIRS.indexOf(b) >= 0) {
      this.stopRep();
      this.repB = b;
      this.repT = setTimeout(() => {
        this.repI = setInterval(() => {
          if (this.held[b] && this.repB === b) this.dispatch(b, true); else this.stopRep();
        }, 90);
      }, 300);
    }
  },
  release(b) { this.held[b] = false; if (this.repB === b) this.stopRep(); },
  stopRep() { clearTimeout(this.repT); clearInterval(this.repI); this.repB = null; },
  releaseAll() { for (const k in this.held) this.held[k] = false; this.stopRep(); },
  dispatch(b, rep) { const f = this.top(); if (f) f(b, rep); },
};
/* ボタンを1回待つ */
function waitKey(keys) {
  keys = keys || ['a', 'b'];
  return new Promise((res) => {
    const h = (b, rep) => { if (!rep && keys.indexOf(b) >= 0) { Input.pop(h); res(b); } };
    Input.push(h);
  });
}
const KEYMAP = {
  ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left',
  ArrowRight: 'right', KeyD: 'right', KeyZ: 'a', Enter: 'a', NumpadEnter: 'a', Space: 'a',
  KeyX: 'b', Escape: 'b', Backspace: 'b', KeyQ: 'map', Tab: 'map', KeyM: 'mute',
};
const KEYMAP2 = {
  ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', w: 'up', s: 'down', a: 'left', d: 'right', W: 'up', S: 'down', A: 'left', D: 'right',
  z: 'a', Z: 'a', Enter: 'a', ' ': 'a', x: 'b', X: 'b', Escape: 'b', Backspace: 'b', q: 'map', Q: 'map', Tab: 'map', m: 'mute', M: 'mute',
};
function keyOf(e) { return KEYMAP[e.code] || KEYMAP2[e.key]; }
window.addEventListener('keydown', (e) => {
  const tag = (e.target && e.target.tagName) || '';
  if (tag === 'INPUT') return;
  const b = keyOf(e);
  if (!b) return;
  e.preventDefault();
  if (e.repeat) return;
  Input.press(b);
});
window.addEventListener('keyup', (e) => { const b = keyOf(e); if (b) Input.release(b); });
window.addEventListener('blur', () => Input.releaseAll());

/* ============================================================
   サウンド（Web Audio で合成）
   ============================================================ */
const Snd = {
  ctx: null, out: null, mus: null, fx: null, rev: null, nbuf: null,
  unlock() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      try { this.ctx = new AC(); } catch (e) { return; }
      const c = this.ctx;

/* ------------------------------------------------------------
   音楽シーケンサ
   チャンネル記法: 音名(c4, f#3, bb2) / 和音 a3+c4+e4 / '-' のばす / '.' 休み
                  打楽器は x(弱) X(強) / ( ... )*n で繰り返し / | は区切り（無視）
   ------------------------------------------------------------ */
const NOTE_IDX = { c: 0, d: 2, e: 4, f: 5, g: 7, a: 9, b: 11 };
function noteFreq(tok) {
  const m = /^([a-g])([#b]?)(-?\d)$/.exec(tok);
  if (!m) return 0;
  let n = NOTE_IDX[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);
  const midi = (parseInt(m[3], 10) + 1) * 12 + n;
  return 440 * Math.pow(2, (midi - 69) / 12);
}
function expandSeq(s) {
  let prev;
  do { prev = s; s = s.replace(/\(([^()]*)\)\*(\d+)/g, (m, body, n) => new Array(parseInt(n, 10)).fill(body).join(' ')); } while (s !== prev);
  return s.replace(/\|/g, ' ').trim().split(/\s+/);
}
function compileSong(song) {
  if (song._c) return song._c;
  const ch = song.ch.map((c) => {
    const toks = expandSeq(c.s);
    const ev = new Array(toks.length).fill(null);
    for (let i = 0; i < toks.length; i++) {
      const t = toks[i];
      if (t === '.' || t === '-') continue;
      let dur = 1; while (i + dur < toks.length && toks[i + dur] === '-') dur++;
      if (t === 'x' || t === 'X') { ev[i] = { hit: true, acc: t === 'X', dur }; continue; }
      const fs = t.split('+').map(noteFreq).filter((f) => f > 0);
      if (fs.length) ev[i] = { fs, dur };
    }
    return { i: c.i, v: c.v === undefined ? 1 : c.v, ev, len: toks.length };
  });

  song._c = { bpm: song.bpm, ch, len, once: !!song.once };

}

      case 'hat': Snd.nz({ at: t, ft: 'highpass', f: 7500, d: 0.035, v: 0.1 * V * a, dest }); break;

  if (k === 'heal' || k === 'rev' || k === 'cure') return '<span class="tag el el-heal">回</span>';
  if (k === 'ail') return '<span class="tag el el-ail">状</span>';
  return '<span class="tag el el-sup">補</span>';
}

function shadeHex(h, f) {

   ------------------------------------------------------------ */
const Spr = {
  cache: {},
  /* 絵の仕様からスプライトを作る。k = 1単位あたりのピクセル数 */
  make(art, k) {
    const key = JSON.stringify(art) + '|' + k;
    if (this.cache[key]) return this.cache[key];
    const S = Math.max(1, art.s || 1);
    const U = 132 * S; // 描画範囲（単位）
    const W = Math.ceil(U * k), H = Math.ceil(U * k);
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    const g = cv.getContext('2d');
    const ax = U / 2, ay = U - 2; // 足もと (50,98) の位置
    g.setTransform(k, 0, 0, k, (ax - 50) * k, (ay - 98) * k);
    try { (Art[art.t] || Art.hum)(g, art); } catch (e) { console.error('art error', art, e); }
    g.setTransform(1, 0, 0, 1, 0, 0);
    // 2値化＋輪郭線
    const img = g.getImageData(0, 0, W, H);
    const d = img.data;
    const solid = new Uint8Array(W * H);
    for (let i = 0; i < W * H; i++) { if (d[i * 4 + 3] > 110) { solid[i] = 1; d[i * 4 + 3] = 255; } else d[i * 4 + 3] = 0; }
    const oc = rgbOf(OUT);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const i = y * W + x;
      if (solid[i]) continue;
      if ((x > 0 && solid[i - 1]) || (x < W - 1 && solid[i + 1]) || (y > 0 && solid[i - W]) || (y < H - 1 && solid[i + W])) {
        d[i * 4] = oc[0]; d[i * 4 + 1] = oc[1]; d[i * 4 + 2] = oc[2]; d[i * 4 + 3] = 255;
      }
    }
    g.putImageData(img, 0, 0);
    // 白シルエット（被弾フラッシュ用）
    const wcv = document.createElement('canvas'); wcv.width = W; wcv.height = H;
    const wg = wcv.getContext('2d'); wg.drawImage(cv, 0, 0); wg.globalCompositeOperation = 'source-in'; wg.fillStyle = '#ffffff'; wg.fillRect(0, 0, W, H);
    const out = { cv, white: wcv, w: W, h: H, ox: ax * k, oy: ay * k, k };
    this.cache[key] = out;
    return out;
  },
  demon(name, k) {
    const d = DEMONS[name] || BOSSES[name];
    return this.make(d ? d.art : NPC_ART[name] || { t: 'gst' }, k);
  },
};

/* ---------------- メニューウィンドウ ---------------- */
class MenuWin {
  constructor(o) {
    this.o = o;
    this.items = o.items || [];
    this.cur = o.cur || 0;
    this.top = 0;
    this.rows = o.rows || 8;
    this.el = document.createElement('div');
    this.el.className = 'win mwin';
    this.el.style.left = (o.x || 0) + 'px'; this.el.style.top = (o.y || 0) + 'px';
    if (o.w) this.el.style.width = o.w + 'px';
    if (o.z) this.el.style.zIndex = o.z;
    layer.appendChild(this.el);
    this.el.addEventListener('pointerdown', (e) => e.stopPropagation());
    this.render();
  }
  setItems(items, keep) { this.items = items; if (!keep) this.cur = 0; this.cur = clamp(this.cur, 0, Math.max(0, items.length - 1)); this.render(); }
  render() {
    const o = this.o;
    const n = this.items.length;
    if (this.cur < this.top) this.top = this.cur;
    if (this.cur >= this.top + this.rows) this.top = this.cur - this.rows + 1;
    this.top = clamp(this.top, 0, Math.max(0, n - this.rows));
    let h = '';
    if (o.title) h += '<div class="ttl"><span>' + o.title + '</span><span class="tr">' + (o.titleR || '') + '</span></div>';
    for (let i = this.top; i < Math.min(n, this.top + this.rows); i++) {
      const it = this.items[i];
      h += '<div class="mi' + (i === this.cur && this.active !== false ? ' cur' : '') + (it.dis ? ' dis' : '') + '" data-i="' + i + '"><span class="l">' + (it.h || esc(it.l)) + '</span>' + (it.r !== undefined ? '<span class="r">' + it.r + '</span>' : '') + '</div>';
    }
    if (!n) h += '<div class="mi dis"><span class="l">' + (o.empty || '（なし）') + '</span></div>';
    if (this.top > 0) h += '<div class="scr up">▲</div>';
    if (this.top + this.rows < n) h += '<div class="scr dn">▼</div>';
    this.el.innerHTML = h;
    this.el.querySelectorAll('.mi[data-i]').forEach((d) => {
      d.addEventListener('pointerenter', (e) => { if (e.pointerType === 'mouse' && this.resolve) { const i = +d.dataset.i; if (i !== this.cur) { this.cur = i; this.render(); this.moved(); } } });
      d.addEventListener('click', (e) => { e.preventDefault(); if (!this.resolve) return; const i = +d.dataset.i; this.cur = i; this.choose(); });
    });
  }
  moved() { if (this.o.onMove) this.o.onMove(this.cur, this.items[this.cur]); }
  choose() {
    const it = this.items[this.cur];
    if (!it || it.dis) { Snd.sfx('error'); return; }
    Snd.sfx('select');
    this.finish(this.cur);
  }
  finish(v) { const r = this.resolve; this.resolve = null; Input.pop(this.h); this.active = false; this.render(); if (r) r(v); }
  run() {
    this.active = true; this.render(); this.moved();
    return new Promise((res) => {
      this.resolve = res;
      this.h = (b, rep) => {
        const n = this.items.length;
        if (b === 'up' || b === 'down') {
          if (!n) return;
          const c0 = this.cur;
          this.cur = (this.cur + (b === 'up' ? -1 : 1) + n) % n;
          if (rep && ((b === 'up' && this.cur > c0) || (b === 'down' && this.cur < c0))) this.cur = c0;
          if (this.cur !== c0) { Snd.sfx('cursor'); this.render(); this.moved(); }
        } else if (b === 'left' || b === 'right') {
          if (this.o.onLR) { this.o.onLR(b === 'left' ? -1 : 1); return; }
          if (n > this.rows) { this.cur = clamp(this.cur + (b === 'left' ? -this.rows : this.rows), 0, n - 1); Snd.sfx('cursor'); this.render(); this.moved(); }
        } else if (b === 'a' && !rep) this.choose();
        else if ((b === 'b' || (b === 'map' && this.o.mapCancel)) && !rep && this.o.cancel !== false) { Snd.sfx('cancel'); this.finish(-1); }
      };
      Input.push(this.h);

/* ============================================================
   戦闘
   ============================================================ */
function unitRes(u) { if (u === G.hero) return '.......'; const d = defOf(u); return (d && d.res) || '.......'; }
function resOf(u, el) { if (!el || el === 'almighty') return '.'; const i = ELS.indexOf(el); return i < 0 ? '.' : unitRes(u)[i] || '.'; }
function isHero(u) { return u === G.hero; }
function alive(u) { return u && u.hp > 0 && !u.gone; }
function buf(u, k) { return (u.buf && u.buf[k]) || 0; }
function atkPow(u, mode) {
  if (isHero(u)) {
    if (mode === 'gun') { const gn = eqFind(GUNS, u.gun), bl = eqFind(BULLETS, u.bullet); return gn.p + bl.p + u.ag * 2 + u.lv + (bl.el ? u.ma : 0); }
    return eqFind(WEAPONS, u.weapon).p + u.st * 2 + u.lv;
  }
  return u.st * 2 + u.lv + 3;
}
function defPow(u) { return isHero(u) ? u.vi * 2 + u.lv + eqFind(ARMORS, u.armor).p : u.vi * 2 + u.lv; }
function diffDmg(target) { if (isEnemy(target)) return 1; return G.diff === 0 ? 0.72 : G.diff === 2 ? 1.25 : 1; }
function isEnemy(u) { return BView.enemies.indexOf(u) >= 0; }
function sideOf(u) { return isEnemy(u) ? BView.enemies : partyMembers(); }
function foesOf(u) { return isEnemy(u) ? partyMembers() : BView.enemies; }
function livingOf(list) { return list.filter(alive); }
function nameOf(u) { return u.dispName || u.name; }

const Battle = {
  round: 0, auto: false, stopAuto: false, over: null, exp: 0, mac: 0, mag: 0, boss: false, drops: [],
  async run(enemies, opt) {
    opt = opt || {};
    const prevMode = G.mode;
    G.mode = 'battle';
    this.over = null; this.exp = 0; this.mac = 0; this.mag = 0; this.round = 0; this.drops = []; this.auto = false;
    this.boss = !!opt.boss; this.opt = opt;
    // 同名に A/B/C
    const cnt = {};
    enemies.forEach((e) => { cnt[e.name] = (cnt[e.name] || 0) + 1; });
    const seen = {};
    enemies.forEach((e) => { if (cnt[e.name] > 1) { seen[e.name] = (seen[e.name] || 0) + 1; e.dispName = e.name + 'ＡＢＣＤ'[seen[e.name] - 1]; } e.buf = { atk: 0, def: 0, agi: 0, mag: 0 }; e.anim = {}; });
    partyMembers().forEach((u) => { u.buf = { atk: 0, def: 0, agi: 0, mag: 0 }; u.shield = null; u.guard = false; });
    // 背景を固定
    if (G.floor >= 0 && G.mode !== 'hub') { try { drawDungeon(G.floor, G.x, G.y, G.dir, performance.now() / 1000, 0); } catch (e) { /* 無視 */ } }
    const bg = document.createElement('canvas'); bg.width = VW; bg.height = VH; bg.getContext('2d').drawImage(view, 0, 0);
    BView.bgSnap = bg;
    BView.enemies = enemies; BView.layout = enemyLayout(enemies); BView.cursor = -1; BView.fx = [];
    Music.play(opt.bgm || (this.boss ? 'boss' : 'battle'));
    if (!this.boss) { Snd.sfx('encounter'); await Scene.flashWhite(); }
    UI.enemyLabels(true);
    Msg.logClear();
    const names = {}; enemies.forEach((e) => { names[e.name] = (names[e.name] || 0) + 1; });
    const nm = Object.keys(names).map((k) => k + (names[k] > 1 ? '×' + names[k] : '')).join('、');
    await Msg.log(this.boss ? nm + 'が 立ちはだかった！' : nm + 'が あらわれた！', 700);
    enemies.forEach((e) => { if (!e.boss) seeDemon(e.name); });
    let first = null;
    if (!this.boss && !opt.noSurprise) {
      const r = rnd(100);
      if (r < 7 + G.hero.lu / 2) first = 'party';
      else if (r > 93) first = 'enemy';
    }
    if (first === 'party') await Msg.log('<span class="ok">先制攻撃の チャンスだ！</span>', 600);
    if (first === 'enemy') await Msg.log('<span class="em">不意を つかれた！</span>', 600);
    // 悪魔から話しかけてくる
    if (!this.boss && first !== 'enemy' && G.moon !== 8 && chance(12)) {
      const e = pick(livingOf(enemies));
      const d = DEMONS[e.name];
      if (d && d.pers !== 'V') {
        await Msg.log(nameOf(e) + 'が 話しかけてきた！', 600);
        const res = await Talk.run(e, true);
        await this.afterTalk(e, res);
        this.checkEnd();
      }
    }
    while (!this.over) {
      this.round++;
      partyMembers().forEach((u) => { u.guard = false; });
      let pActs = [];
      if (first !== 'enemy' && !this.over) {
        const r = await this.commandPhase();
        if (r === 'escaped') { this.over = 'escape'; break; }
        if (r === 'talked') pActs = null;
        else pActs = r;
      }
      if (this.over) break;
      const eActs = first === 'party' ? [] : this.enemyActions();
      first = null;
      const all = (pActs || []).concat(eActs);
      all.forEach((a) => { const u = a.who; a.spd = u.ag * 2 + u.lv * 0.5 + buf(u, 'agi') * 4 + rnd(u.ag + 5) + (a.kind === 'guard' ? 1000 : 0) + (a.pri || 0); });
      all.sort((a, b) => b.spd - a.spd);
      for (const a of all) {
        if (this.over) break;
        await this.execute(a);
        this.checkEnd();
      }
      if (!this.over) await this.endRound();
      this.checkEnd();
    }
    const result = this.over;
    UI.enemyLabels(false); BView.cursor = -1; BView.menuOpen = false; UI.act = null;
    if (result === 'win') await this.victory();
    else if (result === 'escape') { await Msg.log('うまく 逃げきった！', 500); }
    else if (result === 'talked') { await Msg.log('悪魔たちは いなくなった。', 500); }
    partyMembers().forEach((u) => { u.buf = null; u.shield = null; u.guard = false; if (u.ail === 'sleep' || u.ail === 'charm') u.ail = null; });
    BView.enemies = []; BView.fx = [];
    UI.refresh();
    G.mode = prevMode === 'battle' ? 'explore' : prevMode;
    if (result !== 'lose' && G.floor >= 0 && !opt.keepMusic) Music.play(FLOORS[G.floor].bgm);
    Msg.clear();
    return result;
  },
  checkEnd() {
    if (this.over) return;
    if (G.hero.hp <= 0) { this.over = 'lose'; return; }
    if (!livingOf(BView.enemies).length) this.over = BView.enemies.some((e) => e.killed) ? 'win' : 'talked';
  },
  /* ---------- コマンド入力 ---------- */
  async commandPhase() {
    UI.enemyLabels(true);
    if (!livingOf(BView.enemies).length) { this.checkEnd(); return []; }
    if (this.auto) {
      if (this.stopAuto || Input.held.b) { this.auto = false; this.stopAuto = false; await Msg.log('オートを 解除した。', 300); }
      else return this.autoActions();
    }
    Msg.logClear();
    for (;;) {
      UI.act = null; UI.refreshParty();
      await Msg.log('どうする？', 0);
      BView.menuOpen = true; UI.enemyLabels(true);
      const top = await menu({ x: 268, y: 150, w: 124, items: [{ l: 'たたかう' }, { l: 'はなす', dis: this.boss }, { l: 'にげる', dis: this.boss }, { l: 'オート' }], cancel: false, cur: this.lastTop || 0 });
      BView.menuOpen = false; UI.enemyLabels(true);
      this.lastTop = top;
      if (top === 0) { const acts = await this.inputFight(); if (acts) return acts; continue; }
      if (top === 1) {
        const i = await this.chooseEnemy('だれと 話す？');
        if (i < 0) continue;
        const e = BView.enemies[i];
        const res = await Talk.run(e, false);
        await this.afterTalk(e, res);
        this.checkEnd();
        return 'talked';
      }
      if (top === 2) {
        const ok = await this.tryEscape();
        if (ok) return 'escaped';
        return 'talked';
      }
      if (top === 3) { this.auto = true; this.stopAuto = false; await Msg.log('オートで たたかう！ （Bボタンで 解除）', 300); return this.autoActions(); }
    }
  },
  autoActions() {
    const acts = [];
    partyMembers().forEach((u) => {
      if (!alive(u)) return;
      const tg = livingOf(BView.enemies)[0];
      if (!tg) return;
      acts.push({ who: u, kind: 'attack', target: tg });
    });
    return acts;
  },
  async inputFight() {
    const mem = partyMembers();
    const acts = [];
    let i = 0;
    while (i < mem.length) {
      const u = mem[i];
      if (!alive(u) || u.ail === 'sleep' || u.ail === 'para' || u.ail === 'charm') { acts[i] = null; i++; continue; }
      UI.act = u; UI.refreshParty();
      BView.menuOpen = true; UI.enemyLabels(true);
      const a = isHero(u) ? await this.inputHero(u) : await this.inputDemon(u);
      BView.menuOpen = false; UI.enemyLabels(true);
      if (a === 'back') {
        // ひとつ前に戻る
        let j = i - 1;
        while (j >= 0 && !acts[j]) j--;
        if (j < 0) { UI.act = null; UI.refreshParty(); return null; }
        acts.length = j; i = j; continue;
      }
      acts[i] = a; i++;
    }
    UI.act = null; UI.refreshParty();
    return acts.filter(Boolean);
  },
  async inputHero(u) {
    for (;;) {
      await Msg.log('<span class="nm">' + esc(u.name) + '</span>の 行動は？', 0);
      const gn = eqFind(GUNS, u.gun);
      const c = await menu({ x: 268, y: 100, w: 124, title: esc(u.name), items: [{ l: '剣', r: '' }, { l: '銃', dis: gn.tg === 'none' }, { l: 'アイテム' }, { l: 'COMP' }, { l: '防御' }], cur: this.lastHero || 0 });
      if (c < 0) return 'back';
      this.lastHero = c;
      if (c === 0) { const t = await this.chooseEnemy('攻撃する 相手は？'); if (t < 0) continue; return { who: u, kind: 'attack', target: BView.enemies[t] }; }
      if (c === 1) {
        if (gn.tg === 'one') { const t = await this.chooseEnemy('撃つ 相手は？'); if (t < 0) continue; return { who: u, kind: 'gun', target: BView.enemies[t] }; }
        return { who: u, kind: 'gun' };
      }
      if (c === 2) { const a = await this.chooseItem(u); if (a) return a; continue; }
      if (c === 3) { const a = await this.chooseComp(u); if (a) return a; continue; }
      if (c === 4) return { who: u, kind: 'guard' };
    }
  },
  async inputDemon(u) {
    for (;;) {
      await Msg.log('<span class="nm">' + esc(u.name) + '</span>の 行動は？', 0);
      const c = await menu({ x: 268, y: 125, w: 124, title: esc(u.name), items: [{ l: '攻撃' }, { l: 'スキル', dis: !u.skills.length }, { l: '防御' }], cur: 0 });
      if (c < 0) return 'back';
      if (c === 0) { const t = await this.chooseEnemy('攻撃する 相手は？'); if (t < 0) continue; return { who: u, kind: 'attack', target: BView.enemies[t] }; }
      if (c === 1) { const a = await this.chooseSkill(u); if (a) return a; continue; }
      if (c === 2) return { who: u, kind: 'guard' };
    }
  },
  async chooseSkill(u) {
    const info = new InfoWin(8, 222, 384, 46, 3);
    const list = u.skills.filter((n) => SKILLS[n] && !SKILLS[n].fonly);
    const items = list.map((n) => { const s = SKILLS[n]; const ok = canPay(u, s); return { h: skTag(s) + esc(n), r: skCost(s), dis: !ok }; });
    const m = new MenuWin({ x: 150, y: 30, w: 242, title: esc(u.name) + 'の スキル', titleR: 'MP ' + u.mp, items, rows: 7, onMove: (i) => { const s = SKILLS[list[i]]; info.set(s ? '<b>' + esc(list[i]) + '</b>　' + esc(s.d || '') : ''); } });
    for (;;) {
      const r = await m.run();
      if (r < 0) { m.close(); info.close(); return null; }
      const s = SKILLS[list[r]];
      const tg = await this.chooseTarget(u, s.k === 'rev' ? 'dead' : s.tg);
      if (tg === undefined) continue;
      m.close(); info.close();
      return { who: u, kind: 'skill', skill: list[r], target: tg };
    }
  },
  async chooseItem(u) {
    const names = Object.keys(G.items).filter((n) => G.items[n] > 0 && ITEMS[n] && !ITEMS[n].fo);
    if (!names.length) { await Msg.log('使える アイテムが ない。', 400); return null; }
    const info = new InfoWin(8, 222, 384, 46, 3);
    const m = new MenuWin({ x: 150, y: 30, w: 242, title: 'アイテム', items: names.map((n) => ({ l: n, r: '×' + G.items[n] })), rows: 7, onMove: (i) => info.set('<b>' + esc(names[i]) + '</b>　' + esc(ITEMS[names[i]].d)) });
    for (;;) {
      const r = await m.run();
      if (r < 0) { m.close(); info.close(); return null; }
      const it = ITEMS[names[r]];
      let tg = null;
      if (it.k === 'sake') { const t = await this.chooseEnemy('だれに ささげる？'); if (t < 0) continue; tg = BView.enemies[t]; }
      else if (it.tg === 'ally') { tg = await this.chooseTarget(u, it.k === 'rev' ? 'dead' : 'ally'); if (tg === undefined) continue; }
      m.close(); info.close();
      return { who: u, kind: 'item', item: names[r], target: tg };
    }
  },
  async chooseComp(u) {
    const c = await menu({ x: 150, y: 100, w: 120, title: 'COMP', items: [{ l: '召喚', dis: G.party.length >= 3 }, { l: '帰還', dis: !G.party.length }] });
    if (c < 0) return null;
    if (c === 0) {
      const cands = G.demons.filter((d) => G.party.indexOf(d.uid) < 0);
      if (!cands.length) { await Msg.log('召喚できる 仲魔が いない。', 400); return null; }
      const items = cands.map((d) => { const cost = summonCost(d); const ok = d.hp > 0 && canSummon(d) && G.mag >= cost; return { l: d.name, r: 'Lv' + d.lv + ' MAG' + cost, dis: !ok }; });
      const r = await menu({ x: 120, y: 30, w: 272, title: '召喚する 仲魔', titleR: 'MAG ' + G.mag, items, rows: 8 });
      if (r < 0) return null;
      return { who: u, kind: 'summon', demon: cands[r], pri: 500 };
    }
    const sm = G.party.map(demonByUid).filter(Boolean);
    const r = await menu({ x: 120, y: 60, w: 220, title: '帰還させる 仲魔', items: sm.map((d) => ({ l: d.name, r: 'Lv' + d.lv })) });
    if (r < 0) return null;
    return { who: u, kind: 'return', demon: sm[r], pri: 500 };
  },
  /* 対象選択: 敵1体 */
  chooseEnemy(prompt) {
    return new Promise(async (res) => {
      const live = BView.enemies.map((e, i) => (alive(e) ? i : -1)).filter((i) => i >= 0);
      if (!live.length) { res(-1); return; }
      let k = 0;
      const mo = BView.menuOpen; BView.menuOpen = false;
      BView.cursor = live[0];
      UI.enemyLabels(true, (i) => { if (live.indexOf(i) >= 0) done(i); });
      Msg.log(prompt, 0);
      const done = (v) => { Input.pop(h); BView.cursor = -1; BView.menuOpen = mo; UI.enemyLabels(true); if (v >= 0) Snd.sfx('select'); else Snd.sfx('cancel'); res(v); };
      const h = (b) => {
        if (b === 'left' || b === 'up') { k = (k - 1 + live.length) % live.length; BView.cursor = live[k]; Snd.sfx('cursor'); UI.enemyLabels(true, (i) => { if (live.indexOf(i) >= 0) done(i); }); }
        else if (b === 'right' || b === 'down') { k = (k + 1) % live.length; BView.cursor = live[k]; Snd.sfx('cursor'); UI.enemyLabels(true, (i) => { if (live.indexOf(i) >= 0) done(i); }); }
        else if (b === 'a') done(live[k]);
        else if (b === 'b') done(-1);
      };
      Input.push(h);
      // 画面タップでも選べるように
      BView.tap = (vx) => { let best = -1, bd = 1e9; live.forEach((i) => { const d = Math.abs(BView.layout[i].x - vx); if (d < bd) { bd = d; best = i; } }); if (best >= 0) done(best); };
    }).then((v) => { BView.tap = null; return v; });
  },
  /* スキルの対象 */
  async chooseTarget(u, tg) {
    if (tg === 'one') { const t = await this.chooseEnemy('だれに？'); return t < 0 ? undefined : BView.enemies[t]; }
    if (tg === 'all' || tg === 'rand') {
      BView.cursor = 'all'; UI.enemyLabels(true);
      await Msg.log('敵全体が 対象だ。 （A：決定 / B：もどる）', 0);
      const b = await waitKey(['a', 'b']);
      BView.cursor = -1; UI.enemyLabels(true);
      if (b === 'b') { Snd.sfx('cancel'); return undefined; }
      Snd.sfx('select'); return null;
    }
    if (tg === 'party' || tg === 'self') return null;
    if (tg === 'ally' || tg === 'dead') {
      const mem = partyMembers();
      const items = mem.map((m) => ({ l: m.name, r: m.hp <= 0 ? '瀕死' : 'HP' + m.hp + '/' + m.mhp, dis: tg === 'dead' ? m.hp > 0 || isHero(m) : m.hp <= 0 }));
      const r = await menu({ x: 150, y: 110, w: 242, title: 'だれに？', items });
      return r < 0 ? undefined : mem[r];
    }
    return null;
  },
  async tryEscape() {
    if (this.boss) { await Msg.log('逃げられない！', 400); return false; }
    const avgAg = livingOf(BView.enemies).reduce((a, e) => a + e.ag, 0) / Math.max(1, livingOf(BView.enemies).length);
    const p = clamp(45 + (G.hero.ag - avgAg) * 3 + G.hero.lu, 10, 95);
    await Msg.log(esc(G.hero.name) + 'たちは 逃げだした！', 400);
    if (chance(p)) return true;
    await Msg.log('<span class="em">しかし まわりこまれて しまった！</span>', 500);
    return false;
  },
  async afterTalk(e, res) {
    if (res === 'join' || res === 'gift' || res === 'leave' || res === 'scam') {
      e.gone = true; e.anim.die = 0.7; Snd.sfx('return');
      UI.enemyLabels(true);
    } else if (res === 'angry') {
      e.buf.atk = Math.min(3, e.buf.atk + 1);
      await this.execute({ who: e, kind: 'attack', target: pick(livingOf(partyMembers())) });
    }
    UI.refresh();
  },
  /* ---------- 敵のAI ---------- */
  enemyActions() {
    const acts = [];
    livingOf(BView.enemies).forEach((e) => {
      let n = 1;
      if (e.boss) {
        n = e.acts || BOSSES[e.bossKey].acts || 1;
        if (e.hp < e.mhp * 0.35 && e.bossKey === 'ミノタウロス') n++;
        if (e.hp < e.mhp * 0.4 && e.bossKey === 'ヤマタノオロチ') n++;
      }
      for (let k = 0; k < n; k++) acts.push(this.enemyChoose(e, k));
    });
    return acts;
  },
  enemyChoose(e, k) {
    const party = livingOf(partyMembers());
    const allies = livingOf(BView.enemies);
    const opts = [{ w: e.boss ? 2 : 3, a: { who: e, kind: 'attack' } }];
    e.skills.forEach((n) => {
      const s = SKILLS[n]; if (!s || !canPay(e, s)) return;
      let w = 2;
      switch (s.k) {
        case 'heal': { const hurt = allies.filter((a) => a.hp < a.mhp * 0.5); if (!hurt.length) return; w = 4; break; }
        case 'rev': case 'escape': case 'estoma': case 'return': return;
        case 'cure': if (!allies.some((a) => a.ail)) return; break;
        case 'buf': if (e.buf[s.st] >= 2) return; w = 1; break;
        case 'debuf': w = 1; break;
        case 'dekunda': if (!allies.some((a) => Object.values(a.buf).some((v) => v < 0))) return; break;
        case 'dekaja': if (!party.some((a) => a.buf && Object.values(a.buf).some((v) => v > 0))) return; break;
        case 'shield': if (e.shield) return; w = 1; break;
        case 'summon': if (allies.length >= 3) return; w = 3; break;
        case 'curse': w = 2; break;
        case 'ail': if (s.tg === 'one') w = 1.5; break;
        default: w = s.tg === 'all' ? (e.boss ? 1.4 : 2.5) : 2;
      }
      opts.push({ w, a: { who: e, kind: 'skill', skill: n } });
    });
    let tot = 0; opts.forEach((o) => { tot += o.w; });
    let r = Math.random() * tot, ch = opts[0].a;
    for (const o of opts) { r -= o.w; if (r <= 0) { ch = o.a; break; } }
    ch = Object.assign({}, ch);
    // 対象
    const s = ch.skill ? SKILLS[ch.skill] : null;
    if (!s || s.tg === 'one') ch.target = pick(party);
    else if (s.tg === 'ally') ch.target = allies.slice().sort((a, b) => a.hp / a.mhp - b.hp / b.mhp)[0];
    if (k > 0) ch.pri = -30 * k;
    return ch;
  },
  /* ---------- 行動の実行 ---------- */
  async execute(a) {
    const u = a.who;
    if (!alive(u)) return;
    if (a.kind !== 'summon' && a.kind !== 'return' && a.kind !== 'guard') {
      if (u.ail === 'sleep') { await Msg.log(esc(nameOf(u)) + 'は 眠っている……', 350); return; }
      if (u.ail === 'para') { await Msg.log(esc(nameOf(u)) + 'は しびれて 動けない！', 350); return; }
    }
    if (u.ail === 'charm' && a.kind !== 'guard') {
      // 魅了：味方をおそう
      const own = livingOf(sideOf(u)).filter((x) => x !== u);
      if (own.length && chance(70)) { await Msg.log(esc(nameOf(u)) + 'は 魅了されている！', 300); await this.doAttack(u, pick(own), 'attack'); return; }
      await Msg.log(esc(nameOf(u)) + 'は ぼんやりしている……', 350); return;
    }
    UI.act = isEnemy(u) ? null : u; UI.refreshParty();
    switch (a.kind) {
      case 'guard': u.guard = true; break;
      case 'attack': {
        let t = a.target;
        if (!alive(t)) t = pick(livingOf(foesOf(u)));
        if (!t) return;
        if (isEnemy(u)) u.anim.lunge = 0.35;
        await this.doAttack(u, t, 'attack');
        break;
      }
      case 'gun': await this.doGun(u, a.target); break;
      case 'skill': await this.doSkill(u, a.skill, a.target); break;
      case 'item': await this.doItem(u, a.item, a.target); break;
      case 'summon': {
        const d = a.demon;
        if (G.party.length >= 3 || G.party.indexOf(d.uid) >= 0 || d.hp <= 0) return;
        const cost = summonCost(d);
        if (G.mag < cost) { await Msg.log('MAGが たりない！', 400); return; }
        G.mag -= cost; G.party.push(d.uid);
        d.buf = { atk: 0, def: 0, agi: 0, mag: 0 }; d.shield = null; d.guard = false;
        Snd.sfx('summon'); addFX('summon', partyPos(G.party.length)[0], 195, { d: 0.8 });
        UI.refresh();
        await Msg.log(esc(u.name) + 'は ' + esc(d.name) + 'を 召喚した！', 500);
        break;
      }
      case 'return': {
        const d = a.demon; const i = G.party.indexOf(d.uid); if (i < 0) return;
        G.party.splice(i, 1); d.buf = null; d.shield = null; Snd.sfx('return'); UI.refresh();
        await Msg.log(esc(d.name) + 'を COMPに もどした。', 400);
        break;
      }
      default: break;
    }
    UI.act = null; UI.refreshParty(); UI.enemyLabels(true);
  },
  hitCheck(att, tgt, skill) {
    const acc = 92 + (att.ag - tgt.ag) * 1.2 + (buf(att, 'agi') - buf(tgt, 'agi')) * 8 + ((skill && skill.acc) || 0);
    return chance(clamp(acc, 55, 99));
  },
  async doAttack(u, t, mode, skill, mul) {
    if (!alive(t)) return;
    const label = skill ? null : (isHero(u) ? '剣で 斬りかかった！' : 'の 攻撃！');
    if (label) await Msg.log(esc(nameOf(u)) + (isHero(u) ? 'は ' : '') + label, 260);
    await this.physHit(u, t, mode || 'attack', skill, mul || 1);
  },
  async physHit(u, t, mode, skill, mul, noMsgMiss) {
    if (!alive(t)) return;
    if (!this.hitCheck(u, t, skill)) { Snd.sfx('miss'); UI.popUnit(t, 'MISS', 'miss'); if (!noMsgMiss) await Msg.log(esc(nameOf(t)) + 'は ひらりと かわした！', 280); else await wait(120); return; }
    const el = mode === 'gun' ? (eqFind(BULLETS, u.bullet).el || 'phys') : 'phys';
    // 物理反射の壁
    if (el === 'phys' && t.shield === 'phys') { t.shield = null; Snd.sfx('reflect'); await Msg.log(esc(nameOf(t)) + 'の テトラカーンが 攻撃を はね返した！', 300); t = u; }
    let atk = atkPow(u, mode) * (1 + 0.2 * buf(u, 'atk'));
    const dfv = defPow(t);
    let dmg = atk * atk / (atk + dfv) * 1.15 * mul;
    dmg *= 0.9 + Math.random() * 0.2;
    let crit = false;
    if (chance(3 + u.lu / 2 + ((skill && skill.crit) || 0) - t.lu / 4)) { crit = true; dmg *= 1.5; }
    await this.applyDamage(u, t, dmg, el, { crit, phys: true, gun: mode === 'gun' });
    if (mode === 'gun' && alive(t)) { const bl = eqFind(BULLETS, u.bullet); if (bl.ail && chance(bl.ap)) await this.inflict(u, t, bl.ail, 100); }
  },
  async doGun(u, target) {
    const gn = eqFind(GUNS, u.gun);
    await Msg.log(esc(u.name) + 'は ' + esc(gn.n) + 'を 撃った！', 260);
    if (gn.tg === 'one') { let t = alive(target) ? target : pick(livingOf(BView.enemies)); if (t) { Snd.sfx('gun'); await this.physHit(u, t, 'gun', null, 1); } }
    else if (gn.tg === 'all') { for (const t of livingOf(BView.enemies)) { Snd.sfx('gun'); await this.physHit(u, t, 'gun', null, 0.7, true); } }
    else { const n = rr(gn.hits[0], gn.hits[1]); for (let k = 0; k < n; k++) { const t = pick(livingOf(BView.enemies)); if (!t) break; Snd.sfx('gun'); await this.physHit(u, t, 'gun', null, 0.75, true); } }
  },
  /* ダメージを与える（属性相性つき） */
  async applyDamage(u, t, dmg, el, o) {
    o = o || {};
    const r = resOf(t, el);
    let txt = '', cls = '';
    // 属性エフェクト
    const pos = isEnemy(t) ? enemyPos(BView.enemies.indexOf(t)) : partyPos(partyMembers().indexOf(t));
    if (o.phys) { addFX(o.gun ? 'gun' : 'slash', pos[0], pos[1], { n: o.crit ? 3 : 1 }); addFX('hit', pos[0], pos[1]); Snd.sfx(o.crit ? 'crit' : o.gun ? 'gun' : 'hit'); }
    if (!o.phys && el !== 'phys') { addFX(el, pos[0], pos[1], { d: el === 'almighty' ? 0.8 : 0.6 }); Snd.sfx(el); await wait(250); }
    if (r === 'n') { UI.popUnit(t, 'NULL', 'tag'); await Msg.log(esc(nameOf(t)) + 'には 効かなかった！', 320); this.learnRes(t, el); return 0; }
    if (r === 'x') {
      Snd.sfx('reflect'); UI.popUnit(t, 'REFLECT', 'tag'); await Msg.log(esc(nameOf(t)) + 'は 攻撃を はね返した！', 300); this.learnRes(t, el);
      if (u === t) return 0;
      const rr2 = resOf(u, el); if (rr2 === 'n' || rr2 === 'x' || rr2 === 'd') return 0;
      return this.damageUnit(u, dmg * (rr2 === 'w' ? 1.5 : rr2 === 'r' ? 0.5 : 1) * diffDmg(u), false);
    }
    if (r === 'd') { const h = Math.round(dmg); t.hp = Math.min(t.mhp, t.hp + h); UI.popUnit(t, '+' + h, 'heal'); Snd.sfx('drain'); await Msg.log(esc(nameOf(t)) + 'は 攻撃を 吸収した！', 320); this.learnRes(t, el); UI.refreshParty(); UI.enemyLabels(true); return 0; }
    if (r === 'w') { dmg *= 1.5; txt = 'WEAK'; cls = 'weak'; this.learnRes(t, el); }
    if (r === 'r') { dmg *= 0.5; txt = 'RESIST'; this.learnRes(t, el); }
    dmg *= 1 - 0.14 * buf(t, 'def');
    if (t.guard) dmg *= 0.5;
    if (u.boss) dmg *= BOSSES[u.bossKey].dmg || 1;
    dmg *= diffDmg(t);
    if (isEnemy(u) && G.moon === 8) dmg *= 1.1;
    if (txt) UI.popUnit(t, txt, 'tag', -18);
    if (o.crit) UI.popUnit(t, 'CRITICAL', 'tag', -30);
    const d = await this.damageUnit(t, dmg, o.phys, cls);
    if (r === 'w' && d > 0 && !o.silentWeak) await Msg.log('<span class="em">弱点を ついた！</span>', 200);
    return d;
  },
  learnRes(t, el) { if (isEnemy(t) && !t.boss) { const b = G.known[t.name] || (G.known[t.name] = {}); b[el] = 1; } },
  async damageUnit(t, dmg, phys, cls) {
    const d = Math.max(1, Math.round(dmg));
    t.hp = Math.max(0, t.hp - d);
    if (isEnemy(t)) { t.anim.flash = 0.25; t.anim.shake = 0.3; }
    else { UI.cardFx(t, 'hit'); if (d > t.mhp * 0.3) { Cam.shakeT = 0.25; Cam.shakeA = 3; } }
    UI.popUnit(t, String(d), cls || '');
    if (phys && t.ail === 'sleep' && t.hp > 0 && !t.drunk) t.ail = null;
    UI.refreshParty(); UI.enemyLabels(true);
    await Msg.log(esc(nameOf(t)) + 'に <span class="em">' + d + '</span>の ダメージ！', 330);
    if (t.hp <= 0) await this.kill(t);
    return d;
  },
  async kill(t) {
    if (isEnemy(t)) {
      t.gone = true; t.killed = true; t.anim.die = 0.7; Snd.sfx('vanish');
      this.exp += expReward(t.lv) * (t.boss ? 3 : 1);
      this.mac += t.lv * 15 + rnd(t.lv * 8 + 1) + (t.boss ? t.lv * 60 : 0);
      this.mag += t.lv * 3 + 8 + (t.boss ? t.lv * 10 : 0);
      UI.enemyLabels(true);
      await Msg.log(esc(nameOf(t)) + 'を たおした！', 380);
    } else {
      t.ail = null; t.buf = { atk: 0, def: 0, agi: 0, mag: 0 };
      Snd.sfx('die');
      UI.refreshParty();
      await Msg.log('<span class="em">' + esc(t.name) + (isHero(t) ? 'は たおれた……' : 'は 瀕死に なった！') + '</span>', 450);
    }
  },
  async heal(t, amt) {
    if (t.hp <= 0) return;
    const h = Math.min(t.mhp - t.hp, Math.round(amt));
    if (h <= 0) { await Msg.log(esc(nameOf(t)) + 'の HPは 満タンだ。', 240); return; }
    t.hp += h;
    if (isEnemy(t)) { const p = enemyPos(BView.enemies.indexOf(t)); addFX('heal', p[0], p[1]); } else { UI.cardFx(t, 'heal'); const p = partyPos(partyMembers().indexOf(t)); addFX('heal', p[0], p[1]); }
    UI.popUnit(t, '+' + h, 'heal');
    UI.refreshParty(); UI.enemyLabels(true);
    await Msg.log(esc(nameOf(t)) + 'の HPが ' + h + ' 回復した。', 260);
  },
  async inflict(u, t, ail, pw) {
    if (!alive(t)) return false;
    if (t.ail === ail) return false;
    let p = pw * (1 + (u.lu - t.lu) / 25);
    if (t.boss) p = (ail === 'charm' || ail === 'sleep') ? 0 : p / 3;
    if (isHero(t) && ail === 'charm') p *= 0.5;
    if (!chance(p)) { await Msg.log(esc(nameOf(t)) + 'には 効かなかった。', 260); return false; }
    t.ail = ail;
    Snd.sfx('ail');
    const pos = isEnemy(t) ? enemyPos(BView.enemies.indexOf(t)) : partyPos(partyMembers().indexOf(t));
    addFX('ail', pos[0], pos[1]);
    UI.refreshParty();
    await Msg.log(esc(nameOf(t)) + 'は <span class="em">' + AIL_NAME[ail] + '</span>に なった！', 320);
    return true;
  },
  async doSkill(u, name, target) {
    const s = SKILLS[name];
    if (!s) return;
    if (!canPay(u, s)) { await Msg.log(esc(nameOf(u)) + 'は ' + esc(name) + 'を 使えない！', 300); return; }
    payCost(u, s);
    UI.refreshParty();
    if (isEnemy(u)) u.anim.lunge = 0.35;
    await Msg.log(esc(nameOf(u)) + 'の <span class="bl">' + esc(name) + '</span>！', 300);
    const foes = livingOf(foesOf(u)), friends = livingOf(sideOf(u));
    const tgList = () => {
      if (s.tg === 'all') return livingOf(foesOf(u));
      if (s.tg === 'one') { let t = alive(target) && foesOf(u).indexOf(target) >= 0 ? target : pick(foes); return t ? [t] : []; }
      if (s.tg === 'party') return livingOf(sideOf(u));
      if (s.tg === 'ally') { if (s.k === 'rev') return target && target.hp <= 0 ? [target] : []; let t = target && alive(target) ? target : friends.slice().sort((a, b) => a.hp / a.mhp - b.hp / b.mhp)[0]; return t ? [t] : []; }
      return [u];
    };
    switch (s.k) {
      case 'atk': {
        if (s.el === 'phys') {
          if (s.tg === 'rand') { const n = rr(s.hits[0], s.hits[1]); for (let k = 0; k < n; k++) { const t = pick(livingOf(foesOf(u))); if (!t) break; await this.physHit(u, t, 'attack', s, s.mul, true); } }
          else for (const t of tgList()) { await this.physHit(u, t, 'attack', s, s.mul); if (s.ail && alive(t) && chance(s.ap)) await this.inflict(u, t, s.ail, 100); }
        } else {
          const ts = tgList();
          if (s.el === 'almighty') { addFX('almighty', VCX, isEnemy(u) ? 170 : 100, { d: 0.8 }); Snd.sfx('almighty'); await wait(300); }
          for (const t of ts) {
            // 魔法反射の壁
            let tt = t;
            if (t.shield === 'mag' && s.el !== 'almighty') { t.shield = null; Snd.sfx('reflect'); await Msg.log(esc(nameOf(t)) + 'の マカラカーンが はね返した！', 300); tt = u; }
            await this.applyDamage(u, tt, magDamage(u, tt, s), s.el, { silentWeak: ts.length > 1 });
          }
        }
        break;
      }
      case 'kill': {
        for (const t of tgList()) {
          const pos = isEnemy(t) ? enemyPos(BView.enemies.indexOf(t)) : partyPos(partyMembers().indexOf(t));
          addFX(s.el, pos[0], pos[1]); Snd.sfx(s.el); await wait(200);
          const r = resOf(t, s.el);
          let p = s.pw * (1 + (u.lu - t.lu) / 30) * (r === 'w' ? 1.6 : r === 'r' ? 0.4 : 1);
          if (r === 'n' || r === 'x' || r === 'd' || t.boss) p = 0;
          if (isHero(t)) p = 0;
          if (r === 'w' || r === 'r' || r === 'n') this.learnRes(t, s.el);
          if (chance(p)) { UI.popUnit(t, s.el === 'light' ? '消滅' : '即死', 'weak'); t.hp = 0; if (isEnemy(t)) t.anim.flash = 0.3; await Msg.log('<span class="em">' + esc(nameOf(t)) + (s.el === 'light' ? 'は 光の中に 消えた！' : 'は 呪い殺された！') + '</span>', 350); await this.kill(t); }
          else { UI.popUnit(t, 'MISS', 'miss'); await Msg.log(esc(nameOf(t)) + 'には 効かなかった。', 260); }
        }
        break;
      }
      case 'heal': {
        const ts = s.tg === 'party' ? livingOf(sideOf(u)) : tgList();
        Snd.sfx('heal');
        for (const t of ts) await this.heal(t, s.full ? t.mhp : healAmt(u, s));
        break;
      }
      case 'rev': {
        const ts = tgList();
        if (!ts.length) { await Msg.log('しかし 何も おこらなかった。', 300); break; }
        for (const t of ts) { t.hp = Math.max(1, Math.round(t.mhp * s.pw)); t.ail = null; Snd.sfx('heal'); UI.cardFx(t, 'heal'); UI.refreshParty(); await Msg.log(esc(t.name) + 'は 生きかえった！', 350); }
        break;
      }
      case 'cure': {
        const ts = s.tg === 'party' ? livingOf(sideOf(u)) : tgList();
        Snd.sfx('heal');
        for (const t of ts) { if (t.ail && s.st.indexOf(t.ail) >= 0) { await Msg.log(esc(nameOf(t)) + 'の ' + AIL_NAME[t.ail] + 'が 治った。', 280); t.ail = null; UI.refreshParty(); } }
        break;
      }
      case 'buf': case 'debuf': {
        const up = s.k === 'buf';
        const ts = up ? livingOf(sideOf(u)) : livingOf(foesOf(u));
        Snd.sfx(up ? 'buff' : 'debuff');

function summonCost(d) { return d.lv; }
function canPay(u, s) {
  if (s.hp) return u.hp > Math.ceil(u.mhp * s.hp / 100);
  if (s.mp) return (u.mp || 0) >= s.mp;
  return true;
}
function payCost(u, s) {
  if (s.hp) u.hp -= Math.ceil(u.mhp * s.hp / 100);
  else if (s.mp && !u.boss) u.mp -= s.mp;
}
function magDamage(u, t, s) {
  const matk = (u.ma * 2 + u.lv) * (1 + 0.2 * buf(u, 'mag'));
  const mdef = t.ma + t.vi + t.lv * 0.5;
  let d = (s.pw + matk * (s.mul || 1)) * 100 / (100 + mdef);
  return d * (0.92 + Math.random() * 0.16);
}
function healAmt(u, s) { return s.pw + (u.ma * 2 + u.lv) * (s.mul || 1); }

/* ---------- レベルアップ ---------- */
async function levelUpCheck(u) {
  let ups = 0;
  while (u.exp >= expNext(u.lv) && u.lv < 99) {
    u.exp -= expNext(u.lv); u.lv++; ups++;
    if (isHero(u)) {
      const old = u.mhp; u.mhp = heroMaxHP(u); u.hp = Math.min(u.mhp, u.hp + (u.mhp - old));
      Snd.sfx('levelup');
      UI.refreshParty();
      await Msg.say(u.name + 'は レベル ' + u.lv + 'に あがった！');
      await allocPoint(u);
    } else {
      const def = DEMONS[u.name];
      const gain = chance(80) ? 2 : 1;
      for (let k = 0; k < gain; k++) { const W = def.w.reduce((a, b) => a + b, 0); let r = Math.random() * W; for (let i = 0; i < 5; i++) { r -= def.w[i]; if (r <= 0) { u[STAT_KEYS[i]]++; break; } } }
      const oh = u.mhp, om = u.mmp;
      u.mhp = demonMaxHP(u); u.mmp = demonMaxMP(u);
      u.hp = Math.min(u.mhp, u.hp + (u.mhp - oh)); u.mp = Math.min(u.mmp, u.mp + (u.mmp - om));
      Snd.sfx('levelup');
      UI.refreshParty();
      await Msg.say(u.name + 'は レベル ' + u.lv + 'に あがった！');
      for (const k of def.skills) {
        if (k.lv === u.lv && u.skills.indexOf(k.n) < 0) {
          if (u.skills.length >= 8) { await Msg.say(u.name + 'は ' + k.n + 'を おぼえようとしたが、 これ以上 おぼえられない。'); continue; }
          u.skills.push(k.n); Snd.sfx('buff');
          await Msg.say(u.name + 'は <' + k.n + '> を おぼえた！');
        }
      }
      recordBook(u);
    }
  }
  return ups;
}

const Explore = {
  anim: null, busy: false, lastStep: 0, lastTurn: 0, magWarned: false,
  handler: null,
  start() {
    if (!this.handler) this.handler = (b, rep) => this.onKey(b, rep);

    this.busy = false;
  },
  stop() { if (this.handler) Input.pop(this.handler); },
  idle() { return G && G.mode === 'explore' && Input.top() === this.handler && !this.anim && !this.busy; },
  onKey(b, rep) {
    if (rep || !this.idle()) return;
    if (b === 'up') this.forward();
    else if (b === 'left') this.turn(-1);
    else if (b === 'right') this.turn(1);
    else if (b === 'down') this.turn(2);

  async run(fn) {

  },
  tick() {
    const now = performance.now();

      if (Input.held.up && now - this.lastStep > 40) this.forward();

  },

      case 'W': {
        const w = (FLOORS[G.floor].warps || {})[key];
        if (w) { Snd.sfx('warp'); await fade(true, 220); G.x = w[0]; G.y = w[1]; markSeen(); await fade(false, 220); }
        evented = true; break;
      }
      case '$': await openTreasure(); evented = true; break;
      case 'E': { const ev = FLOORS[G.floor].events[key]; if (ev && EV[ev]) await EV[ev](); Scene.actorName = null; evented = true; break; }
      case 'B': { const ev = FLOORS[G.floor].boss[key]; if (ev && EV[ev] && !bossDone(G.x, G.y)) await EV[ev](); Scene.actorName = null; evented = true; break; }
      case 'U': await this.stairs(-1); return;
      case 'V': await this.stairs(1); return;
      default: break;
    }
    if (G.mode !== 'explore') return;
    if (!evented) await this.encounterCheck(t);
  },
  async stairs(dirn) {
    const up = dirn < 0;
    const a = await ask(up ? (G.floor === 0 ? '地上の シェルターへ もどりますか？' : '上の階へ のぼりますか？') : '下の階へ おりますか？', ['はい', 'いいえ']);
    Msg.clear();
    if (a !== 0) return;
    Snd.sfx('step');
    await changeFloor(up ? G.floor - 1 : G.floor + 1, up ? 'up' : 'down');
  },
  async encounterCheck(t) {
    if (!FLOORS[G.floor].enc) return;
    let inc = rr(6, 14);
    if (G.moon === 8) inc *= 1.25;
    if (t === '*') inc *= 1.4;
    G.danger += inc;
    if (G.danger < 100) return;
    G.danger = rnd(20);
    const list = makeEncounter();
    if (G.estoma > 0) { const avg = list.reduce((a, e) => a + e.lv, 0) / list.length; if (avg < G.hero.lv - 1) return; }
    await battle(list, {});
  },
};
function makeEncounter() {
  const F = FLOORS[G.floor];
  const tot = F.enc.reduce((a, e) => a + e[1], 0);
  const wp = () => { let r = Math.random() * tot; for (const e of F.enc) { r -= e[1]; if (r <= 0) return e[0]; } return F.enc[0][0]; };
  const n = rr(F.grp[0], F.grp[1]);
  const main = wp();
  const list = [];
  for (let i = 0; i < n; i++) {
    const nm = i > 0 && chance(35) ? wp() : main;
    const def = DEMONS[nm];
    list.push(makeDemon(nm, Math.max(1, def.lv + rr(-1, 1))));
  }
  return list;
}

  [G.hero].concat(G.demons).forEach((u) => { if (u.hp > 0) { u.hp = u.mhp; u.mp = u.mmp; u.ail = null; } });
  Snd.sfx('heal'); UI.refresh();

}
function healCost(revive) {
  let total = 0, dead = 0;
  [G.hero].concat(G.demons).forEach((u) => {
    if (u.hp <= 0) { if (revive) { dead++; total += u.lv * 40 + 60; } }
    else total += Math.ceil((u.mhp - u.hp) * 0.6) + Math.ceil(((u.mmp || 0) - (u.mp || 0)) * 1.8) + (u.ail ? 30 : 0);
  });
  return { total, dead };
}

/* 合体演出（邪教の館の背景に重ねる） */
function drawFusion(g, t) {
  const F = Scene.fusion; if (!F) return;
  const e = (performance.now() - F.t0) / 1000;
  const sa = Spr.demon(F.a, 0.6), sb = Spr.demon(F.b, 0.6);
  if (!F.r) {
    g.drawImage(sa.cv, Math.round(62 - sa.ox), Math.round(140 - sa.oy));
    g.drawImage(sb.cv, Math.round(258 - sb.ox), Math.round(140 - sb.oy));
    return;
  }
  const p = Math.min(1, e / 1.6);
  if (p < 1) {
    const ax = 62 + (VCX - 62) * p * p, bx = 258 - (258 - VCX) * p * p;
    g.globalAlpha = 1 - p * 0.5;
    g.drawImage(sa.cv, Math.round(ax - sa.ox), Math.round(140 - sa.oy));
    g.drawImage(sb.cv, Math.round(bx - sb.ox), Math.round(140 - sb.oy));
    g.globalAlpha = 1;
    g.strokeStyle = 'rgba(255,120,160,' + p + ')'; g.lineWidth = 2;
    for (let k = 0; k < 6; k++) { g.beginPath(); g.arc(VCX, 110, 60 * (1 - p) + k * 6, e * 4 + k, e * 4 + k + 2); g.stroke(); }
  } else {
    const q = Math.min(1, (e - 1.6) / 0.5);
    const sr = Spr.demon(F.r, 0.85);
    g.fillStyle = 'rgba(255,255,255,' + (1 - q) + ')'; g.fillRect(0, 0, VW, VH);
    g.globalAlpha = q;
    const gr = g.createRadialGradient(VCX, 110, 5, VCX, 110, 90); gr.addColorStop(0, 'rgba(255,200,230,0.5)'); gr.addColorStop(1, 'rgba(255,200,230,0)'); g.fillStyle = gr; g.fillRect(0, 0, VW, VH);
    g.drawImage(sr.cv, Math.round(VCX - sr.ox), Math.round(165 - sr.oy));
    g.globalAlpha = 1;
  }
}

const Title = {
  async show() {
    $('title').classList.add('on');
    Music.play('title');
    const save = loadSave();
    for (;;) {
      const items = [{ l: 'はじめから' }, { l: 'つづきから', dis: !save }, { l: 'サウンド：' + (Opt.sound ? 'ON' : 'OFF') }];
      const c = await menu({ x: 120, y: 300, w: 160, items, cancel: false, cur: save ? 1 : 0 });
      if (c === 2) { setSound(!Opt.sound); continue; }
      if (c === 0) {
        if (save) { const a = await menu({ x: 90, y: 300, w: 220, title: 'セーブデータを 上書きします', items: [{ l: 'はじめる' }, { l: 'やめる' }] }); if (a !== 0) continue; }
        const name = await this.nameEntry();
        if (!name) continue;
        const diff = await menu({ x: 90, y: 290, w: 220, title: '難易度', items: [{ l: 'やさしい', r: '被ダメ↓ 経験値↑' }, { l: 'ふつう', r: '' }, { l: 'むずかしい', r: '被ダメ↑' }], cur: 1 });
        if (diff < 0) continue;
        G = newState(name, diff);
        UI.refresh();
        $('title').classList.remove('on');
        Music.stop();
        Scene.name = 'story';
        await EV.intro();
        await fade(true, 400);
        await enterHub();
        return;
      }
      if (c === 1 && save) {
        G = save;
        $('title').classList.remove('on');
        if (G.floor >= 0 && G.mode === 'explore') {
          await fade(true, 200);
          Scene.name = null; Explore.start();
          Music.play(FLOORS[G.floor].bgm); UI.refresh();
          await fade(false, 300);
        } else { await fade(true, 200); await enterHub(); }
        return;
      }
    }
  },
  nameEntry() {
    return new Promise((res) => {
      const box = document.createElement('div');
      box.className = 'win'; box.id = 'nameBox';
      box.innerHTML = '主人公の 名前を 入力してください<br><input id="nameIn" maxlength="6" value="アキラ"><div class="btns"><button class="fbtn" id="nameOk">決定</button><button class="fbtn" id="nameNo">もどる</button></div>';
      layer.appendChild(box);
      box.style.pointerEvents = 'auto';
      const inp = $('nameIn');
      setTimeout(() => { try { inp.focus(); inp.select(); } catch (e) { /* 無視 */ } }, 50);

    });
  },
};

/* ============================================================

Scene.story = async function (lines) {
  const prev = this.name;
  if (this.name !== 'ending') this.name = 'story';
  const el = $('storyText');
  for (const l of lines) {
    el.style.opacity = 0;
    await sleep(250);
    el.textContent = l;
    el.style.opacity = 1;
    await sleep(350);
    await waitKey(['a', 'b']);
    Snd.sfx('cursor');
  }
  el.style.opacity = 0;
  await sleep(300);
  el.textContent = '';
  this.name = prev === 'story' ? null : prev;
};

/* ============================================================
   画面レイアウト・入力パッド

const PAD_BTNS = ['pU', 'pL', 'pR', 'pD', 'pM', 'pB', 'pA'];
function layout() {
  const W = window.innerWidth, Hh = window.innerHeight;
  const touch = (window.matchMedia && matchMedia('(pointer: coarse)').matches) || 'ontouchstart' in window;
  const land = W > Hh * 1.05;
  const app = $('app'), scr = $('screen'), pad = $('pad'), hint = $('hint');
  let AW, AH;
  const pos = (id, x, y, w, h) => { const e = $(id); Object.assign(e.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' }); };
  if (!touch) {
    AW = 400; AH = 516; scr.style.left = '0px'; pad.classList.remove('on');
    hint.style.display = 'block'; Object.assign(hint.style, { left: '0px', top: '500px', width: '400px' });
  } else if (!land) {
    AW = 400; AH = 690; scr.style.left = '0px'; pad.classList.add('on'); hint.style.display = 'none';
    Object.assign(pad.style, { left: '0px', top: '0px' });
    pos('pU', 62, 508, 60, 58); pos('pD', 62, 624, 60, 58); pos('pL', 4, 566, 58, 58); pos('pR', 122, 566, 58, 58);
    pos('pM', 206, 510, 76, 34); pos('pB', 216, 590, 70, 70); pos('pA', 306, 552, 82, 82);
  } else {
    const side = clamp(Math.round((W / Hh * 496 - 400) / 2), 112, 420);
    AW = 400 + side * 2; AH = 496; scr.style.left = side + 'px'; pad.classList.add('on'); hint.style.display = 'none';
    Object.assign(pad.style, { left: '0px', top: '0px' });
    const cx = Math.min(side / 2 + 6, side - 60), rx = 400 + side + Math.max(60, side / 2 - 6);
    pos('pU', cx - 28, 222, 56, 56); pos('pD', cx - 28, 334, 56, 56); pos('pL', cx - 86, 278, 56, 56); pos('pR', cx + 30, 278, 56, 56);
    pos('pM', rx - 45, 152, 90, 34); pos('pB', rx - 72, 330, 68, 68); pos('pA', rx + 4, 248, 80, 80);
  }
  const s = Math.min(W / AW, Hh / AH);
  Object.assign(app.style, { width: AW + 'px', height: AH + 'px', transform: 'translate(' + Math.round((W - AW * s) / 2) + 'px,' + Math.round((Hh - AH * s) / 2) + 'px) scale(' + s + ')' });
}
function setupPad() {
  PAD_BTNS.forEach((id) => {
    const el = $(id); const b = el.dataset.b;
    const down = (e) => { e.preventDefault(); el.classList.add('on'); Input.press(b); };
    const up = (e) => { e.preventDefault(); el.classList.remove('on'); Input.release(b); };
    el.addEventListener('pointerdown', down);
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
    el.addEventListener('pointerleave', up);
  });
  $('sndBtn').addEventListener('click', (e) => { e.preventDefault(); Snd.unlock(); setSound(!Opt.sound); });
  view.addEventListener('pointerdown', (e) => {
    Snd.unlock();
    if (BView.tap) { const r = view.getBoundingClientRect(); BView.tap((e.clientX - r.left) / r.width * VW); }
  });
  document.addEventListener('pointerdown', () => Snd.unlock(), { passive: true });
}

/* ============================================================
   メインループ
   ============================================================ */
const curCv = document.createElement('canvas'); curCv.width = VW; curCv.height = VH;
let lastFrame = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, Math.max(0, (now - lastFrame) / 1000)); lastFrame = now;
  const t = now / 1000;
  if ($('title').classList.contains('on')) { drawTitle(t); return; }
  if (!G) return;
  G.time += dt;
  if (G.mode === 'explore') Explore.tick();
  tickBattleAnim(dt);
  if (Cam.turnT > 0) Cam.turnT = Math.max(0, Cam.turnT - dt);
  if (Cam.shakeT > 0) Cam.shakeT = Math.max(0, Cam.shakeT - dt);
  if (Cam.flashT > 0) Cam.flashT = Math.max(0, Cam.flashT - dt);
  const comp = $('compass');
  if (G.mode === 'battle') { drawBattle(t); comp.style.display = 'none'; }
  else if (Scene.name) { Scene.draw(t); if (Scene.name === 'jakyo') drawFusion(vg, t); comp.style.display = 'none'; }
  else if (G.floor >= 0) {
    drawDungeon(G.floor, G.x, G.y, G.dir, t, Explore.moveT());
    if (Cam.turnT > 0) {
      const p = 1 - Cam.turnT / 0.14;
      curCv.getContext('2d').drawImage(view, 0, 0);
      vg.fillStyle = '#000'; vg.fillRect(0, 0, VW, VH);
      if (Cam.turnDir === 2) { vg.drawImage(curCv, 0, 0); vg.globalAlpha = 1 - p; vg.drawImage(snapCv, 0, 0); vg.globalAlpha = 1; }
      else { const d = Cam.turnDir; vg.drawImage(curCv, Math.round(d * (1 - p) * VW), 0); vg.drawImage(snapCv, Math.round(-d * p * VW), 0); }
    }
    if (Cam.flashT > 0) { vg.fillStyle = 'rgba(120,200,255,' + Cam.flashT * 3 + ')'; vg.fillRect(0, 0, VW, VH); }
    drawMinimap(G.floor, G.x, G.y, G.dir);
    comp.style.display = 'block'; comp.textContent = DIR_NAME[G.dir] + '　B' + (G.floor + 1);
  }
  if (Scene.actorName) drawActor(t);
  const sh = Cam.shakeT > 0 ? Cam.shakeA : 0;
  view.style.transform = sh ? 'translate(' + ((Math.random() - 0.5) * sh * 2).toFixed(1) + 'px,' + ((Math.random() - 0.5) * sh * 2).toFixed(1) + 'px)' : '';
}
function boot() {
  layout();
  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', () => setTimeout(layout, 200));
  setupPad();
  setSound(/[?&]mute\b/.test(location.search) ? false : Opt.sound);
  requestAnimationFrame(frame);
  Title.show().catch((e) => console.error(e));
}
boot();

let lastT = 0, accT = 0;
function loop(t) {
  requestAnimationFrame(loop);
  const now = t || performance.now();
  let dt = (now - lastT) / 1000; lastT = now;
  if (!(dt > 0)) dt = 1 / 60;
  if (dt > .1) dt = .1;
  if (G.state !== 'race' || !TR) return;
  if (!G.paused) {
    accT += dt;
    let n = 0;
    while (accT >= 1 / 120 && n < 10) { updateRace(1 / 120); accT -= 1 / 120; n++; }
    updateCam(dt);

  renderGround();

  g.strokeStyle = cs.road[0]; g.lineWidth = 5; g.stroke();
  g.strokeStyle = '#ffde4d'; g.lineWidth = 2;
  g.beginPath(); g.moveTo(pts[0][0] * sc + ox - 5, pts[0][1] * sc + oy); g.lineTo(pts[0][0] * sc + ox + 5, pts[0][1] * sc + oy); g.stroke();
  return cvp.toDataURL();
}
function courseCard(i, sel) {
  const cs = COURSES[i], b = G.best[cs.id] || {};
  return '<div class="card' + (sel ? ' sel' : '') + '" data-c="' + i + '">' +
    '<span class="tag">LV' + cs.lv + '</span>' +
    '<h3>' + cs.name + '</h3><div class="en">' + cs.en + '</div>' +
    '<img src="' + previewPath(cs, 150) + '" style="width:100%;display:block;border-radius:6px;background:' + cs.voidc + ';margin:4px 0">' +
    '<div class="stat"><b>BEST</b>' + (b.lap ? fmtT(b.lap) : "-'--\"---") + '</div></div>';
}
function courseScreen() {
  const u = showUI('<div class="panel"><h2>' + (G.mode === 'time' ? 'タイムアタック：コース選択' : '練習走行：コース選択') + '</h2>' +
    '<div class="grid">' + COURSES.map((c, i) => courseCard(i, i === G.csIdx)).join('') + '</div>' +
    '<div class="row"><button class="btn pri" id="bGo">このコースにする</button><button class="btn gray" id="bBack">もどる</button></div></div>');
  const sel = () => u.querySelectorAll('.card').forEach(c => c.classList.toggle('sel', +c.dataset.c === G.csIdx));
  u.querySelectorAll('.card').forEach(c => c.onclick = () => { G.csIdx = +c.dataset.c; sel(); });
  u.querySelector('#bGo').onclick = machineScreen;
  u.querySelector('#bBack').onclick = titleScreen;
}
function leagueScreen() {
  const u = showUI('<div class="panel"><h2>グランプリ：リーグ選択</h2>' +
    '<div class="grid">' + LEAGUES.map((l, i) =>
      '<div class="card" data-l="' + i + '"><h3>' + l.name + '</h3><div class="en">' + l.en + '</div>' +
      '<div class="stat" style="margin-top:6px">' + l.cs.map(c => COURSES[c].name).join(' → ') + '</div>' +
      '<div class="stat"><b>難易度</b>' + '★'.repeat(i + 1) + '</div></div>').join('') + '</div>' +
    '<div class="row"><button class="btn gray" id="bBack">もどる</button></div></div>');
  u.querySelectorAll('.card').forEach(c => c.onclick = () => {
    const i = +c.dataset.l;
    G.mode = 'gp'; G.gp = { lg: i, round: 0, pts: {} };
    G.skill = LEAGUES[i].skill; G.csIdx = LEAGUES[i].cs[0];
    machineScreen();
  });
  u.querySelector('#bBack').onclick = titleScreen;
}
function machineScreen() {
  if (G.mode !== 'gp') G.skill = .92;
  const cs = COURSES[G.csIdx];
  const u = showUI('<div class="panel"><h2>マシン選択</h2>' +
    '<div class="lead" style="margin:2px">コース：<b style="color:#8ff0ff">' + cs.name + '</b>　' +
    (G.mode === 'gp' ? LEAGUES[G.gp.lg].name + ' 第' + (G.gp.round + 1) + '戦' : G.mode === 'time' ? 'タイムアタック 3周' : '練習走行 ' + cs.laps + '周') + '</div>' +
    '<div class="grid">' + [0, 1, 2, 3].map(i => machineCard(i, i === G.machine)).join('') + '</div>' +
    '<div class="row"><button class="btn pri" id="bGo">スタート</button><button class="btn gray" id="bBack">もどる</button></div></div>');
  paintCards();
  u.querySelectorAll('.card').forEach(c => c.onclick = () => {
    G.machine = +c.dataset.m;
    u.querySelectorAll('.card').forEach(d => d.classList.toggle('sel', +d.dataset.m === G.machine));
  });
  u.querySelector('#bGo').onclick = () => startRace(G.mode);
  u.querySelector('#bBack').onclick = () => G.mode === 'gp' ? leagueScreen() : courseScreen();
}
/* --- リザルト --- */
function resultRows(rs, withPts) {
  return rs.map((r, i) =>
    '<tr class="' + (r.isP ? 'me' : '') + '"><td class="n">' + (i + 1) + '</td><td style="color:' + r.M.c1 + '">' + r.M.name + '</td>' +
    '<td class="n">' + (r.fin === 1 ? fmtT(r.finT) : (r.fin === 2 || (r.dead && r.spare <= 0) ? 'RETIRE' : 'LAP ' + Math.min(Math.max(r.lap, 1), G.laps))) + '</td>' +
    (withPts ? '<td class="n">' + POINTS[i] + '</td>' : '') + '</tr>').join('');
}
function showResult() {
  G.state = 'result'; G.paused = false;
  SND.stopEngine(); SND.bgmStop();
  const rs = updateRanks(), p = G.P, retired = G.phase === 'over';
  const cs = COURSES[G.csIdx], b = G.best[cs.id] || {};
  if (G.mode === 'time') {
    const u = showUI('<div class="panel"><h2>タイムアタック結果</h2>' +
      '<div class="big">' + (retired ? 'RETIRE' : fmtT(p.finT)) + '</div>' +
      '<div class="lead">ベストラップ <b style="color:#ffde4d">' + fmtT(b.lap) + '</b><br>' +
      p.lapT.map((t, i) => 'LAP' + (i + 2) + ' ' + fmtT(t)).join(' ／ ') + '</div>' +
      '<div class="row"><button class="btn pri" id="bR">もう一度</button><button class="btn" id="bC">コース選択</button>' +
      '<button class="btn gray" id="bT">タイトル</button></div></div>');
    u.querySelector('#bR').onclick = () => startRace('time');
    u.querySelector('#bC').onclick = courseScreen;
    u.querySelector('#bT').onclick = titleScreen;
    return;
  }
  if (G.mode === 'practice') {
    const u = showUI('<div class="panel"><h2>' + cs.name + '　リザルト</h2>' +
      '<div class="big">' + (retired ? 'RETIRE' : ORD(p.rank)) + '</div>' +
      '<div class="scroll"><table><tr><th>順位</th><th>マシン</th><th>タイム</th></tr>' + resultRows(rs, false) + '</table></div>' +
      '<div class="row"><button class="btn pri" id="bR">もう一度</button><button class="btn" id="bC">コース選択</button>' +
      '<button class="btn gray" id="bT">タイトル</button></div></div>');
    u.querySelector('#bR').onclick = () => startRace('practice');
    u.querySelector('#bC').onclick = courseScreen;
    u.querySelector('#bT').onclick = titleScreen;
    return;
  }
  /* グランプリ */
  const gp = G.gp, lg = LEAGUES[gp.lg];
  const ok = !retired && p.rank <= 4;
  if (ok) rs.forEach((r, i) => { gp.pts[r.mi] = (gp.pts[r.mi] || 0) + POINTS[i]; });
  const u = showUI('<div class="panel"><h2>' + cs.name + '　第' + (gp.round + 1) + '戦 リザルト</h2>' +
    '<div class="big" style="color:' + (ok ? '#ffde4d' : '#ff6a6a') + '">' + (retired ? 'RETIRE' : ORD(p.rank)) + '</div>' +
    (ok ? '' : '<div class="lead" style="color:#ff9a9a">4位以内でないと次のコースへ進めない！</div>') +
    '<div class="scroll"><table><tr><th>順位</th><th>マシン</th><th>タイム</th><th>PTS</th></tr>' + resultRows(rs, true) + '</table></div>' +
    '<div class="row">' + (ok ? '<button class="btn pri" id="bN">総合順位へ</button>' : '<button class="btn pri" id="bR">もう一度</button>') +
    '<button class="btn gray" id="bT">やめる</button></div></div>');
  if (ok) u.querySelector('#bN').onclick = standingsScreen; else u.querySelector('#bR').onclick = () => startRace('gp');
  u.querySelector('#bT').onclick = titleScreen;
}
function standingsScreen() {
  const gp = G.gp, lg = LEAGUES[gp.lg];
  const list = MACHINES.map((M, i) => ({ M, i, p: gp.pts[i] || 0 })).sort((a, b) => b.p - a.p);
  const last = gp.round >= lg.cs.length - 1;
  const champ = last && list[0].i === G.machine;
  const u = showUI('<div class="panel"><h2>' + lg.name + '　総合順位</h2>' +
    (last ? '<div class="big" style="color:' + (champ ? '#ffde4d' : '#8ff0ff') + '">' + (champ ? '★ 優勝 ★' : '総合' + (list.findIndex(x => x.i === G.machine) + 1) + '位') + '</div>' : '') +
    '<div class="scroll"><table><tr><th>順位</th><th>マシン</th><th>合計PTS</th></tr>' +
    list.map((x, i) => '<tr class="' + (x.i === G.machine ? 'me' : '') + '"><td class="n">' + (i + 1) + '</td>' +
      '<td style="color:' + x.M.c1 + '">' + x.M.name + '</td><td class="n">' + x.p + '</td></tr>').join('') + '</table></div>' +
    '<div class="row">' + (last ? '<button class="btn pri" id="bT">タイトルへ</button>' :
      '<button class="btn pri" id="bN">第' + (gp.round + 2) + '戦へ（' + COURSES[lg.cs[gp.round + 1]].name + '）</button><button class="btn gray" id="bT">やめる</button>') + '</div></div>');
  if (last) SND.sfx(champ ? 'ok' : 'beep');
  else u.querySelector('#bN').onclick = () => { gp.round++; G.csIdx = lg.cs[gp.round]; startRace('gp'); };
  u.querySelector('#bT').onclick = titleScreen;
}
/* --- ポーズ --- */
G.togglePause = function () {
  if (G.state !== 'race') return;
  G.paused = !G.paused;
  if (G.paused) {
    SND.stopEngine(); SND.bgmStop();
    const u = showUI('<div class="panel" style="max-width:340px"><h2>ポーズ</h2>' +
      '<div class="row"><button class="btn pri" id="bC">つづける</button></div>' +
      '<div class="row"><button class="btn" id="bR">やりなおし</button><button class="btn gray" id="bT">やめる</button></div>' +
      '<div class="row"><button class="btn gray" id="bS">' + (SND.on ? '🔊 サウンド ON' : '🔇 サウンド OFF') + '</button>' +
      '<button class="btn gray' + (G.autoAcc ? ' on' : '') + '" id="bA">オートアクセル ' + (G.autoAcc ? 'ON' : 'OFF') + '</button></div></div>', true);
    u.querySelector('#bC').onclick = () => G.togglePause();
    u.querySelector('#bR').onclick = () => startRace(G.mode);
    u.querySelector('#bT').onclick = titleScreen;
    u.querySelector('#bS').onclick = e => { const on = SND.toggle(); e.target.textContent = on ? '🔊 サウンド ON' : '🔇 サウンド OFF'; };
    u.querySelector('#bA').onclick = e => { G.autoAcc = !G.autoAcc; e.target.textContent = 'オートアクセル ' + (G.autoAcc ? 'ON' : 'OFF'); e.target.classList.toggle('on', G.autoAcc); };
  } else {
    hideUI(); $('touch').classList.toggle('on', touchMode()); $('pauseBtn').classList.add('on');
    SND.resume(); SND.startEngine(); SND.bgmStart(G.csIdx);
    lastT = performance.now(); accT = 0;
  }
};
/* --- 起動 --- */
function init() {
  resize();
  for (let i = 0; i < MACHINES.length; i++) SPR[i] = buildSprites(MACHINES[i]);
  initTouch();
  titleScreen();
  requestAnimationFrame(loop);
}
init();
</script>
</body>
</html>

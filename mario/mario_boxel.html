    if (allCleared && !wasCleared) { G.state = 'ending'; G.timer = 0; SFX.clear(); }
    else { G.state = 'map'; SFX.enter(); }
  } else {
    startStage(i + 1, player.power);   // ほかは次のステージへそのまま続く
  }
}
function gameOver() {
  if (G.score > save.best) { save.best = G.score; writeSave(); }
  G.state = 'gameover'; G.timer = 0;
  SFX.gameover();
}

function update(dt) {
  G.t += dt;
  if (hit('mute')) muted = !muted;
  /* ボクセルの厚み：普通 → 厚い → 平面（ドット絵）を切り替える */
  if (hit('vox')) voxDepth = voxDepth === VOX_D ? 10 : voxDepth === 10 ? 0 : VOX_D;
  G.fade = clamp(G.fade + G.fadeDir*dt*3, 0, 1);

  if (G.state === 'title') {
    if (hit('start') || hit('jump')) { ac(); G.state = 'map'; G.score = 0; G.coins = 0; G.lives = 3; SFX.enter(); }
    return;
  }
  if (G.state === 'map') {
    const unlocked = i => i === 0 || (save.stages[i-1] && save.stages[i-1].cleared);
    if (hit('right') && G.cursor < LEVELS.length - 1 && unlocked(G.cursor + 1)) { G.cursor++; SFX.select(); }
    if (hit('left') && G.cursor > 0) { G.cursor--; SFX.select(); }
    if (hit('start') || hit('jump')) { SFX.enter(); startStage(G.cursor); }
    if (hit('back')) { G.state = 'title'; }
    return;
  }
  if (G.state === 'gameover') {
    G.timer += dt;
    if (G.timer > 1 && (hit('start') || hit('jump') || hit('restart'))) {
      G.lives = 3; G.score = 0; G.coins = 0; G.state = 'map';
    }
    return;
  }
  if (G.state === 'ending') {
    G.timer += dt;
    if (G.timer > 1.5 && (hit('start') || hit('jump'))) G.state = 'title';
    return;
  }
  if (G.state === 'pause') {
    if (hit('pause')) G.state = 'play';
    if (hit('back')) { G.state = 'map'; }
    return;
  }

  if (G.freeze > 0) { G.freeze -= dt; updateFx(dt); return; }   // ヒットストップ

  if (hit('restart')) { saveRoom = null; loadLevel(G.levelIndex, 0, !!checkpoint); G.state = 'play'; return; }
  if (hit('back') && G.state === 'play') { G.state = 'map'; return; }

  if (G.state === 'play') {
    if (hit('pause')) { G.state = 'pause'; return; }
    if (G.msgT > 0) G.msgT -= dt;
    if (!lvl.room) {
      G.stageTime += dt;
      G.timer += dt;
      if (G.timer >= 0.4) { G.timer -= 0.4; G.time--; if (G.time <= 0) { G.time = 0; killPlayer(true); } }
    }
    updateGimmicks(dt);
    updatePlayer(dt);
    updateEnemies(dt);
    updateSprings(dt);
    updateBoss(dt);
    updateItems(dt);
    updateFires(dt);
    updateCamera(dt, false);
    updateBGM(dt);
  }
  else if (G.state === 'dead') {
    G.timer += dt;
    player.vy += GRAV*0.8*dt;
    player.y += player.vy*dt;
    if (G.timer > 2.2) {
      G.lives--; saveRoom = null;
      if (G.lives <= 0) gameOver();
      else { loadLevel(G.levelIndex, checkpoint ? checkpoint.power : 0, !!checkpoint); G.state = 'play'; }
    }
  }
  else if (G.state === 'clear') {
    G.timer += dt;
    if (lvl.flagX != null) {
      const poleX = lvl.flagX*TILE + 8;
      if (G.timer < 1.2) {
        player.x = poleX - 4;
        player.y = Math.min((GROUND_ROW - (player.power>0?2:1))*TILE, player.y + 260*dt);
      } else if (!player.entered) {
        player.vy += GRAV*dt; player.vx = 140; player.face = 1; moveEntity(player, dt);
        /* 城のドアまで歩いたら中へ入って消える */
        if (player.x + player.w/2 >= castleDoorX()) {
          player.entered = true; player.vx = 0;
          G.clearEnd = G.timer + G.fwLeft*0.34 + 1.0;
          SFX.enter();
        }
      }
    }
    if (G.time > 0 && G.timer > 1.4) {
      const d = Math.min(G.time, Math.ceil(dt*60));
      G.time -= d; G.score += d*50;
      if (G.time % 4 === 0) tone(1200, 0.03, 'square', 0.03);
    }
    if (player.entered && G.fwLeft > 0) {
      G.fwT -= dt;
      if (G.fwT <= 0) { G.fwT = 0.34; G.fwLeft--; launchFirework(); }
    }
    const endT = G.clearEnd != null ? G.clearEnd : 3.0;
    if (G.timer > endT) G.fadeDir = 1;
    if (G.timer > endT + 1.2) { G.fade = 1; G.fadeDir = -1; finishStage(); }
    updateCamera(dt, false);
  }
  updateFx(dt);
}

/* ============================================================================
   11. 描画
   ============================================================================ */
const R = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(x|0, y|0, w|0, h|0); };

/* ----------------------------------------------------------------------------
   ボクセル化
   ドット絵をそのままオフスクリーンに描き、そのシルエットを
   ・右上（斜め）へ伸ばした暗いコピー  → 立方体の側面
   ・真上へ伸ばした明るいコピー        → 立方体の上面
   の順に重ねてから本体を乗せることで、全部が積み木でできたように見せる。
   絵ごとに面を作らずシルエットからまとめて押し出すので、
   ブロックの継ぎ目に変な線が出ず、描画順もそのまま保たれる。
   ---------------------------------------------------------------------------- */
const VOX_D = 6;                       // 押し出しの厚み（px）
const VOX_SIDE = 'rgba(8,10,26,.46)';  // 側面の陰り
const VOX_TOP  = 'rgba(255,248,225,.34)'; // 上面の照り
const mkbuf = () => { const c = document.createElement('canvas'); c.width = VW; c.height = VH; return c; };
const voxBuf = mkbuf(), voxBufCtx = voxBuf.getContext('2d');
const voxTint = mkbuf(), voxTintCtx = voxTint.getContext('2d');
/* スマホは合成の回数がそのまま負荷になるので、厚みを浅くしておく */
let voxDepth = matchMedia('(pointer: coarse)').matches ? 4 : VOX_D;

/* オフスクリーンの絵を、アルファを保ったまま一色寄せにしたコピーを作る */
function voxTintBuf(css) {
  const t = voxTintCtx;
  t.setTransform(1, 0, 0, 1, 0, 0);
  t.globalCompositeOperation = 'source-over';
  t.clearRect(0, 0, VW, VH);
  t.drawImage(voxBuf, 0, 0);
  t.globalCompositeOperation = 'source-atop';
  t.fillStyle = css; t.fillRect(0, 0, VW, VH);
  t.globalCompositeOperation = 'source-over';
}

/* fn の描画をひとかたまりの立体として画面へ合成する。
   fn の中では ctx がオフスクリーンに差し替わっているだけなので、
   元の描画コードには一切手を入れなくていい。 */
function voxLayer(fn, depth) {
  const real = ctx, D = depth == null ? voxDepth : depth;
  const b = voxBufCtx;
  b.setTransform(1, 0, 0, 1, 0, 0);
  b.clearRect(0, 0, VW, VH);
  b.globalAlpha = 1; b.textAlign = 'left'; b.shadowOffsetY = 0; b.shadowColor = 'rgba(0,0,0,0)';
  ctx = b;
  try { fn(); } finally { ctx = real; }

  voxTintBuf(VOX_SIDE);                                   // 側面（右上へ）
  for (let i = D; i >= 1; i--) ctx.drawImage(voxTint, i, -i);
  voxTintBuf(VOX_TOP);                                    // 上面（真上へ）
  for (let i = D; i >= 1; i--) ctx.drawImage(voxTint, 0, -i);
  ctx.drawImage(voxBuf, 0, 0);                            // 正面
}

function drawBackground() {
  const th = lvl.theme;
  const g = ctx.createLinearGradient(0, 0, 0, VH);
  g.addColorStop(0, th.sky[0]); g.addColorStop(1, th.sky[1]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);

  /* 遠景レイヤー */
  const py = -cam.y*0.25;
  if (lvl.themeKey === 'over' || lvl.themeKey === 'ice') {
    ctx.fillStyle = th.far;
    for (let i = -1; i <= Math.ceil(VW/160); i++) {
      const x = i*160 - (cam.x*0.25) % 160;
      ctx.beginPath(); ctx.moveTo(x - 90, VH + py); ctx.lineTo(x, VH - 190 + py); ctx.lineTo(x + 90, VH + py);
      ctx.closePath(); ctx.fill();
    }
  } else if (lvl.themeKey === 'castle' || lvl.themeKey === 'cave' || lvl.themeKey === 'under') {
    for (let i = -1; i <= Math.ceil(VW/120); i++) {
      const x = i*120 - (cam.x*0.3) % 120;
      R(x, 60 + py, 52, VH, lvl.themeKey === 'cave' ? 'rgba(255,180,80,.05)' : 'rgba(255,255,255,.05)');
    }
  } else if (lvl.themeKey === 'water') {
    for (let i = 0; i < 26; i++) {
      const x = (i*97 + Math.sin(G.t*0.4 + i)*30 - cam.x*0.2) % (VW + 60) - 30;
      const y = (i*71 + G.t*18) % VH;
      R(x, VH - y, 5, 5, 'rgba(180,230,255,.25)');
    }
  }
}
/* 遠景の飾り。ボクセル層として別に描くので背景（空）と分けている */
function drawDecor() {
  ctx.save();
  ctx.translate(-cam.x*0.55, -cam.y*0.55);
  for (const d of lvl.decor) {
    const px = d.x*TILE;
    if (px < cam.x*0.55 - 200 || px > cam.x*0.55 + VW + 200) continue;
    if (d.t === 'cloud') drawCloud(px, d.y*TILE, d.s || 1);
    else if (d.t === 'hill') drawHill(px, GROUND_ROW*TILE, d.big);
    else drawBush(px, GROUND_ROW*TILE);
  }
  ctx.restore();
}
function drawCloud(x, y, s) {
  ctx.fillStyle = 'rgba(255,255,255,.95)';
  [[0,8,26,18],[18,0,30,26],[42,10,24,16]].forEach(([a,b,c,d]) => ctx.fillRect(x+a*s, y+b*s, c*s, d*s));
  ctx.fillStyle = 'rgba(223,233,255,.95)'; ctx.fillRect(x, y + 20*s, 66*s, 6*s);
}
/* 丘は三角形ではなく、積み木を段々に積んだピラミッドにする */
function drawHill(x, y, big) {
  const ice = lvl.themeKey === 'ice';
  const cell = 16, n = big ? 5 : 4;
  const c1 = ice ? '#cfeeff' : '#3ba32b', c2 = ice ? '#a8d8f0' : '#2d7d21';
  for (let r = 0; r < n; r++) {
    const wide = (n - r)*2 - 1;
    const bx = x - wide*cell/2, by = y - (r + 1)*cell;
    R(bx, by, wide*cell, cell, c1);
    R(bx + wide*cell - cell, by, cell, cell, c2);   // 右端だけ影を落として丸みを出す
  }
}
function drawBush(x, y) {
  ctx.fillStyle = lvl.themeKey === 'ice' ? '#dff4ff' : '#3ba32b';
  [[0,-16,28,16],[20,-26,30,26],[44,-16,28,16]].forEach(([a,b,c,d]) => ctx.fillRect(x+a, y+b, c, d));
}

function drawTiles() {
  const th = lvl.theme;
  const x0 = Math.max(0, Math.floor(cam.x/TILE) - 1);
  const x1 = Math.min(lvl.w - 1, Math.ceil((cam.x + VW)/TILE));
  const y0 = Math.max(0, Math.floor(cam.y/TILE) - 1);
  const y1 = Math.min(lvl.rows - 1, Math.ceil((cam.y + VH)/TILE));
  for (let cy = y0; cy <= y1; cy++) for (let cx = x0; cx <= x1; cx++) {
    const t = lvl.grid[cy][cx];
    if (t === '.' || t === 'P' || t === 'F' || t === 'H') continue;
    const b = bumps.find(v => v.cx === cx && v.cy === cy);
    const off = b ? -Math.sin((1 - b.t/0.22)*Math.PI)*10 : 0;
    drawTile(t, cx*TILE, cy*TILE + off, cx, cy, th);
  }
  /* 土管 */
  for (const p of lvl.pipes) {
    const x = p.x*TILE;
    if (x < cam.x - 90 || x > cam.x + VW + 90) continue;
    const top = p.top*TILE, h = (GROUND_ROW - p.top)*TILE;
    const warp = lvl.warps.some(w => w.x === p.x);
    R(x - 4, top, 72, 26, warp ? '#00c0d8' : '#00a800');
    R(x - 4, top, 72, 6, warp ? '#80f0ff' : '#7ce87c');
    R(x - 4, top + 20, 72, 6, warp ? '#006078' : '#005000');
    R(x, top + 26, 64, h - 26, warp ? '#00c0d8' : '#00a800');
    R(x + 4, top + 26, 10, h - 26, warp ? '#80f0ff' : '#7ce87c');
    R(x + 48, top + 26, 12, h - 26, warp ? '#006078' : '#005000');
    if (warp && Math.floor(G.t*3) % 2) {
      ctx.fillStyle = '#fff'; ctx.font = 'bold 14px monospace'; ctx.textAlign = 'center';
      ctx.fillText('↓', x + 32, top - 8);
    }
  }
  /* ファイアバー */
  for (const f of lvl.firebars) {
    const cx = f.cx*TILE + 16, cy = f.cy*TILE + 16;
    if (cx < cam.x - 200 || cx > cam.x + VW + 200) continue;
    R(f.cx*TILE, f.cy*TILE, 32, 32, '#5a4a3a');
    R(f.cx*TILE+4, f.cy*TILE+4, 24, 24, '#7a6a52');
    for (let i = 1; i <= f.len; i++) {
      const bx = cx + Math.cos(f.ph)*i*24, by = cy + Math.sin(f.ph)*i*24;
      const c = Math.floor(G.t*20 + i) % 2 ? '#ff8020' : '#ffd050';
      R(bx - 8, by - 8, 16, 16, c);
      R(bx - 4, by - 4, 8, 8, '#fff6c0');
    }
  }
  /* ドッスン */
  for (const d of lvl.dossuns) {
    if (d.x < cam.x - 120 || d.x > cam.x + VW + 120) continue;
    R(d.x, d.y, d.w, d.h, '#8a8ab0');
    R(d.x + 4, d.y + 4, d.w - 8, d.h - 12, '#b0b0d8');
    R(d.x + 4, d.y + d.h - 10, d.w - 8, 6, '#6a6a90');
    const eye = d.st === 'fall' ? '#f04040' : '#202030';
    R(d.x + 14, d.y + 18, 8, 10, eye); R(d.x + d.w - 22, d.y + 18, 8, 10, eye);
    R(d.x + 18, d.y + 36, d.w - 36, 5, '#202030');
  }
  /* チェックポイント */
  for (const c of lvl.checkpoints) {
    const x = c.x*TILE;
    if (x < cam.x - 60 || x > cam.x + VW + 60) continue;
    R(x + 12, (GROUND_ROW-5)*TILE, 5, 5*TILE, '#c0c0d0');
    ctx.fillStyle = c.on ? '#7cf87c' : '#f85050';
    const wv = c.on ? Math.sin(G.t*6)*3 : 0;
    ctx.beginPath();
    ctx.moveTo(x + 17, (GROUND_ROW-5)*TILE + 4);
    ctx.lineTo(x + 45 + wv, (GROUND_ROW-5)*TILE + 12);
    ctx.lineTo(x + 17, (GROUND_ROW-5)*TILE + 22);
    ctx.closePath(); ctx.fill();
  }
  /* 動く床 */
  for (const p of lvl.plats) {
    if (p.x < cam.x - 140 || p.x > cam.x + VW + 140) continue;
    R(p.x, p.y, p.w, 8, '#f0c040');
    R(p.x, p.y + 8, p.w, 8, '#a06000');
    for (let i = 0; i < p.w; i += 16) R(p.x + i + 2, p.y + 2, 4, 4, '#ffe890');
  }
  /* バネ */
  for (const s of lvl.springs) {
    if (s.held) continue;                       // ヨッシーの口の中
    if (s.x < cam.x - 60 || s.x > cam.x + VW + 60) continue;
    const sq = s.c > 0 ? 12 : 0;
    R(s.x, s.y + 20 + sq, 28, Math.max(2, 12 - sq*0.3), '#d0d0e0');
    R(s.x + 2, s.y + 10 + sq, 24, 8, '#a0a0c0');
    R(s.x, s.y + sq, 28, 10, '#e0e0f0');
  }
  /* 大砲 */
  for (const c of lvl.cannons) {
    const x = c.cx*TILE;
    if (x < cam.x - 80 || x > cam.x + VW + 80) continue;
    R(x, c.cy*TILE, 32, 32, '#303040');
    R(x + 2, c.cy*TILE + 2, 28, 10, '#505068');
    R(x + 4, c.cy*TILE + 12, 24, 18, '#202030');
  }
  /* スターコイン */
  for (let i = 0; i < lvl.scoins.length; i++) {
    const s = lvl.scoins[i];
    if (s.got || G.gotCoins[i]) continue;
    if (s.x < cam.x - 60 || s.x > cam.x + VW + 60) continue;
    const bob = Math.sin(G.t*2 + s.ph)*4;
    const w = Math.abs(Math.cos(G.t*2.2 + s.ph))*22 + 6;
    ctx.save(); ctx.translate(s.x + 12, s.y + 14 + bob);
    R(-w/2, -16, w, 32, '#ffcf20');
    R(-w/4, -12, Math.max(2, w/2), 24, '#fff0a0');
    ctx.fillStyle = '#a87000';
    ctx.font = 'bold 16px monospace'; ctx.textAlign = 'center';
    if (w > 14) ctx.fillText('★', 0, 6);
    ctx.restore();
  }
  /* つた */
  for (const v of lvl.vines) {
    if (v.h < 2 || v.x < cam.x - 40 || v.x > cam.x + VW + 40) continue;
    const top = v.bottom - v.h;
    R(v.x + 3, top, 4, v.h, '#1f7a24');
    for (let y = top + 4; y < v.bottom; y += 14) {
      const s = ((y/14)|0) % 2;
      R(v.x + (s ? 7 : -3), y, 6, 5, '#2ce04c');
      R(v.x + (s ? 5 : 3), y + 1, 3, 3, '#1f7a24');
    }
    R(v.x, top - 4, 10, 6, '#2ce04c');
  }
  /* ゴール旗 */
  if (lvl.flagX != null) {
    const fx = lvl.flagX*TILE;
    if (fx > cam.x - 160 && fx < cam.x + VW + 260) {
      R(fx + 12, 3*TILE, 8, (GROUND_ROW-3)*TILE, '#d8d8d8');
      R(fx + 12, 3*TILE, 3, (GROUND_ROW-3)*TILE, '#fff');
      R(fx + 6, 3*TILE - 12, 20, 12, '#2ce02c');
      let fy = 3*TILE + 8;
      if (G.state === 'clear') fy = Math.min((GROUND_ROW-2)*TILE, 3*TILE + 8 + G.timer*280);
      ctx.fillStyle = '#f8f800';
      ctx.beginPath(); ctx.moveTo(fx + 12, fy); ctx.lineTo(fx - 34, fy + 16); ctx.lineTo(fx + 12, fy + 32); ctx.closePath(); ctx.fill();
      drawCastle(fx + 90, GROUND_ROW*TILE);
    }
  }
}
function drawCastle(x, y) {
  R(x, y - 100, 160, 100, '#c84c0c'); R(x, y - 100, 160, 8, '#a03000');
  for (let i = 0; i < 5; i++) R(x + i*34, y - 118, 22, 18, '#c84c0c');
  R(x + 60, y - 48, 40, 48, '#1a1a1a');
  R(x + 66, y - 74, 28, 26, '#c84c0c');
  R(x + 62, y - 150, 36, 50, '#c84c0c');
  R(x + 70, y - 130, 20, 18, '#1a1a1a');
  for (let i = 0; i < 12; i++) R(x + 8 + (i%6)*26, y - 90 + Math.floor(i/6)*30, 18, 4, '#a03000');
}

function drawTile(t, x, y, cx, cy, th) {
  if (t === '#' || t === '~') {
    if (t === '~') {
      R(x, y, 32, 32, 'rgba(255,255,255,.85)');
      R(x + 2, y + 2, 28, 28, '#f0e070');
      R(x + 6, y + 6, 20, 20, '#fff6b0');
      return;
    }
    const top = !SOLID[tileAt(cx, cy - 1)];
    R(x, y, 32, 32, th.ground);
    R(x, y, 32, top ? 8 : 4, top ? th.grass : th.edge);
    ctx.fillStyle = 'rgba(0,0,0,.22)';
    ctx.fillRect(x, y + 30, 32, 2); ctx.fillRect(x + 30, y + 4, 2, 28);
    ctx.fillStyle = 'rgba(255,255,255,.10)';
    ctx.fillRect(x + 6, y + 12, 6, 6); ctx.fillRect(x + 20, y + 20, 6, 6);
  } else if (t === ',') {                       // 消えている足場
    ctx.fillStyle = 'rgba(255,255,255,.16)';
    ctx.fillRect(x + 4, y + 4, 24, 24);
  } else if (t === 'B') {
    R(x, y, 32, 32, th.brick);
    ctx.fillStyle = th.brickLine;
    for (let r = 0; r < 4; r++) { ctx.fillRect(x, y + r*8 + 7, 32, 2); ctx.fillRect(x + (r%2 ? 8 : 24), y + r*8, 2, 8); }
    ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.fillRect(x, y, 32, 2);
  } else if (t === '?') {
    const f = Math.sin(G.t*6)*0.5 + 0.5;
    R(x, y, 32, 32, f > 0.5 ? '#f8b800' : '#e09000');
    R(x + 2, y + 2, 28, 28, f > 0.5 ? '#ffd040' : '#f8b800');
    ctx.fillStyle = '#7a3d0a';
    [[4,4],[24,4],[4,24],[24,24]].forEach(([a,b]) => ctx.fillRect(x+a, y+b, 4, 4));
    ctx.font = 'bold 22px monospace'; ctx.textAlign = 'center';
    ctx.fillText('?', x + 16, y + 25);
  } else if (t === 'X') {
    R(x, y, 32, 32, '#a86820'); R(x + 3, y + 3, 26, 26, '#8a4f10');
    ctx.fillStyle = '#6a3a08';
    [[4,4],[24,4],[4,24],[24,24]].forEach(([a,b]) => ctx.fillRect(x+a, y+b, 4, 4));
  } else if (t === '=') {
    R(x, y, 32, 10, '#e0a860'); R(x, y, 32, 3, '#ffd8a0'); R(x, y + 7, 32, 3, '#a06820');
    R(x + 4, y + 10, 4, 6, 'rgba(0,0,0,.25)'); R(x + 24, y + 10, 4, 6, 'rgba(0,0,0,.25)');
  } else if (t === 'o') {
    const w = Math.abs(Math.cos(G.t*5))*14 + 4;
    R(x + 16 - w/2, y + 6, w, 22, '#f8d000');
    R(x + 16 - w/4, y + 10, Math.max(2, w/2), 14, '#ffe870');
  } else if (t === 'L') {
    const wv = Math.sin(G.t*4 + x*0.1)*3;
    R(x, y - 6 + wv, 32, 40, '#ff5010');
    R(x, y - 4 + wv, 32, 6, '#ffc040');
    R(x, y + 8, 32, 26, '#c02000');
  }
}

/* --- マリオ --- */
/* ヨッシー。ride=true ならプレイヤーの足元に、false なら単体（アイテム）として描く */
function drawYoshi(o, ride) {
  const face = ride ? player.face : (o.vx < 0 ? -1 : 1);
  const w = 34, h = 34;
  const x = ride ? o.x + o.w/2 - w/2 : o.x + o.w/2 - w/2;
  const y = ride ? o.y + o.h - h : o.y + o.h - h;
  const anim = ride ? player.yanim : o.ph*3;
  const air = ride ? !player.onGround : !o.onGround;
  const G1 = '#2ca82c', G2 = '#5ce05c', BELLY = '#f8f0d0', SHOE = '#e05820';
  const f = face;
  const px = (a, b, ww, hh, c) => { ctx.fillStyle = c; ctx.fillRect(((f > 0 ? x + a : x + w - a - ww))|0, (y + b)|0, ww, hh); };
  const step = Math.floor(anim*6) % 2;
  px(4, 14, 22, 14, G1);                       // 胴
  px(6, 18, 16, 8, BELLY);                     // お腹
  px(2, 20, 6, 8, G1);                         // しっぽ
  px(18, 0, 14, 14, G1);                       // 頭
  const hold = ride && player.mouth;           // 甲羅やバネを口にためている
  const chew = ride && player.chew > 0 && Math.floor(G.t*22) % 2;
  if (hold) {
    /* 含んでいる間は口まわりを大きくふくらませる。
       中身はヨッシーの地の緑（G1/G2）と紛れない色にしないと、ふくらんだことが伝わらない */
    const inner = player.mouth === 'spring' ? '#d0d0e0' : '#f8e8a0';
    const puff = chew ? 1 : 0;                 // 飲み込んだ直後だけ小さくもぐもぐ
    px(21, 6 + puff, 12, 11, G2);              // ほお
    px(28, 3 + puff, 13, 15, G2);              // 前へ張り出した口
    px(30, 1 + puff, 9, 3, G1);                // 上あご
    px(29, 15 + puff, 12, 3, '#1a7a1c');       // 口の線
    px(31, 6 + puff, 8, 8, inner);             // 中身
    if (player.mouth !== 'spring') px(31, 9 + puff, 8, 3, '#0a6c1c');   // 甲羅の帯
  } else {
    px(28, 5 + (chew ? 2 : 0), 6, 6, G2);      // 鼻先（食べた直後はもぐもぐ）
    if (chew) px(24, 9, 8, 4, G1);             // ほおのふくらみ
  }
  px(24, 3, 5, 6, '#fff'); px(26, 5, 3, 4, '#202030');   // 目
  px(17, -3, 8, 4, '#e04040');                 // 頭のトサカ
  if (ride) { px(8, 10, 14, 5, '#e04040'); px(9, 8, 12, 3, '#f8d000'); }   // サドル
  if (air) { px(6, 28, 9, 6, SHOE); px(17, 28, 9, 6, SHOE); }
  else { px(6 + (step?2:0), 28, 9, 6, SHOE); px(17 - (step?2:0), 28, 9, 6, SHOE); }
  /* 舌 */
  if (ride && player.tongue > 0) {
    const reach = tongueReach();
    ctx.fillStyle = '#f05070';
    const tx = f > 0 ? x + w - 2 : x + 2 - reach;
    ctx.fillRect(tx|0, (y + 10)|0, reach|0, 5);
    ctx.fillRect((f > 0 ? tx + reach - 5 : tx)|0, (y + 8)|0, 5, 8);
  }
}
function drawMario(p, dy) {
  if (p.inv > 0 && p.star <= 0 && Math.floor(G.t*20) % 2) return;
  const big = p.power > 0;
  let RED = '#e02020', SKIN = '#f8b088', BLUE = '#2038d8', BROWN = '#7a3d0a', YEL = '#f8d000';
  if (p.power === 2) { RED = '#f8f8f8'; BLUE = '#e02020'; }
  if (p.star > 0) {
    const i = Math.floor(G.t*24) % 4;
    RED = ['#e02020','#f8d000','#2ce04c','#40a0ff'][i];
    BLUE = ['#f8d000','#2ce04c','#40a0ff','#e02020'][i];
  }
  const sq = clamp(p.squash, -0.35, 0.35);
  const sx = 1 - sq*0.6, sy = 1 + sq*0.8;

  ctx.save();
  ctx.translate(p.x + p.w/2, p.y + p.h);
  ctx.scale(sx, sy);
  ctx.translate(-(p.x + p.w/2), -(p.y + p.h));
  if (p.growT > 0) ctx.globalAlpha = Math.floor(G.t*30) % 2 ? 0.55 : 1;

  // 左右の絵を反転（右向き入力で左向きの絵を描く）。しゃがみジャンプ中は縮んだ判定に絵を合わせる
  const f = -p.face, x = p.x, y = p.y + (dy || 0) - (p.low ? 18 : 0);
  const px = (a, b, w, h, c) => { ctx.fillStyle = c; ctx.fillRect((f > 0 ? x + a : x + p.w - a - w)|0, (y + b)|0, w, h); };
  const skid = p.skid > 0, air = !p.onGround, thr = p.throwT > 0;
  const swing = air ? 0.6 : Math.sin(p.anim*2);
  const armUp = thr ? -8 : (air ? -6 : 0);

  if (big) {
    if (p.crouch || p.low) {
      px(2, 18, 22, 8, RED); px(3, 26, 20, 14, BLUE); px(2, 38, 22, 6, BROWN); px(5, 24, 14, 6, SKIN);
    } else {
      px(3, 0, 20, 6, RED); px(1, 4, 24, 5, RED);
      px(5, 9, 16, 11, SKIN); px(15, 12, 4, 4, '#000'); px(6, 16, 8, 4, BROWN);
      px(3, 20, 20, 14, RED); px(7, 22, 12, 20, BLUE);
      px(9, 24, 3, 3, YEL); px(15, 24, 3, 3, YEL);
      px(1, 22, 5, 10, SKIN);
      px(19, 22 + armUp, 5, thr ? 12 : 10, SKIN);
      if (skid) { px(2, 42, 10, 10, BROWN); px(16, 40, 10, 12, BROWN); }
      else { px(4 + swing*3, 42, 8, 10, BROWN); px(14 - swing*3, 42, 8, 10, BROWN); }
    }
  } else {
    px(3, 0, 18, 5, RED); px(1, 3, 22, 4, RED);
    px(5, 7, 14, 8, SKIN); px(14, 9, 3, 3, '#000'); px(5, 12, 7, 3, BROWN);
    px(3, 15, 18, 8, RED); px(6, 16, 12, 8, BLUE);
    px(1, 16, 4, 7, SKIN);
    px(19, 16 + armUp*0.6, 4, 7, SKIN);
    if (skid) { px(1, 23, 10, 5, BROWN); px(14, 22, 9, 6, BROWN); }
    else { px(3 + swing*2, 23, 8, 5, BROWN); px(13 - swing*2, 23, 8, 5, BROWN); }
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

/* --- 敵 --- */
function drawEnemy(e) {
  const x = e.x, y = e.y;
  if (x < cam.x - 90 || x > cam.x + VW + 90) return;
  ctx.save();
  if (e.dead && e.flip) { ctx.translate(x + e.w/2, y + e.h/2); ctx.scale(1, -1); ctx.translate(-x - e.w/2, -y - e.h/2); }

  if (e.type === 'goomba') {
    if (e.dead && e.squash) { R(x, y + e.h - 10, e.w, 10, '#8a4f10'); R(x + 4, y + e.h - 8, e.w - 8, 4, '#c07030'); }
    else {
      R(x + 1, y + 2, e.w - 2, 16, '#8a4f10'); R(x + 4, y, e.w - 8, 6, '#a8641c');
      R(x + 3, y + 16, e.w - 6, 6, '#f0d0a0');
      const step = Math.floor(e.anim*6) % 2;
      R(x + (step ? 0 : 2), y + 20, 9, 6, '#4a2a06');
      R(x + e.w - (step ? 9 : 11), y + 20, 9, 6, '#4a2a06');
      R(x + 6, y + 7, 5, 7, '#fff'); R(x + e.w - 11, y + 7, 5, 7, '#fff');
      R(x + 8, y + 9, 3, 5, '#000'); R(x + e.w - 11, y + 9, 3, 5, '#000');
    }
  } else if (e.type === 'piranha') {
    const h = e.h*(e.out || 0);
    if (h > 2) {
      const top = e.top - h;
      /* ファイアパックンは橙色の頭に黒い斑点。火を吐く瞬間だけ口を大きく開ける */
      const head = e.fire ? '#f07818' : '#e03050', stem = e.fire ? '#1ba83c' : '#2ce04c';
      const open = e.fire && e.spit > 0;
      R(x + 8, top + 16, 8, Math.max(0, h - 16), stem);
      R(x, top, 24, 18, head);
      R(x + 2, top + 4, 20, 6, '#fff');
      if (e.fire) { R(x + 4, top + 1, 5, 4, '#2a1408'); R(x + 15, top + 1, 5, 4, '#2a1408'); }
      if (open) { R(x + 3, top + 11, 18, 7, '#5a1408'); R(x + 7, top + 13, 10, 4, '#ffd050'); }
      else { R(x + 4, top + 12, 6, 5, '#fff'); R(x + 14, top + 12, 6, 5, '#fff'); }
      R(x - 2, top + 6, 4, 5, head); R(x + 22, top + 6, 4, 5, head);
    }
  } else if (e.type === 'para') {
    const flap = Math.floor(e.anim*10) % 2;
    R(x - 8, y + 6 - flap*3, 10, 16, '#fff'); R(x + e.w - 2, y + 6 - flap*3, 10, 16, '#fff');
    R(x + 3, y + 12, e.w - 6, 20, '#0a9c2c'); R(x + 6, y + 15, e.w - 12, 14, '#2ce04c');
    const hx = e.dir > 0 ? x + e.w - 14 : x + 2;
    R(hx, y, 12, 14, '#f8e060');
    R(e.dir > 0 ? hx + 7 : hx + 2, y + 4, 3, 4, '#000');
    R(x + 6, y + 32, 8, 6, '#f8e060'); R(x + e.w - 14, y + 32, 8, 6, '#f8e060');
  } else if (e.type === 'cheep') {
    const flap = Math.floor(e.anim*8) % 2;
    R(x + 4, y + 2, 22, 18, '#e04040');
    R(x + 6, y + 5, 16, 12, '#ff7060');
    R(x + (e.dir > 0 ? 0 : 22), y + 6, 8, 10, '#c02020');       // 尾びれ
    R(x + (e.dir > 0 ? 20 : 4), y + 6, 4, 4, '#fff');
    R(x + (e.dir > 0 ? 21 : 5), y + 7, 2, 2, '#000');
    R(x + 10, y + (flap ? 18 : 16), 10, 4, '#c02020');
  } else if (e.type === 'ghost') {
    const bob = Math.sin(e.ph*2)*2;
    ctx.globalAlpha = e.dead ? 1 : 0.72 + 0.2*(1 - e.shy);
    R(x + 3, y + 2 + bob, e.w - 6, e.h - 8, '#f4f4ff');       // 体
    R(x + 1, y + 6 + bob, e.w - 2, e.h - 14, '#f4f4ff');
    R(x + 5, y, e.w - 10, 5 + bob*0.2, '#ffffff');
    const tail = Math.floor(e.ph*4) % 2;                       // ぎざぎざの裾
    for (let i = 0; i < 4; i++) R(x + 3 + i*6, y + e.h - 7 + bob, 5, (i + tail) % 2 ? 6 : 3, '#e6e6f8');
    if (e.shy > 0.5) {                                         // 見られたら手で顔を隠す
      R(x + 5, y + 11 + bob, 8, 8, '#e0e0f0'); R(x + e.w - 13, y + 11 + bob, 8, 8, '#e0e0f0');
      R(x + 6, y + 12 + bob, 6, 6, '#f4f4ff'); R(x + e.w - 12, y + 12 + bob, 6, 6, '#f4f4ff');
    } else {
      const ex = e.dir > 0 ? 2 : 0;
      R(x + 7 + ex, y + 10 + bob, 5, 7, '#202030'); R(x + e.w - 12 + ex, y + 10 + bob, 5, 7, '#202030');
      R(x + 9, y + 20 + bob, e.w - 18, 4, '#d05070');          // 口
    }
    ctx.globalAlpha = 1;
  } else if (e.type === 'hammer') {
    const d = e.dir;
    R(x + 2, y + 12, e.w - 4, 22, '#2c8c4c');
    R(x + 5, y + 15, e.w - 10, 16, '#48c060');
    R(x + (d > 0 ? e.w - 16 : 2), y, 14, 14, '#f8e060');
    R(x + (d > 0 ? e.w - 10 : 6), y + 4, 3, 4, '#000');
    R(x + 1, y - 4, e.w - 2, 6, '#303040');                     // ヘルメット
    R(x + 3, y + 34, 9, 8, '#f8e060'); R(x + e.w - 12, y + 34, 9, 8, '#f8e060');
  } else {
    if (e.shell > 0) {
      const spin = e.kick ? Math.floor(G.t*22) % 2 : 0;
      R(x + 1, y + 2, e.w - 2, e.h - 4, '#0a9c2c'); R(x + 4, y + 5, e.w - 8, e.h - 10, '#2ce04c');
      R(x, y + e.h - 8, e.w, 6, '#f8e8a0');
      ctx.fillStyle = '#0a6c1c';
      for (let i = 0; i < 3; i++) ctx.fillRect(x + 4 + ((i*7 + spin*3) % (e.w - 10)), y + 8, 4, 8);
    } else {
      const step = Math.floor(e.anim*6) % 2, d = e.dir;
      const hx = d > 0 ? x + e.w - 14 : x + 2;
      R(x + 3, y + 12, e.w - 6, 20, '#0a9c2c'); R(x + 6, y + 15, e.w - 12, 14, '#2ce04c');
      R(hx, y, 12, 14, '#f8e060');
      R(d > 0 ? hx + 7 : hx + 2, y + 4, 3, 4, '#000');
      R(d > 0 ? hx + 10 : hx - 2, y + 6, 4, 4, '#f8b000');
      R(x + (step ? 3 : 6), y + 32, 8, 6, '#f8e060');
      R(x + e.w - (step ? 11 : 14), y + 32, 8, 6, '#f8e060');
    }
  }
  ctx.restore();
}

function drawBoss(b) {
  const x = b.x, y = b.y;
  if (x < cam.x - 120 || x > cam.x + VW + 120) return;
  if (b.hurt > 0 && Math.floor(G.t*24) % 2) ctx.globalAlpha = 0.5;
  const d = b.dir, body = b.rage ? '#c83c2c' : '#2c9c3c', body2 = b.rage ? '#e86a48' : '#48c85c';
  R(x + 4, y + 14, b.w - 8, 34, body);
  R(x + 8, y + 18, b.w - 16, 26, body2);
  ctx.fillStyle = '#f8e8a0';
  for (let i = 0; i < 4; i++) ctx.fillRect(x + 10 + i*10, y + 6, 8, 10);
  R(x + (d > 0 ? b.w - 26 : 6), y, 24, 20, body2);
  R(x + (d > 0 ? b.w - 14 : 4), y + 6, 12, 8, '#f8f0d0');
  R(x + (d > 0 ? b.w - 22 : 12), y + 2, 5, 5, b.rage ? '#ffe000' : '#000');
  R(x + 2, y + 44, 16, 14, body); R(x + b.w - 18, y + 44, 16, 14, body);
  ctx.fillStyle = '#f04040';
  for (let i = 0; i < 3; i++) ctx.fillRect(x + 14 + i*10, y - 6, 6, 8);
  ctx.globalAlpha = 1;
  const bw = 60;
  R(x - 2, y - 18, bw, 6, 'rgba(0,0,0,.5)');
  R(x - 1, y - 17, (bw - 2)*Math.max(0, b.hp)/b.maxhp, 4, b.rage ? '#ffb020' : '#f85050');
}

function drawItem(it) {
  const x = it.x, y = it.y;
  if (it.type === 'yoshi') {
    drawYoshi(it, false);
    return;
  }
  if (it.type === 'coin') {
    const w = Math.abs(Math.cos(G.t*7 + it.ph))*12 + 3;
    R(x + 8 - w/2, y, w, 16, '#f8d000');
    R(x + 8 - w/4, y + 3, Math.max(2, w/2), 10, '#ffe870');
    return;
  }
  if (it.type === 'mush' || it.type === '1up') {
    const c = it.type === 'mush' ? '#e02020' : '#20c040';
    R(x + 1, y + 12, 22, 12, '#f8e0b0'); R(x, y + 2, 24, 12, c);
    R(x + 3, y + 4, 6, 6, '#fff'); R(x + 15, y + 4, 6, 6, '#fff');
    R(x + 9, y + 14, 3, 4, '#000'); R(x + 14, y + 14, 3, 4, '#000');
  } else if (it.type === 'flower') {
    const f = Math.floor(G.t*8) % 2;
    R(x + 9, y + 12, 6, 12, '#2ce04c');
    R(x + 2, y + 2, 20, 12, f ? '#f8b000' : '#f8d000');
    R(x + 7, y + 5, 10, 7, '#fff'); R(x + 10, y + 7, 4, 4, '#000');
  } else if (it.type === 'star') {
    ctx.fillStyle = ['#f8d000','#fff','#f8b000'][Math.floor(G.t*16) % 3];
    ctx.save(); ctx.translate(x + 12, y + 12); ctx.rotate(Math.sin(G.t*4)*0.3);
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const r = i % 2 ? 5 : 12, a = i/10*Math.PI*2 - Math.PI/2;
      i ? ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r) : ctx.moveTo(Math.cos(a)*r, Math.sin(a)*r);
    }
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#000'; ctx.fillRect(-5, -3, 3, 4); ctx.fillRect(2, -3, 3, 4);
    ctx.restore();
  }
}

function drawFires() {
  for (const f of fires) {
    const c = Math.floor(f.anim*20) % 2 ? '#ff9020' : '#ffd050';
    R(f.x, f.y, 12, 12, c); R(f.x + 3, f.y + 3, 6, 6, '#fff8c0');
  }
  for (const f of efires) {
    if (f.bullet) {
      R(f.x, f.y, 22, 20, '#181820'); R(f.x + (f.vx > 0 ? 16 : 0), f.y + 4, 6, 12, '#404050');
      R(f.x + 4, f.y + 5, 5, 5, '#fff');
    } else if (f.hammer) {
      ctx.save(); ctx.translate(f.x + 9, f.y + 9); ctx.rotate(f.anim*14);
      R(-3, -10, 6, 20, '#a06830'); R(-9, -12, 18, 8, '#c0c0d0');
      ctx.restore();
    } else {
      const c = Math.floor(f.anim*20) % 2 ? '#ff5020' : '#ffa030';
      R(f.x, f.y, 20, 14, c); R(f.x + 4, f.y + 3, 12, 8, '#fff0a0');
    }
  }
}

function drawFx() {
  for (const p of particles) {
    if (p.coin) { R(p.x - 6, p.y, 12, 20, '#f8d000'); R(p.x - 3, p.y + 3, 5, 14, '#ffe870'); }
    else if (p.soft) { ctx.fillStyle = p.c; ctx.globalAlpha = clamp(p.t*2, 0, 1);
                       ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill(); ctx.globalAlpha = 1; }
    else {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      R(-p.r/2, -p.r/2, p.r, p.r, p.c || '#b5651d');
      ctx.restore();
    }
  }
  ctx.font = 'bold 14px monospace'; ctx.textAlign = 'center';
  for (const p of pops) {
    ctx.globalAlpha = Math.max(0, p.t);
    ctx.fillStyle = p.c; ctx.fillText(p.text, p.x, p.y);
  }
  ctx.globalAlpha = 1;
}

/* --- HUD --- */
const curDef = () => (lvl && lvl.room) ? lvl.def : LEVELS[Math.min(G.levelIndex, LEVELS.length - 1)];
function drawHUD() {
  ctx.textAlign = 'left'; ctx.font = 'bold 18px monospace';
  ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowOffsetY = 2;
  const line = (label, val, x) => { ctx.fillStyle = '#fff'; ctx.fillText(label, x, 30); ctx.fillText(val, x, 50); };
  line('MARIO', String(G.score).padStart(6, '0'), 20);
  R(132, 36, 12, 14, '#f8d000');
  ctx.fillStyle = '#fff'; ctx.fillText('×' + String(G.coins).padStart(2, '0'), 150, 50);
  line('WORLD', curDef().name, 248);
  line('TIME', lvl.room ? '---' : String(G.time).padStart(3, '0'), 366);

    ctx.fillText('★', 570 + i*24, 50);

  ctx.font = 'bold 14px monospace';
  const pw = ['SMALL','SUPER','FIRE'][player.power];

}

function centerBox(lines, sub, sub2) {
  ctx.fillStyle = 'rgba(0,0,0,.74)'; ctx.fillRect(0, 0, VW, VH);

  if (sub2) { ctx.fillStyle = '#9fd7ff'; ctx.fillText(sub2, VW/2, VH/2 + 110); }
}

/* --- ワールドマップ --- */
function drawMap() {
  const g = ctx.createLinearGradient(0, 0, 0, VH);
  g.addColorStop(0, '#204a8a'); g.addColorStop(1, '#0d2350');
  ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);
  for (let i = 0; i < 40; i++) {
    const x = (i*197) % VW, y = (i*127) % 200;
    R(x, y, 2, 2, 'rgba(255,255,255,.5)');
  }
  ctx.textAlign = 'center';
  ctx.fillStyle = '#fff'; ctx.font = 'bold 30px monospace';
  ctx.fillText('WORLD  MAP', VW/2, 60);

  const n = LEVELS.length, x0 = 90, dx = (VW - 180)/(n - 1), y = 250;
  voxLayer(() => {
  ctx.textAlign = 'center';
  ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 4;
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const px = x0 + dx*i, py = y + Math.sin(i*1.1)*40;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.stroke();

  for (let i = 0; i < n; i++) {
    const px = x0 + dx*i, py = y + Math.sin(i*1.1)*40;
    const st = save.stages[i] || {};
    const unlocked = i === 0 || (save.stages[i-1] && save.stages[i-1].cleared);
    const boss = !!LEVELS[i].boss;
    ctx.fillStyle = !unlocked ? '#3a3a52' : st.cleared ? '#3cc85c' : (boss ? '#c83c3c' : '#f0c040');
    ctx.beginPath(); ctx.arc(px, py, boss ? 22 : 18, 0, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.5)'; ctx.lineWidth = 3; ctx.stroke();
    ctx.fillStyle = unlocked ? '#fff' : '#7a7a92';
    ctx.font = 'bold 14px monospace';
    ctx.fillText(LEVELS[i].name, px, py + 5);
    if (st.cleared) { ctx.fillStyle = '#fff'; ctx.font = 'bold 16px monospace'; ctx.fillText('✓', px + 20, py - 16); }
    /* スターコイン */
    for (let k = 0; k < 3; k++) {
      const got = st.coins && st.coins[k];
      ctx.fillStyle = got ? '#ffcf20' : 'rgba(255,255,255,.22)';
      ctx.font = 'bold 13px monospace';
      ctx.fillText('★', px - 14 + k*14, py + 40);
    }
    if (i === G.cursor) {
      const bob = Math.sin(G.t*6)*4;
      ctx.fillStyle = '#e02020';
      ctx.beginPath(); ctx.arc(px, py - 40 + bob, 9, 0, 7); ctx.fill();
      R(px - 10, py - 46 + bob, 20, 5, '#e02020');
      ctx.fillStyle = '#f8b088'; ctx.fillRect(px - 5, py - 38 + bob, 10, 8);
    }
  }
  }, 4);

  const st = save.stages[G.cursor] || {};
  ctx.fillStyle = '#fff'; ctx.font = 'bold 20px monospace';
  ctx.fillText('WORLD ' + LEVELS[G.cursor].name + (LEVELS[G.cursor].boss ? '  (BOSS)' : ''), VW/2, 372);
  ctx.font = '15px monospace'; ctx.fillStyle = '#9fd7ff';
  const bt = st.time != null ? (Math.floor(st.time/60) + ':' + String(st.time%60).padStart(2,'0')) : '--:--';
  ctx.fillText('BEST TIME ' + bt + '    ★ ' + totalCoinsGot() + ' / ' + (LEVELS.length*3) +
               '    残機 ×' + G.lives + '    SCORE ' + G.score, VW/2, 398);
  ctx.fillStyle = '#ffd040'; ctx.font = 'bold 16px monospace';
  ctx.fillText('← →  ステージ選択      ENTER  スタート', VW/2, 436);
}

/* --- 全体描画 --- */
function render() {
  if (G.state === 'title') { drawTitle(); drawFade(); return; }
  if (G.state === 'map')   { drawMap(); drawFade(); return; }
  if (G.state === 'ending') {
    const g = ctx.createLinearGradient(0, 0, 0, VH);
    g.addColorStop(0, '#101838'); g.addColorStop(1, '#301848');
    ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);
    centerBox(['CONGRATULATIONS!', 'ALL STAGES CLEAR'],
      'SCORE ' + G.score + '   ★ ' + totalCoinsGot() + ' / ' + (LEVELS.length*3),
      'ENTER でタイトルへ');
    drawFade(); return;
  }

  ctx.save();
  if (G.shake > 0) ctx.translate((Math.random()-0.5)*10*G.shake*4, (Math.random()-0.5)*10*G.shake*4);
  drawBackground();

  /* 地形（遠景の飾りも含めて1枚の積み木として押し出す） */
  voxLayer(() => {
    drawDecor();
    ctx.save();
    ctx.translate(-Math.round(cam.x), -Math.round(cam.y));
    drawTiles();
    ctx.restore();
  });

  /* マリオ・敵・アイテム。地形より手前の層なので、別の立体として重ねる */
  voxLayer(() => {
    ctx.save();
    ctx.translate(-Math.round(cam.x), -Math.round(cam.y));
    for (const it of items) drawItem(it);
    for (const e of enemies) drawEnemy(e);
    if (boss) drawBoss(boss);
    drawFires();
    if (player.warpT > 0) ctx.globalAlpha = Math.max(0, player.warpT/0.8);
    // 死亡演出で落下しきった後、および城のドアに入った後は描かない
    if (player.y - cam.y < VH + 160 && !player.entered) {
      if (player.yoshi) { drawYoshi(player, true); drawMario(player, -22); }
      else drawMario(player);
    }
    ctx.globalAlpha = 1;
    drawFx();
    ctx.restore();
  });

  if (lvl.water) { ctx.fillStyle = 'rgba(30,110,180,.20)'; ctx.fillRect(0, 0, VW, VH); }
  if (lvl.theme.dark > 0) {
    const px = player.x - cam.x + 12, py = player.y - cam.y + 20;
    const grd = ctx.createRadialGradient(px, py, 60, px, py, 460);
    grd.addColorStop(0, 'rgba(0,0,0,0)');
    grd.addColorStop(1, 'rgba(0,0,0,' + lvl.theme.dark + ')');
    ctx.fillStyle = grd; ctx.fillRect(0, 0, VW, VH);
  }
  ctx.restore();

  drawHUD();

  if (G.msgT > 0 && G.state === 'play') {
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(VW/2 - 150, VH/2 - 50, 300, 100);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 28px monospace';
    ctx.fillText(lvl.room ? 'BONUS ROOM' : 'WORLD ' + curDef().name, VW/2, VH/2 - 8);
    if (!lvl.room) {
      ctx.font = '20px monospace';
      ctx.fillText('×  ' + G.lives, VW/2 + 14, VH/2 + 30);
      R(VW/2 - 34, VH/2 + 14, 14, 18, '#e02020');
    }
  }
  if (G.state === 'pause')    centerBox(['PAUSE'], 'P で再開　／　R でやり直し', 'ESC でマップへ');
  if (G.state === 'gameover') centerBox(['GAME OVER'], 'SCORE ' + G.score, 'ENTER でマップへ');
  drawFade();
}
function drawFade() {
  if (G.fade <= 0) return;
  ctx.fillStyle = 'rgba(0,0,0,' + G.fade + ')';
  ctx.fillRect(0, 0, VW, VH);
}

/* ============================================================================
   12. ループ
   ============================================================================ */
let last = performance.now(), acc = 0;
const STEP = 1/120;
function frame(now) {
  let dt = (now - last)/1000; last = now;
  if (dt > 0.25) dt = 0.25;
  acc += dt;
  let guard = 0;
  while (acc >= STEP && guard++ < 16) {
    update(STEP);
    for (const k in keys) prev[k] = keys[k];
    acc -= STEP;
  }
  render();
  requestAnimationFrame(frame);
}

loadSave();
lvl = buildLevel(LEVELS[0]);
applyLevelGlobals();
player = makePlayer(0);
enemies = []; items = []; fires = []; efires = []; particles = []; pops = []; bumps = [];
boss = null;
G.fade = 1; G.fadeDir = -1;
requestAnimationFrame(frame);
})();
</script>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>SUPER CLONE BROS. VOXEL</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #0d0d16; color: #fff;
    font-family: "Courier New", monospace;
    overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    touch-action: none;
  }
  #wrap { position: relative; line-height: 0; }
  canvas {
    display: block;
    image-rendering: pixelated; image-rendering: crisp-edges;
    background: #5c94fc;
    border: 4px solid #2a2a3a; border-radius: 4px;
    max-width: 100vw; max-height: 78vh;
    box-shadow: 0 10px 40px rgba(0,0,0,.6);
  }
  #hint { margin-top: 10px; font-size: 12px; color: #8a8aa0; text-align: center; line-height: 1.7; padding: 0 8px; }
  #hint b { color: #cfcfe4; }
  #pad { display: none; }
  #pad button {
    width: 62px; height: 62px; border-radius: 50%;
    border: 2px solid #4a4a60; background: #23233a; color: #fff;
    font-size: 19px; font-family: inherit; font-weight: bold;
    touch-action: none;
  }
  #pad button.on, #pad button:active { background: #4a4a80; border-color: #8a8ad0; }

  /* --- スマホ・タブレット（タッチ操作） --- */
  @media (pointer: coarse) {
    body { display: block; }
    #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
    canvas { max-width: 100vw; max-height: 100vh; border: 0; border-radius: 0; }
    #hint { display: none; }
    /* 画面いっぱいに敷いた透明レイヤーの上にボタンを置く（ボタン以外はタップを通す） */
    #pad { display: block; position: fixed; inset: 0; pointer-events: none; }
    #pad .grp { position: fixed; display: flex; gap: clamp(6px, 2.5vw, 14px); align-items: flex-end; pointer-events: auto; }
    #pad .l { left: max(10px, env(safe-area-inset-left)); bottom: max(10px, env(safe-area-inset-bottom)); }
    #pad .r { right: max(10px, env(safe-area-inset-right)); bottom: max(10px, env(safe-area-inset-bottom)); }
    #pad .sys { top: max(8px, env(safe-area-inset-top)); right: max(8px, env(safe-area-inset-right)); gap: 8px; }
    /* 十字キー3個＋B＋Aが横一列に並ぶので、画面幅に対する割合で決めて重ならないようにする。
       狭い端末（幅320px）でも 左214px＋右132px＋余白 で収まる */
    #pad button { width: clamp(48px, 15vw, 72px); height: clamp(48px, 15vw, 72px);
                  font-size: clamp(15px, 4.5vw, 22px); opacity: .8; }
    #pad .jump { width: clamp(58px, 18vw, 86px); height: clamp(58px, 18vw, 86px); margin-bottom: 16px; }
    /* HUDに重なるので、システム系は小さく薄く */
    #pad .sys { gap: 6px; }
    #pad .sys button { width: auto; height: 30px; padding: 0 10px; border-radius: 15px; font-size: 11px; opacity: .5; }
    #pad .sys button.on { opacity: .9; }
  }
  /* 縦持ちのときだけ出る「横向きにしてね」の案内。
     ゲーム画面に重ねると遊びの邪魔になるので、canvas の下（黒帯の中）に並べて置く */
  #rot { display: none; }
  @media (pointer: coarse) and (orientation: portrait) {
    #wrap { flex-direction: column; }
    #rot { display: block; margin-top: 16px; padding: 0 14px;
           text-align: center; font-size: 15px; line-height: 1.6;   /* #wrap の line-height:0 を打ち消す */
           color: #cfcfe4; pointer-events: none; }
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="800" height="480"></canvas>
  <div id="rot">スマホは横向きにすると大きく遊べます</div>
</div>
<div id="hint">
  <b>← →</b> 移動 &nbsp;|&nbsp; <b>SPACE / ↑</b> ジャンプ・泳ぐ &nbsp;|&nbsp; <b>SHIFT</b> ダッシュ・ファイア &nbsp;|&nbsp; <b>↓</b> しゃがみ・土管・薄い台から降りる &nbsp;|&nbsp; <b>↓+ジャンプ</b> しゃがみジャンプ<br>
  <b>V</b> ボクセルの厚み切替 &nbsp;|&nbsp; <b>ENTER</b> 決定 &nbsp;|&nbsp; <b>P</b> ポーズ &nbsp;|&nbsp; <b>R</b> やり直し &nbsp;|&nbsp; <b>M</b> BGM &nbsp;|&nbsp; <b>ESC</b> マップへ
</div>
<div id="pad">
  <div class="grp l">
    <button data-k="left">◀</button><button data-k="down">▼</button><button data-k="right">▶</button>
  </div>
  <div class="grp r">
    <button data-k="run">B</button><button data-k="jump" class="jump">A</button>
  </div>
  <div class="grp sys">
    <button data-k="start">START</button><button data-k="pause">II</button>
    <button data-k="restart">R</button><button data-k="back">MAP</button><button data-k="mute">♪</button>
  </div>
</div>

<script>
(() => {
"use strict";

/* ============================================================================
   0. 基本・入力
   ============================================================================ */
const TILE = 32, VW = 800, VH = 480;
const canvas = document.getElementById('game');
/* ボクセル描画のため、描画先を一時的にオフスクリーンへ差し替えられるように let にしている */
let ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const approach = (cur, tgt, dt, rate) => lerp(cur, tgt, 1 - Math.pow(rate, dt));

const keys = {}, prev = {};
const KEYMAP = {
  ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right',
  ArrowDown:'down', KeyS:'down', ArrowUp:'jump', KeyW:'jump', Space:'jump', KeyK:'jump',
  ShiftLeft:'run', ShiftRight:'run', KeyJ:'run',
  Enter:'start', KeyP:'pause', KeyR:'restart', KeyM:'mute', Escape:'back', KeyV:'vox'
};
addEventListener('keydown', e => { const k = KEYMAP[e.code]; if (k) { e.preventDefault(); keys[k] = true; } });
addEventListener('keyup',   e => { const k = KEYMAP[e.code]; if (k) { e.preventDefault(); keys[k] = false; } });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
/* --- タッチ操作 ---
   指ごとに「今どのボタンの上にあるか」を毎回引き直すので、
   押したままスライドしてボタンを移れる・複数同時押しもできる */
const padBtns = [...document.querySelectorAll('#pad button')];
const PAD_KEYS = [...new Set(padBtns.map(b => b.dataset.k))];
let padTapStart = false;         // ボタン以外を触ったとき（タイトル等の決定用）
function btnAt(x, y) {
  for (const b of padBtns) {
    const r = b.getBoundingClientRect();
    if (r.width && x >= r.left - 6 && x <= r.right + 6 && y >= r.top - 6 && y <= r.bottom + 6) return b;
  }
  return null;
}
function applyTouches(e) {
  if (e.cancelable) e.preventDefault();
  ac();                                   // 最初のタッチで音を起こす（iOS対策）
  const on = new Set();
  let onCanvas = false;
  for (const t of e.touches) {
    const b = btnAt(t.clientX, t.clientY);
    if (b) on.add(b.dataset.k); else onCanvas = true;
  }
  for (const k of PAD_KEYS) keys[k] = on.has(k);
  for (const b of padBtns) b.classList.toggle('on', on.has(b.dataset.k));
  /* 画面（ボタン以外）のタップは、プレイ中以外なら決定として扱う */
  padTapStart = onCanvas && G.state !== 'play';
  if (padTapStart) keys.start = true;
  else if (!on.has('start')) keys.start = false;
}
for (const ev of ['touchstart', 'touchmove', 'touchend', 'touchcancel'])
  document.addEventListener(ev, applyTouches, { passive: false });
/* マウスでも一応押せるように（タッチ端末では touch 側が処理する） */
padBtns.forEach(b => {
  const k = b.dataset.k;
  const set = v => e => { if (e.pointerType === 'touch') return; e.preventDefault(); keys[k] = v; };
  b.addEventListener('pointerdown', set(true));  b.addEventListener('pointerup', set(false));
  b.addEventListener('pointerleave', set(false)); b.addEventListener('pointercancel', set(false));
});
addEventListener('contextmenu', e => { if (e.target.closest('#pad') || e.target.id === 'game') e.preventDefault(); });
const hit = k => keys[k] && !prev[k];

/* ============================================================================
   1. セーブデータ
   ============================================================================ */
const SAVE_KEY = 'cloneBrosDX_v2';
let save = { best: 0, stages: [] };
function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) {
      const o = JSON.parse(raw);
      if (o && typeof o === 'object') save = { best: o.best|0, stages: Array.isArray(o.stages) ? o.stages : [] };
    }
  } catch (e) { /* 壊れていたら初期値のまま */ }
}
function stageSave(i) {
  if (!save.stages[i]) save.stages[i] = { cleared: false, coins: [false,false,false], time: null };
  const s = save.stages[i];
  if (!Array.isArray(s.coins) || s.coins.length !== 3) s.coins = [false,false,false];
  return s;
}
function writeSave() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }
const totalCoinsGot = () => save.stages.reduce((n, s) => n + (s && s.coins ? s.coins.filter(Boolean).length : 0), 0);

/* ============================================================================
   2. サウンド
   ============================================================================ */
let actx = null, muted = false;
function ac() {
  if (!actx) { const C = window.AudioContext || window.webkitAudioContext; if (C) actx = new C(); }
  if (actx && actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(freq, dur, type = 'square', vol = 0.06, slideTo = null, delay = 0) {
  if (muted) return;
  const a = ac(); if (!a) return;
  const t0 = a.currentTime + delay;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(a.destination); o.start(t0); o.stop(t0 + dur + 0.02);
}
function noise(dur, vol = 0.05, delay = 0) {
  if (muted) return;
  const a = ac(); if (!a) return;
  const n = Math.max(1, Math.floor(a.sampleRate * dur));
  const buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random()*2 - 1) * (1 - i/n);
  const s = a.createBufferSource(), g = a.createGain();
  s.buffer = buf; g.gain.value = vol; s.connect(g); g.connect(a.destination); s.start(a.currentTime + delay);
}
const SFX = {
  jump:  () => tone(340, 0.15, 'square', 0.05, 700),
  swim:  () => tone(280, 0.14, 'sine', 0.05, 520),
  skid:  () => noise(0.06, 0.03),
  land:  () => tone(160, 0.05, 'sine', 0.04, 90),
  coin:  () => { tone(988, 0.07, 'square', 0.05); tone(1319, 0.22, 'square', 0.05, null, 0.07); },
  scoin: () => [784,988,1319,1568,2093].forEach((f,i) => tone(f, 0.18, 'square', 0.055, null, i*0.09)),
  stomp: () => tone(220, 0.10, 'square', 0.06, 90),
  bump:  () => tone(140, 0.07, 'square', 0.05, 90),
  brick: () => { noise(0.18, 0.06); tone(180, 0.1, 'sawtooth', 0.04, 60); },
  power: () => [0,1,2,3,4,5].forEach(i => tone(392*Math.pow(1.1892,i), 0.09, 'square', 0.05, null, i*0.05)),
  grow:  () => [523,659,784,1047].forEach((f,i) => tone(f, 0.1, 'square', 0.05, null, i*0.06)),
  shrink:() => [784,659,523,392].forEach((f,i) => tone(f, 0.1, 'square', 0.05, null, i*0.05)),
  fire:  () => tone(700, 0.12, 'sawtooth', 0.04, 180),
  kick:  () => tone(500, 0.08, 'square', 0.05, 200),
  spring:() => tone(300, 0.22, 'sine', 0.06, 1200),
  star:  () => [523,659,784,1047,1319].forEach((f,i) => tone(f, 0.1, 'square', 0.05, null, i*0.05)),
  oneup: () => [659,784,988,1319].forEach((f,i) => tone(f, 0.12, 'square', 0.05, null, i*0.08)),
  warp:  () => { for (let i = 0; i < 8; i++) tone(900 - i*90, 0.06, 'square', 0.04, null, i*0.05); },
  thud:  () => { noise(0.14, 0.08); tone(70, 0.22, 'sawtooth', 0.06, 40); },
  hitboss:()=> { noise(0.2, 0.07); tone(120, 0.25, 'sawtooth', 0.06, 50); },
  clear: () => [523,659,784,1047,784,1047,1319].forEach((f,i) => tone(f, 0.16, 'square', 0.05, null, i*0.13)),
  flag:  () => { for (let i = 0; i < 10; i++) tone(300 + i*90, 0.05, 'square', 0.04, null, i*0.04); },
  die:   () => { tone(392, 0.15, 'square', 0.07, 330); tone(294, 0.5, 'square', 0.07, 110, 0.18); },
  boom:  () => { noise(0.5, 0.09); tone(90, 0.5, 'sawtooth', 0.07, 40); },
  firework:()=> { tone(600, 0.22, 'sine', 0.025, 1600); noise(0.3, 0.06); tone(120, 0.3, 'sawtooth', 0.05, 45, 0.02); },
  /* ヨッシーの鳴き声「よっしー！」。BGMを止めて前に出すぶん、太く大きく鳴らす */
  yoshiCry: () => {
    /* よ */
    tone(880, 0.22, 'square', 0.14, 1245);
    tone(440, 0.22, 'triangle', 0.10, 622);
    /* っ */
    tone(1245, 0.14, 'square', 0.12, 988, 0.22);
    /* しー↑ ── しゃくり上げてから long tone で伸ばす */
    tone(740, 0.52, 'square', 0.15, 1568, 0.38);
    tone(370, 0.52, 'triangle', 0.10, 784, 0.38);
    tone(1112, 0.46, 'sawtooth', 0.05, 1480, 0.40);
    noise(0.05, 0.05);
    return 0.90;
  },
  gulp:  () => { tone(300, 0.10, 'sine', 0.06, 120); tone(150, 0.14, 'triangle', 0.05, 70, 0.07); },
  slurp: () => tone(520, 0.12, 'sawtooth', 0.04, 240),
  select:() => tone(660, 0.06, 'square', 0.04),
  enter: () => [523,784,1047].forEach((f,i) => tone(f, 0.1, 'square', 0.05, null, i*0.06)),
  gameover: () => {
    const notes = [
      [523.25, 0.15], [392, 0.15], [329.63, 0.15],
      [440, 0.12], [493.88, 0.12], [440, 0.12], [415.3, 0.12], [466.16, 0.12], [415.3, 0.12],
      [392, 0.4]
    ];
    let off = 0;
    notes.forEach(([f, dur]) => {
      tone(f, dur, 'square', 0.05, null, off);
      off += dur + 0.02;
    });
  }
};

/* --- BGM --- */
const NF = n => 440 * Math.pow(2, (n - 69)/12);
const BGM = {
  /* 1面。ハネ（シャッフル）＋跳ねるオクターブベース＋3度ハモリの8小節。
     C - C - F - G - C - Am - Dm/G - C */
  over:   { bpm: 176, vol: .034, swing: .3, staccato: true, harm: true, introLen: 16, drum: 'khshkhsh',
            bass: [50, 50, -1, 50, -1, 50, 50, -1,
                   43, -1, -1, -1, 31, -1, -1, -1,
                   36,48,36,48, 36,48,43,-1,
                   36,48,36,48, 36,48,47,50,
                   41,53,41,53, 41,53,48,-1,
                   43,55,43,55, 43,55,50,53,
                   36,48,36,48, 36,48,43,-1,
                   45,57,45,57, 45,57,52,-1,
                   38,50,38,50, 43,55,43,50,
                   36,48,36,48, 36,43,47,-1],
            lead: [76, 76, -1, 76, -1, 72, 76, -1,
                   79, -1, -1, -1, 80, -1, -1, -1,
                   72,-1,79,-1, 76,72,74,-1,
                   76,-1,-1,79, -1,76,72,-1,
                   77,-1,84,-1, 81,77,79,-1,
                   79,-1,86,-1, 83,79,74,-1,
                   84,-1,79,-1, 76,72,76,79,
                   81,-1,76,-1, 72,69,72,76,
                   74,77,81,-1, 79,-1,74,-1,
                   72,-1,76,79, -1,-1,72,-1] },
  under:  { bpm: 118, vol: .032,
            bass: [33,-1,33,-1, 36,-1,36,-1, 31,-1,31,-1, 34,-1,34,-1],
            lead: [57,60,64,60, 60,63,67,63, 55,58,62,58, 58,62,65,-1] },
  sky:    { bpm: 144, vol: .030,
            bass: [41,-1,48,-1, 43,-1,50,-1, 45,-1,52,-1, 43,-1,47,-1],
            lead: [81,84,88,84, 83,86,90,86, 85,88,92,88, 83,86,83,79] },
  cave:   { bpm: 128, vol: .034,
            bass: [34,34,34,41, 34,34,34,39, 32,32,32,39, 32,32,36,37],
            lead: [58,61,65,61, 58,61,63,58, 56,59,63,59, 56,59,61,-1] },
  ice:    { bpm: 138, vol: .030,
            bass: [40,-1,47,-1, 38,-1,45,-1, 36,-1,43,-1, 38,-1,42,-1],
            lead: [88,91,95,91, 86,89,93,89, 84,88,91,88, 86,89,86,83] },
  water:  { bpm: 96, vol: .030,
            bass: [38,-1,-1,45, 38,-1,-1,43, 36,-1,-1,43, 41,-1,-1,45],
            lead: [74,78,81,86, 84,81,78,74, 72,76,79,84, 83,79,76,72] },
  castle: { bpm: 104, vol: .036,
            bass: [28,28,29,29, 28,28,31,30, 28,28,29,29, 34,33,32,31],
            lead: [52,53,52,51, 52,55,52,49, 52,53,52,51, 58,57,56,55] },
  starm:  { bpm: 184, vol: .034,
            bass: [45,45,52,45, 45,45,52,45, 43,43,50,43, 43,43,50,43],
            lead: [81,85,88,85, 81,85,88,92, 79,83,86,83, 79,83,86,90] }
};
let bgmKey = 'over', bgmStep = 0, bgmT = 0, bgmHush = 0;
/* 効果音を聴かせたい間だけBGMを黙らせる（鳴き声などの間はステップを進めない） */
function hushBGM(t) { bgmHush = Math.max(bgmHush, t); }
/* Cメジャーで2音下（3度下のハモリ） */
const CMAJ = [0,2,4,5,7,9,11];
function thirdBelow(n) {
  const pc = ((n % 12) + 12) % 12;
  let idx = CMAJ.indexOf(pc), oct = Math.floor(n/12);
  if (idx < 0) return n - 4;
  idx -= 2;
  if (idx < 0) { idx += 7; oct -= 1; }
  return oct*12 + CMAJ[idx];
}
function updateBGM(dt) {
  if (bgmHush > 0) { bgmHush -= dt; return; }        // 鳴き声中はインターバルごと停止
  if (muted || G.state !== 'play') return;
  const b = BGM[bgmKey]; if (!b) return;
  const rush = (!lvl.room && G.time > 0 && G.time <= 100) ? 1.35 : 1;   // 残り時間が少ないと速くなる
  const step = 30 / (b.bpm * rush);
  bgmT += dt;
  while (bgmT >= step) {
    bgmT -= step;
    const intro = b.introLen || 0;
    let i = bgmStep, j = bgmStep;
    if (intro > 0 && bgmStep >= intro) {
      i = intro + ((bgmStep - intro) % (b.bass.length - intro));
      j = intro + ((bgmStep - intro) % (b.lead.length - intro));
    } else {
      i = bgmStep % b.bass.length;
      j = bgmStep % b.lead.length;
    }
    const sw = (b.swing && bgmStep % 2 === 1) ? step*b.swing : 0;       // ハネ（裏拍を遅らせる）
    const len = step - sw;
    if (b.bass[i] > 0) tone(NF(b.bass[i]), len*(b.staccato ? 0.55 : 1.7), 'triangle', b.vol*1.5, null, sw);
    if (b.lead[j] > 0) {
      tone(NF(b.lead[j]), len*(b.staccato ? 0.66 : 0.85), 'square', b.vol, null, sw);
      if (b.harm && j >= intro) tone(NF(thirdBelow(b.lead[j])), len*0.55, 'square', b.vol*0.45, null, sw);
    }
    if (b.drum) {
      const d = b.drum[j % b.drum.length];
      if (d === 'k')      tone(62, 0.09, 'sine', b.vol*2.2, 34, sw);
      else if (d === 's') noise(0.05, b.vol*0.9, sw);
      else if (d === 'h') noise(0.02, b.vol*0.35, sw);
    } else if (i % 4 === 0) noise(0.05, b.vol*0.5);
    bgmStep++;
  }
}
const setBGM = (k, force = false) => { if (force || bgmKey !== k) { bgmKey = k; bgmStep = 0; bgmT = 0; } };

/* ============================================================================
   3. テーマ
   ============================================================================ */
const THEMES = {
  over:   { sky:['#5c94fc','#a8d4ff'], ground:'#9c4a00', grass:'#3ba32b', edge:'#c07030',
            brick:'#b5651d', brickLine:'#7a3d0a', deco:'hill', dark:0, far:'#2f7a3a' },

/* ============================================================================
   5. ステージ生成
   ============================================================================ */
let lvl = null, ROWS = 15, GROUND_ROW = 13;
const ATTIC_ROWS = 4;   // ボーナスルームの天井の上に作る空間の高さ（行）

function buildLevel(def) {
  const rows = def.rows || 15;
  const groundRow = rows - 2;
  const grid = [];
  for (let y = 0; y < rows; y++) grid.push(new Array(def.w).fill('.'));
  for (let x = 0; x < def.w; x++) { grid[groundRow][x] = '#'; grid[groundRow+1][x] = '#'; }
  /* 天井。ceilBreak のステージは低い方の1段だけをレンガにして、
     パワーアップ中なら壊して天井の上へ出られるようにする */
  if ((def.ceiling || def.room) && !def.open) {
    const ceilCh = (def.room || def.ceilBreak) ? 'B' : '#';
    for (let x = 0; x < def.w; x++) {
      grid[1][x] = ceilCh;
      if (!def.ceilBreak) grid[0][x] = ceilCh;
    }
  }
  (def.gaps || []).forEach(([x, len]) => {
    for (let i = 0; i < len; i++)
      if (x + i > 4 && x + i < def.w) { grid[groundRow][x+i] = '.'; grid[groundRow+1][x+i] = '.'; }
  });

  const L = {
    def, w: def.w, rows, groundRow, grid, theme: THEMES[def.theme], themeKey: def.theme,
    items: {}, pipes: [], spawns: [], plats: [], springs: [], cannons: [], firebars: [],
    dossuns: [], blinks: [], checkpoints: [], warps: [], scoins: [], decor: [], vines: [],
    flagX: def.flag != null ? def.flag : null, exitX: null, bossX: null,
    room: !!def.room, water: !!def.water, slippery: !!def.slippery,
    scroll: def.scroll || 0
  };
  const put = (x, y, ch) => { if (x >= 0 && x < def.w && y >= 0 && y < rows) grid[y][x] = ch; };

  for (const p of (def.parts || [])) {
    const t = p[0];
    if (t === 'solid')       { const [,x,y,w,h] = p; for (let i=0;i<w;i++) for (let j=0;j<h;j++) put(x+i, y+j, '#'); }
    else if (t === 'brick')  { const [,x,y,n] = p; for (let i=0;i<n;i++) put(x+i, y, 'B'); }
    else if (t === 'semi')   { const [,x,y,n] = p; for (let i=0;i<n;i++) put(x+i, y, '='); }
    else if (t === 'q')      { const [,x,y,item] = p; put(x, y, '?'); L.items[x+','+y] = item || 'coin'; }
    else if (t === 'hidden') { const [,x,y,item] = p; put(x, y, 'H'); L.items[x+','+y] = item || 'coin'; }
    else if (t === 'coins')  { const [,x,y,n] = p; for (let i=0;i<n;i++) if (grid[y] && grid[y][x+i] === '.') put(x+i, y, 'o'); }
    else if (t === 'lava')   { const [,x,len] = p; for (let i=0;i<len;i++) put(x+i, groundRow+1, 'L'); }
    else if (t === 'blink')  { const [,x,y,n] = p; L.blinks.push({ x, y, n, ph: (x*0.37) % 1 }); }
    else if (t === 'scoin')  { L.scoins.push({ x: p[1]*TILE + 4, y: p[2]*TILE, w: 24, h: 28, got: false, ph: p[1]*0.3 }); }
    else if (t === 'pipe')   {
      const [,x,h,opt] = p;
      for (let i=0;i<h;i++) { put(x, groundRow-1-i, 'P'); put(x+1, groundRow-1-i, 'P'); }
      L.pipes.push({ x, top: groundRow - h, h });
      if (opt && opt.piranha) L.spawns.push({ type: opt.piranha === 'fire' ? 'firepiranha' : 'piranha', x, y: groundRow - h });
      if (opt && opt.warp) L.warps.push({ x, top: groundRow - h, to: opt.warp });
    }
    else if (t === 'stair')  {
      const [,x,h,dir] = p;
      for (let i=0;i<h;i++) { const col = dir>0 ? x+i : x+(h-1-i); for (let j=0;j<=i;j++) put(col, groundRow-1-j, '#'); }
    }
    else if (t === 'plat')   { const [,x,y,w,ax,range,spd] = p;
      L.plats.push({ x: x*TILE, y: y*TILE, bx: x*TILE, by: y*TILE, w: w*TILE, h: 16, ax, range: range*TILE, spd, ph: x*0.7 }); }
    else if (t === 'spring') { const [,x,y] = p; L.springs.push({ type:'spring', isSpring:true, x: x*TILE, y: y*TILE, w: 28, h: 32, c: 0,
                                                                 vx:0, vy:0, onGround:true, carried:false, grabbed:false, held:false, kickGrace:0 }); }
    else if (t === 'cannon') { const [,x,y] = p; put(x, y, '#'); put(x, y+1, '#'); L.cannons.push({ cx:x, cy:y, t: 1 + Math.random()*2 }); }
    else if (t === 'firebar'){ const [,x,y,len] = p; put(x, y, '#'); L.firebars.push({ cx:x, cy:y, len, ph: x*0.5, spd: 1.5 }); }
    else if (t === 'dossun') { const [,x,y] = p; L.dossuns.push({ x: x*TILE, y: y*TILE, by: y*TILE, w: 56, h: 56, st:'wait', t:0, vy:0 }); }
    else if (t === 'checkpoint') L.checkpoints.push({ x: p[1], on: false });
    else if (t === 'exit')   L.exitX = p[1];
    else if (t === 'boss')   L.bossX = p[1];
    else if (t === 'goomba') L.spawns.push({ type:'goomba', x: p[1], y: p[2] != null ? p[2] : groundRow-1 });
    else if (t === 'koopa')  L.spawns.push({ type:'koopa',  x: p[1], y: p[2] != null ? p[2] : groundRow-2 });
    else if (t === 'para')   L.spawns.push({ type:'para',   x: p[1], y: p[2] != null ? p[2] : 7 });
    else if (t === 'cheep')  L.spawns.push({ type:'cheep',  x: p[1], y: p[2] != null ? p[2] : 8 });
    else if (t === 'hammer') L.spawns.push({ type:'hammer', x: p[1], y: p[2] != null ? p[2] : groundRow-3 });
    else if (t === 'ghost')  L.spawns.push({ type:'ghost',  x: p[1], y: p[2] != null ? p[2] : groundRow-4 });
  }
  for (const b of L.blinks) for (let i = 0; i < b.n; i++) put(b.x + i, b.y, '~');
  if (L.flagX != null) for (let y = 3; y < groundRow; y++) put(L.flagX, y, 'F');

  /* 背景装飾 */
  let seed = def.w * 7919 + 13;
  const rnd = () => (seed = (seed*1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  if (L.theme.deco !== 'none') {
    for (let x = 3; x < def.w - 3; x += 5 + Math.floor(rnd()*7)) {
      const r = rnd();
      if (L.theme.deco === 'cloud' || r < 0.4) L.decor.push({ t:'cloud', x, y: 1 + Math.floor(rnd()*3), s: 0.8 + rnd()*0.6 });
      else if (r < 0.78) L.decor.push({ t:'hill', x, big: rnd() < 0.5 });
      else L.decor.push({ t:'bush', x });
    }
  }

  /* 天井の上に登れる空間（屋根裏）を足す。
     ステージ定義の座標はそのままに、生成後のグリッドと各オブジェクトをまとめて下へずらす */
  const attic = (def.room && !def.open) ? ATTIC_ROWS : 0;
  if (attic > 0) {
    for (let i = 0; i < attic; i++) grid.unshift(new Array(def.w).fill('.'));
    for (let x = 0; x < def.w; x++) grid[0][x] = '#';        // 世界の上限（壊せない）
    L.rows = rows + attic;
    L.groundRow = groundRow + attic;
    const dy = attic*TILE;
    for (const s of L.spawns)   s.y += attic;
    for (const p of L.pipes)    p.top += attic;
    for (const w of L.warps)    w.top += attic;
    for (const b of L.blinks)   b.y += attic;
    for (const c of L.cannons)  c.cy += attic;
    for (const f of L.firebars) f.cy += attic;
    for (const p of L.plats)    { p.y += dy; p.by += dy; }
    for (const s of L.springs)  s.y += dy;
    for (const d of L.dossuns)  { d.y += dy; d.by += dy; }
    for (const c of L.scoins)   c.y += dy;
    const shifted = {};
    for (const k in L.items) { const [ix, iy] = k.split(','); shifted[ix + ',' + (+iy + attic)] = L.items[k]; }
    L.items = shifted;
  }
  return L;
}

/* ============================================================================
   6. タイル・当たり判定
   ============================================================================ */
const SOLID = { '#':1, 'B':1, '?':1, 'X':1, 'P':1, '~':1 };
function tileAt(cx, cy) {
  if (cx < 0 || cx >= lvl.w) return '#';
  if (cy < 0 || cy >= lvl.rows) return '.';
  return lvl.grid[cy][cx];
}
const solidAt = (cx, cy) => !!SOLID[tileAt(cx, cy)];

function collideX(e) {
  const y0 = Math.floor(e.y/TILE), y1 = Math.floor((e.y + e.h - 1)/TILE);
  if (e.vx > 0) {
    const cx = Math.floor((e.x + e.w - 1)/TILE);
    for (let cy = y0; cy <= y1; cy++) if (solidAt(cx, cy)) { e.x = cx*TILE - e.w; e.vx = 0; e.bumpedWall = true; return; }
  } else if (e.vx < 0) {
    const cx = Math.floor(e.x/TILE);
    for (let cy = y0; cy <= y1; cy++) if (solidAt(cx, cy)) { e.x = (cx+1)*TILE; e.vx = 0; e.bumpedWall = true; return; }
  }
}
function collideY(e, isPlayer) {
  const x0 = Math.floor(e.x/TILE), x1 = Math.floor((e.x + e.w - 1)/TILE);
  if (e.vy > 0) {
    const cy = Math.floor((e.y + e.h - 1)/TILE);
    for (let cx = x0; cx <= x1; cx++) {
      const t = tileAt(cx, cy);
      const semi = t === '=' && e.prevBottom <= cy*TILE + 2 && !(isPlayer && player.dropT > 0);
      if (SOLID[t] || semi) { e.y = cy*TILE - e.h; e.vy = 0; e.onGround = true; e.groundTile = t; return; }
    }
  } else if (e.vy < 0) {
    const cy = Math.floor(e.y/TILE);
    let best = -1, bestD = 1e9, hidden = -1;
    for (let cx = x0; cx <= x1; cx++) {
      const t = tileAt(cx, cy);
      if (t === 'H' && isPlayer) hidden = cx;
      if (solidAt(cx, cy)) { const d = Math.abs((cx + 0.5)*TILE - (e.x + e.w/2)); if (d < bestD) { bestD = d; best = cx; } }
    }
    if (hidden >= 0 && best < 0) { lvl.grid[cy][hidden] = '?'; e.y = (cy+1)*TILE; e.vy = 0; bumpTile(hidden, cy); return; }
    if (best >= 0) { e.y = (cy+1)*TILE; e.vy = 0; if (isPlayer) bumpTile(best, cy); }
  }
}
/* 足元1pxを見る接地プローブ。
   これが無いと「重力で少し沈む→次のフレームで着地」を繰り返し、
   onGround が数フレームおきに false になって着地音・砂埃が連発する */
function groundProbe(e, isPlayer) {
  const cy = Math.floor((e.y + e.h + 1)/TILE);
  const x0 = Math.floor((e.x + 2)/TILE), x1 = Math.floor((e.x + e.w - 3)/TILE);
  const dropThrough = isPlayer && player.dropT > 0;
  for (let cx = x0; cx <= x1; cx++) {
    const t = tileAt(cx, cy);
    if (SOLID[t] || (t === '=' && !dropThrough)) return t;
  }
  return null;
}
function moveEntity(e, dt) {
  e.bumpedWall = false;
  e.prevBottom = e.y + e.h;
  e.x += e.vx*dt; collideX(e);
  e.y += e.vy*dt; e.onGround = false; e.groundTile = null; collideY(e, e.isPlayer);
  if (!e.onGround && e.vy >= 0) {
    const t = groundProbe(e, e.isPlayer);
    if (t) { e.onGround = true; e.groundTile = t; e.vy = 0; }
  }
}
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
// ダメージ用の当たり判定は見た目より小さめに（歩行中のノコノコは特に甘く）
const hurtBox = e => (e.type === 'koopa' && e.shell <= 0)
  ? { x: e.x + 7, y: e.y + 13, w: e.w - 14, h: e.h - 13 }
  : e;

/* ============================================================================
   7. ゲーム状態
   ============================================================================ */
const G = {
  state: 'title',      // title | map | play | dead | clear | gameover | ending | pause
  levelIndex: 0, cursor: 0, score: 0, coins: 0, lives: 3,
  time: 400, timer: 0, t: 0, msgT: 0, shake: 0, freeze: 0, fade: 1, fadeDir: -1,
  stageTime: 0, gotCoins: [false,false,false]
};
const cam = { x: 0, y: 0 };
let camFocusY = 0;          // 縦カメラが見ている高さ（接地時のみ更新）
let player, enemies, items, fires, efires, particles, pops, bumps, boss;
let saveRoom = null, checkpoint = null;

/* 物理定数（ジャンプは「速く落ちる」方向に再調整） */
const GRAV = 2900, GRAV_HOLD = 1500, MAXFALL = 820;
const gravOf = () => lvl.water ? GRAV*0.30 : GRAV;
const maxFallOf = () => lvl.water ? 210 : MAXFALL;

function makePlayer(power) {
  return {
    isPlayer: true, x: 3*TILE, y: (GROUND_ROW-2)*TILE, w: 24, h: power > 0 ? 52 : 28,
    vx: 0, vy: 0, power: power|0, face: 1, onGround: false, coyote: 0, jbuf: 0,
    inv: 0, star: 0, anim: 0, dead: false, growT: 0, crouch: false, fireT: 0, combo: 0,
    warpT: 0, skid: 0, dust: 0, squash: 0, land: 0, throwT: 0, swimT: 0, dropT: 0,
    climb: null, warpUp: false, entered: false,
    yoshi: false, tongue: 0, tongueGrab: null, flutterT: 0, yanim: 0, carry: null, cjump: false, low: false,
    chew: 0, mouth: null, mouthObj: null
  };
}

function applyLevelGlobals() { ROWS = lvl.rows; GROUND_ROW = lvl.groundRow; }

function loadLevel(i, power, fromCheckpoint) {
  lvl = buildLevel(LEVELS[i]);
  applyLevelGlobals();
  setBGM(LEVELS[i].music, true);
  G.gotCoins = stageSave(i).coins.slice();
  spawnEntities(power, fromCheckpoint);
  G.time = LEVELS[i].time; G.timer = 0; G.msgT = 2.0; G.stageTime = 0;
  G.fade = 1; G.fadeDir = -1;
}
function spawnEntities(power, fromCheckpoint) {
  player = makePlayer(power);
  if (fromCheckpoint && checkpoint) {
    player.x = checkpoint.x*TILE;
    lvl.checkpoints.forEach(c => { if (c.x <= checkpoint.x) c.on = true; });
  }
  player.y = (GROUND_ROW - (player.power > 0 ? 2 : 1))*TILE - (player.power > 0 ? 20 : 4);
  enemies = lvl.spawns.map(s => spawnEnemy(s.type, s.x*TILE, s.y*TILE));
  items = []; fires = []; efires = []; particles = []; pops = []; bumps = [];
  boss = lvl.bossX != null ? makeBoss(lvl.bossX) : null;
  camFocusY = player.y + player.h;
  cam.x = clamp(player.x + player.w/2 - VW/2, 0, lvl.w*TILE - VW);
  cam.y = clamp(camFocusY - VH*0.62, 0, Math.max(0, lvl.rows*TILE - VH));
}
function spawnEnemy(type, x, y) {
  if (type === 'goomba') return { type, x, y, w:26, h:26, vx:-50, vy:0, dir:-1, dead:0, onGround:false, anim:0 };
  if (type === 'para')   return { type, x, y, w:26, h:38, vx:0, vy:0, dir:-1, dead:0, base:y, ph:Math.random()*6, anim:0 };
  /* ファイアパックンは火を吐くだけで、当たり判定も倒し方もパックンフラワーと同じ */
  if (type === 'piranha' || type === 'firepiranha')
    return { type:'piranha', fire: type === 'firepiranha', x: x+20, y, w:24, h:56, vx:0, vy:0,
             dead:0, out:0, ph:Math.random()*3, anim:0, top:y, hold:false, fireT: 1.4 + Math.random(), spit:0 };
  if (type === 'cheep')  return { type, x, y, w:30, h:24, vx:-60, vy:0, dir:-1, dead:0, base:y, ph:Math.random()*6, anim:0 };
  if (type === 'ghost')  return { type, x, y, w:30, h:30, vx:0, vy:0, dir:-1, dead:0, anim:0, shy:0, ph:Math.random()*6 };
  if (type === 'hammer') return { type, x, y, w:28, h:44, vx:0, vy:0, dir:-1, dead:0, base:x, ph:0, anim:0,
                                  onGround:false, throwT: 1 + Math.random(), jumpT: 2 + Math.random()*2 };
  return { type:'koopa', x, y, w:26, h:40, vx:-46, vy:0, dir:-1, shell:0, kick:0, dead:0, onGround:false, anim:0 };
}
function makeBoss(cx) {
  return { type:'boss', x: cx*TILE, y: (GROUND_ROW-3)*TILE, w:58, h:60, vx:-55, vy:0, dir:-1,
           hp: 6, maxhp: 6, hurt: 0, onGround:false, jumpT: 1.6, fireT: 1.2, dead: 0, anim: 0, rage: false,
           left: (cx-9)*TILE, right: (cx+7)*TILE, wasAir: false };
}

function addPop(x, y, text, c) { pops.push({ x, y, text, t: 1.0, c: c || '#fff' }); }
function addScore(n, x, y) { G.score += n; if (x != null) addPop(x, y, String(n)); }
function addCoin() { G.coins++; G.score += 200; if (G.coins >= 100) { G.coins -= 100; oneUp(); } }
function oneUp() { G.lives++; SFX.oneup(); addPop(player.x, player.y - 20, '1UP', '#7cf87c'); }
function freeze(t) { G.freeze = Math.max(G.freeze, t); }
function burst(cx, cy, color) {
  for (let i = 0; i < 6; i++) particles.push({
    x: cx*TILE + 16, y: cy*TILE + 16, vx: (Math.random()-0.5)*260, vy: -180 - Math.random()*200,
    r: Math.random()*6 + 4, t: 1.2, rot: Math.random()*6, c: color });
}
function dust(x, y, n, c) {
  for (let i = 0; i < n; i++) particles.push({
    x, y, vx: (Math.random()-0.5)*140, vy: -40 - Math.random()*90,
    r: 4 + Math.random()*4, t: 0.35 + Math.random()*0.2, rot: 0, c: c || 'rgba(255,255,255,.75)', soft: true });
}
/* 羽つきを踏んだときに、羽だけ左右へ飛ばす */
function wingsOff(e) {
  const cx = e.x + e.w/2, cy = e.y + 8;
  for (const s of [-1, 1]) particles.push({
    x: cx + s*10, y: cy, vx: s*150, vy: -210, r: 7, t: 0.55, rot: 0, c: '#f8f8f8' });
  dust(cx, cy + 6, 3, 'rgba(255,255,255,.8)');
}
function smoke(x, y) {
  for (let i = 0; i < 8; i++) particles.push({
    x, y, vx: (Math.random()-0.5)*180, vy: -60 - Math.random()*140,
    r: 6 + Math.random()*8, t: 0.5, rot: 0, c: 'rgba(240,240,255,.8)', soft: true });
}

/* ブロックの真上に乗っているコインは、下から叩くと弾き飛ばして取れる */
function bumpCoinAbove(cx, cy) {
  for (let i = 1; i <= 2; i++) {          // 積み重なっていても拾えるように2段ぶん見る
    const ay = cy - i;
    if (tileAt(cx, ay) !== 'o') break;
    lvl.grid[ay][cx] = '.';
    addCoin(); SFX.coin();
    addPop(cx*TILE + 8, ay*TILE, '200');
    particles.push({ x: cx*TILE+16, y: ay*TILE, vx:0, vy:-420, r:8, t:0.55, coin:true, rot:0 });
  }
}
/* ブロックの真上に乗っているアイテムは、下から叩くと跳ね上がる。
   フラワーはその場から動かない仕様なので対象外 */
function bumpItemsAbove(cx, cy) {
  const mid = cx*TILE + 16, top = cy*TILE;
  for (const it of items) {
    if (it.remove || it.birth > 0 || it.type === 'flower') continue;
    if (Math.abs((it.x + it.w/2) - mid) > 22) continue;
    if (Math.abs((it.y + it.h) - top) > 10) continue;   // ちょうどこのブロックに乗っている
    it.y -= 2; it.vy = -430; it.onGround = false;   // 1タイルぶんほど跳ね上がる
    dust(it.x + it.w/2, it.y + it.h, 2);
  }
}
/* パワーアップ系の中身は、叩いたときのマリオの状態で変わる。
   ちび→キノコ／スーパー→ファイア／ファイア→ヨッシー／ヨッシー騎乗中→スター */
const POWER_ITEMS = { mush:1, flower:1, yoshi:1, star:1 };
function stateItem(kind) {
  if (!POWER_ITEMS[kind]) return kind;      // コイン・つた・1UPはそのまま
  const p = player;
  if (p.yoshi)        return 'star';
  if (p.power >= 2)   return 'yoshi';
  if (p.power === 1)  return 'flower';
  return 'mush';
}
/* ブロックを叩く */
function bumpTile(cx, cy) {
  const t = tileAt(cx, cy);
  bumpCoinAbove(cx, cy);
  bumpItemsAbove(cx, cy);
  if (t === '?') {
    const key = cx + ',' + cy, kind = stateItem(lvl.items[key] || 'coin');
    lvl.grid[cy][cx] = 'X';
    bumps.push({ cx, cy, t: 0.22 });
    if (kind === 'coin') {
      addCoin(); addPop(cx*TILE + 8, cy*TILE - 10, '200');
      particles.push({ x: cx*TILE+16, y: cy*TILE, vx:0, vy:-420, r:8, t:0.55, coin:true, rot:0 });
      SFX.coin();
    } else if (kind === 'coin10') {
      /* 実体のあるコインを噴き上げて広くばら撒く（拾って初めて加算） */
      for (let i = 0; i < 10; i++) {
        const spread = (i - 4.5)/4.5;
        items.push({ type:'coin', x: cx*TILE + 8, y: cy*TILE - 18, w:16, h:16,   // ブロックの外に出してから飛ばす
                     vx: spread*240 + (Math.random()-0.5)*70,
                     vy: -380 - Math.random()*280, onGround:false,
                     birth: 0, bounces: 3, ph: Math.random()*3 });
      }
      addPop(cx*TILE, cy*TILE - 14, 'COIN×10', '#ffd040');
      SFX.coin(); SFX.power();
    } else if (kind === 'vine') {
      /* つた。上まで伸びきったら登って空のボーナスへ行ける */
      lvl.vines.push({ x: cx*TILE + 11, bottom: cy*TILE, h: 0, maxH: (cy - 1)*TILE, w: 10, to: 'sky1' });
      addPop(cx*TILE, cy*TILE - 14, 'つた!', '#7cf87c');
      SFX.power();
    } else if (kind === 'yoshi') {
      items.push({ type:'yoshi', x: cx*TILE + 2, y: cy*TILE, w:30, h:30,
                   vx: 40, vy: -60, onGround:false, birth: 0.4, riseTo: cy*TILE - 30, flee: 0, ph: 0 });
      addPop(cx*TILE, cy*TILE - 14, 'YOSHI!', '#7cf87c');
      SFX.power();
    } else {
      const k = kind;
      // ブロックから完全にせり上がってから右へ転がり出す
      const spd = k === 'star' ? 90 : 115;
      items.push({ type: k, x: cx*TILE+4, y: cy*TILE, w:24, h:24,
                   vx: spd, vy: -60, spd, onGround:false,
                   birth: 0.35, riseTo: cy*TILE - 24, ph: 0 });
      SFX.power();
    }
  } else if (t === 'B') {
    if (player.power > 0) {
      lvl.grid[cy][cx] = '.';
      burst(cx, cy, lvl.theme.brick);
      addScore(50); SFX.brick(); G.shake = 0.12; freeze(0.035);
    } else { bumps.push({ cx, cy, t: 0.18 }); SFX.bump(); }
    for (const e of enemies) {
      if (e.dead || e.type === 'piranha' || e.type === 'cheep') continue;
      if (Math.abs((e.x + e.w/2) - (cx*TILE + 16)) < 24 && Math.abs((e.y + e.h) - cy*TILE) < 10) flipEnemy(e);
    }
  } else if (t === '#' || t === 'X' || t === '~') SFX.bump();
}
/* 蹴った甲羅が横から壁にぶつかったとき。
   レンガは壊して突き抜け、ハテナは横叩きで発動させる（発動後は硬いので跳ね返る） */
function shellSmash(e) {
  const cx = Math.floor((e.kick > 0 ? e.x + e.w + 2 : e.x - 2)/TILE);
  const y0 = Math.floor((e.y + 2)/TILE), y1 = Math.floor((e.y + e.h - 3)/TILE);
  let broke = false;
  for (let cy = y0; cy <= y1; cy++) {
    const t = tileAt(cx, cy);
    if (t === 'B') {
      lvl.grid[cy][cx] = '.';
      burst(cx, cy, lvl.theme.brick);
      addScore(50); SFX.brick(); G.shake = 0.12;
      broke = true;
    } else if (t === '?') {
      bumpTile(cx, cy);
    }
  }
  return broke;
}

/* ============================================================================
   8. プレイヤー
   ============================================================================ */
/* --- ヨッシー ---
   乗っている間は当たり判定を 52px（2タイルの隙間は通れる高さ）に固定し、
   舌で敵を食べる・ふんばりジャンプ・ダメージを1回肩代わりする */
const YOSHI_H = 52;
const TONGUE_T = 0.36;                     // 舌を出しきって戻すまでの時間
const TONGUE_MIN = 12, TONGUE_LEN = 96;    // 伸びきると 108px
/* --- しゃがみジャンプ ---
   飛んでいる間だけ当たり判定をちび状態の高さに縮める。
   着地して ↓ を離したら、頭上に余裕があるところで元に戻す */
function boxSolid(x, y, w, h) {
  const x0 = Math.floor(x/TILE), x1 = Math.floor((x + w - 1)/TILE);
  const y0 = Math.floor(y/TILE), y1 = Math.floor((y + h - 1)/TILE);
  for (let cy = y0; cy <= y1; cy++) for (let cx = x0; cx <= x1; cx++) if (solidAt(cx, cy)) return true;
  return false;
}
/* しゃがみ中（しゃがみジャンプ中も）は、当たり判定の高さをちびマリオと同じ 28px にする。
   これで大砲の弾などをしゃがんでやり過ごせる。頭上がふさがっているうちは縮んだまま */
function updateLowBox() {
  const p = player;
  const want = p.power > 0 && !p.yoshi && (p.crouch || p.cjump);
  if (want) {
    if (!p.low) { p.y += p.h - 28; p.h = 28; p.low = true; }
  } else if (p.low) {
    if (p.power === 0 || p.yoshi) { p.low = false; return; }
    if (boxSolid(p.x + 1, p.y - 24, p.w - 2, 24)) return;
    p.y -= 24; p.h = 52; p.low = false;
  }
}
function growBody() {   // ちび→スーパー。ヨッシーに乗っている間は高さを変えない
  const p = player;
  if (p.yoshi) return;
  p.cjump = false; p.low = false;
  p.y -= 52 - p.h; p.h = 52;
}
function mountYoshi() {
  const p = player;
  p.cjump = false; p.low = false;
  p.y += p.h - YOSHI_H; p.h = YOSHI_H;
  p.yoshi = true; p.tongue = 0; p.tongueGrab = null; p.flutterT = 0.4; p.yanim = 0;
  addPop(p.x, p.y - 16, 'YOSHI!', '#7cf87c');
  SFX.yoshiCry();
  hushBGM(1.2);              // 鳴き声を聴かせる間、BGMのインターバルを1.2秒止める
  freeze(0.05);
}
/* ヨッシーから降りる。
   'flee' … ダメージの身代わりになって逃げ出す（しばらく乗り直せない）
   'hop'  … 自分から飛び降りる。その場に残るので追いつけば乗り直せる */
function dismountYoshi(mode) {
  const p = player;
  if (!p.yoshi) return;
  releaseTongue();
  if (p.mouth) spitMouth();          // 口にためたままにせず、降りるときに吐き出す
  p.yoshi = false; p.tongue = 0;
  const nh = p.power > 0 ? 52 : 28;
  p.y += p.h - nh; p.h = nh;
  if (mode === 'flee' || mode === 'hop') {
    const away = mode === 'flee';
    items.push({ type:'yoshi', x: p.x, y: p.y + (nh - 30), w:30, h:30,
                 vx: away ? -p.face*260 : -p.face*70, vy: away ? -280 : -140,
                 onGround:false, birth: 0, flee: away ? 2.2 : 0.3, ph: 0 });
    dust(p.x + p.w/2, p.y + p.h, away ? 5 : 3, 'rgba(140,240,150,.8)');
  }
}
/* 舌の伸び具合（0→1→0）と先端のX座標 */
const tongueReach = () => TONGUE_MIN + (1 - Math.abs(player.tongue/TONGUE_T - 0.5)*2) * TONGUE_LEN;
const tongueTipX  = r => player.face > 0 ? player.x + player.w - 4 + r : player.x + 4 - r;
/* 捕まえた敵を離す（降りる・やられたとき） */
function releaseTongue() {
  const p = player;
  if (!p.tongueGrab) return;
  p.tongueGrab.grabbed = false;
  p.tongueGrab = null;
}
/* 甲羅を持つ敵は飲み込まず、口にためて吐き出せる */
const SPIT_TYPES = { koopa: 1, para: 1 };
/* 吸い込みきって飲み込む（ノコノコ系とバネは口の中へ） */
function swallowGrabbed() {
  const p = player, e = p.tongueGrab;
  p.tongueGrab = null;
  if (!e || e.remove) return;
  e.grabbed = false;
  /* バネは壊さず口にためる。世界から消さずに held で隠しておき、吐いた場所に置き直す */
  if (e.isSpring) {
    if (p.mouth) { e.held = false; return; }        // すでに何か含んでいるならそのまま落とす
    p.mouth = 'spring'; p.mouthObj = e; e.held = true; e.vx = 0; e.vy = 0;
    p.chew = 0.3;
    dust(p.x + (p.face > 0 ? p.w : 0), p.y + 22, 2, 'rgba(255,255,255,.6)');
    SFX.slurp();
    return;
  }
  e.remove = true;
  if (SPIT_TYPES[e.type] && !p.mouth) {
    p.mouth = 'shell';                 // もう一度ダッシュキーで甲羅として吐き出す
    p.chew = 0.3;
    dust(p.x + (p.face > 0 ? p.w : 0), p.y + 22, 2, 'rgba(255,255,255,.6)');
    SFX.slurp();
    return;
  }
  addScore(200, p.x + p.w/2, p.y);
  /* 砕けたように見えないよう、飛び散る破片は出さずに口元で小さく吸い込む */
  dust(p.x + (p.face > 0 ? p.w : 0), p.y + 22, 2, 'rgba(255,255,255,.6)');
  p.chew = 0.45;                       // 口をもぐもぐさせる
  SFX.gulp();
}
/* 口にためたものを吐き出す。甲羅は蹴ったように転がり、バネはその先に着地する */
function spitMouth() {
  const p = player;
  if (!p.mouth) return;
  const what = p.mouth;
  p.mouth = null; p.chew = 0;
  if (what === 'spring') {
    const s = p.mouthObj; p.mouthObj = null;
    if (s) {
      s.held = false; s.grabbed = false; s.carried = false; s.onGround = false; s.kickGrace = 0.4;
      s.x = p.x + (p.face > 0 ? p.w : -s.w); s.y = p.y + 6;
      s.vx = p.face*280; s.vy = -150;
    }
  } else {
    const e = spawnEnemy('koopa', p.x + (p.face > 0 ? p.w - 4 : -22), p.y + 12);
    e.shell = 99; e.h = 26; e.kick = p.face; e.dir = p.face;
    e.vx = p.face*340; e.vy = -60; e.kickGrace = 0.35;
    enemies.push(e);
  }
  dust(p.x + (p.face > 0 ? p.w : 0), p.y + 20, 3, 'rgba(255,220,180,.8)');
  SFX.kick();
}
/* 舌で捕まえられる敵か */
function canEat(e) {
  if (!e || e.dead || e.remove || e.grabbed || e.type === 'boss') return false;
  if (e.type === 'piranha' && e.out <= 0.2) return false;
  if (e.isSpring && (e.held || player.mouth)) return false;   // 口がふさがっているときは吸えない
  return true;
}
/* 敵を舌に吸い付ける。以降 updateTongue が位置を持つので接触ダメージは起きない */
function grabWithTongue(e) {
  const p = player;
  if (!canEat(e)) return false;
  if (e === p.carry) { p.carry = null; e.carried = false; }
  e.grabbed = true; e.vx = 0; e.vy = 0;
  p.tongueGrab = e;
  /* 今の舌の長さのまま引き戻しに移る。
     一律に伸びきった長さへ入れ替えると、近くの敵が一度前へ飛び出して見えてしまう */
  const t = clamp((tongueReach() - TONGUE_MIN) / TONGUE_LEN, 0, 1);
  p.tongue = Math.max(0.06, Math.min(p.tongue, t*TONGUE_T/2));   // 密着していても必ず飲み込みまで見せる
  SFX.kick();
  return true;
}
/* 舌。伸びている間に触れた敵を吸い付け、戻りきったところで食べる */
function updateTongue(dt) {
  const p = player;
  if (p.tongue <= 0) { if (p.tongueGrab) swallowGrabbed(); else releaseTongue(); return; }
  p.tongue -= dt;
  const reach = tongueReach();

  /* 吸い込み中：敵を舌の先にくっつけて口元まで引き寄せる */
  if (p.tongueGrab) {
    const e = p.tongueGrab;
    if (e.remove || e.dead) { releaseTongue(); return; }
    /* 舌が戻りきる＝口に入ったところで飲み込む。
       吸い込み中の敵は当たり判定から外してあるので、重なってもダメージにはならない */
    if (p.tongue <= 0) { swallowGrabbed(); return; }
    const tip = tongueTipX(reach);
    e.x = tip - e.w/2; e.y = p.y + 22 - e.h/2;
    e.vx = 0; e.vy = 0; e.onGround = false;
    return;
  }

  const box = { x: p.face > 0 ? p.x + p.w - 4 : p.x + 4 - reach, y: p.y + 16, w: reach, h: 12 };
  for (const e of enemies) {
    if (!canEat(e) || !overlap(box, e)) continue;
    grabWithTongue(e);
    return;
  }
  for (const s of lvl.springs) {                    // バネも舌で吸い寄せられる
    if (!canEat(s) || !overlap(box, s)) continue;
    grabWithTongue(s);
    return;
  }
}

/* --- つた --- */
function vineAt(p) {
  for (const v of lvl.vines) {
    if (v.h < 14) continue;
    if (overlap(p, { x: v.x - 4, y: v.bottom - v.h, w: v.w + 8, h: v.h })) return v;
  }
  return null;
}
/* ↑（ジャンプキー）で登り、↓で降りる。左右で飛び降り、上まで登ると空のボーナスへ */
function updateClimb(dt) {
  const p = player, v = p.climb;
  p.vx = 0; p.vy = 0; p.onGround = false; p.jumping = false;
  p.x = v.x + v.w/2 - p.w/2;
  if (keys.jump)      { p.y -= 108*dt; p.anim += dt*7; }
  else if (keys.down) { p.y += 108*dt; p.anim += dt*7; }

  if (p.y + p.h <= v.bottom - v.h + 8) {          // 登りきった → ワープ
    p.climb = null; p.warpT = 0.9; p.warpUp = true; SFX.warp();
    const back = { x: v.x + 2*TILE, y: v.bottom - 60 };
    setTimeout(() => enterRoom(v.to, back), 800);
    return;
  }
  if (keys.left || keys.right) {                  // 左右で飛び降りる
    const d = keys.left ? -1 : 1;
    p.climb = null; p.face = d; p.vx = d*190; p.vy = -300;
    return;
  }
  if (p.y > v.bottom + 20) p.climb = null;        // 下まで降りたら離れる
}

function updatePlayer(dt) {
  const p = player;
  if (p.warpT > 0) { p.warpT -= dt; p.y += (p.warpUp ? -60 : 46)*dt; return; }
  if (p.growT > 0) { p.growT -= dt; return; }

  /* --- つた登り --- */
  if (p.climb) { updateClimb(dt); return; }
  if (lvl.vines.length) {
    const v = vineAt(p);
    if (v && (keys.jump || !p.onGround)) { p.climb = v; p.vy = 0; p.jumping = false; p.crouch = false; }
  }

  const ice = lvl.slippery && p.onGround;
  const water = lvl.water;
  const run = keys.run;
  const maxSpd = water ? 150 : (run ? 350 : 205);
  let accel = water ? 700 : 1500, decel = water ? 500 : 1900, skidDec = 2900;
  if (ice) { accel *= 0.42; decel *= 0.14; skidDec *= 0.30; }

  p.crouch = p.power > 0 && p.onGround && keys.down && !water && !p.yoshi;
  updateLowBox();

  let dir = 0;
  if (keys.left && !keys.right) dir = -1;
  if (keys.right && !keys.left) dir = 1;
  if (p.crouch) dir = 0;

  /* --- スキッド（逆入力での急ブレーキ） --- */
  const turning = dir !== 0 && p.vx !== 0 && Math.sign(p.vx) !== dir;
  p.skid = (turning && p.onGround && Math.abs(p.vx) > 70 && !water) ? 0.14 : Math.max(0, p.skid - dt);
  if (dir !== 0) {
    p.face = dir;
    p.vx += dir * (turning ? skidDec : accel) * dt;
    if (Math.abs(p.vx) > maxSpd) p.vx = dir * maxSpd;
    if (p.skid > 0) {
      p.dust -= dt;
      if (p.dust <= 0) { p.dust = 0.05; dust(p.x + p.w/2 - dir*8, p.y + p.h - 3, 2); SFX.skid(); }
    }
  } else {
    if (p.vx > 0) p.vx = Math.max(0, p.vx - decel*dt);
    else if (p.vx < 0) p.vx = Math.min(0, p.vx + decel*dt);
  }

  /* --- 抱えた甲羅を投げる（ダッシュキーを離すと放す） --- */
  if (p.carry) {
    const s = p.carry;
    if (s.remove || s.dead || !s.carried) p.carry = null;
    else if (!keys.run) {
      s.carried = false; s.kickGrace = 0.4;
      s.x = p.x + (p.face > 0 ? p.w + 2 : -s.w - 2);
      if (s.isSpring) {
        /* バネは転がらないので、しゃがみ中はその場に置き、そうでなければ放り投げる */
        if (keys.down && p.onGround) { s.vx = 0; s.vy = 0; }
        else { s.vx = p.face*260; s.vy = -190; s.onGround = false; SFX.kick(); }
      }
      else if (keys.down && p.onGround) { s.kick = 0; s.shell = 6; s.vx = 0; }   // しゃがみ中はそっと置く
      else { s.kick = p.face; s.shell = 99; s.vx = p.face*300; SFX.kick(); }
      p.carry = null;
    }
  }

  /* --- ヨッシーの舌 --- */
  if (p.yoshi) {
    p.yanim += Math.abs(p.vx)*dt*0.05;
    if (p.chew > 0) p.chew -= dt;
    if (hit('run')) {
      if (p.mouth) spitMouth();                                    // 口にためた甲羅を吐き出す
      else if (p.tongue <= 0) { p.tongue = TONGUE_T; SFX.slurp(); }
    }
    updateTongue(dt);
  }

  /* --- ファイアボール（ヨッシーに乗っている間は舌が優先） --- */
  if (p.fireT > 0) p.fireT -= dt;
  if (p.throwT > 0) p.throwT -= dt;
  if (hit('run') && !p.yoshi && p.power === 2 && fires.length < 2 && p.fireT <= 0) {
    fires.push({ x: p.x + (p.face > 0 ? p.w : -8), y: p.y + p.h*0.4, w: 12, h: 12,
                 vx: p.face * (water ? 260 : 420), vy: 60, t: 3.2, anim: 0 });
    p.fireT = 0.22; p.throwT = 0.16; SFX.fire();
  }

  /* --- ジャンプ / 泳ぎ --- */
  p.coyote = p.onGround ? 0.1 : Math.max(0, p.coyote - dt);
  p.jbuf = hit('jump') ? 0.12 : Math.max(0, p.jbuf - dt);
  if (water) {
    if (p.jbuf > 0) {
      p.vy = -230; p.jbuf = 0; p.swimT = 0.32; SFX.swim();
      dust(p.x + p.w/2, p.y + p.h, 2, 'rgba(200,240,255,.7)');
    }
    p.vy += gravOf()*dt;
    if (p.vy > maxFallOf()) p.vy = maxFallOf();
    if (p.swimT > 0) p.swimT -= dt;
  } else {
    /* 薄い台の上で ↓ を押す → その場で下へすり抜ける */
    if (p.onGround && hit('down') && p.groundTile === '=') {
      p.dropT = 0.22; p.y += 3; p.vy = 80; p.onGround = false; p.jbuf = 0; p.coyote = 0;
      SFX.bump();
    }
    else if (p.jbuf > 0 && p.coyote > 0) {
      /* ↓ を押しながらジャンプ → しゃがみジャンプ。
         低く飛ぶかわりに空中でも縮んだままなので、1マスの隙間に飛び込める */
      const cj = p.crouch;
      p.vy = (cj ? -520 : -650) - Math.min(Math.abs(p.vx), 350) * 0.35;
      p.onGround = false; p.coyote = 0; p.jbuf = 0; p.jumping = true;
      p.squash = -0.22;
      if (cj) p.cjump = true;
      dust(p.x + p.w/2, p.y + p.h - 2, 3);
      SFX.jump();
    }
    if (p.vy < 0 && keys.jump && p.jumping) p.vy += GRAV_HOLD*dt;
    else { p.vy += GRAV*dt; p.jumping = false; }
    if (p.vy > MAXFALL) p.vy = MAXFALL;
    /* ヨッシーに乗っている間のジャンプキー。
       押しっぱなし … ふんばりジャンプ（落下中にしばらく踏ん張る）
       空中で押し直し … ヨッシーから飛び降りる。ヨッシーはその場に残る */
    if (p.yoshi) {
      if (p.onGround) p.flutterT = 0.4;
      else if (p.jbuf > 0 && hit('jump')) {
        p.jbuf = 0;
        dismountYoshi('hop');
        p.vy = -560; p.jumping = true; p.squash = -0.22;
        SFX.jump();
      }
      else if (keys.jump && p.vy > 0 && p.flutterT > 0) {
        p.flutterT -= dt; p.vy = Math.min(p.vy, 55);
        if (Math.floor(G.t*20) % 2 === 0) dust(p.x + p.w/2, p.y + p.h - 4, 1, 'rgba(200,255,200,.6)');
      }
    }
  }

  const wasAir = !p.onGround;
  moveEntity(p, dt);
  if (p.onGround) p.cjump = false;   // 着地でしゃがみジャンプは終わり（↓を離すと立ち上がる）
  updateLowBox();
  if (p.onGround && wasAir) {
    p.combo = 0; p.squash = 0.30; p.land = 0.12;
    if (!water) { dust(p.x + p.w/2, p.y + p.h - 2, 4); SFX.land(); }
  }
  if (p.x < cam.x) { p.x = cam.x; if (p.vx < 0) p.vx = 0; }
  if (p.x < 0) { p.x = 0; p.vx = 0; }
  // 自動スクロール面では右端からも出られない
  if (lvl.scroll && p.x + p.w > cam.x + VW) { p.x = cam.x + VW - p.w; if (p.vx > 0) p.vx = 0; }

  p.anim += Math.abs(p.vx)*dt*0.05;
  p.squash = approach(p.squash, 0, dt, 0.0002);
  if (p.land > 0) p.land -= dt;
  if (p.dropT > 0) p.dropT -= dt;
  if (p.inv > 0) p.inv -= dt;
  if (p.star > 0) { p.star -= dt; if (p.star <= 0) setBGM(lvl.def.music); }

  /* 動く床 */
  for (const pl of lvl.plats) {
    if (p.vy >= 0 && p.x + p.w > pl.x && p.x < pl.x + pl.w &&
        p.prevBottom <= pl.y + 6 && p.y + p.h >= pl.y && p.y + p.h <= pl.y + pl.h + 8) {
      p.y = pl.y - p.h; p.vy = 0; p.onGround = true; p.coyote = 0.1;
      p.x += pl.dx; p.y += pl.dy;
      if (wasAir) { p.combo = 0; p.squash = 0.25; }
    }
  }
  /* バネ。上から踏めば跳ね、横からダッシュキーで触れれば抱え上げる */
  for (const s of lvl.springs) {
    if (s.carried || s.grabbed || s.held) continue;
    if (p.vy >= 0 && overlap(p, { x: s.x, y: s.y, w: s.w, h: 16 }) && p.prevBottom <= s.y + 10) {
      p.y = s.y - p.h; p.vy = keys.jump ? -1080 : -760; s.c = 0.25;
      p.jumping = true; p.squash = -0.3; SFX.spring();
    }
    else if (keys.run && !p.carry && !p.yoshi && s.kickGrace <= 0 && overlap(p, s)) {
      s.carried = true; p.carry = s;
      tone(760, 0.07, 'square', 0.04, 420);
    }
  }

  /* タイル効果（コイン・溶岩） */
  const c0 = Math.floor(p.x/TILE), c1 = Math.floor((p.x + p.w - 1)/TILE);
  const r0 = Math.floor(p.y/TILE), r1 = Math.floor((p.y + p.h - 1)/TILE);
  for (let cy = r0; cy <= r1; cy++) for (let cx = c0; cx <= c1; cx++) {
    const t = tileAt(cx, cy);
    if (t === 'o') { lvl.grid[cy][cx] = '.'; addCoin(); SFX.coin(); addPop(cx*TILE+8, cy*TILE, '200'); }
    else if (t === 'L') killPlayer(true);
  }

  /* スターコイン */
  for (let i = 0; i < lvl.scoins.length; i++) {
    const s = lvl.scoins[i];
    if (s.got || G.gotCoins[i]) continue;
    if (overlap(p, s)) {
      s.got = true; G.gotCoins[i] = true;
      addScore(2000, s.x, s.y - 10);
      addPop(s.x - 10, s.y - 30, 'STAR COIN!', '#ffe45c');
      SFX.scoin(); freeze(0.06);
      for (let k = 0; k < 12; k++) particles.push({ x: s.x+12, y: s.y+14, vx:(Math.random()-0.5)*260,
        vy:-100-Math.random()*220, r:5, t:0.7, rot:0, c:'#ffe45c' });
    }
  }

  /* チェックポイント */
  for (const c of lvl.checkpoints) {
    if (!c.on && p.x + p.w/2 > c.x*TILE) {
      c.on = true; checkpoint = { x: c.x, power: p.power };
      SFX.star(); addPop(c.x*TILE, (GROUND_ROW-3)*TILE, 'CHECK!', '#7cf87c');
    }
  }

  /* 土管ワープ */
  if (keys.down && p.onGround) {
    for (const w of lvl.warps) {
      if (p.x + p.w/2 > w.x*TILE + 6 && p.x + p.w/2 < (w.x+2)*TILE - 6 && Math.abs((p.y + p.h) - w.top*TILE) < 8) {
        p.warpT = 0.8; SFX.warp();
        setTimeout(() => enterRoom(w.to), 750);
        return;
      }
    }
  }

  if (p.y > lvl.rows*TILE + 60) killPlayer(true);
  if (G.state === 'play' && lvl.flagX != null && p.x + p.w/2 >= lvl.flagX*TILE + 8) reachFlag();
  /* ボーナスルームは、出口より先で画面の右端を抜けきり、
     さらに少し歩いたところで切り替える（カメラは ROOM_PAD ぶん手前で止めてある）。
     自動スクロール面は画面外に出られないので、部屋の右端に着いたら終了 */
  if (G.state === 'play' && lvl.room && lvl.exitX != null && p.x + p.w/2 >= lvl.exitX*TILE) {
    const done = lvl.scroll ? (p.x + p.w >= lvl.w*TILE - 4)
                            : (p.x >= cam.x + VW + 24);
    if (done) exitRoom();
  }
}

function dropCarry() {
  const p = player;
  if (!p.carry) return;
  const s = p.carry;
  s.carried = false; s.vx = 0; s.kickGrace = 0.4;
  if (!s.isSpring) { s.kick = 0; s.shell = 6; }
  p.carry = null;
}
function damagePlayer() {
  const p = player;
  if (p.inv > 0 || p.star > 0 || G.state !== 'play') return;
  dropCarry();
  if (p.yoshi) {            // ヨッシーが身代わりになって逃げ出す
    dismountYoshi('flee');
    p.inv = 1.8; freeze(0.06); SFX.shrink();
    return;
  }
  if (p.power > 0) {
    p.power--;
    if (p.power === 0) { p.y += p.h - 28; p.h = 28; p.cjump = false; p.low = false; }
    p.inv = 2.0; p.growT = 0.5; freeze(0.06); SFX.shrink();
  } else killPlayer(false);
}
function killPlayer(fell) {
  if (G.state !== 'play') return;
  G.state = 'dead'; G.timer = 0;
  releaseTongue();
  if (player.mouthObj) player.mouthObj.held = false;      // 口の中のバネを世界に戻す
  player.yoshi = false; player.tongue = 0; player.mouth = null; player.mouthObj = null;
  dropCarry();
  player.dead = true; player.vy = fell ? 400 : -620; player.vx = 0;
  SFX.die();
}
function reachFlag() {
  G.state = 'clear'; G.timer = 0;
  const bonus = Math.max(0, Math.floor((lvl.rows*TILE - player.y)/8) * 50);
  addScore(1000 + bonus, player.x, player.y - 20);
  G.fwLeft = G.time % 10;   // タイムの1の位ぶんだけ花火を打ち上げる
  G.fwT = 0.5; G.clearEnd = null;
  SFX.flag();
  setTimeout(() => SFX.clear(), 700);
}
/* 城のドア中央（マリオはここで消える） */
const castleDoorX = () => lvl.flagX*TILE + 170;
function launchFirework() {
  const x = cam.x + 120 + Math.random()*(VW - 240);
  const y = cam.y + 50 + Math.random()*110;
  const c = ['#ff4040','#ffd040','#40d0ff','#70f070','#ff80f0','#fff'][Math.floor(Math.random()*6)];
  for (let i = 0; i < 22; i++) {
    const a = (i/22)*Math.PI*2, sp = 90 + Math.random()*130;
    particles.push({ x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp - 40,
                     r: 3 + Math.random()*3, t: 0.6 + Math.random()*0.4, rot: 0, c, soft: true });
  }
  addScore(500, x, y);
  SFX.firework();
}

function enterRoom(key, back) {
  if (G.state !== 'play') return;
  /* この先で player を作り直すので、抱えたまま／口に入れたまま入ると
     元の面に戻ったときに置き去り（バネなら二度と使えない）になる。先に手放しておく */
  dropCarry(); releaseTongue();
  if (player.mouthObj) { player.mouthObj.held = false; player.mouthObj = null; }
  saveRoom = { lvl, enemies, items, fires, efires, boss, camx: cam.x, camy: cam.y, time: G.time,
               rows: ROWS, ground: GROUND_ROW, back };
  lvl = buildLevel(BONUS[key]);
  applyLevelGlobals();
  setBGM(BONUS[key].music);
  const power = player.power;
  player = makePlayer(power);
  player.x = 2*TILE; player.y = (GROUND_ROW - (power>0?2:1))*TILE - 4;
  enemies = []; items = []; fires = []; efires = []; particles = []; pops = []; bumps = [];
  boss = null; cam.x = 0; camFocusY = player.y + player.h;
  cam.y = clamp(camFocusY - VH*0.62, 0, Math.max(0, lvl.rows*TILE - VH));
  G.msgT = 1.2;
}
function exitRoom() {
  if (!saveRoom) return;
  const power = player.power, s = saveRoom;
  saveRoom = null;
  lvl = s.lvl; enemies = s.enemies; items = s.items; fires = s.fires; efires = s.efires;
  boss = s.boss; G.time = s.time;
  applyLevelGlobals();
  setBGM(lvl.def.music);
  player = makePlayer(power);
  if (s.back) {                       // つたから来た場合は元の場所へ戻す
    player.x = s.back.x; player.y = s.back.y;
  } else {
    const w = lvl.warps[0] || { x: 4, top: GROUND_ROW };
    player.x = (w.x + 2)*TILE + 4;
    player.y = (w.top - (power>0?2:1))*TILE - 4;
  }
  camFocusY = player.y + player.h;
  cam.x = clamp(player.x - VW*0.42, 0, lvl.w*TILE - VW);
  cam.y = clamp(camFocusY - VH*0.62, 0, Math.max(0, lvl.rows*TILE - VH));
  SFX.warp();
}

/* ============================================================================
   9. 敵・アイテム・弾・ギミック
   ============================================================================ */
function flipEnemy(e) {
  e.dead = 0.9; e.flip = true; e.vy = -420; e.vx = 60 * (Math.random() < 0.5 ? 1 : -1);
  addScore(200, e.x, e.y); SFX.kick();
}
function stompEnemy(e) {
  const p = player;
  const pts = [100, 200, 400, 800, 1000, 2000, 4000, 8000];
  if (p.combo >= pts.length) oneUp(); else addScore(pts[Math.min(p.combo, pts.length-1)], e.x, e.y);
  p.combo++;
  freeze(0.045); smoke(e.x + e.w/2, e.y + e.h/2);
}

function updateEnemies(dt) {
  for (const e of enemies) {
    if (e.dead) {
      e.dead -= dt;
      if (e.flip) { e.vy += GRAV*dt; e.y += e.vy*dt; e.x += e.vx*dt; }
      if (e.dead <= 0) e.remove = true;
      continue;
    }
    /* 消える予定の敵（食べられた・倒された）はもう当たり判定を持たない。
       これが無いと、飲み込んだ直後の1フレームで接触ダメージが起きる */
    if (e.remove) continue;
    /* ヨッシーの舌に吸い付いている敵：位置は updateTongue が持つ */
    if (e.grabbed) { e.anim += dt; continue; }
    /* 抱えられている甲羅：マリオの手元に追従し、当たった敵を倒す */
    if (e.carried) {
      const p = player;
      e.x = p.face > 0 ? p.x + p.w - 10 : p.x - e.w + 10;
      e.y = p.y + (p.power > 0 || p.yoshi ? 12 : 0);
      e.vx = 0; e.vy = 0; e.anim += dt;
      for (const o of enemies) {
        if (o === e || o.dead || o.remove || o.carried || o.type === 'piranha') continue;
        if (overlap(e, o)) flipEnemy(o);
      }
      if (boss && !boss.dead && overlap(e, boss)) { hurtBoss(2); e.remove = true; player.carry = null; }
      continue;
    }

    const near = Math.abs(e.x - (cam.x + VW/2)) <= VW*1.2;
    if (e.type !== 'piranha' && !near) continue;
    e.anim += dt;
    if (e.kickGrace > 0) e.kickGrace -= dt;   // 蹴った直後の甲羅では被弾しない
    if (e.stompT > 0) e.stompT -= dt;         // 踏んだ直後は、抜けきるまで蹴り出さない

    if (e.type === 'piranha') {
      e.ph += dt*0.8;
      const cycle = (Math.sin(e.ph) + 1)/2;
      /* マリオが土管に触れている間は「引っ込んでいれば出てこない」だけにする。
         上に乗っているときも横に立っているときも顔を出さないので、土管づたいに歩ける。
         すでに顔を出している最中はそのまま伸び続けるので、飛び越えると当たる */
      const onPipe = Math.abs((player.x + player.w/2) - (e.x + e.w/2)) < 52;
      if (onPipe && e.out <= 0.03) e.hold = true;
      else if (!onPipe && cycle <= 0.03) e.hold = false;
      e.out = e.hold ? 0 : cycle;
      e.y = e.top - e.h*e.out;
      /* ファイアパックン：伸びきったところでマリオへ火を吐く */
      if (e.fire) {
        if (e.spit > 0) e.spit -= dt;
        e.fireT -= dt;
        if (e.fireT <= 0 && e.out > 0.8 && near && !player.dead && G.state === 'play') {
          e.fireT = 2.4 + Math.random()*0.8; e.spit = 0.4;
          const mx = e.x + e.w/2, my = e.y + 10;
          const dx = (player.x + player.w/2) - mx, dy = (player.y + player.h/2) - my;
          const d = Math.hypot(dx, dy) || 1;
          efires.push({ x: mx - 10, y: my - 7, w:20, h:14, vx: dx/d*210, vy: dy/d*210, t: 4, anim: 0 });
          SFX.fire();
        }
      }
      if (e.out > 0.25 && overlap(player, { x: e.x - 5, y: e.y, w: e.w + 10, h: e.h*e.out })) {
        if (player.star > 0) { e.dead = 0.5; addScore(200, e.x, e.y); SFX.kick(); } else damagePlayer();
      }
      continue;
    }

    if (e.type === 'para') {
      e.ph += dt;
      e.y = e.base + Math.sin(e.ph*1.6)*62;
      e.x += e.dir*34*dt;
      const ahead = Math.floor((e.x + (e.dir > 0 ? e.w + 4 : -4))/TILE);
      if (solidAt(ahead, Math.floor((e.y + e.h/2)/TILE))) e.dir *= -1;
      if (e.x < 0 || e.x > lvl.w*TILE - e.w) e.dir *= -1;
    }
    else if (e.type === 'cheep') {
      e.ph += dt;
      e.y = e.base + Math.sin(e.ph*1.2)*46;
      e.x += e.dir*70*dt;
      const ahead = Math.floor((e.x + (e.dir > 0 ? e.w + 4 : -4))/TILE);
      if (solidAt(ahead, Math.floor((e.y + e.h/2)/TILE))) e.dir *= -1;
      if (e.x < 0 || e.x > lvl.w*TILE - e.w) e.dir *= -1;
    }
    else if (e.type === 'ghost') {
      /* 白い幽霊。見られている間は止まって顔を隠し、目を離すと壁をすり抜けて追ってくる */
      const pc = player.x + player.w/2, ec = e.x + e.w/2;
      const looked = !player.dead && ((player.face > 0 && ec >= pc) || (player.face < 0 && ec <= pc));
      e.shy = approach(e.shy, looked ? 1 : 0, dt, 0.004);
      if (looked) { e.vx = approach(e.vx, 0, dt, 0.0004); e.vy = approach(e.vy, 0, dt, 0.0004); }
      else {
        const dx = pc - ec, dy = (player.y + player.h/2) - (e.y + e.h/2);
        const d = Math.hypot(dx, dy) || 1;
        e.vx = approach(e.vx, dx/d*72, dt, 0.01);
        e.vy = approach(e.vy, dy/d*72, dt, 0.01);
      }
      e.ph += dt;
      e.x += e.vx*dt;
      e.y += e.vy*dt + Math.sin(e.ph*2)*8*dt;
      if (e.vx) e.dir = e.vx < 0 ? -1 : 1;
    }
    else if (e.type === 'hammer') {
      e.vy += GRAV*dt;
      if (e.vy > MAXFALL) e.vy = MAXFALL;
      e.dir = player.x < e.x ? -1 : 1;
      e.vx = Math.sin(e.anim*1.2) * 40;
      moveEntity(e, dt);
      e.jumpT -= dt;
      if (e.jumpT <= 0 && e.onGround) { e.vy = -560; e.jumpT = 2.4 + Math.random()*2; }
      e.throwT -= dt;
      if (e.throwT <= 0 && near) {
        e.throwT = 1.3 + Math.random()*0.9;
        efires.push({ x: e.x + 8, y: e.y - 6, w: 18, h: 18, vx: e.dir*210, vy: -320, t: 4, anim: 0, hammer: true });
      }
    }
    else {
      if (e.type === 'koopa' && e.shell > 0) {
        e.shell -= dt;
        e.vx = e.kick ? e.kick*300 : 0;
        if (e.shell <= 0 && !e.kick) { e.shell = 0; e.h = 40; e.y -= 14; e.vx = e.dir*46; }
      } else e.vx = e.dir * (e.type === 'goomba' ? 52 : 46);

      e.vy += gravOf()*dt;
      if (e.vy > maxFallOf()) e.vy = maxFallOf();
      moveEntity(e, dt);
      /* 甲羅の体当たり：ブロックを壊せたら止まらずそのまま進む */
      if (e.bumpedWall && e.kick && e.type === 'koopa' && shellSmash(e)) {
        e.bumpedWall = false; e.vx = e.kick*300; e.x += e.kick*2;
      }
      if (e.bumpedWall) { e.dir *= -1; if (e.kick) e.kick *= -1; }

      if (e.kick) {
        for (const o of enemies) {
          if (o === e || o.dead || o.remove || o.type === 'piranha') continue;
          if (overlap(e, o)) { flipEnemy(o); o.vx = e.kick*120; }
        }
        if (boss && !boss.dead && overlap(e, boss)) { hurtBoss(2); e.remove = true; }
      }
      for (const pl of lvl.plats) {
        if (e.vy >= 0 && e.x + e.w > pl.x && e.x < pl.x + pl.w &&
            e.prevBottom <= pl.y + 6 && e.y + e.h >= pl.y && e.y + e.h <= pl.y + pl.h + 8) {
          e.y = pl.y - e.h; e.vy = 0; e.onGround = true; e.x += pl.dx; e.y += pl.dy;
        }
      }
      if (e.type === 'koopa' && e.onGround && !e.kick) {
        const ahead = Math.floor((e.x + (e.dir > 0 ? e.w + 4 : -4))/TILE);
        const below = Math.floor((e.y + e.h + 4)/TILE);
        if (!solidAt(ahead, below) && tileAt(ahead, below) !== '=') e.dir *= -1;
      }

      /* 敵同士の当たり判定。
         2匹並んで歩いていて先頭が倒されると、後続がその当たり判定にぶつかって向きを変える */
      if (!e.kick) {
        for (const o of enemies) {
          if (o === e || o.remove || o.flip || o.kick) continue;
          if (o.type !== 'goomba' && o.type !== 'koopa') continue;
          if (!overlap(e, o)) continue;
          const dx = (o.x + o.w/2) - (e.x + e.w/2);
          if (dx === 0 || Math.sign(dx) !== e.dir) continue;   // 進行方向にいる相手だけ
          e.dir *= -1; e.vx = e.dir * Math.abs(e.vx);
          e.x -= Math.sign(dx) * 2;                            // めり込みを少し戻す
          // 正面衝突なら相手も向きを変える（同じ向きに歩いている相手はそのまま）
          if (!o.dead && o.dir === -Math.sign(dx)) { o.dir *= -1; o.vx = o.dir * Math.abs(o.vx); }
          break;
        }
      }
    }

    if (e.y > lvl.rows*TILE + 100) e.remove = true;

    const p = player;
    if (!p.dead && G.state === 'play' && p.warpT <= 0 && overlap(p, e)) {
      /* 舌を出している最中に触れた敵は、ダメージではなく吸い込みにする */
      if (p.yoshi && p.tongue > 0 && !p.tongueGrab && grabWithTongue(e)) continue;
      if (p.star > 0) flipEnemy(e);
      else {
        const stompMargin = (e.type === 'koopa' && e.shell <= 0) ? 32 : 24;
        const stomping = p.vy > 0 && (p.y + p.h) - e.y < stompMargin && !lvl.water;
        if (stomping) {
          if (e.type === 'goomba' || e.type === 'para' || e.type === 'cheep' || e.type === 'hammer' || e.type === 'ghost') {
            if (e.type === 'para') {
              /* 羽つきは踏まれた瞬間に消し、同じ位置に羽なしを出す。
                 潰れ絵を残すと羽つきと羽なしが並んで見えてしまう */
              const k = spawnEnemy('koopa', e.x, e.y + e.h - 40);
              k.dir = e.dir; k.vx = e.dir*46; k.vy = 0;
              enemies.push(k);
              e.remove = true; e.dead = 0;
              wingsOff(e);
              stompEnemy(e);
            }
            else {
              e.dead = 0.5; e.squash = true; e.vx = 0;
              stompEnemy(e);
            }
          } else if (e.shell > 0) {
            /* 甲羅は踏むとその場で止まり、加点はコンボとして伸びていく。
               転がしたまま／外へ蹴り出すと甲羅が逃げてしまい踏み続けられないので、
               階段の角などで踏み続けられるように「踏む＝足元で止める」にしてある。
               蹴り出したいときは横から触れるか、ダッシュキーで持ち上げて投げる */
            e.kick = 0; e.vx = 0; e.shell = 6; e.kickGrace = 0.35; e.stompT = 0.3;
            SFX.kick(); stompEnemy(e);
          } else { e.shell = 6; e.kick = 0; e.h = 26; e.y += 14; e.vx = 0; stompEnemy(e); }
          p.vy = keys.jump ? -620 : -420; p.jumping = true; p.squash = -0.2;
          SFX.stomp();
        } else if (e.type === 'koopa' && e.shell > 0 && !e.kick) {
          if (e.stompT > 0) { /* 踏んだ直後、体が甲羅から抜けきるまでは何もしない */ }
          else if (keys.run && !p.carry && !p.yoshi) {
            // マリオ3ふうの持ち上げ：ダッシュキーを押しながら触れると抱える
            e.carried = true; p.carry = e;
            tone(760, 0.07, 'square', 0.04, 420);
          } else {
            // 停止した甲羅は横から触れてもダメージなし。蹴り出すだけ
            e.kick = p.x + p.w/2 < e.x + e.w/2 ? 1 : -1; e.shell = 99; e.kickGrace = 0.35; SFX.kick();
          }
        } else if (!(e.kick && e.kickGrace > 0) && overlap(p, hurtBox(e))) damagePlayer();
      }
    }
  }
  enemies = enemies.filter(e => !e.remove);
}

/* --- バネ ---
   置いてあるだけの仕掛けではなく、甲羅と同じように抱えて運べる。
   抱えている間・ヨッシーの舌や口の中にある間は物理を止めて、跳ね返しの判定も切る */
function updateSprings(dt) {
  const p = player;
  for (const s of lvl.springs) {
    if (s.c > 0) s.c -= dt;
    if (s.held || s.grabbed) continue;              // 口の中／舌の先。位置は持ち主が決める
    if (s.kickGrace > 0) s.kickGrace -= dt;
    if (s.carried) {
      s.x = p.face > 0 ? p.x + p.w - 8 : p.x - s.w + 8;
      s.y = p.y + (p.power > 0 || p.yoshi ? 6 : -6);
      s.vx = 0; s.vy = 0;
      continue;
    }
    s.vy += gravOf()*dt;
    if (s.vy > maxFallOf()) s.vy = maxFallOf();
    moveEntity(s, dt);
    if (s.bumpedWall) s.vx = 0;
    if (s.onGround) s.vx *= Math.pow(0.02, dt);     // 着地したらすぐ止まる
    if (Math.abs(s.vx) < 6) s.vx = 0;
    if (s.y > lvl.rows*TILE + 80) { s.x = -9999; s.vx = 0; s.vy = 0; }   // 落ちたら画面外へ退避
  }
}

function updateGimmicks(dt) {
  /* つたの成長 */
  for (const v of lvl.vines) if (v.h < v.maxH) v.h = Math.min(v.maxH, v.h + 130*dt);

  /* 動く床 */
  for (const pl of lvl.plats) {
    pl.ph += dt*pl.spd*Math.PI*2;
    const o = Math.sin(pl.ph)*pl.range;
    const nx = pl.bx + (pl.ax === 'x' ? o : 0), ny = pl.by + (pl.ax === 'y' ? o : 0);
    pl.dx = nx - pl.x; pl.dy = ny - pl.y; pl.x = nx; pl.y = ny;
  }

  /* 大砲 */
  for (const c of lvl.cannons) {
    if (Math.abs(c.cx*TILE - (cam.x + VW/2)) > VW) continue;
    c.t -= dt;
    if (c.t <= 0) {
      c.t = 2.2 + Math.random()*1.6;
      const dir = player.x < c.cx*TILE ? -1 : 1;
      efires.push({ x: c.cx*TILE, y: c.cy*TILE + 4, w: 22, h: 20, vx: dir*190, vy: 0, t: 6, bullet: true, anim: 0 });
    }
  }

  /* 点滅足場 */
  for (const b of lvl.blinks) {
    const on = ((G.t*0.5 + b.ph) % 1) < 0.62;
    if (b.on === on) continue;
    b.on = on;
    for (let i = 0; i < b.n; i++) {
      const cur = lvl.grid[b.y][b.x + i];
      if (on) { if (cur === ',') lvl.grid[b.y][b.x+i] = '~'; }
      else if (cur === '~') lvl.grid[b.y][b.x+i] = ',';
    }
  }

  /* ファイアバー */
  for (const f of lvl.firebars) {
    f.ph += dt*f.spd;
    if (Math.abs(f.cx*TILE - (cam.x + VW/2)) > VW) continue;
    if (G.state !== 'play' || player.star > 0 || player.warpT > 0) continue;
    for (let i = 1; i <= f.len; i++) {
      const bx = f.cx*TILE + 16 + Math.cos(f.ph)*i*24;
      const by = f.cy*TILE + 16 + Math.sin(f.ph)*i*24;
      if (overlap(player, { x: bx-9, y: by-9, w: 18, h: 18 })) { damagePlayer(); break; }
    }
  }

  /* ドッスン */
  for (const d of lvl.dossuns) {
    if (Math.abs(d.x - (cam.x + VW/2)) > VW) continue;
    if (d.st === 'wait') {
      const px = player.x + player.w/2;
      if (px > d.x - 40 && px < d.x + d.w + 40 && player.y > d.y) { d.st = 'fall'; d.vy = 0; }
    } else if (d.st === 'fall') {
      d.vy += 2400*dt; d.y += d.vy*dt;
      const cy = Math.floor((d.y + d.h)/TILE);
      let hitGround = false;
      for (let cx = Math.floor(d.x/TILE); cx <= Math.floor((d.x + d.w - 1)/TILE); cx++)
        if (solidAt(cx, cy)) hitGround = true;
      if (hitGround || d.y + d.h > lvl.rows*TILE) {
        d.y = Math.floor((d.y + d.h)/TILE)*TILE - d.h;
        d.st = 'rest'; d.t = 0.9; G.shake = 0.25; SFX.thud(); freeze(0.05);
        dust(d.x + 6, d.y + d.h, 5); dust(d.x + d.w - 6, d.y + d.h, 5);
      }
    } else if (d.st === 'rest') {
      d.t -= dt; if (d.t <= 0) d.st = 'rise';
    } else {
      d.y -= 90*dt;
      if (d.y <= d.by) { d.y = d.by; d.st = 'wait'; }
    }
    /* 上面には乗れる。ダメージ判定は頭上を除いた部分だけ */
    const p = player;
    if (G.state === 'play' && p.warpT <= 0 && p.vy >= 0 &&
        p.x + p.w > d.x + 2 && p.x < d.x + d.w - 2 &&
        p.prevBottom <= d.y + 8 && p.y + p.h >= d.y && p.y + p.h <= d.y + 18) {
      p.y = d.y - p.h; p.vy = 0; p.onGround = true; p.coyote = 0.1;
    }
    const hurt = { x: d.x + 2, y: d.y + 14, w: d.w - 4, h: d.h - 14 };
    if (G.state === 'play' && p.star <= 0 && p.warpT <= 0 && overlap(p, hurt)) damagePlayer();
  }
}

function updateFires(dt) {
  for (const f of fires) {
    f.t -= dt; f.anim += dt;
    f.vy += (lvl.water ? 400 : 1500)*dt;
    f.x += f.vx*dt; f.y += f.vy*dt;
    const cx = Math.floor((f.x + (f.vx > 0 ? f.w : 0))/TILE);
    if (solidAt(cx, Math.floor((f.y + f.h/2)/TILE))) f.t = 0;
    const cy = Math.floor((f.y + f.h)/TILE);
    if (solidAt(Math.floor((f.x + f.w/2)/TILE), cy)) { f.y = cy*TILE - f.h; f.vy = -420; }
    if (f.t <= 0 || f.y > lvl.rows*TILE + 40) {
      f.remove = true;
      for (let i = 0; i < 4; i++) particles.push({ x: f.x, y: f.y, vx:(Math.random()-0.5)*160,
        vy:-Math.random()*160, r:5, t:0.3, rot:0, c:'#ff9020' });
      continue;
    }
    for (const e of enemies) {
      if (e.dead || e.remove) continue;
      if (overlap(f, e)) {
        if (e.type === 'piranha') { if (e.out > 0.2) { e.dead = 0.5; addScore(200, e.x, e.y); f.remove = true; SFX.kick(); } }
        else { flipEnemy(e); f.remove = true; }
        break;
      }
    }
    if (!f.remove && boss && !boss.dead && overlap(f, boss)) { hurtBoss(1); f.remove = true; }
  }
  fires = fires.filter(f => !f.remove);

  for (const f of efires) {
    f.t -= dt; f.anim += dt;
    if (f.hammer) f.vy += 900*dt;
    f.x += f.vx*dt; f.y += f.vy*dt;
    if (f.t <= 0 || f.x < cam.x - 120 || f.x > cam.x + VW + 120 || f.y > lvl.rows*TILE + 40) { f.remove = true; continue; }
    if (G.state === 'play' && player.warpT <= 0 && overlap(f, player)) {
      const p = player;
      /* 黒いミサイル（大砲の弾）は上から踏んで壊せる。踏み台にもなる */
      const stomping = f.bullet && !p.dead && p.vy > 0 && (p.y + p.h) - f.y < 26 && !lvl.water;
      if (p.star > 0) { f.remove = true; addScore(200, f.x, f.y); SFX.kick(); }
      else if (stomping) {
        f.remove = true;
        stompEnemy(f);
        smoke(f.x + f.w/2, f.y + f.h/2);
        p.vy = keys.jump ? -620 : -420; p.jumping = true; p.squash = -0.2;
        SFX.stomp();
      }
      else { damagePlayer(); f.remove = true; }
    }
  }
  efires = efires.filter(f => !f.remove);
}

function updateItems(dt) {
  for (const it of items) {
    it.ph += dt;
    if (it.birth > 0) {
      it.birth -= dt; it.y -= 69*dt;
      if (it.birth <= 0 && it.riseTo != null) { it.y = it.riseTo; it.vy = 0; }
      continue;
    }
    if (it.type === 'coin') {
      /* 跳ねて転がり、その場に散らばったまま止まる（拾うのはプレイヤー任せ） */
      it.vy += gravOf()*dt;
      const fall = it.vy, vx0 = it.vx;
      moveEntity(it, dt);
      // collideX は vx を 0 にするので、ぶつかる直前の向きを見て跳ね返す
      if (it.bumpedWall) it.vx = -vx0*0.7;
      if (it.onGround) {
        if (fall > 150 && it.bounces > 0) { it.bounces--; it.vy = -fall*0.5; it.y -= 1; }
        it.vx *= Math.pow(0.2, dt);         // 少し転がってから止まる
        if (Math.abs(it.vx) < 5) it.vx = 0;
      }
    }
    else if (it.type === 'yoshi') {
      /* 乗られるまでその場をうろうろ。ダメージで逃げ出した直後は乗れないが、
         落ち着けばまたその場に残るので、追いかければ乗り直せる */
      it.vy += gravOf()*dt;
      if (it.flee > 0) { it.flee -= dt; if (it.flee <= 0) { it.flee = 0; it.vx = it.vx > 0 ? 40 : -40; } }
      const vx0 = it.vx;
      moveEntity(it, dt);
      if (it.bumpedWall) it.vx = -Math.sign(vx0 || 1) * Math.max(40, Math.abs(vx0));
      if (it.onGround && !it.flee) {
        const ahead = Math.floor((it.x + (it.vx > 0 ? it.w + 4 : -4))/TILE);
        const below = Math.floor((it.y + it.h + 4)/TILE);
        if (!solidAt(ahead, below) && tileAt(ahead, below) !== '=') it.vx *= -1;
      }
      if (it.vx === 0) it.vx = 40;
    }
    else if (it.type === 'flower') { it.vx = 0; it.vy = 0; }
    else {
      it.vy += gravOf()*dt;
      const vx0 = it.vx;
      moveEntity(it, dt);
      // 壁にぶつかったら向きを反転（collideX が vx を 0 にするため直前の向きを使う）
      if (it.bumpedWall) it.vx = -Math.sign(vx0 || 1) * (it.spd || 60);
      else if (it.vx === 0) it.vx = it.spd || 60;
      if (it.type === 'star' && it.onGround) it.vy = -520;
    }
    if (it.y > lvl.rows*TILE + 60) it.remove = true;
    // コインは拾い判定を少しだけ広く取る
    const box = it.type === 'coin' ? { x: it.x - 4, y: it.y - 4, w: it.w + 8, h: it.h + 8 } : it;
    if (overlap(player, box)) {
      if (it.type === 'yoshi') {
        if (it.flee > 0 || player.yoshi || player.warpT > 0) continue;
        it.remove = true; mountYoshi();
        continue;
      }
      it.remove = true;
      if (it.type === 'coin') {
        addCoin(); SFX.coin(); addPop(it.x, it.y - 8, '200', '#ffd040');
        particles.push({ x: it.x + 8, y: it.y, vx:0, vy:-260, r:6, t:0.35, coin:true, rot:0 });
        continue;
      }
      addScore(1000, it.x, it.y);
      if (it.type === 'mush') {
        if (player.power === 0) { player.power = 1; growBody(); player.growT = 0.45; }
        SFX.grow();
      } else if (it.type === 'flower') {
        if (player.power === 0) { player.power = 2; growBody(); } else player.power = 2;
        player.growT = 0.45; SFX.grow();
      } else if (it.type === 'star') {
        player.star = 11; setBGM('starm'); SFX.star();
        addPop(it.x, it.y - 16, 'INVINCIBLE!', '#ffe45c');
      } else if (it.type === '1up') oneUp();
    }
  }
  items = items.filter(i => !i.remove);
}

/* --- ボス（HP半分で第2形態） --- */
function hurtBoss(n) {
  if (!boss || boss.dead || boss.hurt > 0) return;
  boss.hp -= n; boss.hurt = 0.8;
  G.shake = 0.25; freeze(0.06); SFX.hitboss();
  if (boss.hp <= boss.maxhp/2 && !boss.rage) {
    boss.rage = true;
    addPop(boss.x, boss.y - 30, 'ENRAGED!', '#ff6060');
    G.shake = 0.5;
  }
  if (boss.hp <= 0) {
    boss.dead = 2.0; boss.vy = -300; boss.vx = 0;
    addScore(5000, boss.x, boss.y); SFX.boom(); G.shake = 0.6;
    setTimeout(() => { if (G.state === 'play') {
      G.state = 'clear'; G.timer = 0; G.fwLeft = 0; G.clearEnd = null; SFX.clear();
    } }, 1200);
  }
}
function updateBoss(dt) {
  if (!boss) return;
  const b = boss;
  b.anim += dt;
  if (b.dead) { b.dead -= dt; b.vy += GRAV*0.5*dt; b.y += b.vy*dt; b.x += Math.sin(b.anim*20)*2; return; }
  if (b.hurt > 0) b.hurt -= dt;
  if (Math.abs(b.x - (cam.x + VW/2)) > VW) return;

  const spd = b.rage ? 90 : 55;
  b.vy += GRAV*dt;
  if (b.vy > MAXFALL) b.vy = MAXFALL;
  b.vx = b.dir*spd;
  moveEntity(b, dt);
  if (b.bumpedWall || b.x < b.left || b.x > b.right) { b.dir *= -1; b.x = clamp(b.x, b.left, b.right); }

  b.jumpT -= dt;
  if (b.jumpT <= 0 && b.onGround) { b.vy = -620; b.jumpT = (b.rage ? 1.3 : 2.2) + Math.random(); }
  if (b.onGround && b.wasAir) { G.shake = 0.25; SFX.thud(); }
  b.wasAir = !b.onGround;

  b.fireT -= dt;
  if (b.fireT <= 0) {
    b.fireT = (b.rage ? 1.0 : 1.6) + Math.random()*1.2;
    const dir = player.x < b.x ? -1 : 1;
    b.dir = dir;
    const n = b.rage ? 3 : 2;
    for (let i = 0; i < n; i++)
      efires.push({ x: b.x + (dir > 0 ? b.w : -18), y: b.y + 14 + i*12, w: 20, h: 16,
                    vx: dir*(230 + i*40), vy: -40 + i*50, t: 4, anim: 0 });
    SFX.fire();
  }

  const p = player;
  if (G.state === 'play' && !p.dead && p.warpT <= 0 && overlap(p, b)) {
    const stomping = p.vy > 0 && (p.y + p.h) - b.y < 34;
    if (p.star > 0) hurtBoss(3);
    /* ひるんで点滅している間は当たっても無害。
       踏んだ直後の数フレームはまだ重なったままで、しかも跳ね上がって vy がマイナスなので、
       ここで通さないと「側面に触れた」扱いになって踏むたびにパワーダウンしてしまう */
    else if (b.hurt > 0) { if (stomping) { p.vy = -560; p.jumping = true; } }
    else if (stomping) { hurtBoss(1); p.vy = -560; p.jumping = true; p.squash = -0.2; }
    else damagePlayer();
  }
}

function updateFx(dt) {
  for (const p of particles) {
    if (!p.soft) p.vy += 1800*dt; else p.vy += 260*dt;
    p.x += p.vx*dt; p.y += p.vy*dt; p.rot += dt*8; p.t -= dt;
  }
  particles = particles.filter(p => p.t > 0);
  for (const p of pops) { p.y -= 40*dt; p.t -= dt*1.3; }
  pops = pops.filter(p => p.t > 0);
  for (const b of bumps) b.t -= dt;
  bumps = bumps.filter(b => b.t > 0);
  if (G.shake > 0) G.shake -= dt;
}

/* --- カメラ ---
   ・横は先読みを入れない（向きを変えたり止まったりするたびに戻る動きが出るため）
   ・縦は接地している高さだけを追い、ジャンプ中は上下のデッドゾーンを出るまで動かさない */
const CAM_UP = 210, CAM_DOWN = 170;
/* ボーナスルームだけカメラを右端の手前で止めておき、
   画面から抜けたあともしばらく歩ける「のりしろ」を作る（自動スクロール面は除く） */
const ROOM_PAD = 96;
const camPad = () => (lvl.room && !lvl.scroll) ? ROOM_PAD : 0;
function camFocus(p) { return p.y + p.h; }
function updateCamera(dt, snap) {
  const p = player;
  const feet = camFocus(p);
  if (snap) camFocusY = feet;
  else if (p.onGround || lvl.water) camFocusY = feet;
  else if (feet < camFocusY - CAM_UP) camFocusY = feet + CAM_UP;
  else if (feet > camFocusY + CAM_DOWN) camFocusY = feet - CAM_DOWN;

  const maxX = Math.max(0, lvl.w*TILE - VW - camPad());
  const tx = clamp(p.x + p.w/2 - VW/2, 0, maxX);
  const maxY = Math.max(0, lvl.rows*TILE - VH);
  const ty = clamp(camFocusY - VH*0.62, 0, maxY);
  if (lvl.scroll) {                       // 自動スクロール面（横は勝手に進む）
    if (!snap && G.state === 'play') cam.x = Math.min(maxX, cam.x + lvl.scroll*dt);
    cam.y = snap ? ty : approach(cam.y, ty, dt, 0.004);
    return;
  }
  if (snap) { cam.x = tx; cam.y = ty; }
  else {
    cam.x = approach(cam.x, tx, dt, 0.0009);
    cam.y = approach(cam.y, ty, dt, 0.004);
  }
}

/* ============================================================================
   10. 進行フロー
   ============================================================================ */
function startStage(i, power) {
  ac();
  G.levelIndex = i; checkpoint = null; saveRoom = null;
  loadLevel(i, power|0, false);
  G.state = 'play';
}
function finishStage() {
  const i = G.levelIndex, s = stageSave(i);
  const wasCleared = s.cleared;        // 今回より前にクリア済みだったか
  s.cleared = true;
  for (let k = 0; k < 3; k++) if (G.gotCoins[k]) s.coins[k] = true;
  const t = Math.floor(G.stageTime);
  if (s.time == null || t < s.time) s.time = t;
  if (G.score > save.best) save.best = G.score;
  writeSave();
  G.cursor = Math.min(LEVELS.length - 1, i + 1);
  const allCleared = save.stages.filter(x => x && x.cleared).length >= LEVELS.length;
  if (i >= LEVELS.length - 1) {
    // 最終ステージだけマップへ戻る（初めての全クリアだけエンディング）

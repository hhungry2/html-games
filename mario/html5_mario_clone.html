<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Canvas Action</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4F46E5;
            --secondary: #10B981;
            --danger: #EF4444;
            --dark: #1F2937;
            --light: #F3F4F6;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            color: var(--light);
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        #game-container {
            position: relative;
            width: 800px;
            height: 600px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border-radius: 12px;
            overflow: hidden;
            background: linear-gradient(180deg, #3b82f6 0%, #60a5fa 50%, #93c5fd 100%);
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
        }
        .hud {
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            font-size: 24px;
            font-weight: 900;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.3);
            color: white;
            z-index: 10;
        }
        .hud-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .hud-label {
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #fbbf24;
        }
        
        /* Overlays */
        .overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 20;
        }
        .overlay.active {
            opacity: 1;
        }
        .overlay h1 {
            font-size: 64px;
            margin: 0 0 20px 0;
            background: linear-gradient(to right, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .overlay p {
            font-size: 18px;
            color: #94a3b8;
            margin-bottom: 40px;
            text-align: center;
            max-width: 80%;
        }
        .btn {
            background: linear-gradient(135deg, var(--primary), #818cf8);
            border: none;
            color: white;
            padding: 16px 40px;
            font-size: 20px;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.4);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 20px 25px -5px rgba(79, 70, 229, 0.5);
        }
        .btn:active {
            transform: translateY(1px);
        }
        
        .controls-hint {
            margin-top: 30px;
            display: flex;
            gap: 20px;
            color: #64748b;
            font-size: 14px;
            font-weight: 700;
        }
        .key {
            background: rgba(255,255,255,0.1);
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.2);
            color: #e2e8f0;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    
    <div class="ui-layer">
        <div class="hud" id="hud" style="display: none;">
            <div class="hud-item">
                <span class="hud-label">Score</span>
                <span id="scoreDisplay">000000</span>
            </div>
            <div class="hud-item">
                <span class="hud-label">Coins</span>
                <span id="coinsDisplay">x 00</span>
            </div>
            <div class="hud-item">
                <span class="hud-label">Time</span>
                <span id="timeDisplay">400</span>
            </div>
        </div>
        
        <!-- Start Screen -->
        <div class="overlay active" id="startScreen">
            <h1>Super Canvas<br>Action</h1>
            <p>HTML5 Canvasで作られたモダンでスムーズな横スクロールアクションゲーム。</p>
            <button class="btn" id="startBtn">Play Game</button>
            <div class="controls-hint">
                <span><span class="key">←</span> <span class="key">→</span> Move</span>
                <span><span class="key">Space</span> / <span class="key">↑</span> Jump</span>
            </div>
        </div>
        
        <!-- Game Over Screen -->
        <div class="overlay" id="gameOverScreen" style="display: none;">
            <h1 style="background: linear-gradient(to right, #f87171, #ef4444); -webkit-background-clip: text;">Game Over</h1>
            <p>スコア: <span id="finalScore1">0</span></p>
            <button class="btn" id="restartBtn1" style="background: linear-gradient(135deg, #ef4444, #b91c1c);">Try Again</button>
        </div>

        <!-- Win Screen -->
        <div class="overlay" id="winScreen" style="display: none;">
            <h1 style="background: linear-gradient(to right, #34d399, #10b981); -webkit-background-clip: text;">Stage Clear!</h1>
            <p>おめでとうございます！<br>スコア: <span id="finalScore2">0</span></p>
            <button class="btn" id="restartBtn2" style="background: linear-gradient(135deg, #10b981, #059669);">Play Again</button>
        </div>
    </div>
</div>

<script>
/**
 * Game Engine & Core Configuration
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });

const CONFIG = {
    FPS: 60,
    TILE_SIZE: 40,
    GRAVITY: 0.8,
    FRICTION: 0.85,
    MAX_SPEED: 7,
    ACCELERATION: 1.2,
    JUMP_FORCE: 16,
    MAX_FALL_SPEED: 15,
    WIDTH: canvas.width,
    HEIGHT: canvas.height,
    GAME_TIME: 400
};

// Input Handling
const keys = {
    left: false,
    right: false,
    up: false,
    down: false,
    jump: false
};

window.addEventListener('keydown', (e) => {
    switch(e.code) {
        case 'ArrowLeft': case 'KeyA': keys.left = true; break;
        case 'ArrowRight': case 'KeyD': keys.right = true; break;
        case 'ArrowUp': case 'KeyW': keys.up = true; break;
        case 'ArrowDown': case 'KeyS': keys.down = true; break;
        case 'Space': keys.jump = true; break;
    }
});

window.addEventListener('keyup', (e) => {
    switch(e.code) {
        case 'ArrowLeft': case 'KeyA': keys.left = false; break;
        case 'ArrowRight': case 'KeyD': keys.right = false; break;
        case 'ArrowUp': case 'KeyW': keys.up = false; break;
        case 'ArrowDown': case 'KeyS': keys.down = false; break;
        case 'Space': keys.jump = false; break;
    }
});

function checkCollision(rect1, rect2) {
    return (
        rect1.x < rect2.x + rect2.width &&
        rect1.x + rect1.width > rect2.x &&
        rect1.y < rect2.y + rect2.height &&
        rect1.y + rect1.height > rect2.y
    );
}

function drawRoundedRect(ctx, x, y, width, height, radius, fillStyle, strokeStyle) {
    ctx.beginPath();
    ctx.moveTo(x + radius, y);
    ctx.lineTo(x + width - radius, y);
    ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
    ctx.lineTo(x + width, y + height - radius);
    ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
    ctx.lineTo(x + radius, y + height);
    ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
    ctx.lineTo(x, y + radius);
    ctx.quadraticCurveTo(x, y, x + radius, y);
    ctx.closePath();
    if (fillStyle) {
        ctx.fillStyle = fillStyle;
        ctx.fill();
    }
    if (strokeStyle) {
        ctx.strokeStyle = strokeStyle;
        ctx.stroke();
    }
}

class Camera {
    constructor() {
        this.x = 0;
        this.y = 0;
        this.minX = 0;
        this.maxX = 10000;
    }
    update(target) {
        let targetX = target.x + target.width / 2 - CONFIG.WIDTH / 2;
        this.x += (targetX - this.x) * 0.1;
        this.x = Math.max(this.minX, Math.min(this.x, this.maxX - CONFIG.WIDTH));
    }
}

class Particle {
    constructor(x, y, color, type = 'normal') {
        this.x = x;
        this.y = y;
        this.vx = (Math.random() - 0.5) * 10;
        this.vy = (Math.random() - 0.5) * 10 - 5;
        this.life = 1;
        this.decay = Math.random() * 0.02 + 0.02;
        this.color = color;
        this.size = Math.random() * 8 + 4;
        this.type = type;
        this.text = "";
        
        if (type === 'coin') {
            this.vy = -12;
            this.vx = 0;
            this.decay = 0.04;
            this.size = 15;
            this.color = '#fbbf24';
        }
    }
    update() {
        this.vy += CONFIG.GRAVITY * 0.5;
        this.x += this.vx;
        this.y += this.vy;
        this.life -= this.decay;
        return this.life > 0;
    }
    draw(ctx, camX) {
        ctx.globalAlpha = Math.max(0, this.life);
        if (this.type === 'score') {
            ctx.fillStyle = this.color;
            ctx.font = "bold 20px Inter";
            ctx.fillText(this.text, this.x - camX, this.y);
        } else if (this.type === 'coin') {
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(this.x - camX, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#f59e0b';
            ctx.lineWidth = 2;
            ctx.stroke();
        } else {
            ctx.fillStyle = this.color;
            ctx.fillRect(this.x - camX - this.size/2, this.y - this.size/2, this.size, this.size);
        }
        ctx.globalAlpha = 1;
    }
}

class Entity {
    constructor(x, y, width, height) {
        this.x = x;
        this.y = y;
        this.width = width;
        this.height = height;
        this.vx = 0;
        this.vy = 0;
        this.grounded = false;
        this.dead = false;
        this.facingRight = true;
    }
    applyPhysics() {
        this.vy += CONFIG.GRAVITY;
        if (this.vy > CONFIG.MAX_FALL_SPEED) this.vy = CONFIG.MAX_FALL_SPEED;
        this.vx *= CONFIG.FRICTION;
        if (Math.abs(this.vx) < 0.1) this.vx = 0;
    }
}

class Player extends Entity {
    constructor(x, y) {
        super(x, y, 32, 40);
        this.color = '#ef4444';
        this.jumpTimer = 0;
        this.isBig = false;
        this.invulnerableTimer = 0;
        this.score = 0;
        this.coins = 0;
        this.won = false;
        this.walkCycle = 0;
        this.state = 'idle';
    }

    update(map) {
        if (this.dead) {
            this.vy += CONFIG.GRAVITY;
            this.y += this.vy;
            return;
        }
        if (this.invulnerableTimer > 0) this.invulnerableTimer--;

        if (!this.won) {
            if (keys.left) {
                this.vx -= CONFIG.ACCELERATION;
                this.facingRight = false;
            }
            if (keys.right) {
                this.vx += CONFIG.ACCELERATION;
                this.facingRight = true;
            }
            if (this.vx > CONFIG.MAX_SPEED) this.vx = CONFIG.MAX_SPEED;
            if (this.vx < -CONFIG.MAX_SPEED) this.vx = -CONFIG.MAX_SPEED;

            if ((keys.jump || keys.up) && this.grounded) {
                this.vy = -CONFIG.JUMP_FORCE;
                this.grounded = false;
                this.jumpTimer = 1;
            } else if ((keys.jump || keys.up) && this.jumpTimer > 0 && this.jumpTimer < 10) {
                this.vy -= 1.2;
                this.jumpTimer++;
            } else {
                this.jumpTimer = 0;
            }
        }

        this.applyPhysics();

        this.x += this.vx;
        this.handleCollisions(map, 'x');

        this.y += this.vy;
        this.grounded = false;
        this.handleCollisions(map, 'y');

        if (!this.grounded) {
            this.state = this.vy < 0 ? 'jump' : 'fall';
        } else if (Math.abs(this.vx) > 0.5) {
            this.state = 'run';
            this.walkCycle += Math.abs(this.vx) * 0.1;
        } else {
            this.state = 'idle';
            this.walkCycle = 0;
        }

        if (this.y > CONFIG.HEIGHT + 100) this.die();
    }

    handleCollisions(map, axis) {
        let tiles = map.getTilesInRect(this);
        for (let tile of tiles) {
            if (tile.type === 0 || tile.type === 9) continue;
            if (checkCollision(this, tile)) {
                if (axis === 'x') {
                    if (this.vx > 0) {
                        this.x = tile.x - this.width;
                        if (tile.type === 8) this.win();
                    } else if (this.vx < 0) {
                        this.x = tile.x + CONFIG.TILE_SIZE;
                    }
                    this.vx = 0;
                } else if (axis === 'y') {
                    if (this.vy > 0) {
                        this.y = tile.y - this.height;
                        this.vy = 0;
                        this.grounded = true;
                    } else if (this.vy < 0) {
                        this.y = tile.y + CONFIG.TILE_SIZE;
                        this.vy = 0;
                        map.hitBlock(tile.tx, tile.ty);
                    }
                }
            }
        }
    }

    grow() {
        if (!this.isBig) {
            this.isBig = true;
            this.y -= 16;
            this.height = 56;
            game.addScore(1000, this.x, this.y);
            for(let i=0; i<20; i++) game.particles.push(new Particle(this.x + this.width/2, this.y + this.height/2, '#10b981'));
        }
    }

    shrink() {
        if (this.isBig) {
            this.isBig = false;
            this.height = 40;
            this.invulnerableTimer = 120;
            for(let i=0; i<10; i++) game.particles.push(new Particle(this.x + this.width/2, this.y + this.height/2, '#f87171'));
        } else {
            this.die();
        }
    }

    die() {
        if(this.dead) return;
        this.dead = true;
        this.vy = -12;
        this.state = 'dead';
        game.triggerGameOver();
    }

    win() {
        if(this.won) return;
        this.won = true;
        this.vx = 0;
        this.vy = 0;
        game.triggerWin();
    }

    draw(ctx, camX) {
        if (this.invulnerableTimer > 0 && Math.floor(Date.now() / 100) % 2 === 0) return;
        let drawX = this.x - camX;
        let drawY = this.y;
        ctx.save();
        ctx.translate(drawX + this.width/2, drawY + this.height/2);
        if (!this.facingRight) ctx.scale(-1, 1);
        
        let mainColor = this.color;
        let skinColor = '#fcd34d';
        let hatColor = '#b91c1c';
        let pantsColor = '#2563eb';
        
        if (this.dead) {
            ctx.fillStyle = mainColor;
            ctx.fillRect(-this.width/2, -this.height/2, this.width, this.height);
            ctx.fillStyle = 'black';
            ctx.fillRect(-this.width/4, -this.height/4, 6, 6);
            ctx.fillRect(this.width/4 - 6, -this.height/4, 6, 6);
        } else {
            drawRoundedRect(ctx, -this.width/2, -this.height/2 + (this.isBig ? 16 : 8), this.width, this.height - (this.isBig ? 16 : 8), 8, pantsColor);
            drawRoundedRect(ctx, -this.width/2 - 2, -this.height/2 + (this.isBig ? 0 : 0), this.width + 4, 20, 6, mainColor);
            ctx.fillStyle = skinColor;
            ctx.beginPath();
            ctx.arc(this.isBig ? 2 : 0, -this.height/2 - 4, this.isBig ? 14 : 10, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = hatColor;
            ctx.beginPath();
            ctx.arc(this.isBig ? 2 : 0, -this.height/2 - 6, this.isBig ? 14 : 10, Math.PI, 0);
            ctx.fill();
            ctx.fillRect(0, -this.height/2 - 6, 16, 4);
            ctx.fillStyle = '#1e293b';
            ctx.beginPath();
            ctx.arc(this.isBig ? 8 : 4, -this.height/2 - 4, 2, 0, Math.PI*2);
            ctx.fill();
            if (this.state === 'run') {
                let bob = Math.sin(this.walkCycle) * 2;
                ctx.translate(0, bob);
            }
        }
        ctx.restore();
    }
}

class Enemy extends Entity {
    constructor(x, y) {
        super(x, y, 32, 32);
        this.vx = -1.5;
        this.color = '#854d0e';
        this.walkCycle = 0;
    }
    update(map, player) {
        if (this.dead) return;
        if (Math.abs(this.x - player.x) > CONFIG.WIDTH * 1.5) return;
        this.applyPhysics();
        this.walkCycle += 0.1;

        this.x += this.vx;
        let tiles = map.getTilesInRect(this);
        let hitWall = false;
        for (let tile of tiles) {
            if (tile.type !== 0 && tile.type !== 9 && checkCollision(this, tile)) {
                if (this.vx > 0) { this.x = tile.x - this.width; hitWall = true; }
                else if (this.vx < 0) { this.x = tile.x + CONFIG.TILE_SIZE; hitWall = true; }
            }
        }
        if (hitWall) this.vx *= -1;

        this.y += this.vy;
        tiles = map.getTilesInRect(this);
        this.grounded = false;
        for (let tile of tiles) {
            if (tile.type !== 0 && tile.type !== 9 && checkCollision(this, tile)) {
                if (this.vy > 0) {
                    this.y = tile.y - this.height;
                    this.vy = 0;
                    this.grounded = true;
                }
            }
        }

        if (this.y > CONFIG.HEIGHT) this.dead = true;

        if (!player.dead && !this.dead && checkCollision(this, player)) {
            if (player.vy > 0 && player.y + player.height - 10 < this.y + this.height/2) {
                this.die();
                player.vy = -10;
                game.addScore(100, this.x, this.y);
            } else {
                if (player.invulnerableTimer === 0) player.shrink();
            }
        }
    }
    die() {
        this.dead = true;
        for(let i=0; i<15; i++) game.particles.push(new Particle(this.x + this.width/2, this.y + this.height, this.color));
    }
    draw(ctx, camX) {
        if (this.dead) return;
        let drawX = this.x - camX;
        let drawY = this.y;
        ctx.save();
        ctx.translate(drawX + this.width/2, drawY + this.height/2);
        let scaleX = 1 + Math.sin(this.walkCycle) * 0.1;
        let scaleY = 1 - Math.sin(this.walkCycle) * 0.1;
        ctx.scale(scaleX, scaleY);
        
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(0, 0, this.width/2, Math.PI, 0);
        ctx.fill();
        ctx.fillRect(-this.width/2, 0, this.width, this.height/2);
        
        ctx.fillStyle = '#f8fafc';
        ctx.beginPath(); ctx.arc(-6, -4, 4, 0, Math.PI*2); ctx.arc(6, -4, 4, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#020617';
        ctx.beginPath(); ctx.arc(-6 + (this.vx>0?2:-2), -4, 2, 0, Math.PI*2); ctx.arc(6 + (this.vx>0?2:-2), -4, 2, 0, Math.PI*2); ctx.fill();
        
        ctx.fillStyle = '#020617';
        let footOffset = Math.sin(this.walkCycle*2) * 4;
        drawRoundedRect(ctx, -14, 10 + footOffset, 12, 6, 3);
        drawRoundedRect(ctx, 2, 10 - footOffset, 12, 6, 3);
        
        ctx.restore();
    }
}

class Item extends Entity {
    constructor(x, y, type) {
        super(x, y, 32, 32);
        this.type = type;
        if (type === 'mushroom') {
            this.vx = 2;
        } else {
            this.vy = -10;
            this.grounded = true;
            this.timer = 0;
        }
    }
    update(map, player) {
        if (this.dead) return;
        if (this.type === 'mushroom') {
            this.applyPhysics();
            this.x += this.vx;
            let tiles = map.getTilesInRect(this);
            let hitWall = false;
            for (let tile of tiles) {
                if (tile.type !== 0 && tile.type !== 9 && checkCollision(this, tile)) {
                    if (this.vx > 0) { this.x = tile.x - this.width; hitWall = true; }
                    else if (this.vx < 0) { this.x = tile.x + CONFIG.TILE_SIZE; hitWall = true; }
                }
            }
            if (hitWall) this.vx *= -1;

            this.y += this.vy;
            tiles = map.getTilesInRect(this);
            for (let tile of tiles) {
                if (tile.type !== 0 && tile.type !== 9 && checkCollision(this, tile)) {
                    if (this.vy > 0) { this.y = tile.y - this.height; this.vy = 0; }
                }
            }
            if (checkCollision(this, player)) {
                player.grow();
                this.dead = true;
            }
        } else if (this.type === 'coin') {
            this.y += this.vy;
            this.vy += 0.5;
            this.timer++;
            if (this.timer > 30) {
                this.dead = true;
                player.coins++;
                game.addScore(200, this.x, this.y);
            }
        }
    }
    draw(ctx, camX) {
        if (this.dead) return;
        let drawX = this.x - camX;
        let drawY = this.y;
        if (this.type === 'mushroom') {
            ctx.save();
            ctx.translate(drawX + this.width/2, drawY + this.height/2);
            ctx.fillStyle = '#fef08a'; ctx.fillRect(-8, 0, 16, 16);
            ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.arc(0, 0, 16, Math.PI, 0); ctx.fill();
            ctx.fillStyle = 'white';
            ctx.beginPath(); ctx.arc(-8, -6, 4, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(8, -6, 4, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(0, -12, 4, 0, Math.PI*2); ctx.fill();
            ctx.restore();
        } else if (this.type === 'coin') {
            ctx.fillStyle = '#fbbf24';
            ctx.beginPath();
            ctx.ellipse(drawX + this.width/2, drawY + this.height/2, 10 * Math.abs(Math.cos(this.timer*0.2)), 14, 0, 0, Math.PI*2);
            ctx.fill();
            ctx.strokeStyle = '#f59e0b';
            ctx.lineWidth = 2;
            ctx.stroke();
        }
    }
}

class LevelMap {
    constructor() {
        this.tiles = [];
        this.width = 0;
        this.height = Math.floor(CONFIG.HEIGHT / CONFIG.TILE_SIZE);
        this.generateMap();
        this.animTimer = 0;
    }
    generateMap() {
        const mapData = [
            "                                                                                                                                              ",
            "                                                                                                                                              ",
            "                                                                                                                                              ",
            "                                         4                                                                                                    ",
            "                                                                                                                                              ",
            "       4   34343                                                                                                                              ",
            "                                                                                                                                    8         ",
            "                                                333                         4                                                       8         ",
            "                                                                          33333           33                                        8         ",
            "                                   67                                                                                               8         ",
            "                    67             10                   67        343                                                               8         ",
            "                    10             10                   10                                      3333                                8         ",
            "                    10             10                   10                                                                          8         ",
            "1111111111111111111111111111   11111111111111111   1111111111111111111111111111111111111    11111111111111111111111111111111111111111111111111",
            "2222222222222222222222222222   22222222222222222   2222222222222222222222222222222222222    22222222222222222222222222222222222222222222222222"
        ];
        this.width = mapData[0].length;
        for (let y = 0; y < this.height; y++) {
            this.tiles[y] = [];
            for (let x = 0; x < this.width; x++) {
                let char = mapData[y] && mapData[y][x] ? mapData[y][x] : ' ';
                let type = 0;
                switch(char) {
                    case '1': type = 1; break;
                    case '2': type = 2; break;
                    case '3': type = 3; break;
                    case '4': type = 4; break;
                    case '5': type = 5; break;
                    case '6': type = 6; break;
                    case '7': type = 7; break;
                    case '1': type = 10; break;
                    case '0': type = 10; break;
                    case '8': type = 8; break;
                }
                if (char === '1' && mapData[y-1] && mapData[y-1][x] === '6') type = 10; // Fix pipe parsing
                if (type === 0 && y < 5 && Math.random() < 0.05) type = 9;
                this.tiles[y][x] = type;
            }
        }
        
        // Correct pipe bodies manually since parsing with two digits is tricky in single char mapping
        for (let y = 0; y < this.height; y++) {
            for (let x = 0; x < this.width; x++) {
                 if (this.tiles[y][x] === 10 || (this.tiles[y-1] && (this.tiles[y-1][x] === 6 || this.tiles[y-1][x] === 7 || this.tiles[y-1][x] === 10) && this.tiles[y][x] !== 1 && this.tiles[y][x] !== 2)) {
                     this.tiles[y][x] = 10;
                 }
            }
        }

        this.spawnEnemies();
    }
    spawnEnemies() {
        const enemySpawns = [
            {x: 18, y: 13}, {x: 24, y: 13}, {x: 35, y: 13},
            {x: 50, y: 13}, {x: 55, y: 13}, {x: 75, y: 13},
            {x: 80, y: 13}, {x: 95, y: 13}
        ];
        enemySpawns.forEach(pos => {
            game.enemies.push(new Enemy(pos.x * CONFIG.TILE_SIZE, pos.y * CONFIG.TILE_SIZE - 32));
        });
    }
    getTilesInRect(rect) {
        let startX = Math.max(0, Math.floor(rect.x / CONFIG.TILE_SIZE));
        let endX = Math.min(this.width - 1, Math.floor((rect.x + rect.width) / CONFIG.TILE_SIZE));
        let startY = Math.max(0, Math.floor(rect.y / CONFIG.TILE_SIZE));
        let endY = Math.min(this.height - 1, Math.floor((rect.y + rect.height) / CONFIG.TILE_SIZE));
        let result = [];
        for (let y = startY; y <= endY; y++) {
            for (let x = startX; x <= endX; x++) {
                result.push({
                    x: x * CONFIG.TILE_SIZE, y: y * CONFIG.TILE_SIZE,
                    width: CONFIG.TILE_SIZE, height: CONFIG.TILE_SIZE,
                    type: this.tiles[y][x], tx: x, ty: y
                });
            }
        }
        return result;
    }
    hitBlock(tx, ty) {
        let type = this.tiles[ty][tx];
        if (type === 4) {
            this.tiles[ty][tx] = 5;
            let isMushroom = Math.random() < 0.2;
            if (isMushroom) game.items.push(new Item(tx * CONFIG.TILE_SIZE, ty * CONFIG.TILE_SIZE - 32, 'mushroom'));
            else game.items.push(new Item(tx * CONFIG.TILE_SIZE, ty * CONFIG.TILE_SIZE, 'coin'));
            for(let i=0; i<5; i++) {
                let p = new Particle(tx * CONFIG.TILE_SIZE + 20, ty * CONFIG.TILE_SIZE, '#fbbf24');
                p.vy = -3 - Math.random() * 2;
                game.particles.push(p);
            }
        } else if (type === 3) {
            if (game.player.isBig) {
                this.tiles[ty][tx] = 0;
                game.addScore(50, tx * CONFIG.TILE_SIZE, ty * CONFIG.TILE_SIZE);
                for(let i=0; i<8; i++) game.particles.push(new Particle(tx * CONFIG.TILE_SIZE + 20, ty * CONFIG.TILE_SIZE + 20, '#b45309'));
            } else {
                for(let i=0; i<3; i++) {
                    let p = new Particle(tx * CONFIG.TILE_SIZE + 20, ty * CONFIG.TILE_SIZE, '#b45309');
                    p.vy = -2 - Math.random() * 2;
                    game.particles.push(p);
                }
            }
        }
    }
    draw(ctx, camX) {
        this.animTimer += 0.05;
        let startX = Math.max(0, Math.floor(camX / CONFIG.TILE_SIZE));
        let endX = Math.min(this.width, startX + Math.ceil(CONFIG.WIDTH / CONFIG.TILE_SIZE) + 1);

        for (let y = 0; y < this.height; y++) {
            for (let x = startX; x < endX; x++) {
                let type = this.tiles[y][x];
                if (type === 0) continue;

                let drawX = x * CONFIG.TILE_SIZE - camX;
                let drawY = y * CONFIG.TILE_SIZE;
                let ts = CONFIG.TILE_SIZE;

                ctx.save();
                ctx.translate(drawX, drawY);

                switch(type) {
                    case 1:
                        ctx.fillStyle = '#65a30d'; ctx.fillRect(0, 0, ts, ts);
                        ctx.fillStyle = '#84cc16'; ctx.fillRect(0, 0, ts, 6); break;
                    case 2:
                        ctx.fillStyle = '#78350f'; ctx.fillRect(0, 0, ts, ts);
                        ctx.fillStyle = '#92400e'; if ((x+y)%2===0) ctx.fillRect(5, 5, 10, 10); break;
                    case 3:
                        ctx.fillStyle = '#b45309'; ctx.fillRect(0, 0, ts, ts);
                        ctx.strokeStyle = '#78350f'; ctx.lineWidth = 2; ctx.strokeRect(0, 0, ts, ts);
                        ctx.beginPath(); ctx.moveTo(0, ts/2); ctx.lineTo(ts, ts/2); ctx.stroke();
                        ctx.beginPath(); ctx.moveTo(ts/2, 0); ctx.lineTo(ts/2, ts/2); ctx.stroke();
                        ctx.beginPath(); ctx.moveTo(ts/4, ts/2); ctx.lineTo(ts/4, ts); ctx.stroke();
                        ctx.beginPath(); ctx.moveTo(ts*0.75, ts/2); ctx.lineTo(ts*0.75, ts); ctx.stroke(); break;
                    case 4:
                        ctx.fillStyle = '#f59e0b'; drawRoundedRect(ctx, 2, 2, ts-4, ts-4, 4, '#f59e0b', '#b45309');
                        ctx.fillStyle = 'white'; ctx.font = 'bold 24px Inter'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                        let scale = 1 + Math.sin(this.animTimer + x) * 0.1;
                        ctx.translate(ts/2, ts/2); ctx.scale(scale, scale); ctx.fillText('?', 0, 2); break;
                    case 5:
                        ctx.fillStyle = '#a8a29e'; drawRoundedRect(ctx, 2, 2, ts-4, ts-4, 4, '#a8a29e', '#78716c');
                        ctx.fillStyle = '#78716c'; ctx.beginPath();
                        ctx.arc(6, 6, 2, 0, Math.PI*2); ctx.fill(); ctx.arc(ts-6, 6, 2, 0, Math.PI*2); ctx.fill();
                        ctx.arc(6, ts-6, 2, 0, Math.PI*2); ctx.fill(); ctx.arc(ts-6, ts-6, 2, 0, Math.PI*2); ctx.fill(); break;
                    case 6:
                    case 7:
                    case 10:
                        let isTop = type === 6 || type === 7;
                        ctx.fillStyle = '#16a34a'; ctx.fillRect(0, 0, ts, ts);
                        ctx.fillStyle = '#4ade80'; if (type === 6 || (type === 10 && x%2===0)) ctx.fillRect(4, 0, 8, ts);
                        if (isTop) { ctx.fillStyle = '#15803d'; ctx.fillRect(0, ts-8, ts, 8); }
                        ctx.strokeStyle = 'black'; ctx.lineWidth = 1; ctx.strokeRect(0,0,ts,ts); break;
                    case 8:
                        ctx.fillStyle = '#fbbf24'; ctx.beginPath(); ctx.arc(ts/2, ts/2, 8, 0, Math.PI*2); ctx.fill();
                        ctx.fillStyle = '#d6d3d1'; ctx.fillRect(ts/2 - 4, ts/2, 8, ts);
                        ctx.fillStyle = '#10b981'; ctx.beginPath();
                        let wave = Math.sin(this.animTimer * 2) * 5;
                        ctx.moveTo(ts/2, ts/2); ctx.lineTo(ts/2 + 30 + wave, ts/2 + 10); ctx.lineTo(ts/2, ts/2 + 20); ctx.fill(); break;
                    case 9:
                        ctx.fillStyle = 'rgba(255, 255, 255, 0.7)'; ctx.beginPath();
                        ctx.arc(20, 20, 15, 0, Math.PI*2); ctx.arc(40, 20, 20, 0, Math.PI*2); ctx.arc(60, 20, 15, 0, Math.PI*2); ctx.fill(); break;
                }
                ctx.restore();
            }
        }
    }
}

class Game {
    constructor() {
        this.state = 'start';
        this.lastTime = 0;
        this.accumulator = 0;
        this.step = 1000 / CONFIG.FPS;
        this.init();
    }
    init() {
        this.player = new Player(100, 300);
        this.camera = new Camera();
        this.map = new LevelMap();
        this.camera.maxX = this.map.width * CONFIG.TILE_SIZE;
        this.enemies = [];
        this.items = [];
        this.particles = [];
        this.timeLeft = CONFIG.GAME_TIME;
        this.frameCount = 0;
    }
    start() {
        document.getElementById('startScreen').style.display = 'none';
        document.getElementById('startScreen').classList.remove('active');
        document.getElementById('hud').style.display = 'flex';
        this.init();
        this.state = 'play';
        requestAnimationFrame((t) => this.loop(t));
    }
    triggerGameOver() {
        if(this.state === 'gameover') return;
        setTimeout(() => {
            this.state = 'gameover';
            document.getElementById('gameOverScreen').style.display = 'flex';
            setTimeout(() => document.getElementById('gameOverScreen').classList.add('active'), 10);
            document.getElementById('finalScore1').innerText = this.player.score;
        }, 1500);
    }
    triggerWin() {
        if(this.state === 'win') return;
        this.state = 'win';
        let timeBonus = Math.floor(this.timeLeft) * 50;
        this.addScore(timeBonus, this.player.x, this.player.y - 40);
        setTimeout(() => {
            document.getElementById('winScreen').style.display = 'flex';
            setTimeout(() => document.getElementById('winScreen').classList.add('active'), 10);
            document.getElementById('finalScore2').innerText = this.player.score;
        }, 2000);
    }
    addScore(points, x, y) {
        this.player.score += points;
        let p = new Particle(x, y, '#fbbf24', 'score');
        p.text = points.toString();
        p.vy = -2; p.vx = 0; p.decay = 0.02;
        this.particles.push(p);
        this.updateHUD();
    }
    updateHUD() {
        document.getElementById('scoreDisplay').innerText = this.player.score.toString().padStart(6, '0');
        document.getElementById('coinsDisplay').innerText = 'x ' + this.player.coins.toString().padStart(2, '0');
        document.getElementById('timeDisplay').innerText = Math.max(0, Math.floor(this.timeLeft)).toString().padStart(3, '0');
    }
    update() {
        if (this.state === 'play') {
            this.frameCount++;
            if (this.frameCount % 60 === 0) {
                this.timeLeft--;
                if (this.timeLeft <= 0) this.player.die();
                this.updateHUD();
            }

            this.player.update(this.map);
            this.camera.update(this.player);

            for (let i = this.enemies.length - 1; i >= 0; i--) {
                this.enemies[i].update(this.map, this.player);
                if (this.enemies[i].dead && this.enemies[i].y > CONFIG.HEIGHT) this.enemies.splice(i, 1);
            }
            for (let i = this.items.length - 1; i >= 0; i--) {
                this.items[i].update(this.map, this.player);
                if (this.items[i].dead && this.items[i].type !== 'coin') this.items.splice(i, 1);
            }
            
            if (Math.random() < 0.1) {
                let p = new Particle(this.camera.x + Math.random() * CONFIG.WIDTH, Math.random() * CONFIG.HEIGHT, 'rgba(255,255,255,0.2)');
                p.vy = Math.random() * 2 + 1;
                p.vx = Math.random() * -2 - 1;
                this.particles.push(p);
            }
        } else if (this.state === 'gameover' || this.state === 'win') {
            if (this.player.dead) {
                this.player.vy += CONFIG.GRAVITY;
                this.player.y += this.player.vy;
            }
        }

        for (let i = this.particles.length - 1; i >= 0; i--) {
            if (!this.particles[i].update()) this.particles.splice(i, 1);
        }
    }
    draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        this.map.draw(ctx, this.camera.x);
        for (let item of this.items) item.draw(ctx, this.camera.x);
        for (let enemy of this.enemies) enemy.draw(ctx, this.camera.x);
        this.player.draw(ctx, this.camera.x);
        for (let p of this.particles) p.draw(ctx, this.camera.x);
        
        let gradient = ctx.createRadialGradient(
            CONFIG.WIDTH/2, CONFIG.HEIGHT/2, CONFIG.HEIGHT/2, 
            CONFIG.WIDTH/2, CONFIG.HEIGHT/2, CONFIG.WIDTH
        );
        gradient.addColorStop(0, 'rgba(0,0,0,0)');
        gradient.addColorStop(1, 'rgba(0,0,0,0.3)');
        ctx.fillStyle = gradient;
        ctx.fillRect(0,0,CONFIG.WIDTH, CONFIG.HEIGHT);
    }
    loop(timestamp) {
        if (this.state === 'start') return;
        let deltaTime = timestamp - this.lastTime;
        this.lastTime = timestamp;
        if (deltaTime > 100) deltaTime = 100;
        this.accumulator += deltaTime;
        while (this.accumulator >= this.step) {
            this.update();
            this.accumulator -= this.step;
        }
        this.draw();
        requestAnimationFrame((t) => this.loop(t));
    }
}

const game = new Game();
document.getElementById('startBtn').addEventListener('click', () => game.start());
document.getElementById('restartBtn1').addEventListener('click', () => {
    document.getElementById('gameOverScreen').classList.remove('active');
    setTimeout(() => { document.getElementById('gameOverScreen').style.display = 'none'; game.start(); }, 300);
});
document.getElementById('restartBtn2').addEventListener('click', () => {
    document.getElementById('winScreen').classList.remove('active');
    setTimeout(() => { document.getElementById('winScreen').style.display = 'none'; game.start(); }, 300);
});
game.draw();

</script>

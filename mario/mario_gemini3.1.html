<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Gemini3.1 Bros</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
        }
        #gameContainer {
            position: relative;
        }
        canvas {
            background-color: #5c94fc;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            border-radius: 8px;
            display: block;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 0 #000;
            pointer-events: none;
        }
        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: rgba(255, 255, 255, 0.9);
            font-size: 16px;
            text-shadow: 1px 1px 0 #000;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="ui">SCORE: <span id="score">0</span></div>
        <div id="controls">移動: ← → | しゃがむ: ↓ | ダッシュ/ファイア: SHIFT | ジャンプ: ↑ or SPACE</div>
        <canvas id="gameCanvas" width="800" height="600"></canvas>
    </div>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');

        let score = 0;
        let gameState = 'title'; // 'title', 'playing', 'gameover', 'clear'
        let cameraX = 0;
        let frameCount = 0;

        const keys = {
            ArrowLeft: false, ArrowRight: false, ArrowUp: false, ArrowDown: false, Space: false, ShiftLeft: false, ShiftRight: false, ShiftTap: false
        };

        let shiftPressed = false;

        window.addEventListener('keydown', e => {
            if (keys.hasOwnProperty(e.code) || e.code === 'Space' || e.code.startsWith('Shift')) {
                if (e.code === 'Space') keys.Space = true;
                else if (e.code.startsWith('Shift')) { 
                    keys.ShiftLeft = true; keys.ShiftRight = true; 
                    if (!shiftPressed) keys.ShiftTap = true;
                    shiftPressed = true;
                }
                else keys[e.code] = true;
                
                if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
            }
        });
        window.addEventListener('keyup', e => {
            if (keys.hasOwnProperty(e.code) || e.code === 'Space' || e.code.startsWith('Shift')) {
                if (e.code === 'Space') keys.Space = false;
                else if (e.code.startsWith('Shift')) { keys.ShiftLeft = false; keys.ShiftRight = false; shiftPressed = false; }
                else keys[e.code] = false;
                
                if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
            }
        });

        const player = {
            x: 50, y: 50, w: 30, h: 30,
            vx: 0, vy: 0,
            baseSpeed: 4, dashSpeed: 7,
            baseJump: -14, dashJump: -16,
            gravity: 0.6,
            grounded: false,
            color: 'red',
            state: 'small', // small, big, fire
            crouching: false,
            dead: false, invincibleTimer: 0,
            facingRight: true, walkTimer: 0
        };

        const levelWidth = 6000;
        const platformsData = [
            // Ground
            { x: 0, y: 550, w: 800, h: 50 },
            { x: 900, y: 550, w: 700, h: 50 },
            { x: 1700, y: 550, w: 800, h: 50 },
            { x: 2600, y: 550, w: 900, h: 50 },
            { x: 3600, y: 550, w: 1000, h: 50 },
            { x: 4800, y: 550, w: 1200, h: 50 },
            
            // Blocks & Items
            { x: 300, y: 400, w: 40, h: 40, type: 'coin_block' },
            { x: 340, y: 400, w: 40, h: 40, type: 'item' },
            { x: 380, y: 400, w: 40, h: 40, type: 'coin_block' },
            { x: 600, y: 300, w: 40, h: 40, type: 'item' },
            { x: 640, y: 300, w: 40, h: 40, type: 'coin_block' },
            { x: 680, y: 300, w: 40, h: 40, type: 'coin_block' },
            
            // Pipes
            { x: 1000, y: 450, w: 60, h: 100, type: 'pipe' },
            { x: 1200, y: 400, w: 60, h: 150, type: 'pipe' },
            { x: 1400, y: 350, w: 60, h: 200, type: 'pipe' },

            // Stairs
            { x: 1900, y: 510, w: 40, h: 40, type: 'block' },
            { x: 1940, y: 470, w: 40, h: 80, type: 'block' },
            { x: 1980, y: 430, w: 40, h: 120, type: 'block' },
            { x: 2020, y: 390, w: 40, h: 160, type: 'block' },

            // Floating
            { x: 2520, y: 400, w: 60, h: 20, type: 'block' },

            // More pipes & blocks
            { x: 2800, y: 400, w: 40, h: 40, type: 'coin_block' },
            { x: 2840, y: 400, w: 40, h: 40, type: 'item' },
            { x: 2880, y: 400, w: 40, h: 40, type: 'coin_block' },
            { x: 3000, y: 450, w: 60, h: 100, type: 'pipe' },
            { x: 3300, y: 400, w: 60, h: 150, type: 'pipe' },

            // Block formation
            { x: 3800, y: 350, w: 40, h: 40, type: 'block' },
            { x: 3840, y: 350, w: 40, h: 40, type: 'coin_block' },
            { x: 3880, y: 350, w: 40, h: 40, type: 'item' },
            { x: 3920, y: 350, w: 40, h: 40, type: 'coin_block' },

            { x: 4200, y: 450, w: 60, h: 100, type: 'pipe' },
            { x: 4400, y: 450, w: 60, h: 100, type: 'pipe' },

            // Goal Stairs
            { x: 5300, y: 510, w: 40, h: 40, type: 'block' },
            { x: 5340, y: 470, w: 40, h: 80, type: 'block' },
            { x: 5380, y: 430, w: 40, h: 120, type: 'block' },
            { x: 5420, y: 390, w: 40, h: 160, type: 'block' },
            { x: 5460, y: 350, w: 40, h: 200, type: 'block' },
            { x: 5500, y: 310, w: 40, h: 240, type: 'block' },
            { x: 5540, y: 270, w: 40, h: 280, type: 'block' },
            { x: 5580, y: 230, w: 40, h: 320, type: 'block' }
        ];

        const enemiesData = [
            { type: 'goomba', x: 400, y: 518, w: 32, h: 32, vx: -1.5, state: 'normal', active: true },
            { type: 'koopa', x: 700, y: 502, w: 32, h: 48, vx: -1.5, state: 'koopa_normal', active: true },
            { type: 'goomba', x: 1100, y: 518, w: 32, h: 32, vx: -1.5, state: 'normal', active: true },
            { type: 'koopa', x: 1300, y: 502, w: 32, h: 48, vx: -1.5, state: 'koopa_normal', active: true },
            { type: 'koopa', x: 2200, y: 502, w: 32, h: 48, vx: -1.5, state: 'koopa_normal', active: true },
            { type: 'goomba', x: 2800, y: 518, w: 32, h: 32, vx: -1.5, state: 'normal', active: true },
            { type: 'goomba', x: 3100, y: 518, w: 32, h: 32, vx: -1.5, state: 'normal', active: true },
            { type: 'koopa', x: 3700, y: 502, w: 32, h: 48, vx: -1.5, state: 'koopa_normal', active: true },
            { type: 'koopa', x: 4300, y: 502, w: 32, h: 48, vx: -1.5, state: 'koopa_normal', active: true },
            { type: 'goomba', x: 4500, y: 518, w: 32, h: 32, vx: -1.5, state: 'normal', active: true },
            { type: 'koopa', x: 4900, y: 502, w: 32, h: 48, vx: -1.5, state: 'koopa_normal', active: true },
            { type: 'goomba', x: 5100, y: 518, w: 32, h: 32, vx: -1.5, state: 'normal', active: true }
        ];

        const goalData = { x: 5800, y: 150, w: 10, h: 400 };

        const cloudsData = [];
        for (let i = 0; i < 30; i++) {
            cloudsData.push({
                x: Math.random() * levelWidth, 
                y: 50 + Math.random() * 150, 
                s: 0.7 + Math.random() * 0.8
            });
        }

        let platforms = []; let enemies = []; let items = []; let fireballs = []; let goal = {};

        function init() {
            player.x = 50; player.y = 50;
            player.vx = 0; player.vy = 0;
            player.state = 'small'; player.h = 30;
            player.crouching = false;
            player.dead = false; player.invincibleTimer = 0;
            
            score = 0; gameState = 'playing'; cameraX = 0;
            scoreElement.innerText = score;
            
            platforms = JSON.parse(JSON.stringify(platformsData));
            platforms.forEach(p => p.bounceY = 0);
            enemies = JSON.parse(JSON.stringify(enemiesData));
            goal = JSON.parse(JSON.stringify(goalData));
            items = []; fireballs = [];
        }

        function checkCollision(r1, r2) {
            return r1.x < r2.x + r2.w && r1.x + r1.w > r2.x &&
                   r1.y < r2.y + r2.h && r1.y + r1.h > r2.y;
        }

        function spawnItem(x, y) {
            if (player.state === 'small') items.push({ x: x, y: y, w: 30, h: 30, vx: 2, vy: -3, type: 'mushroom', active: true });
            else items.push({ x: x, y: y, w: 30, h: 30, vx: 0, vy: -2, type: 'flower', active: true });
        }

        function spawnCoinAnim(x, y) {
            items.push({ x: x, y: y, w: 20, h: 30, vx: 0, vy: -6, type: 'coin_anim', timer: 20, active: true });
        }

        function spawnFireball() {
            let vx = player.facingRight ? 8 : -8;
            let startX = player.facingRight ? player.x + player.w : player.x - 10;
            fireballs.push({ x: startX, y: player.y + player.h / 2, w: 10, h: 10, vx: vx, vy: 0, active: true });
        }

        function update() {
            if (gameState !== 'playing') return;

            if (player.dead) {
                player.vy += player.gravity; player.y += player.vy;
                if (player.y > canvas.height + 100) gameState = 'gameover';
                return;
            }

            if (player.invincibleTimer > 0) player.invincibleTimer--;

            // --- Crouch Logic ---
            let shouldCrouch = keys.ArrowDown && player.grounded && (player.state === 'big' || player.state === 'fire');
            if (shouldCrouch && !player.crouching) {
                player.crouching = true;
                player.h = 30; player.y += 15;
            } else if (!shouldCrouch && player.crouching) {
                // Check if we can stand up (ceiling check could go here, omitting for simplicity)
                player.crouching = false;
                player.h = 45; player.y -= 15;
            }

            // --- Player Horizontal ---
            let isDashing = keys.ShiftLeft || keys.ShiftRight;
            let currentSpeed = isDashing ? player.dashSpeed : player.baseSpeed;

            if (player.crouching) {
                player.vx *= 0.9; // 滑る
                if (Math.abs(player.vx) < 0.1) player.vx = 0;
            } else {
                if (keys.ArrowLeft) {
                    player.vx -= 0.5; if (player.vx < -currentSpeed) player.vx = -currentSpeed;
                    player.facingRight = false; player.walkTimer++;
                } else if (keys.ArrowRight) {
                    player.vx += 0.5; if (player.vx > currentSpeed) player.vx = currentSpeed;
                    player.facingRight = true; player.walkTimer++;
                } else {
                    player.vx *= 0.8; if (Math.abs(player.vx) < 0.1) player.vx = 0;
                    player.walkTimer = 0;
                }
            }

            player.x += player.vx;
            if (player.x < 0) { player.x = 0; player.vx = 0; }

            for (let p of platforms) {
                if (p.bounceY < 0) p.bounceY += 1;
                if (checkCollision(player, p)) {
                    if (player.vx > 0) { player.x = p.x - player.w; player.vx = 0; }
                    else if (player.vx < 0) { player.x = p.x + p.w; player.vx = 0; }
                }
            }

            // --- Player Vertical ---
            player.vy += player.gravity; player.y += player.vy; player.grounded = false;

            for (let p of platforms) {
                if (checkCollision(player, p)) {
                    if (player.vy > 0) {
                        player.y = p.y - player.h; player.vy = 0; player.grounded = true;
                    } else if (player.vy < 0) {
                        player.y = p.y + p.h; player.vy = 0;
                        if (p.type === 'item') {
                            p.type = 'used'; p.bounceY = -10;
                            score += 50; scoreElement.innerText = score;
                            spawnItem(p.x + 5, p.y - 30);
                        } else if (p.type === 'coin_block') {
                            p.type = 'used'; p.bounceY = -10;
                            score += 100; scoreElement.innerText = score;
                            spawnCoinAnim(p.x + p.w/2 - 10, p.y - 30);
                        } else if (p.type === 'block') { p.bounceY = -5; }
                    }
                }
            }

            // Jump & Fire
            if ((keys.ArrowUp || keys.Space) && player.grounded && !player.crouching) {
                player.vy = (isDashing && Math.abs(player.vx) > player.baseSpeed) ? player.dashJump : player.baseJump;
                player.grounded = false;
            }
            if (keys.ShiftTap && player.state === 'fire') {
                spawnFireball();
                keys.ShiftTap = false; // consume tap
            }

            // --- Fireballs ---
            for (let f of fireballs) {
                if (!f.active) continue;
                f.vy += player.gravity * 0.8; f.y += f.vy;

                for (let p of platforms) {
                    if (checkCollision(f, p)) {
                        if (f.vy > 0) { f.y = p.y - f.h; f.vy = -6; }
                        else if (f.vy < 0) { f.y = p.y + p.h; f.vy = 0; }
                    }
                }
                f.x += f.vx;
                for (let p of platforms) { if (checkCollision(f, p)) f.active = false; }
                if (f.y > canvas.height || f.x < cameraX - 100 || f.x > cameraX + canvas.width + 100) f.active = false;
            }

            // --- Items ---
            for (let i of items) {
                if (!i.active) continue;
                
                if (i.type === 'coin_anim') {
                    i.timer--; i.y += i.vy; i.vy += 0.5;
                    if (i.timer <= 0) i.active = false;
                    continue;
                }

                i.vy += player.gravity; i.y += i.vy;
                for (let p of platforms) {
                    if (checkCollision(i, p)) {
                        if (i.vy > 0) { i.y = p.y - i.h; i.vy = 0; }
                        else if (i.vy < 0) { i.y = p.y + p.h; i.vy = 0; }
                    }
                }
                i.x += i.vx;
                for (let p of platforms) {
                    if (checkCollision(i, p)) {
                        if (i.vx > 0) { i.x = p.x - i.w; i.vx *= -1; }
                        else if (i.vx < 0) { i.x = p.x + p.w; i.vx *= -1; }
                    }
                }
                if (i.y > canvas.height) i.active = false;

                if (checkCollision(player, i)) {
                    i.active = false;
                    if (i.type === 'mushroom') {
                        if (player.state === 'small' && !player.crouching) { player.state = 'big'; player.y -= 15; player.h = 45; }
                        score += 1000;
                    } else if (i.type === 'flower') {
                        if (player.state === 'small' && !player.crouching) { player.y -= 15; player.h = 45; }
                        player.state = 'fire'; score += 1000;
                    }
                    scoreElement.innerText = score;
                }
            }

            // --- Enemies ---
            for (let e of enemies) {
                if (!e.active) continue;
                if (e.state === 'squished' || e.state === 'burned') {
                    e.timer--; if (e.timer <= 0) e.active = false;
                    if (e.state === 'burned') { e.vy += player.gravity; e.y += e.vy; }
                    continue;
                }
                
                e.vy = (e.vy || 0) + player.gravity; e.y += e.vy;
                for (let p of platforms) {
                    if (checkCollision(e, p)) { if (e.vy > 0) { e.y = p.y - e.h; e.vy = 0; } }
                }
                
                if (e.state !== 'shell_idle') {
                    e.x += e.vx;
                    for (let p of platforms) {
                        if (checkCollision(e, p)) {
                            if (e.vx > 0) { e.x = p.x - e.w; e.vx *= -1; }
                            else if (e.vx < 0) { e.x = p.x + p.w; e.vx *= -1; }
                        }
                    }
                }
                
                if (e.y > canvas.height + 100) e.active = false;

                for (let f of fireballs) {
                    if (f.active && checkCollision(f, e)) {
                        f.active = false; e.state = 'burned'; e.timer = 60; e.vy = -5;
                        score += 100; scoreElement.innerText = score;
                    }
                }

                if (e.state === 'shell_moving') {
                    for (let other of enemies) {
                        if (other !== e && other.active && other.state !== 'squished' && other.state !== 'burned' && checkCollision(e, other)) {
                            other.state = 'burned'; other.timer = 60; other.vy = -5;
                            score += 100; scoreElement.innerText = score;
                        }
                    }
                }

                if (e.state !== 'squished' && e.state !== 'burned' && checkCollision(player, e)) {
                    if (e.state === 'shell_idle') {
                        e.vx = (player.x + player.w/2 < e.x + e.w/2) ? 8 : -8;
                        e.state = 'shell_moving';
                        if (player.vy > 0) player.vy = player.baseJump * 0.7; 
                        else player.x += (e.vx > 0) ? -4 : 4;
                    } else {
                        if (player.vy > 0 && player.y + player.h - player.vy <= e.y + e.h / 2 && !player.crouching) {
                            if (e.type === 'goomba') { e.state = 'squished'; e.timer = 20; }
                            else if (e.type === 'koopa') {
                                if (e.state === 'koopa_normal') { e.state = 'shell_idle'; e.vx = 0; e.h = 32; e.y += 16; }
                                else if (e.state === 'shell_moving') { e.state = 'shell_idle'; e.vx = 0; }
                            }
                            player.vy = player.baseJump * 0.7; score += 100; scoreElement.innerText = score;
                        } else {
                            if (player.invincibleTimer <= 0) {
                                if (player.state === 'fire' || player.state === 'big') {
                                    player.state = 'small'; player.crouching = false; player.h = 30; player.y += 15; player.invincibleTimer = 120;
                                } else {
                                    player.dead = true; player.vy = -10; player.vx = 0;
                                }
                            }
                        }
                    }
                }
            }

            if (checkCollision(player, {x: goal.x, y: goal.y, w: goal.w, h: goal.h})) gameState = 'clear';
            if (player.y > canvas.height + 100 && !player.dead) { player.dead = true; player.vy = -10; }

            // --- Camera ---
            let targetCameraX = player.x - canvas.width / 2;
            if (targetCameraX < 0) targetCameraX = 0;
            if (targetCameraX > levelWidth - canvas.width) targetCameraX = levelWidth - canvas.width;
            cameraX += (targetCameraX - cameraX) * 0.1;
        }

        function draw() {
            ctx.fillStyle = '#5c94fc'; ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Title Screen
            if (gameState === 'title') {
                ctx.fillStyle = '#ffffff'; ctx.textAlign = 'center';
                ctx.font = 'bold 50px Courier New'; ctx.fillText('Super Gemini3.1 Bros', canvas.width/2, canvas.height/2 - 50);
                if (Math.floor(Date.now() / 500) % 2 === 0) {
                    ctx.font = '24px Courier New'; ctx.fillText('Press SPACE to Start', canvas.width/2, canvas.height/2 + 50);
                }
                return;
            }

            ctx.save(); ctx.translate(-cameraX * 0.3, 0);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            for(let c of cloudsData) {
                ctx.beginPath(); ctx.arc(c.x, c.y, 30*c.s, 0, Math.PI*2);
                ctx.arc(c.x + 25*c.s, c.y - 10*c.s, 30*c.s, 0, Math.PI*2);
                ctx.arc(c.x + 50*c.s, c.y, 30*c.s, 0, Math.PI*2); ctx.fill();
            }
            ctx.restore();

            ctx.save(); ctx.translate(-cameraX, 0);

            // Goal
            ctx.fillStyle = '#ffffff'; ctx.fillRect(goal.x, goal.y, 10, goal.h);
            ctx.fillStyle = '#00a800'; ctx.beginPath(); ctx.arc(goal.x + 5, goal.y, 15, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#ff0000'; ctx.fillRect(goal.x + 10, goal.y + 20, 50, 40);

            for (let p of platforms) {
                let drawY = p.y + (p.bounceY || 0);
                if (p.type === 'pipe') {
                    ctx.fillStyle = '#00a800'; ctx.fillRect(p.x, drawY, p.w, p.h);
                    ctx.fillStyle = '#000000'; ctx.strokeRect(p.x, drawY, p.w, p.h);
                    ctx.fillStyle = '#00a800'; ctx.fillRect(p.x - 2, drawY, p.w + 4, 20); ctx.strokeRect(p.x - 2, drawY, p.w + 4, 20);
                } else if (p.type === 'block') {
                    ctx.fillStyle = '#c84c0c'; ctx.fillRect(p.x, drawY, p.w, p.h);
                    ctx.strokeStyle = '#000'; ctx.strokeRect(p.x, drawY, p.w, p.h);
                    ctx.beginPath(); ctx.moveTo(p.x, drawY + p.h/2); ctx.lineTo(p.x + p.w, drawY + p.h/2);
                    ctx.moveTo(p.x + p.w/2, drawY); ctx.lineTo(p.x + p.w/2, drawY + p.h/2); ctx.stroke();
                } else if (p.type === 'item' || p.type === 'coin_block') {
                    ctx.fillStyle = '#f8d820'; ctx.fillRect(p.x, drawY, p.w, p.h);
                    ctx.strokeStyle = '#000'; ctx.strokeRect(p.x, drawY, p.w, p.h);
                    ctx.fillStyle = '#000'; ctx.font = '24px Courier New'; ctx.textAlign = 'center'; ctx.fillText('?', p.x + p.w/2, drawY + p.h - 10);
                } else if (p.type === 'used') {
                    ctx.fillStyle = '#888'; ctx.fillRect(p.x, drawY, p.w, p.h); ctx.strokeStyle = '#000'; ctx.strokeRect(p.x, drawY, p.w, p.h);
                } else {
                    ctx.fillStyle = '#c84c0c'; ctx.fillRect(p.x, drawY, p.w, p.h);
                    ctx.fillStyle = '#00a800'; ctx.fillRect(p.x, drawY, p.w, 15); ctx.strokeStyle = '#000'; ctx.strokeRect(p.x, drawY, p.w, p.h);
                }
            }

            for (let i of items) {
                if (!i.active) continue;
                if (i.type === 'mushroom') {
                    ctx.fillStyle = '#ff0000'; ctx.beginPath(); ctx.arc(i.x + i.w/2, i.y + i.h/2, i.w/2, Math.PI, 0); ctx.fill();
                    ctx.fillStyle = '#ffcc99'; ctx.fillRect(i.x, i.y + i.h/2, i.w, i.h/2);
                    ctx.fillStyle = '#fff'; ctx.fillRect(i.x + 5, i.y + 5, 6, 6); ctx.fillRect(i.x + 18, i.y + 5, 6, 6);
                } else if (i.type === 'flower') {
                    ctx.fillStyle = '#ff8800'; ctx.beginPath(); ctx.arc(i.x + i.w/2, i.y + i.h/2, i.w/2, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#ffff00'; ctx.beginPath(); ctx.arc(i.x + i.w/2, i.y + i.h/2, i.w/4, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#00a800'; ctx.fillRect(i.x + i.w/2 - 2, i.y + i.h/2 + 5, 4, 10);
                } else if (i.type === 'coin_anim') {
                    ctx.fillStyle = '#ffff00'; ctx.beginPath(); ctx.ellipse(i.x + i.w/2, i.y + i.h/2, i.w/4, i.h/2, 0, 0, Math.PI*2); ctx.fill();
                    ctx.strokeStyle = '#ffaa00'; ctx.stroke();
                }
            }

            for (let f of fireballs) {
                if (!f.active) continue;
                ctx.fillStyle = '#ff4400'; ctx.beginPath(); ctx.arc(f.x + f.w/2, f.y + f.h/2, f.w/2, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#ffff00'; ctx.beginPath(); ctx.arc(f.x + f.w/2, f.y + f.h/2, f.w/4, 0, Math.PI*2); ctx.fill();
            }

            for (let e of enemies) {
                if (!e.active) continue;
                
                if (e.type === 'koopa') {
                    if (e.state === 'shell_idle' || e.state === 'shell_moving' || e.state === 'burned') {
                        ctx.fillStyle = (e.state === 'burned') ? '#444' : '#00a800';
                        ctx.beginPath(); ctx.arc(e.x + e.w/2, e.y + e.h, e.w/2, Math.PI, 0); ctx.fill();
                        ctx.fillStyle = (e.state === 'burned') ? '#222' : '#ffcc99'; ctx.fillRect(e.x, e.y + e.h - 5, e.w, 5);
                    } else {
                        ctx.fillStyle = '#ffcc99'; ctx.fillRect(e.x + 8, e.y + 5, 16, 15);
                        ctx.fillStyle = '#00a800';
                        if (e.vx > 0) { ctx.beginPath(); ctx.arc(e.x + 10, e.y + 30, 15, Math.PI/2, Math.PI*1.5); ctx.fill(); }
                        else { ctx.beginPath(); ctx.arc(e.x + 22, e.y + 30, 15, -Math.PI/2, Math.PI/2); ctx.fill(); }
                        ctx.fillStyle = '#000';
                        if (e.vx > 0) ctx.fillRect(e.x + 18, e.y + 8, 4, 4); else ctx.fillRect(e.x + 10, e.y + 8, 4, 4);
                        ctx.fillStyle = '#00a800'; let fOffset = Math.sin(frameCount * 0.1) * 3;
                        ctx.fillRect(e.x + 4, e.y + e.h - 5 + fOffset, 10, 5); ctx.fillRect(e.x + e.w - 14, e.y + e.h - 5 - fOffset, 10, 5);
                    }
                } else {
                    if (e.state === 'squished') { ctx.fillStyle = '#8f3900'; ctx.fillRect(e.x, e.y + e.h - 10, e.w, 10);
                    } else if (e.state === 'burned') {
                        ctx.fillStyle = '#444'; ctx.beginPath(); ctx.arc(e.x + e.w/2, e.y + e.h/2, e.w/2, Math.PI, 0);
                        ctx.lineTo(e.x + e.w, e.y + e.h - 5); ctx.lineTo(e.x, e.y + e.h - 5); ctx.fill();
                    } else {
                        ctx.fillStyle = '#8f3900'; ctx.beginPath(); ctx.arc(e.x + e.w/2, e.y + e.h/2, e.w/2, Math.PI, 0);
                        ctx.lineTo(e.x + e.w, e.y + e.h - 5); ctx.lineTo(e.x, e.y + e.h - 5); ctx.fill();
                        ctx.fillStyle = '#fff'; ctx.fillRect(e.x + 8, e.y + 8, 4, 8); ctx.fillRect(e.x + 20, e.y + 8, 4, 8);
                        ctx.fillStyle = '#000'; ctx.fillRect(e.x + 10, e.y + 10, 2, 4); ctx.fillRect(e.x + 20, e.y + 10, 2, 4);
                        let fOffset = Math.sin(frameCount * 0.1) * 3;
                        ctx.fillRect(e.x + 4, e.y + e.h - 5 + fOffset, 10, 5); ctx.fillRect(e.x + e.w - 14, e.y + e.h - 5 - fOffset, 10, 5);
                    }
                }
            }

            if (player.invincibleTimer % 10 < 5 && !player.dead) {
                ctx.save();
                if (!player.grounded) {
                    ctx.translate(player.x + player.w/2, player.y + player.h/2);
                    ctx.translate(-player.x - player.w/2, -player.y - player.h/2);
                }

                let hatColor = player.state === 'fire' ? '#ffffff' : '#ff0000';
                let overallColor = player.state === 'fire' ? '#ff0000' : '#0000ff';
                ctx.fillStyle = hatColor; ctx.fillRect(player.x, player.y, player.w, player.h);
                
                ctx.fillStyle = '#ffcc99'; 
                let fR = player.facingRight;
                let isBig = (player.state === 'big' || player.state === 'fire');
                let hOffset = isBig && !player.crouching ? 15 : 0;
                
                if (player.dead) {
                    ctx.fillRect(player.x + 5, player.y + 5 + hOffset, 20, 15);
                    ctx.fillStyle = '#000'; ctx.fillText('x x', player.x + 15, player.y + 15 + hOffset);
                } else if (player.crouching) {
                    // Crouching draw
                    ctx.fillRect(player.x + (fR ? 10 : 0), player.y + 5, 20, 15);
                    ctx.fillStyle = hatColor; ctx.fillRect(player.x, player.y, 30, 8);
                    ctx.fillStyle = overallColor; ctx.fillRect(player.x, player.y + 20, 30, 10);
                } else {
                    if (fR) {
                        ctx.fillRect(player.x + 10, player.y + 5, 20, 15 + hOffset/2);
                        ctx.fillStyle = '#000'; ctx.fillRect(player.x + 22, player.y + 8, 4, 4); ctx.fillRect(player.x + 24, player.y + 14, 8, 4); 
                        ctx.fillStyle = hatColor; ctx.fillRect(player.x + 5, player.y - 2, 25, 8); ctx.fillRect(player.x + 20, player.y + 2, 15, 4);
                    } else {
                        ctx.fillRect(player.x, player.y + 5, 20, 15 + hOffset/2);
                        ctx.fillStyle = '#000'; ctx.fillRect(player.x + 4, player.y + 8, 4, 4); ctx.fillRect(player.x - 2, player.y + 14, 8, 4); 
                        ctx.fillStyle = hatColor; ctx.fillRect(player.x, player.y - 2, 25, 8); ctx.fillRect(player.x - 5, player.y + 2, 15, 4); 
                    }
                    ctx.fillStyle = overallColor; 
                    let overallH = isBig ? 20 : 10;
                    ctx.fillRect(player.x, player.y + 20 + hOffset/2, player.w, overallH);
                    
                    if (player.grounded && Math.abs(player.vx) > 0.1) {
                        let step = Math.sin(player.walkTimer * 0.5) * 5; ctx.fillStyle = '#8f3900';
                        ctx.fillRect(player.x, player.y + player.h - 5, 10, 5 + step); ctx.fillRect(player.x + player.w - 10, player.y + player.h - 5, 10, 5 - step);
                    } else if (!player.grounded) {
                        ctx.fillStyle = '#8f3900';
                        if (fR) { ctx.fillRect(player.x, player.y + player.h - 8, 10, 5); ctx.fillRect(player.x + player.w - 10, player.y + player.h - 3, 10, 5); }
                        else { ctx.fillRect(player.x, player.y + player.h - 3, 10, 5); ctx.fillRect(player.x + player.w - 10, player.y + player.h - 8, 10, 5); }
                    }
                }
                ctx.restore();
            }

            ctx.restore();

            if (gameState === 'gameover') {
                ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = 'red'; ctx.font = 'bold 48px Courier New'; ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', canvas.width/2, canvas.height/2 - 20);
                ctx.fillStyle = 'white'; ctx.font = '24px Courier New'; ctx.fillText('Press SPACE to restart', canvas.width/2, canvas.height/2 + 30);
                if (keys.Space) { gameState = 'title'; keys.Space = false; }
            }
            if (gameState === 'clear') {
                ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = 'yellow'; ctx.font = 'bold 48px Courier New'; ctx.textAlign = 'center';
                ctx.fillText('STAGE CLEAR!', canvas.width/2, canvas.height/2 - 30);
                ctx.fillStyle = 'white'; ctx.font = '24px Courier New'; ctx.fillText('Final Score: ' + score, canvas.width/2, canvas.height/2 + 20);
                ctx.fillText('Press SPACE to play again', canvas.width/2, canvas.height/2 + 60);
                if (keys.Space) { gameState = 'title'; keys.Space = false; }
            }
        }

        function loop(timestamp) { 
            frameCount++;
            if (gameState === 'playing') update(); 
            else if (gameState === 'title' && keys.Space) { keys.Space = false; init(); }
            draw(); 
            requestAnimationFrame(loop); 
        }
        requestAnimationFrame(loop);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BOMBER BLAST</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg1:#141826; --bg2:#0a0d16; --line:#39415e;
    --ink:#e8ecff; --accent:#ffd166; --accent2:#4ecdc4;
  }
  html,body{height:100%}
  body{
    background:radial-gradient(circle at 50% 0%,var(--bg1),var(--bg2) 70%);
    color:var(--ink);
    font-family:"Segoe UI","Hiragino Kaku Gothic ProN",Meiryo,system-ui,sans-serif;
    display:flex;align-items:center;justify-content:center;
    min-height:100dvh;padding:6px;
    -webkit-user-select:none;user-select:none;touch-action:manipulation;
    overflow:hidden;
  }
  #wrap{display:flex;flex-direction:column;align-items:center;gap:6px;max-width:100%}

  /* ---------- HUD ---------- */
  #hud{
    width:min(96vw,600px);display:flex;align-items:center;gap:9px;flex-wrap:wrap;
    background:linear-gradient(180deg,#242b42,#1a2033);
    border:2px solid var(--line);border-radius:10px;padding:6px 9px;
    font-size:13px;letter-spacing:.03em;box-shadow:0 6px 18px rgba(0,0,0,.45);
  }
  .st{display:flex;align-items:center;gap:5px;white-space:nowrap}
  .st b{font-size:15px;color:var(--accent);font-variant-numeric:tabular-nums}
  .lbl{font-size:10px;opacity:.65;letter-spacing:.12em}
  .sep{width:1px;height:18px;background:var(--line)}
  #powers{margin-left:auto;display:flex;gap:7px;align-items:center}
  .pw{display:flex;align-items:center;gap:3px;font-size:12px}
  .pw i{width:14px;height:14px;display:inline-block;border-radius:4px}
  .pw.off{opacity:.25}
  #timeBar{width:100%;height:5px;border-radius:3px;background:#0e1220;overflow:hidden}
  #timeFill{height:100%;width:100%;background:linear-gradient(90deg,#4ecdc4,#ffd166);transition:width .2s linear}

  /* ---------- VS HUD ---------- */
  #vsHud{width:min(96vw,600px);display:none;gap:5px}
  #vsHud.on{display:flex}
  .pcard{
    flex:1;min-width:0;background:linear-gradient(180deg,#242b42,#1a2033);
    border:2px solid var(--line);border-radius:9px;padding:4px 6px;
    display:flex;flex-direction:column;gap:2px;font-size:10.5px;
  }
  .pcard.dead{opacity:.35}
  .pcard.miso{opacity:.82;border-color:#7a4fd6}
  .pcard .nm{display:flex;align-items:center;gap:4px;font-weight:800;white-space:nowrap}
  .pcard .dot{width:11px;height:11px;border-radius:50%;border:1.5px solid rgba(0,0,0,.5);flex:0 0 auto}
  .pcard .sts{display:flex;gap:6px;opacity:.9;font-variant-numeric:tabular-nums}
  .pips{display:flex;gap:2px}
  .pip{width:7px;height:7px;border-radius:50%;background:#39415e}
  .pip.on{background:var(--accent)}

  /* ---------- stage ---------- */
  #stagebox{position:relative;line-height:0}
  canvas{
    width:min(96vw,600px);aspect-ratio:15/13;height:auto;display:block;
    border:3px solid var(--line);border-radius:8px;
    background:#1b6b3a;box-shadow:0 10px 30px rgba(0,0,0,.55);
  }
  /* ---------- overlay ---------- */
  #ov{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:11px;text-align:center;
    background:rgba(8,10,20,.8);backdrop-filter:blur(3px);
    border-radius:8px;line-height:1.55;padding:14px;overflow-y:auto;
  }
  #ov.hide{display:none}
  #ov h1{
    font-size:clamp(24px,6.5vw,42px);letter-spacing:.08em;
    background:linear-gradient(180deg,#fff,#ffd166 60%,#ff8a3d);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  #ov h2{font-size:clamp(17px,4.6vw,26px);color:var(--accent)}
  #ov p{font-size:clamp(11px,2.8vw,13.5px);opacity:.9;max-width:460px}
  #ov .keys{
    display:grid;grid-template-columns:auto auto;gap:3px 14px;font-size:11.5px;
    background:rgba(255,255,255,.05);border:1px solid var(--line);
    border-radius:8px;padding:9px 13px;text-align:left;
  }
  #ov .keys span:nth-child(odd){color:var(--accent2);font-weight:700}
  .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .big{
    background:linear-gradient(180deg,#ffd166,#ff8c1a);border:3px solid #fff8ec;color:#3a2410;
    border-radius:11px;padding:9px 20px;font-size:15px;font-weight:900;cursor:pointer;
    box-shadow:0 4px 0 rgba(0,0,0,.45);letter-spacing:.05em;
  }
  .big.alt{background:linear-gradient(180deg,#9be7ff,#3d8bff);color:#04203a}
  .big:active{transform:translateY(4px);box-shadow:none}
  .opt{
    background:linear-gradient(180deg,#2b3350,#1a2036);border:2px solid var(--line);
    color:var(--ink);border-radius:9px;padding:6px 13px;font-size:12.5px;font-weight:700;cursor:pointer;
  }
  .opt.sm{padding:4px 9px;font-size:11px}
  .opt.on{background:linear-gradient(180deg,#4a5680,#2b3350);border-color:var(--accent);color:#fff}
  .grp{display:flex;flex-direction:column;gap:4px;align-items:center}
  .grp .cap{font-size:10px;opacity:.62;letter-spacing:.12em}
  .blink{animation:bl 1s steps(2,end) infinite}
  @keyframes bl{50%{opacity:.15}}

  /* ---------- touch ---------- */
  #pad{display:none;width:min(96vw,600px);justify-content:space-between;align-items:center;margin-top:2px}
  #dpad{display:grid;grid-template-columns:repeat(3,50px);grid-template-rows:repeat(3,50px);gap:4px}
  .btn{
    background:linear-gradient(180deg,#2b3350,#1a2036);border:2px solid var(--line);
    color:var(--ink);border-radius:10px;font-size:17px;display:flex;
    align-items:center;justify-content:center;touch-action:none;
  }
  .btn:active,.btn.on{background:linear-gradient(180deg,#4a5680,#2b3350);border-color:var(--accent)}
  #actBtns{display:flex;flex-direction:column;gap:5px;align-items:center}
  #bombBtn{width:78px;height:78px;border-radius:50%;font-size:13px;font-weight:800}
  #detBtn{width:78px;height:34px;border-radius:10px;font-size:11px;font-weight:800}
  body.touch #pad{display:flex}
  @media(max-height:780px){#hud{font-size:12px;padding:5px 8px}}
</style>
</head>
<body>
<div id="wrap">

  <div id="hud">
    <div class="st"><span class="lbl">STAGE</span><b id="hStage">1</b></div>
    <div class="sep"></div>
    <div class="st"><span class="lbl">SCORE</span><b id="hScore">0</b></div>
    <div class="sep"></div>
    <div class="st"><span class="lbl">REST</span><b id="hEnemy">0</b></div>
    <div class="sep"></div>
    <div class="st"><span class="lbl">LIFE</span><b id="hLife">♥♥♥</b></div>
    <div id="powers">
      <div class="pw" id="pwBomb"><i style="background:#2b2f3d;border:2px solid #6f7590"></i><span id="hBomb">1</span></div>
      <div class="pw" id="pwFire"><i style="background:linear-gradient(180deg,#ffd166,#ff5a3d)"></i><span id="hFire">2</span></div>
      <div class="pw" id="pwSpeed"><i style="background:linear-gradient(180deg,#9be7ff,#3d8bff)"></i><span id="hSpeed">1</span></div>
      <div class="pw off" id="pwKick"><i style="background:linear-gradient(180deg,#c792ea,#7a4fd6)"></i><span>K</span></div>
      <div class="pw off" id="pwRemote"><i style="background:linear-gradient(180deg,#7ef0a0,#22a35a)"></i><span>R</span></div>
      <div class="pw off" id="pwWall"><i style="background:linear-gradient(180deg,#ffd9a0,#c07a3a)"></i><span>W</span></div>
    </div>
    <div id="timeBar"><div id="timeFill"></div></div>
  </div>

  <div id="vsHud"></div>

  <div id="stagebox">
    <canvas id="game"></canvas>
    <div id="ov"></div>
  </div>

  <div id="pad">
    <div id="dpad">
      <div></div><div class="btn" data-dir="up">▲</div><div></div>
      <div class="btn" data-dir="left">◀</div><div></div><div class="btn" data-dir="right">▶</div>
      <div></div><div class="btn" data-dir="down">▼</div><div></div>
    </div>
    <div id="actBtns">
      <div class="btn" id="bombBtn">BOMB</div>
      <div class="btn" id="detBtn">起爆</div>
    </div>
  </div>

</div>

<script>
(() => {
'use strict';

/* ============================================================
   定数
============================================================ */
const COLS=15, ROWS=13, TILE=40, W=COLS*TILE, H=ROWS*TILE;
const EMPTY=0, HARD=1, BRICK=2;
const FUSE=2.4, FLAME_LIFE=0.46, RESPAWN_INVUL=2.2;
const STAGE_TIME=200;
const VS_TIME=120, SD_START=45;      // VS：制限時間 と サドンデス開始残り秒
const CHAIN_DELAY=0.15;              // 誘爆までの間（ドミノ倒し風）
const END_GRACE=0.15;                // この間に全滅したら引き分け
const DIRS={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
const OPPOSITE={up:'down',down:'up',left:'right',right:'left'};
const F_C=1, F_H=2, F_V=4;
const AIL_TIME=12;

const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
const dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1));
canvas.width=W*dpr; canvas.height=H*dpr;
ctx.setTransform(dpr,0,0,dpr,0,0);

const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; const t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
const cellOf=v=>Math.floor(v/TILE);

/* ============================================================
   サウンド（WebAudio・外部ファイル不要）
============================================================ */
let AC=null, master=null;
function ac(){
  if(!AC){
    try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; }
    master=AC.createGain(); master.gain.value=0.9; master.connect(AC.destination);
  }
  if(AC.state==='suspended') AC.resume();
  return AC;
}
function tone(f,dur,type,vol,to){
  const a=ac(); if(!a) return;
  const o=a.createOscillator(), g=a.createGain();
  o.type=type||'square';
  o.frequency.setValueAtTime(f,a.currentTime);
  if(to) o.frequency.exponentialRampToValueAtTime(Math.max(30,to),a.currentTime+dur);
  g.gain.setValueAtTime(vol==null?0.12:vol,a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0008,a.currentTime+dur);
  o.connect(g); g.connect(master); o.start(); o.stop(a.currentTime+dur+0.03);
}
function noiseBurst(dur,vol){
  const a=ac(); if(!a) return;
  const n=Math.floor(a.sampleRate*dur), buf=a.createBuffer(1,n,a.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.2);
  const s=a.createBufferSource(); s.buffer=buf;
  const f=a.createBiquadFilter(); f.type='lowpass';
  f.frequency.setValueAtTime(1800,a.currentTime);
  f.frequency.exponentialRampToValueAtTime(140,a.currentTime+dur);
  const g=a.createGain(); g.gain.value=vol||0.3;
  s.connect(f); f.connect(g); g.connect(master); s.start();
}
const SFX={
  place(){ tone(240,0.07,'square',0.10,130); },
  boom(){ noiseBurst(0.45,0.30); tone(95,0.32,'sawtooth',0.10,38); },
  item(){ [660,880,1320].forEach((f,i)=>setTimeout(()=>tone(f,0.09,'square',0.11),i*70)); },
  skull(){ [400,330,260].forEach((f,i)=>setTimeout(()=>tone(f,0.14,'sawtooth',0.10),i*90)); },
  kill(){ tone(320,0.13,'square',0.10,760); },
  dead(){ tone(420,0.55,'sawtooth',0.16,55); },
  kick(){ tone(150,0.07,'triangle',0.11,320); },
  detonate(){ tone(1200,0.05,'square',0.09,300); },
  clear(){ [523,659,784,1046,1318].forEach((f,i)=>setTimeout(()=>tone(f,0.15,'triangle',0.14),i*105)); },
  over(){ [392,330,262,196].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.15),i*190)); },
  drop(){ noiseBurst(0.16,0.22); tone(180,0.12,'square',0.08,70); },
  round(){ [784,988,1318].forEach((f,i)=>setTimeout(()=>tone(f,0.13,'square',0.12),i*90)); }
};

/* ---- BGM（オリジナルの8bitループ） ---- */
const BGM={
  on:true, playing:false, step:0, next:0, timer:null, bpm:150,
  lead:[76,0,79,0,83,0,79,0, 81,0,78,0,74,0,0,0, 76,0,79,0,84,0,83,0, 79,0,76,0,72,0,0,0,
        74,0,77,0,81,0,77,0, 79,0,76,0,72,0,0,0, 74,0,79,0,83,0,86,0, 84,0,79,0,76,0,0,0],
  bass:[40,0,52,0,40,0,52,0, 38,0,50,0,38,0,50,0, 41,0,53,0,41,0,53,0, 43,0,55,0,43,0,55,0,
        40,0,52,0,40,0,52,0, 38,0,50,0,38,0,50,0, 41,0,53,0,41,0,53,0, 45,0,57,0,47,0,59,0],
  start(){
    const a=ac(); if(!a||this.playing||!this.on) return;
    this.playing=true; this.step=0; this.next=a.currentTime+0.06;
    this.timer=setInterval(()=>this.tick(),26);
  },
  stop(){
    this.playing=false;
    if(this.timer){ clearInterval(this.timer); this.timer=null; }
  },
  tick(){
    const a=ac(); if(!a||!this.playing) return;
    const spb=60/this.bpm/4;                        // 16分音符
    while(this.next < a.currentTime+0.18){
      const s=this.step%this.lead.length;
      const t=this.next;
      const ln=this.lead[s], bn=this.bass[s];
      if(ln) this.note(ln,t,spb*1.7,'square',0.045);
      if(bn) this.note(bn,t,spb*1.5,'triangle',0.075);
      if(s%4===0) this.hit(t,0.05,900);             // キック
      if(s%4===2) this.hit(t,0.02,5000);            // ハイハット
      this.next+=spb; this.step++;
    }
  },
  note(midi,t,dur,type,vol){
    const a=ac(); const f=440*Math.pow(2,(midi-69)/12);
    const o=a.createOscillator(), g=a.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(vol,t+0.008);
    g.gain.exponentialRampToValueAtTime(0.0006,t+dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.02);
  },
  hit(t,dur,freq){
    const a=ac();
    const n=Math.floor(a.sampleRate*dur), b=a.createBuffer(1,n,a.sampleRate), d=b.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
    const s=a.createBufferSource(); s.buffer=b;
    const f=a.createBiquadFilter(); f.type=freq>2000?'highpass':'lowpass'; f.frequency.value=freq;
    const g=a.createGain(); g.gain.value=freq>2000?0.05:0.16;
    s.connect(f); f.connect(g); g.connect(master); s.start(t);
  }
};

/* ============================================================
   カラー（色違いボンバー）
============================================================ */
const COLORS=[
  {id:'white', name:'シロ', body:'#ffffff', shade:'#c6d2f0', helm:'#7fb2ff', helm2:'#2f5fd0', cape:'#2f5fd0', dot:'#dfe8ff'},
  {id:'black', name:'クロ', body:'#5b6076', shade:'#343949', helm:'#8d94ad', helm2:'#3a4058', cape:'#3a4058', dot:'#9aa2bd'},
  {id:'red',   name:'アカ', body:'#ff8f8f', shade:'#d1494f', helm:'#ff6b6b', helm2:'#b52d3a', cape:'#b52d3a', dot:'#ff6b6b'},
  {id:'blue',  name:'アオ', body:'#8fd3ff', shade:'#3d7ec4', helm:'#4ecdc4', helm2:'#1d7a86', cape:'#1d7a86', dot:'#4aa8ff'},
  {id:'green', name:'ミドリ',body:'#b6f0a0', shade:'#5aa83e', helm:'#7ee06a', helm2:'#2f7a2a', cape:'#2f7a2a', dot:'#7ee06a'}
];

/* ============================================================
   アイテム
============================================================ */
const ITEM_NAMES={
  fire:'ファイア＋', bomb:'ボム＋', speed:'スピード＋', kick:'キック！',
  remote:'リモコン！', wall:'かべぬけ！', bombpass:'ボムぬけ！',
  heart:'ハート！', life:'1UP', skull:'ドクロ…'
};
// VSで出現させるアイテム（リモコンはVSでは出さない）
const VS_ITEMS=[
  {id:'fire',    label:'ファイア', w:4},
  {id:'bomb',    label:'ボム',     w:4},
  {id:'speed',   label:'スピード', w:2},
  {id:'kick',    label:'キック',   w:2},
  {id:'wall',    label:'かべぬけ', w:1},
  {id:'bombpass',label:'ボムぬけ', w:1},
  {id:'heart',   label:'ハート',   w:1},
  {id:'skull',   label:'ドクロ',   w:2}
];
const AILMENTS=['slow','hyper','minfire','autobomb','nobomb','reverse'];
const AIL_LABEL={slow:'のろい',hyper:'ダッシュ',minfire:'火力ダウン',autobomb:'れんしゃ',nobomb:'ボム禁止',reverse:'ぎゃく操作'};

/* ============================================================
   敵（ストーリー）
============================================================ */
const ENEMY_TYPES={
  balloon:{color:'#ff6b6b',dark:'#b53a3a',speed:42,chase:0,   ghost:false,score:100},
  bee    :{color:'#ffd166',dark:'#c08a1e',speed:64,chase:0.28,ghost:false,score:200},
  slime  :{color:'#4ecdc4',dark:'#25807a',speed:54,chase:0.55,ghost:false,score:300},
  ghost  :{color:'#c792ea',dark:'#7a4fd6',speed:44,chase:0.40,ghost:true, score:500}
};

/* ============================================================
   状態
============================================================ */
let grid, items, hidden, exitCell;
let bombs, enemies, particles, popups, drops, throws=[];
let flameT, flameF, flameOwn;
let bombers=[];
let stage, score, lives, timeLeft;
let scene='title';                 // title / story / vs
let mode='title';                  // title / play / dying / clear / gameover / pause / roundend / matchend
let modeTimer=0, shake=0, tick=0, bfsDist=null, bfsTimer=0;
let entityId=1, banner=null;
let vsCfg={players:4, humans:1, cpu:'normal', winsNeeded:3, misobon:1,
  items:{fire:true,bomb:true,speed:true,kick:true,wall:true,bombpass:true,heart:true,skull:true}};
let vsSpiral=[], vsSpiralIdx=0, vsSdTimer=0, vsRound=1, endGrace=-1;

/* ============================================================
   ボンバー生成
============================================================ */
const CORNERS=[[1,1],[COLS-2,ROWS-2],[COLS-2,1],[1,ROWS-2]];
function makeBomber(idx,color,ctrl){
  const c=CORNERS[idx%4];
  return {
    id:idx, entId:idx, col:color, name:color.name,
    x:c[0]*TILE+TILE/2, y:c[1]*TILE+TILE/2, home:[c[0],c[1]],
    r:TILE*0.33, dir:'down', speed:96, spd:1,
    maxBombs:1, bombsOut:0, range:2,
    kick:false, remote:false, wallPass:false, bombPass:false, shield:false,
    ail:null, ailT:0, ailLock:0,
    alive:true, invul:RESPAWN_INVUL, walk:0, wins:0,
    cpu:!!(ctrl&&ctrl.cpu), aim:null, think:0, pressed:[], bombEdge:false, detEdge:false,
    misobon:false, mdir:null,
    ghost:false, deadT:0
  };
}

/* ============================================================
   マップ生成
============================================================ */
function blankGrid(){
  grid=[]; items=[]; flameT=[]; flameF=[]; flameOwn=[]; throws=[];
  for(let y=0;y<ROWS;y++){
    grid.push([]); items.push([]); flameT.push([]); flameF.push([]); flameOwn.push([]);
    for(let x=0;x<COLS;x++){
      items[y][x]=null; flameT[y][x]=0; flameF[y][x]=0; flameOwn[y][x]=null;
      let t=EMPTY;
      if(x===0||y===0||x===COLS-1||y===ROWS-1) t=HARD;
      else if(x%2===0 && y%2===0) t=HARD;
      grid[y].push(t);
    }
  }
}
function safeCellsFor(list){
  const s=new Set();
  for(const [cx,cy] of list){
    s.add(cx+','+cy);
    for(const k in DIRS){
      const d=DIRS[k];
      s.add((cx+d[0])+','+(cy+d[1]));
      s.add((cx+d[0]*2)+','+(cy+d[1]*2));
    }
  }
  return s;
}

function newStage(){
  blankGrid();
  hidden=new Map(); bombs=[]; enemies=[]; particles=[]; popups=[]; drops=[];
  exitCell=null; timeLeft=STAGE_TIME;

  const p=bombers[0];
  const safe=safeCellsFor([p.home]);
  const brickCells=[];
  const density=Math.min(0.82,0.68+stage*0.02);
  for(let y=1;y<ROWS-1;y++)for(let x=1;x<COLS-1;x++){
    if(grid[y][x]!==EMPTY||safe.has(x+','+y)) continue;
    if(Math.random()<density){ grid[y][x]=BRICK; brickCells.push([x,y]); }
  }
  if(brickCells.length<10){
    for(let y=3;y<ROWS-1&&brickCells.length<10;y+=2)
      for(let x=3;x<COLS-1&&brickCells.length<10;x+=2)
        if(grid[y][x]===EMPTY){ grid[y][x]=BRICK; brickCells.push([x,y]); }
  }
  shuffle(brickCells);
  const drops1=['exit','fire','fire','bomb','bomb','speed'];
  if(stage>=2) drops1.push('fire','remote');
  if(stage>=3) drops1.push('bomb','wall');
  if(!p.kick) drops1.push('kick');
  if(stage>=2) drops1.push('heart');
  if(stage%3===0) drops1.push('life');
  if(stage>=2) drops1.push('skull');
  for(let i=0;i<drops1.length&&i<brickCells.length;i++){
    const c=brickCells[i];
    hidden.set(c[1]*COLS+c[0],drops1[i]);
  }
  const spots=[];
  for(let y=1;y<ROWS-1;y++)for(let x=1;x<COLS-1;x++){
    if(grid[y][x]!==EMPTY) continue;
    if(Math.abs(x-1)+Math.abs(y-1)<6) continue;
    spots.push([x,y]);
  }
  shuffle(spots);
  const plan=enemyPlan(stage);
  for(let i=0;i<plan.length&&i<spots.length;i++)
    enemies.push(makeEnemy(plan[i],spots[i][0],spots[i][1]));

  resetBomber(p,true);
}
function enemyPlan(s){
  const n=Math.min(3+Math.floor(s*0.9),10), list=[];
  for(let i=0;i<n;i++){
    const r=Math.random()+s*0.09;
    if(s>=4&&r>1.20) list.push('ghost');
    else if(s>=3&&r>0.98) list.push('slime');
    else if(s>=2&&r>0.72) list.push('bee');
    else list.push('balloon');
  }
  return list;
}
function makeEnemy(type,cx,cy){
  const d=ENEMY_TYPES[type];
  return {
    entId:100+entityId++, type, x:cx*TILE+TILE/2, y:cy*TILE+TILE/2, r:TILE*0.34,
    speed:d.speed+stage*1.5, ghost:d.ghost, chase:d.chase,
    color:d.color, dark:d.dark, score:d.score,
    dir:DIRS[shuffle(['up','down','left','right'])[0]], alive:true, wob:Math.random()*6
  };
}

/* --- VS：4隅対称マップ --- */
function newVsRound(){
  blankGrid();
  hidden=new Map(); bombs=[]; enemies=[]; particles=[]; popups=[]; drops=[];
  exitCell=null; timeLeft=VS_TIME;
  vsSpiral=spiralOrder(); vsSpiralIdx=0; vsSdTimer=0; endGrace=-1;

  const homes=bombers.map(b=>b.home);
  const safe=safeCellsFor(homes);
  const brickCells=[];
  for(let y=1;y<ROWS-1;y++)for(let x=1;x<COLS-1;x++){
    if(grid[y][x]!==EMPTY||safe.has(x+','+y)) continue;
    if(Math.random()<0.78){ grid[y][x]=BRICK; brickCells.push([x,y]); }
  }
  shuffle(brickCells);
  // 選ばれた種類だけを重み付きで抽選（種類を絞っても総数は変わらない）
  const wpool=[];
  for(const it of VS_ITEMS) if(vsCfg.items[it.id]) for(let i=0;i<it.w;i++) wpool.push(it.id);
  if(wpool.length){
    const n=Math.min(17,brickCells.length);
    for(let i=0;i<n;i++){
      const c=brickCells[i];
      hidden.set(c[1]*COLS+c[0], wpool[(Math.random()*wpool.length)|0]);
    }
  }
  for(const b of bombers) resetBomber(b,false);
}
function spiralOrder(){
  const cells=[];
  let x0=1,y0=1,x1=COLS-2,y1=ROWS-2;
  while(x0<=x1&&y0<=y1){
    for(let x=x0;x<=x1;x++) cells.push([x,y0]);
    for(let y=y0+1;y<=y1;y++) cells.push([x1,y]);
    if(y0<y1) for(let x=x1-1;x>=x0;x--) cells.push([x,y1]);
    if(x0<x1) for(let y=y1-1;y>y0;y--) cells.push([x0,y]);
    x0++;y0++;x1--;y1--;
  }
  return cells.filter(c=>grid[c[1]][c[0]]!==HARD);
}
function resetBomber(b,keepPowers){
  b.x=b.home[0]*TILE+TILE/2; b.y=b.home[1]*TILE+TILE/2;
  b.alive=true; b.invul=RESPAWN_INVUL; b.bombsOut=0; b.dir='down';
  b.ail=null; b.ailT=0; b.pressed.length=0; b.aim=null; b.deadT=0;
  b.misobon=false; b.mdir=null; b.ringIdx=null; b.ringDir=1; b.moving=false;
  if(!keepPowers){
    b.maxBombs=1; b.range=2; b.speed=96; b.spd=1;
    b.kick=false; b.remote=false; b.wallPass=false; b.bombPass=false; b.shield=false;
  }
}

/* ============================================================
   当たり判定
============================================================ */
function bombAt(cx,cy){
  for(const b of bombs) if(!b.dead && b.cx===cx && b.cy===cy) return b;
  return null;
}
function solidAt(cx,cy,ent){
  if(cx<0||cy<0||cx>=COLS||cy>=ROWS) return true;
  const t=grid[cy][cx];
  if(t===HARD) return true;
  if(t===BRICK) return !(ent&&(ent.ghost||ent.wallPass));
  const b=bombAt(cx,cy);
  if(b){
    if(ent&&ent.bombPass) return false;
    if(ent&&b.pass.has(ent.entId)) return false;
    return true;
  }
  return false;
}
function boxBlocked(x,y,e){
  const x0=Math.floor((x-e.r)/TILE), x1=Math.floor((x+e.r)/TILE);
  const y0=Math.floor((y-e.r)/TILE), y1=Math.floor((y+e.r)/TILE);
  for(let cy=y0;cy<=y1;cy++) for(let cx=x0;cx<=x1;cx++) if(solidAt(cx,cy,e)) return true;
  return false;
}
function tryMove(e,dx,dy){
  if(dx!==0){
    if(!boxBlocked(e.x+dx,e.y,e)) e.x+=dx;
    else{
      const s=Math.sign(dx);
      const col=Math.floor((e.x+s*(e.r+Math.abs(dx)))/TILE);
      const y0=Math.floor((e.y-e.r)/TILE), y1=Math.floor((e.y+e.r)/TILE);
      if(y0!==y1){
        const f0=!solidAt(col,y0,e), f1=!solidAt(col,y1,e);
        let row=-1;
        if(f0&&!f1) row=y0; else if(f1&&!f0) row=y1;
        if(row>=0){
          const ty=row*TILE+TILE/2, d=ty-e.y;
          const step=Math.sign(d)*Math.min(Math.abs(dx),Math.abs(d));
          if(!boxBlocked(e.x,e.y+step,e)) e.y+=step;
        }
      }
    }
  }
  if(dy!==0){
    if(!boxBlocked(e.x,e.y+dy,e)) e.y+=dy;
    else{
      const s=Math.sign(dy);
      const row=Math.floor((e.y+s*(e.r+Math.abs(dy)))/TILE);
      const x0=Math.floor((e.x-e.r)/TILE), x1=Math.floor((e.x+e.r)/TILE);
      if(x0!==x1){
        const f0=!solidAt(x0,row,e), f1=!solidAt(x1,row,e);
        let col=-1;
        if(f0&&!f1) col=x0; else if(f1&&!f0) col=x1;
        if(col>=0){
          const tx=col*TILE+TILE/2, d=tx-e.x;
          const step=Math.sign(d)*Math.min(Math.abs(dy),Math.abs(d));
          if(!boxBlocked(e.x+step,e.y,e)) e.x+=step;
        }
      }
    }
  }
}
function overlapsCell(e,cx,cy){
  return e.x+e.r>cx*TILE && e.x-e.r<(cx+1)*TILE &&
         e.y+e.r>cy*TILE && e.y-e.r<(cy+1)*TILE;
}
function entityInCell(cx,cy){
  for(const b of bombers) if(b.alive&&overlapsCell(b,cx,cy)) return true;
  for(const e of enemies) if(overlapsCell(e,cx,cy)) return true;
  return false;
}
function entById(id){
  for(const b of bombers) if(b.entId===id) return b;
  for(const e of enemies) if(e.entId===id) return e;
  return null;
}

/* ============================================================
   能力（状態異常込み）
============================================================ */
function effSpeed(b){
  if(b.ail==='slow') return b.speed*0.5;
  if(b.ail==='hyper') return b.speed*1.85;
  return b.speed;
}
function effRange(b){ return b.ail==='minfire' ? 1 : b.range; }
function canPlace(b){ return b.ail!=='nobomb'; }

/* ============================================================
   爆弾・爆風
============================================================ */
function placeBomb(b){
  if(!b.alive||!canPlace(b)) return false;
  if(b.bombsOut>=b.maxBombs) return false;
  const cx=cellOf(b.x), cy=cellOf(b.y);
  if(bombAt(cx,cy)||grid[cy][cx]!==EMPTY) return false;
  const bomb={
    cx,cy,x:cx*TILE+TILE/2,y:cy*TILE+TILE/2,
    t: b.remote ? 1e9 : FUSE, age:0, range:effRange(b), owner:b, dead:false,
    pass:new Set(), dir:null, remote:b.remote
  };
  for(const o of bombers) if(o.alive&&overlapsCell(o,cx,cy)) bomb.pass.add(o.entId);
  for(const e of enemies) if(overlapsCell(e,cx,cy)) bomb.pass.add(e.entId);
  bombs.push(bomb);
  b.bombsOut++;
  SFX.place();
  return true;
}
function detonate(b){
  let any=false;
  for(const bomb of bombs.slice()) if(bomb.owner===b && !bomb.dead){ explode(bomb); any=true; }
  if(any) SFX.detonate();
  return any;
}
function addFlame(cx,cy,flag,owner){
  flameT[cy][cx]=FLAME_LIFE;
  flameF[cy][cx]|=flag;
  if(owner) flameOwn[cy][cx]=owner;
}
// すぐには爆発させず、少し遅れて誘爆させる（ドミノ倒し）
function triggerBomb(b){
  if(b.dead) return;
  if(b.t>CHAIN_DELAY) b.t=CHAIN_DELAY;
}
function explode(b){
  if(b.dead) return;
  b.dead=true;
  if(b.owner) b.owner.bombsOut=Math.max(0,b.owner.bombsOut-1);
  addFlame(b.cx,b.cy,F_C|F_H|F_V,b.owner);
  for(const key in DIRS){
    const dx=DIRS[key][0], dy=DIRS[key][1];
    for(let i=1;i<=b.range;i++){
      const cx=b.cx+dx*i, cy=b.cy+dy*i;
      if(cx<0||cy<0||cx>=COLS||cy>=ROWS) break;
      const t=grid[cy][cx];
      if(t===HARD) break;
      if(t===BRICK){ breakBrick(cx,cy); addFlame(cx,cy,dx?F_H:F_V,b.owner); break; }
      addFlame(cx,cy,dx?F_H:F_V,b.owner);
      burnItem(cx,cy);
      const ob=bombAt(cx,cy);
      if(ob){ triggerBomb(ob); break; }
    }
  }
  shake=Math.max(shake,7);
  SFX.boom();
  for(let i=0;i<10;i++) particles.push({
    x:b.x,y:b.y,vx:rnd(-120,120),vy:rnd(-160,40),life:rnd(.3,.7),
    c:['#fff','#ffd166','#ff8a3d'][(Math.random()*3)|0],s:rnd(2,5),g:260
  });
}
function burnItem(cx,cy){
  if(!items[cy][cx]) return;
  items[cy][cx]=null;
  for(let i=0;i<7;i++) particles.push({
    x:cx*TILE+TILE/2,y:cy*TILE+TILE/2,vx:rnd(-70,70),vy:rnd(-120,-20),
    life:rnd(.2,.5),c:'#cfd8e6',s:rnd(2,4),g:300
  });
}
function breakBrick(cx,cy){
  grid[cy][cx]=EMPTY;
  const key=cy*COLS+cx, h=hidden.get(key);
  if(h==='exit') exitCell={cx,cy};
  else if(h) items[cy][cx]=h;
  hidden.delete(key);
  if(scene==='story') score+=10;
  for(let i=0;i<9;i++) particles.push({
    x:cx*TILE+TILE/2+rnd(-12,12), y:cy*TILE+TILE/2+rnd(-12,12),
    vx:rnd(-90,90), vy:rnd(-190,-40), life:rnd(.35,.8),
    c:['#c66a3a','#a8532c','#e0885a'][(Math.random()*3)|0], s:rnd(3,6), g:520
  });
}
function updateBombs(dt){
  for(const b of bombs){
    if(b.dead) continue;
    if(b.pass.size){
      for(const id of Array.from(b.pass)){
        const e=entById(id);
        if(!e || !overlapsCell(e,b.cx,b.cy)) b.pass.delete(id);
      }
    }
    if(b.dir){
      const dx=b.dir[0], dy=b.dir[1], sp=180*dt;
      const ccx=b.cx*TILE+TILE/2, ccy=b.cy*TILE+TILE/2;
      const ncx=b.cx+dx, ncy=b.cy+dy;
      const blocked = ncx<0||ncy<0||ncx>=COLS||ncy>=ROWS ||
                      grid[ncy][ncx]!==EMPTY || !!bombAt(ncx,ncy) || entityInCell(ncx,ncy);
      let nx=b.x+dx*sp, ny=b.y+dy*sp;
      if(blocked && ((dx>0&&nx>=ccx)||(dx<0&&nx<=ccx)||(dy>0&&ny>=ccy)||(dy<0&&ny<=ccy))){
        nx=ccx; ny=ccy; b.dir=null;
      }
      b.x=nx; b.y=ny;
      b.cx=cellOf(b.x); b.cy=cellOf(b.y);
      b.pass.clear();
    }
    b.age+=dt;
    if(flameT[b.cy][b.cx]>0) triggerBomb(b);
    b.t-=dt;
    if(b.t<=0) explode(b);
  }
  bombs=bombs.filter(b=>!b.dead);
}
function updateFlames(dt){
  for(let y=1;y<ROWS-1;y++)for(let x=1;x<COLS-1;x++){
    if(flameT[y][x]>0){
      flameT[y][x]-=dt;
      if(flameT[y][x]<=0){ flameT[y][x]=0; flameF[y][x]=0; flameOwn[y][x]=null; }
    }
  }
}

/* ============================================================
   ボンバー更新
============================================================ */
function bomberDir(b){
  let d = b.cpu ? b.aim : (b.pressed[b.pressed.length-1]||null);
  if(d && b.ail==='reverse') d=OPPOSITE[d];
  return d;
}
function updateBomber(b,dt){
  if(!b.alive) return;
  if(b.invul>0) b.invul-=dt;
  if(b.ailLock>0) b.ailLock-=dt;
  if(b.ail){
    b.ailT-=dt;
    if(b.ailT<=0){ b.ail=null; }
  }
  if(b.ail==='autobomb') placeBomb(b);

  if(b.bombEdge){ b.bombEdge=false; if(!placeBomb(b) && b.remote) detonate(b); }
  if(b.detEdge){ b.detEdge=false; if(b.remote) detonate(b); }

  const d=bomberDir(b);
  const bx=b.x, by=b.y;
  if(d){
    b.dir=d;
    const v=DIRS[d];
    tryMove(b, v[0]*effSpeed(b)*dt, v[1]*effSpeed(b)*dt);
    b.walk+=dt*9;
  }
  // 爆弾キック
  if(d && b.kick && !b.bombPass && Math.abs(b.x-bx)<0.4 && Math.abs(b.y-by)<0.4){
    const dx=DIRS[d][0], dy=DIRS[d][1];
    const bm=bombAt(cellOf(b.x)+dx, cellOf(b.y)+dy);
    if(bm && !bm.dir && !bm.pass.has(b.entId)){ bm.dir=[dx,dy]; SFX.kick(); }
  }

  const cx=cellOf(b.x), cy=cellOf(b.y);
  if(items[cy]&&items[cy][cx]) takeItem(b,cx,cy);

  if(scene==='story' && exitCell && cx===exitCell.cx && cy===exitCell.cy
     && enemies.length===0 && mode==='play'){ stageClear(); return; }

  if(b.invul<=0){
    if(flameT[cy][cx]>0) return hitBomber(b,'flame',flameOwn[cy][cx]);
    for(const e of enemies){
      if(Math.abs(e.x-b.x)<b.r+e.r-6 && Math.abs(e.y-b.y)<b.r+e.r-6) return hitBomber(b,'enemy');
    }
  }
  // ドクロは接触で相手にうつる（VSのお約束）
  if(scene==='vs' && b.ail && b.ailLock<=0){
    for(const o of bombers){
      if(o===b||!o.alive||o.ail||o.ailLock>0) continue;
      if(Math.abs(o.x-b.x)<b.r+o.r-4 && Math.abs(o.y-b.y)<b.r+o.r-4){
        o.ail=b.ail; o.ailT=b.ailT; o.ailLock=1.2;
        b.ail=null; b.ailT=0; b.ailLock=1.2;
        popups.push({x:o.x,y:o.y-40,text:'うつった！',life:1});
        SFX.skull();
        break;
      }
    }
  }
}
function takeItem(b,cx,cy){
  const t=items[cy][cx];
  items[cy][cx]=null;
  if(t==='bomb') b.maxBombs=Math.min(8,b.maxBombs+1);
  else if(t==='fire') b.range=Math.min(9,b.range+1);
  else if(t==='speed'){ b.spd=Math.min(5,b.spd+1); b.speed=Math.min(180,b.speed+16); }
  else if(t==='kick') b.kick=true;
  else if(t==='remote') b.remote=true;
  else if(t==='wall') b.wallPass=true;
  else if(t==='bombpass') b.bombPass=true;
  else if(t==='heart') b.shield=true;
  else if(t==='life'){ if(scene==='story') lives++; else b.shield=true; }
  else if(t==='skull'){
    b.ail=AILMENTS[(Math.random()*AILMENTS.length)|0];
    b.ailT=AIL_TIME; b.ailLock=1.0;
    popups.push({x:cx*TILE+TILE/2,y:cy*TILE+TILE/2,text:AIL_LABEL[b.ail],life:1.3});
    SFX.skull();
    return;
  }
  if(scene==='story') score+=200;
  popups.push({x:cx*TILE+TILE/2,y:cy*TILE+TILE/2,text:ITEM_NAMES[t]||'',life:1.1});
  SFX.item();
  for(let i=0;i<12;i++) particles.push({
    x:cx*TILE+TILE/2,y:cy*TILE+TILE/2,vx:rnd(-90,90),vy:rnd(-140,-20),
    life:rnd(.3,.7),c:'#ffe9a8',s:rnd(2,4),g:300
  });
}
function hitBomber(b,cause,killer){
  if(!b.alive) return;
  if(b.shield){                                  // ハートは1回だけ耐える
    b.shield=false; b.invul=1.6;
    popups.push({x:b.x,y:b.y-40,text:'ガード！',life:1});
    SFX.kick();
    return;
  }
  b.alive=false; b.deadT=0;
  for(const bomb of bombs) if(bomb.owner===b && !bomb.dead && bomb.t>1e8) bomb.t=rnd(0.8,1.6);
  shake=Math.max(shake,10);
  SFX.dead();
  for(let i=0;i<20;i++) particles.push({
    x:b.x,y:b.y,vx:rnd(-160,160),vy:rnd(-220,-30),
    life:rnd(.5,1.0),c:[b.col.body,'#fff','#ff6b6b'][(Math.random()*3)|0],s:rnd(2,5),g:420
  });
  if(scene==='story'){ mode='dying'; modeTimer=1.5; }
  else if(scene==='vs'){
    if(vsCfg.misobon) toMisobon(b);
    if(vsCfg.misobon && killer && killer!==b && killer.misobon) revive(killer);
    buildVsHud();
  }
}

/* ============================================================
   ミソボン：やられたら外枠へ。爆弾を投げて誰かを倒すと復活
============================================================ */
function isBorder(cx,cy){ return cx===0||cy===0||cx===COLS-1||cy===ROWS-1; }
// 外周を時計回りに一周ぶん並べた経路（角では自動で曲がれる）
const RING=(()=>{
  const c=[];
  for(let x=0;x<COLS;x++) c.push([x,0]);
  for(let y=1;y<ROWS;y++) c.push([COLS-1,y]);
  for(let x=COLS-2;x>=0;x--) c.push([x,ROWS-1]);
  for(let y=ROWS-2;y>=1;y--) c.push([0,y]);
  return c;
})();
const ringIndexOf=(cx,cy)=>RING.findIndex(c=>c[0]===cx&&c[1]===cy);
function misobonAt(cx,cy,self){
  for(const o of bombers) if(o!==self&&o.misobon&&cellOf(o.x)===cx&&cellOf(o.y)===cy) return true;
  return false;
}
function toMisobon(b){
  b.misobon=true; b.mdir=null; b.bombsOut=0; b.ail=null; b.ailT=0; b.aim=null;
  b.pressed.length=0; b.invul=0; b.shield=false;
  const cx=clamp(cellOf(b.x),1,COLS-2), cy=clamp(cellOf(b.y),1,ROWS-2);
  const cand=[[cx,0],[cx,ROWS-1],[0,cy],[COLS-1,cy]];
  let best=null, bd=1e9;
  for(const c of cand){
    if(misobonAt(c[0],c[1],b)) continue;
    const d=Math.abs(c[0]*TILE+TILE/2-b.x)+Math.abs(c[1]*TILE+TILE/2-b.y);
    if(d<bd){ bd=d; best=c; }
  }
  if(!best) best=[cx,0];
  b.x=best[0]*TILE+TILE/2; b.y=best[1]*TILE+TILE/2;
  b.ringIdx=Math.max(0,ringIndexOf(best[0],best[1]));
  b.ringDir=1; b.moving=false;
  popups.push({x:b.x,y:b.y-30,text:'ミソボン',life:1.1});
}
function freeSpot(x,y){
  if(grid[y][x]!==EMPTY||flameT[y][x]>0||bombAt(x,y)) return false;
  for(const o of bombers) if(o.alive&&overlapsCell(o,x,y)) return false;
  return true;
}
function revive(b){
  let best=null, bestScore=-1;
  for(let y=1;y<ROWS-1;y++)for(let x=1;x<COLS-1;x++){
    if(!freeSpot(x,y)) continue;
    let d=99;
    for(const o of bombers) if(o.alive&&o!==b)
      d=Math.min(d,Math.abs(cellOf(o.x)-x)+Math.abs(cellOf(o.y)-y));
    const score=d+((x===b.home[0]&&y===b.home[1])?100:0);
    if(score>bestScore){ bestScore=score; best=[x,y]; }
  }
  if(!best) return false;
  b.x=best[0]*TILE+TILE/2; b.y=best[1]*TILE+TILE/2;
  b.misobon=false; b.mdir=null; b.moving=false; b.alive=true; b.invul=RESPAWN_INVUL; b.bombsOut=0;
  banner={text:b.name+' ふっかつ！',t:1.5,color:b.col.dot};
  popups.push({x:b.x,y:b.y-40,text:'ふっかつ！',life:1.3});
  SFX.clear();
  buildVsHud();
  return true;
}
// 内側へ投げる：ブロックを飛び越えて最初の空きマスに落ちる
function throwTarget(b){
  const cx=cellOf(b.x), cy=cellOf(b.y);
  const onTop=cy===0, onBottom=cy===ROWS-1, onLeft=cx===0, onRight=cx===COLS-1;
  let dir=null;
  if((onTop||onBottom)&&(onLeft||onRight)){        // 角：斜め内側へ投げる
    dir=[onLeft?1:-1, onTop?1:-1];
  }
  else if(onTop) dir=[0,1];
  else if(onBottom) dir=[0,-1];
  else if(onLeft) dir=[1,0];
  else if(onRight) dir=[-1,0];
  if(!dir) return null;
  for(const from of [2,1]){
    for(let d=from;d<=8;d++){
      const x=cx+dir[0]*d, y=cy+dir[1]*d;
      if(x<1||y<1||x>COLS-2||y>ROWS-2) break;
      if(grid[y][x]===EMPTY && !bombAt(x,y)) return {cx:x,cy:y};
    }
  }
  return null;
}
function throwBomb(b){
  if(b.bombsOut>=b.maxBombs) return false;
  const t=throwTarget(b);
  if(!t) return false;
  b.bombsOut++;
  throws.push({owner:b, x0:b.x, y0:b.y, x1:t.cx*TILE+TILE/2, y1:t.cy*TILE+TILE/2,
               cx:t.cx, cy:t.cy, t:0, dur:0.5, range:effRange(b)});
  SFX.kick();
  return true;
}
function updateThrows(dt){
  for(const f of throws){
    f.t+=dt;
    if(f.t<f.dur) continue;
    f.done=true;
    if(grid[f.cy][f.cx]===EMPTY && !bombAt(f.cx,f.cy)){
      bombs.push({cx:f.cx,cy:f.cy,x:f.x1,y:f.y1,t:FUSE,age:0,range:f.range,
                  owner:f.owner,dead:false,pass:new Set(),dir:null,remote:false});
      SFX.place();
    }else{
      f.owner.bombsOut=Math.max(0,f.owner.bombsOut-1);
    }
  }
  throws=throws.filter(f=>!f.done);
}
function updateMisobon(b,dt){
  if(b.cpu) cpuMisobon(b,dt);
  if(b.bombEdge){ b.bombEdge=false; throwBomb(b); }
  b.detEdge=false;
  const step=118*dt, N=RING.length;
  if(b.ringIdx==null) b.ringIdx=Math.max(0,ringIndexOf(cellOf(b.x),cellOf(b.y)));

  // 停止中＝マスの中心にいる。入力から進む向きを決める
  if(!b.moving){
    const cur=RING[b.ringIdx];
    b.x=cur[0]*TILE+TILE/2; b.y=cur[1]*TILE+TILE/2;
    const d=b.cpu ? b.aim : (b.pressed[b.pressed.length-1]||null);
    if(d){
      const nc=RING[(b.ringIdx+1)%N], pc=RING[(b.ringIdx-1+N)%N];
      const vN=[nc[0]-cur[0],nc[1]-cur[1]], vP=[pc[0]-cur[0],pc[1]-cur[1]];
      const v=DIRS[d];
      // 押した向きに進めるならその向きへ。
      // 進めない向き（＝角や、外へ出る向き）なら今の進行方向のまま曲がって進む。
      if(v[0]===vN[0]&&v[1]===vN[1]) b.ringDir=1;
      else if(v[0]===vP[0]&&v[1]===vP[1]) b.ringDir=-1;
      const tc=RING[(b.ringIdx+b.ringDir+N)%N];
      b.moving=!misobonAt(tc[0],tc[1],b);      // 他のミソボンがいたら進まない
    }
  }
  // 隣のマスへ進む（角も経路どおりに曲がるので画面外に出ない）
  if(b.moving){
    const ni=(b.ringIdx+b.ringDir+N)%N, nc=RING[ni];
    const tx=nc[0]*TILE+TILE/2, ty=nc[1]*TILE+TILE/2;
    const dx=tx-b.x, dy=ty-b.y, dist=Math.sqrt(dx*dx+dy*dy);
    b.dir = Math.abs(dx)>Math.abs(dy) ? (dx>0?'right':'left') : (dy>0?'down':'up');
    if(dist<=step){ b.x=tx; b.y=ty; b.ringIdx=ni; b.moving=false; }
    else { b.x+=dx/dist*step; b.y+=dy/dist*step; }
    b.walk+=dt*7;
  }
}
function cpuMisobon(b,dt){
  b.think-=dt;
  if(b.think>0) return;
  b.think=0.16*rnd(0.8,1.3);
  let target=null, td=1e9;
  for(const o of bombers){
    if(!o.alive) continue;
    const d=Math.abs(o.x-b.x)+Math.abs(o.y-b.y);
    if(d<td){ td=d; target=o; }
  }
  if(!target){ b.aim=null; return; }
  const cx=cellOf(b.x), cy=cellOf(b.y);
  const tx=cellOf(target.x), ty=cellOf(target.y);
  const horiz=(cy===0||cy===ROWS-1);
  if((horiz && cx===tx) || (!horiz && cy===ty)){
    if(throwBomb(b)){ b.aim=null; return; }
  }
  if(horiz) b.aim = tx>cx ? 'right' : (tx<cx ? 'left' : null);
  else      b.aim = ty>cy ? 'down'  : (ty<cy ? 'up'   : null);
  if(!b.aim) b.aim = Math.random()<0.5 ? 'left' : 'right';
}

/* ============================================================
   CPU AI
============================================================ */
const CPU_PARAM={
  easy  :{think:0.24, aggro:0.35, itemWant:0.5, escapeMargin:0.55},
  normal:{think:0.14, aggro:0.65, itemWant:0.8, escapeMargin:0.42},
  hard  :{think:0.08, aggro:0.9,  itemWant:1.0, escapeMargin:0.3}
};
// 危険マップ：各セルが「あと何秒で炎になるか」
function buildDanger(self){
  const dz=[];
  for(let y=0;y<ROWS;y++){ dz.push(new Array(COLS).fill(Infinity)); }
  for(let y=1;y<ROWS-1;y++)for(let x=1;x<COLS-1;x++) if(flameT[y][x]>0) dz[y][x]=0;
  for(const b of bombs){
    if(b.dead) continue;
    if(b.remote && self && b.owner===self) continue;
    const t=b.remote?0.35:Math.max(0,b.t);
    if(t<dz[b.cy][b.cx]) dz[b.cy][b.cx]=t;
    for(const k in DIRS){
      const dx=DIRS[k][0], dy=DIRS[k][1];
      for(let i=1;i<=b.range;i++){
        const cx=b.cx+dx*i, cy=b.cy+dy*i;
        if(cx<0||cy<0||cx>=COLS||cy>=ROWS) break;
        const g=grid[cy][cx];
        if(g===HARD) break;
        if(t<dz[cy][cx]) dz[cy][cx]=t;
        if(g===BRICK) break;
      }
    }
  }
  return dz;
}
// 追加の爆弾を仮置きした危険マップ
function dangerWith(dz,cx,cy,range){
  const out=dz.map(r=>r.slice());
  const t=FUSE;
  if(t<out[cy][cx]) out[cy][cx]=t;
  for(const k in DIRS){
    const dx=DIRS[k][0], dy=DIRS[k][1];
    for(let i=1;i<=range;i++){
      const x=cx+dx*i, y=cy+dy*i;
      if(x<0||y<0||x>=COLS||y>=ROWS) break;
      const g=grid[y][x];
      if(g===HARD) break;
      if(t<out[y][x]) out[y][x]=t;
      if(g===BRICK) break;
    }
  }
  return out;
}
// 時間を考慮したBFS：通過中に爆発するマスは通らない（経路ごと安全）
function bfsSafe(cx,cy,ent,dz,margin){
  const secPerCell=TILE/Math.max(30,effSpeed(ent));
  const dist=new Int16Array(COLS*ROWS).fill(-1);
  const prev=new Int32Array(COLS*ROWS).fill(-1);
  const q=[cy*COLS+cx]; dist[cy*COLS+cx]=0;
  for(let i=0;i<q.length;i++){
    const k=q[i], x=k%COLS, y=(k/COLS)|0;
    for(const key in DIRS){
      const nx=x+DIRS[key][0], ny=y+DIRS[key][1];
      if(nx<0||ny<0||nx>=COLS||ny>=ROWS) continue;
      const nk=ny*COLS+nx;
      if(dist[nk]>=0) continue;
      const g=grid[ny][nx];
      if(g===HARD) continue;
      if(g===BRICK && !ent.wallPass) continue;
      if(bombAt(nx,ny) && !ent.bombPass) continue;
      if(dz){
        const arrive=(dist[k]+1)*secPerCell;
        if(dz[ny][nx] <= arrive+margin) continue;
      }
      dist[nk]=dist[k]+1; prev[nk]=k; q.push(nk);
    }
  }
  return {dist,prev};
}
function firstStep(prev,startK,goalK){
  let c=goalK;
  if(c===startK) return null;
  while(prev[c]>=0 && prev[c]!==startK) c=prev[c];
  if(prev[c]<0) return null;
  return c;
}
function dirTo(cx,cy,k){
  const x=k%COLS, y=(k/COLS)|0;
  for(const key in DIRS) if(cx+DIRS[key][0]===x && cy+DIRS[key][1]===y) return key;
  return null;
}
// dz のもとで安全に行ける「完全に安全なマス」を探す
function safeTargetFrom(cx,cy,b,dz,par){
  const {dist,prev}=bfsSafe(cx,cy,b,dz,par.escapeMargin);
  const startK=cy*COLS+cx;
  let best=-1,bestD=1e9;
  for(let k=0;k<dist.length;k++){
    if(dist[k]<0) continue;
    const x=k%COLS, y=(k/COLS)|0;
    if(dz[y][x]===Infinity && dist[k]<bestD){ bestD=dist[k]; best=k; }
  }
  if(best<0){                       // 完全安全が無ければ、いちばん猶予の長いマスへ
    let bestT=-1;
    for(let k=0;k<dist.length;k++){
      if(dist[k]<0) continue;
      const x=k%COLS, y=(k/COLS)|0;
      if(dz[y][x]>bestT){ bestT=dz[y][x]; best=k; }
    }
  }
  return {best,dist,prev,startK};
}
// 自分の爆弾の爆風範囲と、そこに獲物がいるか
function ownBlast(b){
  const cells=new Set(); let hits=false;
  for(const bomb of bombs){
    if(bomb.owner!==b||bomb.dead) continue;
    cells.add(bomb.cy*COLS+bomb.cx);
    for(const k in DIRS){
      const dx=DIRS[k][0], dy=DIRS[k][1];
      for(let i=1;i<=bomb.range;i++){
        const x=bomb.cx+dx*i, y=bomb.cy+dy*i;
        if(x<0||y<0||x>=COLS||y>=ROWS) break;
        const g=grid[y][x];
        if(g===HARD) break;
        cells.add(y*COLS+x);
        if(g===BRICK){ hits=true; break; }
      }
    }
  }
  for(const o of bombers) if(o!==b&&o.alive&&cells.has(cellOf(o.y)*COLS+cellOf(o.x))) hits=true;
  for(const e of enemies) if(cells.has(cellOf(e.y)*COLS+cellOf(e.x))) hits=true;
  return {cells,hits};
}
function cpuThink(b,dt){
  b.think-=dt;
  if(b.think>0) return;
  const par=CPU_PARAM[vsCfg.cpu]||CPU_PARAM.normal;
  b.think=par.think*rnd(0.8,1.3);

  const cx=cellOf(b.x), cy=cellOf(b.y);
  const dz=buildDanger(b);
  const startK=cy*COLS+cx;

  // リモコン持ちは、自分が爆風の外に出たら起爆する
  if(b.remote && b.bombsOut>0){
    const ob=ownBlast(b);
    const held=bombs.some(bo=>bo.owner===b&&!bo.dead&&bo.age>2.5);
    if(!ob.cells.has(startK) && (ob.hits || held || b.bombsOut>=b.maxBombs)) detonate(b);
  }

  // 1) 危ないなら逃げる
  if(dz[cy][cx]!==Infinity){
    const r=safeTargetFrom(cx,cy,b,dz,par);
    if(r.best>=0 && r.best!==startK){
      const step=firstStep(r.prev,startK,r.best);
      b.aim=step!==null?dirTo(cx,cy,step):null;
    }else{
      // 安全な逃げ道が無い：いちばん猶予の長い隣のマスへ逃げる
      const opts=[];
      for(const k in DIRS){
        const nx=cx+DIRS[k][0], ny=cy+DIRS[k][1];
        if(!solidAt(nx,ny,b)) opts.push({k,d:dz[ny][nx]});
      }
      opts.sort((a,c)=>c.d-a.d);
      b.aim=(opts.length&&opts[0].d>=dz[cy][cx])?opts[0].k:null;
    }
    return;
  }

  const {dist,prev}=bfsSafe(cx,cy,b,dz,par.escapeMargin);
  // 2) 置ける？（置いた後に逃げ道があるかを確認）
  const canBomb = b.bombsOut<b.maxBombs && canPlace(b) && !bombAt(cx,cy);
  let want=false;
  if(canBomb){
    const rng=effRange(b);
    // 近くの敵ボンバー
    for(const o of bombers){
      if(o===b||!o.alive) continue;
      const ox=cellOf(o.x), oy=cellOf(o.y);
      const k=oy*COLS+ox;
      if(dist[k]>=0 && dist[k]<=2 && Math.random()<par.aggro){ want=true; break; }
      if((ox===cx&&Math.abs(oy-cy)<=rng)||(oy===cy&&Math.abs(ox-cx)<=rng)){ want=true; break; }
    }
    // 敵キャラ（ストーリー用）
    if(!want) for(const e of enemies){
      const ex=cellOf(e.x), ey=cellOf(e.y);
      if((ex===cx&&Math.abs(ey-cy)<=rng)||(ey===cy&&Math.abs(ex-cx)<=rng)){ want=true; break; }
    }
    // レンガを壊す
    if(!want){
      for(const k in DIRS){
        const nx=cx+DIRS[k][0], ny=cy+DIRS[k][1];
        if(nx>0&&ny>0&&nx<COLS-1&&ny<ROWS-1&&grid[ny][nx]===BRICK){ want=true; break; }
      }
    }
    if(want){
      const dz2=dangerWith(dz,cx,cy,rng);
      const r2=safeTargetFrom(cx,cy,b,dz2,par);
      if(r2.best>=0 && r2.best!==startK){
        placeBomb(b);
        const step=firstStep(r2.prev,startK,r2.best);
        b.aim=step!==null?dirTo(cx,cy,step):null;
        return;
      }
    }
  }
  // 3) 目標へ移動（アイテム→敵→レンガ際）
  let goal=-1,goalD=1e9;
  for(let y=1;y<ROWS-1;y++)for(let x=1;x<COLS-1;x++){
    const k=y*COLS+x;
    if(dist[k]<0||dz[y][x]!==Infinity) continue;
    let score=1e9;
    if(items[y][x] && items[y][x]!=='skull') score=dist[k]/par.itemWant;
    else{
      let nearBrick=false;
      for(const key in DIRS){
        const nx=x+DIRS[key][0], ny=y+DIRS[key][1];
        if(nx>=0&&ny>=0&&nx<COLS&&ny<ROWS&&grid[ny][nx]===BRICK){ nearBrick=true; break; }
      }
      let foe=false;
      for(const o of bombers) if(o!==b&&o.alive&&Math.abs(cellOf(o.x)-x)+Math.abs(cellOf(o.y)-y)<=1) foe=true;
      for(const e of enemies) if(Math.abs(cellOf(e.x)-x)+Math.abs(cellOf(e.y)-y)<=1) foe=true;
      if(foe) score=dist[k]+2;
      else if(nearBrick) score=dist[k]+6;
    }
    if(score<goalD){ goalD=score; goal=k; }
  }
  if(goal>=0&&goal!==startK){
    const step=firstStep(prev,startK,goal);
    b.aim=step!==null?dirTo(cx,cy,step):null;
  }else{
    const opts=[];
    for(const k in DIRS){
      const nx=cx+DIRS[k][0], ny=cy+DIRS[k][1];
      if(!solidAt(nx,ny,b)&&dz[ny][nx]===Infinity) opts.push(k);
    }
    b.aim=opts.length?opts[(Math.random()*opts.length)|0]:null;
  }
}

/* ============================================================
   敵AI（ストーリー）
============================================================ */
function computeBFS(){
  bfsDist=new Int16Array(COLS*ROWS).fill(-1);
  const p=bombers[0];
  if(!p||!p.alive) return;
  const sx=cellOf(p.x), sy=cellOf(p.y);
  if(sx<0||sy<0||sx>=COLS||sy>=ROWS) return;
  const q=[sy*COLS+sx]; bfsDist[sy*COLS+sx]=0;
  for(let i=0;i<q.length;i++){
    const k=q[i], x=k%COLS, y=(k/COLS)|0, d=bfsDist[k];
    for(const key in DIRS){
      const nx=x+DIRS[key][0], ny=y+DIRS[key][1];
      if(nx<0||ny<0||nx>=COLS||ny>=ROWS) continue;
      const nk=ny*COLS+nx;
      if(bfsDist[nk]>=0 || grid[ny][nx]!==EMPTY) continue;
      bfsDist[nk]=d+1; q.push(nk);
    }
  }
}
function chooseDir(e){
  const cx=cellOf(e.x), cy=cellOf(e.y);
  const cand=[];
  for(const key in DIRS){
    const dx=DIRS[key][0], dy=DIRS[key][1], nx=cx+dx, ny=cy+dy;
    if(solidAt(nx,ny,e)) continue;
    if(flameT[ny]&&flameT[ny][nx]>0) continue;
    cand.push([dx,dy]);
  }
  if(!cand.length){ e.dir=[0,0]; return; }
  const back=cand.find(c=>c[0]===-e.dir[0]&&c[1]===-e.dir[1]);
  const fwd =cand.find(c=>c[0]=== e.dir[0]&&c[1]=== e.dir[1]);
  if(e.chase>0 && !e.ghost && bfsDist && Math.random()<e.chase){
    let best=null,bd=1e9;
    for(const c of cand){
      const d=bfsDist[(cy+c[1])*COLS+(cx+c[0])];
      if(d>=0 && d<bd){ bd=d; best=c; }
    }
    if(best){ e.dir=best; return; }
  }
  if(fwd && Math.random()<0.72){ e.dir=fwd; return; }
  const nonBack=cand.filter(c=>c!==back);
  const pool=nonBack.length?nonBack:cand;
  e.dir=pool[(Math.random()*pool.length)|0];
}
function updateEnemies(dt){
  for(const e of enemies){
    e.wob+=dt*7;
    const step=e.speed*dt;
    const cx=cellOf(e.x), cy=cellOf(e.y);
    const ccx=cx*TILE+TILE/2, ccy=cy*TILE+TILE/2;
    if(Math.abs(e.x-ccx)<=step && Math.abs(e.y-ccy)<=step){
      e.x=ccx; e.y=ccy; chooseDir(e);
    }
    const nx=e.x+e.dir[0]*step, ny=e.y+e.dir[1]*step;
    if(!boxBlocked(nx,ny,e)){ e.x=nx; e.y=ny; }
    else { e.x=ccx; e.y=ccy; chooseDir(e); }

    const ex=cellOf(e.x), ey=cellOf(e.y);
    if(flameT[ey]&&flameT[ey][ex]>0){
      e.alive=false;
      score+=e.score;
      popups.push({x:e.x,y:e.y,text:'+'+e.score,life:.9});
      SFX.kill();
      for(let i=0;i<14;i++) particles.push({
        x:e.x,y:e.y,vx:rnd(-150,150),vy:rnd(-200,-20),life:rnd(.3,.8),
        c:[e.color,'#fff',e.dark][(Math.random()*3)|0],s:rnd(2,5),g:400
      });
    }
  }
  enemies=enemies.filter(e=>e.alive);
}
// 出口を爆風で焼くと敵が湧く（クラシックのお約束）
function exitBurned(){
  const spots=[];
  for(let y=1;y<ROWS-1;y++)for(let x=1;x<COLS-1;x++){
    if(grid[y][x]!==EMPTY) continue;
    const p=bombers[0];
    if(Math.abs(x-cellOf(p.x))+Math.abs(y-cellOf(p.y))<5) continue;
    spots.push([x,y]);
  }
  shuffle(spots);
  const n=Math.min(4,spots.length);
  for(let i=0;i<n;i++) enemies.push(makeEnemy(Math.random()<0.5?'balloon':'bee',spots[i][0],spots[i][1]));
  popups.push({x:exitCell.cx*TILE+TILE/2,y:exitCell.cy*TILE+TILE/2,text:'てきが わいた！',life:1.4});
  banner={text:'てきが わいた！',t:1.2,color:'#ff8a8a'};
}

/* ============================================================
   サドンデス（VS）
============================================================ */
function updateSuddenDeath(dt){
  if(timeLeft>SD_START) return;
  vsSdTimer-=dt;
  if(vsSdTimer>0) return;
  vsSdTimer=0.34;
  while(vsSpiralIdx<vsSpiral.length){
    const [x,y]=vsSpiral[vsSpiralIdx++];
    if(grid[y][x]===HARD) continue;
    grid[y][x]=HARD;
    items[y][x]=null;
    hidden.delete(y*COLS+x);
    const bm=bombAt(x,y);
    if(bm) explode(bm);
    for(const b of bombers) if(b.alive&&overlapsCell(b,x,y)){ b.shield=false; b.invul=0; hitBomber(b,'crush'); }
    drops.push({x:x*TILE+TILE/2,y:y*TILE+TILE/2,t:0.28});
    SFX.drop();
    shake=Math.max(shake,4);
    break;
  }
}

function startStory(){
  scene='story';
  stage=1; score=0; lives=3;
  bombers=[makeBomber(0,COLORS[0],{cpu:false})];
  bombers[0].pressed=[];
  newStage();
  mode='play'; hideOverlay();
  banner={text:'STAGE 1',t:1.2,color:'#ffd166'};
  setHudMode('story');
  BGM.start();
}
function stageClear(){
  mode='clear'; modeTimer=2.6;
  const bonus=Math.floor(timeLeft)*10;
  score+=bonus+500;
  SFX.clear();
  showOverlay('<h2>STAGE '+stage+' CLEAR!</h2>'+
    '<p>タイムボーナス +'+bonus+'</p><p class="blink">NEXT STAGE...</p>');
}
function nextStage(){
  stage++;
  newStage();
  mode='play'; hideOverlay();
  banner={text:'STAGE '+stage,t:1.2,color:'#ffd166'};
}
function gameOver(){
  mode='gameover';
  BGM.stop();
  SFX.over();
  showOverlay('<h1>GAME OVER</h1><h2>SCORE '+score+'</h2>'+
    '<p>到達ステージ '+stage+'</p>'+
    '<div class="row"><div class="big" id="again">もういちど</div>'+
    '<div class="big alt" id="toTitle">タイトルへ</div></div>');
  bind('again',()=>startStory());
  bind('toTitle',()=>showTitle());
}
function respawn(){
  lives--;
  if(lives<=0){ gameOver(); return; }
  const p=bombers[0];
  resetBomber(p,true);
  p.ail=null;
  bombs=[];
  mode='play';
}

function startVs(){
  scene='vs';
  const n=vsCfg.players;
  bombers=[];
  for(let i=0;i<n;i++){
    bombers.push(makeBomber(i,COLORS[i],{cpu: i>=vsCfg.humans}));
  }
  vsRound=1;
  newVsRound();
  mode='play'; hideOverlay();
  banner={text:'ROUND 1',t:1.3,color:'#ffd166'};
  setHudMode('vs');
  SFX.round();
  BGM.start();
}
function endRound(){
  const alive=bombers.filter(b=>b.alive);
  mode='roundend'; modeTimer=2.4;
  if(alive.length===1){
    alive[0].wins++;
    banner={text:alive[0].name+' の かち！',t:2.2,color:alive[0].col.dot};
    SFX.clear();
  }else{
    banner={text:'ひきわけ',t:2.2,color:'#cfd8e6'};
    SFX.over();
  }
  buildVsHud();
}
function nextRound(){
  const champ=bombers.find(b=>b.wins>=vsCfg.winsNeeded);
  if(champ){ matchEnd(champ); return; }
  vsRound++;
  newVsRound();
  mode='play'; hideOverlay();
  banner={text:'ROUND '+vsRound,t:1.3,color:'#ffd166'};
  SFX.round();
}
function matchEnd(champ){
  mode='matchend';
  BGM.stop();
  const list=bombers.slice().sort((a,b)=>b.wins-a.wins)
    .map(b=>'<span style="color:'+b.col.dot+'">■</span> '+b.name+' … '+b.wins+'勝').join('<br>');
  showOverlay('<h1>'+champ.name+' の ゆうしょう！</h1>'+
    '<p>'+list+'</p>'+
    '<div class="row"><div class="big" id="again">もういちど</div>'+
    '<div class="big alt" id="toTitle">タイトルへ</div></div>');
  bind('again',()=>startVs());
  bind('toTitle',()=>showTitle());
}

/* ============================================================
   更新
============================================================ */
function update(dt){
  tick+=dt;
  if(shake>0) shake=Math.max(0,shake-dt*22);
  if(banner){ banner.t-=dt; if(banner.t<=0) banner=null; }
  updateParticles(dt);
  for(const d of drops) d.t-=dt;
  drops=drops.filter(d=>d.t>0);

  if(mode==='play'){
    if(scene==='story'){
      bfsTimer-=dt;
      if(bfsTimer<=0){ computeBFS(); bfsTimer=0.25; }
    }
    for(const b of bombers) if(b.cpu&&b.alive) cpuThink(b,dt);
    updateBombs(dt);
    const exitWasThere=exitCell;
    updateFlames(dt);
    if(scene==='story' && exitWasThere && flameT[exitWasThere.cy][exitWasThere.cx]>0 && !exitCell.burned){
      exitCell.burned=true; exitBurned();
    }
    for(const b of bombers){
      if(b.alive) updateBomber(b,dt);
      else if(b.misobon) updateMisobon(b,dt);
    }
    if(throws.length) updateThrows(dt);
    if(scene==='story') updateEnemies(dt);
    if(scene==='vs'){
      updateSuddenDeath(dt);
      // 勝負がついても数フレームは見届ける（相打ちなら引き分け）
      if(bombers.filter(b=>b.alive).length<=1){
        if(endGrace<0) endGrace=END_GRACE;
        endGrace-=dt;
        if(endGrace<=0) endRound();
      }
    }
    timeLeft-=dt;
    if(timeLeft<=0){
      if(scene==='story'){ timeLeft=STAGE_TIME; hitBomber(bombers[0],'time'); }
      else { timeLeft=0; for(const b of bombers) if(b.alive) hitBomber(b,'time'); endRound(); }
    }
  }else{
    for(const b of bombers) b.bombEdge=b.detEdge=false;
    if(mode==='dying'){
      updateBombs(dt); updateFlames(dt); updateEnemies(dt);
      modeTimer-=dt;
      if(modeTimer<=0) respawn();
    }else if(mode==='clear'){
      updateFlames(dt); modeTimer-=dt;
      if(modeTimer<=0) nextStage();
    }else if(mode==='roundend'){
      updateBombs(dt); updateFlames(dt);
      modeTimer-=dt;
      if(modeTimer<=0) nextRound();
    }
  }
  updateHUD();
}
function updateParticles(dt){
  for(const p of particles){ p.life-=dt; p.vy+=p.g*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; }
  particles=particles.filter(p=>p.life>0);
  for(const p of popups){ p.life-=dt; p.y-=22*dt; }
  popups=popups.filter(p=>p.life>0);
}

============================================================ */
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);     ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function drawFloor(){
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
    ctx.fillStyle=((x+y)&1)?'#2f8b4d':'#2a7f46';
    ctx.fillRect(x*TILE,y*TILE,TILE,TILE);
  }
  ctx.fillStyle='rgba(255,255,255,.035)';
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)
    if(((x*7+y*13)%11)===0) ctx.fillRect(x*TILE+6,y*TILE+8,5,3);
}
function drawHard(x,y){
  const px=x*TILE, py=y*TILE;
  ctx.fillStyle='#3b4257'; ctx.fillRect(px,py,TILE,TILE);
  const g=ctx.createLinearGradient(px,py,px,py+TILE);
  g.addColorStop(0,'#8a93ad'); g.addColorStop(.5,'#6b7490'); g.addColorStop(1,'#4a5269');
  ctx.fillStyle=g; ctx.fillRect(px+2,py+2,TILE-4,TILE-4);
  ctx.fillStyle='rgba(255,255,255,.35)'; ctx.fillRect(px+3,py+3,TILE-6,3);
  ctx.fillStyle='rgba(0,0,0,.3)'; ctx.fillRect(px+3,py+TILE-7,TILE-6,4);
  ctx.fillStyle='rgba(255,255,255,.18)';
  ctx.beginPath(); ctx.arc(px+9,py+9,2,0,7); ctx.arc(px+TILE-9,py+9,2,0,7); ctx.fill();
}
function drawBrick(x,y){

  ctx.moveTo(px+TILE/4,py+TILE/2); ctx.lineTo(px+TILE/4,py+TILE-2);

}
function drawExit(){
  if(!exitCell) return;
  const px=exitCell.cx*TILE, py=exitCell.cy*TILE;
  const open=enemies.length===0;
  const pulse=0.5+0.5*Math.sin(tick*(open?6:2));
  ctx.fillStyle='#1a1020'; roundRect(px+3,py+3,TILE-6,TILE-6,6); ctx.fill();
  const g=ctx.createRadialGradient(px+TILE/2,py+TILE/2,2,px+TILE/2,py+TILE/2,TILE/2);

    g.addColorStop(0,'rgba(255,255,255,'+(0.75+pulse*0.25)+')');

    g.addColorStop(0,'rgba(180,190,220,.5)'); g.addColorStop(1,'rgba(40,45,70,.1)');

  ctx.lineWidth=2; roundRect(px+4,py+4,TILE-8,TILE-8,6); ctx.stroke();
}
function drawItem(t,px,py){
  const bob=Math.sin(tick*4+px*0.1)*2;
  const cx=px+TILE/2, cy=py+TILE/2+bob;
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,.25)';

    ctx.fillStyle='#3d8bff';
    ctx.beginPath(); ctx.moveTo(cx-9,cy+8); ctx.lineTo(cx-2,cy+8);
    ctx.lineTo(cx+2,cy-2); ctx.lineTo(cx+9,cy-2); ctx.lineTo(cx+1,cy-10);
    ctx.lineTo(cx-3,cy-1); ctx.lineTo(cx-9,cy-1); ctx.closePath(); ctx.fill();
    ctx.strokeStyle='#9be7ff'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(cx-12,cy+2); ctx.lineTo(cx-5,cy+2); ctx.stroke();
  }else if(t==='kick'){
    ctx.fillStyle='#7a4fd6';
    ctx.beginPath(); ctx.ellipse(cx-3,cy+1,7,5,-0.4,0,7); ctx.fill();

    ctx.strokeStyle='#c792ea'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(cx+7,cy+5,7,-1.2,0.4); ctx.stroke();
  }else if(t==='remote'){
    ctx.fillStyle='#22a35a'; roundRect(cx-7,cy-8,14,17,3); ctx.fill();
    ctx.fillStyle='#7ef0a0'; roundRect(cx-4,cy-5,8,5,1); ctx.fill();
    ctx.fillStyle='#e8ffe8';
    ctx.beginPath(); ctx.arc(cx-2,cy+4,1.8,0,7); ctx.arc(cx+3,cy+4,1.8,0,7); ctx.fill();
    ctx.strokeStyle='#7ef0a0'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(cx+5,cy-8); ctx.lineTo(cx+9,cy-13); ctx.stroke();
  }else if(t==='wall'){
    ctx.fillStyle='#c07a3a'; roundRect(cx-11,cy-9,22,18,2); ctx.fill();
    ctx.strokeStyle='rgba(60,25,12,.8)'; ctx.lineWidth=1.5;

    ctx.beginPath(); ctx.arc(cx-2,cy-1,1.1,0,7); ctx.arc(cx+2,cy-1,1.1,0,7); ctx.fill();
  }else if(t==='bombpass'){
    ctx.fillStyle='#23273a'; ctx.globalAlpha=.55;

function drawBomb(b){
  const phase=b.remote?0.5:1-(b.t/FUSE);
  const r=13*(1+Math.sin(tick*(8+phase*14))*0.09*(0.4+phase));
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,.3)';
  ctx.beginPath(); ctx.ellipse(b.x,b.y+12,13,5,0,0,7); ctx.fill();
  const g=ctx.createRadialGradient(b.x-4,b.y-5,1,b.x,b.y,r);
  g.addColorStop(0,'#5a6280'); g.addColorStop(.45,'#262b3d'); g.addColorStop(1,'#0e1120');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(b.x,b.y,r,0,7); ctx.fill();
  if(b.remote){
    ctx.strokeStyle='rgba(126,240,160,'+(0.5+0.5*Math.sin(tick*9))+')';
    ctx.lineWidth=2; ctx.beginPath(); ctx.arc(b.x,b.y,r+3,0,7); ctx.stroke();
  }else if(phase>0.75 && Math.sin(tick*30)>0){
    ctx.fillStyle='rgba(255,90,60,.45)'; ctx.beginPath(); ctx.arc(b.x,b.y,r,0,7); ctx.fill();
  }
  ctx.fillStyle='rgba(255,255,255,.6)';
  ctx.beginPath(); ctx.ellipse(b.x-4.5,b.y-5.5,3.4,2.4,-0.6,0,7); ctx.fill();
  ctx.strokeStyle='#c98b3d'; ctx.lineWidth=2.5; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(b.x+4,b.y-11);
  ctx.quadraticCurveTo(b.x+12,b.y-18,b.x+8,b.y-22); ctx.stroke();
  const sp=6+Math.sin(tick*26)*2.5;
  const sg=ctx.createRadialGradient(b.x+8,b.y-23,0,b.x+8,b.y-23,sp);
  sg.addColorStop(0,'#fff'); sg.addColorStop(.4,'#ffd166'); sg.addColorStop(1,'rgba(255,120,40,0)');
  ctx.fillStyle=sg; ctx.beginPath(); ctx.arc(b.x+8,b.y-23,sp,0,7); ctx.fill();
  ctx.restore();
}
function drawFlames(){
  for(let y=1;y<ROWS-1;y++)for(let x=1;x<COLS-1;x++){
    const t=flameT[y][x]; if(t<=0) continue;
    const k=t/FLAME_LIFE;
    const px=x*TILE, py=y*TILE, cx=px+TILE/2, cy=py+TILE/2;
    const f=flameF[y][x];
    const w=TILE*(0.55+0.45*Math.min(1,k*1.6));
    ctx.save();
    ctx.globalAlpha=Math.min(1,k*1.7);
    // 外側のにじみ（加算）
    ctx.globalCompositeOperation='lighter';
    const gl=ctx.createRadialGradient(cx,cy,2,cx,cy,TILE*0.75);
    gl.addColorStop(0,'rgba(255,190,90,.55)');
    gl.addColorStop(1,'rgba(255,80,20,0)');
    ctx.fillStyle=gl;
    ctx.beginPath(); ctx.arc(cx,cy,TILE*0.75,0,7); ctx.fill();
    // 炎の本体：オレンジ→黄→白の3層でクラシックな見た目に
    ctx.globalCompositeOperation='source-over';
    const layer=(ww,color)=>{
      ctx.fillStyle=color;
      if(f&F_H){ roundRect(px-1,cy-ww/2,TILE+2,ww,ww/2); ctx.fill(); }
      if(f&F_V){ roundRect(cx-ww/2,py-1,ww,TILE+2,ww/2); ctx.fill(); }
      if(f&F_C){ ctx.beginPath(); ctx.arc(cx,cy,ww*0.62,0,7); ctx.fill(); }
    };
    layer(w,        '#ff5a1e');
    layer(w*0.74,   '#ff9d2e');
    layer(w*0.48,   '#ffd94a');
    layer(w*0.24,   '#fff6d8');
    ctx.restore();
  }
}
function drawBomber(b){
  // 点滅の位相をプレイヤーごとにずらす（全員同時に消えないように）
  if(b.invul>0 && Math.floor((tick+b.id*0.055)*14)%2===0) return;
  const x=b.x, y=b.y, C=b.col;
  const moving = b.cpu ? !!b.aim : b.pressed.length>0;
  const bob=moving?Math.sin(b.walk)*2:Math.sin(tick*2.5)*0.8;
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,.3)';
  ctx.beginPath(); ctx.ellipse(x,y+14,11,4.5,0,0,7); ctx.fill();
  const fo=moving?Math.sin(b.walk)*3:0;
  ctx.fillStyle=C.helm2;
  roundRect(x-9,y+7+fo,7,6,3); ctx.fill();
  roundRect(x+2,y+7-fo,7,6,3); ctx.fill();
  const bg=ctx.createLinearGradient(x,y-14+bob,x,y+10+bob);
  bg.addColorStop(0,C.body); bg.addColorStop(1,C.shade);
  ctx.fillStyle=bg; roundRect(x-11,y-13+bob,22,23,9); ctx.fill();
  ctx.strokeStyle='rgba(20,25,45,.55)'; ctx.lineWidth=1.6;
  roundRect(x-11,y-13+bob,22,23,9); ctx.stroke();
  const hg=ctx.createLinearGradient(x,y-16+bob,x,y-2+bob);
  hg.addColorStop(0,C.helm); hg.addColorStop(1,C.helm2);
  ctx.fillStyle=hg;
  ctx.beginPath(); ctx.arc(x,y-5+bob,11.5,Math.PI,0);
  ctx.lineTo(x+11.5,y-2+bob); ctx.lineTo(x-11.5,y-2+bob); ctx.closePath(); ctx.fill();
  ctx.strokeStyle=C.helm2; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(x,y-16+bob); ctx.lineTo(x,y-21+bob); ctx.stroke();
  ctx.fillStyle=C.dot; ctx.beginPath(); ctx.arc(x,y-22.5+bob,2.8,0,7); ctx.fill();
  const d=b.dir;
  let ex=0, ey=0;
  if(d==='left') ex=-3; else if(d==='right') ex=3; else if(d==='up') ey=-2; else ey=1;
  if(d!=='up'){
    ctx.fillStyle='#1b2340';
    ctx.beginPath(); ctx.ellipse(x-4+ex,y-1+ey+bob,2.1,2.7,0,0,7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x+4+ex,y-1+ey+bob,2.1,2.7,0,0,7); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.9)';
    ctx.beginPath(); ctx.arc(x-4.6+ex,y-2+ey+bob,0.8,0,7);
    ctx.arc(x+3.4+ex,y-2+ey+bob,0.8,0,7); ctx.fill();
  }
  ctx.fillStyle=C.cape; roundRect(x-12,y-2+bob,24,5,2.5); ctx.fill();
  if(b.invul>0){
    ctx.globalAlpha=.45; ctx.strokeStyle='#9be7ff'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(x,y-2,17+Math.sin(tick*8)*1.5,0,7); ctx.stroke();
    ctx.globalAlpha=1;
  }
  if(b.shield){
    ctx.strokeStyle='rgba(255,120,150,'+(0.5+0.3*Math.sin(tick*5))+')'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(x,y-2,19,0,7); ctx.stroke();
  }
  if(b.ail){
    ctx.fillStyle='rgba(180,140,255,.95)';
    ctx.font='bold 9px system-ui'; ctx.textAlign='center';
    ctx.fillText(AIL_LABEL[b.ail],x,y-30+bob);
    ctx.fillStyle='rgba(200,160,255,.25)';
    ctx.beginPath(); ctx.arc(x,y-2,20,0,7); ctx.fill();
  }
  ctx.restore();
}
function drawMisobon(b){
  ctx.save();
  ctx.translate(b.x,b.y); ctx.scale(0.78,0.78); ctx.translate(-b.x,-b.y);
  // トロッコ
  ctx.fillStyle='rgba(18,22,38,.92)';
  roundRect(b.x-16,b.y+4,32,13,5); ctx.fill();
  ctx.strokeStyle=b.col.dot; ctx.lineWidth=2;
  roundRect(b.x-16,b.y+4,32,13,5); ctx.stroke();
  ctx.fillStyle='#39415e';
  ctx.beginPath(); ctx.arc(b.x-9,b.y+18,4.5,0,7); ctx.arc(b.x+9,b.y+18,4.5,0,7); ctx.fill();
  drawBomber(b);
  ctx.restore();
  // 投げ先の目印（人間プレイヤーのみ）
  if(!b.cpu){
    const t=throwTarget(b);
    if(t){
      ctx.save();
      ctx.globalAlpha=0.3+0.25*Math.sin(tick*7);
      ctx.strokeStyle=b.col.dot; ctx.lineWidth=2.5; ctx.setLineDash([5,4]);
      roundRect(t.cx*TILE+4,t.cy*TILE+4,TILE-8,TILE-8,5); ctx.stroke();
      ctx.restore();
    }
  }
}
function drawThrows(){
  for(const f of throws){
    const k=Math.min(1,f.t/f.dur);
    const gx=f.x0+(f.x1-f.x0)*k, gy=f.y0+(f.y1-f.y0)*k;
    const y=gy-Math.sin(Math.PI*k)*62;
    ctx.save();
    ctx.fillStyle='rgba(0,0,0,.28)';
    ctx.beginPath(); ctx.ellipse(gx,gy+8,9,4,0,0,7); ctx.fill();
    const g=ctx.createRadialGradient(gx-3,y-4,1,gx,y,11);
    g.addColorStop(0,'#5a6280'); g.addColorStop(.45,'#262b3d'); g.addColorStop(1,'#0e1120');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(gx,y,11,0,7); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.55)';
    ctx.beginPath(); ctx.ellipse(gx-3.5,y-4.5,2.8,2,-0.6,0,7); ctx.fill();
    const sp=5+Math.sin(tick*26)*2;
    const sg=ctx.createRadialGradient(gx+6,y-17,0,gx+6,y-17,sp);
    sg.addColorStop(0,'#fff'); sg.addColorStop(.4,'#ffd166'); sg.addColorStop(1,'rgba(255,120,40,0)');
    ctx.fillStyle=sg; ctx.beginPath(); ctx.arc(gx+6,y-17,sp,0,7); ctx.fill();
    ctx.restore();
  }
}
function drawEnemy(e){
  const x=e.x, y=e.y+Math.sin(e.wob)*1.6;
  ctx.save();
  if(e.ghost) ctx.globalAlpha=0.72;
  ctx.fillStyle='rgba(0,0,0,.28)';
  ctx.beginPath(); ctx.ellipse(e.x,e.y+13,10,4,0,0,7); ctx.fill();
  const g=ctx.createRadialGradient(x-4,y-6,2,x,y,15);
  g.addColorStop(0,'#ffffff'); g.addColorStop(.35,e.color); g.addColorStop(1,e.dark);
  ctx.fillStyle=g;
  if(e.type==='ghost'){
    ctx.beginPath();
    ctx.arc(x,y-2,12,Math.PI,0);
    ctx.lineTo(x+12,y+9);
    for(let i=0;i<3;i++)
      ctx.quadraticCurveTo(x+12-8*(i+0.5), y+9+(i%2?-5:5), x+12-8*(i+1), y+9);
    ctx.closePath(); ctx.fill();
  }else if(e.type==='bee'){
    ctx.beginPath(); ctx.ellipse(x,y,13,11,0,0,7); ctx.fill();
    ctx.fillStyle='rgba(40,30,10,.55)';
    ctx.fillRect(x-4,y-9,3.5,18); ctx.fillRect(x+3,y-9,3.5,18);
    ctx.fillStyle='rgba(255,255,255,.5)';
    const f=Math.sin(tick*24)*4;
    ctx.beginPath(); ctx.ellipse(x-7,y-11+f*0.3,7,4,-0.6,0,7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x+7,y-11-f*0.3,7,4,0.6,0,7); ctx.fill();
  }else if(e.type==='slime'){
    const sq=1+Math.sin(e.wob*1.4)*0.12;
    ctx.beginPath();
    ctx.ellipse(x,y+3,13*sq,12/sq,0,Math.PI,0);
    ctx.ellipse(x,y+3,13*sq,7/sq,0,0,Math.PI);
    ctx.fill();
  }else{
    ctx.beginPath(); ctx.arc(x,y,13,0,7); ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.35)'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(x,y,13,0,7); ctx.stroke();
  }
  const dx=e.dir[0]*2.5, dy=e.dir[1]*2;
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.ellipse(x-4.5,y-2,4,4.5,0,0,7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x+4.5,y-2,4,4.5,0,0,7); ctx.fill();
  ctx.fillStyle='#141a2e';
  ctx.beginPath(); ctx.arc(x-4.5+dx,y-2+dy,2,0,7); ctx.fill();
  ctx.beginPath(); ctx.arc(x+4.5+dx,y-2+dy,2,0,7); ctx.fill();
  ctx.restore();
}
function drawDrops(){
  for(const d of drops){
    const k=d.t/0.28;
    ctx.save();
    ctx.globalAlpha=k;
    ctx.strokeStyle='#fff'; ctx.lineWidth=3;
    const s=TILE*(0.5+k*0.9);
    ctx.strokeRect(d.x-s/2,d.y-s/2,s,s);
    ctx.restore();
  }
}
function drawParticles(){
  for(const p of particles){
    ctx.globalAlpha=Math.max(0,Math.min(1,p.life*2.2));
    ctx.fillStyle=p.c;
    ctx.fillRect(p.x-p.s/2,p.y-p.s/2,p.s,p.s);
  }
  ctx.globalAlpha=1;
  ctx.textAlign='center';
  ctx.font='bold 14px system-ui,sans-serif';
  for(const p of popups){
    ctx.globalAlpha=Math.max(0,Math.min(1,p.life*1.6));
    ctx.lineWidth=3; ctx.strokeStyle='rgba(0,0,0,.7)';
    ctx.strokeText(p.text,p.x,p.y);
    ctx.fillStyle='#ffe9a8'; ctx.fillText(p.text,p.x,p.y);
  }
  ctx.globalAlpha=1;
}
function drawBanner(){
  if(!banner) return;
  const a=Math.min(1,banner.t*2.2);
  ctx.save();
  ctx.globalAlpha=a;
  ctx.fillStyle='rgba(8,10,20,.72)';
  ctx.fillRect(0,H/2-38,W,76);
  ctx.fillStyle=banner.color||'#ffd166';
  ctx.font='bold 34px system-ui,sans-serif'; ctx.textAlign='center';
  ctx.lineWidth=5; ctx.strokeStyle='rgba(0,0,0,.8)';
  ctx.strokeText(banner.text,W/2,H/2+12);
  ctx.fillText(banner.text,W/2,H/2+12);
  ctx.restore();
}
function render(){
  ctx.save();
  if(shake>0) ctx.translate(rnd(-shake,shake)*0.5, rnd(-shake,shake)*0.5);
  drawFloor();
  if(grid){
    drawExit();
    for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)
      if(items[y][x]) drawItem(items[y][x],x*TILE,y*TILE);
    for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
      if(grid[y][x]===HARD) drawHard(x,y);
      else if(grid[y][x]===BRICK) drawBrick(x,y);
    }
    for(const b of bombs) drawBomb(b);
    const ents=[];
    for(const e of enemies) ents.push({y:e.y,f:()=>drawEnemy(e)});
    for(const b of bombers) if(b.alive) ents.push({y:b.y,f:()=>drawBomber(b)});
    ents.sort((a,b)=>a.y-b.y);
    for(const o of ents) o.f();
    for(const b of bombers) if(b.misobon) drawMisobon(b);
    if(throws.length) drawThrows();
    drawFlames();
    drawDrops();
    drawParticles();
  }
  ctx.restore();
  if(mode==='play'&&timeLeft<30&&scene==='story'){
    ctx.fillStyle='rgba(255,60,60,'+(0.06+0.05*Math.sin(tick*8))+')';
    ctx.fillRect(0,0,W,H);
  }
  if(scene==='vs'&&mode==='play'&&timeLeft<=SD_START){
    ctx.fillStyle='rgba(255,60,60,'+(0.05+0.05*Math.sin(tick*6))+')';
    ctx.fillRect(0,0,W,H);
  }
  drawBanner();
}

/* ============================================================
   HUD
============================================================ */
function setHudMode(m){
  $('hud').style.display = m==='story' ? '' : 'none';
  $('vsHud').classList.toggle('on', m==='vs');
  if(m==='vs') buildVsHud();
}
function buildVsHud(){
  $('vsHud').innerHTML = bombers.map(b=>{
    const pips=[...Array(vsCfg.winsNeeded)].map((_,i)=>
      '<div class="pip'+(i<b.wins?' on':'')+'"></div>').join('');
    return '<div class="pcard'+(b.alive?'':(b.misobon?' miso':' dead'))+'">'+
      '<div class="nm"><span class="dot" style="background:'+b.col.dot+'"></span>'+
      b.name+(b.cpu?' <span style="opacity:.55">CPU</span>':' <span style="opacity:.55">P'+(b.id+1)+'</span>')+
      (b.misobon?' <span style="color:#c792ea">ミソ</span>':'')+'</div>'+
      '<div class="sts"><span>💣'+b.maxBombs+'</span><span>🔥'+b.range+'</span>'+
      (b.kick?'<span>K</span>':'')+(b.remote?'<span>R</span>':'')+
      (b.wallPass?'<span>W</span>':'')+(b.shield?'<span>♥</span>':'')+'</div>'+
      '<div class="pips">'+pips+'</div></div>';
  }).join('');
}
function updateHUD(){
  if(scene==='story'){
    const p=bombers[0]; if(!p) return;
    $('hStage').textContent=stage;
    $('hScore').textContent=score;
    $('hEnemy').textContent=enemies.length;
    $('hLife').textContent=lives>0?'♥'.repeat(Math.min(lives,6)):'-';
    $('hBomb').textContent=p.maxBombs;
    $('hFire').textContent=p.range;
    $('hSpeed').textContent=p.spd;
    $('pwKick').classList.toggle('off',!p.kick);
    $('pwRemote').classList.toggle('off',!p.remote);
    $('pwWall').classList.toggle('off',!p.wallPass);
    $('timeFill').style.width=Math.max(0,timeLeft/STAGE_TIME*100)+'%';
  }else if(scene==='vs'){
    const cards=$('vsHud').children;
    for(let i=0;i<bombers.length&&i<cards.length;i++){
      const b=bombers[i], c=cards[i];
      c.classList.toggle('dead',!b.alive&&!b.misobon);
      c.classList.toggle('miso',!!b.misobon);
      const sts=c.querySelector('.sts');
      if(sts) sts.innerHTML='<span>💣'+b.maxBombs+'</span><span>🔥'+b.range+'</span>'+
        (b.kick?'<span>K</span>':'')+(b.remote?'<span>R</span>':'')+
        (b.wallPass?'<span>W</span>':'')+(b.shield?'<span>♥</span>':'')+
        (b.ail?'<span style="color:#c792ea">'+AIL_LABEL[b.ail]+'</span>':'');
    }
  }
}

/* ============================================================
   画面
============================================================ */
function showOverlay(html){ const o=$('ov'); o.innerHTML=html; o.classList.remove('hide'); }
function hideOverlay(){ $('ov').classList.add('hide'); }
function bind(id,fn){
  const el=$(id); if(!el) return;
  el.addEventListener('pointerdown',e=>{ e.preventDefault(); ac(); fn(); });
}
function showTitle(){
  scene='title'; mode='title';
  BGM.stop();
  bombers=[]; grid=null;
  setHudMode('none');
  showOverlay(
    '<h1>BOMBER BLAST</h1>'+
    '<p>爆弾でブロックを壊し、パワーアップを集めて戦う定番アクション。</p>'+
    '<div class="row">'+
      '<div class="big" id="mStory">ストーリー</div>'+
      '<div class="big alt" id="mVs">VSバトル</div>'+
    '</div>'+
    '<div class="keys">'+
      '<span>1P移動</span><span>← ↑ → ↓（またはWASD）</span>'+
      '<span>1P爆弾</span><span>SPACE / Z</span>'+
      '<span>1P起爆</span><span>X（リモコン取得時）</span>'+
      '<span>2P移動</span><span>W A S D</span>'+
      '<span>2P爆弾</span><span>Q</span>'+
      '<span>2P起爆</span><span>E</span>'+
      '<span>ポーズ / 音楽</span><span>P / M</span>'+
    '</div>');
  bind('mStory',()=>startStory());
  bind('mVs',()=>showVsSetup());
}
function showVsSetup(){
  const opt=(g,v,label)=> '<div class="opt'+(vsCfg[g]===v?' on':'')+'" data-g="'+g+'" data-v="'+v+'">'+label+'</div>';
  showOverlay(
    '<h2>VSバトル</h2>'+
    '<div class="grp"><span class="cap">プレイヤー数</span><div class="row">'+
      opt('players',2,'2人')+opt('players',3,'3人')+opt('players',4,'4人')+'</div></div>'+
    '<div class="grp"><span class="cap">人間プレイヤー</span><div class="row">'+
      opt('humans',1,'1人（他CPU）')+opt('humans',2,'2人（他CPU）')+'</div></div>'+
    '<div class="grp"><span class="cap">CPUの強さ</span><div class="row">'+
      opt('cpu','easy','よわい')+opt('cpu','normal','ふつう')+opt('cpu','hard','つよい')+'</div></div>'+
    '<div class="grp"><span class="cap">先取</span><div class="row">'+
      opt('winsNeeded',1,'1本')+opt('winsNeeded',3,'3本')+opt('winsNeeded',5,'5本')+'</div></div>'+
    '<div class="grp"><span class="cap">ミソボン（やられたら外枠へ）</span><div class="row">'+
      opt('misobon',1,'あり')+opt('misobon',0,'なし')+'</div></div>'+
    '<div class="grp"><span class="cap">出現アイテム（タップで切替）</span><div class="row">'+
      VS_ITEMS.map(it=>'<div class="opt sm'+(vsCfg.items[it.id]?' on':'')+
        '" data-item="'+it.id+'">'+it.label+'</div>').join('')+'</div></div>'+
    '<p>やられても<b>ミソボン</b>で外枠へ。爆弾を投げ込んで誰かを倒せば内側に復活！<br>'+
       '時間切れが近づくと外側から壁が落ちる<b>サドンデス</b>。ドクロは体当たりでうつせます。</p>'+
    '<div class="row"><div class="big" id="goVs">スタート</div>'+
    '<div class="big alt" id="backT">もどる</div></div>');
  $('ov').querySelectorAll('.opt').forEach(el=>{
    el.addEventListener('pointerdown',e=>{
      e.preventDefault(); ac();
      if(el.dataset.item){
        vsCfg.items[el.dataset.item]=!vsCfg.items[el.dataset.item];
        showVsSetup(); return;
      }
      const g=el.dataset.g;
      let v=el.dataset.v; if(g!=='cpu') v=parseInt(v,10);
      vsCfg[g]=v;
      if(vsCfg.humans>vsCfg.players) vsCfg.humans=vsCfg.players;
      showVsSetup();
    });
  });
  bind('goVs',()=>{ if(vsCfg.humans>vsCfg.players) vsCfg.humans=vsCfg.players; startVs(); });
  bind('backT',()=>showTitle());
}
function togglePause(){
  if(mode==='play'){
    mode='pause';
    showOverlay('<h2>PAUSE</h2><div class="row"><div class="big" id="resume">つづける</div>'+
      '<div class="big alt" id="quit">タイトルへ</div></div>');
    bind('resume',()=>togglePause());
    bind('quit',()=>showTitle());
  }else if(mode==='pause'){ mode='play'; hideOverlay(); }
}

/* ============================================================
   入力
============================================================ */
const P1_KEYS={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'};
const P1_ALT ={w:'up',s:'down',a:'left',d:'right'};
const P2_KEYS={w:'up',s:'down',a:'left',d:'right'};
function humanBomber(i){
  const list=bombers.filter(b=>!b.cpu);
  return list[i]||null;
}
function setDir(b,d,down){
  if(!b) return;
  const i=b.pressed.indexOf(d);
  if(down){ if(i<0) b.pressed.push(d); }
  else if(i>=0) b.pressed.splice(i,1);
}
const keyHeld={};
addEventListener('keydown',e=>{
  const k=e.key.length===1?e.key.toLowerCase():e.key;
  if(P1_KEYS[k]||P1_ALT[k]||k===' '||k==='z'||k==='x'||k==='q') e.preventDefault();
  ac();
  if(mode!=='play'){
    if(k===' '||k==='Enter'){
      if(mode==='pause') togglePause();
    }
    if(k==='p') togglePause();
    if(k==='m'){ BGM.on=!BGM.on; BGM.on?BGM.start():BGM.stop(); }
    return;
  }
  const p1=humanBomber(0), p2=humanBomber(1);
  const twoHumans = scene==='vs' && vsCfg.humans>=2 && p2;

  if(P1_KEYS[k]){ setDir(p1,P1_KEYS[k],true); return; }
  if(P1_ALT[k]){
    if(twoHumans) setDir(p2,P2_KEYS[k],true);
    else setDir(p1,P1_ALT[k],true);
    return;
  }
  if(k===' '||k==='z'){ if(!keyHeld.b1){ keyHeld.b1=true; if(p1) p1.bombEdge=true; } return; }
  if(k==='x'){ if(!keyHeld.d1){ keyHeld.d1=true; if(p1) p1.detEdge=true; } return; }
  if(k==='q'){ if(!keyHeld.b2){ keyHeld.b2=true; if(p2) p2.bombEdge=true; } return; }
  if(k==='e'){ if(!keyHeld.d2){ keyHeld.d2=true; if(p2) p2.detEdge=true; } return; }
  if(k==='p') togglePause();
  if(k==='m'){ BGM.on=!BGM.on; BGM.on?BGM.start():BGM.stop(); }
  if(k==='r'&&scene==='story') startStory();
},{passive:false});
addEventListener('keyup',e=>{
  const k=e.key.length===1?e.key.toLowerCase():e.key;
  const p1=humanBomber(0), p2=humanBomber(1);
  const twoHumans = scene==='vs' && vsCfg.humans>=2 && p2;
  if(P1_KEYS[k]) setDir(p1,P1_KEYS[k],false);
  if(P1_ALT[k]){ if(twoHumans) setDir(p2,P2_KEYS[k],false); else setDir(p1,P1_ALT[k],false); }
  if(k===' '||k==='z') keyHeld.b1=false;
  if(k==='x') keyHeld.d1=false;
  if(k==='q') keyHeld.b2=false;
  if(k==='e') keyHeld.d2=false;
});
addEventListener('blur',()=>{
  for(const b of bombers) b.pressed.length=0;
  keyHeld.b1=keyHeld.b2=keyHeld.d1=keyHeld.d2=false;
});

if(matchMedia('(pointer:coarse)').matches) document.body.classList.add('touch');
document.querySelectorAll('#dpad .btn[data-dir]').forEach(el=>{
  const d=el.dataset.dir;
  const on=ev=>{ ev.preventDefault(); ac(); setDir(humanBomber(0),d,true); el.classList.add('on'); };
  const off=ev=>{ ev.preventDefault(); setDir(humanBomber(0),d,false); el.classList.remove('on'); };
  el.addEventListener('pointerdown',on);
  el.addEventListener('pointerup',off);
  el.addEventListener('pointercancel',off);
  el.addEventListener('pointerleave',off);
});
$('bombBtn').addEventListener('pointerdown',e=>{
  e.preventDefault(); ac();
  const p=humanBomber(0); if(p&&mode==='play') p.bombEdge=true;
});
$('detBtn').addEventListener('pointerdown',e=>{
  e.preventDefault(); ac();
  const p=humanBomber(0); if(p&&mode==='play') p.detEdge=true;
});

/* ============================================================
   メインループ
============================================================ */
setHudMode('none');
showTitle();

let last=performance.now();
function loop(now){
  let dt=(now-last)/1000; last=now;
  if(dt>0.05) dt=0.05;
  if(mode==='title'||mode==='pause'||mode==='gameover'||mode==='matchend'){
    tick+=dt;
    if(grid) updateParticles(dt);
    if(shake>0) shake=Math.max(0,shake-dt*22);
  }else{
    update(dt);
  }
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>

      ctx.beginPath(); ctx.moveTo(-rw,-11); ctx.lineTo(rw,-11); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-24,-6); ctx.lineTo(-24,6); ctx.stroke();
      ctx.strokeStyle = '#2a3228'; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(-8,7); ctx.lineTo(-8,10); ctx.lineTo(10,10); ctx.lineTo(10,7); ctx.stroke();
    }
    ctx.restore();

    // ダメージ表示
    if (e.hp < e.maxhp){
      ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(sx-12, e.y-e.h-8, 24, 3);
      ctx.fillStyle = '#ff6a5a'; ctx.fillRect(sx-12, e.y-e.h-8, 24*(e.hp/e.maxhp), 3);
    }
    if (e.stun > 0){
      ctx.fillStyle = '#ffd76a'; ctx.font = '9px Consolas';
      ctx.fillText('×_×', sx-8, e.y-e.h-12);
    }
  }
}

/* --- 弾 --- */
function updateShots(){
  const pb = playerBox();
  for (let i=world.shots.length-1;i>=0;i--){
    const s = world.shots[i];
    if (s.delay > 0){ s.delay--; continue; }
    s.t++;
    if (s.hom && s.t < 90){
      const tx = player.x, ty = player.y - 60;
      const a = Math.atan2(ty - s.y, tx - s.x);
      const ca = Math.atan2(s.vy, s.vx);
      let da = a - ca;
      while (da > Math.PI) da -= 6.283;
      while (da < -Math.PI) da += 6.283;
      const na = ca + clamp(da, -s.hom*3, s.hom*3);
      const sp = Math.hypot(s.vx, s.vy) * 1.012;
      s.vx = Math.cos(na)*sp; s.vy = Math.sin(na)*sp;
    }
    if (s.grav) s.vy += s.grav;
    s.x += s.vx; s.y += s.vy;
    if (s.type === 'missile' && s.t % 2 === 0)
      part(s.x, s.y, rnd(-.3,.3), rnd(-.3,.3), 16, 'smoke', 3, '#8a8880');
    if (s.type === 'gbeam' && s.t % 2 === 0)
      part(s.x, s.y, 0, 0, 12, 'beamdot', 4, '#ffd76a');

    let hit = false;
    // プレイヤーに当たる？
    if (s.foe && player.st !== 'down' && player.emerge <= 0){
      if (s.x > pb.x && s.x < pb.x+pb.w && s.y > pb.y && s.y < pb.y+pb.h){
        hurtPlayer2(s.dmg); hit = true;
        fireball(s.x, s.y, 16, 5);
      }
    }
    if (s.y > GY + 26 || s.life-- < 0 || s.x < cam.x-200 || s.x > cam.x+W+200){
      if (s.y > GY + 20 && s.type !== 'bullet'){ fireball(s.x, GY+8, 18, 5); AU.boom(0.5); crushProps(s.x, 24); }
      hit = true;
    }
    if (hit) world.shots.splice(i,1);
  }
}
function drawShots(){
  for (let i=0;i<world.shots.length;i++){
    const s = world.shots[i];
    if (s.delay > 0) continue;
    const sx = s.x - cam.x;
    if (sx < -30 || sx > W+30) continue;
    const a = Math.atan2(s.vy, s.vx);
    ctx.save(); ctx.translate(sx, s.y); ctx.rotate(a);
    if (s.type === 'missile'){
      ctx.fillStyle = '#d8dce4'; ctx.fillRect(-6,-2, 12, 4);
      ctx.fillStyle = '#c04a3a'; ctx.beginPath(); ctx.moveTo(6,-2); ctx.lineTo(11,0); ctx.lineTo(6,2); ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(255,190,90,.9)';
      ctx.beginPath(); ctx.ellipse(-8,0, 4+Math.random()*2, 2, 0, 0, 6.283); ctx.fill();
    } else if (s.type === 'shell'){
      ctx.fillStyle = '#ffd27a'; ctx.beginPath(); ctx.ellipse(0,0, 5, 2.6, 0, 0, 6.283); ctx.fill();
      ctx.fillStyle = 'rgba(255,200,120,.4)'; ctx.beginPath(); ctx.ellipse(-5,0, 6, 2, 0, 0, 6.283); ctx.fill();
    } else if (s.type === 'bullet'){
      ctx.fillStyle = '#fff3c0'; ctx.fillRect(-3,-1.2, 6, 2.4);
    } else if (s.type === 'gbeam'){
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = 'rgba(255,215,110,.9)';
      ctx.beginPath(); ctx.ellipse(0,0, 9, 4.5, 0, 0, 6.283); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.9)';
      ctx.beginPath(); ctx.ellipse(0,0, 4.5, 2.2, 0, 0, 6.283); ctx.fill();
      ctx.restore();
    } else if (s.type === 'bubble'){
      ctx.fillStyle = 'rgba(180,240,255,.75)';
      ctx.beginPath(); ctx.arc(0,0, s.r||6, 0, 6.283); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 1; ctx.stroke();
    } else if (s.type === 'mmissile'){
      ctx.fillStyle = '#b8c4d4'; ctx.fillRect(-7,-2.4, 14, 4.8);
      ctx.fillStyle = '#ff5a4a'; ctx.beginPath(); ctx.moveTo(7,-2.4); ctx.lineTo(12,0); ctx.lineTo(7,2.4); ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(120,220,255,.9)';
      ctx.beginPath(); ctx.ellipse(-9,0, 4+Math.random()*2, 2, 0, 0, 6.283); ctx.fill();
    }
    ctx.restore();
  }
}

/* --- 出撃管理 --- */
function updateSpawn(){
  const st = STAGES[game.stage];
  const ratio = world.brokenHP / world.totalHP;
  const df = DIFF[game.diff];
  const maxAlive = Math.round((3 + ratio*4 + game.stage) * df.spawn * (world.boss ? 0.5 : 1));
  world.spawnT--;
  if (world.spawnT <= 0 && world.enemies.length < maxAlive && player.st !== 'down'){
    world.spawnT = Math.max(38, (150 - ratio*70 - game.stage*10) / df.spawn) * (world.boss ? 1.9 : 1);
    const pool = ['tank','tank','jet'];
    if (ratio > 0.12 || game.stage >= 1) pool.push('heli','rocket');
    if (ratio > 0.3 || game.stage >= 2) pool.push('maser','rocket','tank');
    if (world.boss) { pool.push('jet','heli'); }
    const type = pool[rndi(0, pool.length-1)];
    spawnEnemy(type, Math.random() < .5 ? 1 : -1);
  }
}

/* ---------------------------------------------------------------
   ボス怪獣
   --------------------------------------------------------------- */
function spawnBoss(){
  const st = STAGES[game.stage];
  const side = player.x < world.len - 500 ? 1 : -1;
  const b = {
    type: st.boss, name: st.bossName,
    x: player.x + side*300, y: GY, w: 76, h: 110,
    hp: Math.round(st.bossHP * DIFF[game.diff].bosshp),
    maxhp: Math.round(st.bossHP * DIFF[game.diff].bosshp),
    alive:true, t:0, st:'entry', stT:0, face:-side, phase:0, walk:0,
    stagger:0, dmgAcc:0, dmgT:0, flash:0, vx:0, vy:0, deadT:0, shield:0, ph2:false,
    pose:{ lean:0, headUp:0, jaw:0, armF:0, armB:0, tailAng:0, legLift:0, bob:0 },
    marks:[], necks:[0,0,0], contactCD:0
  };
  if (b.type === 'ganira'){ b.w = 96; b.h = 74; }
  if (b.type === 'radon'){ b.w = 86; b.h = 62; b.y = GY - 130; }
  if (b.type === 'mecha'){ b.w = 60; b.h = 112; }
  if (b.type === 'gidora'){ b.w = 90; b.h = 92; b.y = GY - 96; }
  // 怪獣どうしの戦いになると自衛隊は半数が撤退する
  for (let i=world.enemies.length-1;i>=0;i--) if (i % 2 === 0) world.enemies.splice(i,1);
  world.boss = b;
  game.state = 'bossin'; game.sub = 0;
  AU.stopBGM();
  AU.roar(true); flash(.55, '#ffd0a0'); shake(14);
  return b;
}

function hurtBoss(dmg, kind){
  const b = world.boss;
  if (!b || !b.alive) return;
  const d = dmg * (b.shield > 0 && kind === 'beam' ? 0.12 : 1);
  b.hp -= d;
  b.flash = Math.min(1, b.flash + d*0.05);
  b.dmgAcc += d; b.dmgT = 60;
  if (b.shield > 0 && kind === 'beam' && Math.random() < 0.06){
    // 反射弾
    shoot({ x:b.x + b.face*20, y:b.y - b.h*0.6, vx:b.face*4.6, vy:rnd(-.6,.6), type:'mmissile', dmg:5, life:120 });
  }
  if (b.dmgAcc > b.maxhp*0.14 && b.stagger <= 0 && b.st !== 'entry'){
    b.dmgAcc = 0; b.stagger = 90; b.st = 'stagger'; b.stT = 0;
    popText(b.x, b.y - b.h - 14, 'ひるんだ!', '#ffd76a', 13);
    AU.roar(false);
  }
  if (b.hp <= 0 && b.alive){
    b.hp = 0; b.alive = false; b.deadT = 0; b.st = 'dying';
    AU.stopBGM(); AU.roar(true); shake(18); flash(.6,'#fff');
    addScore(5000 + game.stage*2000, b.x, b.y - b.h);
  }
}

function bossApproach(b, keep, spd){
  const dx = player.x - b.x;
  const want = player.x - Math.sign(dx || 1) * keep;
  b.face = dx < 0 ? -1 : 1;
  b.vx = lerp(b.vx, clamp((want - b.x)*0.02, -spd, spd), .07);
  b.x = clamp(b.x + b.vx, 60, world.len - 60);
  b.walk += Math.abs(b.vx)*0.09;
}
function bossBox(b){ return { x:b.x-b.w/2, y:b.y-b.h, w:b.w, h:b.h }; }
function bossTouch(b, dmg){
  if (b.contactCD > 0) { b.contactCD--; return; }
  const pb = playerBox(), bb = bossBox(b);
  if (pb.x < bb.x+bb.w && pb.x+pb.w > bb.x && pb.y < bb.y+bb.h && pb.y+pb.h > bb.y){
    hurtPlayer2(dmg); b.contactCD = 40;
    player.x += Math.sign(player.x - b.x || 1) * 22;
  }
}

function updateBoss(){
  const b = world.boss;
  if (!b) return;
  b.t++;
  if (b.flash > 0) b.flash -= 0.05;
  if (b.dmgT > 0){ b.dmgT--; if (b.dmgT === 0) b.dmgAcc = 0; }
  if (b.shield > 0) b.shield--;

  if (!b.alive){
    b.deadT++;
    if (b.deadT % 7 === 0){
      fireball(b.x + rnd(-b.w/2,b.w/2), b.y - rnd(6, b.h), 34, 8);
      AU.boom(1); shake(6);
    }
    if (b.type === 'radon' || b.type === 'gidora'){ b.y = Math.min(GY, b.y + 1.6); }
    b.pose.lean = lerp(b.pose.lean, -1.1, .04);
    if (b.deadT === 96){
      explode(b.x, b.y - b.h/2, 130, 0, false);
      flash(.7, '#fff'); AU.boom(1.6);
    }
    if (b.deadT > 150 && game.state === 'play'){
      game.state = 'clear'; game.sub = 0; AU.clear();
    }
    return;
  }
  if (b.stagger > 0){
    b.stagger--;
    b.pose.lean = Math.sin(b.stagger*0.4)*0.16;
    if (b.type !== 'radon' && b.type !== 'gidora') b.x += Math.sin(b.stagger*0.4)*0.6;
    if (b.stagger === 0){ b.st = 'idle'; b.stT = 0; }
    return;
  }
  b.stT++;
  const fn = BOSS_AI[b.type];
  if (fn) fn(b);
}

const BOSS_AI = {
  /* --- 甲殻怪獣 ガニラ --- */
  ganira(b){
    const dx = player.x - b.x, adx = Math.abs(dx);
    if (b.st === 'entry'){
      bossApproach(b, 120, 2.2);
      if (b.stT > 60){ b.st = 'idle'; b.stT = 0; }
      return;
    }
    if (b.st === 'idle'){
      bossApproach(b, 96, 1.5);
      bossTouch(b, 4);
      if (b.stT > 60){
        const r = Math.random();
        if (adx < 130 && r < .5){ b.st='claw'; b.stT=0; }
        else if (adx > 150 && r < .8){ b.st='dash'; b.stT=0; AU.tone('sawtooth',120,80,.4,.12); }
        else { b.st='bubble'; b.stT=0; }
      }
    } else if (b.st === 'claw'){
      if (b.stT === 26){
        AU.slash();
        const hx = b.x + b.face*58;
        meleeBoxHitPlayer(hx, b.y - 40, 74, 80, 11);
        const bb = buildingAt(hx, 20); if (bb) damageBuilding(bb, 60, hx, GY-30);
        shake(6); dust(hx, GY, 8, 1);
      }
      if (b.stT > 58){ b.st='idle'; b.stT=0; }
    } else if (b.st === 'dash'){
      if (b.stT < 22){ b.vx = lerp(b.vx, -b.face*0.6, .1); b.x += b.vx; }
      else if (b.stT < 66){
        b.vx = lerp(b.vx, b.face*4.6, .2); b.x += b.vx;
        if (b.stT % 4 === 0){ dust(b.x, GY, 4, .9); shake(2); }
        bossTouch(b, 10);
        const bb = buildingAt(b.x + b.face*40, 16);
        if (bb) damageBuilding(bb, 30, bb.x+bb.w/2, GY-20);
      } else { b.vx *= .8; b.x += b.vx; }
      b.x = clamp(b.x, 60, world.len-60);
      if (b.stT > 92){ b.st='idle'; b.stT=0; }
    } else if (b.st === 'bubble'){
      if (b.stT === 24 || b.stT === 38 || b.stT === 52){
        const k = (b.stT-24)/14;
        shoot({ x:b.x + b.face*30, y:b.y - 54, vx:b.face*(2.4+k*0.5), vy:-3.2-k*0.5,
                type:'bubble', r:7, dmg:5, life:200, grav:0.055 });
        AU.tone('sine', 500+k*120, 300, .18, .07);
      }
      if (b.stT > 76){ b.st='idle'; b.stT=0; }
    }
  },

  /* --- 飛翔怪獣 ラドーン --- */
  radon(b){
    const dx = player.x - b.x, adx = Math.abs(dx);
    b.face = dx < 0 ? -1 : 1;
    if (b.st === 'entry'){
      b.x += (player.x + 200 - b.x)*0.02;
      b.y = lerp(b.y, GY-140, .04);
      if (b.stT > 70){ b.st='fly'; b.stT=0; }
      return;
    }
    if (b.st === 'fly'){
      b.y = lerp(b.y, GY - 140 + Math.sin(b.t*0.05)*14, .06);
      const want = player.x - b.face*170;
      b.x = lerp(b.x, want, .012);
      if (b.stT > 90){
        const r = Math.random();
        if (r < .45){ b.st='dive'; b.stT=0; b.diveX = player.x; AU.roar(false); }
        else if (r < .75){ b.st='gust'; b.stT=0; }
        else { b.st='land'; b.stT=0; }
      }
    } else if (b.st === 'dive'){
      const k = b.stT/70;
      if (b.stT < 18){ b.y = lerp(b.y, GY-175, .12); }
      else if (b.stT < 60){
        const kk = (b.stT-18)/42;
        b.x = lerp(b.x, b.diveX + b.face*150, .12);
        b.y = GY - 175 + Math.sin(kk*Math.PI)*120;
        bossTouch(b, 12);
        if (b.stT % 3 === 0) part(b.x, b.y, rnd(-1,1), rnd(-1,1), 20, 'dust', 8, '#8a8a90');
        const bb = buildingAt(b.x, 20);
        if (bb && b.y > GY - bb.h){ damageBuilding(bb, 24, b.x, b.y); }
      } else { b.y = lerp(b.y, GY-140, .08); }
      if (b.stT > 78){ b.st='fly'; b.stT=0; }
    } else if (b.st === 'gust'){
      if (b.stT > 20 && b.stT < 70){
        if (b.stT % 4 === 0){
          for (let i=0;i<3;i++)
            part(b.x - b.face*rnd(10,60), b.y+rnd(-20,20), -b.face*rnd(4,8), rnd(-.6,.6), 26, 'dust', 7, '#a0a8b0');
        }
        if (adx < 260){
          player.x -= b.face * 1.5;
          if (b.stT % 20 === 0) hurtPlayer2(3);
        }
        if (b.stT === 22) AU.noise(1.4,'bandpass',600,.16,1);
      }
      if (b.stT > 92){ b.st='fly'; b.stT=0; }
    } else if (b.st === 'land'){
      b.y = lerp(b.y, GY, .09);
      if (Math.abs(b.y - GY) < 3 && b.stT % 30 === 0){ shake(4); dust(b.x, GY, 6, 1); }
      if (b.stT > 150){ b.st='fly'; b.stT=0; AU.roar(false); }
      bossTouch(b, 6);
    }
    b.x = clamp(b.x, 60, world.len-60);
  },

  /* --- 機械怪獣 メカガイラス --- */
  mecha(b){
    const dx = player.x - b.x, adx = Math.abs(dx);
    if (!b.ph2 && b.hp < b.maxhp*0.42){
      b.ph2 = true; b.st='rage'; b.stT=0;
      popText(b.x, b.y-b.h-16, '第二形態!', '#ff5a4a', 14);
      AU.roar(true); flash(.4,'#ff8a6a');
    }
    if (b.st === 'entry'){
      bossApproach(b, 150, 2.0);
      b.pose.headUp = 0.4;
      if (b.stT > 60){ b.st='idle'; b.stT=0; }
      return;
    }
    if (b.st === 'rage'){
      b.pose.headUp = 1; b.pose.jaw = 0.8;
      if (b.stT % 6 === 0) sparks(b.x+rnd(-24,24), b.y-rnd(20,100), 3, '#7fe0ff');
      if (b.stT > 60){ b.st='idle'; b.stT=0; b.shield = 90; }
      return;
    }
    const spd = b.ph2 ? 1.7 : 1.2;
    if (b.st === 'idle'){
      bossApproach(b, 150, spd);
      b.pose.headUp = lerp(b.pose.headUp, 0, .1);
      b.pose.jaw = lerp(b.pose.jaw, 0, .1);
      b.pose.armF = lerp(b.pose.armF, 0, .1);
      bossTouch(b, 5);
      if (b.stT > (b.ph2 ? 46 : 66)){
        const r = Math.random();
        if (adx < 110){ b.st='punch'; b.stT=0; }
        else if (r < .38){ b.st='missiles'; b.stT=0; }
        else if (r < .74){ b.st='laser'; b.stT=0; AU.tone('sine',300,1500,.7,.07); }
        else { b.st='guard'; b.stT=0; b.shield = 150; AU.tone('square',900,900,.25,.06); }
      }
    } else if (b.st === 'punch'){
      const k = b.stT < 16 ? b.stT/16 : Math.max(0,1-(b.stT-16)/16);
      b.pose.armF = k;
      if (b.stT === 17){
        AU.slash(); meleeBoxHitPlayer(b.x + b.face*54, b.y-72, 66, 60, 10); shake(5);
      }
      if (b.stT > 44){ b.st='idle'; b.stT=0; }
    } else if (b.st === 'missiles'){
      b.pose.armF = 0.6;
      if (b.stT > 18 && b.stT < 60 && b.stT % 8 === 0){
        shoot({ x:b.x + b.face*24, y:b.y-78, vx:b.face*3.2, vy:rnd(-2.2,-.6),
                type:'mmissile', dmg:5, hom:0.03, life:180 });
        AU.missile();
      }
      if (b.stT > 74){ b.st='idle'; b.stT=0; }
    } else if (b.st === 'laser'){
      b.pose.headUp = 0.5; b.pose.jaw = b.ph2 ? 1 : 0.2;
      const eye = { x:b.x + b.face*34, y:b.y - 96 };
      if (b.stT < 44){
        if (b.stT % 4 === 0) sparks(eye.x, eye.y, 2, '#ff6a5a');
        b.laserA = Math.atan2((player.y-64) - eye.y, player.x - eye.x);
      } else if (b.stT < 44 + (b.ph2?54:38)){
        if (b.stT === 44){ AU.beamStart ? AU.tone('sawtooth', 1200, 400, .5, .1) : 0; shake(5); }
        b.laserOn = true;
        // 直線判定
        const bx = player.x - eye.x, by = (player.y-64) - eye.y;
        const dist = Math.hypot(bx,by) || 1;
        const cosd = (Math.cos(b.laserA)*bx + Math.sin(b.laserA)*by) / dist;
        if (cosd > 0.986 && dist < 460) hurtPlayerContinuous(b.ph2 ? 0.3 : 0.2);
        if (b.stT % 6 === 0){
          const hb = buildingAt(eye.x + Math.cos(b.laserA)*160, 30);
          if (hb) damageBuilding(hb, 8, hb.x+hb.w/2, GY-hb.h*0.5);
        }
      } else { b.laserOn = false; }
      if (b.stT > 44 + (b.ph2?54:38) + 20){ b.st='idle'; b.stT=0; b.laserOn=false; }
    } else if (b.st === 'guard'){
      bossApproach(b, 120, spd*0.8);
      b.pose.armF = 0.35;
      if (b.stT > 130){ b.st='idle'; b.stT=0; }
    }
    b.pose.bob = Math.abs(Math.sin(b.walk))*-2;
  },

  /* --- 三面宇宙怪獣 ギドーラ --- */
  gidora(b){
    const dx = player.x - b.x, adx = Math.abs(dx);
    b.face = dx < 0 ? -1 : 1;
    if (!b.ph2 && b.hp < b.maxhp*0.45){
      b.ph2 = true; b.st='rage'; b.stT=0;
      popText(b.x, b.y-b.h-20, '重力波 解放!', '#ffd76a', 14);
      AU.roar(true); flash(.5,'#ffe0a0');
    }
    if (b.st === 'entry'){
      b.y = lerp(b.y, GY-110, .05);
      b.x = lerp(b.x, player.x + 220, .03);
      if (b.stT > 70){ b.st='hover'; b.stT=0; }
      return;
    }
    if (b.st === 'rage'){
      if (b.stT % 4 === 0) sparks(b.x+rnd(-40,40), b.y-rnd(0,80), 3, '#ffd76a');
      b.y = lerp(b.y, GY-150, .06);
      if (b.stT > 70){ b.st='hover'; b.stT=0; }
      return;
    }
    if (b.st === 'hover'){
      b.y = lerp(b.y, GY - 116 + Math.sin(b.t*0.04)*10, .06);
      const want = player.x - b.face*(150 + Math.sin(b.t*0.02)*40);
      b.x = lerp(b.x, want, .02);
      if (b.stT > (b.ph2 ? 52 : 80)){
        const r = Math.random();
        if (r < .42){ b.st='beams'; b.stT=0; }
        else if (r < .66){ b.st='storm'; b.stT=0; b.marks=[]; }
        else if (r < .86){ b.st='swoop'; b.stT=0; AU.roar(false); }
        else { b.st='pull'; b.stT=0; }
      }
    } else if (b.st === 'beams'){
      const fire = b.ph2 ? [22,32,42,52,62,72] : [26,44,62];
      if (fire.indexOf(b.stT) >= 0){
        const hi = fire.indexOf(b.stT) % 3;
        const hx = b.x + b.face*(46 + hi*7), hy = b.y - 114 + hi*9;
        const a = Math.atan2((player.y-60) - hy, player.x - hx) + rnd(-.12,.12);
        for (let k=0;k<(b.ph2?3:2);k++){
          const aa = a + (k-0.5)*0.12;
          shoot({ x:hx, y:hy, vx:Math.cos(aa)*4.6, vy:Math.sin(aa)*4.6, type:'gbeam', dmg:6, life:150, grav:0.02 });
        }
        AU.tone('square', 1200, 500, .22, .07);
        sparks(hx, hy, 5, '#ffd76a');
      }
      if (b.stT > (b.ph2 ? 96 : 84)){ b.st='hover'; b.stT=0; }
    } else if (b.st === 'storm'){
      if (b.stT === 10){
        b.marks = [];
        for (let i=0;i<(b.ph2?5:3);i++) b.marks.push({ x: player.x + rnd(-160,160), t:0 });
      }
      for (let i=0;i<b.marks.length;i++){
        const m = b.marks[i]; m.t++;
        if (m.t === 56){
          // 落雷
          for (let k=0;k<10;k++) sparks(m.x + rnd(-8,8), GY - k*22, 2, '#ffe9a0');
          fireball(m.x, GY-10, 30, 8);
          AU.boom(0.9); shake(6); flash(.2,'#ffe9a0');
          if (Math.abs(player.x - m.x) < 34) hurtPlayer2(9);
          const hb = buildingAt(m.x, 10); if (hb) damageBuilding(hb, 55, m.x, GY-hb.h*0.5);
        }
      }
      if (b.stT > 110){ b.st='hover'; b.stT=0; b.marks=[]; }
    } else if (b.st === 'swoop'){
      if (b.stT < 20){ b.y = lerp(b.y, GY-180, .12); }
      else if (b.stT < 74){
        const kk = (b.stT-20)/54;
        b.x += b.face * 5.2;
        b.y = GY - 180 + Math.sin(kk*Math.PI)*116;
        bossTouch(b, 12);
        if (b.stT % 3 === 0) part(b.x, b.y, rnd(-1,1), rnd(-1,1), 20, 'dust', 7, '#c8b070');
        const bb = buildingAt(b.x, 24);
        if (bb && b.y > GY - bb.h) damageBuilding(bb, 30, b.x, b.y);
      } else { b.y = lerp(b.y, GY-120, .08); }
      if (b.stT > 96){ b.st='hover'; b.stT=0; }
      b.x = clamp(b.x, 60, world.len-60);
    } else if (b.st === 'pull'){
      if (b.stT > 16 && b.stT < 96){
        if (adx > 60) player.x += Math.sign(dx ? -dx : 1) * -1.1;
        if (b.stT % 5 === 0)
          part(player.x + rnd(-40,40), player.y - rnd(0,110), Math.sign(b.x-player.x)*2.4, rnd(-1,1), 20, 'beamdot', 3, '#ffd76a');
        if (b.stT % 30 === 0) hurtPlayerContinuous(1.6);
        if (b.stT === 18) AU.tone('sine', 90, 260, 1.4, .08);
      }
      if (b.stT > 116){ b.st='hover'; b.stT=0; }
    }
    // 首のうねり
    for (let i=0;i<3;i++) b.necks[i] = Math.sin(b.t*0.05 + i*2.1) * 0.22;
  }
};

function meleeBoxHitPlayer(cx, cy, w, h, dmg){
  const pb = playerBox();
  if (pb.x < cx+w/2 && pb.x+pb.w > cx-w/2 && pb.y < cy+h/2 && pb.y+pb.h > cy-h/2){
    hurtPlayer2(dmg);
    player.x += Math.sign(player.x - cx || 1) * 18;
  }
  sparks(cx, cy, 6, '#ffb060');
}

/* ---------------------------------------------------------------
   ボスの描画
   --------------------------------------------------------------- */
function drawBoss(){
  const b = world.boss;
  if (!b) return;
  // 落雷の予告
  if (b.marks && b.marks.length){
    for (let i=0;i<b.marks.length;i++){
      const m = b.marks[i];
      if (m.t > 60) continue;
      const sx = m.x - cam.x;
      const k = Math.min(1, m.t/56);
      ctx.save();
      ctx.globalAlpha = 0.35 + Math.sin(m.t*0.6)*0.25;
      ctx.strokeStyle = '#ffd76a'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(sx, GY+4, 20*(1-k)+8, 0, 6.283); ctx.stroke();
      ctx.fillStyle = 'rgba(255,220,120,.2)';
      ctx.fillRect(sx-14, 0, 28, GY);
      ctx.restore();
    }
  }

  const sx = b.x - cam.x;
  if (sx < -180 || sx > W+180) return;
  ctx.save();
  ctx.translate(sx, b.y);

  if (b.type === 'ganira')      drawGanira(b);
  else if (b.type === 'radon')  drawRadon(b);
  else if (b.type === 'mecha')  drawMecha(b);
  else if (b.type === 'gidora') drawGidora(b);

  ctx.restore();

  // メカのレーザー
  if (b.type === 'mecha' && b.laserOn){
    const eye = { x:b.x + b.face*34 - cam.x, y:b.y - 96 };
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const len = 460;
    const ex = eye.x + Math.cos(b.laserA)*len, ey = eye.y + Math.sin(b.laserA)*len;
    ctx.strokeStyle = b.ph2 ? 'rgba(150,220,255,.4)' : 'rgba(255,80,60,.4)';
    ctx.lineWidth = b.ph2 ? 16 : 9;
    ctx.beginPath(); ctx.moveTo(eye.x, eye.y); ctx.lineTo(ex, ey); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = b.ph2 ? 5 : 2.6;
    ctx.beginPath(); ctx.moveTo(eye.x, eye.y); ctx.lineTo(ex, ey); ctx.stroke();
    ctx.restore();
  }
  // 反射シールド
  if (b.shield > 0 && b.alive){
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = 'rgba(120,220,255,' + (0.3 + Math.sin(game.t*0.3)*0.15) + ')';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.ellipse(sx, b.y - b.h*0.5, b.w*0.75, b.h*0.62, 0, 0, 6.283); ctx.stroke();
    ctx.fillStyle = 'rgba(90,190,255,.09)';
    ctx.beginPath(); ctx.ellipse(sx, b.y - b.h*0.5, b.w*0.75, b.h*0.62, 0, 0, 6.283); ctx.fill();
    ctx.restore();
  }
  // ダメージ点滅
  if (b.flash > 0){
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba(255,120,90,' + Math.min(.5, b.flash*0.5) + ')';
    ctx.beginPath(); ctx.ellipse(sx, b.y - b.h*0.5, b.w*0.6, b.h*0.55, 0, 0, 6.283); ctx.fill();
    ctx.restore();
  }
}

/* --- 甲殻怪獣 ガニラ --- */
function drawGanira(b){
  const f = b.face;
  ctx.scale(f, 1);
  const walk = b.walk;
  const dead = !b.alive;
  if (dead) ctx.rotate(Math.min(0.9, b.deadT*0.01));
  // 脚
  ctx.strokeStyle = '#8a3a2a'; ctx.lineWidth = 5;
  for (let i=0;i<3;i++){
    for (const s of [-1,1]){
      const px = -34 + i*26;
      const ph = walk*2 + i*1.6 + (s<0?1.6:0);
      const lift = Math.max(0, Math.sin(ph))*6;
      ctx.beginPath();
      ctx.moveTo(px, -34);
      ctx.lineTo(px + s*16, -20 - lift*0.4);
      ctx.lineTo(px + s*26 + Math.cos(ph)*4, -2 - lift);
      ctx.stroke();
    }
  }
  // 甲羅
  const g = ctx.createLinearGradient(0,-76, 0,-24);
  g.addColorStop(0, '#e0714a'); g.addColorStop(.5, '#b8442c'); g.addColorStop(1, '#7a2618');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(-46,-30);
  ctx.bezierCurveTo(-46,-66, -22,-76, 4,-76);
  ctx.bezierCurveTo(30,-76, 48,-64, 46,-30);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#5a1a10'; ctx.lineWidth = 1.6; ctx.stroke();
  // トゲ
  ctx.fillStyle = '#f0c8a0';
  for (let i=0;i<5;i++){
    const px = -34 + i*17, py = -62 - Math.sin(i/4*Math.PI)*10;
    ctx.beginPath(); ctx.moveTo(px-5, py+6); ctx.lineTo(px, py-8); ctx.lineTo(px+5, py+6); ctx.closePath(); ctx.fill();
  }
  // 甲羅の模様
  ctx.strokeStyle = 'rgba(90,20,10,.5)'; ctx.lineWidth = 1.4;
  for (let i=0;i<3;i++){
    ctx.beginPath(); ctx.ellipse(2, -46, 34-i*10, 22-i*6, 0, Math.PI*1.05, Math.PI*1.95); ctx.stroke();
  }
  // 目（眼柄）
  for (const s of [-1,1]){
    const ex = 16 + s*7, ey = -78 + Math.sin(b.t*0.06 + s)*2;
    ctx.strokeStyle = '#c85a3a'; ctx.lineWidth = 3.4;
    ctx.beginPath(); ctx.moveTo(ex-2, -70); ctx.lineTo(ex, ey); ctx.stroke();
    ctx.fillStyle = dead ? '#666' : '#fff8e0';
    ctx.beginPath(); ctx.arc(ex, ey-3, 4.4, 0, 6.283); ctx.fill();
    ctx.fillStyle = dead ? '#333' : '#1a1a1a';
    ctx.beginPath(); ctx.arc(ex+1.4, ey-3, 2.2, 0, 6.283); ctx.fill();
  }
  // 口の泡
  if (b.st === 'bubble' && b.stT > 14){
    for (let i=0;i<3;i++){
      ctx.fillStyle = 'rgba(200,240,255,.55)';
      ctx.beginPath(); ctx.arc(26+rnd(-4,4), -34+rnd(-4,4), rnd(2,5), 0, 6.283); ctx.fill();
    }
  }
  // ハサミ
  const clawK = b.st === 'claw' ? (b.stT < 26 ? b.stT/26 : Math.max(0, 1-(b.stT-26)/24)) : 0;
  for (const s of [0,1]){
    ctx.save();
    const isFront = s === 1;
    ctx.translate(28 + s*6, -46 + s*4);
    ctx.rotate(isFront ? (-0.5 + clawK*1.4) : (-0.2 + Math.sin(b.t*0.05)*0.08));
    ctx.strokeStyle = isFront ? '#c05238' : '#8a3a2a'; ctx.lineWidth = 9;
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(22,6); ctx.stroke();
    ctx.translate(24, 7);
    ctx.rotate(0.2);
    const cg = ctx.createLinearGradient(0,-14, 0,14);
    cg.addColorStop(0, isFront ? '#e8845c' : '#b8543c'); cg.addColorStop(1, '#8a2a1a');
    ctx.fillStyle = cg;
    // 上のはさみ
    ctx.save();
    ctx.rotate(-(0.1 + clawK*0.5));
    ctx.beginPath(); ctx.moveTo(-4,0); ctx.quadraticCurveTo(14,-16, 30,-6); ctx.quadraticCurveTo(16,-2, -2,2); ctx.closePath(); ctx.fill();
    ctx.restore();
    // 下のはさみ
    ctx.beginPath(); ctx.moveTo(-4,0); ctx.quadraticCurveTo(16,14, 32,6); ctx.quadraticCurveTo(16,4, -2,-1); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
}

/* --- 飛翔怪獣 ラドーン --- */
function drawRadon(b){
  const f = b.face;
  ctx.scale(f, 1);
  const flying = b.st !== 'land';
  const flap = Math.sin(b.t*(b.st==='dive'?0.1:0.16));
  const dead = !b.alive;
  if (b.st === 'dive' && b.stT > 18 && b.stT < 60) ctx.rotate(0.5);
  if (dead) ctx.rotate(Math.min(1.2, b.deadT*0.014));
  ctx.translate(0, -34);

  // 奥の翼
  const drawWing = (side, alpha) => {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.rotate(side * (0.1 + flap*0.42));
    const g = ctx.createLinearGradient(0,-30, -20,40);
    g.addColorStop(0, '#7a4a3a'); g.addColorStop(1, '#4a2820');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(-4,-6);
    ctx.quadraticCurveTo(-46,-34, -84,-16);
    ctx.quadraticCurveTo(-64, 2, -50, 4);
    ctx.quadraticCurveTo(-60, 12, -34, 12);
    ctx.quadraticCurveTo(-40, 22, -12, 14);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#3a1e18'; ctx.lineWidth = 1.4; ctx.stroke();
    ctx.strokeStyle = 'rgba(40,20,16,.6)'; ctx.lineWidth = 1.2;
    for (let i=0;i<3;i++){
      ctx.beginPath(); ctx.moveTo(-6,-4);
      ctx.quadraticCurveTo(-40,-16-i*2, -76+i*14, -12+i*10);
      ctx.stroke();
    }
    ctx.restore();
  };
  drawWing(-1, 0.75);

  // しっぽ
  ctx.strokeStyle = '#8a5240'; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.moveTo(-18,4); ctx.quadraticCurveTo(-44, 10+flap*6, -60, 22+flap*8); ctx.stroke();
  ctx.fillStyle = '#a06a50';
  ctx.beginPath(); ctx.moveTo(-58, 18+flap*8); ctx.lineTo(-72, 22+flap*10); ctx.lineTo(-58, 28+flap*8); ctx.closePath(); ctx.fill();

  // 胴体
  const bg = ctx.createLinearGradient(0,-20, 0,22);
  bg.addColorStop(0, '#b07a58'); bg.addColorStop(1, '#6a3f2c');
  ctx.fillStyle = bg;
  ctx.beginPath();
  ctx.ellipse(0, 2, 30, 18, -0.1, 0, 6.283); ctx.fill();
  ctx.strokeStyle = '#4a2820'; ctx.lineWidth = 1.4; ctx.stroke();
  // 脚
  ctx.strokeStyle = '#8a5240'; ctx.lineWidth = 5;
  for (const s of [0,1]){
    const ly = flying ? 12 : 22, lx = 6 - s*10;
    ctx.beginPath(); ctx.moveTo(lx, 10); ctx.lineTo(lx+4, ly+ (flying?8:14)); ctx.stroke();
    ctx.fillStyle = '#c8b090';
    ctx.beginPath(); ctx.moveTo(lx+2, ly+(flying?8:14)); ctx.lineTo(lx+12, ly+(flying?10:16)); ctx.lineTo(lx+2, ly+(flying?12:18)); ctx.closePath(); ctx.fill();
  }

  // 首と頭
  ctx.save();
  ctx.translate(22, -8);
  ctx.rotate(-0.25 + Math.sin(b.t*0.04)*0.06 + (b.st==='dive'?0.3:0));
  ctx.strokeStyle = '#9a6a4a'; ctx.lineWidth = 11;
  ctx.beginPath(); ctx.moveTo(-4,4); ctx.lineTo(16,-8); ctx.stroke();
  ctx.translate(18,-10);
  // くちばし
  ctx.fillStyle = '#c8a070';
  ctx.beginPath(); ctx.moveTo(0,-4); ctx.lineTo(30,-1); ctx.lineTo(0,4); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#a8845a';
  ctx.beginPath(); ctx.moveTo(0,2); ctx.lineTo(26,3); ctx.lineTo(0,7); ctx.closePath(); ctx.fill();
  // 頭
  ctx.fillStyle = '#b07a58';
  ctx.beginPath(); ctx.ellipse(-2,-2, 12, 9, 0, 0, 6.283); ctx.fill();
  // とさか
  ctx.fillStyle = '#8a4a34';
  ctx.beginPath(); ctx.moveTo(-4,-8); ctx.lineTo(-26,-16); ctx.lineTo(-6,2); ctx.closePath(); ctx.fill();
  // 目
  ctx.fillStyle = dead ? '#555' : '#ffd24a';
  ctx.beginPath(); ctx.arc(4,-4, 3, 0, 6.283); ctx.fill();
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath(); ctx.arc(5,-4, 1.4, 0, 6.283); ctx.fill();
  ctx.restore();

  // 手前の翼
  drawWing(1, 1);
}

/* --- 機械怪獣 メカガイラス --- */
function drawMecha(b){
  ctx.translate(-(b.x - cam.x), -b.y);   // drawKaiju が自前で座標を持つため戻す
  drawKaiju({
    x:b.x, y:b.y, face:b.face, scale:1.0, phase:b.walk, pose:b.pose,
    charge: b.st==='laser' && b.stT < 44 ? (b.stT/44)*100 : 0,
    burst:false, beamOn:false, dead:!b.alive, mecha:true, shield:b.shield,
    pal:PAL_MECHA, flashK:0
  });
  // 目の充填光
  if (b.st === 'laser' && b.stT < 44){
    const ex = b.x - cam.x + b.face*34, ey = b.y - 96;
    ctx.save(); ctx.globalCompositeOperation='lighter';
    const r = 3 + (b.stT/44)*8;
    const g = ctx.createRadialGradient(ex,ey,0, ex,ey,r);
    g.addColorStop(0,'#fff'); g.addColorStop(.4, b.ph2?'#8fe6ff':'#ff5a4a'); g.addColorStop(1,'rgba(255,0,0,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(ex,ey,r,0,6.283); ctx.fill();
    ctx.restore();
  }
}

/* --- 三面宇宙怪獣 ギドーラ --- */
function drawGidora(b){
  const f = b.face;
  ctx.scale(f, 1);
  const dead = !b.alive;
  const flap = Math.sin(b.t*0.07);
  if (dead) ctx.rotate(Math.min(0.9, b.deadT*0.01));

  // 翼（奥・手前で角度を変えて2枚に見せる）
  for (const side of [-1, 1]){
    ctx.save();
    ctx.translate(-10, -70);
    ctx.rotate(side*0.34 + flap*0.26 - 0.1);
    ctx.scale(1, side < 0 ? 0.82 : 1);
    const g = ctx.createLinearGradient(0,-46, -70,30);
    if (side < 0){ g.addColorStop(0, '#7a5c1c'); g.addColorStop(1, '#3e2e0c'); }
    else { g.addColorStop(0, '#d8ac4c'); g.addColorStop(1, '#7a5c1c'); }
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(2,-10);
    ctx.quadraticCurveTo(-46,-62, -104,-40);
    ctx.quadraticCurveTo(-78,-16, -64,-10);
    ctx.quadraticCurveTo(-84, 2, -46, 6);
    ctx.quadraticCurveTo(-56, 22, -10, 18);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#3e2e0c'; ctx.lineWidth = 1.6; ctx.stroke();
    // 翼の骨
    ctx.strokeStyle = 'rgba(60,44,10,.75)'; ctx.lineWidth = 2;
    const tips = [[-100,-38],[-72,-12],[-48,4]];
    for (let i=0;i<3;i++){
      ctx.beginPath(); ctx.moveTo(0,-8);
      ctx.quadraticCurveTo(-40,-34+i*12, tips[i][0], tips[i][1]); ctx.stroke();
    }
    ctx.restore();
  }
  // 二又のしっぽ
  for (const s of [0,1]){
    ctx.strokeStyle = s ? '#d8b048' : '#a88830'; ctx.lineWidth = 8-s*2;
    ctx.beginPath();
    ctx.moveTo(-24,-30);
    ctx.quadraticCurveTo(-58,-16+s*10+flap*6, -84, 4+s*16+flap*10);
    ctx.stroke();
  }
  // 胴体
  const bg = ctx.createLinearGradient(0,-92, 0,-6);
  bg.addColorStop(0, '#f0d070'); bg.addColorStop(.5, '#d8a840'); bg.addColorStop(1, '#8a6820');
  ctx.fillStyle = bg;
  ctx.beginPath();
  ctx.moveTo(-28,-26);
  ctx.bezierCurveTo(-34,-64, -18,-92, 6,-92);
  ctx.bezierCurveTo(28,-92, 34,-64, 28,-30);
  ctx.bezierCurveTo(16,-6, -14,-6, -28,-26);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#6a5018'; ctx.lineWidth = 1.5; ctx.stroke();
  // 腹の甲板
  ctx.save();
  ctx.beginPath(); ctx.ellipse(6,-44, 17, 34, -0.06, 0, 6.283); ctx.clip();
  ctx.fillStyle = '#f6e2a0'; ctx.fillRect(-14,-84, 44, 84);
  ctx.strokeStyle = 'rgba(140,105,25,.55)'; ctx.lineWidth = 1.6;
  for (let i=0;i<8;i++){ ctx.beginPath(); ctx.moveTo(-14,-78+i*10); ctx.lineTo(30,-76+i*10); ctx.stroke(); }
  ctx.restore();
  // うろこ
  ctx.strokeStyle = 'rgba(120,90,20,.5)'; ctx.lineWidth = 1;
  for (let i=0;i<5;i++){
    ctx.beginPath(); ctx.ellipse(-6,-30-i*12, 18-i*2, 8, 0, Math.PI, 0); ctx.stroke();
  }
  // 脚
  ctx.strokeStyle = '#b89030'; ctx.lineWidth = 9;
  for (const s of [0,1]){
    const lx = -8 + s*18;
    ctx.beginPath(); ctx.moveTo(lx,-22); ctx.lineTo(lx+2+s*4, -4 + Math.sin(b.t*0.05+s)*2); ctx.stroke();
    ctx.fillStyle = '#e8d8a0';
    for (let k=0;k<3;k++){
      ctx.beginPath();
      ctx.moveTo(lx+s*4, -4); ctx.lineTo(lx+6+k*3+s*4, 2); ctx.lineTo(lx+s*4, 0); ctx.closePath(); ctx.fill();
    }
  }
  // 3本の首
  for (let i=0;i<3;i++){
    const off = (i-1);
    const baseX = 4 + off*9, baseY = -74 - Math.abs(off)*4;
    const sway = b.necks[i] + (b.st==='beams' ? Math.sin(b.stT*0.2)*0.06 : 0);
    ctx.save();
    ctx.translate(baseX, baseY);
    ctx.rotate(-0.42 + off*0.52 + sway);
    ctx.globalAlpha = i === 1 ? 1 : 0.94;
    // 首
    const pts = [[0,0],[16,-15],[33,-29],[47,-39]];
    const ws = [16,13,11,9];
    taperPath(pts, ws);
    const ng = ctx.createLinearGradient(0,0, 40,-32);
    ng.addColorStop(0,'#c8a040'); ng.addColorStop(1,'#e8c860');
    ctx.fillStyle = ng; ctx.fill();
    ctx.strokeStyle = '#6a5018'; ctx.lineWidth = 1.2; ctx.stroke();
    // 頭
    ctx.translate(49,-41);
    ctx.rotate(-0.15);
    ctx.fillStyle = '#e8c860';
    ctx.beginPath();
    ctx.moveTo(-8,-6); ctx.quadraticCurveTo(6,-12, 20,-6);
    ctx.lineTo(22,0); ctx.quadraticCurveTo(6,6, -8,6);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#6a5018'; ctx.stroke();
    // 角（二叉）
    ctx.fillStyle = '#f4e2a0';
    ctx.beginPath(); ctx.moveTo(-2,-8); ctx.lineTo(-12,-22); ctx.lineTo(2,-9); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(4,-8); ctx.lineTo(0,-24); ctx.lineTo(8,-9); ctx.closePath(); ctx.fill();
    // 目
    ctx.fillStyle = dead ? '#555' : '#ff4a4a';
    ctx.beginPath(); ctx.arc(8,-3, 2.6, 0, 6.283); ctx.fill();
    // 口の光
    if (b.st === 'beams' && b.stT > 14 && b.stT < 90){
      ctx.save(); ctx.globalCompositeOperation='lighter';
      const r = 4 + Math.abs(Math.sin(b.stT*0.2))*7;
      const g = ctx.createRadialGradient(20,0,0, 20,0,r);
      g.addColorStop(0,'#fff'); g.addColorStop(.4,'#ffd76a'); g.addColorStop(1,'rgba(255,180,60,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(20,0,r,0,6.283); ctx.fill();
      ctx.restore();
    }
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

/* ---------------------------------------------------------------
   HUD
   --------------------------------------------------------------- */
function bar(x, y, w, h, k, col, bg, label){
  ctx.fillStyle = bg || 'rgba(0,0,0,.55)';
  ctx.fillRect(x-1, y-1, w+2, h+2);
  ctx.fillStyle = 'rgba(255,255,255,.08)';
  ctx.fillRect(x, y, w, h);
  const g = ctx.createLinearGradient(x, y, x, y+h);
  g.addColorStop(0, col[0]); g.addColorStop(1, col[1]);
  ctx.fillStyle = g;
  ctx.fillRect(x, y, Math.max(0, w*clamp(k,0,1)), h);
  if (label){
    ctx.font = 'bold 8px Consolas, monospace';
    ctx.fillStyle = 'rgba(255,255,255,.75)';
    ctx.fillText(label, x+2, y+h-1.5);
  }
}

function drawHUD(){
  const st = STAGES[game.stage];
  ctx.textAlign = 'left';
  // ライフ・エネルギー・怒り
  bar(10, 10, 116, 9, player.hp/player.maxhp, ['#ff8a6a','#c8321e'], null, 'LIFE');
  bar(10, 22, 116, 7, player.energy/player.maxEnergy, ['#8fe6ff','#2a86c8'], null, 'HEAT');
  const rk = player.rage/player.maxRage;
  bar(10, 32, 116, 7, rk, rk>=1 ? ['#ffe08a','#ff6a1e'] : ['#ffbb6a','#c8641e'], null, 'RAGE');
  if (rk >= 1 && Math.floor(game.t/12)%2===0){
    ctx.font = 'bold 9px Consolas'; ctx.fillStyle = '#ffd76a';
    ctx.fillText('MAX! ほうこうでバースト', 130, 39);
  }
  if (player.burstT > 0){
    ctx.font = 'bold 10px Consolas'; ctx.fillStyle = '#ff9a5a';
    ctx.fillText('BURST ' + Math.ceil(player.burstT/60), 130, 39);
  }

  // スコア・タイム
  ctx.textAlign = 'right';
  ctx.font = 'bold 12px Consolas, monospace';
  ctx.fillStyle = '#ffd76a';
  ctx.fillText(String(game.score).padStart(7,'0'), W-10, 20);
  ctx.font = '9px Consolas, monospace';
  ctx.fillStyle = '#9aa6bc';
  ctx.fillText('HI ' + String(game.hi).padStart(7,'0'), W-10, 31);
  const sec = Math.ceil(game.time/60);
  ctx.font = 'bold 13px Consolas, monospace';
  ctx.fillStyle = sec <= 20 ? (Math.floor(game.t/8)%2 ? '#ff5a4a' : '#ffb0a0') : '#dfe6f2';
  ctx.fillText('TIME ' + sec, W-10, 45);
  ctx.textAlign = 'left';

  // 破壊率
  const ratio = clamp(world.brokenHP/world.totalHP, 0, 1);
  const bw = 150, bx = W/2 - bw/2, by = H - 20;
  ctx.font = 'bold 9px Consolas';
  ctx.fillStyle = '#c8d4e8';
  ctx.fillText('はかいりつ', bx, by-3);
  bar(bx, by, bw, 8, ratio, ['#ffd27a','#e0741e']);
  // 目標マーカー
  const tx = bx + bw*st.target;
  ctx.fillStyle = world.boss ? '#7dff9a' : '#fff';
  ctx.fillRect(tx-1, by-3, 2, 14);
  ctx.textAlign = 'right';
  ctx.font = 'bold 10px Consolas';
  ctx.fillStyle = ratio >= st.target ? '#7dff9a' : '#ffd27a';
  ctx.fillText(Math.floor(ratio*100) + '%', bx+bw+30, by+8);
  ctx.textAlign = 'left';
  ctx.font = '8px Consolas';
  ctx.fillStyle = '#8a94ac';
  ctx.fillText('STAGE ' + (game.stage+1) + ' ' + st.name, 10, H-24);

  // ボスHP
  const b = world.boss;
  if (b && (b.alive || b.deadT < 60)){
    const w2 = 190, x2 = W/2 - w2/2, y2 = 56;
    ctx.textAlign = 'center';
    ctx.font = 'bold 10px "Hiragino Kaku Gothic ProN", Meiryo, sans-serif';
    ctx.fillStyle = '#ff9a8a';
    ctx.fillText(b.name, W/2, y2-3);
    bar(x2, y2, w2, 8, b.hp/b.maxhp, ['#ff9a5a','#c81e1e']);
    ctx.textAlign = 'left';
  }

  // チャージゲージ
  if (player.charging && player.charge > 0){
    const px = player.x - cam.x, py = player.y - 132;
    const k = player.charge/100;
    ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(px-26, py, 52, 6);
    const g = ctx.createLinearGradient(px-26, 0, px+26, 0);
    g.addColorStop(0, '#5ad0ff'); g.addColorStop(1, k>=1 ? '#ffffff' : '#a0f0ff');
    ctx.fillStyle = g; ctx.fillRect(px-26, py, 52*k, 6);
    if (k >= 1){
      ctx.fillStyle = Math.floor(game.t/5)%2 ? '#fff' : '#8fe6ff';
      ctx.font = 'bold 9px Consolas'; ctx.textAlign='center';
      ctx.fillText('MAX', px, py-3); ctx.textAlign='left';
    }
  }

  // 画面外のボス位置
  if (b && b.alive){
    const sx = b.x - cam.x;
    if (sx < 0 || sx > W){
      const ax = sx < 0 ? 16 : W-16;
      ctx.save();
      ctx.translate(ax, 100);
      ctx.rotate(sx < 0 ? Math.PI : 0);
      ctx.fillStyle = 'rgba(255,90,70,.85)';
      ctx.beginPath(); ctx.moveTo(8,0); ctx.lineTo(-6,-7); ctx.lineTo(-6,7); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
  }
}

/* --- バナー --- */
let banner = null;
function showBanner(text, sub, col, dur){
  banner = { text, sub, col: col || '#ffd76a', t:0, dur: dur || 150 };
}
function drawBanner(){
  if (!banner) return;
  banner.t++;
  if (banner.t > banner.dur){ banner = null; return; }
  const k = banner.t / banner.dur;
  let a = 1;
  if (k < 0.12) a = k/0.12;
  if (k > 0.85) a = (1-k)/0.15;
  const slide = k < 0.12 ? (1-k/0.12)*60 : (k > 0.85 ? (k-0.85)/0.15*-60 : 0);
  ctx.save();
  ctx.globalAlpha = clamp(a,0,1);
  ctx.translate(slide, 0);
  ctx.fillStyle = 'rgba(6,8,16,.72)';
  ctx.fillRect(0, H/2-34, W, 56);
  ctx.fillStyle = banner.col;
  ctx.fillRect(0, H/2-34, W, 2); ctx.fillRect(0, H/2+20, W, 2);
  ctx.textAlign = 'center';
  ctx.font = 'bold 20px "Hiragino Kaku Gothic ProN", Meiryo, sans-serif';
  ctx.fillStyle = banner.col;
  ctx.fillText(banner.text, W/2, H/2-8);
  if (banner.sub){
    ctx.font = '10px Consolas, monospace';
    ctx.fillStyle = 'rgba(255,255,255,.75)';
    ctx.fillText(banner.sub, W/2, H/2+11);
  }
  ctx.textAlign = 'left';
  ctx.restore();
}

   ステージ進行
   --------------------------------------------------------------- */
function startStage(idx){
  game.stage = idx;
  genStage(idx);
  resetPlayer();
  const st = STAGES[idx];
  game.time = st.time * 60;
  game.state = 'play'; game.sub = 0;
  cam.x = clamp(player.x - W*0.4, 0, world.len - W);
  banner = null;
  showBanner(st.name, st.eng + '   目標 はかいりつ ' + Math.floor(st.target*100) + '%', '#ffd76a', 160);
  AU.startBGM('city');
}

function stageClearScore(){
  const st = STAGES[game.stage];
  const ratio = clamp(world.brokenHP/world.totalHP, 0, 1);
  const timeB = Math.ceil(game.time/60) * 20;
  const destB = Math.floor(ratio * 100) * 120;
  const lifeB = Math.round(player.hp) * 30;
  game.result = { ratio, timeB, destB, lifeB, total: timeB + destB + lifeB };
  game.score += game.result.total;
  if (game.score > game.hi){ game.hi = game.score; }
  if (game.stage + 1 > game.unlocked){ game.unlocked = Math.min(STAGES.length-1, game.stage+1); }
  saveProgress();
}

function updatePlay(){
  game.t++;
  updatePlayer();
  updateBuildings();
  updateEnemies();
  updateShots();
  updateProps();
  updateParts();
  if (world.boss) updateBoss();
  updateSpawn();

  // 時間
  if (player.st !== 'down'){
    game.time--;
    if (game.time <= 0){
      game.time = 0;
      player.hp = 0; player.st = 'down'; player.downT = 0;
      player.charging = false; player.beamT = 0; AU.beamStop();
      AU.stopBGM(); AU.over();
      showBanner('タイム アップ', 'TIME UP', '#ff6a5a', 200);
    }
  }

  // ボス出現
  const st = STAGES[game.stage];
  const ratio = world.brokenHP / world.totalHP;
  if (!world.boss && ratio >= st.target && player.st !== 'down'){
    const b = spawnBoss();
    game.state = 'play';
    showBanner(b.name, 'WARNING!!  巨大生物 接近', '#ff5a4a', 170);
    AU.startBGM('boss');
    // 街の被害でスコア加算のヒント
    popText(player.x, player.y-140, '来たぞ!', '#ff8a6a', 13);
  }

  // カメラ
  let target = player.x - W*0.5 + player.face*46;
  const b = world.boss;
  if (b && b.alive && Math.abs(b.x - player.x) < 340){
    target = (player.x + b.x)/2 - W/2;
    target = clamp(target, player.x - W + 90, player.x - 90);
  }
  cam.x = lerp(cam.x, clamp(target, 0, world.len - W), .09);
  cam.x = clamp(cam.x, 0, world.len - W);
  if (cam.shake > 0) cam.shake *= 0.88;
  if (cam.flash > 0) cam.flash *= 0.88;
}

function updateTitle(){
  game.t++;
  const rows = game.unlocked > 0 ? 3 : 2;
  if (pressed.up)   { game.menu = (game.menu + rows - 1) % rows; AU.tone('square',600,600,.05,.06); }
  if (pressed.down) { game.menu = (game.menu + 1) % rows; AU.tone('square',600,600,.05,.06); }
  if (game.menu === 1){
    if (pressed.left){ game.diff = (game.diff+2)%3; saveProgress(); AU.tone('square',500,700,.06,.06); }
    if (pressed.right){ game.diff = (game.diff+1)%3; saveProgress(); AU.tone('square',500,700,.06,.06); }
  }
  if (game.menu === 2){
    if (pressed.left){ game.menuStage = (game.menuStage + game.unlocked) % (game.unlocked+1); AU.tone('square',500,700,.06,.06); }
    if (pressed.right){ game.menuStage = (game.menuStage + 1) % (game.unlocked+1); AU.tone('square',500,700,.06,.06); }
  }
  // タップ
  if (tap){
    for (let i=0;i<3;i++){
      if (i === 2 && game.unlocked === 0) continue;
      const y = 156 + i*26;
      if (tap.y > y-14 && tap.y < y+8 && tap.x > W/2-160 && tap.x < W/2+160){
        if (game.menu === i && i === 0){ startGame(); }
        else if (i === 1){
          if (game.menu === 1){ game.diff = (game.diff+1)%3; saveProgress(); }
          game.menu = 1;
        } else if (i === 2){
          if (game.menu === 2){ game.menuStage = (game.menuStage+1) % (game.unlocked+1); }
          game.menu = 2;
        } else game.menu = i;
        AU.tone('square',700,700,.06,.07);
      }
    }
    tap = null;
  }
  if (pressed.claw || pressed.beam || pressed.tail){
    if (game.menu === 0) startGame();
    else if (game.menu === 1) { game.diff = (game.diff+1)%3; saveProgress(); }
    else { game.menuStage = (game.menuStage+1) % (game.unlocked+1); }
  }
}
function startGame(){
  AU.unlock();
  game.score = 0;
  startStage(game.unlocked > 0 ? game.menuStage : 0);
  AU.tone('square', 880, 1320, .16, .12);
}

/* ---------------------------------------------------------------
   メインループ
   --------------------------------------------------------------- */
function step(){
  if (game.paused){ clearEdges(); return; }
  if (game.state === 'title'){
    updateTitle();
  } else if (game.state === 'play'){
    updatePlay();
    if (tap) tap = null;
  } else if (game.state === 'clear'){
    game.t++; game.sub++;
    if (game.sub === 1) stageClearScore();
    updateParts();
    if (cam.shake > 0) cam.shake *= 0.88;
    if (cam.flash > 0) cam.flash *= 0.88;
    if (game.sub > 90 && (pressed.claw || pressed.beam || pressed.tail || tap)){
      tap = null;
      if (game.stage + 1 < STAGES.length) startStage(game.stage+1);
      else { game.state = 'allclear'; game.sub = 0; AU.stopBGM(); AU.clear(); saveProgress(); }
    }
  } else if (game.state === 'gameover'){
    game.t++; game.sub++;
    updateParts();
    if (cam.shake > 0) cam.shake *= 0.88;
    if (game.score > game.hi) game.hi = game.score;
    if (game.sub === 2) saveProgress();
    if (game.sub > 70){
      if (pressed.claw || pressed.beam || tap){
        tap = null; game.score = 0; startStage(game.stage);
      } else if (pressed.tail){
        game.state = 'title'; game.sub = 0; game.menu = 0;
        game.menuStage = game.unlocked; AU.startBGM('title');
      }
    }
  } else if (game.state === 'allclear'){
    game.t++; game.sub++;
    if (game.sub > 210 && (pressed.claw || pressed.beam || pressed.tail || tap)){
      tap = null; game.state = 'title'; game.sub = 0; game.menu = 0;
      game.menuStage = game.unlocked; AU.startBGM('title');
    }
  }
  clearEdges();
}
function clearEdges(){ for (const k in pressed) delete pressed[k]; }

function render(){
  ctx.clearRect(0,0,W,H);
  if (game.state === 'title'){
    drawTitle();
  } else {
    drawScene();
    drawHUD();
    drawBanner();
    if (game.state === 'clear') drawClear();
    else if (game.state === 'gameover') drawGameOver();
    else if (game.state === 'allclear') drawAllClear();
    if (game.paused) drawPause();
  }
}

let lastT = performance.now(), acc = 0;
function frame(now){
  requestAnimationFrame(frame);
  let dt = now - lastT; lastT = now;
  if (dt > 120) dt = 120;
  acc += dt;
  let guard = 0;
  while (acc >= 16.6667 && guard < 5){ step(); acc -= 16.6667; guard++; }
  if (guard >= 5) acc = 0;
  render();
}
